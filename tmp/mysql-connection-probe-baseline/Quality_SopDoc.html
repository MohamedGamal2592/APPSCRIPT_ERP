   A shared PARTIAL, included by Company_ValleyFoods_QualitySops (SOP lifecycle)

   things that must not drift apart between authoring, read-only preview and the

     VFDOC.coverHtml    the cover page: prepared/reviewed rows, review schedule,

     VFDOC.paginate     measured soft pagination over ONE continuous editable
                        flow. Blocks that would straddle a page boundary are
                        pushed to the next page; the canonical document is never
                        split into several edit hosts, so selection, caret and
                        undo survive pagination.
     VFDOC.history      bound undo/redo across typing, formatting, paste, table
                        changes and template application
     VFDOC.sanitize     the client CLEANING pass. NOT the security boundary: the
                        server validates the same content against its own
                        allowlist before storage and again before export.

   Deliberately absent (not present-and-broken): coauthoring, track changes,
   comments, DOCX import/export, cryptographic signing, template designer.
   ═══════════════════════════════════════════════════════════════════════════ */

      'الغرض', 'مجال التطبيق', 'المسؤوليات', 'المتطلبات السابقة', 'المواد والمعدات',
      'خطوات الإجراء', 'النتائج المتوقعة ونقاط التحقق', 'السجلات',

    ],
    labels: {
      docNumber: 'رقم الوثيقة', page: 'صفحة', issueDate: 'تاريخ الإصدار', version: 'رقم الإصدار',
      copyNumber: 'رقم النسخة', stamp: 'ختم الوثيقة',
      prepared: 'إعداد', reviewed: 'مراجعة', name: 'الاسم', position: 'الوظيفة', signature: 'التوقيع / التاريخ',
      reviewNo: 'م', plannedReview: 'تاريخ المراجعة المخطط', actualReview: 'تاريخ المراجعة الفعلي',
      reviewer: 'القائم بالمراجعة', reviewResult: 'نتيجة المراجعة',
      issueDateField: 'تاريخ الإصدار', validDate: 'تاريخ السريان',
      changeHistory: 'جدول وثيقة التعديل',
      changePage: 'رقم الصفحة', changeDate: 'التاريخ', changeRevision: 'رقم التعديل / الإصدار', changeSummary: 'ملخص التعديل',
      pending: '—'
    },
    coverReviewRows: 2,

    pxPerMm: 3.7795275591
  };

  function esc(s) {
    var map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return map[c]; });

  function defaultMeta(categoryLabel, tpl) {
    tpl = tpl || TEMPLATE;

      template_version: tpl.version || TEMPLATE.version,
      doc_type_label: String(categoryLabel || ''),
      prepared_by: { name: '', position: '' },
      prepared_date: '',
      reviewed_by: reviewed,
      review_schedule: schedule,
      issue_date: '',
      valid_date: '',
      copy_number: '',
      revision_rows: []
    };
  }

  function parseMeta(raw) {
    if (raw && typeof raw === 'object') return raw;
    var s = String(raw == null ? '' : raw).trim();
    if (!s) return {};
    try { var p = JSON.parse(s); return (p && typeof p === 'object') ? p : {}; } catch (e) { return {}; }
  }

  /* ── client cleaning pass (usability; the server is the trust boundary) ─── */
  var BAD_TAGS = { SCRIPT: 1, STYLE: 1, IFRAME: 1, OBJECT: 1, EMBED: 1, LINK: 1, META: 1, BASE: 1, FORM: 1, INPUT: 1, BUTTON: 1, SELECT: 1, TEXTAREA: 1, SVG: 1, MATH: 1, NOSCRIPT: 1, TEMPLATE: 1, APPLET: 1, FRAME: 1, FRAMESET: 1 };

  function sanitize(html) {
    var host = document.createElement('div');
    host.innerHTML = String(html == null ? '' : html);
    var nodes;
    try { nodes = host.querySelectorAll('*'); } catch (e) { nodes = []; }
    for (var i = nodes.length - 1; i >= 0; i--) {
      var el = nodes[i];
      if (BAD_TAGS[String(el.tagName || '').toUpperCase()]) {
        if (el.parentNode) el.parentNode.removeChild(el);
        continue;
      }
      var attrs = (el.attributes && el.attributes.length != null) ? el.attributes : [];
      for (var j = attrs.length - 1; j >= 0; j--) {
        var name = String(attrs[j].name || '');
        var value = String(attrs[j].value || '');
        if (/^on/i.test(name)) el.removeAttribute(name);
        else if (/^(href|src|xlink:href)$/i.test(name) && /^\s*(javascript|vbscript|data):/i.test(value)) el.removeAttribute(name);
        else if (name === 'style' && /expression\s*\(|url\s*\(|@import|behavior\s*:|-moz-binding/i.test(value)) el.removeAttribute(name);
        else if (name === 'target' && value !== '_blank') el.removeAttribute(name);
      }
      if (String(el.tagName || '').toUpperCase() === 'A' && el.getAttribute && el.getAttribute('href')) {
        el.setAttribute('rel', 'noopener noreferrer');
      }
    }
    return host.innerHTML;
  }

  /* Guidance placeholders carry data-vfs-ph and are NOT submitted content. */
  function substantive(html) {
    var tmp = document.createElement('div');
    tmp.innerHTML = String(html == null ? '' : html);
    var ph = [];
    try { ph = tmp.querySelectorAll('[data-vfs-ph]'); } catch (e) { ph = []; }
    for (var i = 0; i < ph.length; i++) { if (ph[i].parentNode) ph[i].parentNode.removeChild(ph[i]); }
    /* Section labels alone are the scaffold, not submitted operating content. */
    var headings = [];
    try { headings = tmp.querySelectorAll('h1,h2,h3,h4,h5,h6'); } catch (eHead) { headings = []; }
    for (var h = 0; h < headings.length; h++) { if (headings[h].parentNode) headings[h].parentNode.removeChild(headings[h]); }
    var cells = [];
    try { cells = tmp.querySelectorAll('td,th'); } catch (e2) { cells = []; }
    for (var k = 0; k < cells.length; k++) {
      if (String(cells[k].textContent || '').replace(/[\s\u00A0]+/g, '') !== '') return true;
    }
    return String(tmp.textContent || '').replace(/[\s\u00A0]+/g, '') !== '';
  }

  function countWords(text) {
    var t = String(text == null ? '' : text).replace(/[\s\u00A0]+/g, ' ').trim();
    if (!t) return 0;
    return t.split(' ').length;
  }

  /* Per-heading writing instructions. They are guidance placeholders

  var BODY_TEMPLATES = {
    POL: ['الغرض', 'مجال التطبيق', 'بيانات السياسة', 'المسؤوليات', 'الاستثناءات', 'المتابعة والقياس', 'السجلات', 'المراجع'],

    WI: ['المهمة', 'خطوات العمل', 'التحذيرات والاحتياطات', 'الوسائل البصرية', 'معايير القبول'],

  };

    'السجلات': 'اذكر السجلات الناتجة ومكان حفظها والمسؤول عنها.',
    'المتطلبات السابقة': 'أدخل المتطلبات التي اعتمدها مالك العملية.',

    'التعامل مع الانحرافات': 'اشرح طريقة الإبلاغ والاحتواء والتوثيق المعتمدة عند الانحراف.',
    'التصعيد': 'حدّد متى ولمن يتم التصعيد وفق الإجراء المعتمد.',
    'المهمة': 'اكتب اسم المهمة المحددة ونقطة بدايتها ونهايتها.',
    'خطوات العمل': 'أدرج خطوات المهمة بالترتيب وبعبارات قابلة للتنفيذ.',
    'التحذيرات والاحتياطات': 'أدرج التحذيرات المعتمدة ووسائل الوقاية المطلوبة.',
    'الوسائل البصرية': 'أضف صورة أو مخططاً معتمداً أو اذكر مرجعه.',

    'تعليمات التسجيل': 'اشرح طريقة تسجيل البيانات ومصدرها.',
    'الدور المسؤول': 'حدّد الدور المسؤول عن الاستكمال والمراجعة.',
    'الحفظ والمرجع': 'أدخل مرجع الوثيقة ومكان الحفظ ومدة الاحتفاظ المعتمدة.',
    'التعريفات': 'اشرح المصطلحات والاختصارات المستخدمة في الوثيقة.',
    'النماذج المستخدمة': 'اذكر النماذج والسجلات المرتبطة وأكوادها.',
    'الإجراءات': 'اكتب خطوات الإجراء بترتيب التنفيذ، وحدّد المسؤول عن كل خطوة.',
    'المراجع': 'أدرج الوثائق والمراجع ذات الصلة.',
    'الحفظ والتسجيل': 'حدّد مدة الحفظ ومكانه والمسؤول عنه.'
  };

  function bodyHeadingsFor(category) {
    var key = String(category || '').trim().toUpperCase();
    return (BODY_TEMPLATES[key] || TEMPLATE.bodyHeadings).slice();
  }

  function placeholderPara(heading) {
    var guide = BODY_GUIDE[String(heading || '').trim()] || 'اكتب محتوى هذا القسم.';
    return '<p dir="rtl" data-vfs-ph="1" class="vfs-placeholder">' + esc(guide) + '</p>';
  }

  function placeholderBody(headings) {
    if (!Array.isArray(headings)) headings = bodyHeadingsFor(headings);
    var out = '';
    (headings || TEMPLATE.bodyHeadings).forEach(function (h) {
      out += '<h2 dir="rtl">' + esc(h) + '</h2>' + placeholderPara(h);
    });
    return out;
  }

  /* ── the repeated frame: header table + footer, shared by every page ───── */
  function frameHtml(o) {
    var tpl = (o && o.template) || TEMPLATE;
    var L = tpl.labels || TEMPLATE.labels;
    var meta = parseMeta((o && o.meta) || {}) || {};
    var typeLabel = String((meta && meta.doc_type_label) || (o && o.docTypeLabel) || '');
    var titleAr = String((o && o.titleAr) || '');
    var titleEn = String((o && o.titleEn) || '');
    var code = String((o && o.code) || '');
    var versionDisplay = String((o && o.version) == null ? '' : o.version);
    while (versionDisplay.length < 3) versionDisplay = '0' + versionDisplay;
    var logoUrl = String((o && o.logoUrl) || '');
    var companyName = String((o && o.companyName) || '');
    var h = '<table class="vfs-hdr-table"><tr>';
    h += '<td style="width:' + tpl.header.metaPct + '%">' +
      '<table class="vfs-meta-grid">' +
        '<tr><td class="vfs-meta-key">' + L.docNumber + '</td><td><bdi dir="ltr">' + esc(code) + '</bdi></td></tr>' +
        '<tr><td class="vfs-meta-key">' + L.page + '</td><td>' + L.pending + '</td></tr>' +
        '<tr><td class="vfs-meta-key">' + L.issueDate + '</td><td>' + esc(meta.issue_date || '') + '</td></tr>' +
        '<tr><td class="vfs-meta-key">' + L.version + '</td><td><bdi dir="ltr">' + esc(versionDisplay) + '</bdi></td></tr>' +
      '</table></td>';
    h += '<td style="width:' + tpl.header.titlePct + '%" class="vfs-hdr-title">' +
      '<div><b>' + esc(typeLabel) + '</b></div><div><b>' + esc(titleAr) + '</b></div>' +
      (titleEn ? '<div dir="ltr" style="font-size:10pt;">' + esc(titleEn) + '</div>' : '') +
      '</td>';
    h += '<td style="width:' + tpl.header.logoPct + '%" class="vfs-hdr-logo">' +
      (logoUrl
        ? '<img src="' + esc(logoUrl) + '" alt="شعار الشركة" decoding="async">'
        : '<div style="font-weight:bold;">' + esc(companyName) + '</div>') +
      '</td>';
    h += '</tr></table>';
    return h;
  }

  function footerHtml(meta, tpl) {
    tpl = tpl || TEMPLATE;
    var L = tpl.labels || TEMPLATE.labels;
    meta = meta || {};
    return '<table class="vfs-grid"><tr>' +
      '<td style="width:50%;text-align:center;"><b>' + L.copyNumber + '</b><div class="vfs-stampbox"></div>' + esc(meta.copy_number || '') + '</td>' +
      '<td style="width:50%;text-align:center;"><b>' + L.stamp + '</b><div class="vfs-stampbox"></div></td>' +

  }

  /* ── cover (5.5): prepared/reviewed rows, review schedule, lower block ─── */
  function coverHtml(o) {
    var tpl = (o && o.template) || TEMPLATE;
    var L = tpl.labels || TEMPLATE.labels;
    var meta = parseMeta((o && o.meta) || {});
    var titleAr = String((o && o.titleAr) || '');
    var titleEn = String((o && o.titleEn) || '');
    var prepared = meta.prepared_by || {};
    var reviewed = Array.isArray(meta.reviewed_by) ? meta.reviewed_by : [];
    var h = '<div class="vfs-cover-title">' + esc(titleAr) + '</div>';
    if (titleEn) h += '<div class="vfs-cover-sub" dir="ltr">' + esc(titleEn) + '</div>';
    h += '<div class="vfs-spacer"></div>';
    h += '<table class="vfs-grid"><tr><th style="width:14%"></th><th>' + L.name + '</th><th>' + L.position + '</th><th>' + L.signature + '</th></tr>';
    h += '<tr><td>' + L.prepared + '</td><td>' + esc(prepared.name || '') + '</td><td>' + esc(prepared.position || '') + '</td><td></td></tr>';
    if (!reviewed.length) reviewed = [{}, {}];
    reviewed.forEach(function (r) {
      r = r || {};
      h += '<tr><td>' + L.reviewed + '</td><td>' + esc(r.name || '') + '</td><td>' + esc(r.position || '') + '</td><td></td></tr>';
    });
    h += '</table><div class="vfs-spacer"></div>';
    var schedule = Array.isArray(meta.review_schedule) ? meta.review_schedule.slice() : [];
    while (schedule.length < (tpl.coverReviewScheduleRows || 3)) schedule.push({});
    h += '<table class="vfs-grid"><tr><th style="width:8%">' + L.reviewNo + '</th><th>' + L.plannedReview + '</th><th>' + L.actualReview + '</th><th>' + L.reviewer + '</th><th>' + L.reviewResult + '</th></tr>';
    schedule.forEach(function (r, i) {
      r = r || {};
      h += '<tr><td style="text-align:center;">' + (i + 1) + '</td><td>' + esc(r.planned || '') + '</td><td>' + esc(r.actual || '') +
        '</td><td>' + esc(r.reviewer || '') + '</td><td>' + esc(r.result || '') + '</td></tr>';
    });
    h += '</table><div class="vfs-spacer"></div>';
    h += footerHtml(meta, tpl);
    return h;
  }

  /* The ONE logical change-history dataset, rendered once near the front. */
  function historyHtml(o) {
    var tpl = (o && o.template) || TEMPLATE;
    var L = tpl.labels || TEMPLATE.labels;
    var meta = parseMeta((o && o.meta) || {});
    var rows = Array.isArray(meta.revision_rows) ? meta.revision_rows : [];
    var h = '<div class="vfs-history-title">' + L.changeHistory + '</div><div class="vfs-spacer"></div>';
    h += '<table class="vfs-grid"><tr><th style="width:12%">' + L.changePage + '</th><th style="width:16%">' + L.changeDate +
      '</th><th style="width:16%">' + L.changeRevision + '</th><th>' + L.changeSummary + '</th></tr>';
    if (!rows.length) {
      h += '<tr><td colspan="4" style="text-align:center;">' + L.pending + '</td></tr>';
    } else {
      rows.forEach(function (r) {
        r = r || {};
        h += '<tr><td style="text-align:center;">' + esc(r.page || '') + '</td><td>' + esc(r.date || '') + '</td><td>' +
          esc(r.revision || '') + '</td><td>' + esc(r.summary || '') + '</td></tr>';
      });
    }
    return h + '</table>';
  }

  /* ── page layer: A4 backgrounds + repeated frame + honest page numbers ─── */
  function sheetLayerHtml(pageCount, o) {
    var n = Math.max(1, Number(pageCount) || 1);
    var out = '';
    var paperMm = Number((((o || {}).template || TEMPLATE).paper || {}).heightMm) || 297;
    var head = frameHtml(o || {});
    var foot = footerHtml((o && o.meta) || {}, (o && o.template) || TEMPLATE);
    for (var i = 0; i < n; i++) {
      out += '<div class="vfs-sheet" data-vfs-page="' + (i + 1) + '" style="top:' + (i * paperMm) + 'mm" aria-hidden="true">' +
        '<div class="vfs-sheet-rules"></div>' +
        '<div class="vfs-sheet-zone vfs-sheet-head">' + head + '</div>' +
        '<div class="vfs-sheet-zone vfs-sheet-foot">' + foot + '</div>' +
        '<div class="vfs-pagenum">صفحة ' + (i + 1) + ' من ' + n + '</div>' +
      '</div>';
    }
    return out;
  }

  /* ── measured soft pagination ───────────────────────────────────────────
     ONE pass from a clean state:
       1. reset every previously applied push so measurement is not fed its own
          output (that is what would cause a pagination loop),
       2. measure each top-level block,
       3. push a block that would cross a page boundary down to the next page.
     Explicit page breaks always start a new page.
     Returns the real page count.
     ─────────────────────────────────────────────────────────────────────── */
  function paginate(flow, opts) {
    opts = opts || {};
    var tpl = opts.template || TEMPLATE;
    var paperMm = (tpl.paper && tpl.paper.heightMm) || 297;
    var topMm = opts.topMm || 52;      /* flow padding-top in mm  */
    var bottomMm = opts.bottomMm || 30;/* flow padding-bottom in mm */
    var blocks = [];
    var kids = (flow && flow.children) ? flow.children : [];
    var i;
    for (i = 0; i < kids.length; i++) {
      var el = kids[i];
      if (!el) continue;
      if (el.getAttribute && el.getAttribute('data-vfs-push') !== null) {
        el.style.marginTop = (el.getAttribute('data-vfs-base-margin') || '');
        el.removeAttribute('data-vfs-push');
      }
      if (el.getAttribute && el.getAttribute('data-vfs-base-margin') === null) {
        el.setAttribute('data-vfs-base-margin', (el.style && el.style.marginTop) || '');
      }
      blocks.push(el);
    }
    if (!blocks.length) return 1;

    var pxPerMm = 0;
    try {
      /* offsetWidth ignores the editor's view-only zoom transform. */
      if (flow.offsetWidth) pxPerMm = flow.offsetWidth / 210;
      var rect = flow.getBoundingClientRect ? flow.getBoundingClientRect() : null;
      if (!pxPerMm && rect && rect.width) pxPerMm = rect.width / 210;
    } catch (e) { pxPerMm = 0; }
    /* No layout information (headless harness, hidden container): report one
       page rather than inventing boundaries. */
    if (!pxPerMm) return 1;

    var paperHeight = paperMm * pxPerMm;
    var topInset = topMm * pxPerMm;
    var bottomInset = bottomMm * pxPerMm;
    var pageStep = paperHeight + (Number(opts.pageGapPx) || 0);
    var contentHeight = paperHeight - topInset - bottomInset;
    if (contentHeight <= 0 || pageStep <= 0) return 1;

    var page = 0;
    var maxPage = 0;
    for (i = 0; i < blocks.length; i++) {
      var node = blocks[i];
      var top = 0, height = 0;
      try { top = node.offsetTop || 0; height = node.offsetHeight || 0; } catch (e2) { continue; }
      if (!height) continue;
      var isBreak = false;
      try { isBreak = !!(node.classList && node.classList.contains('vfs-pagebreak')); } catch (eBreak) {}
      if (isBreak) {
        page = Math.max(page, Math.max(0, Math.floor((top - topInset) / pageStep))) + 1;
        maxPage = Math.max(maxPage, page);
        continue;
      }

      var naturalPage = Math.max(0, Math.floor((top - topInset) / pageStep));
      page = Math.max(page, naturalPage);
      var pageTop = page * pageStep + topInset;
      var pageBottom = page * pageStep + paperHeight - bottomInset;
      var desired = 0;
      if (top < pageTop) {
        desired = pageTop - top;
      } else if (top + height > pageBottom && top > pageTop && height <= contentHeight) {
        page++;
        pageTop = page * pageStep + topInset;
        desired = pageTop - top;
      }
      if (desired > 0 && node.style) {
        var baseMargin = (node.getAttribute && node.getAttribute('data-vfs-base-margin')) || '';
        var baseComputed = 0;
        try {
          var computed = window.getComputedStyle ? window.getComputedStyle(node) : null;
          baseComputed = computed ? (parseFloat(computed.marginTop) || 0) : (parseFloat(baseMargin) || 0);
        } catch (eMargin) { baseComputed = parseFloat(baseMargin) || 0; }
        node.setAttribute('data-vfs-push', '1');
        node.style.marginTop = 'calc(' + baseComputed + 'px + ' + Math.ceil(desired) + 'px)';
      }
      maxPage = Math.max(maxPage, page, Math.max(0, Math.floor((top + height - topInset) / pageStep)));
    }
    return Math.max(1, maxPage + 1);
  }

  /* ── bound undo/redo over ONE flow, coherent across every operation ────── */
  function makeHistory(flow, opts) {
    opts = opts || {};
    var limit = opts.limit || 100;
    var coalesceMs = opts.coalesceMs || 800;
    var undoStack = [], redoStack = [], lastAt = 0;

    function caretOffset() {
      try {
        var sel = window.getSelection ? window.getSelection() : null;
        if (!sel || !sel.rangeCount || !flow) return null;
        var r = sel.getRangeAt(0);
        if (flow.contains && !flow.contains(r.startContainer)) return null;
        var pre = r.cloneRange();
        pre.selectNodeContents(flow);
        pre.setEnd(r.startContainer, r.startOffset);
        return String(pre.toString()).length;
      } catch (e) { return null; }
    }
    function restoreCaret(offset) {
      if (offset === null || offset === undefined || !flow) return;
      try {
        var walker = document.createTreeWalker(flow, NodeFilter.SHOW_TEXT, null);
        var remaining = offset, node = walker.nextNode();
        while (node) {
          var len = String(node.nodeValue || '').length;
          if (remaining <= len) {
            var r = document.createRange();
            r.setStart(node, remaining); r.collapse(true);
            var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
            return;
          }
          remaining -= len; node = walker.nextNode();
        }
      } catch (e) {}
    }
    function push(force) {
      if (!flow) return false;
      var now = Date.now();
      if (!force && undoStack.length && now - lastAt < coalesceMs) return false;
      var html = flow.innerHTML;
      if (undoStack.length && undoStack[undoStack.length - 1].html === html) return false;
      undoStack.push({ html: html, caret: caretOffset() });
      if (undoStack.length > limit) undoStack.shift();
      redoStack.length = 0;
      lastAt = now;
      return true;
    }
    function undo() {
      if (!flow || !undoStack.length) return false;
      redoStack.push({ html: flow.innerHTML, caret: caretOffset() });
      var prev = undoStack.pop();
      flow.innerHTML = prev.html;
      restoreCaret(prev.caret);
      return true;
    }
    function redo() {
      if (!flow || !redoStack.length) return false;
      undoStack.push({ html: flow.innerHTML, caret: caretOffset() });
      var next = redoStack.pop();
      flow.innerHTML = next.html;
      restoreCaret(next.caret);
      return true;
    }
    return {
      push: push, undo: undo, redo: redo,
      canUndo: function () { return undoStack.length > 0; },
      canRedo: function () { return redoStack.length > 0; },
      depth: function () { return undoStack.length; }
    };
  }

  /* ── table helpers (used by the toolbar) ──────────────────────────────── */
  function tableHtml(rows, cols) {
    var h = '<table dir="rtl"><tbody>';
    for (var r = 0; r < rows; r++) {
      h += '<tr>';
      for (var c = 0; c < cols; c++) h += '<' + (r === 0 ? 'th' : 'td') + '></' + (r === 0 ? 'th' : 'td') + '>';
      h += '</tr>';
    }
    return h + '</tbody></table><p><br></p>';
  }

  return {
    TEMPLATE: TEMPLATE,
    esc: esc,
    defaultMeta: defaultMeta,
    parseMeta: parseMeta,
    sanitize: sanitize,
    substantive: substantive,
    countWords: countWords,
    placeholderBody: placeholderBody,
    placeholderPara: placeholderPara,
    bodyHeadingsFor: bodyHeadingsFor,
    frameHtml: frameHtml,
    footerHtml: footerHtml,
    coverHtml: coverHtml,
    historyHtml: historyHtml,
    sheetLayerHtml: sheetLayerHtml,
    paginate: paginate,
    makeHistory: makeHistory,
    tableHtml: tableHtml
  };
})();
</script>
