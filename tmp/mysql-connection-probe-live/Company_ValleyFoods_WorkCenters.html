<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Valley Foods — خطوط الإنتاج</title>
  <?!= include('CSS_Tokens'); ?>
  <?!= include('UI_Components'); ?>
  <?!= include('Client_Helpers'); ?>
  <?!= include('Company_ValleyFoods_Nav'); ?>
  <?!= getCompanyThemeCSS_('9940659bd83035d7') ?>
</head>
<body>
  <div id="vf-root"></div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var SESSION_TOKEN = params.get('sessionToken') || (API.getSession() || {}).token || '';
    var scriptUrl = window.scriptUrl || '/';
    var IS_SUPER_ADMIN = <?!= user && user.isSuperAdmin ? 'true' : 'false' ?>;
    var COMPANY_LOGO_URL = '<?!= getCompanyLogoUrl_('9940659bd83035d7') ?>';
    var COMPANY_PAGES = <?!= companyPages ?>;
    var CURRENT_ACTION = '<?!= currentAction ?>';
    var USER_PAGES = <?!= user && user.isSuperAdmin ? 'null' : JSON.stringify((user && user.authorizedPages) || {}) ?>;
    var CAN_WRITE = UIC.canAdd_(); var CAN_FULL = UIC.canFull_();

    function companyCall(moduleAction, data) {
      return API.call('company_action', {
        target_system: '9940659bd83035d7',
        module_action: moduleAction,
        data: data || {}
      }, SESSION_TOKEN);
    }
    function esc(v) {
      /* [UI-2.8 / U-36] Delegates to the shared formatter. This body used to
         carry its own replace-chain behind a `typeof FMT !== 'undefined'`
         guard, but Client_Helpers.html defines FMT in <head> before any page
         script runs, so that fallback was unreachable and the duplicate was
         pure drift risk. Output is identical for every input — proved in
         tools/verify/ui2_formatters.js. */
      return FMT.escape(v);
    }
    function num0(v) { var n = Number(v); return isNaN(n) ? 0 : n; }
  </script>

  <script>
  (function () {
    var RECORDS = [];

    function renderApp() {
      UIC.appShell('vf-root', {
        companyLogoUrl: COMPANY_LOGO_URL,
        companyLogoHref: scriptUrl + '?action=vf_dashboard&sessionToken=' + SESSION_TOKEN,
        companyLogoTitle: 'Valley Foods',
        breadcrumb: 'Valley Foods / الانتاج / خطوط الإنتاج',
        contentId: 'vf-wc-content',
        menuGroups: (window.VALLEYFOODS_MENU || [])
      });
      document.getElementById('vf-wc-content').innerHTML =
        '<div class="vf-card"><div class="vf-card-header"><h3>خطوط الإنتاج (Work Centers)</h3>' +
          (CAN_WRITE ? '<button class="btn btn-primary" onclick="WC_PAGE.openAdd()">+ إضافة خط إنتاج</button>' : '') +
        '</div><div class="vf-card-body">' +
          '<div id="wc-table"><p class="vf-text-muted">جاري التحميل...</p></div>' +
        '</div></div>';
      load();
    }

    /* quiet: refresh in the background with no blocking overlay, for a
       user who has already seen the change and must not be interrupted
       to confirm it. */
    function load(quiet) {
      if (!quiet) UIC.readSkeleton('wc-table');
      companyCall('get_valley_work_centers')
        .then(function (r) { RECORDS = r.records || []; renderTable(); try{schedulePrefetch();}catch(e){}; })
        .catch(function (e) { UIC.toast((e && e.message) || 'خطأ', 'error'); })
        .finally(function () { if (!quiet) UI.hideSpinner(); });
    }

    function renderTable() {
      var c = document.getElementById('wc-table');
      if (!c) return;
      var rows = RECORDS.map(function (r) {
        /* Tier A: code is server-assigned, so a __pending row shows «—» and
           offers no actions — تعديل would name a unique_id the server has
           never seen. */
        var pending = !!r.__pending;
        var active = !(r.is_active === false || String(r.is_active).toLowerCase() === 'false');
        var actions = pending ? '…' : (IS_SUPER_ADMIN ? UIC.actionBtns([{ label: 'تعديل', onclick: 'WC_PAGE.openEdit(\'' + esc(r.unique_id) + '\')' }]) : '');
        return [pending ? '—' : esc(r.code || r.id), esc(r.name_en), esc(r.name_ar), esc(r.work_center_type || '-'), num0(r.work_center_cost_per_hour), num0(r.capacity_per_hour_kg), esc(r.location || '-'), UIC.statusPill(active ? 'مفعل' : 'متوقف', active ? 'success' : 'neutral'), actions];
      });
      c.innerHTML = UIC.dataTable('wc-tbl', {
        headers: ['الكود', 'الاسم (EN)', 'الاسم (AR)', 'النوع', 'تكلفة/ساعة', 'السعة (كغ/ساعة)', 'الموقع', 'الحالة', ''],
        rows: rows, emptyText: 'لا توجد خطوط إنتاج'
      });
      UIC.initTableSort('wc-tbl');
    }

    function openAdd() { openModal(null); }
    function openEdit(uid) {
      var row = null;
      RECORDS.forEach(function (r) { if (String(r.unique_id) === uid) row = r; });
      /* Row-edit repair (5.5): a missing record reloads with a clear error —
         it must never fall through into the Add form. */
      if (!row) { UIC.toast('السجل غير موجود — تم تحديث القائمة', 'error'); load(true); return; }
      openModal(row);
    }

    function openModal(row) {
      var isEdit = !!row;
      var body = '<form id="wc-form">' +
        '<input type="hidden" id="f-uid" value="' + esc(row ? row.unique_id : '') + '">' +
        '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;">' +
          UIC.field({ key: 'f-name-en', label: 'الاسم بالإنجليزية', type: 'text', required: true, value: row ? (row.name_en || '') : '' }) +
          UIC.field({ key: 'f-name-ar', label: 'الاسم بالعربية', type: 'text', value: row ? (row.name_ar || '') : '' }) +
          UIC.field({ key: 'f-type', label: 'نوع خط الإنتاج', type: 'text', value: row ? (row.work_center_type || '') : '' }) +
          UIC.field({ key: 'f-cost', label: 'تكلفة الساعة (ر.س)', type: 'number', min: '0', step: '0.01', value: row ? num0(row.work_center_cost_per_hour) : 0 }) +
          UIC.field({ key: 'f-capacity', label: 'السعة (كغ/ساعة)', type: 'number', min: '0', step: '0.01', value: row ? num0(row.capacity_per_hour_kg) : 0 }) +
          UIC.field({ key: 'f-location', label: 'الموقع', type: 'text', value: row ? (row.location || '') : '' }) +
        '</div>' +
        UIC.field({ key: 'f-desc', label: 'الوصف', type: 'textarea', value: row ? (row.description || '') : '' }) +
        UIC.field({ key: 'f-notes', label: 'ملاحظات', type: 'textarea', value: row ? (row.notes || '') : '' }) +
        '<label style="display:flex;align-items:center;gap:8px;margin-top:12px;">' +
          '<input type="checkbox" id="f-active"' + (!row || !(row.is_active === false || String(row.is_active).toLowerCase() === 'false') ? ' checked' : '') + '> مفعل</label>' +
      '</form>';
      UIC.openModal('wc-modal', { title: isEdit ? 'تعديل خط إنتاج' : 'إضافة خط إنتاج جديد', body: body });
      var m = document.getElementById('wc-modal');
      if (m) { var b = m.querySelector('.modal'); if (b) b.style.maxWidth = '700px'; }
      var foot = document.createElement('div');
      foot.style.cssText = 'display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--border-color, #e5e7eb);';
      foot.innerHTML = '<button class="btn btn-outline" onclick="UIC.closeModal(\'wc-modal\')">إلغاء</button>' +
        '<button class="btn btn-primary" onclick="UI.submitOnce(this, WC_PAGE.save)">💾 حفظ</button>';
      m.querySelector('.modal').appendChild(foot);
    }

    function save() {
      if (!UIC.validateForm('wc-form')) return;
      var uid = (document.getElementById('f-uid') || {}).value || '';
      var payload = {
        unique_id: uid,
        name_en: (document.getElementById('f-name-en') || {}).value || '',
        name_ar: (document.getElementById('f-name-ar') || {}).value || '',
        work_center_type: (document.getElementById('f-type') || {}).value || '',
        work_center_cost_per_hour: (document.getElementById('f-cost') || {}).value || 0,
        capacity_per_hour_kg: (document.getElementById('f-capacity') || {}).value || 0,
        location: (document.getElementById('f-location') || {}).value || '',
        description: (document.getElementById('f-desc') || {}).value || '',
        notes: (document.getElementById('f-notes') || {}).value || '',
        is_active: (document.getElementById('f-active') || {}).checked
      };
      /* Tier A: the row is on screen before the request returns. code and
         unique_id are server-assigned, so the draft never invents them —
         recordOf fills unique_id from the reply on add, and the payload uid on
         edit. queueable:false: I1 is unproven for save_valley_work_center, so
         a transport failure rolls back loudly instead of queueing. */
      var isEdit = !!uid;
      var draft = Object.assign({}, payload);
      UIC.Live.save({
        call: companyCall,
        action: 'save_valley_work_center',
        data: payload,
        list: RECORDS,
        key: 'unique_id',
        draft: draft,
        render: renderTable,
        modal: 'wc-modal',
        message: 'تم الحفظ',
        queueable: false,
        reload: function () { load(true); },
        recordOf: function (resp) {
          var rec = Object.assign({}, draft);
          if (resp && resp.unique_id) rec.unique_id = resp.unique_id;
          else if (!isEdit) return null;
          return rec;
        }
      }).catch(function () { /* UIC.Live has toasted and rolled back */ });
    }

    window.WC_PAGE = { openAdd: openAdd, openEdit: openEdit, save: save };
    /* Another device's change to this page arrives on its own. The poll
       reads timestamps from cache, never a spreadsheet, and stands down
       while the tab is hidden or a save is in flight. */
    document.addEventListener('DOMContentLoaded', function () {
      UIC.Live.watchPage({
        call: companyCall,
        page: 'vf_workcenters',
        onChange: function () { UIC.Live.arrive(function () { load(true); }); }
      });
    });

    document.addEventListener('DOMContentLoaded', renderApp);
  })();
  </script>
</body>
</html>
