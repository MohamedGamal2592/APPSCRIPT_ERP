<body>
<div id="tc-fr-root" dir="rtl"></div>
<script>
  var params = new URLSearchParams(window.location.search);
  var SESSION_TOKEN = params.get('sessionToken') || (API.getSession() || {}).token || '';
  var scriptUrl = window.scriptUrl || '/';
  var COMPANY_LOGO_URL = '<?!= getCompanyLogoUrl_('3fe1b5cb67b7223e') ?>';
  var COMPANY_PAGES = <?!= companyPages ?>;
  var CURRENT_ACTION = '<?!= currentAction ?>';
  var IS_SUPER_ADMIN = <?!= user && user.isSuperAdmin ? 'true' : 'false' ?>;
  var USER_PAGES = <?!= user && user.isSuperAdmin ? 'null' : JSON.stringify((user && user.authorizedPages) || {}) ?>;
  var _requestSeq = 0;
  var _frMeasurementEntries = [];
  var _frReportStartedAt = 0, _frReportVisibleMs = null, _frReportCompleteMs = null, _frReportRenderMs = 0;
  var _productionSeq = 0, _productionRange = null, _productionOffset = 0, _productionLimit = 30;
  var _usedMaterialsSeq = 0, _usedMaterialsOffset = 0, _usedMaterialsLimit = 30;
  var _productionSnapSeq = 0, _productionPages = {}, _productionSnapAt = 0;
  var _usedMaterialsSnapSeq = 0, _usedMaterialsPages = {}, _usedMaterialsSnapAt = 0;
  var FR_SNAPSHOT_TTL_MS = 120000;
  function frSnapshotValid(snapAt) { return snapAt && (Date.now() - Number(snapAt) < FR_SNAPSHOT_TTL_MS); }
  function frProductionCacheKey(offset) { return _productionRange ? _productionRange.from + '|' + _productionRange.to + '|' + _productionSnapSeq + '|' + offset : ''; }
  function frUsedMaterialsCacheKey(offset) { return _productionRange ? _productionRange.from + '|' + _productionRange.to + '|' + _usedMaterialsSnapSeq + '|' + offset : ''; }

  function dateString(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function defaultRange() {
    var today = new Date();
    return { from: dateString(new Date(today.getFullYear(), 0, 1)), to: dateString(today) };
  }
  function shiftYear(iso, delta) {
    var p = iso.split('-').map(Number), year = p[0] + delta, month = p[1];
    var day = Math.min(p[2], new Date(year, month, 0).getDate());
    return year + '-' + String(month).padStart(2, '0') + '-' + String(day).padStart(2, '0');
  }
  function companyCall(moduleAction, data) {
    return API.call('company_action', {
      target_system: '3fe1b5cb67b7223e', module_action: moduleAction, data: data
    }, SESSION_TOKEN);
  }
  function frNow_() { return IS_SUPER_ADMIN ? (window.performance && performance.now ? performance.now() : Date.now()) : 0; }
  function frMs_(value) { return value == null || !Number.isFinite(Number(value)) ? '—' : Math.round(Number(value)) + ' ms'; }
  function frJsonBytes_(value) {
    try { return new Blob([JSON.stringify(value)]).size; }
    catch (e) { try { return unescape(encodeURIComponent(JSON.stringify(value))).length; } catch (ignored) { return null; } }
  }
  function frRenderMeasurement_() {
    if (!IS_SUPER_ADMIN) return;
    var el = document.getElementById('fr-measurement-text');
    if (!el) return;
    var summary = _frReportVisibleMs == null ? 'في انتظار أول ظهور لبيانات التقرير.' :
      'التقرير الأخير — أول ظهور: ' + frMs_(_frReportVisibleMs) +
      ' | اكتمال التقرير: ' + frMs_(_frReportCompleteMs) +
      ' | مجموع رسم الأقسام: ' + frMs_(_frReportRenderMs);
    var lines = _frMeasurementEntries.map(function (entry) {
      var parts = [entry.label, entry.status, 'RPC: ' + frMs_(entry.rpc_ms)];
      if (entry.rows != null) parts.push('الصفوف: ' + entry.rows);
      if (entry.columns != null) parts.push('الأعمدة: ' + entry.columns);
      if (entry.payload_bytes != null) parts.push('البيانات: ' + entry.payload_bytes + ' bytes');
      if (entry.client_render_ms != null) parts.push('الرسم في المتصفح: ' + frMs_(entry.client_render_ms));
      if (entry.server) {
        var db = entry.server;
        parts.push('MySQL: ' + frMs_(db.elapsed_ms) + ' | اتصال: ' + frMs_(db.connection_ms) +
          ' | SQL: ' + frMs_(db.sql_ms) + ' | قراءة JDBC: ' + frMs_(db.read_ms) +
          ' | JSON: ' + frMs_(db.json_parse_ms) + ' | كاش: ' +
          (db.cache_hit === true ? 'نعم' : (db.cache_hit === false ? 'لا' : '—')) +
          ' | صفوف JDBC: ' + (db.rows_read == null ? '—' : db.rows_read));
      } else if (entry.status === 'نجح') parts.push('مراحل MySQL: غير متاحة');
      if (entry.error) parts.push('الخطأ: ' + entry.error);
      return parts.join(' | ');
    });
    el.textContent = [summary].concat(lines).join('\n');
  }
  function frRecordMeasurementCall_(label, action, startedAt, result, error) {
    if (!IS_SUPER_ADMIN) return;
    var rows = result && (Array.isArray(result.rows) ? result.rows : (Array.isArray(result.products) ? result.products : null));
    _frMeasurementEntries.push({
      label: label,
      status: error ? 'فشل' : 'نجح',
      action: action,
      rpc_ms: frNow_() - startedAt,
      rows: rows ? rows.length : null,
      columns: result && Array.isArray(result.columns) ? result.columns.length : null,
      payload_bytes: result ? frJsonBytes_(result) : null,
      server: result && result._mysql ? result._mysql : null,
      error: error ? String((error && error.message) || error) : ''
    });
    if (_frMeasurementEntries.length > 16) _frMeasurementEntries.shift();
    frRenderMeasurement_();
  }
  function frMeasuredCall_(label, action, data) {
    var startedAt = IS_SUPER_ADMIN ? frNow_() : 0;
    return companyCall(action, data).then(function (result) {
      frRecordMeasurementCall_(label, action, startedAt, result, null);
      return result;
    }, function (error) {
      frRecordMeasurementCall_(label, action, startedAt, null, error);
      throw error;
    });
  }
  function runUsedMaterialsExplain_() {
    if (!IS_SUPER_ADMIN) return;
    var button = document.getElementById('fr-explain-materials');
    var error = document.getElementById('fr-explain-materials-error');
    var output = document.getElementById('fr-explain-materials-plan');
    var filters;
    try { filters = readFilters(); } catch (e) { error.textContent = e.message; return; }
    button.disabled = true;
    error.textContent = '';
    output.textContent = 'جاري طلب خطة الاستعلام من MySQL…';
    frMeasuredCall_('خطة SQL — المواد المستخدمة', 'get_financial_used_materials_plan', {
      from: filters.current.from, to: filters.current.to
    }).then(function (result) {
      var raw = String(result && result.plan_json || '');
      try { output.textContent = JSON.stringify(JSON.parse(raw), null, 2); }
      catch (parseError) { output.textContent = raw || 'لم تُرجع MySQL خطة للاستعلام.'; }
    }).catch(function (e) {
      output.textContent = '';
      error.textContent = 'تعذر قراءة خطة الاستعلام: ' + ((e && e.message) || 'خطأ في الطلب');
    }).finally(function () { button.disabled = false; });
  }
  function frRecordClientRender_(label, startedAt) {
    if (!IS_SUPER_ADMIN) return;
    _frMeasurementEntries.push({ label: label, status: 'نجح', rpc_ms: null,
      client_render_ms: frNow_() - startedAt });
    if (_frMeasurementEntries.length > 16) _frMeasurementEntries.shift();
    frRenderMeasurement_();
  }
  function frReportLabel_(period, key) {
    var names = { sales: 'المبيعات', income: 'الإيرادات الأخرى', expenses: 'المصروفات',
      production: 'الإنتاج', usedMaterials: 'المواد المستخدمة' };
    return (names[key] || key) + ' — ' + (period === 'current' ? 'الفترة الحالية' : 'فترة المقارنة');
  }
  function frReportHasVisibleData_(state) {
    return !!(state.current.sales || state.comparison.sales || state.current.income || state.comparison.income ||
      state.current.expenses || state.comparison.expenses || state.current.production || state.current.usedMaterials);
  }
  function field(id, label, value) {
    return '<div class="form-field"><label class="form-label" for="' + id + '">' + label + '</label>' +
      '<input class="input" type="date" id="' + id + '" value="' + FMT.escape(value) + '" required></div>';
  }
  function metric(label, currentId, comparisonId, extra) {
    return '<section class="fr-metric ' + (extra || '') + '"><div class="fr-metric-label">' + label + '</div>' +
      '<div class="fr-metric-line"><span>الفترة الحالية</span><output id="' + currentId + '">—</output></div>' +
      '<div class="fr-metric-line"><span>فترة المقارنة</span><output id="' + comparisonId + '">—</output></div></section>';
  }
  function load() {
    UIC.appShell('tc-fr-root', {
      companyLogoUrl: COMPANY_LOGO_URL,
      companyLogoHref: scriptUrl + '?action=tc_dashboard&sessionToken=' + SESSION_TOKEN,
      companyLogoTitle: 'توب كيميكال',
      breadcrumb: 'توب كيميكال / تحليلات النظام الرئيسي / تحليلات النسب المالية',
      contentId: 'tc-fr-content', menuGroups: (window.TOPCHEMICAL_MENU || [])
    });
    var current = defaultRange();
    var comparison = { from: shiftYear(current.from, -1), to: shiftYear(current.to, -1) };
    var content = document.getElementById('tc-fr-content');
    if (!content) return;
    content.innerHTML =
      '<div class="fr-wrap"><p class="fr-intro">تقرير المبيعات والإيرادات الأخرى والمصروفات والإنتاج، مع مقارنة فترتين ماليتين.</p>' +
      '<form id="fr-form"><div class="fr-filters">' +
        '<section class="fr-filter-card"><h2>الفترة الحالية</h2><p>المبيعات حسب تاريخ الفاتورة، والمرتجعات حسب تاريخ إنشائها، وباقي البنود حسب تاريخ الحركة.</p><div class="fr-dates">' +
          field('fr-from', 'من تاريخ', current.from) + field('fr-to', 'إلى تاريخ', current.to) +
        '</div></section>' +
        '<section class="fr-filter-card"><h2>فترة المقارنة</h2><p>تبدأ افتراضيًا بالفترة نفسها من العام السابق، ويمكن تغيير التاريخين.</p><div class="fr-dates">' +
          field('fr-compare-from', 'من تاريخ المقارنة', comparison.from) + field('fr-compare-to', 'إلى تاريخ المقارنة', comparison.to) +
        '</div></section>' +
      '</div><div class="fr-actions"><button type="submit" class="btn btn-primary" id="fr-apply">عرض النتائج</button>' +
        '<button type="button" class="btn btn-outline" id="fr-pdf">تنزيل التقرير PDF</button><span class="fr-error" id="fr-error" role="alert"></span></div></form>' +
      (IS_SUPER_ADMIN ? '<section class="fr-diagnostics" aria-live="off"><strong>قياس تحميل التقرير — للمسؤول الأعلى فقط</strong>' +
        '<pre id="fr-measurement-text">ستظهر أزمنة الطلبات وMySQL بعد تحميل التقرير.</pre>' +
        '<div class="fr-actions" style="margin:8px 0 0"><button type="button" class="btn btn-outline" id="fr-explain-materials">تحليل خطة SQL للمواد المستخدمة</button>' +
          '<span class="fr-error" id="fr-explain-materials-error" role="alert"></span></div>' +
        '<pre id="fr-explain-materials-plan">استخدم الزر لعرض خطة MySQL للاستعلام نفسه، دون تنفيذ الاستعلام الكامل.</pre></section>' : '') +
      '<main class="fr-report" id="fr-report" dir="rtl">' +
        '<header class="fr-report-header"><div><h1>تحليلات النسب المالية</h1><div class="fr-company-name">مصنع توب كيميكال للمبيدات | TOP CHEMICAL FACTORY</div></div>' +
          '<div class="fr-range-summary"><div>الفترة الحالية: <strong id="fr-current-range">—</strong></div><div>فترة المقارنة: <strong id="fr-comparison-range">—</strong></div></div></header>' +
        '<section class="fr-section fr-sales-group" aria-labelledby="fr-sales-section-title"><div class="fr-section-title"><h2 id="fr-sales-section-title">المبيعات</h2></div>' +
        '<div class="fr-metrics" aria-live="polite">' +
          metric('المبيعات قبل المرتجعات', 'fr-sales', 'fr-compare-sales') +
          metric('المرتجعات', 'fr-returns', 'fr-compare-returns') +
          metric('صافي المبيعات', 'fr-net', 'fr-compare-net', 'fr-metric-primary') +
          metric('إجمالي الإيرادات', 'fr-revenue', 'fr-compare-revenue', 'fr-metric-primary') +
        '</div>' +
        '<section class="fr-section fr-panel fr-chart-panel" aria-labelledby="fr-sales-chart-title"><div class="fr-section-title"><h2 id="fr-sales-chart-title">صافي المبيعات شهريًا</h2><span>مقارنة صافي المبيعات للفترتين</span></div>' +
          '<div id="fr-sales-chart" class="fr-chart-wrap" aria-live="polite"><div class="fr-empty">جارٍ تحميل الرسم…</div></div>' +
          '<div class="fr-legend" aria-label="مفتاح الرسم البياني">' +
            '<span class="fr-legend-item"><i class="fr-legend-line" style="--legend-color:#1677d2"></i>الفترة الحالية</span>' +
            '<span class="fr-legend-item"><i class="fr-legend-line fr-dashed" style="--legend-color:#7c3aed"></i>فترة المقارنة</span>' +
          '</div><p class="fr-panel-note">صافي المبيعات الشهري = المبيعات − المرتجعات المنشأة في الشهر. الأشهر مرتبة حسب موقعها من بداية كل فترة.</p>' +
        '</section>' +
