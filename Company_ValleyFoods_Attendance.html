    /* ================= BINDINGS / INIT ================= */
    /* Everything bound here exists from boot. Controls created with a modal
       (vf-csv-input, vf-review-all-btn, vf-batches-all-btn) are bound in the
       open*Modal function that creates them. */
    function bindEvents() {
      var newSessionBtn = document.getElementById('vf-new-session-btn');
      if (newSessionBtn) newSessionBtn.addEventListener('click', moreItem(function () { showNewSessionModal(); }));

      var prevBtn = document.getElementById('vf-month-prev');
      if (prevBtn) prevBtn.addEventListener('click', function () { shiftMonth(-1); });
      var nextBtn = document.getElementById('vf-month-next');
      if (nextBtn) nextBtn.addEventListener('click', function () { shiftMonth(1); });
      var todayBtn = document.getElementById('vf-month-today');
      if (todayBtn) todayBtn.addEventListener('click', function () {
        var n = new Date(); VIEW_YEAR = n.getFullYear(); VIEW_MONTH = n.getMonth();
        syncRangeToMonth();
        withMonthOverlay(loadSessions);
      });
      var rangeStart = document.getElementById('vf-range-start');
      if (rangeStart) rangeStart.addEventListener('input', function () { RANGE_TOUCHED = true; });
      var rangeEnd = document.getElementById('vf-range-end');
      if (rangeEnd) rangeEnd.addEventListener('input', function () { RANGE_TOUCHED = true; });
      var viewBtn = document.getElementById('vf-view-toggle');
      if (viewBtn) viewBtn.addEventListener('click', moreItem(toggleView));

      var openReportBtn = document.getElementById('vf-open-report');
      if (openReportBtn) openReportBtn.addEventListener('click', openReportModal);
      var openExcBtn = document.getElementById('vf-open-exc');
      if (openExcBtn) openExcBtn.addEventListener('click', openExceptionsModal);
      var openReviewBtn = document.getElementById('vf-open-review');
      if (openReviewBtn) openReviewBtn.addEventListener('click', openReviewModal);
      var openImportBtn = document.getElementById('vf-open-import');
      if (openImportBtn) openImportBtn.addEventListener('click', openImportModal);
      var moreToggle = document.getElementById('vf-more-toggle');
      if (moreToggle) {
        moreToggle.addEventListener('click', function (e) {
          UIC.toggleDropdown('vf-more-menu', e);
          var menu = document.getElementById('vf-more-menu');
          var isOpen = !!(menu && menu.classList.contains('open'));
          moreToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        });
      }
      document.addEventListener('click', function (e) {
        var dd = e.target && e.target.closest ? e.target.closest('.nav-dropdown') : null;
        if (!dd && moreToggle) {
          moreToggle.setAttribute('aria-expanded', 'false');
        }
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
          var menu = document.getElementById('vf-more-menu');
          if (menu && menu.classList.contains('open')) {
            UIC.toggleDropdown('vf-more-menu');
            if (moreToggle) moreToggle.setAttribute('aria-expanded', 'false');
          }
        }
      });

      var manualAddBtn = document.getElementById('vf-manual-add-btn');
      if (manualAddBtn) manualAddBtn.addEventListener('click', moreItem(function () { showManualEntryModal(); }));

      var openBatchesBtn = document.getElementById('vf-open-batches');
      if (openBatchesBtn) openBatchesBtn.addEventListener('click', moreItem(openBatchesModal));

      var printBtn = document.getElementById('vf-print-forget-btn');
      if (printBtn) printBtn.addEventListener('click', moreItem(printForgetForm));
    }

    /* Another device's change to this page arrives on its own. The poll
       reads timestamps from cache, never a spreadsheet, and stands down
       while the tab is hidden or a save is in flight. */
    document.addEventListener('DOMContentLoaded', function () {
      UIC.Live.watchPage({
        call: companyCall,
        page: 'vf_hr_attendance',
        onChange: function () {
          UIC.Live.arrive(function () {
            /* the day list is the page's spine; the two queues hang off it */
            loadSessions();
            try { loadExceptions(true); } catch (e) {}
          });
        }
      });
      /* [live-notice] the view on screen */
      UIC.Live.setView('list', { refresh: function () { /* the day list is the page's spine; the two queues hang off it */
            loadSessions();
            try { loadExceptions(true); } catch (e) {} } });
    });

    document.addEventListener('DOMContentLoaded', renderApp);

    window.ATT_PAGE = {
      openSessionDetail: openSessionDetail,
      saveNewSession: saveNewSession,
      loadAllDays: loadAllDays,
      showLatestDays: showLatestDays,
      toggleBatches: toggleBatches,
      addPunchForDay: addPunchForDay,
      showReviewFix: showReviewFix,
      saveReviewFix: saveReviewFix,
      discardReview: discardReview,
      addPunchFromException: addPunchFromException,
      printForgetFor: printForgetFor,
      openReportDrill: openReportDrill,
      resetUpload: resetUploadFlow,
      chooseFormat: chooseFormat,
      showAlternatives: showAlternatives,
      startCommit: startCommit,
      undoBatch: undoBatch,
      saveManualEntry: saveManualEntry,
      openReportModal: openReportModal,
      openExceptionsModal: openExceptionsModal,
      openReviewModal: openReviewModal,
      openImportModal: openImportModal,
      openBatchesModal: openBatchesModal
    };
  })();
  </script>
</body>
</html>
