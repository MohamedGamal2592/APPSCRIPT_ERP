<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Valley Foods — الموارد البشرية (موظفين)</title>
  <?!= include('CSS_Tokens'); ?>
  <?!= include('UI_Components'); ?>
  <?!= include('Client_Helpers'); ?>
  <?!= include('Company_ValleyFoods_Nav'); ?>
  <?!= getCompanyThemeCSS_('9940659bd83035d7') ?>
</head>
<body>
  <div id="vf-emp-root"></div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var SESSION_TOKEN = params.get('sessionToken') || (API.getSession() || {}).token || '';
    var scriptUrl = window.scriptUrl || '/';
    var IS_SUPER_ADMIN = <?!= user && user.isSuperAdmin ? 'true' : 'false' ?>;
    var COMPANY_LOGO_URL = '<?!= getCompanyLogoUrl_('9940659bd83035d7') ?>';
    var COMPANY_PAGES = <?!= companyPages ?>;
    var CURRENT_ACTION = '<?!= currentAction ?>';
    var USER_PAGES = <?!= user && user.isSuperAdmin ? 'null' : JSON.stringify((user && user.authorizedPages) || {}) ?>;
    var CAN_WRITE = UIC.canAdd_(); var CAN_FULL = UIC.canFull_();

    function companyCall(moduleAction, data) {
      return API.call('company_action', {
        target_system: '9940659bd83035d7',
        module_action: moduleAction,
        data: data || {}
      }, SESSION_TOKEN);
    }

    // ---- enums ----
    var EMPLOYEE_TYPES = ['موظف بصمة', 'موظف بدون بصمة', 'عمالة يومية'];
    var EMP_STATUS_TYPES = ['يعمل بالشركة', 'استقالة', 'انقطاع عن العمل', 'انهاء تعاقد', 'بلوغ سن التقاعد', 'الوفاة', 'معاه عجز'];
    var GENDERS = ['ذكر', 'انثى'];
    var CATEGORIES = ['المصنع', 'الميكروباص'];

    // ---- state ----
    var TAB = (function () {
      var map = { vf_hr_status: 'status' };   /* vf_hr_shifts routes to its own page */
      return map[CURRENT_ACTION] || 'employees';
    })();
    var EMPLOYEES = [], STATUSES = [], ASSIGNMENTS = [];
    var TITLE_OPTIONS = [], TITLE_SECTION_MAP = {};
    var NEXT_EMP_IDS = {};
    var EMP_OPTIONS = [], SHIFT_OPTIONS = [];
    var EMP_MAP = {}, SHIFT_MAP = {};

    function esc(v) {
      /* [UI-2.8 / U-36] Delegates to the shared formatter. This body used to
         carry its own replace-chain behind a `typeof FMT !== 'undefined'`
         guard, but Client_Helpers.html defines FMT in <head> before any page
         script runs, so that fallback was unreachable and the duplicate was
         pure drift risk. Output is identical for every input — proved in
         tools/verify/ui2_formatters.js. */
      return FMT.escape(v);
    }
    function todayStr() { return new Date().toISOString().slice(0, 10); }
    function fmtDate(v) {
      if (!v) return '';
      var d = (v instanceof Date) ? v : new Date(v);
      if (isNaN(d.getTime())) return String(v);
      var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    }
    function rebuildMaps() {
      EMP_MAP = {}; EMP_OPTIONS.forEach(function (o) { EMP_MAP[o.value] = o.label; });
      SHIFT_MAP = {}; SHIFT_OPTIONS.forEach(function (o) { SHIFT_MAP[o.value] = o.label; });
    }

    /* Keep the status/shift pickers in step with a just-added employee: without
       this the new row only becomes searchable after a full refetch. */
    function addEmployeeOption_(rec) {
      if (!rec || rec.emp_id === undefined || rec.emp_id === null || String(rec.emp_id).trim() === '') return;
      var exists = EMP_OPTIONS.some(function (o) { return String(o.value) === String(rec.emp_id); });
      if (!exists) EMP_OPTIONS.push({ value: rec.emp_id, label: rec.name_ar || String(rec.emp_id) });
      rebuildMaps();
    }

    /* quiet: refresh in the background with no blocking overlay, for a
       user who has already seen the change and must not be interrupted
       to confirm it. */
    function load(quiet) {
      UIC.appShell('vf-emp-root', {
        companyLogoUrl: COMPANY_LOGO_URL,
        companyLogoHref: scriptUrl + '?action=vf_dashboard&sessionToken=' + SESSION_TOKEN,
        companyLogoTitle: 'Valley Foods',
        breadcrumb: 'Valley Foods / الموارد البشرية / موظفين',
        contentId: 'vf-emp-content',
        menuGroups: (window.VALLEYFOODS_MENU || [])
      });
      fetchAll(quiet);
    }

    /* fetchAll owns the overlay, so it is the one that takes the flag; load()
       forwards whatever it was handed. */
    function fetchAll(quiet) {
      if (!quiet) UIC.readSkeleton('vf-emp-content');
      companyCall('get_valley_hr_page', {})
        .then(function (er) {
          EMPLOYEES = er.employees || [];
          TITLE_OPTIONS = er.titleOptions || [];
          TITLE_SECTION_MAP = er.titleSectionMap || {};
          NEXT_EMP_IDS = er.next_emp_ids || {};
          STATUSES = er.statuses || [];
          EMP_OPTIONS = er.employeeOptions || [];
          ASSIGNMENTS = er.assignments || [];
          SHIFT_OPTIONS = er.shiftOptions || [];
          rebuildMaps();
          render(); try{schedulePrefetch();}catch(e){};
        }).catch(function (e) {
          UIC.toast('خطأ: ' + (e && e.message ? e.message : e), 'error');
        }).finally(function () { if (!quiet) UI.hideSpinner(); });
    }

    function render() {
      var tabs =
        '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">' +
          tabBtn('employees', 'قائمة الموظفين') +
          tabBtn('status', 'حالة الموظفين') +
          /* تحديد الورديات has its own page now. This stays as a way through to
             it rather than a second copy of the same screen — the inline one
             warned about nothing before the round trip. */
          '<a class="btn btn-outline" href="' + scriptUrl + '?action=vf_hr_shifts&sessionToken=' +
            encodeURIComponent(SESSION_TOKEN) + '">تحديد الورديات ↗</a>' +
          /* Salary lives on its own page now (vf_hr_salary, own grant). Show the
             way through only to granted users — same helper the menu uses —
             so an employees-only user never sees it; the route gate still
             bounces direct URLs without the grant. */
          (UIC.pageAuthorized_('vf_hr_salary')
            ? '<a class="btn btn-outline" href="' + scriptUrl + '?action=vf_hr_salary&sessionToken=' +
              encodeURIComponent(SESSION_TOKEN) + '">راتب الموظف ↗</a>'
            : '') +
        '</div>';
      document.getElementById('vf-emp-content').innerHTML = tabs + '<div id="vf-emp-tab"></div>';
      if (TAB === 'employees') renderEmployees();
      else if (TAB === 'status') renderStatus();
      else renderShift();
    }

    function tabBtn(t, label) {
      return '<button class="btn ' + (TAB === t ? 'btn-primary' : 'btn-outline') + '" onclick="switchTab(\'' + t + '\')">' + label + '</button>';
    }
    function switchTab(t) { TAB = t; render(); }

    function addBtn(onClick, label) {
      if (!CAN_WRITE) return '';
      return '<div style="text-align:left;margin-bottom:12px;"><button class="btn btn-primary" onclick="' + onClick + '">' + label + '</button></div>';
    }

    // ===================== 1) EMPLOYEES =====================
    function renderEmployees() {
      var headers = [
        { key: 'emp_id', label: 'الكود' },
        { key: 'employee_type', label: 'النوع' },
        { key: 'name_ar', label: 'الاسم' },
        { key: 'national_id', label: 'الرقم القومي' },
        { key: 'hiring_date', label: 'تاريخ التعيين' },
        { key: 'title', label: 'المسمى' },
        { key: 'section', label: 'القسم' },
        { key: 'category', label: 'الفئة' },
        { key: 'insurance', label: 'التأمين' },
        { key: 'gender', label: 'النوع' },
        { key: 'schedule_id', label: 'رقم الاتفاقية' },
        { key: 'الحالة الوظيفية', label: 'الحالة الوظيفية' },
        { key: 'البطاقة صادرة من', label: 'البطاقة صادرة من' },
        { key: 'العنوان بالبطاقة', label: 'العنوان بالبطاقة' }
      ];
      var rows = EMPLOYEES.map(function (r) {
        /* No status record at all (not merely an empty label): the list says so
           beside the name, so the missing status is visible without opening the
           status tab. has_status is computed by the server; the Arabic-column
           fallback keeps an older server's response working unchanged. */
        var noStatus = (r.has_status === false) || (!r.has_status && !r['الحالة الوظيفية']);
        return {
          emp_id: esc(r.emp_id),
          employee_type: esc(r.employee_type),
          name_ar: esc(r.name_ar) + (noStatus
            ? ' <span style="color:var(--text-muted, #6b7280);font-size:12px;">— لا توجد حالة وظيفية مسجلة</span>'
            : ''),
          national_id: esc(r.national_id),
          hiring_date: esc(fmtDate(r.hiring_date)),
          title: esc(r.title),
          section: esc(r.section),
          category: esc(r.category),
          insurance: r.insurance ? 'نعم' : 'لا',
          gender: esc(r.gender),
          schedule_id: esc(r.schedule_id),
          'الحالة الوظيفية': esc(r['الحالة الوظيفية']),
          'البطاقة صادرة من': esc(r['البطاقة صادرة من']),
          'العنوان بالبطاقة': esc(r['العنوان بالبطاقة'])
        };
      });
      document.getElementById('vf-emp-tab').innerHTML =
        addBtn('openEmployeeModal()', '+ إضافة موظف') +
        UIC.dataTable('emp-table', { headers: headers, rows: rows, pageSize: 100, emptyText: 'لا يوجد موظفين' });
      UIC.initTableSort('emp-table');
    }

    function openEmployeeModal() {
      var typeOpts = EMPLOYEE_TYPES.map(function (t) { return { value: t, label: t }; });
      var catOpts = CATEGORIES.map(function (c) { return { value: c, label: c }; });
      var genOpts = GENDERS.map(function (g) { return { value: g, label: g }; });
      var body = '<form id="emp-form">' +
        UIC.field({ key: 'employee_type', label: 'نوع الموظف', type: 'select', required: true, options: typeOpts, placeholder: 'اختر النوع' }) +
        '<div id="emp-step2" style="display:none;">' +
          '<div class="form-field">' +
            '<label class="form-label">رقم الموظف (يُعتمد تلقائياً حسب النوع)</label>' +
            '<input id="emp-id-preview" class="input" type="text" readonly value="' + esc(NEXT_EMP_IDS[EMPLOYEE_TYPES[0]] || '') + '" style="background:var(--bg-subtle, #f3f4f6);color:var(--text-muted, #6b7280);cursor:not-allowed;">' +
          '</div>' +
          UIC.field({ key: 'name_ar', label: 'الاسم', required: true }) +
          UIC.field({ key: 'national_id', label: 'الرقم القومي (14 رقم)', required: true, noCorrect: true }) +
          UIC.field({ key: 'hiring_date', label: 'تاريخ التعيين', type: 'date', required: true, value: todayStr() }) +
          UIC.combo({ key: 'title', label: 'المسمى الوظيفي', required: true, options: TITLE_OPTIONS }) +
          UIC.field({ key: 'section', label: 'القسم (يُجلب تلقائياً)', required: false }) +
          UIC.field({ key: 'category', label: 'الفئة', type: 'select', required: true, options: catOpts, value: 'المصنع' }) +
          UIC.field({ key: 'insurance', label: 'التأمين', type: 'select', required: true, options: [{ value: 'false', label: 'لا' }, { value: 'true', label: 'نعم' }], value: 'false' }) +
          UIC.field({ key: 'gender', label: 'النوع', type: 'select', required: true, options: genOpts }) +
          UIC.field({ key: 'schedule_id', label: 'رقم الاتفاقية (ساعات العمل المتفق عليها)', type: 'number', required: true, min: 0 }) +
          UIC.field({ key: 'البطاقة صادرة من', label: 'البطاقة صادرة من', required: true }) +
          UIC.field({ key: 'العنوان بالبطاقة', label: 'العنوان بالبطاقة', required: true }) +
        '</div>' +
      '</form>';
      UIC.openModal('modal-emp', { title: 'إضافة موظف', body: body, onSave: 'saveEmployee()' });

      // Step 1 -> Step 2 reveal
      var et = document.getElementById('employee_type');
      if (et) et.addEventListener('change', function () {
        document.getElementById('emp-step2').style.display = this.value ? '' : 'none';
        var preview = document.getElementById('emp-id-preview');
        if (preview) {
          preview.value = NEXT_EMP_IDS[this.value] || '';
          if (this.value) { preview.style.background = '#f3f4f6'; preview.style.color = '#6b7280'; }
        }
      });
      // title -> auto-populate section
      var tEl = document.getElementById('title');
      if (tEl) tEl.addEventListener('change', function () {
        var sec = document.getElementById('section');
        if (sec) sec.value = TITLE_SECTION_MAP[this.value] || '';
      });
    }

    function saveEmployee() {
      var etEl = document.getElementById('employee_type');
      if (!etEl || !etEl.value) { UIC.toast('اختر نوع الموظف أولاً', 'error'); return false; }
      if (!UIC.validateForm('emp-form')) return false;
      var d = UIC.collectForm('emp-form');
      if (!/^\d{14}$/.test(d.national_id || '')) { UIC.toast('الرقم القومي يجب أن يكون 14 رقماً', 'error'); return false; }
      companyCall('add_employee', d).then(function (r) {
        if (r && r.status === 'success') { UIC.toast(r.message || 'تم الحفظ', 'success'); UIC.closeModal('modal-emp');
          if (r.record) {
            var RECENT_LIMIT = 15;
            var idxE = EMPLOYEES.findIndex(function(x){ return String(x.emp_id)===String(r.record.emp_id); });
            if (idxE!==-1) EMPLOYEES[idxE]=Object.assign(EMPLOYEES[idxE], r.record); else EMPLOYEES.unshift(r.record);
            if (EMPLOYEES.length>RECENT_LIMIT) EMPLOYEES.pop();
            // update next ids
            if (NEXT_EMP_IDS && r.record.employee_type) NEXT_EMP_IDS[r.record.employee_type] = Number(r.record.emp_id)+1;
            /* The status/shift pickers must see the new employee immediately,
               not after the next refetch. */
            addEmployeeOption_(r.record);
            renderEmployees();
          } else { fetchAll(true); }
        } else UIC.toast('تعذر الحفظ', 'error');
      }).catch(function (e) { UIC.toast('خطأ: ' + (e && e.message ? e.message : e), 'error'); });
      return true;
    }

    // ===================== 2) STATUS =====================
    function renderStatus() {
      var headers = [
        { key: 'employee_code', label: 'كود الموظف' },
        { key: 'employee_name', label: 'اسم الموظف' },
        { key: 'status_type', label: 'نوع الحالة' },
        { key: 'status_date', label: 'تاريخ الحالة' },
        { key: 'user', label: 'المستخدم' },
        { key: 'created_at', label: 'تاريخ الإنشاء' }
      ];
      var rows = STATUSES.map(function (r) {
        return {
          employee_code: esc(r.employee_code),
          employee_name: esc(r.employee_name || EMP_MAP[r.employee_code] || ''),
          status_type: esc(r.status_type),
          status_date: esc(fmtDate(r.status_date)),
          user: esc(uname_(r.user)),
          created_at: esc(fmtDate(r.created_at))
        };
      });
      document.getElementById('vf-emp-tab').innerHTML =
        addBtn('openStatusModal()', '+ إضافة حالة') +
        UIC.dataTable('status-table', { headers: headers, rows: rows, pageSize: 100, emptyText: 'لا توجد حالات' });
      UIC.initTableSort('status-table');
    }

    function openStatusModal() {
      var body = '<form id="status-form">' +
        UIC.combo({ key: 'emp_id', label: 'الموظف', required: true, options: EMP_OPTIONS }) +
        UIC.field({ key: 'status_type', label: 'نوع الحالة', type: 'select', required: true, options: EMP_STATUS_TYPES.map(function (t) { return { value: t, label: t }; }), placeholder: 'اختر الحالة' }) +
        UIC.field({ key: 'status_date', label: 'تاريخ الحالة', type: 'date', required: true, value: todayStr() }) +
      '</form>';
      UIC.openModal('modal-status', { title: 'إضافة حالة موظف', body: body, onSave: 'saveStatus()' });
    }

    function saveStatus() {
      if (!UIC.validateForm('status-form')) return false;
      var d = UIC.collectForm('status-form');
      if (!d.emp_id) { UIC.toast('الموظف مطلوب', 'error'); return false; }
      companyCall('add_emp_status', d).then(function (r) {
        if (r && r.status === 'success') { UIC.toast(r.message || 'تم الحفظ', 'success'); UIC.closeModal('modal-status');
          if (r.record) {
            var RECENT_LIMIT = 10;
            var idxST = STATUSES.findIndex(function(x){ return String(x.unique_id)===String(r.record.unique_id); });
            if (idxST!==-1) STATUSES[idxST]=r.record; else STATUSES.unshift(r.record);
            if (STATUSES.length>RECENT_LIMIT) STATUSES.pop();
            /* This save is exactly what clears the «no status» note on the
               employees list, so update the local row now rather than leaving a
               stale note until the next reload. */
            var empRow = EMPLOYEES.find(function (x) { return String(x.emp_id) === String(r.record.employee_code); });
            if (empRow) { empRow['الحالة الوظيفية'] = r.record.status_type || ''; empRow.has_status = true; }
            // also update employee status map if needed
            renderStatus();
          } else { fetchAll(true); }
        } else UIC.toast('تعذر الحفظ', 'error');
      }).catch(function (e) { UIC.toast('خطأ: ' + (e && e.message ? e.message : e), 'error'); });
      return true;
    }

    // ===================== 3) SHIFT ASSIGNMENT =====================
    function renderShift() {
      var headers = [
        { key: 'emp_id', label: 'الموظف' },
        { key: 'shift_id', label: 'الوردية' },
        { key: 'shift_start_date', label: 'تاريخ البداية' },
        { key: 'shift_end_date', label: 'تاريخ النهاية' },
        { key: 'notes', label: 'ملاحظات' },
        { key: 'user', label: 'المستخدم' }
      ];
      var rows = ASSIGNMENTS.map(function (r) {
        return {
          emp_id: esc(EMP_MAP[r.emp_id] || r.emp_id),
          shift_id: esc(SHIFT_MAP[r.shift_id] || r.shift_id),
          shift_start_date: esc(fmtDate(r.shift_start_date)),
          shift_end_date: esc(fmtDate(r.shift_end_date)),
          notes: esc(r.notes),
          user: esc(uname_(r.user))
        };
      });
      document.getElementById('vf-emp-tab').innerHTML =
        addBtn('openShiftModal()', '+ إضافة تعيين وردية') +
        UIC.dataTable('shift-table', { headers: headers, rows: rows, pageSize: 100, emptyText: 'لا توجد تعيينات ورديات' });
      UIC.initTableSort('shift-table');
    }

    function openShiftModal() {
      var body = '<form id="shift-form">' +
        UIC.combo({ key: 'emp_id', label: 'الموظف', required: true, options: EMP_OPTIONS }) +
        UIC.combo({ key: 'shift_id', label: 'الوردية', required: true, options: SHIFT_OPTIONS }) +
        UIC.field({ key: 'shift_start_date', label: 'تاريخ بداية الوردية', type: 'date', required: true, value: todayStr() }) +
        UIC.field({ key: 'shift_end_date', label: 'تاريخ نهاية الوردية', type: 'date', required: true, value: todayStr() }) +
        UIC.field({ key: 'notes', label: 'ملاحظات', type: 'textarea', required: false }) +
      '</form>';
      UIC.openModal('modal-shift', { title: 'إضافة تعيين وردية', body: body, onSave: 'saveShift()' });
    }

    function saveShift() {
      if (!UIC.validateForm('shift-form')) return false;
      var d = UIC.collectForm('shift-form');
      if (!d.emp_id) { UIC.toast('الموظف مطلوب', 'error'); return false; }
      if (!d.shift_id) { UIC.toast('الوردية مطلوبة', 'error'); return false; }
      companyCall('add_shift_assignment', d).then(function (r) {
        if (r && r.status === 'success') { UIC.toast(r.message || 'تم الحفظ', 'success'); UIC.closeModal('modal-shift');
          if (r.record) {
            var RECENT_LIMIT = 10;
            var idxSH = ASSIGNMENTS.findIndex(function(x){ return String(x.shift_assignment_id)===String(r.record.shift_assignment_id); });
            if (idxSH!==-1) ASSIGNMENTS[idxSH]=r.record; else ASSIGNMENTS.unshift(r.record);
            if (ASSIGNMENTS.length>RECENT_LIMIT) ASSIGNMENTS.pop();
            renderShift();
          } else { fetchAll(true); }
        } else UIC.toast('تعذر الحفظ', 'error');
      }).catch(function (e) { UIC.toast('خطأ: ' + (e && e.message ? e.message : e), 'error'); });
      return true;
    }
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', load);
    /* Another device's change to this page arrives on its own. The poll
       reads timestamps from cache, never a spreadsheet, and stands down
       while the tab is hidden or a save is in flight. */
    ['vf_hr_employees', 'vf_hr_status', 'vf_hr_shifts']
      .forEach(function (pg) {
        UIC.Live.watchPage({
          call: companyCall,
          page: pg,
          onChange: function () { UIC.Live.arrive(function () { fetchAll(true); }); }
        });
      });

  </script>
</body>
</html>
