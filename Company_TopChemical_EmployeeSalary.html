<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>راتب الموظف</title>
  <?!= include('CSS_Tokens'); ?>
  <?!= include('UI_Components'); ?>
  <?!= include('Client_Helpers'); ?>
  <?!= include('Company_TopChemical_Nav'); ?>
  <?!= getCompanyThemeCSS_('3fe1b5cb67b7223e') ?>
</head>
<body>
<div id="tc-root" dir="rtl"></div>
<script>
  var params = new URLSearchParams(window.location.search);
  var SESSION_TOKEN = params.get('sessionToken') || (API.getSession() || {}).token || '';
  var scriptUrl = window.scriptUrl || '/';
  var IS_SUPER_ADMIN = <?!= user && user.isSuperAdmin ? 'true' : 'false' ?>;
  var COMPANY_LOGO_URL = '<?!= getCompanyLogoUrl_('3fe1b5cb67b7223e') ?>';
  var COMPANY_PAGES = <?!= companyPages ?>;
  var CURRENT_ACTION = '<?!= currentAction ?>';
  var USER_PAGES = <?!= user && user.isSuperAdmin ? 'null' : JSON.stringify((user && user.authorizedPages) || {}) ?>;
  var CAN_WRITE = UIC.canAdd_(); var CAN_FULL = UIC.canFull_();

  /* [live-notice D6] list replies from the device cache, trusted by the stamps */
  if (window.UIC && UIC.Live && UIC.Live.viewCache) companyCall = UIC.Live.viewCache(companyCall, { company: '3fe1b5cb67b7223e', page: 'tc_employee_salary', view: 'list', lists: ['get_employee_salary'] });
  function companyCall(moduleAction, data) {
    return API.call('company_action', {
      target_system: '3fe1b5cb67b7223e',
      module_action: moduleAction,
      data: data || {}
    }, SESSION_TOKEN);
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function fmtDate(v) {
    if (v == null || v === '') return '';
    var d = (v instanceof Date) ? v : new Date(v);
    if (isNaN(d.getTime())) return String(v);
    var p = function (n) { return ('0' + n).slice(-2); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  function load() {
    var contentId = 'salary-content';
    UIC.appShell('tc-root', {
      companyLogoUrl: COMPANY_LOGO_URL,
      companyLogoHref: scriptUrl + '?action=tc_dashboard&sessionToken=' + SESSION_TOKEN,
      companyLogoTitle: 'توب كيميكال',
      breadcrumb: 'توب كيميكال / شئون العاملين / راتب الموظف',
      contentId: contentId,
      menuGroups: (window.TOPCHEMICAL_MENU || [])
    });
    fetchSalaries();
  }

  var LOADED_ALL = false;
  function toggleLoadAll() { LOADED_ALL = !LOADED_ALL; fetchSalaries(); }

  function fetchSalaries(quiet) {
    if (!quiet) UI.showSpinner();
    companyCall('get_employee_salary', LOADED_ALL ? { loadAll: true } : {})
      .then(function (r) {
        window.__rows = r.rows || [];
        window.__empOptions = r.employee_options || [];
        renderSalaries();
      })
      .catch(function (e) { showError(e); })
      .finally(function () { if (!quiet) UI.hideSpinner(); try{schedulePrefetch();}catch(e){} });
  }

  function renderSalaries() {
    var rows = window.__rows.map(function (r) {
      /* Tier A: id is server-assigned and name_ar is a sheet formula, so a
         __pending row shows «—» in both — never an invented value. */
      var pending = !!r.__pending;
      return {
        id: pending ? '—' : r.id,
        salary_date: fmtDate(r.salary_date),
        emp_id: r.emp_id,
        name_ar: pending ? '—' : esc(r.name_ar || '-'),
        main_salary: r.main_salary,
        allow: r.allow,
        basic_salary: r.basic_salary
      };
    });
    var headers = [
      { key: 'id', label: '#', numeric: true },
      { key: 'salary_date', label: 'تاريخ الراتب' },
      { key: 'emp_id', label: 'كود الموظف', numeric: true },
      { key: 'name_ar', label: 'الاسم' },
      { key: 'main_salary', label: 'الراتب الأساسي', numeric: true },
      { key: 'allow', label: 'البدلات', numeric: true },
      { key: 'basic_salary', label: 'الأساسي', numeric: true }
    ];
    var body = document.getElementById('salary-content');
    body.innerHTML = (CAN_WRITE
      ? '<div style="display:flex;justify-content:flex-end;margin-bottom:12px;"><button class="btn btn-primary" onclick="openAddModal()">+ تسجيل راتب</button></div>'
      : '') +
      UIC.showAllBar({ loadedAll: LOADED_ALL, showAll: 'toggleLoadAll()', showLatest: 'toggleLoadAll()' }) +
      UIC.dataTable('salary-table', {
        /* [RT-1] The list endpoint caps at the newest rows unless `loadAll` is
           passed, and the search box filters only what is in memory — so the
           table says which records the box actually searches. */
        truncated: !LOADED_ALL,
        showAll: 'toggleLoadAll()',
        title: 'رواتب الموظفين',
        headers: headers,
        rows: rows,
        emptyText: 'لا توجد رواتب'
      });
    UIC.initTableSort('salary-table');
  }

  function openAddModal() {
    var body =
      '<form id="salary-form">' +
      UIC.field({ key: 'emp_id', label: 'الموظف', type: 'select', required: true,
        options: window.__empOptions || [], placeholder: 'اختر الموظف...' }) +
      UIC.field({ key: 'salary_date', label: 'تاريخ الراتب', type: 'date', required: true }) +
      UIC.field({ key: 'main_salary', label: 'الراتب الأساسي', type: 'number', min: '0', step: '0.01', required: true }) +
      UIC.field({ key: 'allow', label: 'البدلات', type: 'number', min: '0', step: '0.01', required: true }) +
      UIC.field({ key: 'basic_salary', label: 'الأساسي', type: 'number', min: '0', step: '0.01', required: true }) +
      '</form>';
    UIC.openModal('salary-modal', {
      title: 'تسجيل راتب موظف',
      body: body,
      onSave: 'saveSalary()'
    });
  }

  function saveSalary() {
    if (!UIC.validateForm('salary-form')) return;
    var data = UIC.collectForm('salary-form');
    /* Tier A: the row is on screen before the request returns. id is
       server-assigned and name_ar is a sheet formula, so the draft never
       invents them — recordOf fills both from the reply, and returns null on
       add when the reply carries no id. queueable:false: I1 is unproven for
       add_employee_salary, so a transport failure rolls back loudly instead
       of queueing. */
    var draft = {
      id: '',
      salary_date: data.salary_date,
      emp_id: data.emp_id,
      name_ar: '',
      main_salary: Number(data.main_salary) || 0,
      allow: Number(data.allow) || 0,
      basic_salary: Number(data.basic_salary) || 0
    };
    window.__rows = window.__rows || [];
    UIC.Live.save({
      call: companyCall,
      action: 'add_employee_salary',
      data: data,
      list: window.__rows,
      key: 'id',
      draft: draft,
      render: renderSalaries,
      modal: 'salary-modal',
      message: 'تم الحفظ',
      queueable: false,
      reload: function () { fetchSalaries(true); },
      recordOf: function (resp) {
        if (!(resp && resp.record && resp.record.id != null && resp.record.id !== '')) return null;
        return Object.assign({}, draft, resp.record);
      },
      /* The ten-row cap is applied here, NOT in the draft: trimming at draft
         time would drop the tenth row, and the rollback restores the draft's
         slot but cannot bring that row back. */
      onSuccess: function () {
        if (window.__rows.length > 10) window.__rows = window.__rows.slice(0, 10);
        renderSalaries();
      }
    }).catch(function () { /* UIC.Live has toasted and rolled back */ });
  }

  function showError(e) {
    var body = document.getElementById('salary-content');
    if (body) body.innerHTML = '<div class="empty-state"><span>' + esc(e.message || 'خطأ') + '</span></div>';
  }

  /* Another device's change arrives quietly. */
  UIC.Live.watchPage({
    call: companyCall,
    page: 'tc_employee_salary',
    onChange: function () { UIC.Live.arrive(function () { fetchSalaries(true); }); }
  });
  /* [live-notice] the view on screen */
  if (UIC.Live.setView) UIC.Live.setView('list', { refresh: function () { fetchSalaries(true); } });

  load();
</script>
</body>
</html>
