  <script>
    var params = new URLSearchParams(window.location.search);
    var SESSION_TOKEN = params.get('sessionToken') || (API.getSession() || {}).token || '';
    var scriptUrl = window.scriptUrl || '/';
    var IS_SUPER_ADMIN = <?!= user && user.isSuperAdmin ? 'true' : 'false' ?>;
    var COMPANY_LOGO_URL = '<?!= getCompanyLogoUrl_('9940659bd83035d7') ?>';
    var COMPANY_PAGES = <?!= companyPages ?>;
    var CURRENT_ACTION = '<?!= currentAction ?>';
    var USER_PAGES = <?!= user && user.isSuperAdmin ? 'null' : JSON.stringify((user && user.authorizedPages) || {}) ?>;
    var CAN_WRITE = UIC.canAdd_(); var CAN_FULL = UIC.canFull_();

    function companyCall(moduleAction, data) {
      return API.call('company_action', {
        target_system: '9940659bd83035d7',
        module_action: moduleAction,
        data: data || {}
      }, SESSION_TOKEN);
    }
    function esc(v) { return FMT.escape(v); }
    function todayStr() { return new Date().toISOString().slice(0, 10); }
    function fmtDate(v) {
      if (!v) return '—';
      var d = (v instanceof Date) ? v : new Date(v);
      if (isNaN(d.getTime())) return String(v);
      var p = function (n) { return n < 10 ? '0' + n : '' + n; };
      return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear();
    }
    function fmtDateTime(v) {
      if (!v) return '—';
      var d = (v instanceof Date) ? v : new Date(v);
      if (isNaN(d.getTime())) return String(v);
      var p = function (n) { return n < 10 ? '0' + n : '' + n; };
      return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    }
  </script>

  <script>
  (function () {
    'use strict';

    /* ══════════════════════════════════════════════════════════════════════
       السياسات والاجراءات SOPs — مساحة عمل الوثائق.

       The small `contenteditable` inside the 1180px modal is gone. In its place
       is a full-height workspace inside the existing page:

         top bar      back / title / code / status / save state / save / workflow
         toolbar      sticky, real formatting controls
         canvas       pale neutral ground, white A4 sheets from VFDOC, black rules
         panel        بيانات الوثيقة (real controls) + an outline from real headings
         tabs         النماذج المرتبطة / سجل الإصدارات / الإقرارات
         status bar   word count, real page count, zoom, save state

       ONE canonical model per open version — DOC.meta (the versioned template
       snapshot), DOC.bodyHtml (the stored content_html) and DOC.revision (the
       server concurrency token). Everything else is derived from it.
       ══════════════════════════════════════════════════════════════════════ */

    var STATE = {
      SOPS: [], VERSIONS: [], FORMS: [], EVENTS: [], ACKS: [],
      CATEGORIES: [], LEGACY_CATEGORIES: [], CATEGORY_PREFIXES: {},
      DEPT_OPTIONS: [], OWNER_CHOICES: [], OWNER_NAMES: {},
      ROLES: null, LEGACY_ROLES: [], DEPT_ABBR: [], DEPT_ABBR_RECOMMENDED: [], DEPT_ABBR_AUTO: {},
      TEMPLATE: null
    };

    var STATUS_AR = { Draft: 'مسودة', 'In Review': 'قيد المراجعة', Approved: 'معتمد', Rejected: 'مرفوض', Effective: 'ساري', Obsolete: 'متقادم' };
    var STATUS_TONE = { Draft: 'neutral', 'In Review': 'warning', Approved: 'success', Rejected: 'danger', Effective: 'success', Obsolete: 'neutral' };
    var EVENT_AR = { Created: 'إنشاء', Edited: 'تعديل', Submitted: 'إرسال', Approved: 'اعتماد', Rejected: 'رفض', 'Made Effective': 'سريان', Obsolete: 'إلغاء', 'New Version': 'إصدار جديد', 'Acks Launched': 'إطلاق إقرارات', 'Form Added': 'إضافة نموذج', 'Form Removed': 'حذف نموذج' };
    var ACK_AR = { Pending: 'بالانتظار', Read: 'مقروء', Signed: 'موقّع', Superseded: 'ملغى' };
    var SAVE_AR = {
      idle: ['تغييرات غير محفوظة', 'vfs-savestate-idle'],
      saving: ['جارٍ الحفظ…', 'vfs-savestate-saving'],
      saved: ['تم الحفظ', 'vfs-savestate-saved'],
      error: ['تعذر الحفظ', 'vfs-savestate-error'],
      conflict: ['تعارض في التعديلات', 'vfs-savestate-conflict']
    };
    var FORM_TYPE_OPTIONS = [
      { value: 'Doc', label: 'مستند' }, { value: 'Sheet', label: 'جدول' },
      { value: 'Form', label: 'نموذج' }, { value: 'PDF', label: 'PDF' },
      { value: 'ERP page', label: 'صفحة ERP' }
    ];
    var ZOOM_STEPS = [75, 100, 125, 150];
    /* The server stores the body in 10 ordered chunks (content_html … _10), so
       the editor accepts the full chunk capacity instead of refusing at one
       spreadsheet cell. */
    var CELL_LIMIT = 450000;
    var AUTOSAVE_DEBOUNCE_MS = 1500;
    var AUTOSAVE_COALESCE_MS = 10000;

    var VIEW = null;   /* null = the library is showing */
    var DOC = null;    /* the canonical model of the open document */
    var HISTORY = null;
    var LIB = { search: '', filterStatus: '' };
    var FORM_DRAFT = [];
    var REMOVED_FORM_UIDS = [];

    function $(id) { var el = document.getElementById(id); return el || null; }
    function val(id) { var el = $(id); return el ? String(el.value == null ? '' : el.value).trim() : ''; }
    function checked(id) { var el = $(id); return !!(el && el.checked); }
    function setHtml(id, html) { var el = $(id); if (el) el.innerHTML = html; }
    function setText(id, text) { var el = $(id); if (el) el.textContent = String(text == null ? '' : text); }
    function isBlank(v) { return String(v == null ? '' : v).trim() === ''; }
    function tpl() { return STATE.TEMPLATE || VFDOC.TEMPLATE; }
    function statusLabel(s) { return STATUS_AR[s] || s || '—'; }
    function statusPillOf(s) { return UIC.statusPill(statusLabel(s), STATUS_TONE[s] || 'neutral'); }
    function formTypeLabel(t) {
      for (var i = 0; i < FORM_TYPE_OPTIONS.length; i++) if (FORM_TYPE_OPTIONS[i].value === t) return FORM_TYPE_OPTIONS[i].label;
      return t || '—';
    }
    function ownerNameOf(email) {
      var em = String(email || '').trim().toLowerCase();
      if (!em) return '';
      if (STATE.OWNER_NAMES && STATE.OWNER_NAMES[em] && STATE.OWNER_NAMES[em].name) return STATE.OWNER_NAMES[em].name;
      for (var i = 0; i < STATE.OWNER_CHOICES.length; i++) if (STATE.OWNER_CHOICES[i].value === em) return STATE.OWNER_CHOICES[i].label;
      return '';
    }
    function ownerCell(email) {
      var name = ownerNameOf(email);
      if (name) return esc(name);
      return '<span class="vfs-muted">مستخدم غير متاح</span>';
    }
    function roleLabel(value) {
      var v = String(value || '');
      if (STATE.ROLES && v === STATE.ROLES.all_dept_value) return STATE.ROLES.all_dept_label;
      return v || '—';
    }
    function catLabel(code) {
      if (code == null || code === '') return '—';
      for (var i = 0; i < STATE.CATEGORIES.length; i++) if (String(STATE.CATEGORIES[i].code) === String(code)) return STATE.CATEGORIES[i].label;
      for (var j = 0; j < STATE.LEGACY_CATEGORIES.length; j++) if (String(STATE.LEGACY_CATEGORIES[j].code) === String(code)) return STATE.LEGACY_CATEGORIES[j].label;
      return String(code);
    }
    function typeLabelOf(sop) {
      if (!sop) return 'وثيقة';
      var cat = catLabel(sop.category);
      var key = String(sop.category || '').toUpperCase();
      var prefix = STATE.CATEGORY_PREFIXES[key];
      if (key === 'FRM' && prefix === 'APP') return cat + ' (APP)';
      return cat;
    }

    function matchesId(rowValue, sop) {
      return String(rowValue) === String(sop.unique_id) || String(rowValue) === String(sop.id);
    }
    function sopKey(sop) { return String((sop && (sop.unique_id || sop.id)) || ''); }
    function findSop(id) {
      var want = String(id == null ? '' : id);
      for (var i = 0; i < STATE.SOPS.length; i++) {
        var s = STATE.SOPS[i];
        if (String(s.unique_id) === want || String(s.id) === want) return s;
      }
      return null;
    }
    function versionsOf(sop) {
      return STATE.VERSIONS.filter(function (v) { return matchesId(v.sop_id, sop); })
        .sort(function (a, b) { return (Number(b.version) || 0) - (Number(a.version) || 0); });
    }
    function formsOf(sop) { return STATE.FORMS.filter(function (f) { return matchesId(f.sop_id, sop); }); }
    function eventsOf(sop) { return STATE.EVENTS.filter(function (e) { return matchesId(e.sop_id, sop); }); }
    function acksOf(sop) { return STATE.ACKS.filter(function (a) { return matchesId(a.sop_id, sop); }); }
    function findVersion(uid) {
      var want = String(uid == null ? '' : uid);
      for (var i = 0; i < STATE.VERSIONS.length; i++) if (String(STATE.VERSIONS[i].unique_id) === want) return STATE.VERSIONS[i];
      return null;
    }
    function docState(sop) {
      var all = versionsOf(sop);
      var eff = null, work = null, i;
      if (sop && sop.current_effective_version != null && String(sop.current_effective_version) !== '') {
        for (i = 0; i < all.length; i++) if (String(all[i].version) === String(sop.current_effective_version)) { eff = all[i]; break; }
      }
      if (!eff) for (i = 0; i < all.length; i++) if (all[i].status === 'Effective') { eff = all[i]; break; }
      if (sop && sop.draft_version != null && String(sop.draft_version) !== '') {
        for (i = 0; i < all.length; i++) if (String(all[i].version) === String(sop.draft_version)) { work = all[i]; break; }
      }
      if (!work) for (i = 0; i < all.length; i++) if (all[i].status === 'Draft' || all[i].status === 'Rejected') { work = all[i]; break; }
      if (!work) work = all[0] || null;
      return { all: all, effective: eff, work: work, latest: all[0] || null };
    }
    function sopStatus(sop) {
      var st = docState(sop);
      if (st.work) return st.work.status;
      if (st.effective) return 'Effective';
      return '';
    }
    function editableStatus(s) { return s === 'Draft' || s === 'Rejected'; }

    /* ══ app shell and loading ═════════════════════════════════════════════ */
    function renderApp() {
      UIC.appShell('vf-root', {
        companyLogoUrl: COMPANY_LOGO_URL,
        companyLogoHref: scriptUrl + '?action=vf_dashboard&sessionToken=' + SESSION_TOKEN,
        companyLogoTitle: 'Valley Foods',
        breadcrumb: 'Valley Foods / الجودة / السياسات والاجراءات <bdi dir="ltr">SOPs</bdi>',
        contentId: 'vf-quality-content',
        menuGroups: (window.VALLEYFOODS_MENU || [])
      });
      setHtml('vf-quality-content', '<div id="vfs-host"><div class="vf-card"><div class="vf-card-body">جارٍ التحميل…</div></div></div>');
      load();
      UIC.Live.watchPage({
        call: companyCall,
        page: 'vf_quality_sops',
        onChange: function () { UIC.Live.arrive(function () { load(true); }); }
      });
    }

    function load(quiet) {
      /* A refresh the user did not ask for must not draw anything over the
         screen they are reading: the first paint draws a skeleton, a quiet
         refresh draws nothing at all. */
      if (!quiet) UIC.readSkeleton('vfs-host');
      return companyCall('get_quality_sops')
        .then(function (res) {
          res = res || {};
          STATE.SOPS = res.sops || [];
          STATE.VERSIONS = res.versions || [];
          STATE.FORMS = res.forms || [];
          STATE.EVENTS = res.events || [];
          STATE.ACKS = res.acks || [];
          STATE.CATEGORIES = res.categories || [];
          STATE.LEGACY_CATEGORIES = res.legacy_categories || [];
          STATE.CATEGORY_PREFIXES = res.category_prefixes || {};
          STATE.DEPT_OPTIONS = res.dept_options || [];
          STATE.OWNER_CHOICES = res.owner_choices || res.owner_options || [];
          STATE.OWNER_NAMES = res.owner_names || {};
          STATE.ROLES = res.roles || null;
          STATE.LEGACY_ROLES = res.legacy_roles || [];
          STATE.DEPT_ABBR = res.dept_abbr || [];
          STATE.DEPT_ABBR_RECOMMENDED = res.dept_abbr_recommended || [];
          STATE.DEPT_ABBR_AUTO = res.dept_abbr_auto || {};
          STATE.TEMPLATE = res.template || null;
          if (VIEW && DOC) refreshOpenDocument(); else renderLibrary();
        })
        .catch(function (e) {
          if (quiet) return;
          setHtml('vfs-host', '<div class="vf-card"><div class="vf-card-body"><div class="vfs-host-error">' +
            esc((e && e.message) || 'خطأ في تحميل البيانات') + '</div></div></div>');
        })
        .finally(function () { try { UI.hideSpinner(); } catch (e2) {} });
    }

    function refreshOpenDocument() {
      if (!VIEW) return;
      /* Live refresh may update the library while an authoritative save is in
         flight, but it must never replace the editor DOM or its captured
         snapshot underneath that write. */
      if (DOC && DOC.saving) { paintTopbar(); return; }
      if (VIEW.mode === 'new' || VIEW.mode === 'newversion') { paintTopbar(); return; }
      var fresh = findSop(VIEW.sopId);
      if (!fresh) { leaveWorkspace(true); return; }
      VIEW.sop = fresh;
      if (VIEW.versionId) {
        var v = findVersion(VIEW.versionId);
        if (v) VIEW.version = v;
      }
      if (!DOC.dirty) {
        var v2 = VIEW.version;
        DOC.revision = String((v2 && v2.revision) || '');
        DOC.meta = VFDOC.parseMeta(v2 && v2.template_meta);
        if (!DOC.meta.template_id) { DOC.meta = VFDOC.defaultMeta(catLabel(fresh.category), tpl()); DOC.legacy = true; }
        DOC.bodyHtml = VFDOC.sanitize((v2 && v2.content_html) || '');
        if ($('vfs-flow') && !DOC.readOnly) { /* keep the user's live DOM when clean */ }
        renderWorkspace();
      } else {
        paintTopbar();
      }
    }

    /* ══ library ═══════════════════════════════════════════════════════════ */
    function libraryRows() {
      var q = String(LIB.search || '').trim().toLowerCase();
      return STATE.SOPS.filter(function (s) {
        var st = sopStatus(s);
        if (LIB.filterStatus === 'editable' && !editableStatus(st)) return false;
        if (LIB.filterStatus === 'effective' && st !== 'Effective') return false;
        if (!q) return true;
        return [s.sop_code, s.title_ar, s.title_en, s.applicability_dept, ownerNameOf(s.owner_email)]
          .some(function (v) { return String(v || '').toLowerCase().indexOf(q) !== -1; });
      });
    }
    function libraryTableHtml() {
      var rows = libraryRows().map(function (s) {
        var st = docState(s);
        return [
          '<b data-sop="' + esc(sopKey(s)) + '" class="vfs-code">' + esc(s.sop_code || '') + '</b>',
          esc(s.title_ar || ''),
          esc(typeLabelOf(s)),
          esc(s.applicability_dept || '—'),
          esc(roleLabel(s.applicability_role)),
          statusPillOf(sopStatus(s)),
          ownerCell(s.owner_email),
          st.effective ? fmtDate(st.effective.next_review_date) : '—'
        ];
      });
      return UIC.dataTable('sop-table', {
        emptyState: { title: 'لا توجد وثائق', body: 'ابدأ بإنشاء وثيقة جديدة من زر «وثيقة جديدة».' },
        headers: ['الكود', 'العنوان', 'التصنيف', 'الإدارة', 'الدور المعني', 'الحالة', 'المالك', 'المراجعة القادمة'],
        rows: rows,
        rowClick: function (rec, tr) {
          var el = (tr && tr.querySelector) ? tr.querySelector('[data-sop]') : null;
          if (el) openSop(el.getAttribute('data-sop'));
        }
      });

      if (DOC && DOC.dirty && !window.confirm('توجد تغييرات غير محفوظة. المتابعة بدون حفظ؟')) return;
      var meta = VFDOC.parseMeta(src.template_meta);
      if (!meta.template_id) meta = VFDOC.defaultMeta(catLabel(VIEW.sop.category), tpl());
      VIEW = { mode: 'newversion', sopId: sopKey(VIEW.sop), versionId: '', sop: VIEW.sop, version: null, tab: 'vfs-tab-doc' };
      DOC = {
        meta: meta,
        bodyHtml: VFDOC.sanitize(src.content_html || ''),
        revision: '', dirty: false, saveState: 'idle', saving: false, conflict: false,
        createToken: '', editSeq: 0, lastSaveStart: 0, zoom: 100, fitWidth: false, pageCount: 1, wordCount: 0,

    function workflowButtonsHtml() {
      if (!VIEW || !VIEW.sop) return '';

      var v = VIEW.version;
      var out = [];
      /* Submit only for an editable Draft/Rejected version, and only for a

         never be frozen while newer text is still on screen. */
      if (CAN_WRITE && VIEW.mode !== 'new' && v && v.status === 'Draft') {
        out.push('<button type="button" class="btn btn-primary" onclick="VF_QUALITY_SOPS_PAGE.submitVersion()">إرسال للمراجعة</button>');
      }
      if (st.effective && CAN_WRITE && (!v || (v.status !== 'In Review' && v.status !== 'Approved'))) {
        out.push('<button type="button" class="btn btn-outline" onclick="VF_QUALITY_SOPS_PAGE.newVersion()">＋ إصدار جديد</button>');
      }
      if (v && v.status === 'In Review' && CAN_FULL) {
        out.push('<button type="button" class="btn btn-primary" onclick="VF_QUALITY_SOPS_PAGE.approveVersion()">اعتماد</button>');
        out.push('<button type="button" class="btn btn-outline" onclick="VF_QUALITY_SOPS_PAGE.openReject()">رفض</button>');
      }

      if (!VIEW) return;

    function updateStatusBar() {
      setText('vfs-wordcount', 'عدد الكلمات: ' + ((DOC && DOC.wordCount) || 0));

    function relayout() {
      var flow = $('vfs-flow');
      if (!flow || !DOC) return;
      var count = VFDOC.paginate(flow, { template: tpl(), topMm: 52, bottomMm: 30 });
      /* A sheet is drawn for every page, and the flow keeps its own white
         surface: pages are a visual boundary, not separate documents. */
      DOC.pageCount = count;
      var layer = $('vfs-page-layer');
      if (layer) layer.innerHTML = VFDOC.sheetLayerHtml(count, {
        template: tpl(), meta: DOC.meta,
        titleAr: VIEW && VIEW.sop ? String(VIEW.sop.title_ar || '') : '',
        titleEn: VIEW && VIEW.sop ? String(VIEW.sop.title_en || '') : '',

    function applyZoom() {
      var flow = $('vfs-flow');
      if (!flow || !flow.style || !DOC) return;
      var scale = 1;
      if (DOC.fitWidth) {
        var canvas = $('vfs-canvas');
        var avail = 0;
        try { avail = (canvas && canvas.clientWidth) || 0; } catch (e) { avail = 0; }
        if (avail > 40) scale = Math.min(2, Math.max(0.4, (avail - 40) / (210 * VFDOC.TEMPLATE.pxPerMm)));
      } else {
        scale = DOC.zoom / 100;
      }
      /* Zoom is a VIEW transform only — stored font sizes never change. */
      flow.style.transformOrigin = 'top center';
      flow.style.transform = scale === 1 ? 'none' : 'scale(' + scale + ')';
    }

      if (!DOC) return;
      if (String(v) === 'fit') { DOC.fitWidth = true; }
      else { DOC.fitWidth = false; DOC.zoom = Number(v) || 100; }

      updateStatusBar();

      var abbr = deptAbbrevOf(dept);

    function deptAbbrevOf(dept) {
      var want = normDept(dept);
      if (!want) return '';

        var r = STATE.DEPT_ABBR[i];
        if (normDept(r.department) === want || String(r.canonical || '') === want) return String(r.abbrev || '').toUpperCase();
      }
      var auto = STATE.DEPT_ABBR_AUTO || {};
      if (auto[dept]) return String(auto[dept]).toUpperCase();
      var keys = Object.keys(auto);

    /* ══ editor wiring ═════════════════════════════════════════════════════ */
    function wireEditor() {
      var flow = $('vfs-flow');
      if (!flow || !flow.addEventListener) return;
      var typingTimer = null;
      flow.addEventListener('input', function () {
        if (!DOC || DOC.readOnly) return;
        if (DOC.composing) return;                 /* no autosave during IME */
        if (HISTORY) HISTORY.push(false);
        DOC.wordCount = VFDOC.countWords(flow.textContent || '');
        updateStatusBar();
        refreshFindBarVisibility();
        if (typingTimer) { try { clearTimeout(typingTimer); } catch (e) {} }
        typingTimer = setTimeout(function () { typingTimer = null; relayout(); renderOutline(); }, 700);
        markDirty();
      });
      flow.addEventListener('compositionstart', function () { if (DOC) DOC.composing = true; });
      flow.addEventListener('compositionend', function () {
        if (!DOC) return;
        DOC.composing = false;
        markDirty();
      });
      flow.addEventListener('keydown', function (ev) {
        var mod = ev.ctrlKey || ev.metaKey;
        if (!mod) return;
        var k = String(ev.key || '').toLowerCase();
        if (k === 's') { ev.preventDefault(); if (!DOC.readOnly) saveDraft(); return; }
        if (k === 'p') { ev.preventDefault(); printPreview(); return; }
        if (k === 'b') { if (!DOC.readOnly) { ev.preventDefault(); run('bold'); } return; }
        if (k === 'i') { if (!DOC.readOnly) { ev.preventDefault(); run('italic'); } return; }
        if (k === 'u') { if (!DOC.readOnly) { ev.preventDefault(); run('underline'); } return; }
        if (k === 'z' && !ev.shiftKey) { if (!DOC.readOnly) { ev.preventDefault(); run('undo'); } return; }
        if ((k === 'z' && ev.shiftKey) || k === 'y') { if (!DOC.readOnly) { ev.preventDefault(); run('redo'); } return; }
        if (k === 'f') { ev.preventDefault(); openFind(); return; }
        if (k === 'a') {
          /* Select-all is scoped to the document, never the whole page. */
          ev.preventDefault();
          try {
            var r = document.createRange();
            r.selectNodeContents(flow);
            var sel = window.getSelection();
            sel.removeAllRanges(); sel.addRange(r);
          } catch (e2) {}
        }
      });
      flow.addEventListener('paste', function (ev) { onPaste(ev); });
    }
    function refreshFindBarVisibility() { /* the bar is opened explicitly */ }

    function run(op) {
      if (!DOC || DOC.readOnly) { UIC.toast('الوثيقة للقراءة فقط', 'error'); return; }
      var flow = $('vfs-flow');
      if (!flow) return;
      if (op === 'undo') { if (HISTORY && HISTORY.undo()) afterEditorChange(); return; }
      if (op === 'redo') { if (HISTORY && HISTORY.redo()) afterEditorChange(); return; }
      if (op === 'link') { insertLink(); return; }
      if (op === 'unlink') { exec('unlink'); afterEditorChange(true); return; }
      if (op === 'table') { insertTable(); return; }
      if (op === 'pagebreak') { insertPageBreak(); return; }
      if (op === 'find') { openFind(); return; }
      if (HISTORY) HISTORY.push(true);
      if (op === 'rtl' || op === 'ltr') { if (applyDirection(op)) { afterEditorChange(true); return; } }
      exec(op);
      afterEditorChange(true);
    }
    function applyDirection(dir) {
      /* dir= is applied to the BLOCK (paragraph/list item/heading), not to a
         bare selection wrapper, so an English code inside Arabic text keeps its
         own direction without breaking the surrounding paragraph. */
      try {
        exec('dir', dir);
        return true;
      } catch (e) { return false; }
    }
    function applySelect(id, v) {
      if (!DOC || DOC.readOnly) return;
      if (id === 'vfs-sel-block') { if (!v) return; if (HISTORY) HISTORY.push(true); exec('formatBlock', String(v).toUpperCase()); afterEditorChange(true); return; }
      if (id === 'vfs-sel-font') { if (!v) return; if (HISTORY) HISTORY.push(true); exec('fontName', v); afterEditorChange(true); return; }
      if (id === 'vfs-sel-size') { if (!v) return; applyFontSize(v); return; }
    }
    function applyFontSize(size) {
      var flow = $('vfs-flow');
      if (!flow) return;
      var range = null;
      try {
        var sel = window.getSelection();
        if (sel && sel.rangeCount) range = sel.getRangeAt(0);
      } catch (e) { range = null; }
      if (!range) { UIC.toast('حدد نصاً أولاً', 'info'); return; }
      if (HISTORY) HISTORY.push(true);
      try {
        var span = document.createElement('span');
        span.style.fontSize = String(size) + 'pt';
        range.surroundContents(span);
      } catch (e2) { UIC.toast('تعذر تطبيق الحجم على هذا التحديد', 'error'); }
      afterEditorChange(true);
    }
    function insertLink() {
      var url = window.prompt('أدخل الرابط (https://…):', 'https://');
      if (!url) return;
      if (!/^https?:\/\//i.test(url) && !/^mailto:/i.test(url)) { UIC.toast('الرابط يجب أن يبدأ بـ https://', 'error'); return; }
      if (HISTORY) HISTORY.push(true);
      exec('createLink', url);
      var flow = $('vfs-flow');
      if (flow) {
        var links = [];
        try { links = flow.querySelectorAll('a'); } catch (e) { links = []; }
        for (var i = 0; i < links.length; i++) {
          links[i].setAttribute('rel', 'noopener noreferrer');
          links[i].setAttribute('target', '_blank');
        }
      }
      afterEditorChange(true);
    }
    function insertTable() {
      var rows = parseInt(window.prompt('عدد الصفوف:', '3') || '', 10);
      var cols = parseInt(window.prompt('عدد الأعمدة:', '3') || '', 10);
      if (!rows || !cols || rows < 1 || cols < 1 || rows > 50 || cols > 20) { UIC.toast('قيم الجدول غير صالحة', 'error'); return; }
      if (HISTORY) HISTORY.push(true);
      exec('insertHTML', VFDOC.tableHtml(rows, cols));
      afterEditorChange(true);

    function insertPageBreak() {
      if (HISTORY) HISTORY.push(true);
      exec('insertHTML', '<hr class="vfs-pagebreak"><p><br></p>');
      afterEditorChange(true);
    }
    function exec(cmd, value) {
      var flow = $('vfs-flow');
      if (!flow || !DOC || DOC.readOnly) return;
      if (flow.focus) { try { flow.focus(); } catch (e) {} }
      try { document.execCommand(cmd, false, value === undefined ? null : value); } catch (e2) {}
    }
    function afterEditorChange(structural) {
      var flow = $('vfs-flow');
      if (flow) DOC.wordCount = VFDOC.countWords(flow.textContent || '');
      updateStatusBar();
      if (structural) setTimeout(function () { relayout(); renderOutline(); }, 30);
      markDirty();
    }

    /* ══ find / replace — over editable document content only ═════════════ */
    function openFind() {
      var bar = $('vfs-findbar');
      if (bar && bar.classList) bar.classList.add('open');
      var q = $('vfs-find-q');
      if (q && q.focus) { try { q.focus(); } catch (e) {} }
    }
    function closeFind() {
      var bar = $('vfs-findbar');
      if (bar && bar.classList) bar.classList.remove('open');
      clearFindMarks();
    }
    function clearFindMarks() {
      var flow = $('vfs-flow');
      if (!flow) return;
      var marks = [];
      try { marks = flow.querySelectorAll('mark.vfs-find'); } catch (e) { marks = []; }
      for (var i = marks.length - 1; i >= 0; i--) {
        var m = marks[i];
        if (m.parentNode) {
          while (m.firstChild) m.parentNode.insertBefore(m.firstChild, m);
          m.parentNode.removeChild(m);
        }
      }
    }
    function findMatches(needle) {
      var flow = $('vfs-flow');
      if (!flow || !needle) return [];
      var nodes = [];
      try {
        var walker = document.createTreeWalker(flow, NodeFilter.SHOW_TEXT, null);
        var n = walker.nextNode();
        while (n) { nodes.push(n); n = walker.nextNode(); }
      } catch (e) { return []; }
      var out = [];
      var want = String(needle).toLowerCase();
      nodes.forEach(function (node) {
        var hay = String(node.nodeValue || '').toLowerCase();
        var idx = hay.indexOf(want);
        while (idx !== -1) {
          out.push({ node: node, start: idx, end: idx + want.length });
          idx = hay.indexOf(want, idx + want.length);
        }
      });
      return out;
    }
    function findNext() {
      var q = val('vfs-find-q');
      if (!q) return;
      clearFindMarks();
      var matches = findMatches(q);
      if (!matches.length) { UIC.toast('لا نتائج', 'info'); return; }
      var m = matches[0];
      try {
        var r = document.createRange();
        r.setStart(m.node, m.start); r.setEnd(m.node, m.end);
        var mark = document.createElement('mark');
        mark.className = 'vfs-find';
        r.surroundContents(mark);
        if (mark.scrollIntoView) { try { mark.scrollIntoView({ block: 'center' }); } catch (e) {} }
      } catch (e2) {}
      UIC.toast('عدد النتائج: ' + matches.length, 'info');
    }
    function replaceOne() {
      if (!DOC || DOC.readOnly) return;
      var q = val('vfs-find-q');
      var rep = val('vfs-find-r');
      if (!q) return;
      var matches = findMatches(q);
      if (!matches.length) { UIC.toast('لا نتائج', 'info'); return; }
      if (HISTORY) HISTORY.push(true);
      var m = matches[0];
      var text = String(m.node.nodeValue || '');
      m.node.nodeValue = text.slice(0, m.start) + rep + text.slice(m.end);
      clearFindMarks();
      afterEditorChange(false);
    }
    function replaceAll() {
      if (!DOC || DOC.readOnly) return;
      var q = val('vfs-find-q');
      var rep = val('vfs-find-r');
      if (!q) return;
      var matches = findMatches(q);
      if (!matches.length) { UIC.toast('لا نتائج', 'info'); return; }
      if (HISTORY) HISTORY.push(true);
      var groups = [];
      matches.forEach(function (m) {
        var last = groups[groups.length - 1];
        if (last && last.node === m.node) last.items.push(m);
        else groups.push({ node: m.node, items: [m] });
      });
      groups.forEach(function (g) {
        var text = String(g.node.nodeValue || '');
        for (var i = g.items.length - 1; i >= 0; i--) {
          var it = g.items[i];
          text = text.slice(0, it.start) + rep + text.slice(it.end);
        }
        g.node.nodeValue = text;
      });
      clearFindMarks();
      afterEditorChange(false);
      UIC.toast('تم الاستبدال', 'success');
    }

    /* ══ paste cleaning ════════════════════════════════════════════════════ */
    function onPaste(ev) {
      if (!DOC || DOC.readOnly) return;
      var dt = ev && ev.clipboardData;
      if (!dt) return;
      var html = '', text = '';
      try { html = dt.getData('text/html') || ''; } catch (e) { html = ''; }
      try { text = dt.getData('text/plain') || ''; } catch (e2) { text = ''; }
      if (ev.preventDefault) ev.preventDefault();
      if (HISTORY) HISTORY.push(true);
      if (html) {
        /* Keeps useful paragraphs/headings/lists/tables; strips unsupported and
           unsafe markup. The SERVER validates the same content again. */
        exec('insertHTML', VFDOC.sanitize(html));
      } else if (text) {
        exec('insertText', text);
      }
      afterEditorChange(true);
    }

    /* ══ legacy content and explicit, undoable template application ════════ */

    /* ══ save state and autosave ═══════════════════════════════════════════ */
    function setSaveState(state, quiet) {
      if (!DOC) return;
      DOC.saveState = state;
      var el = $('vfs-save-state');
      if (el) {
        var s = SAVE_AR[state] || SAVE_AR.idle;
        el.className = 'vfs-savestate ' + s[1];
        el.textContent = s[0];
      }
      if (!quiet && state === 'error') UIC.toast('تعذر الحفظ — احتفظنا بالمحتوى، أعد المحاولة', 'error');
      if (!quiet && state === 'conflict') UIC.toast('تعارض في التعديلات — راجع المحتوى ثم أعد الحفظ', 'error');
    }
    var SAVE_WAIT_MODAL_ID = 'vfs-save-wait-modal';
    function saveWaitBody_(message, requestId, uncertain) {
      var rid = requestId ? '<div class="vfs-code" dir="ltr" style="margin-top:8px;word-break:break-all;">' + esc(requestId) + '</div>' : '';
      var next = uncertain
        ? '<div class="vfs-warn" style="margin-top:10px;">احتفظ بالمحتوى كما هو ولا تنشئ طلباً بديلاً. احتفظ برقم الطلب أعلاه واطلب التحقق من سجله، ثم أعد تحميل الصفحة فقط بعد التأكد.</div>'
        : '';
      return '<div class="vfs-save-wait" role="status" aria-live="polite">' +
        '<div style="font-size:28px;text-align:center;margin-bottom:8px;">⏳</div>' +
        '<div style="font-weight:700;">' + esc(message || 'جارٍ تثبيت الحفظ…') + '</div>' + rid + next +
        '</div>';
    }
    function openSaveWait_(requestId) {
      var body = saveWaitBody_('جارٍ حفظ الوثيقة والتحقق من اكتمال سجلها…', requestId, false);
      if (document.getElementById(SAVE_WAIT_MODAL_ID)) {
        var old = document.getElementById(SAVE_WAIT_MODAL_ID).querySelector('.modal-body');
        if (old) old.innerHTML = body;
        return;
      }
      UIC.openModal(SAVE_WAIT_MODAL_ID, {
        title: 'انتظر — جارٍ تثبيت الحفظ', body: body, size: 'sm',
        footer: false, dismissible: false
      });
    }
    function closeSaveWait_() {
      try { UIC.closeModal(SAVE_WAIT_MODAL_ID, true); } catch (e) {}
    }
    function keepSaveWaitUncertain_(err) {
      var modal = document.getElementById(SAVE_WAIT_MODAL_ID);
      if (!modal) return;
      var rid = String((err && (err.requestId || err.id)) || (DOC && DOC.pendingRequestId) || '');
      var body = modal.querySelector('.modal-body');
      if (body) body.innerHTML = saveWaitBody_('تعذر إثبات اكتمال الحفظ حتى الآن — لم نغلق المحرر ولم نرسل طلباً بديلاً.', rid, true);
    }
    function saveErrorIsUncertain_(e) {
      return !!(e && (e.uncertain === true || e.transport === true || e.checkStatus === true || e.code === 'REQUEST_UNCERTAIN' || e.outcome === 'unknown' || e.outcome === 'review'));
    }
    function saveErrorIsDefinite_(e) {
      return !!(e && (e.notApplied === true || e.code === 'REQUEST_NOT_APPLIED' || e.code === 'CONFLICT' || e.conflict === true));
    }
    function markDirty() {
      if (!DOC || DOC.readOnly) return;
      DOC.dirty = true;
      DOC.editSeq++;
      if (DOC.saveState === 'saved' || DOC.saveState === 'idle') setSaveState('idle', true);
      scheduleAutosave();
    }
    function scheduleAutosave() {
      if (!DOC || DOC.readOnly || DOC.composing) return;
      stopAutosave();
      /* ~1500ms typing debounce, coalesced to at most one autosave START per
         10s, so a fast typist cannot generate a request per keystroke. */
      var since = Date.now() - (DOC.lastSaveStart || 0);
      var wait = Math.max(AUTOSAVE_DEBOUNCE_MS, AUTOSAVE_COALESCE_MS - since);
      DOC.autosaveTimer = setTimeout(function () {
        DOC.autosaveTimer = null;
        if (!DOC || !DOC.dirty || DOC.saving || DOC.readOnly) return;
        saveDraft({ auto: true });
      }, wait);
    }
    function stopAutosave() {
      if (DOC && DOC.autosaveTimer) { try { clearTimeout(DOC.autosaveTimer); } catch (e) {} DOC.autosaveTimer = null; }
    }
    function collectMeta() {
      var m = DOC.meta || VFDOC.defaultMeta('', tpl());
      m.issue_date = val('vfs-m-issue-date') || m.issue_date || '';
      m.valid_date = val('vfs-m-valid-date') || m.valid_date || '';
      m.copy_number = val('vfs-m-copy-number') || m.copy_number || '';
      var oldPrepared = m.prepared_by || {};
      var prepOpt = coverUserOption(val('vfs-m-prepared-key'));
      m.prepared_by = {
        name: (prepOpt && prepOpt.name) || oldPrepared.name || '',
        position: val('vfs-m-prepared-position') || oldPrepared.position || ''
      };
      if (prepOpt) m.prepared_by.email = String(prepOpt.value);
      m.reviewed_by = m.reviewed_by && m.reviewed_by.length ? m.reviewed_by : [{}, {}];
      for (var i = 0; i < 2; i++) {
        var oldReviewer = m.reviewed_by[i] || {};
        var revOpt = coverUserOption(val('vfs-m-rev-key-' + i));
        m.reviewed_by[i] = {
          name: (revOpt && revOpt.name) || oldReviewer.name || '',
          position: oldReviewer.position || ''
        };
        if (revOpt) m.reviewed_by[i].email = String(revOpt.value);
      }
      return m;
    }
    function collectHeader() {
      var sop = VIEW && VIEW.sop;
      return {
        title_ar: val('vfs-f-title-ar') || String((sop && sop.title_ar) || ''),
        title_en: val('vfs-f-title-en') || String((sop && sop.title_en) || ''),
        category: val('vfs-f-category') || String((sop && sop.category) || ''),
        applicability_dept: val('vfs-f-dept') || String((sop && sop.applicability_dept) || ''),
        applicability_role: val('vfs-f-role') || String((sop && sop.applicability_role) || ''),
        owner_email: (val('vfs-f-owner') || String((sop && sop.owner_email) || '')).toLowerCase()
      };
    }
    function validateHeaderForNew(h) {
      var missing = [];
      if (isBlank(h.title_ar)) missing.push({ f: 'vfs-f-title-ar', l: 'العنوان العربي' });
      if (isBlank(h.title_en)) missing.push({ f: 'vfs-f-title-en', l: 'العنوان الإنجليزي' });
      if (isBlank(h.category)) missing.push({ f: 'vfs-f-category', l: 'التصنيف' });
      if (isBlank(h.applicability_dept)) missing.push({ f: 'vfs-f-dept', l: 'الإدارة المعنية' });
      if (isBlank(h.applicability_role)) missing.push({ f: 'vfs-f-role', l: 'الدور المعني' });
      if (isBlank(h.owner_email)) missing.push({ f: 'vfs-f-owner', l: 'المالك' });
      return missing;
    }
    function showFieldErrors(missing) {
      ['vfs-f-title-ar', 'vfs-f-title-en', 'vfs-f-category', 'vfs-f-dept', 'vfs-f-role', 'vfs-f-owner'].forEach(function (f) {
        setText('err-' + f, '');
      });
      missing.forEach(function (m) { setText('err-' + m.f, m.l + ' مطلوب'); });
      var alertBox = $('vfs-meta-alert');
      if (alertBox) {
        alertBox.innerHTML = missing.length
          ? '<div class="vfs-err">أكمل بيانات الوثيقة للحفظ: ' + esc(missing.map(function (m) { return m.l; }).join('، ')) + '</div>'
          : '';
      }
      var panel = $('vfs-panel');
      if (panel && panel.removeAttribute) panel.removeAttribute('hidden');
    }

    /**
     * THE save path. Metadata and the editable body go in ONE request so
     * "تم الحفظ" is only shown once a complete snapshot was persisted.
     */
    function saveDraft(opts) {
      opts = opts || {};
      if (!DOC || DOC.readOnly) return Promise.resolve({ skipped: 'readonly' });
      if (DOC.saving) return DOC.activeSavePromise || Promise.resolve({ skipped: 'in-flight' });
      var header = collectHeader();
      var meta = collectMeta();
      var flow = $('vfs-flow');
      var body = VFDOC.sanitize(flow ? flow.innerHTML : DOC.bodyHtml || '');
      var isNew = VIEW.mode === 'new';
      if (isNew) {
        var missing = validateHeaderForNew(header);
        if (missing.length) {
          /* No repeated toasts while typing: field-level errors are shown once. */
          showFieldErrors(missing);
          setSaveState('idle', true);
          return Promise.resolve({ skipped: 'invalid' });
        }
        showFieldErrors([]);
      }
      if (body.length > CELL_LIMIT) {
        setSaveState('error', true);
        var box = $('vfs-meta-alert');
        if (box) box.innerHTML = '<div class="vfs-err">حجم المحتوى يتجاوز الحد المسموح (' + CELL_LIMIT + ' حرف). اختصر المحتوى ثم أعد المحاولة.</div>';
        return Promise.resolve({ skipped: 'oversize' });
      }
      DOC.meta = meta;
      DOC.bodyHtml = body;
      var capturedSeq = DOC.editSeq;
      var capturedRevision = String(DOC.revision || '');
      var payload = {
        title_ar: header.title_ar, title_en: header.title_en, category: header.category,
        applicability_dept: header.applicability_dept, applicability_role: header.applicability_role,
        owner_email: header.owner_email
      };
      if (!isNew) payload.unique_id = VIEW.sopId;
      if (isNew) payload.create_token = DOC.createToken;
      if (capturedRevision) payload.expected_revision = capturedRevision;
      var versionPart = {
        change_type: val('vfs-f-change-type') || (VIEW.version && VIEW.version.change_type) || 'Minor',
        content_html: body,
        change_summary: val('vfs-f-change-summary') || (VIEW.version && VIEW.version.change_summary) || '',
        template_meta: JSON.stringify(meta)
      };
      if (VIEW.versionId) { versionPart.unique_id = VIEW.versionId; versionPart.expected_revision = capturedRevision; }
      payload.version = versionPart;

      var blocking = !opts.auto || VIEW.mode === 'new';
      var savePayload = payload;
      DOC.saving = true;
      DOC.lastSaveStart = Date.now();
      setSaveState('saving', true);
      if (blocking) openSaveWait_('');
      var savePromise = companyCall('save_quality_sop', savePayload)
        .then(function (r) {
          r = r || {};
          VIEW.sopId = String(r.unique_id || VIEW.sopId || '');
          if (r.sop_code) {
            setText('vfs-code-label', r.sop_code);
            setText('vfs-code-preview', r.sop_code);
            var note = $('vfs-code-note');
            if (note) note.textContent = '';
          }
          if (r.revision) DOC.revision = String(r.revision);
          if (VIEW.mode === 'new' && r.unique_id) VIEW.mode = 'edit';
          if (VIEW.mode === 'newversion') {
            /* Re-read the created version so the workspace is bound to the real
               row instead of a guess, then keep the same editor instance. */
            VIEW.mode = 'edit';
          }
          if (DOC.editSeq === capturedSeq) {
            DOC.dirty = false;
            setSaveState('saved', true);
          } else {
            /* The user typed during the save: only the captured snapshot is
               saved and the newer content stays dirty. A late response can
               never replace newer editor state. */
            DOC.dirty = true;
            setSaveState('idle', true);
            scheduleAutosave();
          }
          if (blocking) closeSaveWait_();
          return r;
        })
        .catch(function (e) {
          DOC.dirty = true;
          var conflict = !!(e && (e.conflict || /تعارض/.test(String(e.message || ''))));
          setSaveState(conflict ? 'conflict' : 'error', true);
          var box = $('vfs-meta-alert');
          if (box) box.innerHTML = '<div class="vfs-err">' + esc((e && e.message) || 'فشل الحفظ') + '</div>';
          if (blocking) {
            if (saveErrorIsUncertain_(e)) keepSaveWaitUncertain_(e);
            else if (saveErrorIsDefinite_(e)) closeSaveWait_();
            else keepSaveWaitUncertain_(e);
          }
          if (opts.auto) { /* background saves never block the UI */ return { background_error: true }; }
          throw e;
        })
        .finally(function () {
          if (DOC) {
            DOC.saving = false;
            if (DOC.activeSavePromise === savePromise) DOC.activeSavePromise = null;
          }
        });
      DOC.activeSavePromise = savePromise;
      DOC.pendingRequestId = String(savePayload.__request_id || '');
      return savePromise;
    }

    /** A submit must never send a stale body: flush and await pending saves. */
    function flushBeforeSubmit() {
      stopAutosave();
      if (DOC.saving && DOC.activeSavePromise) {
        return DOC.activeSavePromise.then(function (r) {
          if (r && (r.uncertain || r.checkStatus || r.background_error)) throw new Error('تعذر تأكيد الحفظ قبل الإرسال');
          return true;
        });
      }
      if (!DOC.dirty) return Promise.resolve(true);
      return saveDraft({ manual: true }).then(function (r) {
        if (r && r.skipped === 'invalid') throw new Error('أكمل بيانات الوثيقة أولاً');
        if (r && r.skipped && r.skipped !== 'readonly') throw new Error('تعذر تأكيد حفظ أحدث محتوى قبل الإرسال');
        return true;
      });
    }

        (canEdit ? '<button type="button" class="btn btn-outline" onclick="VF_QUALITY_SOPS_PAGE.addFormRow()">+ إضافة نموذج</button>' : '') +
        '</div><div id="sop-forms-body">' + formsTableHtml() + '</div>' +
        (canEdit ? '<div style="display:flex;justify-content:flex-end;margin-top:10px;"><button type="button" class="btn btn-primary" onclick="VF_QUALITY_SOPS_PAGE.saveForms()">حفظ النماذج</button></div>' : '') +
        '<div class="vfs-muted" style="font-size:12px;margin-top:8px;">النماذج المرتبطة تُحفظ على الوثيقة؛ والنموذج المطبوع داخل إصدار مُجمّد يبقى لقطة ثابتة لا تتأثر بتغيّر السجل لاحقاً.</div>';
    }
    function redrawForms() {
      setHtml('sop-forms-body', formsTableHtml());
      try { UIC.autoColumnsAll('sop-forms-body'); } catch (e) {}
    }
    function collectFormsFromDom() {
      for (var i = 0; i < FORM_DRAFT.length; i++) {
        if (!document.getElementById('sop-form-code-' + i)) continue;
        FORM_DRAFT[i].form_code = val('sop-form-code-' + i);
        FORM_DRAFT[i].title = val('sop-form-title-' + i);
        FORM_DRAFT[i].form_type = val('sop-form-type-' + i) || 'Doc';
        FORM_DRAFT[i].link_or_id = val('sop-form-link-' + i);
        FORM_DRAFT[i].revision = val('sop-form-rev-' + i);
        FORM_DRAFT[i].is_required = checked('sop-form-req-' + i);
      }
    }
    function addFormRow() {
      if (!CAN_WRITE || !DOC || DOC.readOnly) return;
      collectFormsFromDom();
      FORM_DRAFT.push({ unique_id: '', form_code: '', title: '', form_type: 'Doc', link_or_id: '', revision: '', is_required: false });
      redrawForms();
    }
    function removeFormRow(i) {
      if (!CAN_WRITE || !DOC || DOC.readOnly) return;
      collectFormsFromDom();
      var f = FORM_DRAFT[i];
      if (f && f.unique_id) REMOVED_FORM_UIDS.push(f.unique_id);
      FORM_DRAFT.splice(i, 1);
      redrawForms();
    }
    function saveForms() {
      if (!CAN_WRITE) { UIC.toast('غير مصرح', 'error'); return Promise.resolve(); }
      if (!VIEW || !VIEW.sopId) { UIC.toast('احفظ الوثيقة أولاً', 'error'); return Promise.resolve(); }
      collectFormsFromDom();
      var sopId = VIEW.sopId;
      var rows = FORM_DRAFT.filter(function (f) { return f.form_code || f.title; });
      var removals = REMOVED_FORM_UIDS.slice();
      var chain = Promise.resolve();
      removals.forEach(function (uid) {
        chain = chain.then(function () { return companyCall('save_quality_sop_forms', { sop_id: sopId, unique_id: uid, remove: true }); });
      });
      rows.forEach(function (f) {
        chain = chain.then(function () {
          return companyCall('save_quality_sop_forms', {
            sop_id: sopId, unique_id: f.unique_id || '', form_code: f.form_code, title: f.title,
            form_type: f.form_type, link_or_id: f.link_or_id, revision: f.revision, is_required: f.is_required
          });
        });
      });
      return chain.then(function () { REMOVED_FORM_UIDS = []; UIC.toast('تم حفظ النماذج', 'success'); return load(true); })
        .catch(function (e) { UIC.toast((e && e.message) || 'فشل حفظ النماذج', 'error'); });
    }

    function versionSelectorHtml() {
      var sop = VIEW && VIEW.sop;
      if (!sop) return '';
      var all = versionsOf(sop);
      if (all.length <= 1) return '';
      return '<div class="form-field" style="max-width:360px;"><label class="form-label" for="vfs-version-select">الإصدار المعروض</label>' +
        '<select id="vfs-version-select" class="input" onchange="VF_QUALITY_SOPS_PAGE.switchVersion(this.value)">' +
        all.map(function (v) {
          return '<option value="' + esc(v.unique_id) + '"' + (String(v.unique_id) === String(VIEW.versionId) ? ' selected' : '') + '>' +
            'الإصدار ' + esc(String(v.version)) + ' — ' + esc(statusLabel(v.status)) + (v.pdf_ref ? ' (PDF مجمّد)' : '') + '</option>';
        }).join('') + '</select>' +
        '<div class="vfs-muted" style="font-size:11.5px;">كل إصدار يعرض محتواه وسجلاته فقط؛ لا يُخلط إصدار بآخر.</div></div>';
    }
    function historyPaneHtml() {
      var sop = VIEW && VIEW.sop;
      var events = sop ? eventsOf(sop).sort(function (a, b) { return new Date(b.at).getTime() - new Date(a.at).getTime(); }) : [];
      var h = versionSelectorHtml() + '<b style="display:block;margin:8px 0;">سجل الأحداث</b>';
      if (!events.length) return h + '<div class="empty-state"><span>لا توجد أحداث مسجلة</span></div>';
      h += '<div style="border:1px solid var(--border-color, #e5e7eb);border-radius:8px;padding:4px 12px;">';
      events.forEach(function (e) {
        var actor = ownerNameOf(e.actor_email) || e.actor_email || '';
        h += '<div class="vfs-event"><div style="min-width:110px;"><b>' + esc(EVENT_AR[e.event_type] || e.event_type || '') + '</b></div>' +
          '<div style="flex:1;"><div>' + esc(actor) +
            ((e.from_status || e.to_status) ? ' — ' + esc(statusLabel(e.from_status)) + ' ← ' + esc(statusLabel(e.to_status)) : '') +
          '</div>' + (e.comment ? '<div class="vfs-muted" style="font-size:12px;">' + esc(e.comment) + '</div>' : '') + '</div>' +
          '<div style="white-space:nowrap;" class="vfs-muted">' + esc(fmtDateTime(e.at)) + '</div></div>';
      });
      return h + '</div>';
    }
    function acksPaneHtml() {
      var sop = VIEW && VIEW.sop;
      var acks = sop ? acksOf(sop) : [];
      var counts = { Pending: 0, Read: 0, Signed: 0, Superseded: 0 };
      acks.forEach(function (a) { if (counts[a.status] != null) counts[a.status]++; });
      var ver = sop ? sop.current_effective_version : '';
      var h = '<div class="vfs-logchips">' +
        ['Pending', 'Read', 'Signed', 'Superseded'].map(function (k) {
          return '<div class="vfs-logchip"><b>' + counts[k] + '</b><span>' + ACK_AR[k] + '</span></div>';
        }).join('') + '<div class="vfs-logchip"><b>' + acks.length + '</b><span>الإجمالي</span></div></div>' +
        '<div class="vfs-muted" style="font-size:13px;margin-bottom:10px;">' +
        (ver ? 'تُطلق الإقرارات على الإصدار الساري: <b>' + esc(ver) + '</b>' : 'لا يوجد إصدار ساري لإطلاق الإقرارات عليه بعد.') + '</div>';
      if (CAN_FULL && sop) {
        h += '<div style="display:flex;justify-content:flex-end;"><button type="button" class="btn btn-primary"' + (ver ? '' : ' disabled') +
          ' onclick="VF_QUALITY_SOPS_PAGE.launchAcks()">إطلاق الإقرارات</button></div>';
      }
      h += '<div class="vfs-muted" style="font-size:12px;margin-top:8px;">«جميع العاملين بالإدارة» يستهدف موظفي الإدارة المختارة فقط؛ ونتيجة الصفر تعني عدم وجود مستهدفين ولا تُعد نجاحاً.</div>';
      return h;
    }

    /* ══ workflow ══════════════════════════════════════════════════════════ */
    function activeVersionForAction() {
      if (!VIEW) return null;
      if (VIEW.version) return VIEW.version;
      if (VIEW.sop) return docState(VIEW.sop).work;
      return null;
    }
    function submitVersion() {
      if (!CAN_WRITE) { UIC.toast('غير مصرح', 'error'); return Promise.resolve(); }
      var v = activeVersionForAction();
      if (!v) { UIC.toast('احفظ الوثيقة أولاً', 'error'); return Promise.resolve(); }
      var flow = $('vfs-flow');
      var bodyNow = flow ? VFDOC.sanitize(flow.innerHTML) : DOC.bodyHtml;
      if (!VFDOC.substantive(bodyNow) && !VFDOC.substantive(v.content_html || '')) {
        UIC.toast('لا يمكن إرسال إصدار بدون محتوى فعلي (عناوين القالب وحدها ليست محتوى)', 'error');
        return Promise.resolve();
      }
      if (!window.confirm('سيتم حفظ أحدث محتوى ثم تجميده إلى PDF وإرساله للمراجعة. متابعة؟')) return Promise.resolve();
      return flushBeforeSubmit()
        .then(function () { return companyCall('submit_quality_sop_version', { unique_id: v.unique_id }); })
        .then(function (r) {
          UIC.toast('تم إرسال الإصدار للمراجعة', 'success');
          return load(true).then(function () {
            if (r && r.pdf_ref) {
              var box = $('vfs-meta-alert');
              if (box) box.innerHTML = '<div class="vfs-chip">تم إنشاء ملف PDF للإصدار — <a href="' + esc(r.pdf_ref) + '" target="_blank" rel="noopener">عرض</a></div>';
            }
          });
        })
        .catch(function (e) { UIC.toast((e && e.message) || 'فشل الإرسال', 'error'); });
    }
    function approveVersion() {
      if (!CAN_FULL) { UIC.toast('غير مصرح', 'error'); return Promise.resolve(); }
      var v = activeVersionForAction();
      if (!v) return Promise.resolve();
      if (!window.confirm('اعتماد الإصدار؟')) return Promise.resolve();
      return companyCall('approve_quality_sop_version', { unique_id: v.unique_id })
        .then(function () { UIC.toast('تم اعتماد الإصدار', 'success'); return load(true); })
        .catch(function (e) { UIC.toast((e && e.message) || 'فشل الاعتماد', 'error'); });
    }
    function openReject() {
      if (!CAN_FULL) { UIC.toast('غير مصرح', 'error'); return; }
      var v = activeVersionForAction();
      if (!v) return;
      UIC.openModal('sop-reject-modal', {
        title: 'رفض الإصدار',
        body: '<form id="sop-reject-form">' +
          '<div class="form-field"><label class="form-label" for="sop-reject-comment">سبب الرفض <span class="req">*</span></label>' +
          '<textarea id="sop-reject-comment" class="input" rows="3" required></textarea>' +
          '<div class="field-error" id="err-sop-reject-comment"></div></div>' +
          '<input type="hidden" id="sop-reject-uid" value="' + esc(v.unique_id) + '"></form>',
        onSave: 'VF_QUALITY_SOPS_PAGE.confirmReject()'
      });
    }
    function confirmReject() {
      var uid = val('sop-reject-uid');
      var comment = val('sop-reject-comment');
      if (!comment) { UIC.toast('سبب الرفض مطلوب', 'error'); return Promise.resolve(); }
      return companyCall('reject_quality_sop_version', { unique_id: uid, comment: comment })
        .then(function () { UIC.closeModal('sop-reject-modal'); UIC.toast('تم رفض الإصدار', 'success'); return load(true); })
        .catch(function (e) { UIC.toast((e && e.message) || 'فشل الرفض', 'error'); });
    }
    function makeEffective() {
      if (!CAN_FULL) { UIC.toast('غير مصرح', 'error'); return Promise.resolve(); }
      var v = activeVersionForAction();
      if (!v) return Promise.resolve();
      var eff = window.prompt('تاريخ السريان (YYYY-MM-DD):', todayStr());
      if (!eff) return Promise.resolve();
      var next = window.prompt('تاريخ المراجعة القادمة (YYYY-MM-DD):', '');
      return companyCall('make_effective_quality_sop_version', { unique_id: v.unique_id, effective_date: eff, next_review_date: next || '' })
        .then(function () { UIC.toast('تم جعل الإصدار سارياً', 'success'); return load(true); })
        .catch(function (e) { UIC.toast((e && e.message) || 'فشل التنفيذ', 'error'); });
    }
    function launchAcks() {
      if (!CAN_FULL) { UIC.toast('غير مصرح', 'error'); return; }
      var sop = VIEW && VIEW.sop;
      if (!sop) return;
      var ver = sop.current_effective_version;
      if (!ver) { UIC.toast('لا يوجد إصدار ساري', 'error'); return; }
      if (!window.confirm('سيتم إطلاق الإقرارات على الإصدار الساري ' + ver + '. متابعة؟')) return;
      companyCall('launch_quality_acks', { sop_id: VIEW.sopId, sop_version: ver })
        .then(function () { UIC.toast('تم إطلاق الإقرارات', 'success'); return load(true); })
        .catch(function (e) { UIC.toast((e && e.message) || 'فشل إطلاق الإقرارات', 'error'); });
    }
    function printPreview() {
      /* Print/preview is scoped to this workspace: the toolbar, panel, tabs and
         status bar are excluded by the print stylesheet, so what prints is the
         document surface, not the application chrome. */
      try { window.print(); } catch (e) { UIC.toast('تعذر فتح الطباعة', 'error'); }
    }
    function copyCode() {
      var code = VIEW && VIEW.sop ? String(VIEW.sop.sop_code || '') : '';
      if (!code) return;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(code).then(function () { UIC.toast('تم نسخ الكود', 'success'); }, function () { fallbackCopy(code); });
          return;
        }
      } catch (e) {}
      fallbackCopy(code);
    }
    function fallbackCopy(text) {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        UIC.toast('تم نسخ الكود', 'success');
      } catch (e) { UIC.toast('تعذر النسخ', 'error'); }
    }

    /* ══ اختصارات الإدارات (4.7.1) — `full` only, server-checked ══════════ */
    function openDeptAbbr() {
      if (!CAN_FULL) { UIC.toast('غير مصرح', 'error'); return; }
      var rows = STATE.DEPT_ABBR.map(function (r) {
        /* The row carries its record id in a data attribute so no quote has to
           be escaped into an inline handler. */
        return '<div class="vfs-abbr-row"><span style="flex:1 1 180px;">' + esc(r.department) + '</span>' +
          '<input class="input vfs-code" value="' + esc(r.abbrev) + '" data-abbr-uid="' + esc(r.unique_id) + '" oninput="VF_QUALITY_SOPS_PAGE.editAbbrRow(this)" aria-label="اختصار">' +
          '<button type="button" class="btn btn-outline" data-abbr-uid="' + esc(r.unique_id) + '" onclick="VF_QUALITY_SOPS_PAGE.removeAbbrRow(this)">حذف</button></div>';
      }).join('');
      var recommended = (STATE.DEPT_ABBR_RECOMMENDED || []).filter(function (r) { return !r.configured; }).map(function (r) {
        return '<option value="' + esc(r.label) + '" data-abbrev="' + esc(r.abbrev) + '">' + esc(r.label) + ' → ' + esc(r.abbrev) + (r.present ? '' : ' (غير موجود في الفهرس)') + '</option>';
      }).join('');
      UIC.openModal('sop-abbr-modal', {
        title: 'اختصارات الإدارات لأكواد الوثائق',
        body: '<div class="vfs-muted" style="font-size:12px;margin-bottom:8px;">يُستخدم الاختصار في كود الوثائق الجديدة فقط: <b class="vfs-code">POL-MAINT-001</b>. تغيير الاختصار يؤثر على التخصيصات المستقبلية ولا يغيّر أكواداً صادرة.</div>' +
          '<div id="vfs-abbr-rows">' + (rows || '<div class="vfs-muted">لا توجد اختصارات مكوّنة بعد.</div>') + '</div>' +
          '<h4 style="margin-top:12px;">إضافة / تعديل</h4>' +
          '<div class="form-field"><label class="form-label" for="vfs-abbr-dept">الإدارة</label>' +
          '<input id="vfs-abbr-dept" class="input" type="text" list="vfs-abbr-dept-list" placeholder="اسم الإدارة كما في جدول الأقسام">' +
          UIC.datalist('vfs-abbr-dept-list', STATE.DEPT_OPTIONS.map(function (o) { return o.value; })) + '</div>' +
          '<div class="form-field"><label class="form-label" for="vfs-abbr-value">الاختصار (حرف كبير ثم حروف/أرقام)</label>' +
          '<input id="vfs-abbr-value" class="input vfs-code" type="text" placeholder="MAINT"></div>' +
          (recommended ? '<div class="form-field"><label class="form-label" for="vfs-abbr-rec">مقترحات غير مكوّنة</label>' +
            '<select id="vfs-abbr-rec" class="input" onchange="VF_QUALITY_SOPS_PAGE.pickRecommended(this)"><option value="">— اختر —</option>' + recommended + '</select></div>' : '') +
          '<div class="vfs-muted" style="font-size:11.5px;">الإدارات المختلفة لا يمكنها مشاركة الاختصار نفسه؛ وإدارة واحدة لا تحمل اختصارين.</div>',
        onSave: 'VF_QUALITY_SOPS_PAGE.saveAbbr()'
      });
    }
    function pickRecommended(sel) {
      var opt = sel && sel.options ? sel.options[sel.selectedIndex] : null;
      if (!opt || !opt.value) return;
      var dept = $('vfs-abbr-dept'), ab = $('vfs-abbr-value');
      if (dept) dept.value = opt.value;
      if (ab) ab.value = opt.getAttribute('data-abbrev') || '';
    }
    function saveAbbr() {
      var dept = val('vfs-abbr-dept');
      var abbr = val('vfs-abbr-value').toUpperCase();
      if (!dept) { UIC.toast('الإدارة مطلوبة', 'error'); return Promise.resolve(); }
      return companyCall('save_quality_dept_abbr', { department: dept, abbrev: abbr })
        .then(function () { UIC.closeModal('sop-abbr-modal'); UIC.toast('تم حفظ الاختصار', 'success'); return load(true); })
        .catch(function (e) { UIC.toast((e && e.message) || 'فشل الحفظ', 'error'); });
    }
    function editAbbrRow(input) {
      var uid = input && input.getAttribute ? String(input.getAttribute('data-abbr-uid') || '') : '';
      var abbr = input ? String(input.value || '').toUpperCase() : '';
      if (!uid || !abbr) return;
      companyCall('save_quality_dept_abbr', { unique_id: uid, abbrev: abbr })
        .then(function () { return load(true); })
        .catch(function (e) { UIC.toast((e && e.message) || 'فشل الحفظ', 'error'); });
    }
    function removeAbbrRow(btn) {
      var uid = btn && btn.getAttribute ? String(btn.getAttribute('data-abbr-uid') || '') : '';
      if (!uid) return;
      if (!window.confirm('حذف هذا الاختصار؟ الأكواد الصادرة لا تتأثر.')) return;
      companyCall('save_quality_dept_abbr', { unique_id: uid, remove: true })
        .then(function () { UIC.toast('تم الحذف', 'success'); return load(true); })
        .catch(function (e) { UIC.toast((e && e.message) || 'فشل الحذف', 'error'); });
    }

    /* ══ exit guards ═══════════════════════════════════════════════════════ */
    window.addEventListener('beforeunload', function (ev) {
      if (DOC && (DOC.saving || DOC.dirty) && !DOC.readOnly) {
        ev.preventDefault();
        ev.returnValue = '';
        return '';
      }
      return undefined;
    });

    /* ══ public surface ════════════════════════════════════════════════════ */
    window.VF_QUALITY_SOPS_PAGE = {
      openNew: openNew,
      openSop: openSop,
      backToLibrary: function () { leaveWorkspace(false); },
      saveDraft: function () { return saveDraft({ manual: true }); },
      submitVersion: submitVersion,
      approveVersion: approveVersion,
      openReject: openReject,
      confirmReject: confirmReject,
      makeEffective: makeEffective,
      newVersion: newVersion,
      launchAcks: launchAcks,
      switchVersion: switchVersion,
      switchTab: switchTab,
      setSearch: setSearch,
      setFilter: setFilter,
      setZoom: setZoom,
      togglePanel: togglePanel,
      onMetaChange: onMetaChange,
      run: run,
      applySelect: applySelect,
      gotoHeading: gotoHeading,
      openFind: openFind,
      closeFind: closeFind,
      findNext: findNext,
      replaceOne: replaceOne,
      replaceAll: replaceAll,
      applyTemplate: applyTemplate,
      printPreview: printPreview,
      copyCode: copyCode,
      addFormRow: addFormRow,
      removeFormRow: removeFormRow,
      saveForms: saveForms,
      openDeptAbbr: openDeptAbbr,
      pickRecommended: pickRecommended,
      saveAbbr: saveAbbr,
      editAbbrRow: editAbbrRow,
      removeAbbrRow: removeAbbrRow,
      /* test surface — the real functions, not copies */
      __test: {
        boot: renderApp,
        STATE: STATE, DOC: function () { return DOC; }, VIEW: function () { return VIEW; },
        setState: function (s) { STATE = s; }, setDoc: function (d) { DOC = d; }, setView: function (v) { VIEW = v; },
        collectHeader: collectHeader, collectMeta: collectMeta, validateHeaderForNew: validateHeaderForNew,
        roleComboOptions: roleComboOptions, ownerComboOptions: ownerComboOptions,
        categoryOptionsFor: categoryOptionsFor, deptAbbrevOf: deptAbbrevOf, normDept: normDept,
        refreshCodePreview: refreshCodePreview, renderLibrary: renderLibrary, renderWorkspace: renderWorkspace,
        saveDraft: saveDraft, applyTemplate: applyTemplate, run: run,
        setHistory: function (h) { HISTORY = h; }, getHistory: function () { return HISTORY; },
        relayout: relayout
      }
    };

    document.addEventListener('DOMContentLoaded', renderApp);
  })();
  </script>
</body>
</html>
