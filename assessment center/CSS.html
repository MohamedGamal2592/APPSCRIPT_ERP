<!-- Premium Fonts: Plus Jakarta Sans (Latin) & Cairo (Arabic) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Bootstrap 5 & Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

<style>
  /* ==========================================
     1. DESIGN TOKENS
     A single cohesive palette anchored on deep
     teal, replacing the generic indigo/rose/
     amber/sky "starter kit" combo. Every color
     below is tuned to hold readable contrast
     against both white cards and the page bg.
     ========================================== */
  :root {
    --bs-primary: #1f6f78;         /* Deep teal — brand anchor */
    --bs-primary-rgb: 31, 111, 120;
    --bs-primary-hover: #175961;
    --bs-primary-tint: #e8f2f2;    /* selected/hover backgrounds */
    --bs-primary-tint-border: #a9cdd0;

    --bs-success: #2f7a52;         /* Muted forest green */
    --bs-success-rgb: 47, 122, 82;
    --bs-danger: #b23b3b;          /* Muted brick red, not neon rose */
    --bs-danger-rgb: 178, 59, 59;
    --bs-warning: #a6690f;         /* Dark ochre — reads on white unlike bright amber */
    --bs-warning-rgb: 166, 105, 15;
    --bs-info: #3b6ea5;            /* Dusty slate-blue instead of bright sky */
    --bs-info-rgb: 59, 110, 165;

    --bs-body-bg: #f5f7f6;         /* Warm off-white, not cold slate */
    --bs-body-color: #1f2a30;      /* Rich near-black with slight warmth */
    --bs-border-color: #dde5e4;    /* Subtle borders */
    --bs-secondary-color: #55666d; /* Muted secondary text */

    --font-main: 'Plus Jakarta Sans', 'Cairo', system-ui, -apple-system, sans-serif;
    --shadow-sm: 0 1px 2px 0 rgba(15, 23, 22, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(15, 23, 22, 0.06), 0 2px 4px -2px rgba(15, 23, 22, 0.05);
    --shadow-lg: 0 10px 15px -3px rgba(15, 23, 22, 0.08), 0 4px 6px -4px rgba(15, 23, 22, 0.05);
    --shadow-xl: 0 20px 25px -5px rgba(15, 23, 22, 0.10), 0 8px 10px -6px rgba(15, 23, 22, 0.05);
  }

  /* ==========================================
     2. BASE TYPOGRAPHY & LAYOUT
     ========================================== */
  body {
    font-family: var(--font-main);
    background-color: var(--bs-body-bg);
    color: var(--bs-body-color);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    letter-spacing: -0.01rem;
  }

  /* ==========================================
     3. NAVBAR (Sleek, near-black, single accent)
     ========================================== */
  .navbar-dark.bg-primary {
    background-color: #14201f !important; /* warm near-black, pairs with teal */
    box-shadow: var(--shadow-md);
    padding: 0.75rem 1rem;
    backdrop-filter: blur(10px);
  }
  .navbar-dark .navbar-brand {
    font-weight: 800;
    letter-spacing: -0.02rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .navbar-dark .navbar-brand i {
    color: #4fa8ac; /* lighter teal so it reads on the dark bar */
    font-size: 1.5rem;
  }
  .navbar-dark .btn-outline-light {
    border-color: rgba(255,255,255,0.2);
    color: #cbd5d4;
    font-weight: 600;
    transition: all 0.2s ease;
  }
  .navbar-dark .btn-outline-light:hover {
    background-color: var(--bs-primary);
    border-color: var(--bs-primary);
    color: white;
  }
  .navbar-dark .btn-danger {
    background-color: var(--bs-danger);
    border-color: var(--bs-danger);
    font-weight: 600;
  }

  /* ==========================================
     4. CARDS (Soft, Elevated, Borderless)
     ========================================== */
  .card {
    background: #ffffff;
    border: 1px solid var(--bs-border-color);
    border-radius: 16px;
    box-shadow: var(--shadow-sm);
  }

  .dashboard-card {
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border: 1px solid var(--bs-border-color);
  }
  .dashboard-card:hover {
    transform: translateY(-6px);
    box-shadow: var(--shadow-xl);
    border-color: var(--bs-primary-tint-border);
  }
  .dashboard-card .card-body {
    padding: 1.5rem;
  }
  .dashboard-card i {
    transition: transform 0.3s ease;
  }
  .dashboard-card:hover i {
    transform: scale(1.1);
  }

  /* ==========================================
     5. BUTTONS (Pill-shaped, Tactile)
     ========================================== */
  .btn {
    font-weight: 600;
    border-radius: 10px;
    padding: 0.6rem 1.2rem;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn-lg {
    padding: 0.85rem 1.5rem;
    border-radius: 12px;
  }
  .btn-sm {
    padding: 0.4rem 0.8rem;
    border-radius: 8px;
  }

  /* Primary Button */
  .btn-primary {
    background-color: var(--bs-primary);
    border-color: var(--bs-primary);
    box-shadow: 0 2px 4px rgba(var(--bs-primary-rgb), 0.2);
  }
  .btn-primary:hover {
    background-color: var(--bs-primary-hover);
    border-color: var(--bs-primary-hover);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(var(--bs-primary-rgb), 0.3);
  }

  /* Outline Buttons */
  .btn-outline-primary {
    color: var(--bs-primary);
    border-color: var(--bs-primary);
  }
  .btn-outline-primary:hover {
    background-color: var(--bs-primary);
    border-color: var(--bs-primary);
    color: #fff;
    transform: translateY(-2px);
  }
  .btn-outline-secondary {
    color: var(--bs-secondary-color);
    border-color: var(--bs-border-color);
  }
  .btn-outline-secondary:hover {
    background-color: #eef2f1;
    color: var(--bs-body-color);
    border-color: var(--bs-border-color);
  }
  .btn-success {
    background-color: var(--bs-success);
    border-color: var(--bs-success);
  }
  .btn-danger {
    background-color: var(--bs-danger);
    border-color: var(--bs-danger);
  }

  /* ==========================================
     6. FORMS (Floating Labels, Subtle Focus)
     ========================================== */
  .form-control, .form-select {
    border-radius: 10px;
    border-color: var(--bs-border-color);
    padding: 0.75rem 1rem;
    font-weight: 500;
    background-color: #f8faf9;
    transition: all 0.2s ease;
  }
  .form-control:focus, .form-select:focus {
    background-color: #ffffff;
    border-color: var(--bs-primary);
    box-shadow: 0 0 0 4px rgba(var(--bs-primary-rgb), 0.12);
    color: var(--bs-body-color);
  }
  .form-floating > label {
    padding-left: 1rem;
    color: var(--bs-secondary-color);
  }
  .input-group-text {
    border-radius: 10px 0 0 10px;
    background-color: #eef2f1;
    border-color: var(--bs-border-color);
    color: var(--bs-secondary-color);
  }

  /* ==========================================
     7. TABLES (Clean, Spacious, Modern)
     ========================================== */
  .table {
    margin-bottom: 0;
    color: var(--bs-body-color);
  }
  .table > :not(caption) > * > * {
    padding: 1rem 1.25rem;
  }
  .table thead th {
    background-color: #f8faf9;
    border-bottom: 1px solid var(--bs-border-color);
    text-transform: uppercase;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--bs-secondary-color);
  }
  .table-hover tbody tr {
    transition: background-color 0.15s ease;
  }
  .table-hover tbody tr:hover {
    background-color: #eef2f1;
  }

  /* ==========================================
     8. BADGES & PROGRESS BARS
     ========================================== */
  .badge {
    font-weight: 600;
    padding: 0.5em 0.8em;
    border-radius: 6px;
  }
  /* Soft badge variants — readable on white, not neon */
  .badge.bg-primary-soft { background-color: var(--bs-primary-tint) !important; color: var(--bs-primary-hover) !important; }
  .badge.bg-success-soft { background-color: #e5f2ea !important; color: var(--bs-success) !important; }
  .badge.bg-danger-soft  { background-color: #f7e9e9 !important; color: var(--bs-danger) !important; }
  .badge.bg-warning-soft { background-color: #f6ebd9 !important; color: var(--bs-warning) !important; }
  .badge.bg-info-soft    { background-color: #e8eff6 !important; color: var(--bs-info) !important; }

  .progress {
    border-radius: 20px;
    background-color: var(--bs-border-color);
    height: 8px;
  }
  .progress-bar {
    border-radius: 20px;
    background-color: var(--bs-primary);
  }

  /* ==========================================
     9. ANIMATIONS & UTILITIES
     ========================================== */
  @keyframes pop-in {
    0% { transform: scale(0); opacity: 0; }
    70% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }
  .success-icon { animation: pop-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }

  .text-primary { color: var(--bs-primary) !important; }
  .text-muted { color: var(--bs-secondary-color) !important; }
  .bg-primary { background-color: var(--bs-primary) !important; }
  .btn-outline-light:hover { color: #fff; }
</style>
