    <!-- Bootstrap JS Bundle -->

    <script>
      function handleAddUser(event) {
        event.preventDefault();
        const token = localStorage.getItem('sessionToken');
        
        // If no token, redirect to login
        if (!token) {
          window.location.href = '<?= scriptUrl ?>?action=login';
          return;
        }

        // Removed the Password field from the payload as the backend ignores it 
        // and forces the user to set it on first login (Security Patch P3).
        const userData = {
          Name: document.getElementById('name').value,
          Email: document.getElementById('email').value,
          Phone: document.getElementById('phone').value,
          Department: document.getElementById('department').value,
          Position: document.getElementById('position').value,
          Type: document.getElementById('type').value
        };

        const btn = document.getElementById('submitBtn');
        btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Adding...';
        btn.disabled = true;

        google.script.run
          .withSuccessHandler(function(data) {
            const alertContainer = document.getElementById('alertContainer');
            let alertClass = data.status === 'success' ? 'alert-success' : 'alert-danger';
            
            alertContainer.className = 'alert ' + alertClass + ' d-flex align-items-center';
            alertContainer.innerHTML = '<i class="bi ' + (data.status === 'success' ? 'bi-check-circle-fill' : 'bi-exclamation-triangle-fill') + ' me-2"></i> ' + data.message;
            alertContainer.style.display = 'block';

            if (data.status === 'success') {
              document.getElementById('addUserForm').reset();
            }
            
            btn.innerHTML = '<i class="bi bi-check-circle-fill"></i> Add User / إضافة مستخدم';
            btn.disabled = false;
          })
                  .withFailureHandler(function(err) {
          document.getElementById('loadingSpinner').style.display = 'none';
          document.getElementById('tableContainer').style.display = 'block';
          
          // SECURITY: If backend says Unauthorized/Forbidden, kick them out!
          if (err.message.includes('Unauthorized') || err.message.includes('Forbidden') || err.message.includes('Session expired')) {
            localStorage.removeItem('sessionToken');
            localStorage.removeItem('userName');
            window.location.href = scriptUrl + '?action=login';
            return;
          }
          
          document.getElementById('tableBody').innerHTML = `<tr><td colspan="6" class="text-center text-danger p-4">Server Error: ${err.message}</td></tr>`;
        })
          .uiAddUser(token, userData);
      }
    </script>
