<!DOCTYPE html>
<html lang="en">
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>View Batches</title>
    <?!= include('CSS'); ?>
    <style>
      /* Ensure progress bar text is always centered and visible */
      .progress-text {
        font-weight: 700;
        font-size: 0.85rem;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        width: 100%;
      }
    </style>
  </head>
  <body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
      <div class="container">
        <a class="navbar-brand" href="<?= scriptUrl ?>?action=dashboard">
          <i class="bi bi-mortarboard-fill"></i> Assessment Platform
        </a>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a href="<?= scriptUrl ?>?action=dashboard" class="btn btn-outline-light btn-sm">
                <i class="bi bi-arrow-left"></i> Back to Dashboard
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container mt-4 mb-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="mb-0 text-primary"><i class="bi bi-layers-fill"></i> Assessment Batches / دفعات التقييم</h3>
      </div>

      <!-- Filter Card -->
      <div class="card shadow-sm border-0 rounded-3 mb-3">
        <div class="card-body p-3">
          <div class="row g-2 align-items-center">
            <div class="col-md-6">
              <div class="input-group">
                <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
                <input type="text" id="searchInput" class="form-control border-start-0" placeholder="Search by Company, Token, or Assessment...">
              </div>
            </div>
            <div class="col-md-3">
              <select id="companyFilter" class="form-select">
                <option value="">All Companies / كل الشركات</option>
              </select>
            </div>
            <div class="col-md-3">
              <select id="statusFilter" class="form-select">
                <option value="">All Statuses / كل الحالات</option>
                <option value="true">Active</option>
                <option value="false">Inactive</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <div class="card shadow-sm border-0 rounded-3">
        <div class="card-body p-0">
          <!-- Loading Spinner -->
          <div id="loadingSpinner" class="text-center p-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted">Loading batches...</p>
          </div>

          <!-- Table -->
          <div id="tableContainer" style="display: none;">
            <table class="table table-hover mb-0 align-middle">
              <thead class="table-light">
                <tr>
                  <th>Company / Company</th>
                  <th>Assessment</th>
                  <th class="text-center">Usage (Slots)</th>
                  <th>Expires At</th>
                  <th class="text-center">Status</th>
                  <th class="text-center">Actions</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      const scriptUrl = '<?= scriptUrl ?>';
      const token = localStorage.getItem('sessionToken');
      if (!token) window.location.href = scriptUrl + '?action=login';

      let allBatches = [];
      let searchDebounce;

      // Fetch data on load (Passing token for P1 security)
      google.script.run
        .withSuccessHandler(function(data) {
          document.getElementById('loadingSpinner').style.display = 'none';
          document.getElementById('tableContainer').style.display = 'block';
          
          if (data.status === 'success') {
            allBatches = data.data;
            populateFilters(allBatches);
            applyFilters();
          } else {
            document.getElementById('tableBody').innerHTML = `<tr><td colspan="6" class="text-center text-danger p-4">Error: ${data.message}</td></tr>`;
          }
        })
        .withFailureHandler(function(err) {
          document.getElementById('loadingSpinner').style.display = 'none';
          document.getElementById('tableContainer').style.display = 'block';
          
          // SECURITY: If backend says Unauthorized/Forbidden, kick them out!
          if (err.message.includes('Unauthorized') || err.message.includes('Forbidden') || err.message.includes('Session expired')) {
            localStorage.removeItem('sessionToken');
            localStorage.removeItem('userName');
            window.location.href = scriptUrl + '?action=login';
            return;
          }
          
          document.getElementById('tableBody').innerHTML = `<tr><td colspan="6" class="text-center text-danger p-4">Server Error: ${err.message}</td></tr>`;
        })
        .uiGetBatches(token);

      // Populate Company Dropdown
      function populateFilters(batches) {
        const select = document.getElementById('companyFilter');
        const companies = [...new Set(batches.map(b => b.CompanyName).filter(Boolean))];
        companies.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c;
          opt.innerText = c;
          select.appendChild(opt);
        });
      }

      // Main Filter Logic
      function applyFilters() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        const company = document.getElementById('companyFilter').value;
        const status = document.getElementById('statusFilter').value;

        const filtered = allBatches.filter(b => {
          const matchSearch = !search || 
            (b.CompanyName || '').toLowerCase().includes(search) || 
            (b.Token || '').toLowerCase().includes(search) || 
            (b.AssessmentTitle || '').toLowerCase().includes(search);
          
          const matchCompany = !company || b.CompanyName === company;
          
          let matchStatus = true;
          if (status === 'true') matchStatus = b.IsActive === true || b.IsActive === 'true';
          if (status === 'false') matchStatus = b.IsActive === false || b.IsActive === 'false';

          return matchSearch && matchCompany && matchStatus;
        });

        renderTable(filtered);
      }

      // Event Listeners
      document.getElementById('searchInput').addEventListener('input', function() {
        clearTimeout(searchDebounce);
        searchDebounce = setTimeout(applyFilters, 200);
      });
      document.getElementById('companyFilter').addEventListener('change', applyFilters);
      document.getElementById('statusFilter').addEventListener('change', applyFilters);

      // Render Table
      function renderTable(batches) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        if (batches.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted p-4">No batches found. / لا توجد دفعات.</td></tr>';
          return;
        }

        batches.forEach(b => {
          const tr = document.createElement('tr');
          const isActive = b.IsActive === true || b.IsActive === 'true';
          const used = parseInt(b.UsedSlots) || 0;
          const max = parseInt(b.MaxCandidates) || 1;
          const usagePercent = Math.min((used / max) * 100, 100).toFixed(0);
          
          // Determine progress bar colors based on usage
          let barColor = '#4f46e5'; // Default Indigo
          let textColor = '#ffffff'; // White text
          
          if (used === 0) {
            barColor = '#e2e8f0'; // Light grey track
            textColor = '#64748b'; // Dark text for visibility
          } else if (usagePercent >= 100) {
            barColor = '#f43f5e'; // Red for full
          }

          // Format Date
          let expiryDate = 'N/A';
          if (b.ExpiresAt) {
            try { expiryDate = new Date(b.ExpiresAt).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }); } catch(e) {}
          }

          tr.innerHTML = `
            <td>
              <strong>${b.CompanyName || 'N/A'}</strong><br>
              <small class="text-muted">Token: ${b.Token || ''}</small>
            </td>
            <td>${b.AssessmentTitle || 'N/A'}</td>
            <td class="text-center">
              <div class="progress" style="height: 24px; min-width: 120px; background-color: #f1f5f9; border-radius: 6px;">
                <div class="progress-bar" role="progressbar" style="width: ${usagePercent}%; background-color: ${barColor}; border-radius: 6px;" aria-valuenow="${usagePercent}" aria-valuemin="0" aria-valuemax="100">
                  <span class="progress-text" style="color: ${textColor};">${used} / ${max}</span>
                </div>
              </div>
            </td>
            <td><small>${expiryDate}</small></td>
            <td class="text-center">
              ${isActive ? '<span class="badge bg-success">Active</span>' : '<span class="badge bg-secondary">Inactive</span>'}
            </td>
            <td class="text-center">
              <button class="btn btn-sm btn-outline-primary" onclick="copyLink('${b.Token}')">
                <i class="bi bi-clipboard"></i> Copy Link
              </button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }

      // Copy Link Helper
      function copyLink(token) {
        const link = scriptUrl + '?action=takeTest&token=' + token;
        navigator.clipboard.writeText(link).then(() => {
          alert('Candidate link copied to clipboard!');
        }).catch(err => {
          prompt('Copy this link:', link);
        });
      }
    </script>
  </body>
</html>
