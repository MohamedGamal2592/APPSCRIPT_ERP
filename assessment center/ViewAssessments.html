<!DOCTYPE html>
<html lang="en">
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>View Assessments</title>
    <?!= include('CSS'); ?>
  </head>
  <body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
      <div class="container">
        <a class="navbar-brand" href="<?= scriptUrl ?>?action=dashboard">
          <i class="bi bi-mortarboard-fill"></i> Assessment Platform
        </a>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a href="<?= scriptUrl ?>?action=dashboard" class="btn btn-outline-light btn-sm">
                <i class="bi bi-arrow-left"></i> Back to Dashboard
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container mt-4 mb-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="mb-0 text-primary"><i class="bi bi-table"></i> Current Assessments / التقييمات الحالية</h3>
      </div>

      <!-- Filter Card -->
      <div class="card shadow-sm border-0 rounded-3 mb-3">
        <div class="card-body p-3">
          <div class="row g-2 align-items-center">
            <div class="col-md-8">
              <div class="input-group">
                <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
                <input type="text" id="searchInput" class="form-control border-start-0" placeholder="Search by title or description...">
              </div>
            </div>
            <div class="col-md-4">
              <select id="categoryFilter" class="form-select">
                <option value="">All Categories / كل الفئات</option>
                <!-- Categories will be populated dynamically -->
              </select>
            </div>
          </div>
        </div>
      </div>

      <div class="card shadow-sm border-0 rounded-3">
        <div class="card-body p-0">
          <!-- Loading Spinner -->
          <div id="loadingSpinner" class="text-center p-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted">Loading assessments...</p>
          </div>

          <!-- Table -->
          <div id="tableContainer" style="display: none;">
            <table class="table table-hover mb-0">
              <thead class="table-light">
                <tr>
                  <th>Title / العنوان</th>
                  <th>Category / الفئة</th>
                  <th>Time (Mins) / الوقت</th>
                  <th>Pass % / النجاح</th>
                  <th>Status / الحالة</th>
                  <th class="text-center">Actions / إجراءات</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      const scriptUrl = '<?= scriptUrl ?>';
      const token = localStorage.getItem('sessionToken');
      if (!token) window.location.href = scriptUrl + '?action=login';

      let allAssessments = []; // Global variable to hold all data for fast filtering
      let searchDebounce; // Variable for debouncing the search input

      // Fetch data on load (Passing token for P1 security)
      google.script.run
        .withSuccessHandler(function(data) {
          document.getElementById('loadingSpinner').style.display = 'none';
          document.getElementById('tableContainer').style.display = 'block';
          
          if (data.status === 'success') {
            allAssessments = data.data; // Store all data globally
            populateCategoryFilter(allAssessments);
            applyFilters(); // Initial render
          } else {
            document.getElementById('tableBody').innerHTML = `<tr><td colspan="6" class="text-center text-danger p-4">Error: ${data.message}</td></tr>`;
          }
        })
        .withFailureHandler(function(err) {
          document.getElementById('loadingSpinner').style.display = 'none';
          document.getElementById('tableContainer').style.display = 'block';
          
          // SECURITY: If backend says Unauthorized/Forbidden, kick them out!
          if (err.message.includes('Unauthorized') || err.message.includes('Forbidden') || err.message.includes('Session expired')) {
            localStorage.removeItem('sessionToken');
            localStorage.removeItem('userName');
            window.location.href = scriptUrl + '?action=login';
            return;
          }
          
          document.getElementById('tableBody').innerHTML = `<tr><td colspan="6" class="text-center text-danger p-4">Server Error: ${err.message}</td></tr>`;
        })
        .uiGetAssessments(token);

      // Dynamically populate the Category Dropdown
      function populateCategoryFilter(assessments) {
        const select = document.getElementById('categoryFilter');
        const categories = [...new Set(assessments.map(a => a.Category).filter(Boolean))]; // Get unique categories
        categories.forEach(cat => {
          const opt = document.createElement('option');
          opt.value = cat;
          opt.innerText = cat;
          select.appendChild(opt);
        });
      }

      // The main filter function (Runs instantly on input)
      function applyFilters() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        const category = document.getElementById('categoryFilter').value;

        const filtered = allAssessments.filter(a => {
          const title = (a.Title || '').toLowerCase();
          const desc = (a.Description || '').toLowerCase();
          const cat = a.Category || '';

          const matchSearch = !search || title.includes(search) || desc.includes(search);
          const matchCat = !category || cat === category;

          return matchSearch && matchCat;
        });

        renderTable(filtered);
      }

      // Event Listeners for Filters
      document.getElementById('searchInput').addEventListener('input', function() {
        // Debounce: wait 200ms after the user stops typing to filter
        clearTimeout(searchDebounce);
        searchDebounce = setTimeout(applyFilters, 200);
      });
      document.getElementById('categoryFilter').addEventListener('change', applyFilters);

      // Render the table rows
      function renderTable(assessments) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        if (assessments.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted p-4">No assessments match your filters. / لا توجد نتائج مطابقة.</td></tr>';
          return;
        }

        assessments.forEach(a => {
          const tr = document.createElement('tr');
          const isActive = a.IsActive === 'true' || a.IsActive === true;
          
          tr.innerHTML = `
            <td><strong>${a.Title || ''}</strong><br><small class="text-muted">${a.Description || ''}</small></td>
            <td><span class="badge bg-info text-dark">${a.Category || ''}</span></td>
            <td>${a.TimeLimitMinutes || 0}</td>
            <td>${a.PassScore || 0}%</td>
            <td>
              ${isActive ? '<span class="badge bg-success">Active</span>' : '<span class="badge bg-secondary">Inactive</span>'}
            </td>
            <td class="text-center">
              <button class="btn btn-sm btn-outline-primary" onclick="printAssessment('${a.AssessmentID}')">
                <i class="bi bi-printer-fill"></i> Print
              </button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }

      // Print Logic (Updated to use secure admin endpoint)
      function printAssessment(id) {
        const printWindow = window.open('', '_blank', 'width=800,height=600');
        printWindow.document.write('<html><head><title>Loading...</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="p-5 text-center"><div class="spinner-border text-primary"></div><p>Loading assessment details...</p></body></html>');

        google.script.run
          .withSuccessHandler(function(data) {
            if (data.status === 'success') {
              generatePrintContent(printWindow, data.assessment, data.questions);
            } else {
              printWindow.document.body.innerHTML = '<div class="alert alert-danger m-5">' + data.message + '</div>';
            }
          })
          .withFailureHandler(function(err) {
            printWindow.document.body.innerHTML = '<div class="alert alert-danger m-5">Error: ' + err.message + '</div>';
          })
          .uiGetAssessmentDetailsForAdmin(token, id);
      }

      function generatePrintContent(printWindow, assessment, questions) {
        const isActive = assessment.IsActive === 'true' || assessment.IsActive === true;

        let html = `
          <html>
          <head>
            <title>${assessment.Title}</title>
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
            <style>
              body { font-family: Arial, sans-serif; padding: 40px; }
              .question-box { border: 1px solid #eee; padding: 15px; margin-bottom: 15px; border-radius: 5px; }
              .options-list { list-style-type: upper-alpha; padding-left: 20px; margin-top: 10px; }
              @media print {
                .no-print { display: none; }
                .question-box { page-break-inside: avoid; }
              }
            </style>
          </head>
          <body>
            <div class="d-flex justify-content-between align-items-center mb-4">
              <h2>${assessment.Title}</h2>
              <button class="btn btn-primary no-print" onclick="window.print()"><i class="bi bi-printer"></i> Print Now</button>
            </div>

            <div class="row mb-4">
              <div class="col-md-8">
                <p><strong>Category:</strong> ${assessment.Category}</p>
                <p><strong>Description:</strong> ${assessment.Description || 'N/A'}</p>
              </div>
              <div class="col-md-4 text-end">
                <p><strong>Time Limit:</strong> ${assessment.TimeLimitMinutes} Mins</p>
                <p><strong>Pass Score:</strong> ${assessment.PassScore}%</p>
                <p><strong>Status:</strong> ${isActive ? 'Active' : 'Inactive'}</p>
              </div>
            </div>

            <hr>

            <h4>Questions / الأسئلة</h4>
        `;

        questions.forEach((q, index) => {
          html += `<div class="question-box">`;
          html += `<p><strong>Q${index + 1}.</strong> ${q.QuestionText} <span class="text-muted small">(${q.QuestionType})</span></p>`;

          if (q.OptionsArray && q.OptionsArray.length > 0) {
            html += `<ol class="options-list">`;
            q.OptionsArray.forEach(opt => {
              let isCorrect = q.CorrectAnswer && opt === q.CorrectAnswer;
              html += `<li>${opt} ${isCorrect ? '<span class="text-success fw-bold">(Correct)</span>' : ''}</li>`;
            });
            html += `</ol>`;
          } else if (q.QuestionType === 'OpenText') {
            html += `<p class="text-muted fst-italic">[ Open Text Answer ]</p>`;
          }

          if (q.Trait) {
            html += `<p class="small text-muted mt-2"><em>Trait: ${q.Trait} | Weight: ${q.Weight}</em></p>`;
          }
          html += `</div>`;
        });

        html += `</body></html>`;

        printWindow.document.open();
        printWindow.document.write(html);
        printWindow.document.close();
      }
    </script>
  </body>
</html>
