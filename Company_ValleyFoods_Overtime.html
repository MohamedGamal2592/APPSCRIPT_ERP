<body>
  <div id="vf-root"></div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var SESSION_TOKEN = params.get('sessionToken') || (API.getSession() || {}).token || '';
    var scriptUrl = window.scriptUrl || '/';
    var IS_SUPER_ADMIN = <?!= user && user.isSuperAdmin ? 'true' : 'false' ?>;
    var COMPANY_LOGO_URL = '<?!= getCompanyLogoUrl_('9940659bd83035d7') ?>';
    var COMPANY_PAGES = <?!= companyPages ?>;
    var CURRENT_ACTION = '<?!= currentAction ?>';
    var USER_PAGES = <?!= user && user.isSuperAdmin ? 'null' : JSON.stringify((user && user.authorizedPages) || {}) ?>;
    var CAN_WRITE = UIC.canAdd_(); var CAN_FULL = UIC.canFull_();

    /* [live-notice D6] list replies from the device cache, trusted by the stamps */
    companyCall = UIC.Live.viewCache(companyCall, { company: '9940659bd83035d7', page: 'vf_hr_overtime', view: 'list', lists: ['get_overtime_data'] });
    function companyCall(moduleAction, data) {
      return API.call('company_action', {
        target_system: '9940659bd83035d7',
        module_action: moduleAction,
        data: data || {}
      }, SESSION_TOKEN);
    }

    function esc(v) {
      /* [UI-2.8 / U-36] Delegates to the shared formatter. This body used to
         carry its own replace-chain behind a `typeof FMT !== 'undefined'`
         guard, but Client_Helpers.html defines FMT in <head> before any page
         script runs, so that fallback was unreachable and the duplicate was
         pure drift risk. Output is identical for every input — proved in
         tools/verify/ui2_formatters.js. */
      return FMT.escape(v);
    }
    function todayStr() { return new Date().toISOString().slice(0, 10); }
    function fmtDate(v) {
      if (!v) return '';
      var d = (v instanceof Date) ? v : new Date(v);
      if (isNaN(d.getTime())) return String(v);
      var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    }
  </script>

  <script>
  (function () {
    var OT_TABLE_ID = 'ot-table';
    var empOptions = [];
    var roleOptions = [];
    /* Latest-PAGE_LIMIT window by default; عرض الكل loads the full history
       (same pattern as vf_hr_vacations). */
    var SHOW_ALL = false;
    var PAGE_LIMIT = 20;

    UIC.appShell('vf-root', {
      companyLogoUrl: COMPANY_LOGO_URL,
      companyLogoHref: scriptUrl + '?action=vf_dashboard&sessionToken=' + SESSION_TOKEN,
      companyLogoTitle: 'Valley Foods',
      breadcrumb: 'Valley Foods / شؤون الموظفين / العمل الإضافي',
      contentId: 'vf-ot-content',
      menuGroups: (window.VALLEYFOODS_MENU || [])
    });

    var content = document.getElementById('vf-ot-content');
    if (!content) return;

    function renderToolbar() {
      var html = '<div id="ot-toolbar" style="margin-bottom:12px;display:flex;gap:8px;align-items:center;">';
      if (SHOW_ALL) {
        html += '<button type="button" class="btn btn-outline" onclick="OT_PAGE.showLatest()">عرض الأحدث (' + PAGE_LIMIT + ')</button>';
      }
      if (CAN_WRITE) {
        html += '<button id="ot-add-btn" class="btn btn-primary" onclick="OT_PAGE.openAddModal()">إضافة عمل إضافي</button>';
      }
      html += '<input id="ot-search" type="text" class="form-control" placeholder="بحث..." style="max-width:260px;margin-right:auto;" oninput="OT_PAGE.filter(this.value)">';
      html += '</div>';
      html += '<div id="ot-table-wrap"></div>';
      content.innerHTML = html;
    }

    function buildTable(rows) {
      var cols = [
        { key: 'emp_id', label: 'الكود' },
        { key: 'name_ar', label: 'الاسم' },
        { key: 'date', label: 'التاريخ' },
        { key: 'start_time', label: 'من' },
        { key: 'end_time', label: 'إلى' },
        { key: 'overtime_hours', label: 'الساعات' },
        { key: 'overtime_name', label: 'النوع' },
        { key: 'amount', label: 'المبلغ' },
        { key: 'details', label: 'التفاصيل' },
        { key: 'overtime_attachement', label: 'المرفق' }
      ];

      function viewAttachment(ref, id){
        if(!ref && (id == null || String(id) === '')) return;
        UIC.openDownload(scriptUrl + '?download=attachment&page=vf_hr_overtime&ref=' + encodeURIComponent(ref || '') + ((id != null && String(id) !== '') ? '&id=' + encodeURIComponent(id) : '') + '&sessionToken=' + encodeURIComponent(SESSION_TOKEN),
          'فتح المرفق');
      }
      window._vfViewAttachment = viewAttachment;

      var headers = cols.map(function (c) { return c.label; });
      headers.push('إجراءات / Actions');
      var tableRows = rows.map(function (r) {
        var rowCells = cols.map(function (c) {
          var val = r[c.key];
          if (c.key === 'date') return fmtDate(val);
          if (c.key === 'start_time' || c.key === 'end_time') return fracToTime(val) || '-';
          if (c.key === 'amount') return (val != null) ? Number(val).toFixed(2) : '-';
          if (c.key === 'overtime_attachement') return val ? esc(String(val).split('/').pop()) : '-';
          return val != null ? val : '';
        });
        var hasAtt = !!r.overtime_attachement;
        var actions = UIC.actionDropdown([
          { label: '👁️ عرض / View', onclick: "OT_PAGE.viewOvertimeById('" + esc(r.unique_id||r.emp_id+'_'+r.date).replace(/\'/g, "\\\'") + "')" },
          hasAtt ? { label: '📎 عرض المرفق / View Attachment', onclick: "OT_PAGE.viewAttachment('" + esc(r.overtime_attachement).replace(/\'/g, "\\\'") + "','" + esc(r.unique_id||'').replace(/\'/g, "\\\'") + "')" } : null,
          { label: '🖨️ طباعة / Print', onclick: "OT_PAGE.printRow('" + esc(r.unique_id||'').replace(/\'/g, "\\\'") + "')" },
          IS_SUPER_ADMIN ? { label: '✏️ تعديل / Edit', onclick: "OT_PAGE.openEditModal('" + esc(r.unique_id||'').replace(/\'/g, "\\\'") + "')" } : null,
          IS_SUPER_ADMIN ? { label: '🗑️ حذف / Delete', color: '#dc2626', onclick: "OT_PAGE.deleteRow('" + esc(r.unique_id).replace(/\'/g, "\\\'") + "')" } : null
        ].filter(Boolean));
        rowCells.push(actions);
        /* Row-edit repair 2.2: carry the stable record key on the row array
           itself, so clicks resolve by unique_id after sorting/filtering/paging
           rebuild the tbody (positional indexes go stale on re-render). */
        rowCells.__uid = r.unique_id || '';
        return rowCells;
      });

      document.getElementById('ot-table-wrap').innerHTML = UIC.dataTable(OT_TABLE_ID, {
        /* [RT-1] The list endpoint caps at the newest rows unless `loadAll` is
           passed, and the search box filters only what is in memory — so the
           table says which records the box actually searches. */
        truncated: !SHOW_ALL,
        showAll: SHOW_ALL ? null : 'OT_PAGE.showAll()',
        headers: headers,
        rows: tableRows
      });

      UIC.initTableSort(OT_TABLE_ID);

      setTimeout(function () {
        var trs = document.querySelectorAll('#' + OT_TABLE_ID + ' tbody tr');
        var st = (window.__dtStore || {})[OT_TABLE_ID];
        var view = (st && st.pageRows) || rows;
        trs.forEach(function (tr, i) {
          tr.style.cursor = 'pointer';
          tr.addEventListener('click', function (ev) {
            /* Row-edit repair 2.2: ignore clicks on interactive descendants
               (the shared menu already stops propagation; this guards direct
               buttons/inputs inside cells), then resolve by stable record key.
               view holds the rendered cell-arrays (each carries __uid); rows
               holds the data rows in build order as a last-resort fallback. */
            if (ev && ev.target && ev.target.closest && ev.target.closest('button,a,input,select,textarea,.action-dropdown,.combo-list,.combo')) return;
            var row = null;
            var di = tr.getAttribute('data-idx');
            var cellRow = (di != null && di !== '' && view[Number(di)]) ? view[Number(di)] : null;
            var uid = (cellRow && cellRow.__uid) || '';
            if (uid) row = (OT_PAGE._allRows || []).find(function (x) { return String(x.unique_id) === String(uid); });
            if (!row && rows[i]) row = rows[i];
            if (row) OT_PAGE.viewOvertime(row);
          });
        });
      }, 100);
    }

    function filterRows(q) {
      q = (q || '').toLowerCase();
      if (!q) return OT_PAGE._allRows || [];
      return (OT_PAGE._allRows || []).filter(function (r) {
        return (r.emp_id || '').toLowerCase().indexOf(q) !== -1 ||
               (r.name_ar || '').toLowerCase().indexOf(q) !== -1 ||
               (r.overtime_name || '').toLowerCase().indexOf(q) !== -1 ||
               (r.details || '').toLowerCase().indexOf(q) !== -1;
      });
    }

    function renderBody() {
      var body = '<form id="ot-form">';
      body += '<div id="ot-f-emp-wrap"></div>';
      body += '<div id="ot-f-date-wrap"></div>';
      body += '<div id="ot-f-type-wrap"></div>';
      body += '<div id="ot-f-time-wrap" style="display:flex;gap:12px;"><div id="ot-f-start-wrap" style="flex:1;"></div><div id="ot-f-end-wrap" style="flex:1;"></div></div>';
      body += '<div id="ot-f-amount-wrap"></div>';
      body += '<div id="ot-f-details-wrap"></div>';
      body += '<div id="ot-f-file-wrap"></div>';
      body += '</form>';
      return body;
    }

    // — Instant-upload (Option A): pre-bound on selection; legacy on-save fallback —
    function uploadSelectedFile(formEl, meta){
      try {
        if (window.UIC && UIC.UploadSet) {
          var inp0 = formEl.querySelector('input[type=file]');
          var b0 = inp0 ? UIC.UploadSet.getBound(inp0) : null;
          if (b0 && b0.ref) return Promise.resolve({ reference: b0.ref, fileId: b0.id || '' });
          if (inp0 && !(inp0.files && inp0.files[0])) return Promise.resolve(null);
        }
      } catch (e) {}
      var input = formEl.querySelector('input[type=file]');
      if (!input || !input.files || !input.files[0]) return Promise.resolve(null);
      var file = input.files[0];
      return new Promise(function(resolve, reject){
        var reader = new FileReader();
        reader.onerror = function(){ reject(new Error('خطأ في قراءة الملف')); };
        reader.onload = function(){
          var b64 = String(reader.result||'').split(',')[1]||'';
          companyCall('add_upload_file', { sheet: meta.sheet, filename: file.name, base64: b64 })
            .then(function(res){ if(res && res.status==='success') resolve({ reference: res.reference, fileId: res.fileId || '' }); else reject(new Error((res&&res.message)||'خطأ في رفع الملف')); })
            .catch(function(err){ reject(new Error((err&&err.message)||'خطأ في رفع الملف')); });
        };
        reader.readAsDataURL(file);
      });
    }

    // — Form uses DIRECT keys like TopChemical (emp_id, date, overtime_type, start_time, end_time, amount, details) so UIC.collectForm maps 1:1 to backend —
    // Searchable employee: UIC.combo filters by label (code — name_ar) client-side, stores value=emp_id
    function buildModalFields(prefill) {
      var data = prefill || {};

      // searchable employee — placeholder emphasizes search + stores emp_id
      document.getElementById('ot-f-emp-wrap').innerHTML = UIC.combo({
        key: 'emp_id',
        label: 'الموظف (ابحث بالاسم أو الكود)',
        required: true,
        placeholder: 'اكتب للبحث…',
        options: _empList().map(function (o) {
          return { value: o.value, label: o.label };
        }),
        value: data.emp_id || ''
      });

      document.getElementById('ot-f-date-wrap').innerHTML = UIC.field({
        key: 'date',
        label: 'التاريخ',
        type: 'date',
        required: true,
        value: data.date || todayStr()
      });

      var typeOptions = _roleList().map(function (o) {
        return { value: o.value, label: o.label, moneyRelated: o.moneyRelated, vacationDays: o.vacationDays, rate: o.rate };
      });

      document.getElementById('ot-f-type-wrap').innerHTML = UIC.combo({
        key: 'overtime_type',
        label: 'نوع العمل الإضافي',
        required: true,
        placeholder: 'اختر النوع',
        options: typeOptions,
        value: data.overtime_type || ''
      });

      document.getElementById('ot-f-start-wrap').innerHTML = UIC.field({
        key: 'start_time',
        label: 'من',
        type: 'time',
        required: true,
        value: data.start_time || '17:00'
      });

      document.getElementById('ot-f-end-wrap').innerHTML = UIC.field({
        key: 'end_time',
        label: 'إلى',
        type: 'time',
        required: true,
        value: data.end_time || '18:00'
      });

      var selectedType = null;
      if (data.overtime_type) {
        selectedType = _roleList().find(function (o) { return String(o.value) === String(data.overtime_type); }) || null;
      }

      var isMoney = _isMoneyRole(selectedType);
      document.getElementById('ot-f-amount-wrap').innerHTML = UIC.field({
        key: 'amount',
        label: 'المبلغ (مطلوب للنوع النقدي)',
        type: 'number',
        required: !!isMoney,
        value: data.amount || '',
        min: '0.01',
        step: '0.01',
        disabled: !isMoney
      });

      document.getElementById('ot-f-details-wrap').innerHTML = UIC.field({
        key: 'details',
        label: 'التفاصيل',
        type: 'textarea',
        required: true,
        value: data.details || ''
      });

      document.getElementById('ot-f-file-wrap').innerHTML = UIC.fileField({
        key: 'file',
        label: 'المرفق (مطلوب)',
        required: !(OT_PAGE._editingAtt && OT_PAGE._editingAtt.ref),
        accept: '.pdf,.doc,.docx,.png,.jpg,.jpeg',
        instant: true, sheet: 'valley_emp_overtime', field: 'overtime_attachement', formModalId: 'ot-modal'
      });
      try { UIC.trackDirty('ot-form'); } catch (eT) {}

      var timeWrap = document.getElementById('ot-f-time-wrap');
      var amountWrap = document.getElementById('ot-f-amount-wrap');
      var startInputInit = document.getElementById('start_time');
      var endInputInit = document.getElementById('end_time');
      var amountInputInit = document.getElementById('amount');
      if (isMoney) {
        if (timeWrap) timeWrap.style.display = 'none';
        if (amountWrap) amountWrap.style.display = '';
        if (startInputInit) { startInputInit.value = ''; startInputInit.removeAttribute('required'); }
        if (endInputInit) { endInputInit.value = ''; endInputInit.removeAttribute('required'); }
        if (amountInputInit) { amountInputInit.setAttribute('required', 'required'); amountInputInit.disabled = false; }
      } else {
        if (timeWrap) timeWrap.style.display = '';
        if (amountWrap) amountWrap.style.display = 'none';
        if (amountInputInit) { amountInputInit.value = ''; amountInputInit.removeAttribute('required'); amountInputInit.disabled = true; }
      }

      /* UIC.combo stores the selected value in this hidden input and dispatches
         change on it. Binding to the old data-field-key selector never fired
         because that attribute is not part of the combo markup. */
      var typeCombo = document.getElementById('overtime_type');
      if (typeCombo) {
        typeCombo.addEventListener('change', function () {
          var val = typeCombo.value;
          var match = _roleList().find(function (o) { return String(o.value) === String(val); });
          var isM = _isMoneyRole(match);
          var tw = document.getElementById('ot-f-time-wrap');
          var aw = document.getElementById('ot-f-amount-wrap');
          var startInput = document.getElementById('start_time');
          var endInput = document.getElementById('end_time');
          var amountInput = document.getElementById('amount');
          if (isM) {
            if (tw) tw.style.display = 'none';
            if (aw) aw.style.display = '';
            if (startInput) { startInput.value = ''; startInput.removeAttribute('required'); }
            if (endInput) { endInput.value = ''; endInput.removeAttribute('required'); }
            if (amountInput) { amountInput.setAttribute('required', 'required'); amountInput.disabled = false; }
          } else {
            if (tw) tw.style.display = '';
            if (aw) aw.style.display = 'none';
            if (startInput) startInput.setAttribute('required', 'required');
            if (endInput) endInput.setAttribute('required', 'required');
            if (amountInput) { amountInput.removeAttribute('required'); amountInput.value = ''; amountInput.disabled = true; }
          }
        });
      }
    }

    /* Row-edit repair (Stage 3): explicit create/edit mode. OT_PAGE._editingUid
       holds the edited unique_id, OT_PAGE._editingAtt the retained attachment
       pair; both are null in Add mode. Augmented option lists retain stored
       inactive employee/type selections without polluting the shared globals. */
    function _empList() { return OT_PAGE._editEmps || empOptions; }
    function _roleList() { return OT_PAGE._editRoles || roleOptions; }
    function _isMoneyRole(role) {
      if (!role) return false;
      var flag = role.moneyRelated;
      return flag === true || flag === 1 || String(flag).trim().toLowerCase() === 'true' || String(flag).trim() === '1';
    }
    function fracToTime(v) {
      if (v == null || v === '') return '';
      /* The sheet stores times as a day fraction, but hands them back either
         as that fraction or as a full Date (30/12/1899 + time) — both must
         render as HH:MM, never the long datetime string. */
      if (v instanceof Date) {
        if (isNaN(v.getTime())) return '';
        var hh = v.getHours(), mm0 = v.getMinutes();
        return (hh < 10 ? '0' : '') + hh + ':' + (mm0 < 10 ? '0' : '') + mm0;
      }
      var s = String(v).trim();
      if (!s || s === '-') return '';
      var m = s.match(/(\d{1,2}):(\d{2})/);
      if (m) return (m[1].length < 2 ? '0' + m[1] : m[1]) + ':' + m[2];
      var n = Number(s);
      if (!isNaN(n)) {
        var frac = ((n % 1) + 1) % 1;
        var mins = Math.round(frac * 24 * 60) % 1440;
        var h = Math.floor(mins / 60), mm = mins % 60;
        return (h < 10 ? '0' : '') + h + ':' + (mm < 10 ? '0' : '') + mm;
      }
      return '';
    }

    function openModal(prefill, title) {
      var modalId = 'ot-modal';
      UIC.openModal(modalId, {
        title: title || 'إضافة عمل إضافي',
        body: renderBody(),
        onSave: 'OT_PAGE.saveOvertime()'
      });
      buildModalFields(prefill);
      try { UIC.trackDirty('ot-form'); } catch (e4) {}
    }

    function openEditModal(uid) {
      if (!UIC.canFull_()) { UIC.toast('غير مصرح / Not authorized', 'error'); return; }
      var row = (OT_PAGE._allRows || []).find(function (x) { return String(x.unique_id) === String(uid); });
      if (!row) { UIC.toast('السجل غير موجود — تم تحديث القائمة', 'error'); loadData(true); return; }
      var emps = empOptions.slice();
      if (row.emp_id && !emps.some(function (o) { return String(o.value) === String(row.emp_id); })) {
        emps.push({ value: row.emp_id, label: (row.name_ar || row.emp_id) + ' (غير نشط)' });
      }
      var roles = roleOptions.slice();
      var typeMatch = roles.find(function (o) { return String(o.value) === String(row.overtime_type); });
      if (row.overtime_type && !typeMatch) {
        roles.push({ value: row.overtime_type, label: (row.overtime_name || row.overtime_type) + ' (غير نشط)', moneyRelated: Number(row.amount) > 0 });
      }
      OT_PAGE._editEmps = emps;
      OT_PAGE._editRoles = roles;
      OT_PAGE._editingUid = String(row.unique_id);
      OT_PAGE._editingAtt = { ref: row.overtime_attachement || '', id: row.overtime_attachement_id || '' };
      openModal({
        emp_id: row.emp_id,
        date: fmtDate(row.date),
        overtime_type: row.overtime_type,
        start_time: fracToTime(row.start_time),
        end_time: fracToTime(row.end_time),
        amount: (row.amount != null && row.amount !== '') ? row.amount : '',
        details: row.details || ''
      }, 'تعديل عمل إضافي');
      try {
        if (OT_PAGE._editingAtt && OT_PAGE._editingAtt.ref && UIC.UploadSet) UIC.UploadSet.setBound('file', OT_PAGE._editingAtt.ref, OT_PAGE._editingAtt.id || '');
      } catch (eB) {}
      /* Existing attachment stays valid without re-upload: the file input is
         optional in edit mode, and the current file is shown for reference. */
      try {
        var fw = document.getElementById('ot-f-file-wrap');
        if (fw && OT_PAGE._editingAtt.ref) {
          var note = document.createElement('div');
          note.style.cssText = 'font-size:12px;color:var(--text-muted);margin-top:4px;';
          note.textContent = 'المرفق الحالي: ' + String(OT_PAGE._editingAtt.ref).split('/').pop() + ' — اترك حقل الملف فارغاً للاحتفاظ به';
          fw.appendChild(note);
        }
      } catch (e) {}
    }

    function saveOvertime() {
      // TC-style: validate, then TC-like amount guard, then instant pre-bound ref
      var formId = 'ot-form';
      if (!UIC.validateForm(formId)) return;
      var data = UIC.collectForm(formId);
      // keep conditional: money types require amount (mirrors backend 1461)
      var selType = data.overtime_type;
      var _rl = _roleList();
      var match = null;
      for(var i=0;i<_rl.length;i++){ if(String(_rl[i].value)===String(selType)){ match=_rl[i]; break; } }
      var isMoney = _isMoneyRole(match);
      if (isMoney) {
        data.start_time = '';
        data.end_time = '';
      } else {
        data.amount = '';
      }
      if (isMoney && !(Number(data.amount) > 0)) {
        UIC.toast('المبلغ مطلوب لهذا النوع', 'error');
        return;
      }
      if (!isMoney && (!data.start_time || !data.end_time)) {
        UIC.toast('وقت البداية والنهاية مطلوب', 'error');
        return;
      }
      // normalize amount numeric (TC does Number()||0)
      if (data.amount) data.amount = parseFloat(data.amount) || 0;

      var formEl = document.getElementById('ot-form');
      var editingUid = OT_PAGE._editingUid || null;
      var doSaveOT = function () {
        /* Option A instant-upload: pre-bound ref; required check kept. */
        try {
          var input = formEl ? formEl.querySelector('input[type=file]') : null;
          var bound = (input && UIC.UploadSet) ? UIC.UploadSet.getBound(input) : null;
          if (bound && bound.ref) {
            data.overtime_attachement = bound.ref;
            if (bound.id) data.overtime_attachement_id = bound.id;
          } else if (editingUid && OT_PAGE._editingAtt) {
            if (OT_PAGE._editingAtt.ref) data.overtime_attachement = OT_PAGE._editingAtt.ref;
            if (OT_PAGE._editingAtt.id) data.overtime_attachement_id = OT_PAGE._editingAtt.id;
          }
        } catch (e) {}
        /* Required attachment: add-mode needs a bound file; edit-mode may
           retain the existing one. */
        if (!data.overtime_attachement || String(data.overtime_attachement).trim() === '') {
          UIC.toast('المرفق مطلوب', 'error');
          try { UIC.setFieldError('file', 'المرفق مطلوب'); } catch (e2) {}
          return;
        }
          /* Keyed refresh (3.9): the server record replaces the row with the
             same unique_id, so an edit never duplicates and list context
             (search text, scroll) survives; a missing record reloads. */
          var afterSave = function (res) {
              var rec = (res && res.record) || null;
              if (rec) {
                if (!OT_PAGE._allRows) OT_PAGE._allRows = [];
                var idxOT = OT_PAGE._allRows.findIndex(function(x){ return String(x.unique_id)===String(rec.unique_id); });
                if (idxOT!==-1) OT_PAGE._allRows[idxOT]=rec; else OT_PAGE._allRows.unshift(rec);
                /* In latest-window mode the view holds PAGE_LIMIT rows; in عرض الكل
                   mode it holds everything, so nothing is dropped. */
                if (!SHOW_ALL && OT_PAGE._allRows.length>PAGE_LIMIT) OT_PAGE._allRows.pop();
                buildTable(OT_PAGE._allRows);
              } else { loadData(true); }
          };
          if (editingUid) {
            data.unique_id = editingUid;
            return UIC.Live.save({
              call: companyCall,
              action: 'update_overtime',
              data: data,
              modal: 'ot-modal',
              message: 'تم تحديث العمل الإضافي',
              queueable: false,
              reload: function () { loadData(true); },
              onSuccess: afterSave
            }).catch(function () { /* UIC.Live has toasted */ });
          }
          /* Tier B: the 2-table handler (duplicate-timing guard refuses for
             reasons invisible in the form) — so NO draft is painted: canPatch
             stays false, only the quiet corner hint shows, and the row is
             patched from the reply instead. A refusal toasts exactly as before
             and never paints a row. The file upload is a real round trip and
             stays in front of the save. queueable:false: I1 is unproven for
             add_overtime, so a transport failure rolls back loudly. */
          return UIC.Live.save({
            call: companyCall,
            action: 'add_overtime',
            data: data,
            modal: 'ot-modal',
            message: 'تم الحفظ بنجاح',
            queueable: false,
            reload: function () { loadData(true); },
            onSuccess: afterSave
          }).catch(function () { /* UIC.Live has toasted */ });
      };
      try {
        if (window.UIC && UIC.UploadSet && UIC.UploadSet.isBusy('ot-modal')) {
          UIC.toast('جاري رفع الملف... يرجى الانتظار', 'warning');
          UIC.UploadSet.awaitPending('ot-modal').then(doSaveOT);
          return;
        }
      } catch (eB) {}
      doSaveOT();
    }

    /* quiet: refresh in the background with no blocking overlay, for a
       user who has already seen the change and must not be interrupted
       to confirm it. */
    function loadData(quiet) {
      if (!quiet) UI.showSpinner();
      companyCall('get_overtime_data', SHOW_ALL ? { loadAll: true } : { limit: PAGE_LIMIT })
        .then(function (res) {
          OT_PAGE._allRows = res.rows || [];
          empOptions = res.employee_options || [];
          roleOptions = res.role_options || [];
          renderToolbar();
          try { schedulePrefetch(); } catch (e) {}
          buildTable(OT_PAGE._allRows);
        })
        .catch(function (e) {
          content.innerHTML = '<div style="padding:20px;color:red;">حدث خطأ في تحميل البيانات: ' + esc(e.message || e) + '</div>';
        })
        .finally(function () {
          if (!quiet) UI.hideSpinner();
        });
    }

    function viewOvertime(row) {
      var attBtn = row.overtime_attachement
        ? '<button class="btn btn-outline" style="padding:6px 12px;" onclick="OT_PAGE.viewAttachment(\'' + esc(row.overtime_attachement).replace(/\'/g, "\\\'") + '\',\'' + esc(row.unique_id||'').replace(/\'/g, "\\\'") + '\')">📎 عرض — ' + esc(String(row.overtime_attachement).split("/").pop()) + '</button>'
        : 'لا يوجد';
      var body = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;font-size:14px;">' +
        '<div><b>الموظف:</b> ' + esc(row.name_ar) + ' (#' + esc(row.emp_id) + ')</div>' +
        '<div><b>التاريخ:</b> ' + fmtDate(row.date) + '</div>' +
        '<div><b>النوع:</b> ' + esc(row.overtime_name || row.overtime_type) + '</div>' +
        '<div><b>من:</b> ' + esc(fracToTime(row.start_time) || '-') + ' — <b>إلى:</b> ' + esc(fracToTime(row.end_time) || '-') + '</div>' +
        '<div><b>الساعات:</b> ' + (row.overtime_hours || '-') + '</div>' +
        '<div><b>المبلغ:</b> ' + (row.amount || '-') + '</div>' +
        '<div style="grid-column:1/-1;"><b>التفاصيل:</b> ' + esc(row.details || '-') + '</div>' +
        '<div style="grid-column:1/-1;display:flex;align-items:center;gap:10px;"><b>المرفق:</b> ' + attBtn + '</div>' +
        '<div><b>المسؤول:</b> ' + esc(uname_(row.user) || '-') + '</div>' +
        '<div><b>أنشأ:</b> ' + esc(row.created_at || '-') + '</div>' +
        '</div>';
      UIC.openModal('ot-view-modal', { title: 'تفاصيل العمل الإضافي', body: body });
    }

    function showAll() { SHOW_ALL = true; loadData(); }
    function showLatest() { SHOW_ALL = false; loadData(); }

    window.OT_PAGE = {
      _allRows: [],
      _editingUid: null,
      _editingAtt: null,
      _editEmps: null,
      _editRoles: null,
      openAddModal: function () {
        OT_PAGE._editingUid = null;
        OT_PAGE._editingAtt = null;
        OT_PAGE._editEmps = null;
        OT_PAGE._editRoles = null;
        openModal();
      },
      openEditModal: openEditModal,
      saveOvertime: saveOvertime,
      viewOvertime: viewOvertime,
      viewOvertimeById: function(uid){
        var row = (OT_PAGE._allRows||[]).find(function(x){ return String(x.unique_id)===String(uid) || String(x.emp_id+'_'+x.date)===String(uid); });
        if(row) viewOvertime(row);
      },
      deleteRow: function(uid){
        if(!UIC.canFull_()){ UIC.toast('غير مصرح / Not authorized','error'); return; }
        if(!confirm('هل تريد حذف هذا السجل؟ / Delete this record?')) return;
        UI.showSpinner(); companyCall('delete_overtime', { unique_id: uid }).then(function(r){ UIC.toast(r.message||'تم الحذف / Deleted','success'); loadData(true); }).catch(function(e){ UIC.toast(e.message||'خطأ','error'); }).finally(function(){ UI.hideSpinner(); });
      },
      printRow: function(uid){ window.print(); },
      viewAttachment: function(ref, id){ if(!ref && (id == null || String(id) === '')) return; UIC.openDownload(scriptUrl + '?download=attachment&page=vf_hr_overtime&ref=' + encodeURIComponent(ref || '') + ((id != null && String(id) !== '') ? '&id=' + encodeURIComponent(id) : '') + '&sessionToken=' + encodeURIComponent(SESSION_TOKEN), 'فتح المرفق'); },
      filter: function (q) { buildTable(filterRows(q)); },
      showAll: function () { showAll(); },
      showLatest: function () { showLatest(); }
    };

    loadData();
    /* Another device's change to this page arrives on its own. The poll
       reads timestamps from cache, never a spreadsheet, and stands down
       while the tab is hidden or a save is in flight. */
    document.addEventListener('DOMContentLoaded', function () {
      UIC.Live.watchPage({
        call: companyCall,
        page: 'vf_hr_overtime',
        onChange: function () { UIC.Live.arrive(function () { loadData(true); }); }
      });
      /* [live-notice] the view on screen */
      UIC.Live.setView('list', { refresh: function () { loadData(true); } });
    });

  })();
  </script>
</body>
</html>
