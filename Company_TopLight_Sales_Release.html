<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>اذن صرف منتج</title>
  <?!= include('CSS_Tokens'); ?>
  <?!= include('UI_Components'); ?>
  <?!= include('Client_Helpers'); ?>
  <?!= getCompanyThemeCSS_('8df5c89a117fe9a5') ?>
  <style>
    @media print {
      .no-print { display: none !important; }
      .invoice { border: 2px solid #111111; }
    }
    .invoice { max-width: 800px; margin: 0 auto; padding: 24px; background: var(--bg-surface); border: 2px solid var(--border-color); border-radius: 8px; }
    .invoice-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 2px solid #111111; padding-bottom: 16px; }
    .invoice-title { font-size: 22px; font-weight: 700; color: var(--text-main, #111111); }
    .invoice-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px 16px; margin-bottom: 20px; }
    .meta-item { font-size: 13px; }
    .meta-item strong { color: var(--text-muted); font-weight: 600; }
    /* [iPhone run] The line table's own look, from tablet-p up and on paper —
       exactly the declarations that applied before. Below 600px the shared
       .inv-table rules (UI_Components) lay the rows out as cards instead. */
    @media print, (min-width: 600px) {
      .inv-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 20px; }
      .inv-table th, .inv-table td { border: 1px solid #111111; padding: 8px 12px; text-align: right; }
      .inv-table th { background: #111111; color: #fbbf24; font-weight: 600; }
      .inv-table td { background: var(--bg-surface, #ffffff); color: var(--text-main, #111111); }
    }
  </style>
</head>
<body>
<div id="release-root" dir="rtl"></div>
<script>
  var params = new URLSearchParams(window.location.search);
  var SESSION_TOKEN = params.get('sessionToken') || (API.getSession() || {}).token || '';

  /* إغلاق goes back to the list this page was opened from when there is no
     tab to close — see UIC.closeOrBack. */
  function backUrl_() {
    return UIC.baseUrl() + '?action=tl_sales&sessionToken=' + encodeURIComponent(SESSION_TOKEN);
  }
  var salesCode = '<?!= purchaseCode ?>';
  var COMPANY_LOGO_URL = '<?!= getCompanyLogoUrl_('8df5c89a117fe9a5') ?>';

  function companyCall(moduleAction, data) {
    return API.call('company_action', {
      target_system: '8df5c89a117fe9a5',
      module_action: moduleAction,
      data: data || {}
    }, SESSION_TOKEN);
  }

  function releaseNumber(invNo) {
    var m = String(invNo == null ? '' : invNo).trim().match(/^(\d+)-(\d+)$/);
    if (m) return String(parseInt(m[1] + m[2], 10) + 10000);
    return invNo == null ? '' : invNo;
  }

  function load() {
    UIC.readSkeleton('release-root', { message: [
      'جاري تحميل إذن الصرف...',
      'جاري استرجاع أصناف وكميات الصرف...',
      'لحظة، جاري إعداد المستند للطباعة...'
    ] });
    companyCall('get_sales_print', { sales_code: salesCode })
      .then(function (r) { render(r.header, r.lines); })
      .catch(function (e) {
        document.getElementById('release-root').innerHTML =
          '<div class="empty-state"><span>' + FMT.escape(e.message || 'خطأ') + '</span></div>';
      })
      .finally(function () { UI.hideSpinner(); try{schedulePrefetch();}catch(e){} });
  }

  /* [iPhone run] Every <td> carries its column label (data-label) so the phone
     card layout — the shared .inv-table rules — has something to show; from
     600px up and on paper the attribute is invisible. The header row is built
     from the same list, so the two can never disagree. */
  var COLS = ['المنتج', 'الكمية'];
  function row_(cells) {
    return '<tr>' + cells.map(function (c, i) {
      return '<td data-label="' + FMT.escape(COLS[i]) + '">' + c + '</td>';
    }).join('') + '</tr>';
  }
  function head_() {
    return '<thead><tr>' + COLS.map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr></thead>';
  }
  function render(h, lines) {
    var root = document.getElementById('release-root');
    var rows = (lines || []).map(function (l) {
      return row_([
        FMT.escape(l.product_name || '-'),
        '<span class="num">' + FMT.number(l.product_qty) + '</span>'
      ]);
    }).join('');

    var html =
      '<div class="no-print" style="max-width:800px;margin:12px auto;display:flex;justify-content:flex-end;gap:8px;">' +
      '<button class="btn btn-primary" onclick="window.print()">طباعة</button>' +
      '<button class="btn btn-outline" onclick="UIC.closeOrBack(backUrl_())">إغلاق</button>' +
      '</div>' +
      '<div class="invoice">' +
      '<div class="invoice-head">' +
      '<img src="' + (COMPANY_LOGO_URL || '') + '" style="height:42px;" alt="">' +
      '<div class="invoice-title">اذن صرف منتج</div>' +
      '</div>' +
      '<div class="invoice-meta">' +
      metaItem('رقم الفاتورة', releaseNumber(h['رقم الفاتورة'])) +
      metaItem('تاريخ الفاتورة', h['تاريخ الفاتورة'] ? String(h['تاريخ الفاتورة']).slice(0, 10) : '-') +
      metaItem('العميل', h.customer_name) +
      metaItem('العنوان', h['العنوان']) +
      '</div>' +
      '<table class="inv-table">' + head_() + '<tbody>' + rows + '</tbody></table>' +
      '</div>';

    root.innerHTML = html;
  }

  function metaItem(label, value) {
    return '<div class="meta-item"><strong>' + label + ':</strong> ' + FMT.escape(value == null || value === '' ? '-' : value) + '</div>';
  }

  load();
</script>
</body>
</html>
