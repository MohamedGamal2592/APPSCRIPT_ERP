<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Testing System — العملاء والموردون</title>
  <?!= include('CSS_Tokens'); ?>
  <?!= include('UI_Components'); ?>
  <?!= include('Client_Helpers'); ?>
  <?!= include('Company_ErpTest_Packs'); ?>
  <?!= include('Company_ErpTest_Nav'); ?>
  <?!= getCompanyThemeCSS_('37fc50edf1424abd') ?>
  <style>
    @page { size: A4; }
    @media print {
      .topbar, .breadcrumb, .no-print { display: none !important; }
      .table-toolbar { display: none !important; }
      #parties-table table th:last-child,
      #parties-table table td:last-child { display: none !important; }
      body { background: var(--bg-surface, #ffffff) !important; }
    }
  </style>
</head>
<body>
<div id="tl-root" dir="rtl"></div>
<script>
  var params = new URLSearchParams(window.location.search);
  var SESSION_TOKEN = params.get('sessionToken') || (API.getSession() || {}).token || '';
  var scriptUrl = window.scriptUrl || '/';
  var IS_SUPER_ADMIN = <?!= user && user.isSuperAdmin ? 'true' : 'false' ?>;
  var USER_PAGES = <?!= user && user.isSuperAdmin ? 'null' : JSON.stringify((user && user.authorizedPages) || {}) ?>;
  var COMPANY_LOGO_URL = '<?!= getCompanyLogoUrl_('37fc50edf1424abd') ?>';
  var COMPANY_PAGES = <?!= companyPages ?>;
  var CURRENT_ACTION = '<?!= currentAction ?>';
  var DIRECTION_FILTER = '';

  /* [live-notice D6] list replies from the device cache, trusted by the stamps */
  companyCall = UIC.Live.viewCache(companyCall, { company: '37fc50edf1424abd', page: 'et_customers', view: 'list', lists: ['get_et_parties'] });
  function companyCall(moduleAction, data) {
    return API.call('company_action', {
      target_system: '37fc50edf1424abd',
      module_action: moduleAction,
      data: data || {}
    }, SESSION_TOKEN);
  }

  function load() {
    var contentId = 'parties-content';
    UIC.appShell('tl-root', {
      menuGroups: window.ERPTEST_MENU || [],
      companyLogoUrl: COMPANY_LOGO_URL,
      companyLogoHref: scriptUrl + '?action=et_dashboard&sessionToken=' + SESSION_TOKEN,
      companyLogoTitle: 'النظام التجريبي',
      breadcrumb: 'النظام التجريبي / العملاء والموردون',
      contentId: contentId
    });
    fetchParties();
  }

  function fetchParties() {
    UIC.readSkeleton('parties-content', { message: [
      'جاري تحميل قائمة العملاء والموردين...',
      'جاري استرجاع الأرصدة والبيانات...',
      'لحظة، جاري عرض الجدول...'
    ] });
    companyCall('get_et_parties', { direction: DIRECTION_FILTER })
      .then(function (r) {
        window.__typeOptions = r.type_options || [];
        window.__countryOptions = r.country_options || [];
        window.__regionOptions = r.region_options || [];
        renderParties(r.parties || []);
      })
      .catch(function (e) { showError(e); })
      .finally(function () { UI.hideSpinner(); try{schedulePrefetch();}catch(e){} });
  }

  function renderParties(list) {
    window.__parties = list;
    var rows = list.map(function (p) {
      var dir = String(p.customer_direction).toLowerCase();
      var isCustomer = dir === 'customer' || dir === 'عميل' || dir === 'client';
      return {
        name: p.name,
        direction: UIC.statusPill(isCustomer ? 'عميل' : 'مورد', isCustomer ? 'success' : 'warning'),
        type: p.type || '-',
        country: p.country || '-',
        region: p.region || '-',
        tax_id: p.tax_id || '-',
        telephone: p.telephone || '-',
        address: p.address || '-',
        balance: FMT.number(p.balance),
        actions: UIC.actionBtns([
          { label: 'كشف حساب', onclick: "openStatement('" + FMT.escape(p.id) + "')" }
        ].concat(UIC.canFull_() ? [{ label: 'تعديل', onclick: "openPartyModal('" + FMT.escape(p.id) + "')" }] : []))
      };
    });
    var headers = [
      { key: 'name', label: 'الاسم' },
      { key: 'direction', label: 'النوع' },
      { key: 'type', label: 'الصنف' },
      { key: 'country', label: 'الدولة' },
      { key: 'region', label: 'المنطقة' },
      { key: 'tax_id', label: 'الرقم الضريبي' },
      { key: 'telephone', label: 'الهاتف' },
      { key: 'address', label: 'العنوان' },
      { key: 'balance', label: 'الرصيد', numeric: true },
      { key: 'actions', label: 'إجراءات' }
    ];
    var body = document.getElementById('parties-content');
    body.innerHTML =
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;" class="no-print">' +
      '<div style="display:flex;gap:8px;">' +
      '<button class="btn ' + (DIRECTION_FILTER === '' ? 'btn-primary' : 'btn-outline') + '" onclick="setFilter(\'\')">الكل</button>' +
      '<button class="btn ' + (DIRECTION_FILTER === 'customer' ? 'btn-primary' : 'btn-outline') + '" onclick="setFilter(\'customer\')">العملاء</button>' +
      '<button class="btn ' + (DIRECTION_FILTER === 'vendor' ? 'btn-primary' : 'btn-outline') + '" onclick="setFilter(\'vendor\')">الموردون</button>' +
      '</div>' +
      '<div style="display:flex;gap:8px;">' +
      '<button class="btn btn-outline" onclick="window.print()">طباعة</button>' +
      '<button class="btn btn-outline" onclick="exportCustomers()">تصدير Excel</button>' +
      '<button class="btn btn-primary" onclick="openPartyModal(\'\')">+ إضافة</button>' +
      '</div>' +
      '</div>' +
      UIC.dataTable('parties-table', {
        title: 'العملاء والموردون',
        headers: headers,
        rows: rows,
        emptyText: 'لا توجد بيانات'
      });
    UIC.initTableSort('parties-table');
  }

  function setFilter(direction) {
    DIRECTION_FILTER = direction;
    fetchParties();
  }

  /* Opens in a new tab as before; when the tab is refused, UIC.openTab navigates this frame there instead. */
  function openStatement(id) {
    UIC.openTab(scriptUrl + '?action=et_customer_statement&purchase_code=' + encodeURIComponent(id) + '&sessionToken=' + encodeURIComponent(SESSION_TOKEN));
  }

  function exportCustomers() {
    var list = window.__parties || [];
    var headers = ['الاسم', 'النوع', 'الهاتف', 'العنوان', 'الرصيد'];
    var rows = list.map(function (p) {
      var isCustomer = String(p.customer_direction).toLowerCase() === 'customer' || String(p.customer_direction).toLowerCase() === 'عميل' || String(p.customer_direction).toLowerCase() === 'client';
      return {
        'الاسم': p.name || '',
        'النوع': isCustomer ? 'عميل' : 'مورد',
        'الهاتف': p.telephone || '',
        'العنوان': p.address || '',
        'الرصيد': p.balance || 0
      };
    });
    UI.showSpinner(['جاري تجهيز ملف Excel...', 'لحظة، جاري التصدير...']);
    companyCall('get_xlsx_export', { headers: headers, rows: rows, filename: 'العملاء.xlsx' })
      .then(function (r) { API.downloadXlsx(r.base64, r.filename); })
      .catch(function (e) { UIC.toast(e.message || 'خطأ', 'error'); })
      .finally(function () { UI.hideSpinner(); });
  }

  function openPartyModal(id) {
    var p = (window.__parties || []).find(function (x) { return String(x.id) === String(id); });
    var body =
      '<form id="party-form">' +
      UIC.field({ key: 'name', label: 'الاسم', value: p ? p.name : '', required: true }) +
      UIC.field({ key: 'customer_direction', label: 'النوع', type: 'select', required: true,
        options: [{ value: 'customer', label: 'عميل' }, { value: 'vendor', label: 'مورد' }],
        value: p ? (p.customer_direction || 'customer') : 'customer' }) +
      UIC.enumSelect({ key: 'type', label: 'الصنف', value: p ? p.type : '', options: window.__typeOptions || [], required: true }) +
      UIC.enumSelect({ key: 'country', label: 'الدولة', value: p ? p.country : '', options: window.__countryOptions || [], required: true }) +
      UIC.enumSelect({ key: 'region', label: 'المنطقة', value: p ? p.region : '', options: window.__regionOptions || [], required: true }) +
      UIC.field({ key: 'telephone', label: 'الهاتف', value: p ? p.telephone : '', required: true }) +
      UIC.field({ key: 'address', label: 'العنوان', value: p ? p.address : '', required: true }) +
      UIC.field({ key: 'registration_number', label: 'رقم التسجيل', value: p ? p.registration_number : '' }) +
      UIC.field({ key: 'tax_id', label: 'الرقم الضريبي', value: p ? p.tax_id : '' }) +
      '</form>';
    UIC.openModal('party-modal', {
      title: p ? 'تعديل' : 'إضافة',
      body: body,
      onSave: 'return saveParty(\'' + (p ? p.id : '') + '\')'
    });
  }

  function saveParty(id) {
    var data = UIC.collectForm('party-form');
    if (!UIC.validateForm('party-form')) return;
    ['type', 'country', 'region'].forEach(function (k) {
      if (data[k] === '__new__') data[k] = data[k + '_custom'] || '';
      delete data[k + '_custom'];
    });
    if (id) data.id = id;
    /* [RT-4] Optimistic. The three rotating reassurance messages that used to
       cover this wait are deleted rather than kept: they were the UI being
       designed around the wait, and there is no wait to design around now. */
    if (!window.__parties) window.__parties = [];
    return UIC.Live.save({
      call: companyCall,
      action: id ? 'edit_et_party' : 'add_et_party',
      data: data,
      list: window.__parties,
      key: 'id',
      draft: Object.assign({}, data),
      render: function () { renderParties(window.__parties); },
      modal: 'party-modal',
      message: 'تم الحفظ',
      /* An add gets its id from the server; the reply carries it either on
         the record or beside it, exactly as the hand-rolled patch read it. */
      recordOf: function (r) {
        var rec = (r && r.record) || null;
        if (rec && !rec.id) rec.id = r.assignedId || r.unique_id;
        return rec;
      },
      reload: fetchParties
    }).catch(function () { /* Live.save has already toasted and rolled back */ });
  }

  function showError(e) {
    var body = document.getElementById('parties-content');
    if (body) body.innerHTML = '<div class="empty-state"><span>' + FMT.escape(e.message || 'خطأ') + '</span></div>';
  }


  if (window.ET_PACKS) companyCall = ET_PACKS.wrapCall(companyCall, { page: 'et_customers', list: 'get_et_parties', refresh: function () { fetchParties(); } });
  load();

  /* [RT-6] Another device's change to this page arrives on its own. The poll
     reads timestamps from cache, never a spreadsheet, and stands down while the
     tab is hidden, while a save is in flight, and after fifteen idle minutes.
     UIC.Live.arrive decides whether the list may move right now: it refreshes
     in place when the user is idle at the top, and raises a chip instead when
     they are scrolled away, typing, or have a form open. */
  UIC.Live.watchPage({
    call: companyCall,
    page: 'et_customers',
    onChange: function () { UIC.Live.arrive(function () { fetchParties(); }); }
  });
  /* [live-notice] the view on screen */
  UIC.Live.setView('list', { refresh: function () { fetchParties(); } });

</script>
</body>
</html>
