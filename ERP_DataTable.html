<style>
/* ERP_DataTable — one reusable table engine (§3.1-3.7). Consumes CSS tokens only. */
.erp-table-wrap{overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border-color,#e5e7eb);border-radius:12px;background:var(--bg-surface,#fff);}
.erp-table{width:100%;border-collapse:collapse;table-layout:fixed;direction:rtl;}
.erp-table thead th{position:sticky;top:0;z-index:1;background:var(--bg-subtle,#f3f4f6);color:var(--text-main,#111827);font-weight:700;font-size:13px;padding:10px 8px;border-bottom:1px solid var(--border-color,#e5e7eb);text-align:right;white-space:nowrap;user-select:none;cursor:pointer;}
.erp-table thead th.sortable::after{content:' ↕';opacity:.4;font-size:11px;}
.erp-table thead th.sorted-asc::after{content:' ↑';opacity:1;}
.erp-table thead th.sorted-desc::after{content:' ↓';opacity:1;}
.erp-table tbody td{padding:8px;font-size:13px;border-bottom:1px solid var(--border-color,#e5e7eb);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.erp-table tbody tr:hover td{background:var(--bg-subtle,#f3f4f6);}
.erp-table tbody tr.row-pending{opacity:var(--row-pending-opacity,.62);}
.erp-table tbody tr.row-pending td{background:var(--pending-bg,#fef3c7)!important;}
.erp-table .cell-actions{width:72px;text-align:center;}
.erp-table-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;background:var(--bg-surface,#fff);border-bottom:1px solid var(--border-color,#e5e7eb);}
.erp-table-toolbar .input{flex:1 1 200px;}
.erp-badge-pending{display:inline-block;font-size:11px;padding:2px 6px;border-radius:999px;background:var(--pending-bg,#fef3c7);border:1px solid var(--pending-border,#fde68a);color:var(--pending-text,#92400e);margin-inline-start:6px;}
/* kebab dropdown — last column */
.erp-kebab{position:relative;display:inline-block;}
.erp-kebab-btn{width:32px;height:32px;border-radius:999px;border:1px solid var(--border-color,#e5e7eb);background:var(--bg-surface,#fff);cursor:pointer;font-size:16px;line-height:1;}
.erp-kebab-menu{position:absolute;inset-inline-end:0;top:calc(100% + 6px);min-width:180px;background:var(--bg-surface,#fff);border:1px solid var(--border-color,#e5e7eb);border-radius:12px;box-shadow:var(--shadow-lg,0 10px 30px rgba(0,0,0,.12));padding:6px;display:none;flex-direction:column;gap:2px;z-index:20;max-height:320px;overflow:auto;}
.erp-kebab.open .erp-kebab-menu{display:flex;}
.erp-kebab-item{width:100%;text-align:right;padding:8px 10px;font-size:13px;background:transparent;border:0;border-radius:8px;cursor:pointer;}
.erp-kebab-item:hover{background:var(--bg-subtle,#f3f4f6);}
.erp-kebab-item.danger{color:var(--danger,#dc2626);}
</style>
<div id="erp-datatable-host" dir="rtl" lang="ar"></div>
