<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Valley Foods — حركة النقدية والبنوك</title>
  <?!= include('CSS_Tokens'); ?>
  <?!= include('UI_Components'); ?>
  <?!= include('Client_Helpers'); ?>
  <?!= include('Company_ValleyFoods_Nav'); ?>
  <?!= getCompanyThemeCSS_('9940659bd83035d7') ?>
</head>
<body>
  <div id="vf-root"></div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var SESSION_TOKEN = params.get('sessionToken') || (API.getSession() || {}).token || '';
    var scriptUrl = window.scriptUrl || '/';
    var IS_SUPER_ADMIN = <?!= user && user.isSuperAdmin ? 'true' : 'false' ?>;
    var COMPANY_LOGO_URL = '<?!= getCompanyLogoUrl_('9940659bd83035d7') ?>';
    var COMPANY_PAGES = <?!= companyPages ?>;
    var CURRENT_ACTION = '<?!= currentAction ?>';
    var USER_PAGES = <?!= user && user.isSuperAdmin ? 'null' : JSON.stringify((user && user.authorizedPages) || {}) ?>;
    var CAN_WRITE = UIC.canAdd_(); var CAN_FULL = UIC.canFull_();

    function companyCall(moduleAction, data) {
      return API.call('company_action', {
        target_system: '9940659bd83035d7',
        module_action: moduleAction,
        data: data || {}
      }, SESSION_TOKEN);
    }
    function esc(v) {
      /* [UI-2.8 / U-36] Delegates to the shared formatter. This body used to
         carry its own replace-chain behind a `typeof FMT !== 'undefined'`
         guard, but Client_Helpers.html defines FMT in <head> before any page
         script runs, so that fallback was unreachable and the duplicate was
         pure drift risk. Output is identical for every input — proved in
         tools/verify/ui2_formatters.js. */
      return FMT.escape(v);
    }
    function num0(v) { var n = Number(v); return isNaN(n) ? 0 : n; }
    function todayStr() { return new Date().toISOString().slice(0, 10); }
    function fmtDate(v) {
      if (!v) return '-';
      var d = (v instanceof Date) ? v : new Date(v);
      if (isNaN(d.getTime())) return String(v);
      var p = function (n) { return n < 10 ? '0' + n : '' + n; };
      return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear();
    }
  </script>

  <script>
  (function () {
    var HEADERS = [], BOXES = [], OPTIONS = {}, ITEM_SUGGESTIONS = [], NEXT_ID = 1;
    var BOX_FILTER = '';
    /* Date range for the list. Server-side: get_valley_cash bounds the rows by
       transaction_date before the 2,000-row cap, so an old month stays reachable
       — a client-side filter over the capped payload could not show it. The box
       balance cards are computed over the whole ledger and are never bounded. */
    var DATE_FROM = '', DATE_TO = '';
    var VIEW_APPLIED = false;

    function renderApp() {
      UIC.appShell('vf-root', {
        companyLogoUrl: COMPANY_LOGO_URL,
        companyLogoHref: scriptUrl + '?action=vf_dashboard&sessionToken=' + SESSION_TOKEN,
        companyLogoTitle: 'Valley Foods',
        breadcrumb: 'Valley Foods / الادارة المالية / حركة النقدية والبنوك',
        contentId: 'vf-cash-content',
        menuGroups: (window.VALLEYFOODS_MENU || [])
      });
      load();
      /* Someone else's cash movement shows up here within one poll, without
         this page ever touching a spreadsheet to find out. */
      UIC.Live.watchPage({
        call: companyCall,
        page: 'vf_cash',
        onChange: function () { UIC.Live.arrive(function () { load(true); }); }
      });
      /* [live-notice] the view on screen */
      UIC.Live.setView('list', { refresh: function () { load(true); } });
    }

    /* quiet: refresh in the background without the blocking overlay. Used
       after an optimistic save and by the change poll, where the user has
       already seen their change and must not be interrupted to confirm it. */
    function load(quiet) {
      if (!quiet) UIC.readSkeleton('vf-cash-content');
      companyCall('get_valley_cash', { from: DATE_FROM, to: DATE_TO })
        .then(function (r) {
          HEADERS = r.headers || [];
          BOXES = r.boxes || [];
          OPTIONS = r.enums || {};
          ITEM_SUGGESTIONS = r.item_suggestions || [];
          NEXT_ID = r.next_id || 1;
          window.__cashPartyOptions = r.party_options || [];
          window.__cashCanAddParty = !!(r && r.can_add_party);
          window.__cashPartyDirections = (r && r.party_direction_options) || [];
          window.__cashPartyTypes = (r && r.party_type_options) || [];
          window.__cashBoxOptions = r.box_options || [];
          window.__cashChartOptions = r.chart_options || [];
          /* Only on the first load: a reload after a save (or after the user
             changes a filter) must keep what is on screen, not snap back to the
             saved view. */
          if (VIEW_APPLIED) { renderList(); try{schedulePrefetch();}catch(e){}; return; }
          SESSION.loadActiveView('vf_cash').then(function (def) {
            VIEW_APPLIED = true;
            if (def && def.box !== undefined) BOX_FILTER = def.box;
            if (def && def.from !== undefined) DATE_FROM = def.from || '';
            if (def && def.to !== undefined) DATE_TO = def.to || '';
            if (DATE_FROM || DATE_TO) { load(quiet); return; }
            renderList(); try{schedulePrefetch();}catch(e){};
          }).catch(function () { VIEW_APPLIED = true; renderList(); });
        })
        .catch(function (e) {
          /* A background refresh that fails must not replace the list the user
             is looking at with an error page. */
          if (quiet) return;
          var c = document.getElementById('vf-cash-content');
          if (c) c.innerHTML = '<div style="padding:20px;color:red;">خطأ: ' + esc(e.message || e) + '</div>';
        })
        .finally(function () { if (!quiet) UI.hideSpinner(); });
    }

    function partyLabel(idRef) {
      var found = window.__cashPartyOptions.filter(function (o) { return String(o.value) === String(idRef); })[0];
      return found ? found.label : (idRef || '-');
    }

    function saveView() {
      SESSION.saveCurrentView('vf_cash', { box: BOX_FILTER || '', from: DATE_FROM || '', to: DATE_TO || '' })
        .then(function () { UIC.toast('تم حفظ العرض', 'success'); })
        .catch(function (e) { if (e !== 'cancelled') UIC.toast((e && e.message) || 'تعذر الحفظ', 'error'); });
    }

    /* ---------- BOX BALANCE CARDS ---------- */
    function boxCardsHtml() {
      var visibleBoxes = BOXES.filter(function (b) {
        /* The card displays two decimals; hide balances that render as zero. */
        return Math.round(Math.abs(num0(b.balance)) * 100) !== 0;
      });
      if (!visibleBoxes.length) return '';
      return '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px;">' +
        visibleBoxes.map(function (b) {
          var active = BOX_FILTER === b.box;
          return '<div class="stat-card" style="cursor:pointer;' + (active ? 'outline:2px solid #16a34a;' : '') + '" onclick="CASH_PAGE.setBoxFilter(\'' + esc(b.box) + '\')">' +
            '<div class="stat-body">' +
              '<div style="font-size:12px;color:var(--text-muted, #6b7280);font-weight:700;">' + esc(b.name) + '</div>' +
              '<div style="font-size:20px;font-weight:800;direction:ltr;' + (b.balance < 0 ? 'color:var(--danger, #dc2626);' : 'color:#0e623b;') + '">' +
                Number(b.balance).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '</div>' +
            '</div></div>';
        }).join('') +
      '</div>';
    }

    /* ---------- LIST ---------- */
    function renderList() {
      var content = document.getElementById('vf-cash-content');
      var filtered = BOX_FILTER
        ? HEADERS.filter(function (h) { return String(h.related_box) === BOX_FILTER; })
        : HEADERS;

      var rows = filtered.map(function (h) {
        var isApproved = h.approved_bool;
        var actions = UIC.actionBtns([
          { label: 'السجل', onclick: 'SESSION.openHistory(\'valley_cash_bank_movement\',\'' + esc(h.transaction_id) + '\')' },
          IS_SUPER_ADMIN ? { label: isApproved ? 'إلغاء اعتماد' : 'اعتماد', onclick: 'CASH_PAGE.approve(' + esc(h.transaction_id) + ')' } : null,
          IS_SUPER_ADMIN ? { label: 'تعديل', onclick: 'CASH_PAGE.openEdit(' + esc(h.transaction_id) + ')' } : null,
          IS_SUPER_ADMIN ? { label: 'حذف', color: '#dc2626', onclick: 'CASH_PAGE.remove(' + esc(h.transaction_id) + ')' } : null
        ].filter(Boolean));
        return [
          '<b>' + esc(h.transaction_id) + '</b>',
          '<span data-sort="' + esc(h.date_edit || '') + '">' + esc(h.date_display || '-') + '</span>',
          esc(h.party_name || '-'),
          esc(h.transaction_details || '-'),
          attChipsHtml_(attList_(h.attachment, h.attachment_id), h.transaction_id) || '-',
          esc(h.transaction_type),
          esc(h.transaction_method || '-'),
          '<span class="num" data-num="' + num0(h.transaction_amount) + '">' + num0(h.transaction_amount).toLocaleString('en-US') + '</span>',
          esc(h.box_name || h.related_box || '-'),
          esc(h.chart_name || h.chart_code || '-'),
          esc(uname_(h.user) || '-'),
          '<span class="num" style="font-weight:700;' + (num0(h.balance_amount) < 0 ? 'color:var(--danger, #dc2626);' : 'color:#0e623b;') + '" data-num="' + num0(h.balance_amount) + '">' + num0(h.balance_amount).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '</span>',
          UIC.statusPill(isApproved ? 'معتمد' : 'غير معتمد', isApproved ? 'success' : 'neutral'),
          actions
        ];
      });

      content.innerHTML =
        UIC.dateRangeBar('cash-date', {
          from: DATE_FROM, to: DATE_TO,
          onchange: 'CASH_PAGE.applyDateFilter()',
          onclear: 'CASH_PAGE.clearDateFilter()'
        }) +
        boxCardsHtml() +
        '<div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px;flex-wrap:wrap;">' +
          (BOX_FILTER ? '<button class="btn btn-outline" onclick="CASH_PAGE.setBoxFilter(\'\')">✕ إلغاء فلتر الصندوق</button>' : '') +
          '<button class="btn btn-outline" onclick="UI.submitOnce(this, CASH_PAGE.saveView)">💾 حفظ العرض</button>' +
          /* The expenses report is its own page; it reads this same ledger. */
          '<a class="btn btn-outline" target="_blank" rel="noopener" href="' + scriptUrl + '?action=vf_cash_expenses&sessionToken=' +
            encodeURIComponent(SESSION_TOKEN) + '">📊 تقرير المصروفات</a>' +
          '<a class="btn btn-outline" target="_blank" rel="noopener" href="' + scriptUrl + '?action=vf_cash_box_balances&sessionToken=' +
            encodeURIComponent(SESSION_TOKEN) + '">💰 تقرير أرصدة الصناديق</a>' +
          '<a class="btn btn-outline" target="_blank" rel="noopener" href="' + scriptUrl + '?action=vf_cash_incomes&sessionToken=' +
            encodeURIComponent(SESSION_TOKEN) + '">📈 تقرير الايرادات الاخرى</a>' +
          (CAN_WRITE
            ? '<button class="btn btn-primary" onclick="CASH_PAGE.openForm(\'\')">+ إضافة حركة</button>' +
              '<button class="btn btn-outline" onclick="CASH_PAGE.openTransfer()">تحويل بين الصناديق</button>'
            : '') +
        '</div>' +
        UIC.dataTable('cash-table-id', {
          /* [UI-9.1] Three columns are DECLARED rather than inferred. The
             other ten classify correctly from their own data and are left to
             do so — a declaration that only restates the inference is a second
             place to keep in step with the page.
               البيان is the column the whole contract exists for, and it is
                 declared so it can never flap: inference reads the rows that
                 happen to be on screen, and a month of short descriptions
                 would quietly demote it to text. 30ch over the 26ch token
                 because it shares this table with twelve other columns.
               الطرف is a party name — real words, but a name, not a sentence.
               الاعتماد holds a status pill, never more than two short words,
                 and inference calls it text: that reserves 14ch on the widest
                 table in the tree for a word that needs five. */
          headers: ['رقم', 'التاريخ',
                    { label: 'الطرف', col: 'text' },
                    { label: 'البيان', col: 'prose', min: '30ch' },
                    { label: 'المرفقات', col: 'text' },
                    'النوع', 'طريقة الدفع',
                    { label: 'المبلغ', numeric: true }, 'الصندوق', 'كود الحساب', 'المستخدم',
                    { label: 'الرصيد', numeric: true },
                    { label: 'الاعتماد', col: 'atom' },
                    { key: 'actions', label: '' }],
          rows: rows,
          emptyText: BOX_FILTER ? 'لا توجد حركات في هذا الصندوق' : 'لا توجد حركات'
        });
      UIC.initTableSort('cash-table-id');
    }

    /* ---------- ADD / EDIT MODAL ---------- */
    function openForm(id) {
      var record = null;
      if (id) HEADERS.forEach(function (h) { if (Number(h.transaction_id) === Number(id)) record = h; });
      renderForm(record);
    }

    function selOpts(list, selected) {
      return (list || []).map(function (v) { return { value: v, label: v }; }).filter(Boolean);
    }
    function refOpts(list) {
      return [{ value: '', label: '—' }].concat(list || []);
    }

    function renderForm(record) {
      var isEdit = !!record;
      var datalistId = 'items-datalist';
      var body = '<form id="cash-form">' +
        '<div class="form-field">' +
          '<label class="form-label">رقم الحركة (يُعتمد تلقائياً)</label>' +
          '<input id="f-tid-display" class="input" type="text" readonly value="' + esc(record ? record.transaction_id : NEXT_ID) + '" style="background:var(--bg-subtle, #f3f4f6);color:var(--text-muted, #6b7280);cursor:not-allowed;">' +
        '</div>' +
        UIC.field({ key: 'f-date', label: 'تاريخ الحركة', type: 'date', required: true, value: record ? (record.date_edit || todayStr()) : todayStr() }) +
        UIC.combo({ key: 'f-type', label: 'نوع الحركة', required: true, options: selOpts(OPTIONS.transaction_type), value: record ? record.transaction_type : '', placeholder: 'اكتب للبحث…' }) +
        UIC.combo({ key: 'f-method', label: 'طريقة الدفع', required: true, options: selOpts(OPTIONS.transaction_method), value: record ? (record.transaction_method || '') : '', placeholder: 'اكتب للبحث…' }) +
        UIC.combo({ key: 'f-party', label: 'العميل / المورد', required: true, options: window.__cashPartyOptions || [], value: record ? String(record.name || '') : '', placeholder: 'اكتب للبحث…' }) +
        (window.__cashCanAddParty ? '<div style="margin:-6px 0 12px;"><button type="button" class="btn btn-outline" onclick="CASH_PAGE.openPartyQuickAdd()">+ عميل / مورد جديد</button></div>' : '') +
        UIC.field({ key: 'f-details', label: 'البيان', type: 'textarea', required: true, value: record ? (record.transaction_details || '') : '' }) +
        UIC.field({ key: 'f-amount', label: 'المبلغ', type: 'number', required: true, min: '0.01', step: '0.01', value: record ? (record.transaction_amount != null ? record.transaction_amount : '') : '' }) +
        UIC.field({ key: 'f-discount', label: 'الخصم', type: 'number', min: '0', step: '0.01', value: record ? (record.total_discount != null ? record.total_discount : '') : '' }) +
        '<div class="form-field">' +
          '<label class="form-label">القيم المحتسبة تلقائياً (للعرض فقط)</label>' +
          '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;">' +
            grayedField('f-net-display', 'net_amount') +
            grayedField('f-total-display', 'total') +
            grayedField('f-balance-display', 'balance_amount') +
            grayedField('f-boxbal-display', 'box_balance Σ') +
          '</div>' +
        '</div>' +
        UIC.field({ key: 'f-taxes', label: 'الضرائب', type: 'number', min: '0', step: '0.01', value: record ? (record.taxes != null ? record.taxes : '') : '' }) +
        '' +
        UIC.combo({ key: 'f-box', label: 'الصندوق / الحساب البنكي', required: true, options: window.__cashBoxOptions || [], value: record ? String(record.related_box || '') : '', placeholder: 'اكتب للبحث…' }) +
        UIC.combo({ key: 'f-chart', label: 'كود الدليل المحاسبي', required: true, options: window.__cashChartOptions || [], value: record ? String(record.chart_code || '') : '', placeholder: 'اكتب للبحث…' }) +
        UIC.field({ key: 'f-items', label: 'أصناف المشتريات (اختياري — اكتب قيماً جديدة لإضافتها)', type: 'text', list: datalistId, value: record ? (record.transaction_purchasing_items || '') : '' }) +
        '{{DATALIST}}' +
        checkboxField('f-tax-system', 'خاضع للنظام الضريبي', record && (record.tax_system === true || String(record.tax_system).toLowerCase() === 'yes')) +
        '<div class="form-field" style="margin-top:6px;">' +
          '<label class="form-label">المرفقات (اختياري — حتى 5 ملفات: PDF، Word، صور)</label>' +
          '<div id="cash-att-list"></div>' +
          '<div id="cash-att-slots"></div>' +
          '<button type="button" class="btn btn-outline" style="margin-top:6px;" onclick="CASH_PAGE.addAttSlot()">+ إضافة ملف</button>' +
        '</div>' +
      '</form>';

      var dl = '<datalist id="' + datalistId + '">' +
        ITEM_SUGGESTIONS.map(function (v) { return '<option value="' + esc(v) + '"></option>'; }).join('') +
      '</datalist>';

      UIC.openModal('cash-modal', {
        size: 'lg',
        title: isEdit ? 'تعديل حركة رقم ' + record.transaction_id : 'إضافة حركة',
        body: body.replace('{{DATALIST}}', dl),
        onSave: 'CASH_PAGE.save(' + (isEdit ? esc(record.transaction_id) : 'null') + ')'
      });

      /* Pin the box to the active card filter when adding from a box card
         (UIC.combo: hidden input keeps the value, display input gets locked) */
      if (!isEdit && BOX_FILTER) {
        var hidBox = document.getElementById('f-box');
        var dispBox = document.getElementById('f-box_display');
        if (hidBox) hidBox.value = BOX_FILTER;
        if (dispBox) {
          var lbl = '';
          (window.__cashBoxOptions || []).forEach(function (o) { if (String(o.value) === String(BOX_FILTER)) lbl = o.label; });
          dispBox.value = lbl || BOX_FILTER;
          dispBox.disabled = true;
          dispBox.style.background = '#f3f4f6';
          dispBox.style.color = '#6b7280';
          dispBox.style.cursor = 'not-allowed';
        }
      }
      ['f-type_display', 'f-method_display'].forEach(function (did2) {
        var el2 = document.getElementById(did2);
        if (el2) el2.addEventListener('input', updateCalcPreview);
      });

      ['f-amount', 'f-discount', 'f-taxes', 'f-type', 'f-box'].forEach(function (fid) {
        var el = document.getElementById(fid);
        if (el) el.addEventListener('input', updateCalcPreview);
        if (el) el.addEventListener('change', updateCalcPreview);
      });
      ATT_RECORD_ID = record ? record.transaction_id : '';
      ATT_KEPT = record ? attList_(record.attachment, record.attachment_id) : [];
      ATT_SLOT_SEQ = 0;
      renderAttList();
      addAttSlot();
      updateCalcPreview();
    }

    function getVal_(id) { var el = document.getElementById(id); return el ? el.value : ''; }
    function checkboxField(key, label, checked) {
      return '<label style="display:flex;align-items:center;gap:8px;margin:10px 0;font-size:14px;">' +
        '<input type="checkbox" id="' + key + '"' + (checked ? ' checked' : '') + '> ' + label + '</label>';
    }
    function grayedField(id, label) {
      return '<div><div style="font-size:10px;color:var(--text-muted, #6b7280);margin-bottom:3px;">' + esc(label) + '</div>' +
        '<input id="' + id + '" class="input" type="text" readonly value="0.00" style="background:var(--bg-subtle, #f3f4f6);color:var(--text-muted, #6b7280);cursor:not-allowed;direction:ltr;text-align:left;font-family:monospace;"></div>';
    }

    /* ---------- ATTACHMENTS (one cell pair, up to 5 files) ---------- */
    var ATT_MAX = 5;
    var ATT_KEPT = [];
    var ATT_SLOT_SEQ = 0;
    var ATT_RECORD_ID = '';

    function attList_(refs, ids) {
      var r = String(refs || '').split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
      var d = String(ids || '').split('\n').map(function (s) { return s.trim(); });
      return r.map(function (ref, i) { return { ref: ref, id: d[i] || '' }; });
    }
    function attName_(ref) { var p = String(ref || '').split('/'); return p[p.length - 1] || String(ref || ''); }
    function attArg_(s) { return esc(String(s == null ? '' : s)).replace(/'/g, "\\'"); }
    function openAtt(ref, id) {
      if (!ref) return;
      /* The viewer's `id` parameter is the owning transaction key, not the
         Drive attachment ID stored in attachment_id. */
      UIC.openDownload(scriptUrl + '?download=attachment&page=vf_cash&ref=' + encodeURIComponent(ref || '') + ((id != null && String(id) !== '') ? '&id=' + encodeURIComponent(id) : '') + '&sessionToken=' + encodeURIComponent(SESSION_TOKEN), 'فتح المرفق');
    }
    function attChipsHtml_(list, recordId) {
      return (list || []).map(function (a) {
        return '<button type="button" class="btn btn-outline" style="padding:2px 8px;font-size:11px;margin:1px;" onclick="CASH_PAGE.openAtt(\'' + attArg_(a.ref) + '\',\'' + attArg_(recordId) + '\')">📎 ' + esc(attName_(a.ref)) + '</button>';
      }).join(' ');
    }
    function renderAttList() {
      var host = document.getElementById('cash-att-list');
      if (!host) return;
      host.innerHTML = ATT_KEPT.map(function (a, i) {
        return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">' +
          '<button type="button" class="btn btn-outline" style="padding:3px 8px;font-size:11px;" onclick="CASH_PAGE.openAtt(\'' + attArg_(a.ref) + '\',\'' + attArg_(ATT_RECORD_ID) + '\')">📎 ' + esc(attName_(a.ref)) + '</button>' +
          '<button type="button" class="btn btn-ghost" style="padding:2px 6px;font-size:11px;" onclick="CASH_PAGE.removeAtt(' + i + ')">✕</button>' +
          '</div>';
      }).join('');
    }
    function addAttSlot() {
      var slots = document.getElementById('cash-att-slots');
      if (!slots) return;
      if (slots.querySelectorAll('input[type=file]').length + ATT_KEPT.length >= ATT_MAX) { UIC.toast('الحد الأقصى ' + ATT_MAX + ' ملفات', 'error'); return; }
      ATT_SLOT_SEQ++;
      slots.insertAdjacentHTML('beforeend', UIC.fileField({ key: 'cash-att-' + ATT_SLOT_SEQ, label: '', accept: '.pdf,.doc,.docx,.png,.jpg,.jpeg', instant: true, sheet: 'valley_cash_bank_movement', field: 'attachment', formModalId: 'cash-modal' }));
    }
    function removeAtt(i) { ATT_KEPT.splice(i, 1); renderAttList(); }
    function collectAttachments_() {
      var refs = [], ids = [];
      ATT_KEPT.forEach(function (a) { refs.push(a.ref); ids.push(a.id || ''); });
      document.querySelectorAll('#cash-att-slots input[type=file]').forEach(function (input) {
        var bound = (UIC.UploadSet && UIC.UploadSet.getBound) ? UIC.UploadSet.getBound(input) : null;
        if (bound && bound.ref) { refs.push(bound.ref); ids.push(bound.id || ''); }
      });
      return { refs: refs, ids: ids };
    }

    /* Live grayed previews mirroring the sheet formulas:
     * net = amount - discount | total = net + taxes
     * balance = total ×-1 for Credit/Credit Note else total
     * box_balance Σ = selected box's current Σ balance + this movement's balance */
    function updateCalcPreview() {
      var amt = num0(getVal_('f-amount'));
      var disc = num0(getVal_('f-discount'));
      var taxes = num0(getVal_('f-taxes'));
      var type = getVal_('f-type');
      var boxKey = getVal_('f-box');
      var net = amt - disc;
      var total = net + taxes;
      var balance = (type === 'Credit' || type === 'Credit Note') ? total * -1 : total;
      var setV = function (id, v) { var el = document.getElementById(id); if (el) el.value = Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
      setV('f-net-display', net);
      setV('f-total-display', total);
      setV('f-balance-display', balance);
      var boxCur = 0;
      BOXES.forEach(function (b) { if (String(b.box) === String(boxKey)) boxCur = num0(b.balance); });
      setV('f-boxbal-display', boxCur + balance);
    }

    function save(editId) {
      if (!UIC.validateForm('cash-form')) return;
      var payload = {
        transaction_id: editId != null ? editId : '',
        transaction_date: getVal_('f-date'),
        transaction_type: getVal_('f-type'),
        transaction_method: getVal_('f-method'),
        name: getVal_('f-party'),
        name_vendor: '',
        transaction_details: getVal_('f-details').trim(),
        transaction_amount: getVal_('f-amount'),
        total_discount: getVal_('f-discount'),
        taxes: getVal_('f-taxes'),
        related_box: getVal_('f-box'),
        chart_code: getVal_('f-chart'),
        chart_name: '',
        transaction_purchasing_items: getVal_('f-items').trim(),
        tax_system: readCheckbox('f-tax-system')
      };
      var att = collectAttachments_();
      payload.attachment = att.refs.join('\n');
      payload.attachment_id = att.ids.join('\n');
      /* The row is drawn from what the user typed, immediately, and the
         request stops being the thing they wait for. The box balance cards are
         server-computed, so a QUIET refresh corrects them a moment later
         without the user waiting on it. */
      UIC.Live.save({
        call: companyCall,
        action: 'save_valley_cash',
        data: payload,
        list: HEADERS,
        key: 'transaction_id',
        draft: draftRow(payload, editId),
        render: renderList,
        modal: 'cash-modal',
        message: 'تم الحفظ بنجاح',
        onSuccess: function () { load(true); },
        reload: load
      }).catch(function () { /* UIC.Live has already reported and rolled back */ });
    }

    /* What the list needs to draw a row the server has not confirmed yet. The
       display fields are derived exactly as renderList reads them; anything the
       server computes (the running balance, the approval flag) is left at its
       neutral value and corrected by the quiet refresh. */
    function draftRow(p, editId) {
      var existing = null;
      if (editId != null && editId !== '') {
        HEADERS.forEach(function (h) { if (String(h.transaction_id) === String(editId)) existing = h; });
      }
      var amt = num0(p.transaction_amount);
      var net = amt - num0(p.total_discount);
      var total = net + num0(p.taxes);
      var isCredit = (p.transaction_type === 'Credit' || p.transaction_type === 'Credit Note');
      var boxName = '';
      (window.__cashBoxOptions || []).forEach(function (o) { if (String(o.value) === String(p.related_box)) boxName = o.label; });
      return {
        transaction_id: (editId != null && editId !== '') ? editId : NEXT_ID,
        transaction_date: p.transaction_date,
        date_edit: p.transaction_date,
        date_display: p.transaction_date,
        name: p.name,
        party_name: partyLabel(p.name),
        transaction_details: p.transaction_details,
        transaction_type: p.transaction_type,
        transaction_method: p.transaction_method,
        transaction_amount: amt,
        total_discount: num0(p.total_discount),
        taxes: num0(p.taxes),
        related_box: p.related_box,
        box_name: boxName || p.related_box,
        chart_code: p.chart_code,
        chart_name: '',
        transaction_purchasing_items: p.transaction_purchasing_items,
        tax_system: p.tax_system,
        attachment: p.attachment || '',
        attachment_id: p.attachment_id || '',
        balance_amount: isCredit ? total * -1 : total,
        user: (existing && existing.user) || '',
        approved_bool: existing ? existing.approved_bool : false
      };
    }

    function readCheckbox(id) {
      var el = document.getElementById(id);
      return !!(el && el.checked);
    }

    /* ---------- PARTY QUICK-ADD ---------- */
    /* Same 10-field contract as the Parties page form (save_valley_party
       rejects anything less), opened stacked above the cash form modal.
       UIC.closeModal is stacking-safe: closing this returns to the cash
       form with its values intact. */
    function openPartyQuickAdd() {
      var dirOpts = (window.__cashPartyDirections || []).map(function (v) { return { value: v, label: v }; });
      var typeOpts = (window.__cashPartyTypes || []).map(function (v) { return { value: v, label: v }; });
      var body = '<form id="party-quick-form">' +
        UIC.field({ key: 'q-name', label: 'الاسم', type: 'text', required: true, noCorrect: true }) +
        UIC.combo({ key: 'q-direction', label: 'الاتجاه', required: true, options: dirOpts, placeholder: 'اكتب للبحث…' }) +
        UIC.combo({ key: 'q-type', label: 'نوع التعامل', required: true, options: typeOpts, placeholder: 'اكتب للبحث…' }) +
        UIC.field({ key: 'q-reg', label: 'رقم السجل التجاري', type: 'number', required: true, min: '0' }) +
        UIC.field({ key: 'q-tax', label: 'الرقم الضريبي', type: 'number', required: true, min: '0' }) +
        UIC.field({ key: 'q-name-en', label: 'الاسم الإنجليزي', type: 'text', required: true }) +
        UIC.field({ key: 'q-country', label: 'الدولة', type: 'text', required: true }) +
        UIC.field({ key: 'q-region', label: 'المنطقة', type: 'text', required: true }) +
        UIC.field({ key: 'q-phone', label: 'التليفون', type: 'tel', required: true }) +
        UIC.field({ key: 'q-address', label: 'العنوان', type: 'textarea', required: true }) +
      '</form>';
      UIC.openModal('party-quick-modal', {
        title: 'إضافة عميل / مورد',
        body: body,
        onSave: 'CASH_PAGE.savePartyQuickAdd()'
      });
    }

    function savePartyQuickAdd() {
      if (!UIC.validateForm('party-quick-form')) return;
      var payload = {
        id: '',
        name: getVal_('q-name').trim(),
        customer_direction: getVal_('q-direction'),
        type: getVal_('q-type'),
        registration_number: getVal_('q-reg'),
        tax_id: getVal_('q-tax'),
        name_en: getVal_('q-name-en').trim(),
        country: getVal_('q-country').trim(),
        region: getVal_('q-region').trim(),
        telephone: getVal_('q-phone').trim(),
        address: getVal_('q-address').trim()
      };
      UI.showSpinner();
      companyCall('save_valley_party', payload)
        .then(function (r) {
          var newId = (r && r.id != null && r.id !== '') ? String(r.id) : '';
          UIC.closeModal('party-quick-modal');
          UIC.toast((r && r.message) || 'تمت إضافة الطرف', 'success');
          /* Refresh party options (the save busts the shared vf_parties_opts
             cache), then preselect the new party in the cash form combo. */
          return companyCall('get_valley_cash', { from: DATE_FROM, to: DATE_TO }).then(function (r2) {
            window.__cashPartyOptions = (r2 && r2.party_options) || window.__cashPartyOptions || [];
            if (newId) {
              var hid = document.getElementById('f-party');
              var disp = document.getElementById('f-party_display');
              if (hid) { hid.value = newId; try { hid.dispatchEvent(new Event('change', { bubbles: true })); } catch (e) {} }
              if (disp) {
                var lbl = newId;
                window.__cashPartyOptions.forEach(function (o) { if (String(o.value) === newId) lbl = o.label; });
                disp.value = lbl;
              }
            }
          });
        })
        .catch(function (e) { UIC.toast((e && e.message) || 'تعذر إضافة الطرف', 'error'); })
        .finally(function () { UI.hideSpinner(); });
    }

    /* ---------- TRANSFER ---------- */
    function openTransfer() {
      var body = '<form id="transfer-form">' +
        UIC.field({ key: 'tf-from', label: 'من صندوق / حساب', type: 'select', required: true, options: refOpts(window.__cashBoxOptions), placeholder: 'اختر' }) +
        UIC.field({ key: 'tf-to', label: 'إلى صندوق / حساب', type: 'select', required: true, options: refOpts(window.__cashBoxOptions), placeholder: 'اختر' }) +
        UIC.field({ key: 'tf-date', label: 'تاريخ التحويل', type: 'date', required: true, value: todayStr() }) +
        UIC.field({ key: 'tf-amount', label: 'المبلغ', type: 'number', required: true, min: '0.01', step: '0.01' }) +
        UIC.field({ key: 'tf-details', label: 'ملاحظات', type: 'text' }) +
      '</form>';
      UIC.openModal('transfer-modal', { title: 'تحويل بين الصناديق', body: body, onSave: 'CASH_PAGE.saveTransfer()' });
    }

    function saveTransfer() {
      if (!UIC.validateForm('transfer-form')) return;
      var fromBox = getVal_('tf-from'), toBox = getVal_('tf-to');
      if (!fromBox || !toBox) { UIC.toast('اختر الصندوقين', 'error'); return; }
      if (fromBox === toBox) { UIC.toast('لا يمكن التحويل إلى نفس الصندوق', 'error'); return; }
      UI.showSpinner();
      companyCall('transfer_valley_cash', {
        from_box: fromBox,
        to_box: toBox,
        transaction_date: getVal_('tf-date'),
        amount: getVal_('tf-amount'),
        details: getVal_('tf-details').trim()
      })
        .then(function (r) {
          UIC.closeModal('transfer-modal');
          UIC.toast((r && r.message) || 'تم التحويل', 'success');
          /* One transfer becomes TWO ledger rows with server-assigned ids, so
             there is no honest row to draw ahead of the reply. It refreshes in
             the background instead — the user is not held up either way. */
          load(true);
        })
        .catch(function (e) { UIC.toast((e && e.message) || 'فشل التحويل', 'error'); })
        .finally(function () { UI.hideSpinner(); });
    }

    /* ---------- APPROVE / DELETE ---------- */
    function approve(tid) {
      var row = null;
      HEADERS.forEach(function (h) { if (String(h.transaction_id) === String(tid)) row = h; });
      if (!row) return;
      /* One flag on one row the browser already holds: the pill can flip now
         and go back if the server disagrees. */
      var draft = Object.assign({}, row, { approved_bool: !row.approved_bool });
      UIC.Live.save({
        call: companyCall,
        action: 'approve_valley_cash',
        data: { transaction_id: tid },
        list: HEADERS, key: 'transaction_id', draft: draft, render: renderList,
        message: 'تم',
        onSuccess: function () { load(true); },
        reload: load
      }).catch(function () {});
    }

    function remove(tid) {
      if (!confirm('حذف هذه الحركة نهائياً؟ لا يمكن التراجع.')) return;
      var at = -1;
      HEADERS.forEach(function (h, i) { if (String(h.transaction_id) === String(tid)) at = i; });
      if (at === -1) return;
      /* A delete is its own kind of optimistic write: the row goes now, and is
         put back exactly where it was if the server refuses. UIC.Live.save is
         built around inserting or replacing, so the removal is done here and
         the rollback is explicit. */
      var removed = HEADERS[at];
      HEADERS.splice(at, 1);
      renderList();
      companyCall('delete_valley_cash', { transaction_id: tid })
        .then(function (r) {
          UIC.toast((r && r.message) || 'تم الحذف', 'success');
          load(true);
        })
        .catch(function (e) {
          HEADERS.splice(at, 0, removed);
          renderList();
          UIC.toast((e && e.message) || 'فشل الحذف — لم يتم حذف الحركة', 'error');
        });
    }

    window.CASH_PAGE = {
      openForm: openForm,
      openEdit: openForm,
      save: save,
      openPartyQuickAdd: openPartyQuickAdd,
      savePartyQuickAdd: savePartyQuickAdd,
      openTransfer: openTransfer,
      saveTransfer: saveTransfer,
      approve: approve,
      remove: remove,
      setBoxFilter: function (box) { BOX_FILTER = box; renderList(); },
      openAtt: openAtt,
      removeAtt: removeAtt,
      addAttSlot: addAttSlot,
      /* Both go back to the server: the range is applied to the full ledger,
         not to the slice already in the browser. */
      applyDateFilter: function () {
        var v = UIC.dateRangeValues('cash-date');
        if (v.from && v.to && v.from > v.to) { UIC.toast('«من تاريخ» بعد «إلى تاريخ»', 'error'); return; }
        DATE_FROM = v.from; DATE_TO = v.to;
        load();
      },
      clearDateFilter: function () { DATE_FROM = ''; DATE_TO = ''; load(); }
    };

    document.addEventListener('DOMContentLoaded', renderApp);
  })();
  </script>
</body>
</html>
