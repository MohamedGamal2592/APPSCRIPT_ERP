  <style>
    .exec-wrap{max-width:1500px;margin:0 auto;padding:18px 20px 34px}.exec-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}.exec-title{margin:0;color:var(--text-main);font-size:clamp(21px,2.5vw,31px);font-weight:900}.exec-subtitle{margin:6px 0 0;color:var(--text-muted);font-size:13px;line-height:1.7}.exec-actions{display:flex;gap:8px;flex-wrap:wrap}.exec-btn{min-height:36px;padding:0 13px;border:1px solid var(--border-color);border-radius:var(--radius-md);background:var(--bg-surface);color:var(--text-main);cursor:pointer;font-size:12px;font-weight:800}.exec-btn.primary{background:var(--brand-primary);border-color:var(--brand-primary);color:#fff}.source-strip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:17px}.source-chip{padding:6px 10px;border:1px solid var(--border-color);border-radius:999px;background:var(--bg-surface);color:var(--text-muted);font-size:11px}.source-chip.ok{border-color:#bbf7d0;background:#f0fdf4;color:#166534}.exec-kpis{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:11px;margin-bottom:16px}.exec-kpi{padding:14px;border:1px solid var(--border-color);border-radius:var(--radius-lg);background:var(--bg-surface);box-shadow:var(--shadow-sm)}.exec-kpi-label{color:var(--text-muted);font-size:11px;font-weight:800}.exec-kpi-value{margin-top:7px;color:var(--brand-primary);font-size:clamp(20px,2.5vw,29px);font-weight:900;direction:ltr;text-align:right}.exec-kpi-note{margin-top:5px;color:var(--text-muted);font-size:10px}.exec-kpi.orange .exec-kpi-value{color:#c2410c}.exec-kpi.red .exec-kpi-value{color:#b91c1c}.exec-kpi.green .exec-kpi-value{color:#15803d}.exec-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:15px}.exec-card{min-width:0;padding:16px;border:1px solid var(--border-color);border-radius:var(--radius-lg);background:var(--bg-surface);box-shadow:var(--shadow-sm)}.exec-card.span-6{grid-column:span 6}.exec-card.span-12{grid-column:1/-1}.exec-card-title{margin:0;color:var(--text-main);font-size:15px;font-weight:900}.exec-card-hint{margin:5px 0 13px;color:var(--text-muted);font-size:11px;line-height:1.65}.exec-chart{position:relative;height:510px}.exec-chart.expenses{height:275px}.exec-chart-click{margin-top:7px;color:#2563eb;font-size:10px;font-weight:800}.exec-expense-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.exec-subhead{margin:0 0 8px;color:var(--text-main);font-size:12px;font-weight:900}.exec-table-wrap{margin-top:14px;overflow:auto;border:1px solid var(--border-color);border-radius:var(--radius-md)}.exec-table{width:100%;border-collapse:collapse;font-size:11px}.exec-table th,.exec-table td{padding:8px 9px;border-bottom:1px solid var(--border-color);text-align:right}.exec-table th{background:var(--bg-surface-muted,#f8fafc);color:var(--text-muted);font-weight:900}.exec-table tr:last-child td{border-bottom:0}.exec-table .num{direction:ltr;text-align:left;white-space:nowrap}.exec-empty{padding:34px 10px;text-align:center;color:var(--text-muted);font-size:12px}.exec-note{color:var(--text-muted);font-size:11px;line-height:1.8}.exec-note b{color:var(--text-main)}.exec-modal{position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(15,23,42,.58)}.exec-modal.open{display:flex}.exec-modal-panel{width:min(920px,96vw);max-height:88vh;overflow:auto;background:var(--bg-surface);border:1px solid var(--border-color);border-radius:16px;box-shadow:0 24px 60px rgba(15,23,42,.28)}.exec-modal-head{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border-color);background:var(--bg-surface)}.exec-modal-title{margin:0;color:var(--text-main);font-size:17px;font-weight:900}.exec-modal-close{width:34px;height:34px;border:1px solid var(--border-color);border-radius:9px;background:transparent;color:var(--text-main);cursor:pointer;font-size:20px}.exec-modal-body{padding:16px}.exec-action-line{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px;padding:11px 12px;border-radius:10px;background:#eff6ff;color:#1d4ed8;font-weight:900}.exec-action-line.buy{background:#fff7ed;color:#c2410c}.exec-timeline-title{margin:14px 0 10px;color:var(--text-main);font-size:13px;font-weight:900}.exec-timeline{position:relative;margin:0 0 14px;padding-right:25px}.exec-timeline:before{content:"";position:absolute;right:7px;top:10px;bottom:10px;width:2px;background:#dbeafe}.exec-time-step{position:relative;margin-bottom:9px;padding:10px 12px;border:1px solid var(--border-color);border-radius:10px;background:var(--bg-surface)}.exec-time-step:last-child{margin-bottom:0}.exec-time-step:before{content:"";position:absolute;right:-23px;top:17px;width:10px;height:10px;border:3px solid #fff;border-radius:50%;background:#2563eb;box-shadow:0 0 0 2px #93c5fd}.exec-time-step.action:before{background:#16a34a;box-shadow:0 0 0 2px #86efac}.exec-time-kicker{color:#2563eb;font-size:10px;font-weight:900}.exec-time-step.action .exec-time-kicker{color:#15803d}.exec-time-title{margin-top:2px;color:var(--text-main);font-size:12px;font-weight:900}.exec-time-metrics{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.exec-time-metric{min-width:135px;padding:6px 8px;border-radius:8px;background:var(--bg-surface-muted,#f8fafc)}.exec-time-metric small{display:block;color:var(--text-muted);font-size:9px}.exec-time-metric b{display:block;margin-top:2px;color:var(--text-main);font-size:12px;direction:ltr;text-align:right}.exec-time-note{margin-top:6px;color:var(--text-muted);font-size:10px;line-height:1.6}.exec-reason{padding:11px 12px;border-right:4px solid var(--brand-primary);background:var(--bg-surface-muted,#f8fafc);color:var(--text-main);font-size:11px;line-height:1.8}.exec-component-title{margin:16px 0 8px;color:var(--text-main);font-size:13px;font-weight:900}@media(max-width:900px){.exec-card.span-6{grid-column:1/-1}.exec-expense-grid{grid-template-columns:1fr}}@media(max-width:700px){.exec-wrap{padding:12px 10px 28px}.exec-kpis{grid-template-columns:repeat(2,minmax(130px,1fr))}.exec-chart{height:500px}}

<body>
  <div id="tc-root" dir="rtl"></div>
  <script>
    var params=new URLSearchParams(window.location.search);
    var SESSION_TOKEN=params.get('sessionToken')||(API.getSession()||{}).token||'';
    var scriptUrl=window.scriptUrl||'/';
    var COMPANY_LOGO_URL='<?!= getCompanyLogoUrl_('3fe1b5cb67b7223e') ?>';
    var COMPANY_PAGES=<?!= companyPages ?>;
    var CURRENT_ACTION='<?!= currentAction ?>';
    var USER_PAGES=<?!= user && user.isSuperAdmin ? 'null' : JSON.stringify((user && user.authorizedPages) || {}) ?>;
    var _charts={};
    var _summary={manufacturing:[],purchasing:[],weekly_expenses:[],weekly_expense_accounts:[],weekly_expense_total:0};

    function companyCall(action,data){return API.call('company_action',{target_system:'3fe1b5cb67b7223e',module_action:action,data:data||{}},SESSION_TOKEN)}
    function esc(value){if(typeof FMT!=='undefined'&&FMT.escape)return FMT.escape(value==null?'':String(value));return String(value==null?'':value).replace(/[&<>\"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c])})}
    function num(value){var n=Number(value);return Number.isFinite(n)?n:0}
    function fixed2(value){return num(value).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
    function integer(value){return Math.round(num(value)).toLocaleString('en-US',{maximumFractionDigits:0})}
    function money(value){return fixed2(value)+' EGP'}
    function shortName(value,max){var s=String(value||'');return s.length>max?s.slice(0,max-1)+'…':s}
    function destroyChart(key){if(_charts[key]){try{_charts[key].destroy()}catch(e){}delete _charts[key]}}
    function card(id,title,hint,span,body){return '<section id="'+id+'" class="exec-card span-'+span+'"><h2 class="exec-card-title">'+title+'</h2><p class="exec-card-hint">'+hint+'</p>'+body+'</section>'}
    function kpi(label,value,note,color){return '<div class="exec-kpi '+(color||'')+'"><div class="exec-kpi-label">'+label+'</div><div class="exec-kpi-value">'+value+'</div><div class="exec-kpi-note">'+note+'</div></div>'}

    function load(){UIC.appShell('tc-root',{companyLogoUrl:COMPANY_LOGO_URL,companyLogoHref:scriptUrl+'?action=tc_executive_followup&sessionToken='+encodeURIComponent(SESSION_TOKEN),companyLogoTitle:'توب كيميكال',breadcrumb:'توب كيميكال / المتابعة اليومية التنفيذية',contentId:'tc-content',menuGroups:(window.TOPCHEMICAL_MENU||[])});loadSummary(false)}
    function loadSummary(force){var inner=document.getElementById('tc-content');if(!inner)return;inner.innerHTML='<div class="exec-empty">جاري تحميل قرارات التصنيع والشراء ومصروفات الأسبوع من MySQL…</div>';companyCall('get_executive_followup_summary',{refresh:!!force}).then(function(data){_summary=data||_summary;renderPage()}).catch(function(error){inner.innerHTML='<div class="exec-card" style="max-width:720px;margin:24px auto;text-align:center;color:#b91c1c;">تعذر تحميل المتابعة التنفيذية: '+esc((error&&error.message)||String(error))+'</div>'}).finally(function(){try{UI.hideSpinner()}catch(e){}})}
    function renderPage(){
      var inner=document.getElementById('tc-content');if(!inner)return;
      var make=Array.isArray(_summary.manufacturing)?_summary.manufacturing:[];
      var buy=Array.isArray(_summary.purchasing)?_summary.purchasing:[];
      var expenses=Array.isArray(_summary.weekly_expenses)?_summary.weekly_expenses:[];
      var accounts=Array.isArray(_summary.weekly_expense_accounts)?_summary.weekly_expense_accounts:[];
      var componentIds={};make.forEach(function(r){(r.components||[]).forEach(function(c){componentIds[String(c.component_id)]=true})});
      var componentCount=Object.keys(componentIds).length;
      var refreshed=_summary.source_refreshed_at?String(_summary.source_refreshed_at):'غير متاح';
      inner.innerHTML='<div class="exec-wrap">'+
        '<div class="exec-head"><div><h1 class="exec-title">المتابعة اليومية التنفيذية</h1><p class="exec-subtitle">أولويات قابلة للتنفيذ: الأصناف المطلوب تصنيعها وشراؤها، ثم مصروفات الأسبوع حسب اليوم والحساب.</p></div><div class="exec-actions"><button class="exec-btn" onclick="loadSummary(true)">↻ تحديث القراءة</button><button class="exec-btn primary" onclick="downloadSummary()">تنزيل JSON</button></div></div>'+
        '<div class="source-strip"><span class="source-chip ok">● MySQL فقط</span><span class="source-chip">'+integer(make.length)+' تصنيع · '+integer(buy.length)+' شراء</span><span class="source-chip">لقطة المصدر: '+esc(refreshed)+'</span></div>'+
        '<div class="exec-kpis">'+
          kpi('أصناف تصنيع عاجلة',integer(make.length),'عدد قرارات MAKE المعروضة','')+
          kpi('أصناف شراء عاجلة',integer(buy.length),'عدد قرارات BUY المعروضة','orange')+
          kpi('مصروفات الأسبوع',money(_summary.weekly_expense_total),'من بداية الأسبوع حتى اليوم','red')+
          kpi('خامات مرتبطة',integer(componentCount),'عدد used_products المختلفة','green')+
        '</div><div class="exec-grid">'+
          card('make-card','1) أهم ما يجب تصنيعه','مرتبة من الأعلى احتياجًا إلى الأقل. اضغط على أي عمود لعرض المبررات والمكونات.',6,'<div class="exec-chart"><canvas id="make-chart"></canvas></div><div class="exec-chart-click">اضغط على المنتج لعرض بيانات القرار و used_products</div>')+
          card('buy-card','2) أهم ما يجب شراؤه','مرتبة حسب suggested_buy_qty. اضغط على أي عمود لعرض التنبؤ والمخزون ومبرر القرار.',6,'<div class="exec-chart"><canvas id="buy-chart"></canvas></div><div class="exec-chart-click">اضغط على المنتج لعرض بيانات القرار</div>')+
          card('expense-card','3) مصروفات الأسبوع الحالي','المصدر regular_box_movement؛ حركة credit تُعامل كمصروف، مع أسماء الحسابات من chart_of_accounts_main.',12,'<div class="exec-expense-grid"><div><h3 class="exec-subhead">حسب اليوم</h3><div class="exec-chart expenses"><canvas id="expense-chart"></canvas></div></div><div><h3 class="exec-subhead">حسب دليل الحسابات</h3><div class="exec-chart expenses"><canvas id="expense-account-chart"></canvas></div></div></div>'+renderExpenseTable(accounts)+'<div class="exec-note">إجمالي الأسبوع: <b>'+money(_summary.weekly_expense_total)+'</b> · أيام بها حركة: <b>'+integer(expenses.length)+'</b> · حسابات: <b>'+integer(accounts.length)+'</b></div>')+
          card('source-card','منطق القراءة','الأرقام المالية تعرض بمنزلتين عشريتين وبأرقام إنجليزية. كميات المنتجات لا تُجمع في KPI لأن وحداتها مختلفة.',12,'<div class="exec-note">✓ التصنيع والشراء: <b>COO_TEST</b> · ✓ المكونات: <b>manufacture_headers + manufacture_footers</b> · ✓ المصروفات: <b>regular_box_movement</b> · ✓ أسماء الحسابات: <b>chart_of_accounts_main</b></div>')+
        '</div><div id="exec-modal" class="exec-modal" aria-hidden="true" onclick="if(event.target===this)closeProductModal()"><div class="exec-modal-panel" role="dialog" aria-modal="true" aria-labelledby="exec-modal-title"><div class="exec-modal-head"><h2 id="exec-modal-title" class="exec-modal-title"></h2><button class="exec-modal-close" type="button" onclick="closeProductModal()" aria-label="إغلاق">×</button></div><div id="exec-modal-body" class="exec-modal-body"></div></div></div></div>';
      drawMakeChart(make);drawBuyChart(buy);drawExpenseChart(expenses);drawExpenseAccountChart(accounts);
    }
    function renderExpenseTable(rows){if(!rows.length)return '<div class="exec-empty">لا توجد مصروفات مسجلة على حسابات خلال الأسبوع الحالي.</div>';return '<div class="exec-table-wrap"><table class="exec-table"><thead><tr><th>كود الحساب</th><th>اسم الحساب</th><th>المبلغ</th><th>نسبة الأسبوع</th><th>الحركات</th></tr></thead><tbody>'+rows.map(function(r){return '<tr><td class="num">'+esc(r.account_code)+'</td><td>'+esc(r.account_name||('Account '+r.account_code))+'</td><td class="num"><b>'+money(r.amount)+'</b></td><td class="num">'+fixed2(r.share_pct)+'%</td><td class="num">'+integer(r.moves)+'</td></tr>'}).join('')+'</tbody></table></div>'}
    function summaryDate(){var d=new Date(num(_summary.generated_at)||Date.now());if(isNaN(d.getTime()))d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
    function summaryYear(){return new Date(num(_summary.generated_at)||Date.now()).getFullYear()}
    function maybeFixed2(value){return value===null||value===undefined||value===''?'—':fixed2(value)}
    function timelineMetric(label,value){return '<span class="exec-time-metric"><small>'+esc(label)+'</small><b>'+esc(value)+'</b></span>'}
    function timelineStep(kicker,title,metrics,note,isAction){return '<div class="exec-time-step '+(isAction?'action':'')+'"><div class="exec-time-kicker">'+esc(kicker)+'</div><div class="exec-time-title">'+esc(title)+'</div><div class="exec-time-metrics">'+metrics.map(function(metric){return timelineMetric(metric[0],metric[1])}).join('')+'</div>'+(note?'<div class="exec-time-note">'+esc(note)+'</div>':'')+'</div>'}
    function productDetailHtml(row,kind){
      var isMake=kind==='make',components=Array.isArray(row.components)?row.components:[];
      var year=summaryYear(),actual=num(row.sales_actual_this_year_qty),forecast=num(row.forecast_this_year_qty),attainment=forecast>0?fixed2(actual*100/forecast)+'%':'—';
      var historyNote='سنوات تاريخ المبيعات: '+integer(row.sales_history_years)+' · سنوات تاريخ التصنيع: '+integer(row.manufacture_history_years)+' · آخر سنة مبيعات: '+(num(row.last_sales_year)?integer(row.last_sales_year):'—');
      var html='<div class="exec-action-line '+(isMake?'':'buy')+'"><span>'+(isMake?'قرار التصنيع':'قرار الشراء')+'</span><span>'+fixed2(row.suggested_qty)+'</span></div><h3 class="exec-timeline-title">المسار الزمني المبرر للقرار</h3><div class="exec-timeline">'+
        timelineStep('التاريخ المتاح','الأساس التاريخي',[['متوسط المبيعات المرجح',fixed2(row.weighted_sales_average_qty)],['متوسط التصنيع',fixed2(row.average_manufactured_qty)]],historyNote,false)+
        timelineStep('من '+integer(year)+'-01-01 حتى اليوم','الأداء الفعلي خلال السنة',[['المبيعات الفعلية',fixed2(actual)],['نسبة تحقيق التوقع',attainment]],'هذه مبيعات فعلية وليست توقعًا.',false)+
        timelineStep('لقطة '+summaryDate(),'الوضع الحالي للمخزون',[['المخزون الحالي',fixed2(row.current_stock_qty)],['مخزون الأمان',fixed2(row.safety_stock_qty)],['تغطية المخزون بالأيام',maybeFixed2(row.stock_coverage_days)]],'المخزون قيمة لحظية وقت تحديث البيانات، وليس مجموع السنة.',false)+
        timelineStep('حتى '+integer(year)+'-12-31','الطلب المتوقع حتى نهاية السنة',[['توقع المبيعات',fixed2(forecast)],['احتياج مباشر',fixed2(row.direct_need_qty)],['احتياج تابع',fixed2(row.dependent_need_qty)],['إجمالي الاحتياج',fixed2(row.total_need_qty)],['طلب مدة التوريد',fixed2(row.lead_time_demand_qty)]],'الاحتياج التابع ناتج من ارتباط الصنف بمنتجات أخرى.',false)+
        timelineStep('الإجراء الآن',isMake?'كمية التصنيع المقترحة':'كمية الشراء المقترحة',[[isMake?'تصنيع':'شراء',fixed2(row.suggested_qty)],['ثقة القرار',row.decision_confidence||'—']],'يُنفذ بعد مراجعة القيود التشغيلية والموردين.',true)+'</div>';
      if(row.decision_explanation)html+='<div class="exec-reason"><b>مبرر القرار:</b> '+esc(row.decision_explanation)+'</div>';
      if(isMake){html+='<h3 class="exec-component-title">used_products المطلوبة لتنفيذ كمية التصنيع</h3>'+(components.length?'<div class="exec-table-wrap"><table class="exec-table"><thead><tr><th>المكون</th><th>النسبة للوحدة</th><th>الكمية المطلوبة</th><th>المتاح حاليًا</th></tr></thead><tbody>'+components.map(function(c){return '<tr><td>'+esc(c.component_name)+' <small>#'+esc(c.component_id)+'</small></td><td class="num">'+fixed2(c.unit_ratio)+'</td><td class="num"><b>'+fixed2(c.required_qty)+'</b></td><td class="num">'+fixed2(c.current_qty)+'</td></tr>'}).join('')+'</tbody></table></div>':'<div class="exec-empty">لا توجد نسبة استخدام تاريخية كافية لهذا المنتج.</div>')}
      return html;
    }
    function showProductModal(kind,index){var rows=kind==='make'?(_summary.manufacturing||[]):(_summary.purchasing||[]),row=rows[index],modal=document.getElementById('exec-modal');if(!row||!modal)return;document.getElementById('exec-modal-title').textContent=(row.rank?row.rank+'. ':'')+(row.item_name||('#'+row.item_id));document.getElementById('exec-modal-body').innerHTML=productDetailHtml(row,kind);modal.classList.add('open');modal.setAttribute('aria-hidden','false')}
    function closeProductModal(){var modal=document.getElementById('exec-modal');if(!modal)return;modal.classList.remove('open');modal.setAttribute('aria-hidden','true')}
    function chartOptions(horizontal,moneyMode,onPick){var numberTicks={callback:function(v){return Number(v).toLocaleString('en-US',{minimumFractionDigits:moneyMode?2:0,maximumFractionDigits:2})}},labelTicks={font:{family:'inherit',size:10}},scales=horizontal?{x:{beginAtZero:true,ticks:numberTicks},y:{ticks:labelTicks}}:{x:{ticks:labelTicks},y:{beginAtZero:true,ticks:numberTicks}};return{responsive:true,maintainAspectRatio:false,indexAxis:horizontal?'y':'x',onClick:function(evt,elements){if(onPick&&elements.length)onPick(elements[0].index)},onHover:function(evt,elements){if(evt&&evt.native&&evt.native.target)evt.native.target.style.cursor=onPick&&elements.length?'pointer':'default'},plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){var value=horizontal?ctx.parsed.x:ctx.parsed.y;return ' '+(moneyMode?money(value):fixed2(value))}}}},scales:scales}}
    function drawMakeChart(rows){destroyChart('make');var canvas=document.getElementById('make-chart');if(!canvas||typeof Chart==='undefined')return;_charts.make=new Chart(canvas,{type:'bar',data:{labels:rows.map(function(r){return shortName(r.item_name||('#'+r.item_id),28)}),datasets:[{label:'كمية التصنيع',data:rows.map(function(r){return num(r.suggested_qty)}),backgroundColor:'#2563eb',borderRadius:5}]},options:chartOptions(true,false,function(i){showProductModal('make',i)})})}
    function drawBuyChart(rows){destroyChart('buy');var canvas=document.getElementById('buy-chart');if(!canvas||typeof Chart==='undefined')return;_charts.buy=new Chart(canvas,{type:'bar',data:{labels:rows.map(function(r){return shortName(r.item_name||('#'+r.item_id),28)}),datasets:[{label:'كمية الشراء',data:rows.map(function(r){return num(r.suggested_qty)}),backgroundColor:'#ea580c',borderRadius:5}]},options:chartOptions(true,false,function(i){showProductModal('buy',i)})})}
    function drawExpenseChart(rows){destroyChart('expense');var canvas=document.getElementById('expense-chart');if(!canvas||typeof Chart==='undefined')return;_charts.expense=new Chart(canvas,{type:'bar',data:{labels:rows.map(function(r){return String(r.day||'').slice(5)}),datasets:[{label:'مصروفات اليوم',data:rows.map(function(r){return num(r.amount)}),backgroundColor:'#b91c1c',borderRadius:5}]},options:chartOptions(false,true,null)})}
    function drawExpenseAccountChart(rows){destroyChart('expenseAccount');var canvas=document.getElementById('expense-account-chart');if(!canvas||typeof Chart==='undefined')return;_charts.expenseAccount=new Chart(canvas,{type:'bar',data:{labels:rows.map(function(r){return shortName(r.account_name||('Account '+r.account_code),26)}),datasets:[{label:'مصروف الحساب',data:rows.map(function(r){return num(r.amount)}),backgroundColor:'#7c3aed',borderRadius:5}]},options:chartOptions(true,true,null)})}
    function downloadSummary(){var blob=new Blob([JSON.stringify(_summary,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='topchemical_coo_daily_summary.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000)}
    document.addEventListener('keydown',function(event){if(event.key==='Escape')closeProductModal()});document.addEventListener('DOMContentLoaded',load);
