<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الأذونات والتأخيرات</title>
  <?!= include('CSS_Tokens'); ?>
  <?!= include('UI_Components'); ?>
  <?!= include('Client_Helpers'); ?>
  <?!= include('Company_TopChemical_Nav'); ?>
  <?!= getCompanyThemeCSS_('3fe1b5cb67b7223e') ?>
  <style>
    .permit-type-cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:0 0 14px; }
    .permit-type-card { appearance:none; width:100%; text-align:right; padding:14px 16px; border:1px solid var(--border-color); border-radius:var(--radius-md); background:var(--bg-surface); color:var(--text-main); cursor:pointer; transition:border-color .15s,box-shadow .15s,transform .15s; }
    .permit-type-card:hover { border-color:var(--brand-primary); box-shadow:var(--shadow-sm); transform:translateY(-1px); }
    .permit-type-card[aria-pressed="true"] { border-color:var(--brand-primary); box-shadow:0 0 0 2px var(--brand-border); }
    .permit-type-card-label { display:block; font-size:13px; color:var(--text-muted); margin-bottom:8px; }
    .permit-type-card-count { display:block; font-size:22px; font-weight:700; line-height:1.1; }
    .permit-date-filter { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:0 0 12px; padding:10px 12px; border:1px solid var(--border-color); border-radius:var(--radius-sm); background:var(--bg-surface); }
    .permit-date-filter label { font-size:13px; font-weight:600; }
    .permit-date-filter .input { width:160px; max-width:100%; }
    @media(max-width:520px) { .permit-date-filter .input { flex:1; min-width:130px; } }
  </style>
</head>
<body>
<div id="tc-root" dir="rtl"></div>
<script>
  var params = new URLSearchParams(window.location.search);
  var SESSION_TOKEN = params.get('sessionToken') || (API.getSession() || {}).token || '';
  var scriptUrl = window.scriptUrl || '/';
  var IS_SUPER_ADMIN = <?!= user && user.isSuperAdmin ? 'true' : 'false' ?>;
  var COMPANY_LOGO_URL = '<?!= getCompanyLogoUrl_('3fe1b5cb67b7223e') ?>';
  var COMPANY_PAGES = <?!= companyPages ?>;
  var CURRENT_ACTION = '<?!= currentAction ?>';
  var USER_PAGES = <?!= user && user.isSuperAdmin ? 'null' : JSON.stringify((user && user.authorizedPages) || {}) ?>;
  var CAN_WRITE = UIC.canAdd_(); var CAN_FULL = UIC.canFull_();
  var PERMIT_TYPE_FILTER = '';
  var PERMIT_DATE_FROM = '';
  var PERMIT_DATE_TO = '';

  function companyCall(moduleAction, data) {
    return API.call('company_action', {
      target_system: '3fe1b5cb67b7223e',
      module_action: moduleAction,
      data: data || {}
    }, SESSION_TOKEN);
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function fmtDate(v) {
    if (v == null || v === '') return '';
    var d = (v instanceof Date) ? v : new Date(v);
    if (isNaN(d.getTime())) return String(v);
    var p = function (n) { return ('0' + n).slice(-2); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  function fmtTime(v) {
    if (v == null || v === '') return '';
    if (v instanceof Date) {
      var p = function (n) { return ('0' + n).slice(-2); };
      return p(v.getHours()) + ':' + p(v.getMinutes());
    }
    var s = String(v);
    if (s.indexOf('T') !== -1) { var dt = new Date(s); if (!isNaN(dt.getTime())) return fmtTime(dt); }
    return s;
  }

  function todayStr() {
    var d = new Date();
    var p = function (n) { return ('0' + n).slice(-2); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  function load() {
    var contentId = 'permit-content';
    UIC.appShell('tc-root', {
      companyLogoUrl: COMPANY_LOGO_URL,
      companyLogoHref: scriptUrl + '?action=tc_dashboard&sessionToken=' + SESSION_TOKEN,
      companyLogoTitle: 'توب كيميكال',
      breadcrumb: 'توب كيميكال / شئون العاملين / الأذونات والتأخيرات',
      contentId: contentId,
      menuGroups: (window.TOPCHEMICAL_MENU || [])
    });
    fetchPermits();
  }

  function fetchPermits(quiet) {
    if (!quiet) UI.showSpinner();
    companyCall('get_emp_permits', { loadAll: true })
      .then(function (r) {
        window.__rows = r.rows || [];
        window.__empOptions = r.employee_options || [];
        window.__permitOptions = r.permit_options || [];
        renderPermits();
      })
      .catch(function (e) { showError(e); })
      .finally(function () { if (!quiet) UI.hideSpinner(); try{schedulePrefetch();}catch(e){} });
  }

  function renderPermits() {
    var body = document.getElementById('permit-content');
    if (!body) return;
    var allRows = window.__rows || [];
    var options = window.__permitOptions || [];
    var typesByValue = {};
    options.forEach(function (o) {
      if (o && o.value != null && String(o.value) !== '') {
        typesByValue[String(o.value)] = String(o.label || o.value);
      }
    });
    allRows.forEach(function (r) {
      var value = String(r.permit_type || 'أخرى');
      if (!typesByValue[value]) typesByValue[value] = value;
    });
    var types = Object.keys(typesByValue).sort(function (a, b) {
      var order = ['انصراف باكر', 'حضور متأخر'];
      var ia = order.indexOf(a), ib = order.indexOf(b);
      if (ia !== -1 || ib !== -1) return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
      return typesByValue[a].localeCompare(typesByValue[b], 'ar');
    });
    var dateRows = allRows.filter(function (r) {
      var date = fmtDate(r.permit_date);
      if (!date) return !PERMIT_DATE_FROM && !PERMIT_DATE_TO;
      return (!PERMIT_DATE_FROM || date >= PERMIT_DATE_FROM) && (!PERMIT_DATE_TO || date <= PERMIT_DATE_TO);
    });
    var counts = {};
    dateRows.forEach(function (r) {
      var value = String(r.permit_type || 'أخرى');
      counts[value] = (counts[value] || 0) + 1;
    });
    var visibleRows = dateRows.filter(function (r) {
      return !PERMIT_TYPE_FILTER || String(r.permit_type || 'أخرى') === PERMIT_TYPE_FILTER;
    }).slice().sort(function (a, b) {
      return fmtDate(b.permit_date).localeCompare(fmtDate(a.permit_date));
    });
    var cards = [{ value: '', label: 'كل الأنواع', count: dateRows.length }].concat(types.map(function (value) {
      return { value: value, label: typesByValue[value], count: counts[value] || 0 };
    }));
    var html = '<div class="permit-type-cards" aria-label="تصفية حسب نوع الإذن">' + cards.map(function (card) {
      return '<button type="button" class="permit-type-card" data-permit-type="' + esc(card.value) + '" aria-pressed="' + (PERMIT_TYPE_FILTER === card.value ? 'true' : 'false') + '">' +
        '<span class="permit-type-card-label">' + esc(card.label) + '</span>' +
        '<span class="permit-type-card-count">' + card.count + '</span>' +
        '<span class="permit-type-card-label" style="margin:6px 0 0;">سجل</span></button>';
    }).join('') + '</div>' +
      '<div class="permit-date-filter" aria-label="تصفية حسب نطاق التاريخ">' +
        '<label for="permit-date-from">من:</label><input id="permit-date-from" class="input" type="date" value="' + esc(PERMIT_DATE_FROM) + '">' +
        '<label for="permit-date-to">إلى:</label><input id="permit-date-to" class="input" type="date" value="' + esc(PERMIT_DATE_TO) + '">' +
        '<button type="button" class="btn btn-outline" id="permit-date-clear">مسح التاريخ</button>' +
      '</div>' +
      (CAN_WRITE ? '<div style="display:flex;justify-content:flex-end;margin-bottom:12px;"><button type="button" class="btn btn-primary" id="permit-add">+ تسجيل إذن' + (PERMIT_TYPE_FILTER ? ' — ' + esc(typesByValue[PERMIT_TYPE_FILTER] || PERMIT_TYPE_FILTER) : '') + '</button></div>' : '');
    var rows = visibleRows.map(function (r) {
      /* Tier A: name_ar/total_minutes are sheet formulas, so a __pending row
         shows «—» there and never a guessed value. This page has no row
         actions, so there is nothing to gate. */
      var pending = !!r.__pending;
      return {
        emp_id: r.emp_id,
        name_ar: pending ? '—' : esc(r.name_ar || '-'),
        permit_type: esc(r.permit_type || '-'),
        permit_date: fmtDate(r.permit_date),
        start_time: fmtTime(r.start_time),
        end_time: fmtTime(r.end_time),
        total_minutes: pending ? '—' : r.total_minutes
      };
    });
    var headers = [
      { key: 'emp_id', label: 'كود الموظف', numeric: true },
      { key: 'name_ar', label: 'الاسم' },
      { key: 'permit_type', label: 'النوع' },
      { key: 'permit_date', label: 'التاريخ' },
      { key: 'start_time', label: 'من' },
      { key: 'end_time', label: 'إلى' },
      { key: 'total_minutes', label: 'الدقائق', numeric: true }
    ];
    html += UIC.dataTable('permit-table', {
        title: 'الأذونات والتأخيرات',
        headers: headers,
        rows: rows,
        emptyText: PERMIT_TYPE_FILTER ? 'لا توجد أذونات من هذا النوع في الفترة المحددة' : 'لا توجد أذونات في الفترة المحددة'
      });
    body.innerHTML = html;
    Array.prototype.forEach.call(body.querySelectorAll('[data-permit-type]'), function (card) {
      card.addEventListener('click', function () {
        PERMIT_TYPE_FILTER = String(card.getAttribute('data-permit-type') || '');
        renderPermits();
      });
    });
    var dateFrom = document.getElementById('permit-date-from');
    var dateTo = document.getElementById('permit-date-to');
    var clearDates = document.getElementById('permit-date-clear');
    if (dateFrom) dateFrom.addEventListener('change', updatePermitDateRange);
    if (dateTo) dateTo.addEventListener('change', updatePermitDateRange);
    if (clearDates) clearDates.addEventListener('click', clearPermitDateRange);
    var add = document.getElementById('permit-add');
    if (add) add.addEventListener('click', function () { openAddModal({ type: PERMIT_TYPE_FILTER }); });
    UIC.initTableSort('permit-table');
  }

  function updatePermitDateRange() {
    PERMIT_DATE_FROM = (document.getElementById('permit-date-from') || {}).value || '';
    PERMIT_DATE_TO = (document.getElementById('permit-date-to') || {}).value || '';
    if (PERMIT_DATE_FROM && PERMIT_DATE_TO && PERMIT_DATE_FROM > PERMIT_DATE_TO) {
      var swap = PERMIT_DATE_FROM;
      PERMIT_DATE_FROM = PERMIT_DATE_TO;
      PERMIT_DATE_TO = swap;
    }
    renderPermits();
  }

  function clearPermitDateRange() {
    PERMIT_DATE_FROM = '';
    PERMIT_DATE_TO = '';
    renderPermits();
  }

  function openAddModal(prefill) {
    prefill = prefill || {};
    var lockedType = PERMIT_TYPE_FILTER || prefill.type || '';
    var allTypeOptions = window.__permitOptions || [];
    var formTypeOptions = lockedType
      ? allTypeOptions.filter(function (o) { return String(o.value) === String(lockedType); })
      : allTypeOptions;
    if (lockedType && !formTypeOptions.length) formTypeOptions = [{ value: lockedType, label: lockedType }];
    var body =
      '<form id="permit-form">' +
      UIC.field({ key: 'emp_id', label: 'الموظف', type: 'select', required: true,
        options: window.__empOptions || [], placeholder: 'اختر الموظف...' }) +
      UIC.field({ key: 'permit_type', label: 'نوع الإذن', type: 'select', required: true,
        options: formTypeOptions, placeholder: lockedType ? '' : 'اختر النوع...', value: lockedType }) +
      UIC.field({ key: 'permit_date', label: 'التاريخ', type: 'date', required: true, value: todayStr() }) +
      UIC.field({ key: 'start_time', label: 'وقت البداية', type: 'time', required: true, value: '08:00' }) +
      UIC.field({ key: 'end_time', label: 'وقت النهاية', type: 'time', required: true }) +
      '</form>';
    UIC.openModal('permit-modal', {
      title: lockedType ? 'تسجيل — ' + lockedType : 'تسجيل إذن / تأخير',
      body: body,
      onSave: 'savePermit()'
    });
    var permitType = document.getElementById('permit_type');
    var permitTypeDisplay = document.getElementById('permit_type_display');
    if (permitType && lockedType) {
      permitType.setAttribute('aria-disabled', 'true');
      permitType.setAttribute('title', 'النوع محدد من البطاقة المختارة');
      permitType.tabIndex = -1;
      permitType.style.pointerEvents = 'none';
      permitType.style.background = 'var(--bg-subtle)';
    }
    if (permitTypeDisplay && lockedType) {
      permitTypeDisplay.disabled = true;
      permitTypeDisplay.setAttribute('aria-disabled', 'true');
      permitTypeDisplay.setAttribute('title', 'النوع محدد من البطاقة المختارة');
      permitTypeDisplay.style.background = 'var(--bg-subtle)';
      permitTypeDisplay.style.cursor = 'not-allowed';
    }
  }

  function savePermit() {
    if (!UIC.validateForm('permit-form')) return;
    var data = UIC.collectForm('permit-form');
    /* Tier A: the row is on screen before the request returns. These rows
       carry no server-assigned id, so `key` names an absent field and the
       machinery tracks the draft with its own __tmp_ value; recordOf replaces
       it with the server's record. queueable:false: I1 is unproven for
       add_emp_permit, so a transport failure rolls back loudly. */
    var draft = {
      emp_id: data.emp_id,
      permit_type: data.permit_type,
      permit_date: data.permit_date,
      start_time: data.start_time,
      end_time: data.end_time
    };
    window.__rows = window.__rows || [];
    UIC.Live.save({
      call: companyCall,
      action: 'add_emp_permit',
      data: data,
      list: window.__rows,
      key: 'unique_id',
      draft: draft,
      render: renderPermits,
      modal: 'permit-modal',
      message: 'تم الحفظ',
      queueable: false,
      reload: function () { fetchPermits(true); },
      recordOf: function (resp) {
        if (!resp || !resp.record) return null;
        var rec = Object.assign({}, draft, resp.record);
        if (resp.unique_id) rec.unique_id = resp.unique_id;
        if (resp.id != null && resp.id !== '') rec.id = resp.id;
        return rec;
      },
      /* The page owns the full bounded list so card counts stay accurate. */
      onSuccess: function () {
        renderPermits();
      }
    }).catch(function () { /* UIC.Live has toasted and rolled back */ });
  }

  function showError(e) {
    var body = document.getElementById('permit-content');
    if (body) body.innerHTML = '<div class="empty-state"><span>' + esc(e.message || 'خطأ') + '</span></div>';
  }

  /* Another device's change arrives quietly. */
  UIC.Live.watchPage({
    call: companyCall,
    page: 'tc_emp_permits',
    onChange: function () { UIC.Live.arrive(function () { fetchPermits(true); }); }
  });
  /* [live-notice] the view on screen */
  UIC.Live.setView('list', { refresh: function () { fetchPermits(true); } });

  load();
</script>
</body>
</html>
