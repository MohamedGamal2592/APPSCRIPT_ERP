<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مراجعة مديونيات النظام الرئيسي</title>
  <?!= include('CSS_Tokens'); ?>
  <?!= include('UI_Components'); ?>
  <?!= include('Client_Helpers'); ?>
  <?!= include('Company_TopChemical_Nav'); ?>
  <?!= getCompanyThemeCSS_('3fe1b5cb67b7223e') ?>
  <style>
    .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 12px; }
    .filter-bar .form-field { margin: 0; min-width: 150px; }
    .pager { display: flex; gap: 8px; align-items: center; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
    .pager .page-info { color: var(--text-muted); font-size: 13px; }
    .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .pill-0 { background: #fef3c7; color: #92400e; }
    .pill-1 { background: #dcfce7; color: #166534; }
    .num { text-align: left; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
<div id="tc-root" dir="rtl"></div>
<script>
  var params = new URLSearchParams(window.location.search);
  var SESSION_TOKEN = params.get('sessionToken') || (API.getSession() || {}).token || '';
  var scriptUrl = window.scriptUrl || '/';
  var COMPANY_LOGO_URL = '<?!= getCompanyLogoUrl_('3fe1b5cb67b7223e') ?>';
  var COMPANY_PAGES = <?!= companyPages ?>;
  var CURRENT_ACTION = '<?!= currentAction ?>';
  var IS_SUPER_ADMIN = <?!= user && user.isSuperAdmin ? 'true' : 'false' ?>;
  var USER_PAGES = <?!= user && user.isSuperAdmin ? 'null' : JSON.stringify((user && user.authorizedPages) || {}) ?>;
  var CAN_WRITE = UIC.canAdd_(); var CAN_FULL = UIC.canFull_();

  var FILTER = { payment_from: '', payment_to: '', is_revised: '', offset: 0, limit: 50 };
  var LAST = { total: 0, rows: [] };

  function companyCall(moduleAction, data) {
    return API.call('company_action', {
      target_system: '3fe1b5cb67b7223e',
      module_action: moduleAction,
      data: data || {}
    }, SESSION_TOKEN);
  }

  function load() {
    UIC.appShell('tc-root', {
      companyLogoUrl: COMPANY_LOGO_URL,
      companyLogoHref: scriptUrl + '?action=tc_dashboard&sessionToken=' + SESSION_TOKEN,
      companyLogoTitle: 'توب كيميكال',
      breadcrumb: 'توب كيميكال / تحليلات النظام الرئيسي / مراجعة مديونيات النظام الرئيسي',
      contentId: 'main-review-content',
      menuGroups: (window.TOPCHEMICAL_MENU || [])
    });
    renderFilters();
    fetchPage();
  }

  function renderFilters() {
    var body = document.getElementById('main-review-content');
    body.innerHTML =
      '<div class="filter-bar">' +
        '<div class="form-field"><label class="form-label">من تاريخ استحقاق</label>' +
          '<input id="f-from" type="date" class="input" value="' + FMT.escape(FILTER.payment_from) + '"></div>' +
        '<div class="form-field"><label class="form-label">إلى تاريخ استحقاق</label>' +
          '<input id="f-to" type="date" class="input" value="' + FMT.escape(FILTER.payment_to) + '"></div>' +
        '<div class="form-field"><label class="form-label">حالة المراجعة</label>' +
          '<select id="f-rev" class="input">' +
            '<option value="">الكل</option>' +
            '<option value="0">غير مراجع</option>' +
            '<option value="1">مراجع</option>' +
          '</select></div>' +
        '<button class="btn btn-primary" onclick="applyFilters()">بحث</button>' +
        '<button class="btn btn-outline" onclick="resetFilters()">تصفير</button>' +
      '</div>' +
      '<div id="review-table"></div>' +
      '<div id="review-pager" class="pager"></div>';
    document.getElementById('f-rev').value = FILTER.is_revised;
  }

  function applyFilters() {
    var from = document.getElementById('f-from').value;
    var to = document.getElementById('f-to').value;
    if (from && to && from > to) { UIC.toast('تاريخ "من" يجب أن يكون قبل تاريخ "إلى"', 'error'); return; }
    FILTER.payment_from = from;
    FILTER.payment_to = to;
    FILTER.is_revised = document.getElementById('f-rev').value;
    FILTER.offset = 0;
    fetchPage();
  }

  function resetFilters() {
    FILTER = { payment_from: '', payment_to: '', is_revised: '', offset: 0, limit: 50 };
    renderFilters();
    fetchPage();
  }

  function fetchPage() {
    UIC.readSkeleton('review-table', { message: 'جاري تحميل البيانات...' });
    companyCall('get_main_review', FILTER)
      .then(function (r) {
        LAST.total = r.total || 0;
        LAST.rows = r.rows || [];
        renderTable();
        renderPager();
      })
      .catch(function (e) { showError(e); })
      .finally(function () { UI.hideSpinner(); try{schedulePrefetch();}catch(e){} });
  }

  function revisePill(v) {
    return String(v) === '1'
      ? '<span class="pill pill-1">مراجع</span>'
      : '<span class="pill pill-0">غير مراجع</span>';
  }

  function renderTable() {
    var el = document.getElementById('review-table');
    if (!LAST.rows.length) {
      el.innerHTML = '<div class="empty-state"><span>لا توجد بيانات مطابقة للفلاتر</span></div>';
      return;
    }
    var html = '<div class="table-wrap"><table id="review-table" class="table">' +
      '<thead><tr><th>#</th><th>العميل</th><th>المبلغ</th><th>تاريخ الاستحقاق</th>' +
      '<th>ملاحظات</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>';
    LAST.rows.forEach(function (row, i) {
      var id = FMT.escape(row.client_balance_sheet_id == null ? '' : String(row.client_balance_sheet_id));
      var isRev = String(row.is_revised) === '1';
      var canRev = !isRev && CAN_WRITE;
      html += '<tr id="mr-row-' + id + '">' +
        '<td class="num">' + id + '</td>' +
        '<td>' + FMT.escape(row.name_ar || '-') + '</td>' +
        '<td class="num">' + FMT.escape(row.balance_amount == null ? '-' : String(row.balance_amount)) + '</td>' +
        '<td>' + FMT.escape(row.payment_date || '-') + '</td>' +
        '<td>' + FMT.escape(row.notes || '-') + '</td>' +
        '<td>' + revisePill(row.is_revised) + '</td>' +
        '<td>' + (canRev
          ? UIC.actionBtns([{ label: 'مراجعة', onclick: 'confirmRevise(\'' + id + '\')', color: '#16a34a' }])
          : '<span style="color:#9ca3af;">—</span>') + '</td>' +
        '</tr>';
    });
    html += '</tbody></table></div>';
    el.innerHTML = html;
    UIC.autoColumns('review-table');
  }

  function renderPager() {
    var el = document.getElementById('review-pager');
    var pages = Math.max(1, Math.ceil(LAST.total / FILTER.limit));
    var cur = Math.floor(FILTER.offset / FILTER.limit) + 1;
    var from = LAST.total === 0 ? 0 : FILTER.offset + 1;
    var to = Math.min(FILTER.offset + FILTER.limit, LAST.total);
    el.innerHTML =
      '<button class="btn btn-outline" onclick="gotoPage(' + (cur - 1) + ')" ' + (cur <= 1 ? 'disabled' : '') + '>السابق</button>' +
      '<span class="page-info">صفحة ' + cur + ' من ' + pages + ' — عرض ' + from + ' إلى ' + to + ' من ' + LAST.total + '</span>' +
      '<button class="btn btn-outline" onclick="gotoPage(' + (cur + 1) + ')" ' + (cur >= pages ? 'disabled' : '') + '>التالي</button>';
  }

  function gotoPage(p) {
    var pages = Math.max(1, Math.ceil(LAST.total / FILTER.limit));
    if (p < 1 || p > pages) return;
    FILTER.offset = (p - 1) * FILTER.limit;
    fetchPage();
  }

  function confirmRevise(id) {
    if (!CAN_WRITE) { UIC.toast('غير مصرح', 'error'); return; }
    if (!confirm('اعتماد مراجعة البند رقم ' + id + '؟')) return;
    UI.showSpinner('جاري اعتماد المراجعة...');
    companyCall('revise_main_review', { client_balance_sheet_id: id })
      .then(function (r) {
        UIC.toast('تم اعتماد المراجعة', 'success');
        var row = LAST.rows.find(function (x) { return String(x.client_balance_sheet_id) === String(id); });
        if (row) { row.is_revised = '1'; renderTable(); }
        else { fetchPage(); }
      })
      .catch(function (e) { UIC.toast(e.message || 'خطأ', 'error'); })
      .finally(function () { UI.hideSpinner(); });
  }

  function showError(e) {
    var el = document.getElementById('review-table');
    if (el) el.innerHTML = '<div class="empty-state"><span>' + FMT.escape((e && e.message) || 'خطأ') + '</span></div>';
    var pg = document.getElementById('review-pager');
    if (pg) pg.innerHTML = '';
  }

  load();
</script>
</body>
</html>
