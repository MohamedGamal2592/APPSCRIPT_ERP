<body>
<div id="tc-root" dir="rtl"></div>
<script>
  var params        = new URLSearchParams(window.location.search);
  var SESSION_TOKEN = params.get('sessionToken') || (API.getSession() || {}).token || '';
  var scriptUrl     = window.scriptUrl || '/';
  var COMPANY_LOGO_URL = '<?!= getCompanyLogoUrl_('3fe1b5cb67b7223e') ?>';
  var COMPANY_PAGES    = <?!= companyPages ?>;
  var CURRENT_ACTION   = '<?!= currentAction ?>';
  var IS_SUPER_ADMIN   = <?!= user && user.isSuperAdmin ? 'true' : 'false' ?>;
  var USER_PAGES       = <?!= user && user.isSuperAdmin ? 'null' : JSON.stringify((user && user.authorizedPages) || {}) ?>;
  var CAN_WRITE = UIC.canAdd_();
  var CAN_FULL  = UIC.canFull_();

  /* ── state (VIEW-ONLY page: no add / edit / delete here) ── */
  var H = {
    columns:    [],   /* manufacture_headers columns, as returned from server */
    rows:       [],
    total:      0,
    loadedAll:  false,
    loadingMore: false,
    loadMoreError: ''
  };
  /* JSON loading: the newest 20 orders paint first, then the rest arrive by
     themselves in 1000-row windows (the server's per-request ceiling), each
     one a single JSON aggregate. Every order ends up in the browser, and
     search, sort and paging run on that local copy with no further calls. */
  var MO_FIRST_LIMIT = 20, MO_MORE_LIMIT = 1000, MO_REQUEST_SEQ = 0, MO_MORE_SEQ = 0;
  /* dropdown refs — every product (id -> name_ar, code, unit) for the
     searchable product pickers and for resolving product_id to its name. */
  var REFS = { products: [], products_full: [], warehouses: [], statuses: [] };
  var REFS_READY = null;          /* promise: settles once refs are usable */
  var MO_COMPANY = '3fe1b5cb67b7223e';
  var MO_REFS_VERSION = 'mo-refs-all-products-v1';
  /* Footer lines per order, kept after the first read: reopening an order's
     lines paints at once from here while a fresh read runs behind it. */
  var FOOT_CACHE = {};

  /* ── real PK column — confirmed from schema ── */
  var H_PK = 'id';

  /* ── columns hidden from VIEW ONLY (never mapped into the data table,
     so they never render, export or print; page performs no writes) ── */
  var MO_HIDDEN = {
    'user_id': true,            /* معرف المستخدم */
    'user_type': true,          /* نوع المستخدم */
    'is_product': true,         /* منتج؟ (0/1) */
    'admin_approved': true,     /* اعتماد الإدارة (0/1) */
    'admin_approved_at': true,  /* تاريخ اعتماد الإدارة */
    'created_at': true,         /* تاريخ الإنشاء */
    'updated_at': true,         /* آخر تحديث */
    'deleted_at': true          /* تاريخ الحذف */
  };

  /* ── unified ERP table columns (UIC.dataTable contract) ──
     ONE product column showing the Arabic name — the raw product_id and the
     joined product_label are never separate columns (no repetition). */
  var MO_HEADERS = [
    { key: 'id', label: '#', numeric: true },
    { key: 'name_ar', label: 'الاسم (عربي)' },
    { key: 'expected_quantity', label: 'الكمية المتوقعة', numeric: true },
    { key: 'deliver_quantity', label: 'كمية التسليم', numeric: true },
    { key: 'product', label: 'الصنف' },
    { key: 'status', label: 'الحالة' },
    { key: 'manufacture_number', label: 'رقم أمر التصنيع' },
    { key: 'manufacture_delivery_number', label: 'رقم تسليم التصنيع' },
    { key: 'is_revised', label: 'مراجَع' },
    { key: 'actions', label: 'إجراءات' }
  ];

  /* ── human-readable Arabic labels (footer modal) ── */
  var F_LABELS = {
    'id':                   '# المعرف',
    'manufacture_header_id': 'معرف الأمر',
    'product_id':           'الصنف/المنتج',
    'product_name_ar':      'اسم الصنف',
    'product_code':         'كود الصنف',
    'product_code_ref':     'كود الصنف (مرجع)',
    'productUnit':          'الوحدة',
    'product_unit_ref':     'الوحدة (مرجع)',
    'productQuantity':      'الكمية',
    'warehouse_id':         'المخزن',
    'created_at':           'تاريخ الإنشاء',
    'updated_at':           'آخر تحديث'
  };

  function fLabel(col) { return F_LABELS[col] || col; }

  /* ── edit support (super admin via CAN_WRITE; view stays unified) ──
     The edit modal iterates the FULL server column set, so hidden-from-view
     columns remain editable by the super admin. Server strips PK/timestamps. */
  var H_READ_ONLY = { 'id': true, 'created_at': true, 'updated_at': true };
  var F_READ_ONLY = { 'id': true, 'manufacture_header_id': true, 'created_at': true, 'updated_at': true };
  /* Joined ref columns render as text inside the editable footer grid. */
  var F_DISPLAY_ONLY = { 'product_name_ar': true, 'product_code_ref': true, 'product_unit_ref': true };
  /* Hidden from the footers view: audit timestamps + warehouse. */
  var F_HIDE_VIEW = { 'created_at': true, 'updated_at': true, 'warehouse_id': true };
  var H_NUMERIC = { user_id:1, expected_quantity:1, deliver_quantity:1, is_product:1,
                    product_id:1, admin_approved:1, is_revised:1, id:1 };
  var F_NUMERIC = { manufacture_header_id:1, product_id:1, productQuantity:1,
                    warehouse_id:1, id:1 };
  var H_DATES = { admin_approved_at:1, created_at:1, updated_at:1, deleted_at:1 };
  var H_FLAGS = { is_product:1, admin_approved:1, is_revised:1 };
  var H_LABELS = {
    'id': 'المعرف', 'user_id': 'معرف المستخدم', 'user_type': 'نوع المستخدم',
    'name_ar': 'الاسم (عربي)', 'expected_quantity': 'الكمية المتوقعة',
    'deliver_quantity': 'كمية التسليم', 'is_product': 'منتج؟ (0/1)',
    'product_id': 'معرف الصنف', 'product_label': 'الصنف (اسم)',
    'status': 'الحالة', 'manufacture_number': 'رقم أمر التصنيع',
    'manufacture_delivery_number': 'رقم تسليم التصنيع',
    'admin_approved': 'اعتماد الإدارة (0/1)',
    'admin_approved_at': 'تاريخ اعتماد الإدارة',
    'created_at': 'تاريخ الإنشاء', 'updated_at': 'آخر تحديث',
    'deleted_at': 'تاريخ الحذف', 'is_revised': 'مراجَع (0/1)'
  };
  function hLabel(col) { return H_LABELS[col] || col; }

  /* Header product -> Arabic name. Prefers the server-joined product_label,
     then the footer-joined product_name_ar, falls back to the REFS lookup,
     then to the raw id. */
  function productNameFor(row) {
    if (row.product_label !== null && row.product_label !== undefined && String(row.product_label) !== '') {
      return String(row.product_label);
    }
    if (row.product_name_ar !== null && row.product_name_ar !== undefined && String(row.product_name_ar) !== '') {
      return String(row.product_name_ar);
    }
    var pid = row.product_id;
    if (pid === null || pid === undefined || String(pid) === '') return '';
    var list = REFS.products_full.length ? REFS.products_full : REFS.products;
    for (var i = 0; i < list.length; i++) {
      if (String(list[i].value) === String(pid)) return list[i].label;
    }
    return '#' + pid;
  }

  /* ── company API call helper ── */
  function companyCall(moduleAction, data) {
    return API.call('company_action', {
      target_system: '3fe1b5cb67b7223e',
      module_action:  moduleAction,
      data:           data || {}
    }, SESSION_TOKEN);
  }

  /* ══════════════════ INIT ══════════════════ */
  function load() {
    UIC.appShell('tc-root', {
      companyLogoUrl:   COMPANY_LOGO_URL,
      companyLogoHref:  scriptUrl + '?action=tc_dashboard&sessionToken=' + SESSION_TOKEN,
      companyLogoTitle: 'توب كيميكال',
      breadcrumb: 'توب كيميكال / تحليلات النظام الرئيسي / أوامر التصنيع (manufacture_headers)',
      contentId: 'mo-content',
      menuGroups: (window.TOPCHEMICAL_MENU || [])
    });
    fetchRefs();
    fetchHeaders(false);
  }

  /* ══════════════════ DATA — headers ══════════════════ */
  function fetchHeaders(loadAll) {
    if (loadAll === true) return loadMoreHeaders();
    if (loadAll === false) {
      MO_REQUEST_SEQ++;
      H.loadingMore = false; MO_MORE_SEQ = 0; H.loadMoreError = '';
      H.rows = []; H.columns = []; H.total = 0; H.loadedAll = false;
    } else if (H.loadingMore) return Promise.resolve();
    var requested = Math.max(H.rows.length, MO_FIRST_LIMIT);
    var hasRows = H.rows.length > 0;
    var requestSeq = ++MO_REQUEST_SEQ;
    if (!hasRows) UIC.readSkeleton('mo-content', { message: 'جاري تحميل أوامر التصنيع...' });
    else updateHeaderLoadControl('جاري تحديث البيانات...');
    return requestHeaderWindow(requested).then(function (res) {
      if (requestSeq !== MO_REQUEST_SEQ) return;
      H.columns = res.columns || [];
      H.rows = res.rows || [];
      H.total = Number(res.total) || 0;
      H.loadedAll = H.rows.length >= H.total;
      renderPage();
    }).catch(function (e) {
      if (requestSeq !== MO_REQUEST_SEQ) return;
      if (hasRows) updateHeaderLoadControl('تعذر تحديث البيانات. يمكنك إعادة المحاولة.');
      else showHeaderLoadError(e);
    }).finally(function () {
      UI.hideSpinner();
      if (requestSeq === MO_REQUEST_SEQ) continueLoadingHeaders();
    });
  }

  /* Keep pulling windows until every order is in the browser. Stops on the
     first failure and leaves an inline retry; a new fetchHeaders (refresh)
     supersedes a running chain through MO_REQUEST_SEQ. */
  function continueLoadingHeaders() {
    if (H.loadedAll || H.loadingMore || H.loadMoreError || !H.rows.length) return;
    var p = loadMoreHeaders();
    if (p && typeof p.then === 'function') {
      p.then(function () {
        if (!H.loadedAll && !H.loadMoreError) setTimeout(continueLoadingHeaders, 0);
      });
    }
  }
  function retryLoadingHeaders() {
    H.loadMoreError = '';
    continueLoadingHeaders();
  }

  function requestHeaderWindow(count) {
    var rows = [], columns = [], total = 0, offset = 0;
    var target = Math.max(Number(count) || MO_FIRST_LIMIT, MO_FIRST_LIMIT);
    function next() {
      if (offset >= target || (total && offset >= total)) return Promise.resolve({ columns: columns, rows: rows, total: total });
      var limit = Math.min(MO_MORE_LIMIT, target - offset);
      return companyCall('get_manufacture_headers', { limit: limit, offset: offset }).then(function (res) {
        res = res || {};
        if (!columns.length) columns = res.columns || [];
        total = Number(res.total) || 0;
        var batch = res.rows || [];
        rows = rows.concat(batch); offset += batch.length;
        if (!batch.length) return { columns: columns, rows: rows, total: total };
        return next();
      });
    }
    return next();
  }

  function loadMoreHeaders() {
    if (H.loadingMore || H.loadedAll) return;
    if (!H.rows.length) return fetchHeaders(false);
    var offset = H.rows.length;
    var requestSeq = ++MO_REQUEST_SEQ;
    H.loadingMore = true; MO_MORE_SEQ = requestSeq; H.loadMoreError = '';
    updateHeaderLoadControl('جاري تحميل المزيد...');
    return companyCall('get_manufacture_headers', { limit: MO_MORE_LIMIT, offset: offset })
      .then(function (res) {
        if (requestSeq !== MO_REQUEST_SEQ) return;
        res = res || {};
        if (res.columns && res.columns.length) H.columns = res.columns;
        var incoming = res.rows || [], seen = {}, added = [];
        H.rows.forEach(function (r) { seen[String(r[H_PK])] = true; });
        incoming.forEach(function (r) {
          if (!seen[String(r[H_PK])]) { H.rows.push(r); added.push(r); seen[String(r[H_PK])] = true; }
        });
        H.total = Number(res.total) || H.total;
        H.loadedAll = H.rows.length >= H.total || added.length === 0;
        appendHeadersToTable(added);
        updateHeaderLoadControl();
      })
      .catch(function () {
        if (requestSeq === MO_REQUEST_SEQ) H.loadMoreError = 'تعذر تحميل المزيد. أعد المحاولة.';
      })
      .finally(function () {
        if (requestSeq === MO_REQUEST_SEQ && MO_MORE_SEQ === requestSeq) {
          H.loadingMore = false;
          updateHeaderLoadControl();
        }
      });
  }

  /* ══════════════════ DATA — dropdown refs ══════════════════
     Empty lists are NOT an error: selects degrade to free-text inputs. */
  function applyRefs(res) {
    res = res || {};
    REFS.products   = res.products   || [];
    REFS.products_full = res.products_full || [];
    REFS.warehouses = res.warehouses || [];
    REFS.statuses   = res.statuses   || [];
  }
  /* The product list is JSON kept on this device (UIC.Cache, scoped to this
     company + user, cleared on logout): the next visit has every product in
     the pickers at once, and a fresh copy replaces it as soon as it arrives. */
  function fetchRefs() {
    var read = (UIC.Cache && UIC.Cache.swr)
      ? UIC.Cache.swr({ company: MO_COMPANY, action: 'get_manufacture_refs', payload: {},
          version: MO_REFS_VERSION, maxAge: 30 * 60 * 1000, call: companyCall, onFresh: applyRefs })
      : companyCall('get_manufacture_refs', {});
    REFS_READY = Promise.resolve(read)
      .then(applyRefs)
      .catch(function () { REFS = { products: [], products_full: [], warehouses: [], statuses: [] }; });
    return REFS_READY;
  }

  /* ══════════════════ FOOTERS modal (view for all, edit for CAN_WRITE) ══════════════════
     The modal opens instantly with a loading note so the user understands the
     lines are being withdrawn, then fills in when the server replies. The
     server returns the complete footer set as one validated JSON aggregate. */
  var FOOTMOD = { hid: null, columns: [], rows: [], draft: null };
  var MO_EDITING = null;

  function openFootersModal(hid) {
    hid = String(hid);
    var cached = FOOT_CACHE[hid];
    FOOTMOD = { hid: hid, columns: cached ? cached.columns : [], rows: cached ? cached.rows : [], draft: null };
    UIC.openModal('mo-foot-modal', {
      title: '📦 بنود الأمر #' + FMT.escape(hid),
      body: '<div class="mo-empty">⏳ جاري سحب البنود من قاعدة البيانات…</div>',
      footer: false,
      size: 'xl'
    });
    /* The product pickers need the product list, so the grid is drawn once
       refs are in (instant from the device cache after the first visit). */
    var refs = REFS_READY || fetchRefs();
    if (cached) refs.then(function () { if (FOOTMOD.hid === hid) paintFootModal(); });
    Promise.all([refs, companyCall('get_manufacture_footers', { manufacture_header_id: hid })])
      .then(function (both) {
        var res = both[1] || {};
        var fresh = { columns: res.columns || [], rows: res.rows || [] };
        var prev = FOOT_CACHE[hid];
        /* Lines this page is still saving stay on screen until they settle. */
        var pending = prev ? prev.rows.filter(function (r) { return r.__pending; }) : [];
        var same = prev && !pending.length && JSON.stringify(prev.rows) === JSON.stringify(fresh.rows);
        if (!same) {
          var byId = {};
          pending.forEach(function (r) { byId[String(r.id)] = r; });
          fresh.rows = fresh.rows.map(function (r) { return byId[String(r.id)] || r; })
            .concat(pending.filter(function (r) { return String(r.id).indexOf('__tmp_') === 0; }));
          FOOT_CACHE[hid] = fresh;
        }
        if (FOOTMOD.hid !== hid) return;
        var draft = FOOTMOD.draft;
        FOOTMOD.columns = FOOT_CACHE[hid].columns;
        FOOTMOD.rows = FOOT_CACHE[hid].rows;
        FOOTMOD.draft = draft;
        if (!same || !cached) paintFootModal();
      })
      .catch(function (err) {
        if (FOOTMOD.hid !== hid) return;
        if (!cached) {
          var host = document.querySelector('#mo-foot-modal .modal-body');
          if (host) host.innerHTML = '<div class="mo-empty">تعذر تحميل البنود</div>';
        }
        showError(err);
      });
  }

  function footModCols() {
    return FOOTMOD.columns.length ? FOOTMOD.columns
      : ['product_id', 'product_name_ar', 'product_code', 'productUnit', 'productQuantity', 'warehouse_id'];
  }

  function paintFootModal() {
    var host = document.querySelector('#mo-foot-modal .modal-body');
    if (!host) return;
    host.innerHTML = buildFootersView(FOOTMOD.columns, FOOTMOD.rows);
  }

  function buildFootersView(cols, rows) {
    if (!rows.length && !FOOTMOD.draft) return '<div class="mo-empty">لا توجد بنود لهذا الأمر</div>';
    if (!cols.length && rows[0]) cols = Object.keys(rows[0]);
    /* manufacture_header_id is implied by the modal title; single editable
       product column (product_id select bound to products.id, label name_ar).
       Display-only product_name_ar is hidden from the grid to avoid duplication.
       Read-only renders product_id via productNameFor(). Audit/warehouse hidden. */
    var skip = { 'manufacture_header_id': true, 'product_name_ar': true };
    for (var hk in F_HIDE_VIEW) { if (Object.prototype.hasOwnProperty.call(F_HIDE_VIEW, hk)) skip[hk] = true; }
    var html = '<table class="mo-foot-tbl"><thead><tr>';
    if (CAN_WRITE) html += '<th style="width:150px;">إجراءات</th>';
    cols.forEach(function (c) {
      if (skip[c]) return;
      html += '<th>' + FMT.escape(fLabel(c)) + '</th>';
    });
    html += '</tr></thead><tbody>';
    rows.forEach(function (row) {
      var fid = row.id !== undefined && row.id !== null ? String(row.id) : '';
      var pending = !!row.__pending;
      html += '<tr' + (pending ? ' class="mo-pending-row" aria-busy="true"' : '') + '>';
      if (CAN_WRITE && pending) {
        html += '<td style="white-space:nowrap;color:var(--text-muted);font-size:12px;">⏳ جاري الحفظ…</td>';
      } else if (CAN_WRITE) {
        html += '<td style="white-space:nowrap;">' +
          '<button class="btn btn-sm btn-outline" onclick="saveFooterInline(\'' + FMT.escape(fid) + '\')">💾 حفظ</button> ' +
          '<button class="btn btn-sm" style="background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;" onclick="askDeleteFooter(\'' + FMT.escape(fid) + '\')">🗑️</button></td>';
      }
      cols.forEach(function (c) {
        if (skip[c]) return;
        if (CAN_WRITE && !pending && !F_READ_ONLY[c] && !F_DISPLAY_ONLY[c]) {
          html += '<td>' + footerInput(fid, c, row[c], row) + '</td>';
          return;
        }
        var v = row[c];
        var cell;
        if (v === null || v === undefined || String(v) === '') {
          cell = '<span style="color:var(--text-muted);font-size:11px">—</span>';
        } else if (c === 'product_name_ar') {
          cell = '<b>' + FMT.escape(String(v)) + '</b>';
        } else if (c === 'product_id') {
          var nm = productNameFor(row);
          cell = '<b>' + FMT.escape(nm || String(v)) + '</b>';
        } else if (c === 'id' && String(v).indexOf('__tmp_') === 0) {
          cell = '<span style="color:var(--text-muted);font-size:11px">—</span>';
        } else if (c === 'productQuantity' || c === 'id' || c === 'warehouse_id') {
          cell = '<span class="cell-num">' + FMT.escape(String(v)) + '</span>';
        } else {
          cell = FMT.escape(String(v));
        }
        html += '<td>' + cell + '</td>';
      });
      html += '</tr>';
    });
    /* blank new inline (writers only): warehouse defaults to 1 */
    if (CAN_WRITE) {
      if (FOOTMOD.draft) {
        html += '<tr class="mo-draft-row"><td style="white-space:nowrap;">' +
          '<button class="btn btn-sm btn-primary" onclick="saveFooterDraft()">💾 حفظ البند</button> ' +
          '<button class="btn btn-sm btn-outline" onclick="cancelFooterDraft()">إلغاء</button></td>';
        footModCols().forEach(function (c) {
          if (skip[c] || F_READ_ONLY[c]) return;
          if (F_DISPLAY_ONLY[c]) { html += '<td><span style="color:var(--text-muted);font-size:11px">—</span></td>'; return; }
          html += '<td>' + footerInput('new', c, FOOTMOD.draft[c]) + '</td>';
        });
        html += '</tr>';
      } else {
        html += '<tr><td colspan="' + (cols.length + 1) + '" style="text-align:center;">' +
          '<button class="btn btn-sm btn-outline" onclick="newFooterRow()">➕ بند جديد</button></td></tr>';
      }
    }
    html += '</tbody></table>';
    return html;
  }

  /* editable control per footer column; selects fall back to REFS labels */
  function footerInput(fid, col, val, row) {
    var hid = FOOTMOD.hid;
    var v = (val !== null && val !== undefined) ? String(val) : '';
    var id = 'mof_' + hid + '_' + fid + '_' + col;
    if (col === 'product_id') {
      /* manufacture_footers.product_id -> products.id. The picker SHOWS
         products.name_ar and STORES products.id (the combo's hidden input,
         id = this cell's id, is what footVal reads). */
      return '<div class="mo-product-pick">' + UIC.combo({
        key: id, inline: true,
        options: productOptions(v, row && row.product_name_ar),
        value: v,
        placeholder: 'ابحث باسم الصنف أو رقمه…',
        onChange: function () { onFooterProductChange(fid); }
      }) + '</div>';
    }
    if (col === 'warehouse_id' && REFS.warehouses.length) {
      return '<select class="input mo-inline-input" id="' + id + '">' +
        '<option value="">— اختر المخزن —</option>' +
        REFS.warehouses.map(function (o) {
          return '<option value="' + FMT.escape(o.value) + '"' + (String(o.value) === v ? ' selected' : '') + '>' + FMT.escape(o.label) + '</option>';
        }).join('') +
      '</select>';
    }
    if (F_NUMERIC[col]) {
      return '<input type="number" step="any" class="input mo-inline-input cell-num" id="' + id + '" value="' + FMT.escape(v) + '">';
    }
    return '<input type="text" class="input mo-inline-input" id="' + id + '" value="' + FMT.escape(v) + '">';
  }

  function footVal(fid, col) {
    var el = document.getElementById('mof_' + FOOTMOD.hid + '_' + fid + '_' + col);
    return el ? el.value : '';
  }

  /* Picker options: every product as {value: products.id, label: name_ar}.
     A saved id the list does not contain (e.g. refs not loaded yet) is still
     offered, under the name the server joined onto the row, so an existing
     line always shows its product and never silently loses it on save. */
  function productOptions(currentId, currentName) {
    var list = REFS.products_full.length ? REFS.products_full : REFS.products;
    var opts = list.map(function (o) { return { value: String(o.value), label: String(o.label || o.value) }; });
    var cur = currentId === null || currentId === undefined ? '' : String(currentId);
    if (cur && !opts.some(function (o) { return o.value === cur; })) {
      opts.unshift({ value: cur, label: currentName ? String(currentName) : ('#' + cur) });
    }
    return opts;
  }

  function productRef(pid) {
    for (var i = 0; i < REFS.products_full.length; i++) {
      if (String(REFS.products_full[i].value) === String(pid)) return REFS.products_full[i];
    }
    for (var j = 0; j < REFS.products.length; j++) {
      if (String(REFS.products[j].value) === String(pid)) {
        return { value: REFS.products[j].value, label: REFS.products[j].label, code: '', unit: '' };
      }
    }
    return null;
  }

  function refreshJoinedProductFields(row, pid) {
    var ref = productRef(pid);
    row.product_name_ar = ref ? ref.label : '';
    row.product_code_ref = ref ? (ref.code || '') : '';
    row.product_unit_ref = ref ? (ref.unit || '') : '';
  }

  /* changing the inline product auto-withdraws code/unit from products */
  function onFooterProductChange(fid) {
    var pid = footVal(fid, 'product_id');
    var ref = pid ? productRef(pid) : null;
    var codeEl = document.getElementById('mof_' + FOOTMOD.hid + '_' + fid + '_product_code');
    var unitEl = document.getElementById('mof_' + FOOTMOD.hid + '_' + fid + '_productUnit');
    if (codeEl) codeEl.value = ref ? ref.code : '';
    if (unitEl) unitEl.value = ref ? ref.unit : '';
  }

  /* ── footer writes: JSON first, server behind ──────────────────────────
     Every write changes this order's line list (FOOT_CACHE[hid].rows) and
     repaints at once; the request runs behind it. A line waiting on the
     server shows «جاري الحفظ…» and offers no buttons. On failure the list is
     put back exactly as it was and the error is shown. Rows are looked up by
     id when the reply lands, because a background refresh may have swapped
     the array in the meantime. */
  function footRows(hid) {
    if (!FOOT_CACHE[hid]) FOOT_CACHE[hid] = { columns: FOOTMOD.columns || [], rows: FOOTMOD.rows || [] };
    return FOOT_CACHE[hid].rows;
  }
  function footIndex(hid, fid) {
    var rows = footRows(hid);
    for (var i = 0; i < rows.length; i++) if (String(rows[i].id) === String(fid)) return i;
    return -1;
  }
  function repaintFoot(hid) {
    if (FOOTMOD.hid !== hid) return;
    FOOTMOD.rows = footRows(hid);
    if (document.getElementById('mo-foot-modal')) paintFootModal();
  }

  function saveFooterInline(fid) {
    var hid = FOOTMOD.hid;
    var at = footIndex(hid, fid);
    if (at === -1) { UIC.toast('البند غير موجود', 'error'); return; }
    var was = footRows(hid)[at];
    var payload = { id: fid };
    footModCols().forEach(function (col) {
      if (F_READ_ONLY[col] || F_DISPLAY_ONLY[col] || F_HIDE_VIEW[col]) return;
      payload[col] = footVal(fid, col);
    });
    if (Object.prototype.hasOwnProperty.call(payload, 'productQuantity')) {
      var qtyRaw = String(payload.productQuantity || '').trim();
      var qtyNum = Number(qtyRaw);
      if (!qtyRaw || !isFinite(qtyNum) || qtyNum <= 0) { UIC.toast('أدخل الكمية (رقم أكبر من صفر)', 'error'); return; }
    }
    var draft = Object.assign({}, was);
    Object.keys(payload).forEach(function (k) { draft[k] = payload[k]; });
    if (Object.prototype.hasOwnProperty.call(payload, 'product_id')) {
      refreshJoinedProductFields(draft, payload.product_id);
      /* The server re-withdraws code/unit from products on a product change. */
      if (draft.product_code_ref) draft.product_code = draft.product_code_ref;
      if (draft.product_unit_ref) draft.productUnit = draft.product_unit_ref;
    }
    draft.__pending = true;
    footRows(hid)[at] = draft;
    repaintFoot(hid);
    companyCall('save_manufacture_footer', payload)
      .then(function () {
        var i = footIndex(hid, fid);
        if (i !== -1) delete footRows(hid)[i].__pending;
        repaintFoot(hid);
        UIC.toast('تم حفظ البند ✓', 'success');
      })
      .catch(function (err) {
        var i = footIndex(hid, fid);
        if (i !== -1) footRows(hid)[i] = was;
        repaintFoot(hid);
        showError(err);
      });
  }

  function newFooterRow() {
    FOOTMOD.draft = { product_id: '', product_code: '', productUnit: '', productQuantity: '', warehouse_id: '1' };
    paintFootModal();
  }

  function cancelFooterDraft() {
    FOOTMOD.draft = null;
    paintFootModal();
  }

  function saveFooterDraft() {
    if (!FOOTMOD.draft) return;
    var hid = FOOTMOD.hid;
    var payload = { manufacture_header_id: String(hid) };
    footModCols().forEach(function (col) {
      if (F_READ_ONLY[col] || F_DISPLAY_ONLY[col] || F_HIDE_VIEW[col]) return;
      payload[col] = footVal('new', col);
    });
    if (!String(payload.product_id || '').trim()) { UIC.toast('اختر الصنف أولاً', 'error'); return; }
    var qtyRaw = String(payload.productQuantity || '').trim();
    var qtyNum = Number(qtyRaw);
    if (!qtyRaw || !isFinite(qtyNum) || qtyNum <= 0) { UIC.toast('أدخل الكمية (رقم أكبر من صفر)', 'error'); return; }
    /* warehouse stays at its default 1 — hidden from view, server fills it. */
    var tmpId = '__tmp_' + Math.random().toString(36).slice(2, 10);
    var newRow = { id: tmpId, manufacture_header_id: String(hid), __pending: true };
    Object.keys(payload).forEach(function (k) { if (k !== 'manufacture_header_id') newRow[k] = payload[k]; });
    refreshJoinedProductFields(newRow, newRow.product_id);
    if (!newRow.product_code && newRow.product_code_ref) newRow.product_code = newRow.product_code_ref;
    if (!newRow.productUnit && newRow.product_unit_ref) newRow.productUnit = newRow.product_unit_ref;
    footRows(hid).push(newRow);
    FOOTMOD.draft = null;
    repaintFoot(hid);
    companyCall('add_manufacture_footer', payload)
      .then(function (res) {
        var i = footIndex(hid, tmpId);
        if (i !== -1) {
          var row = footRows(hid)[i];
          row.id = (res && res.id) || row.id;
          delete row.__pending;
        }
        repaintFoot(hid);
        UIC.toast('تمت إضافة البند ✓', 'success');
      })
      .catch(function (err) {
        var i = footIndex(hid, tmpId);
        if (i !== -1) footRows(hid).splice(i, 1);
        /* Give the typed line back so the user can correct and resend it. */
        if (FOOTMOD.hid === hid && !FOOTMOD.draft) {
          FOOTMOD.draft = {};
          Object.keys(payload).forEach(function (k) { if (k !== 'manufacture_header_id') FOOTMOD.draft[k] = payload[k]; });
        }
        repaintFoot(hid);
        showError(err);
      });
  }

  function askDeleteFooter(fid) {
    UIC.openModal('mo-delete-modal', {
      title: 'تأكيد حذف البند',
      body: '<p style="font-size:14px;line-height:1.9;">سيتم حذف البند <b>#' + FMT.escape(String(fid)) + '</b> من الأمر <b>#' + FMT.escape(String(FOOTMOD.hid)) + '</b> ' +
            '<b>نهائياً</b> (جدول البنود لا يحتوي على عمود حذف ناعم).</p>',
      saveLabel: '🗑️ حذف نهائي',
      onSave: 'doDeleteFooter(\'' + FMT.escape(String(fid)) + '\')'
    });
  }

  function doDeleteFooter(fid) {
    var hid = FOOTMOD.hid;
    var at = footIndex(hid, fid);
    try { UIC.closeModal('mo-delete-modal'); } catch (e) {}
    if (at === -1) return;
    var removed = footRows(hid).splice(at, 1)[0];
    repaintFoot(hid);
    companyCall('delete_manufacture_footer', { id: fid })
      .then(function () { UIC.toast('تم حذف البند ✓', 'success'); })
      .catch(function (err) {
        var rows = footRows(hid);
        rows.splice(Math.min(at, rows.length), 0, removed);
        repaintFoot(hid);
        showError(err);
      });
  }

  /* ══════════════════ HEADER EDIT + SOFT DELETE (CAN_WRITE) ══════════════════ */
  function openHeaderEdit(pkVal) {
    var row = (H.rows).find(function (r) { return String(r[H_PK]) === String(pkVal); });
    if (!row) { UIC.toast('السجل غير موجود في الذاكرة', 'error'); return; }
    if (!REFS.products.length && !openHeaderEdit.__waited) {
      /* First open before the product list has arrived: wait for it once so
         the picker is complete, then open. */
      openHeaderEdit.__waited = true;
      (REFS_READY || fetchRefs()).then(function () { openHeaderEdit(pkVal); });
      return;
    }
    openHeaderEdit.__waited = false;
    MO_EDITING = pkVal;
    /* full server column set — hidden-from-view columns stay editable here */
    var cols = H.columns.length ? H.columns : Object.keys(row);
    var formHtml = '<form id="mo-edit-form"><div class="mo-form-grid">';
    cols.forEach(function (col) {
      if (col === 'product_label') return;   /* joined display-only, not a real column */
      var val = row[col];
      var label = hLabel(col);
      if (H_READ_ONLY[col]) {
        formHtml += '<div class="form-field"><label class="form-label">' +
          '<span class="lbl-ro">' + (col === H_PK ? 'PK' : 'للقراءة فقط') + '</span> ' + FMT.escape(label) + '</label>' +
          '<input type="text" class="input" value="' + FMT.escape(val !== null && val !== undefined ? String(val) : '') + '" disabled></div>';
        return;
      }
      if (col === 'status' && REFS.statuses.length) {
        formHtml += '<div class="form-field"><label class="form-label">' + FMT.escape(label) + '</label>' +
          '<select class="input" id="mof_' + col + '"><option value="">— لم يحدد —</option>' +
          REFS.statuses.map(function (o) {
            return '<option value="' + FMT.escape(o.value) + '"' + (String(val) === String(o.value) ? ' selected' : '') + '>' + FMT.escape(o.label) + '</option>';
          }).join('') + '</select></div>';
      } else if (H_FLAGS[col]) {
        var on = String(val) === '1';
        formHtml += '<div class="form-field"><label class="form-label">' + FMT.escape(label) + '</label>' +
          '<select class="input" id="mof_' + col + '">' +
          '<option value="0"' + (!on ? ' selected' : '') + '>0 — لا</option>' +
          '<option value="1"' + (on ? ' selected' : '') + '>1 — نعم</option></select></div>';
      } else if (col === 'product_id') {
        /* Searchable: shows products.name_ar, stores products.id. */
        formHtml += UIC.combo({
          key: 'mof_' + col, label: FMT.escape(label),
          options: productOptions(val, row.product_label),
          value: val !== null && val !== undefined ? String(val) : '',
          placeholder: 'ابحث باسم الصنف أو رقمه…'
        });
      } else if (H_DATES[col]) {
        var dtv = val ? String(val).slice(0, 16).replace(' ', 'T') : '';
        formHtml += '<div class="form-field"><label class="form-label">' + FMT.escape(label) + '</label>' +
          '<input type="datetime-local" class="input" id="mof_' + col + '" value="' + FMT.escape(dtv) + '"></div>';
      } else if (H_NUMERIC[col]) {
        formHtml += '<div class="form-field"><label class="form-label">' + FMT.escape(label) + '</label>' +
          '<input type="number" step="any" class="input cell-num" id="mof_' + col + '" value="' + FMT.escape(val !== null && val !== undefined ? String(val) : '') + '"></div>';
      } else {
        formHtml += '<div class="form-field"><label class="form-label">' + FMT.escape(label) + '</label>' +
          '<input type="text" class="input" id="mof_' + col + '" value="' + FMT.escape(val !== null && val !== undefined ? String(val) : '') + '"></div>';
      }
    });
    formHtml += '</div></form>';
    UIC.openModal('mo-edit-modal', {
      title: 'تعديل أمر تصنيع — #' + pkVal,
      body: formHtml,
      saveLabel: 'حفظ التعديلات',
      onSave: 'saveHeaderEdit()'
    });
  }

  /* Re-derive the shared table from H.rows without a rebuild, so the
     user's search, sort and page survive the change. */
  function refreshHeaderTable() {
    var st = window.__dtStore && window.__dtStore['mo-table'];
    if (!st) { renderMoTable(); updateHeaderLoadControl(); return; }
    var page = st.page || 1;
    st.originalRows = H.rows.map(mapHeaderRow);
    st.rows = st.originalRows;
    UIC.filterPaged('mo-table', st.searchTerm || '');
    st = window.__dtStore && window.__dtStore['mo-table'];
    if (st && page > 1) {
      st.page = Math.min(page, Math.max(1, Math.ceil(st.filtered.length / (st.pageSize || 50))));
      UIC._dtRenderBody('mo-table');
      UIC._dtRefreshPager('mo-table');
    }
    updateHeaderLoadControl();
  }

  /* JSON first: the edited order replaces its row in H.rows and the table
     at once, the dialog closes, and the request runs behind. A failure puts
     the old row back and says why. */
  function saveHeaderEdit() {
    var pkVal = MO_EDITING;
    if (!pkVal) { UIC.toast('لا يوجد سجل محدد', 'error'); return; }
    var at = H.rows.findIndex(function (r) { return String(r[H_PK]) === String(pkVal); });
    if (at === -1) { UIC.toast('السجل غير موجود', 'error'); return; }
    var was = H.rows[at];
    var cols = H.columns.length ? H.columns : Object.keys(was);
    var payload = {};
    payload[H_PK] = pkVal;
    cols.forEach(function (col) {
      if (H_READ_ONLY[col] || col === 'product_label') return;
      var el = document.getElementById('mof_' + col);
      if (el) payload[col] = el.value;
    });
    var draft = Object.assign({}, was, payload);
    if (Object.prototype.hasOwnProperty.call(payload, 'product_id')) {
      var headerProduct = productRef(payload.product_id);
      draft.product_label = headerProduct ? headerProduct.label : '';
    }
    H.rows[at] = draft;
    try { UIC.closeModal('mo-edit-modal'); } catch (e) {}
    refreshHeaderTable();
    companyCall('save_manufacture_header', payload)
      .then(function () { UIC.toast('تم الحفظ بنجاح ✓', 'success'); })
      .catch(function (err) {
        var i = H.rows.findIndex(function (r) { return String(r[H_PK]) === String(pkVal); });
        if (i !== -1) H.rows[i] = was;
        refreshHeaderTable();
        showError(err);
      });
  }

  function askDeleteHeader(pkVal) {
    UIC.openModal('mo-delete-modal', {
      title: 'تأكيد الحذف الناعم',
      body: '<p style="font-size:14px;line-height:1.9;">سيتم حذف أمر التصنيع <b>#' + FMT.escape(String(pkVal)) + '</b> حذفاً ناعماً ' +
            '(تخزين الطابع الزمني الحالي في <code dir="ltr">deleted_at</code>) وسيختفي من القائمة.</p>',
      saveLabel: '🗑️ تأكيد الحذف',
      onSave: 'doDeleteHeader(\'' + FMT.escape(String(pkVal)) + '\')'
    });
  }

  function doDeleteHeader(pkVal) {
    var at = H.rows.findIndex(function (r) { return String(r[H_PK]) === String(pkVal); });
    try { UIC.closeModal('mo-delete-modal'); } catch (e) {}
    if (at === -1) return;
    var removed = H.rows.splice(at, 1)[0];
    H.total = Math.max(0, H.total - 1);
    refreshHeaderTable();
    companyCall('delete_manufacture_header', { id: pkVal })
      .then(function () { UIC.toast('تم الحذف الناعم ✓', 'success'); })
      .catch(function (err) {
        H.rows.splice(Math.min(at, H.rows.length), 0, removed);
        H.total += 1;
        refreshHeaderTable();
        showError(err);
      });
  }

  /* ══════════════════ RENDER — unified table ══════════════════ */
  function renderPage() {
    var content = document.getElementById('mo-content');
    if (!content) return;

    /* header card (badges + refresh; search/pager/export live inside the table) */
    content.innerHTML =
      '<div class="mo-wrapper">' +
      '<div class="mo-header-card">' +
        '<div class="mo-header-top">' +
          '<div>' +
            '<h2 class="mo-heading">🏭 أوامر التصنيع <span style="font-size:13px;font-weight:400;color:var(--text-muted)">(manufacture_headers)</span></h2>' +
            '<p class="mo-subheading">جدول قاعدة البيانات المباشر — ' + H.total + ' سجل إجمالاً (الحذف الناعم مُطبَّق)</p>' +
          '</div>' +
          '<div class="mo-badges">' +
            '<div class="mo-badge">الإجمالي: <b>' + FMT.number(H.total) + '</b></div>' +
            '<div class="mo-badge">المُحمَّل: <b id="mo-loaded-count">' + FMT.number(H.rows.length) + '</b></div>' +
            '<div class="mo-badge">الوضع: <b id="mo-load-mode">' + (H.loadedAll ? 'كل السجلات محمّلة' : 'تحميل تدريجي') + '</b></div>' +
          '</div>' +
        '</div>' +
        '<div class="mo-toolbar">' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
            '<button class="btn btn-outline" onclick="fetchHeaders()">🔄 تحديث</button>' +
            '<div id="mo-load-more-control" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;"></div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div id="mo-table-host"></div>' +
      '</div>';

    updateHeaderLoadControl();
    renderMoTable();
  }

  function updateHeaderLoadControl(message) {
    var host = document.getElementById('mo-load-more-control');
    var count = document.getElementById('mo-loaded-count');
    var mode = document.getElementById('mo-load-mode');
    if (count) count.textContent = FMT.number(H.rows.length);
    if (mode) mode.textContent = H.loadedAll ? 'كل السجلات محمّلة' : 'تحميل تدريجي';
    if (!host) return;
    var status = message || H.loadMoreError ||
      (H.loadedAll ? ('تم تحميل كل السجلات (' + H.rows.length + ')')
                   : ('جاري تحميل باقي السجلات… تم تحميل ' + H.rows.length + ' من ' + H.total + ' سجل'));
    host.innerHTML = '<span style="font-size:12px;color:var(--text-muted);">' + FMT.escape(status) +
      (H.loadedAll ? '' : ' — البحث يشمل السجلات المحملة حتى الآن') + '</span>' +
      (H.loadMoreError ? '<button type="button" class="btn btn-outline" onclick="retryLoadingHeaders()">إعادة المحاولة</button>' : '') +
      (H.loadedAll ? '<span class="mo-badge">تم تحميل كل السجلات</span>' : '');
  }

  function showHeaderLoadError(err) {
    var content = document.getElementById('mo-content');
    var msg = (err && (err.message || err.error)) || 'تعذر تحميل أوامر التصنيع';
    if (content) content.innerHTML = '<div class="empty-state"><span>' + FMT.escape(msg) +
      '</span><button type="button" class="btn btn-outline" onclick="fetchHeaders(false)">إعادة المحاولة</button></div>';
    UIC.toast(msg, 'error');
  }

  function mapHeaderRow(r) {
    var pkVal = r[H_PK] !== undefined && r[H_PK] !== null ? String(r[H_PK]) : '';
    var pname = productNameFor(r);
    var rev = String(r.is_revised) === '1';
    return {
      id: (r.id !== null && r.id !== undefined) ? r.id : '',
      name_ar: r.name_ar || '',
      expected_quantity: (r.expected_quantity !== null && r.expected_quantity !== undefined) ? r.expected_quantity : '',
      deliver_quantity: (r.deliver_quantity !== null && r.deliver_quantity !== undefined) ? r.deliver_quantity : '',
      product: pname ? '<b>' + FMT.escape(pname) + '</b>' : '<span style="color:var(--text-muted);font-size:11px">—</span>',
      status: (r.status !== null && r.status !== undefined && String(r.status) !== '') ? FMT.escape(String(r.status)) : '—',
      manufacture_number: r.manufacture_number || '',
      manufacture_delivery_number: r.manufacture_delivery_number || '',
      is_revised: rev ? '✓ مراجع' : '⏳ غير مراجع',
      actions: UIC.actionBtns(
        [{ label: 'عرض البنود', onclick: "openFootersModal('" + FMT.escape(pkVal) + "')" }]
        .concat(CAN_WRITE ? [
          { label: 'تعديل', onclick: "openHeaderEdit('" + FMT.escape(pkVal) + "')" },
          { label: 'حذف', color: '#d32f2f', onclick: "askDeleteHeader('" + FMT.escape(pkVal) + "')" }
        ] : [])
      )
    };
  }

  function appendHeadersToTable(rows) {
    if (!rows || !rows.length) return;
    var st = window.__dtStore && window.__dtStore['mo-table'];
    if (!st) { renderMoTable(); return; }
    rows.forEach(function (r) { st.originalRows.push(mapHeaderRow(r)); });
    st.rows = st.originalRows;
    var page = st.page || 1;
    UIC.filterPaged('mo-table', st.searchTerm || '');
    st = window.__dtStore && window.__dtStore['mo-table'];
    if (st && page > 1) {
      st.page = Math.min(page, Math.max(1, Math.ceil(st.filtered.length / (st.pageSize || 50))));
      UIC._dtRenderBody('mo-table');
      UIC._dtRefreshPager('mo-table');
    }
  }

  function renderMoTable() {
    var host = document.getElementById('mo-table-host');
    if (!host) return;
    var rows = H.rows.map(mapHeaderRow);

    host.innerHTML = UIC.dataTable('mo-table', {
      /* Later server windows append in place; each window is returned by the
         server as one JSON aggregate and the table searches/pages locally. */
      truncated: false,
      title: 'أوامر التصنيع',
      headers: MO_HEADERS,
      rows: rows,
      emptyText: 'لا توجد أوامر تصنيع'
    });
    UIC.initTableSort('mo-table');
  }

  /* ══════════════════ (view-only: no inline editing, search lives in the table) ══════════════════ */

  /* ══════════════════ (view-only: header edit modal removed) ══════════════════ */

  /* ══════════════════ (view-only: footer writes removed) ══════════════════ */

  /* ══════════════════ (view-only: deletes removed) ══════════════════ */

  /* ── error helper ── */
  function showError(err) {
    var msg = (err && (err.message || err.error)) || String(err || 'حدث خطأ غير متوقع');
    UIC.toast(msg, 'error');
  }

  document.addEventListener('DOMContentLoaded', load);
</script>
</body>
</html>
