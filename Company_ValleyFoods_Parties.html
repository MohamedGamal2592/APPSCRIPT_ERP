<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Valley Foods — العملاء والموردون</title>
  <?!= include('CSS_Tokens'); ?>
  <?!= include('UI_Components'); ?>
  <?!= include('Client_Helpers'); ?>
  <?!= include('Company_ValleyFoods_Nav'); ?>
  <?!= getCompanyThemeCSS_('9940659bd83035d7') ?>
  <style>
    @media (max-width: 599px) {
      #party-statement-modal .st-product-row > td { display: block; width: 100%; box-sizing: border-box; }
    }
  </style>
</head>
<body>
  <div id="vf-root"></div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var SESSION_TOKEN = params.get('sessionToken') || (API.getSession() || {}).token || '';
    var scriptUrl = window.scriptUrl || '/';
    var IS_SUPER_ADMIN = <?!= user && user.isSuperAdmin ? 'true' : 'false' ?>;
    var COMPANY_LOGO_URL = '<?!= getCompanyLogoUrl_('9940659bd83035d7') ?>';
    var COMPANY_PAGES = <?!= companyPages ?>;
    var CURRENT_ACTION = '<?!= currentAction ?>';
    var USER_PAGES = <?!= user && user.isSuperAdmin ? 'null' : JSON.stringify((user && user.authorizedPages) || {}) ?>;
    var CAN_WRITE = UIC.canAdd_(); var CAN_FULL = UIC.canFull_();

    function companyCall(moduleAction, data) {
      return API.call('company_action', {
        target_system: '9940659bd83035d7',
        module_action: moduleAction,
        data: data || {}
      }, SESSION_TOKEN);
    }
    function esc(v) {
      /* [UI-2.8 / U-36] Delegates to the shared formatter. This body used to
         carry its own replace-chain behind a `typeof FMT !== 'undefined'`
         guard, but Client_Helpers.html defines FMT in <head> before any page
         script runs, so that fallback was unreachable and the duplicate was
         pure drift risk. Output is identical for every input — proved in
         tools/verify/ui2_formatters.js. */
      return FMT.escape(v);
    }
  </script>

  <script>
  (function () {
    var ROWS = [], ENUMS = {}, NEXT_ID = 1;
    var DIR_FILTER = '', TYPE_FILTER = '';

    function renderApp() {
      UIC.appShell('vf-root', {
        companyLogoUrl: COMPANY_LOGO_URL,
        companyLogoHref: scriptUrl + '?action=vf_dashboard&sessionToken=' + SESSION_TOKEN,
        companyLogoTitle: 'Valley Foods',
        breadcrumb: 'Valley Foods / الادارة المالية / العملاء والموردون',
        contentId: 'vf-parties-content',
        menuGroups: (window.VALLEYFOODS_MENU || [])
      });
      document.getElementById('vf-parties-content').innerHTML =
        '<div class="vf-card"><div class="vf-card-header"><h3>العملاء والموردون</h3>' +
          (CAN_WRITE ? '<button class="btn btn-primary" onclick="PARTIES_PAGE.openAdd()">+ إضافة سجل</button>' : '') +
        '</div><div class="vf-card-body">' +
          '<div id="pt-filter" style="margin-bottom:4px;"></div>' +
          '<div id="pt-table"><p class="vf-text-muted">جاري التحميل...</p></div>' +
        '</div></div>';
      renderFilterBar();
      load();
    }

    /* quiet: refresh in the background with no blocking overlay, for a
       user who has already seen the change and must not be interrupted
       to confirm it. */
    function load(quiet) {
      if (!quiet) UIC.readSkeleton('pt-table');
      companyCall('get_valley_parties')
        .then(function (res) {
          ROWS = (res && res.rows) || [];
          ENUMS = (res && res.enums) || {};
          NEXT_ID = (res && res.next_id) || 1;
          renderFilterBar();
          renderTable(); try{schedulePrefetch();}catch(e){};
        })
        .catch(function (e) { UIC.toast((e && e.message) || 'خطأ في تحميل البيانات', 'error'); })
        .finally(function () { if (!quiet) UI.hideSpinner(); });
    }

    var BALANCES;

    /* List filters: الاتجاه + نوع التعامل, client-side over ROWS (the list
       endpoint already returns everything). Re-renders, never refetches. */
    function renderFilterBar() {
      var host = document.getElementById('pt-filter');
      if (!host) return;
      var dirs = (ENUMS.customer_direction || []).map(function (v) { return { value: v, label: v }; });
      var types = (ENUMS.type || []).map(function (v) { return { value: v, label: v }; });
      host.innerHTML = '<div style="display:flex;gap:0 12px;flex-wrap:wrap;align-items:flex-end;">' +
        '<div style="flex:1;min-width:220px;">' + UIC.combo({ key: 'pt-direction', label: 'الاتجاه', options: dirs, value: DIR_FILTER, placeholder: 'كل الاتجاهات' }) + '</div>' +
        '<div style="flex:1;min-width:220px;">' + UIC.combo({ key: 'pt-type', label: 'نوع التعامل', options: types, value: TYPE_FILTER, placeholder: 'كل الأنواع' }) + '</div>' +
        '<div style="flex:0 0 auto;padding-bottom:12px;"><button class="btn btn-outline" onclick="PARTIES_PAGE.clearFilters()">✕ مسح الفلاتر</button></div>' +
      '</div>';
      /* UIC.comboPick dispatches change on the hidden input when picked. */
      ['pt-direction', 'pt-type'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.addEventListener('change', onListFilterChange);
      });
    }

    function onListFilterChange() {
      var d = document.getElementById('pt-direction');
      var t = document.getElementById('pt-type');
      var nd = d ? String(d.value || '') : '';
      var nt = t ? String(t.value || '') : '';
      if (nd === DIR_FILTER && nt === TYPE_FILTER) return;
      DIR_FILTER = nd; TYPE_FILTER = nt;
      renderTable();
    }

    function clearFilters() {
      if (!DIR_FILTER && !TYPE_FILTER) return;
      DIR_FILTER = ''; TYPE_FILTER = '';
      renderFilterBar(); renderTable();
    }

    function renderTable() {
      var container = document.getElementById('pt-table');
      if (!container) return;
      var list = ROWS.filter(function (r) {
        /* Hidden records: codes 18 and 19 never appear in the list (nor search/export, which derive from this list). */
        if (String(r.id) === '18' || String(r.id) === '19' || Number(r.id) === 18 || Number(r.id) === 19) return false;
        if (DIR_FILTER && String(r.customer_direction || '') !== DIR_FILTER) return false;
        if (TYPE_FILTER && String(r.type || '') !== TYPE_FILTER) return false;
        return true;
      });
      var rows = list.map(function (r) {
        /* Tier A: a __pending row shows «—» where the server has not answered
           yet and offers no actions — its id names a record the server has
           never seen, so acting on it would act on nothing. */
        var pending = !!r.__pending;
        var level = r['المستوى الاساسي'] || ((r.name || '') + (r.name_en ? ' - ' + r.name_en : ''));
        var balCell = pending
          ? '<span class="num" data-num="0">—</span>'
          : '<span class="num" data-bal="' + esc(r.id) + '" data-num="0">…</span>';
        var actions = pending ? '…' : UIC.actionBtns([{ label: '📄 كشف حساب', onclick: 'PARTIES_PAGE.openStatement(\'' + esc(r.id) + '\')' }]);
        return [
          pending ? '—' : ('<b>' + esc(r.id) + '</b>'),
          esc(r.name),
          esc(r.customer_direction),
          esc(r.type || '-'),
          esc(r.telephone || '-'),
          esc(r.country || '-'),
          esc(level),
          /* [P2] Placeholder until get_valley_party_balances resolves. data-num
             starts at 0 so the existing numeric sort has something valid to work
             with even if the call never returns. */
          balCell,
          actions
        ];
      });
      container.innerHTML = UIC.dataTable('parties-table-id', {
        /* [UI-9.1] الاسم is the column a person actually reads this list by,
           and it is the only one here whose length varies enough to be
           classified differently from one load to the next. Declared text so
           it always keeps a name's worth of room. */
        headers: ['الكود', { label: 'الاسم', col: 'text' }, 'الاتجاه', 'نوع التعامل', 'التليفون', 'الدولة', 'المستوى الأساسي',
                  { label: 'الرصيد الحالي', numeric: true }, { key: 'actions', label: '' }],
        rows: rows, pageSize: 100,
        emptyText: (DIR_FILTER || TYPE_FILTER) ? 'لا توجد سجلات مطابقة' : 'لا توجد بيانات',
        /* [P2] UIC.dataTable rebuilds the tbody from the stored row HTML on every
           sort, search and page change, which would restore the … placeholder.
           onRendered is the component's existing post-render hook (:811), so the
           balances are repainted after each of those without touching UIC. */
        onRendered: function () { paintBalances(); }
      });
      /* Click a header to sort (asc -> desc -> load order); balances repaint
         through onRendered above. */
      UIC.initTableSort('parties-table-id');
      loadBalances();
    }

    /* [P2] Loaded lazily, AFTER the table paints, so first paint stays exactly
       as fast as it is today (decision D-H: getValleyParties_ reads one sheet;
       this reads four more and must not block it). The list stays fully usable
       if this call fails. */
    var BALANCES_TRIED = false;
    function loadBalances() {
      if (BALANCES_TRIED) { paintBalances(); return; }
      BALANCES_TRIED = true;
      companyCall('get_valley_party_balances')
        .then(function (res) {
          BALANCES = (res && res.balances) || {};
          paintBalances();
        })
        .catch(function (e) {
          BALANCES = null;
          paintBalances();
          UIC.toast((e && e.message) || 'تعذر تحميل الأرصدة', 'error');
        });
    }

    function paintBalances() {
      if (BALANCES === undefined) return;
      var cells = document.querySelectorAll('[data-bal]');
      for (var i = 0; i < cells.length; i++) {
        if (BALANCES === null) { cells[i].textContent = '—'; cells[i].setAttribute('data-num', '0'); continue; }
        var v = Number(BALANCES[cells[i].getAttribute('data-bal')] || 0);
        /* Reuses the page's own finFmt so the column formats identically to the
           statement, parenthesised negatives included. */
        cells[i].textContent = finFmt(v);
        cells[i].setAttribute('data-num', String(v));
      }
      /* The managed sort reads the table STORE, which still holds the …
         placeholders — push the real values in (idempotent), and if a sort is
         active, re-derive the view once so the order is decimal, not markup. */
      if (patchBalanceStore() && !BAL_RESORTING) {
        try {
          var st = (window.__dtStore || {})['parties-table-id'];
          if (st && st.sortKey) {
            BAL_RESORTING = true;
            UIC._applyFilters('parties-table-id');
            BAL_RESORTING = false;
          }
        } catch (e) { BAL_RESORTING = false; }
      }
    }

    var BAL_RESORTING = false;
    function patchBalanceStore() {
      try {
        if (!BALANCES) return false;
        var st = (window.__dtStore || {})['parties-table-id'];
        if (!st) return false;
        var bIdx = -1;
        for (var h = 0; h < (st.headers || []).length; h++) {
          var hh = st.headers[h];
          if ((hh.key || hh.label) === 'الرصيد الحالي') { bIdx = h; break; }
        }
        if (bIdx === -1) return false;
        var changed = false;
        ['originalRows', 'rows', 'filtered'].forEach(function (k) {
          var arr = st[k];
          if (!arr) return;
          for (var i = 0; i < arr.length; i++) {
            var row = arr[i];
            if (!Array.isArray(row) || row.length <= bIdx) continue;
            var m = String(row[bIdx]).match(/data-bal="([^"]*)"/);
            if (!m) continue;
            var v = Number(BALANCES[m[1]] || 0);
            var html = '<span class="num" data-bal="' + m[1] + '" data-num="' + v + '">' + finFmt(v) + '</span>';
            if (row[bIdx] !== html) { row[bIdx] = html; changed = true; }
          }
        });
        return changed;
      } catch (e) { return false; }
    }

    /* ---------- MODAL ---------- */
    function openAdd() { openModal(null); }

    function openEdit(id) {
      var row = null;
      ROWS.forEach(function (r) { if (String(r.id) === String(id)) row = r; });
      if (!row) { UIC.toast('لم يتم العثور على السجل', 'error'); return; }
      openModal(row);
    }

    function openModal(row) {
      var isEdit = !!row;
      /* Grayed-out non-editable id: preview of the auto-assigned code (add)
         or the actual record id (edit). Server always decides the final id. */
      var idValue = row ? row.id : NEXT_ID;
      var body = '<form id="pt-form">' +
        '<div class="form-field">' +
          '<label class="form-label">الرقم (يُعتمد تلقائياً)</label>' +
          '<input id="f-id-display" class="input" type="text" readonly value="' + esc(idValue) + '" style="background:var(--bg-subtle, #f3f4f6);color:var(--text-muted, #6b7280);cursor:not-allowed;">' +
        '</div>' +
        UIC.field({ key: 'f-name', label: 'الاسم', type: 'text', required: true, value: row ? row.name : '', noCorrect: true }) +
        UIC.combo({ key: 'f-direction', label: 'الاتجاه', required: true, options: (ENUMS.customer_direction || []).map(function (v) { return { value: v, label: v }; }), value: row ? row.customer_direction : '', placeholder: 'اكتب للبحث…' }) +
        UIC.combo({ key: 'f-type', label: 'نوع التعامل', required: true, options: (ENUMS.type || []).map(function (v) { return { value: v, label: v }; }), value: row ? String(row.type || '') : '', placeholder: 'اكتب للبحث…' }) +
        UIC.field({ key: 'f-reg', label: 'رقم السجل التجاري', type: 'number', required: true, min: '0', value: row ? (row.registration_number != null ? row.registration_number : '') : '' }) +
        UIC.field({ key: 'f-tax', label: 'الرقم الضريبي', type: 'number', required: true, min: '0', value: row ? (row.tax_id != null ? row.tax_id : '') : '' }) +
        UIC.field({ key: 'f-name-en', label: 'الاسم الإنجليزي', type: 'text', required: true, value: row ? (row.name_en || '') : '' }) +
        UIC.field({ key: 'f-country', label: 'الدولة', type: 'text', required: true, value: row ? (row.country || '') : '' }) +
        UIC.field({ key: 'f-region', label: 'المنطقة', type: 'text', required: true, value: row ? (row.region || '') : '' }) +
        UIC.field({ key: 'f-phone', label: 'التليفون', type: 'tel', required: true, value: row ? (row.telephone || '') : '' }) +
        UIC.field({ key: 'f-address', label: 'العنوان', type: 'textarea', required: true, value: row ? (row.address || '') : '' }) +
      '</form>';

      UIC.openModal('party-modal', {
        title: isEdit ? 'تعديل سجل' : 'إضافة عميل / مورد',
        body: body,
        onSave: 'PARTIES_PAGE.save(' + (isEdit ? esc(row.id) : 'null') + ')'
      });
    }

    function save(editId) {
      if (!UIC.validateForm('pt-form')) return;
      var v = function (id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; };
      var payload = {
        id: editId != null ? editId : '',
        name: v('f-name'),
        customer_direction: v('f-direction'),
        type: v('f-type'),
        registration_number: v('f-reg'),
        tax_id: v('f-tax'),
        name_en: v('f-name-en'),
        country: v('f-country'),
        region: v('f-region'),
        telephone: v('f-phone'),
        address: v('f-address')
      };
      /* Tier A: the row is on screen before the request returns. The id cell
         is server-assigned, so the draft never invents one — recordOf fills it
         from the reply on add, and the payload id on edit. queueable:false: I1
         is unproven for save_valley_party, so a transport failure rolls back
         loudly instead of queueing. */
      var isEdit = editId != null;
      var draft = {
        id: isEdit ? editId : '',
        name: payload.name,
        customer_direction: payload.customer_direction,
        type: payload.type,
        registration_number: payload.registration_number,
        tax_id: payload.tax_id,
        name_en: payload.name_en,
        country: payload.country,
        region: payload.region,
        telephone: payload.telephone,
        address: payload.address,
        'المستوى الاساسي': payload.name + (payload.name_en ? ' - ' + payload.name_en : '')
      };
      UIC.Live.save({
        call: companyCall,
        action: 'save_valley_party',
        data: payload,
        list: ROWS,
        key: 'id',
        draft: draft,
        render: renderTable,
        modal: 'party-modal',
        message: 'تم الحفظ بنجاح',
        queueable: false,
        reload: function () { load(true); },
        recordOf: function (resp) {
          var rec = Object.assign({}, draft);
          if (resp && resp.id != null && resp.id !== '') rec.id = resp.id;
          else if (!isEdit) return null;
          return rec;
        }
      }).catch(function () { /* UIC.Live has toasted and rolled back */ });
    }

    /* ===================== PARTY STATEMENT (كشف حساب) =====================
     * Financial semantics ported verbatim from the legacy Client Statement
     * Engine: debit = sales/payments, credit = purchases/collections/returns,
     * chronological running balance, opening-balance row on date filters, and
     * editable stock valuation deducted from the net balance. */
    var STMT = null;
    /* Numeric ledger net for the current filter (set in applyFilter). Balance
       boxes are pure functions of STMT_NET, the stock inputs and
       STMT.agreements_subtotal — recomputed, never accumulated. */
    var STMT_NET = 0;
    var AGREE_ROWS = [];
    var AGREE_UNITS = {};
    var AGREE_SAVING = false;

    function finFmt(n) {
      n = Number(n) || 0;
      var abs = Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      return n < 0 ? '(' + abs + ')' : abs;
    }
    /* The ledger running balance is credit minus debit from the party's
       perspective: positive means a credit balance in the customer's favor,
       while negative means a debit balance owed by the customer. Keep the
       wording and color in one helper so the normal and adjusted balances
       always use the same accounting direction. */
    function balanceDirection_(amount) {
      var n = Number(amount) || 0;
      if (n > 0) return { label: 'دائن لصالح العميل (له) 🔻', color: '#16a34a' };
      if (n < 0) return { label: 'مدين على العميل (عليه) 🔺', color: '#dc2626' };
      return { label: 'متوازن 🤝', color: '#6b7280' };
    }
    function chip(label, value, extraStyle) {
      return '<div style="background:var(--bg-surface, #fff);border:1px solid var(--border-color, #e5e7eb);border-radius:8px;padding:8px;min-width:120px;text-align:center;">' +
        '<div style="font-size:11px;color:var(--text-muted, #6b7280);margin-bottom:4px;font-weight:600;">' + label + '</div>' +
        '<div style="font-size:15px;font-weight:700;direction:ltr;' + (extraStyle || '') + '">' + value + '</div></div>';
    }

    function openStatement(pid) {
      if (String(pid) === '18' || String(pid) === '19' || Number(pid) === 18 || Number(pid) === 19) { UIC.toast('السجل غير موجود', 'error'); return; }
      UIC.readSkeleton();
      companyCall('get_valley_party_statement', { id: pid })
        .then(function (res) {
          STMT = res;
          renderStatementModal();
        })
        .catch(function (e) { UIC.toast((e && e.message) || 'خطأ في تحميل الكشف', 'error'); })
        .finally(function () { UI.hideSpinner(); });
    }

    function renderStatementModal() {
      var p = STMT.party;
      var body =
        '<div style="background:var(--success-bg, #f0fdf4);border:1px solid #a7f0ba;border-left:4px solid #16a34a;border-radius:8px;padding:14px 18px;margin-bottom:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">' +
          '<div><h3 style="margin:0;color:#166534;font-size:18px;">' + esc(p.name) + '</h3>' +
          '<div style="font-size:12px;color:var(--text-muted, #6b7280);margin-top:6px;">العنوان: <b>' + esc(p.address || '-') + '</b> · الرقم الضريبي: <b>' + esc(p.tax_id || '-') + '</b> · الهاتف: <b>' + esc(p.phone || '-') + '</b></div></div>' +
          '<div style="text-align:left;color:#9ca3af;font-size:11px;">Valley Foods ERP<br>IFRS Compliant Ledger</div>' +
        '</div>' +
        '<div id="st-filter" style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px;background:var(--bg-subtle, #f8fafc);border:1px solid var(--border-color, #e5e7eb);border-radius:8px;padding:12px;">' +
          UIC.field({ key: 'st-from', label: 'من تاريخ', type: 'date' }) +
          UIC.field({ key: 'st-to', label: 'إلى تاريخ', type: 'date' }) +
          UIC.combo({ key: 'st-type', label: 'نوع الحركة', options: [
            { value: 'all', label: 'عرض كل المعاملات' },
            { value: 'sales', label: 'مبيعات صادرة' },
            { value: 'returns', label: 'مرتجعات مبيعات' },
            { value: 'purchases', label: 'مشتريات وتوريدات' },
            { value: 'collections', label: 'مقبوضات نقدية' },
            { value: 'payments', label: 'مدفوعات صادرة' }
          ], value: 'all' }) +
          '<button class="btn btn-primary" onclick="PARTIES_PAGE.applyFilter()">⚡ تنفيذ</button>' +
          '<button class="btn btn-outline" onclick="PARTIES_PAGE.printStatement()">🖨️ طباعة / PDF</button>' +
        '</div>' +
        '<div id="st-kpis" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:10px;"></div>' +
        '<div id="st-net" style="margin-bottom:14px;"></div>' +
        '<div id="st-ledger"></div>' +
        '<div id="st-stock"></div>' +
        '<span id="st-range-badge" style="display:none;"></span>';

      /* wide modal */
      UIC.openModal('party-statement-modal', { title: '📄 كشف حساب مالي تفصيلي', size: 'xl', body: body, footer: false });
      var modal = document.getElementById('party-statement-modal');
      if (modal) {
        var box = modal.querySelector('.modal');
        if (box) box.style.maxWidth = '1500px';
      }
      applyFilter();
    }

    function applyFilter() {
      var fromV = document.getElementById('st-from').value;
      var toV = document.getElementById('st-to').value;
      var typeSel = document.getElementById('st-type').value;
      var fromMs = fromV ? new Date(fromV + 'T00:00:00').getTime() : null;
      var toMs = toV ? new Date(toV + 'T23:59:59').getTime() : null;

      var kSales = 0, kReturns = 0, kCollections = 0, kPayments = 0, kPurchases = 0;
      var opening = 0;
      var visible = [];
      var txs = STMT.transactions;

      txs.forEach(function (t) {
        var tMs = t.date_iso ? new Date(t.date_iso).getTime() : 0;
        var sign = (t.type === 'collections' || t.type === 'purchases' || t.type === 'returns') ? 1 : -1;
        if (fromMs !== null && tMs && tMs < fromMs) { opening += t.value * sign; return; }
        if (toMs !== null && tMs && tMs > toMs) return;
        if (typeSel !== 'all' && t.type !== typeSel) return;
        visible.push(t);
        if (t.type === 'sales') kSales += t.value;
        else if (t.type === 'returns') kReturns += t.value;
        else if (t.type === 'collections') kCollections += t.value;
        else if (t.type === 'payments') kPayments += t.value;
        else if (t.type === 'purchases') kPurchases += t.value;
      });

      document.getElementById('st-kpis').innerHTML =
        chip('رصيد أول المدة', finFmt(opening), 'color:#0284c7;') +
        chip('إجمالي المبيعات (مدين)', finFmt(kSales), 'color:var(--danger, #dc2626);') +
        chip('المرتجعات (دائن)', finFmt(kReturns), 'color:#2563eb;') +
        chip('التحصيلات (دائن)', finFmt(kCollections), 'color:#059669;') +
        chip('المدفوعات له (مدين)', finFmt(kPayments), 'color:#b45309;') +
        chip('المشتريات (دائن)', finFmt(kPurchases), 'color:#7c3aed;');

      var running = opening;
      /* [UI-9.1] This is the table in plan §0 — six columns, five of them
         atoms, and البيان rendering about seven characters wide, one word per
         line, nine lines tall. UIC.autoColumns reads these labels back out of
         the DOM; data-col is the markup form of { col: … }, so the sentence
         column is declared rather than left to the month's data. */
      var html = '<div class="table-wrap"><table id="st-ledger-table" class="table"><thead><tr>' +
        '<th>التاريخ</th><th>رقم المستند</th><th data-col="prose" data-min="30ch">البيان</th>' +
        '<th>مدين</th><th>دائن</th><th>الرصيد التراكمي</th></tr></thead><tbody>';

      if (fromV) {
        html += '<tr style="font-style:italic;background:#f1f5f9;"><td>' + esc(fromV) + '</td><td>-</td>' +
          '<td style="color:#0284c7;">الرصيد الافتتاحي المنقول</td><td>-</td><td>-</td>' +
          '<td class="num" data-num="' + opening + '">' + finFmt(opening) + '</td></tr>';
      }

      visible.forEach(function (t) {
        var sign = (t.type === 'collections' || t.type === 'purchases' || t.type === 'returns') ? 1 : -1;
        running += t.value * sign;
        var debit = (t.type === 'sales' || t.type === 'payments') ? finFmt(t.value) : '-';
        var credit = (t.type !== 'sales' && t.type !== 'payments') ? finFmt(t.value) : '-';
        var subHtml = (t.sub_rows || []).map(function (s) {
          var det = s.details ? '<div style="font-size:12px;color:var(--text-muted, #6b7280);margin-top:6px;">📝 ' + esc(s.details) + '</div>' : '';
          return '<tr class="st-product-row" style="background:var(--bg-subtle, #fafafa);"><td colspan="6" style="padding:10px 14px;border-bottom:1px solid var(--border-color, #e5e7eb);">' +
            '<div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px;"><span style="color:#9ca3af;font-size:12px;">↳ ' + esc(s.doc_id) + '</span><b style="font-size:14px;">' + esc(s.name) + '</b></div>' +
            '<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--text-muted, #6b7280);">' +
              '<span>الكمية: <b style="color:var(--text-main, #1f2937);">' + finFmt(s.qty) + '</b></span>' +
              '<span>السعر: <b style="color:var(--text-main, #1f2937);">' + finFmt(s.price) + '</b></span>' +
            '</div>' + det +
            '</td></tr>';
        }).join('');
        html += '<tr><td>' + esc(t.date_display) + '</td><td style="direction:ltr;">' + esc(t.doc_id) + '</td>' +
          '<td style="text-align:right;font-weight:700;">' + esc(t.desc_ar) + '</td>' +
          '<td class="num" style="' + (debit !== '-' ? 'color:var(--danger, #dc2626);' : '') + '" data-num="' + (debit !== '-' ? t.value : '') + '">' + debit + '</td>' +
          '<td class="num" style="' + (credit !== '-' ? 'color:#059669;' : '') + '" data-num="' + (credit !== '-' ? t.value : '') + '">' + credit + '</td>' +
          '<td class="num" style="font-weight:800;background:var(--bg-subtle, #f8fafc);" data-num="' + running + '">' + finFmt(running) + '</td></tr>' + subHtml;
      });

      if (!visible.length && !fromV) html += '<tr><td colspan="6" style="text-align:center;padding:30px;">لا توجد حركات مسجلة لهذا الحساب.</td></tr>';
      html += '</tbody></table></div>';
      document.getElementById('st-ledger').innerHTML = html;
      UIC.autoColumns('st-ledger-table');

      var direction = balanceDirection_(running);
      document.getElementById('st-net').innerHTML =
        '<div style="background:linear-gradient(135deg,#0e623b,#059669);border-radius:8px;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">' +
          '<div><div style="color:#d1fae5;font-size:13px;font-weight:700;">صافي رصيد الحساب الموحد</div>' +
          '<div style="background:var(--bg-surface, #fff);border-radius:20px;padding:5px 14px;display:inline-block;margin-top:6px;font-weight:700;font-size:13px;color:' + direction.color + ';">' + direction.label + '</div></div>' +
          '<div style="font-size:26px;font-weight:800;color:#fff;direction:ltr;">' + finFmt(running) + '</div>' +
        '</div>';

      STMT_NET = running;
      renderStockSection();
    }

    /* Inventory partition: category 4/23 = factory, everything else =
       packaging. Prefers the server split; falls back to a local partition
       of stock_rows so each product still lands in exactly one section. */
    function stockLists() {
      if (Array.isArray(STMT.stock_factory_rows) && Array.isArray(STMT.stock_packaging_rows)) {
        return { factory: STMT.stock_factory_rows, packaging: STMT.stock_packaging_rows };
      }
      var f = [], p = [];
      (STMT.stock_rows || []).forEach(function (r) {
        if (String(r.category) === '4' || String(r.category) === '23') f.push(r); else p.push(r);
      });
      return { factory: f, packaging: p };
    }

    function stockSectionTotal(list, prefix) {
      var total = 0;
      list.forEach(function (r, i) {
        var el = document.getElementById(prefix + i);
        var price = el ? (parseFloat(el.value) || 0) : (Number(r.latest_price) || 0);
        total += Number(r.qty || 0) * price;
      });
      return total;
    }

    function stockTotal() {
      var lists = stockLists();
      return stockSectionTotal(lists.factory, 'stock-price-f-') + stockSectionTotal(lists.packaging, 'stock-price-p-');
    }

    function stockPriceInput(prefix, i, price) {
      return '<input id="' + prefix + i + '" class="input" type="number" step="0.01" min="0" value="' + Number(price || 0).toFixed(2) + '" oninput="PARTIES_PAGE.recalcStock()" style="max-width:140px;direction:ltr;">';
    }

    function stockSectionBlock(title, desc, list, prefix, tableId) {
      var head = '<h3 style="color:#166534;margin:20px 0 8px;border-right:4px solid #16a34a;padding-right:10px;">' + title + '</h3>' +
        '<p style="font-size:12px;color:var(--text-muted, #6b7280);margin:-4px 0 10px;">' + desc + '</p>';
      if (!list.length) return head + '<p class="vf-text-muted">لا توجد أصناف في هذا القسم.</p>';
      var rowsHtml = list.map(function (r, i) {
        return '<tr><td style="text-align:right;">' + esc(r.name) + '</td>' +
          '<td class="num" data-num="' + r.qty + '">' + finFmt(r.qty) + '</td>' +
          '<td>' + stockPriceInput(prefix, i, r.latest_price) + '</td>' +
          '<td class="num" id="stock-line-' + prefix + i + '" style="font-weight:700;color:#059669;" data-num="' + (r.qty * r.latest_price) + '">' + finFmt(r.qty * r.latest_price) + '</td></tr>';
      }).join('');
      return head +
        '<div class="table-wrap"><table id="' + tableId + '" class="table"><thead><tr><th>الصنف</th><th>الكمية الحالية</th><th>سعر التقييم ✏️</th><th>إجمالي القيمة</th></tr></thead><tbody>' +
        rowsHtml + '</tbody></table></div>';
    }

    function renderStockSection() {
      var container = document.getElementById('st-stock');
      if (!container) return;
      var lists = stockLists();
      /* Editable working copy of the server agreements; rebuilt from the
         server on every modal open and every save/cancel response. */
      AGREE_ROWS = (STMT.agreements || []).map(function (r) {
        return {
          unique_id: r.unique_id || '',
          product_id: String(r.product_id == null ? '' : r.product_id),
          product_name: r.product_name || '',
          unit: r.unit || '',
          qty: r.qty != null ? r.qty : '',
          unit_price: r.unit_price != null ? r.unit_price : '',
          total: Number(r.total) || 0,
          status: r.status || 'draft'
        };
      });
      AGREE_UNITS = {};
      (STMT.client_products || []).forEach(function (o) { AGREE_UNITS[String(o.value)] = o.unit || ''; });
      container.innerHTML =
        stockSectionBlock('🏭 مخزون في المصنع', 'أصناف التصنيف 4 و23 فقط — يمكن تعديل سعر التقييم لكل صنف.', lists.factory, 'stock-price-f-', 'st-stock-factory-table') +
        '<div id="st-agree"></div>' +
        stockSectionBlock('📦 مخزون التعبئة والتغليف والأدوات', 'باقي الأصناف (باستثناء التصنيف 4 و23) — يمكن تعديل سعر التقييم لكل صنف.', lists.packaging, 'stock-price-p-', 'st-stock-packaging-table') +
        '<div style="display:flex;justify-content:space-between;align-items:center;background:var(--success-bg, #f0fdf4);border-radius:8px;padding:12px 16px;margin-top:10px;flex-wrap:wrap;gap:8px;">' +
          '<button class="btn btn-outline" onclick="PARTIES_PAGE.resetStockPrices()">🔄 إعادة تعيين الأسعار</button>' +
          '<div><span style="font-weight:700;color:#166534;">إجمالي قيمة المخزون:</span> ' +
          '<span id="stock-total" style="font-size:19px;font-weight:800;color:#059669;direction:ltr;">' + finFmt(stockTotal()) + '</span></div>' +
        '</div>' +
        '<div id="adjusted-box" style="margin-top:10px;"></div>' +
        '<div id="final-box" style="margin-top:10px;"></div>';
      UIC.autoColumns('st-stock-factory-table');
      UIC.autoColumns('st-stock-packaging-table');
      renderAgreementsSection();

      updateAdjusted();
    }

    function recalcStock() {
      var lists = stockLists();
      var total = stockTotal();
      var st = document.getElementById('stock-total');
      if (st) st.textContent = finFmt(total);
      [['stock-price-f-', 'stock-line-stock-price-f-', lists.factory],
       ['stock-price-p-', 'stock-line-stock-price-p-', lists.packaging]].forEach(function (g) {
        var prefix = g[0], linePrefix = g[1], list = g[2];
        list.forEach(function (r, i) {
          var el = document.getElementById(prefix + i);
          var line = document.getElementById(linePrefix + i);
          if (line && el) { var v = Number(r.qty || 0) * (parseFloat(el.value) || 0); line.textContent = finFmt(v); line.setAttribute('data-num', v); }
        });
      });
      updateAdjusted();
    }

    function resetStockPrices() {
      var lists = stockLists();
      [['stock-price-f-', lists.factory], ['stock-price-p-', lists.packaging]].forEach(function (g) {
        g[1].forEach(function (r, i) {
          var el = document.getElementById(g[0] + i);
          if (el) el.value = Number(r.latest_price || 0).toFixed(2);
        });
      });
      recalcStock();
    }

    function updateAdjusted() {
      var adjusted = STMT_NET - stockTotal();
      var adjustedDirection = balanceDirection_(adjusted);
      var badge = adjustedDirection.label;
      var color = adjustedDirection.color;
      document.getElementById('adjusted-box').innerHTML =
        '<div style="background:linear-gradient(135deg,var(--warning-bg, #fffbeb),#fef3c7);border:2px solid #b45309;border-radius:8px;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">' +
          '<div><div style="color:#92400e;font-size:13px;font-weight:700;">⚖️ الرصيد المستحق بعد خصم المخزون</div>' +
          '<div style="background:var(--bg-surface, #fff);border-radius:20px;padding:4px 12px;display:inline-block;margin-top:5px;font-weight:700;font-size:12px;color:' + color + ';">' + badge + '</div></div>' +
          '<div style="font-size:23px;font-weight:800;color:#b45309;direction:ltr;">' + finFmt(adjusted) + '</div>' +
        '</div>';
      updateFinal(adjusted);
    }

    /* Final balance: the existing adjusted figure minus the active-agreements
       subtotal — agreements increase what the customer owes (debit direction).
       Derived fresh on every render, applied exactly once, never accumulated
       across re-renders or reloads. */
    function updateFinal(adjusted) {
      var sub = Number(STMT.agreements_subtotal) || 0;
      var final = adjusted - sub;
      var direction = balanceDirection_(final);
      var box = document.getElementById('final-box');
      if (!box) return;
      box.innerHTML =
        '<div style="background:linear-gradient(135deg,#0e623b,#059669);border-radius:8px;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">' +
          '<div><div style="color:#d1fae5;font-size:13px;font-weight:700;">💰 الرصيد النهائي بعد إضافة الاتفاقات للمديونية (' + finFmt(sub) + ')</div>' +
          '<div style="background:var(--bg-surface, #fff);border-radius:20px;padding:4px 12px;display:inline-block;margin-top:5px;font-weight:700;font-size:12px;color:' + direction.color + ';">' + direction.label + '</div></div>' +
          '<div style="font-size:23px;font-weight:800;color:#fff;direction:ltr;">' + finFmt(final) + '</div>' +
        '</div>';
    }

    /* ===================== MANUFACTURING AGREEMENTS ===================== */
    function agreeStatusOptions(cur) {
      var opts = [{ value: 'draft', label: 'مسودة' }, { value: 'active', label: 'ساري' }];
      return opts.map(function (o) {
        return '<option value="' + o.value + '"' + (String(cur) === o.value ? ' selected' : '') + '>' + o.label + '</option>';
      }).join('');
    }

    function agreeFactoryProducts() {
      return (STMT.client_products || []).filter(function (o) {
        var c = String(o.category || '');
        return c === '4' || c === '23';
      });
    }

    function agreeProductSelect(i, r) {
      var opts = agreeFactoryProducts();
      return UIC.combo({ key: 'agr-prod-' + i, options: opts, value: r.product_id || '', placeholder: 'ابحث عن صنف التصنيع…', inline: true });
    }

    function wireAgreeCombos() {
      AGREE_ROWS.forEach(function (r, i) {
        var el = document.getElementById('agr-prod-' + i);
        if (el) el.addEventListener('change', function () { PARTIES_PAGE.agreeOnProduct(i); });
      });
    }

    function renderAgreementsSection() {
      var host = document.getElementById('st-agree');
      if (!host) return;
      var rowsHtml = AGREE_ROWS.map(function (r, i) {
        var isNew = !r.unique_id;
        var prodCell = isNew ? agreeProductSelect(i, r) : '<b>' + esc(r.product_name || r.product_id) + '</b>';
        var btns = '';
        if (CAN_WRITE) {
          btns = '<button class="btn btn-primary" style="padding:3px 10px;font-size:12px;" onclick="PARTIES_PAGE.agreeSaveRow(' + i + ')">💾 حفظ</button>';
          if (!isNew) btns += ' <button class="btn btn-outline" style="padding:3px 10px;font-size:12px;color:#dc2626;" onclick="PARTIES_PAGE.agreeCancelRow(' + i + ')">✕ إلغاء الاتفاق</button>';
        }
        var statusCell = (CAN_WRITE && r.status !== 'cancelled')
          ? '<select id="agr-status-' + i + '" class="input" style="max-width:110px;">' + agreeStatusOptions(r.status) + '</select>'
          : esc(r.status);
        return '<tr><td style="text-align:right;">' + prodCell + '</td>' +
          '<td><span id="agr-unit-' + i + '">' + esc(r.unit || AGREE_UNITS[String(r.product_id)] || '') + '</span></td>' +
          '<td><input id="agr-qty-' + i + '" class="input" type="number" step="0.01" min="0" value="' + (r.qty === '' || r.qty == null ? '' : r.qty) + '" oninput="PARTIES_PAGE.agreeRecalcRow(' + i + ')" style="max-width:110px;direction:ltr;"></td>' +
          '<td><input id="agr-price-' + i + '" class="input" type="number" step="0.01" min="0" value="' + (r.unit_price === '' || r.unit_price == null ? '' : r.unit_price) + '" oninput="PARTIES_PAGE.agreeRecalcRow(' + i + ')" style="max-width:130px;direction:ltr;"></td>' +
          '<td class="num" id="agr-total-' + i + '" style="font-weight:700;" data-num="' + (Number(r.total) || 0) + '">' + finFmt(Number(r.total) || 0) + '</td>' +
          '<td>' + statusCell + '</td>' +
          '<td style="white-space:nowrap;">' + (btns || '—') + '</td></tr>';
      }).join('');
      var sub = Number(STMT.agreements_subtotal) || 0;
      host.innerHTML =
        '<h3 style="color:#7c3aed;margin:20px 0 8px;border-right:4px solid #7c3aed;padding-right:10px;">🏭 اتفاقات تحت التصنيع</h3>' +
        '<p style="font-size:12px;color:var(--text-muted, #6b7280);margin:-4px 0 10px;">اتفاقات هذا العميل فقط — المسودة لا تؤثر على الرصيد، والساري يُضاف إجماليه للمديونية في الرصيد النهائي.</p>' +
        '<div class="table-wrap"><table id="st-agree-table" class="table"><thead><tr><th>الصنف</th><th>الوحدة</th><th>الكمية ✏️</th><th>سعر الوحدة ✏️</th><th>الإجمالي</th><th>الحالة</th><th></th></tr></thead><tbody>' +
        (rowsHtml || '<tr><td colspan="7" style="text-align:center;padding:20px;">لا توجد اتفاقات لهذا العميل.</td></tr>') + '</tbody></table></div>' +
        '<div style="display:flex;justify-content:flex-end;align-items:center;background:var(--bg-subtle, #f8fafc);border:1px solid var(--border-color, #e5e7eb);border-radius:8px;padding:10px 16px;margin-top:10px;gap:8px;flex-wrap:wrap;">' +
          '<div><span style="font-weight:700;color:#5b21b6;">إجمالي الاتفاقات السارية:</span> ' +
          '<span id="agree-subtotal" style="font-size:18px;font-weight:800;color:#7c3aed;direction:ltr;">' + finFmt(sub) + '</span></div>' +
        '</div>' +
        (CAN_WRITE ? '<div style="margin-top:8px;"><button class="btn btn-outline" onclick="PARTIES_PAGE.agreeAddRow()">+ إضافة اتفاق</button></div>' : '');
      UIC.autoColumns('st-agree-table');
      wireAgreeCombos();
    }

    function agreeAddRow() {
      AGREE_ROWS.push({ unique_id: '', product_id: '', product_name: '', unit: '', qty: '', unit_price: '', total: 0, status: 'draft' });
      renderAgreementsSection();
    }

    function agreeOnProduct(i) {
      var el = document.getElementById('agr-prod-' + i);
      var pid = el ? el.value : '';
      AGREE_ROWS[i].product_id = pid;
      var u = document.getElementById('agr-unit-' + i);
      if (u) u.textContent = AGREE_UNITS[String(pid)] || '';
      agreeRecalcRow(i);
    }

    function agreeRecalcRow(i) {
      var q = document.getElementById('agr-qty-' + i);
      var p = document.getElementById('agr-price-' + i);
      var t = document.getElementById('agr-total-' + i);
      if (!t) return;
      var v = (q ? (parseFloat(q.value) || 0) : 0) * (p ? (parseFloat(p.value) || 0) : 0);
      t.textContent = finFmt(v);
      t.setAttribute('data-num', v);
    }

    /* Single-flight: the buttons stay disabled until the server answers, so a
       double click cannot create the row twice. Retried updates carry the
       unique_id, making them idempotent server-side. */
    function agreeSaveRow(i) {
      var r = AGREE_ROWS[i];
      if (!r || AGREE_SAVING) return;
      var pidEl = document.getElementById('agr-prod-' + i);
      var qEl = document.getElementById('agr-qty-' + i);
      var pEl = document.getElementById('agr-price-' + i);
      var sEl = document.getElementById('agr-status-' + i);
      var productId = r.unique_id ? r.product_id : (pidEl ? pidEl.value : '');
      var qty = qEl ? qEl.value : r.qty;
      var price = pEl ? pEl.value : r.unit_price;
      var status = sEl ? sEl.value : (r.status || 'draft');
      if (!productId) { UIC.toast('اختر الصنف', 'error'); return; }
      if (!(Number(qty) > 0)) { UIC.toast('الكمية يجب أن تكون أكبر من صفر', 'error'); return; }
      if (!(Number(price) >= 0) || !isFinite(Number(price))) { UIC.toast('السعر غير صالح', 'error'); return; }
      AGREE_SAVING = true;
      companyCall('save_valley_mfg_agreement', {
        unique_id: r.unique_id || '',
        client_id: STMT.party.id,
        product_id: productId,
        qty: qty,
        unit_price: price,
        status: status
      }).then(function (res) {
        STMT.agreements = (res && res.agreements) || [];
        STMT.agreements_subtotal = (res && res.agreements_subtotal) || 0;
        renderAgreementsSection();
        updateAdjusted();
        UIC.toast((res && res.message) || 'تم حفظ الاتفاق', 'success');
      }).catch(function (e) {
        UIC.toast((e && e.message) || 'خطأ في حفظ الاتفاق', 'error');
      }).finally(function () { AGREE_SAVING = false; });
    }

    function agreeCancelRow(i) {
      var r = AGREE_ROWS[i];
      if (!r || !r.unique_id || AGREE_SAVING) return;
      if (!confirm('إلغاء هذا الاتفاق؟ سيُحفظ السجل للمراجعة ولن يؤثر على الرصيد.')) return;
      AGREE_SAVING = true;
      companyCall('cancel_valley_mfg_agreement', { unique_id: r.unique_id })
        .then(function (res) {
          STMT.agreements = (res && res.agreements) || [];
          STMT.agreements_subtotal = (res && res.agreements_subtotal) || 0;
          renderAgreementsSection();
          updateAdjusted();
          UIC.toast((res && res.message) || 'تم إلغاء الاتفاق', 'success');
        }).catch(function (e) {
          UIC.toast((e && e.message) || 'خطأ في إلغاء الاتفاق', 'error');
        }).finally(function () { AGREE_SAVING = false; });
    }

    function printStatement() {
      var ledger = document.getElementById('st-ledger');
      var p = STMT.party;
      /* [iPhone run 2] Same window.open and the same 500ms focus-then-print;
         UIC.printDoc adds only the branch for a refused tab. */
      UIC.printDoc(
        '<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><title>كشف حساب - ' + p.name + '</title>' +
        '<style>body{font-family:Segoe UI,Tahoma,sans-serif;margin:20px;color:var(--text-main, #1f2937);}h2{text-align:center;color:#094d2c;border-bottom:3px solid #0e623b;padding-bottom:10px;}meta{}</style></head><body>' +
        '<h2>📊 كشف حساب مالي تفصيلي — ' + esc(p.name) + '</h2>' +
        '<p style="text-align:center;color:#555;">الرقم الضريبي: ' + esc(p.tax_id || '-') + ' · العنوان: ' + esc(p.address || '-') + ' · الهاتف: ' + esc(p.phone || '-') + '</p>' +
        (ledger ? ledger.outerHTML : '') +
        document.getElementById('st-kpis').outerHTML +
        document.getElementById('st-net').outerHTML +
        (document.getElementById('st-stock') ? document.getElementById('st-stock').outerHTML : '') +

        { then: function (win) { setTimeout(function () { win.focus(); win.print(); }, 500); } }
      );
    }

      window.PARTIES_PAGE = { openAdd: openAdd, openEdit: openEdit, save: save, openStatement: openStatement, applyFilter: applyFilter, printStatement: printStatement, recalcStock: recalcStock, resetStockPrices: resetStockPrices, clearFilters: clearFilters, agreeAddRow: agreeAddRow, agreeSaveRow: agreeSaveRow, agreeCancelRow: agreeCancelRow, agreeOnProduct: agreeOnProduct, agreeRecalcRow: agreeRecalcRow };

    /* Another device's change to this page arrives on its own. The poll
       reads timestamps from cache, never a spreadsheet, and stands down
       while the tab is hidden or a save is in flight. */
    document.addEventListener('DOMContentLoaded', function () {
      UIC.Live.watchPage({
        call: companyCall,
        page: 'vf_parties',
        onChange: function () { UIC.Live.arrive(function () { load(true); }); }
      });
      /* [live-notice] the view on screen */
      UIC.Live.setView('list', { refresh: function () { load(true); } });
    });

    document.addEventListener('DOMContentLoaded', renderApp);
  })();
  </script>
