  <style>
    .scan-wrap { max-width: 1200px; margin: 0 auto; padding: 4px 4px 32px; }
    .scan-card { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-sm); }
    .scan-entry, #count-step, #confirm-step { max-width: 520px; margin-right: auto; margin-left: auto; }
    .scan-history { margin-top: 24px; border-top: 1px solid var(--border-color); padding-top: 18px; }
    .scan-history-title { margin: 0 0 12px; font-size: 17px; }
    .scan-history-filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
    .scan-history-filters .input { width: 150px; }
    .scan-big-btn { width: 100%; padding: 16px; font-size: 16px; font-weight: 800; border-radius: 12px; }

    @keyframes scan-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); } 50% { box-shadow: 0 0 0 4px var(--brand-primary); } }
    .scan-reader { width: 100%; margin: 12px 0; border-radius: 10px; overflow: hidden; }
    .scan-manual { display: flex; gap: 8px; margin-top: 12px; }
    .scan-manual input { flex: 1; font-size: 15px; padding: 12px; }
    .scan-hint { color: var(--text-muted); font-size: 12.5px; text-align: center; margin-top: 8px; }
    .scan-catalog-metrics { margin-top: 6px; padding: 6px 8px; color: var(--text-muted); background: var(--bg-muted, #f5f5f5); border-radius: 6px; font-size: 10px; line-height: 1.6; overflow-wrap: anywhere; }
    .scan-catalog-metrics button { display: inline-block; margin: 4px 0 0 6px; padding: 2px 7px; font: inherit; cursor: pointer; }
    .scan-product-header { text-align: center; margin-bottom: 14px; }
    .scan-product-header .name { font-size: 18px; font-weight: 800; color: var(--text-main); }
    .scan-product-header .unit { color: var(--text-muted); font-size: 13px; }
    .scan-pick { position: relative; margin-top: 14px; }
    .scan-product-toggle { width: 100%; display: flex; justify-content: space-between; align-items: center; text-align: right; }
    .scan-product-menu { position: absolute; z-index: 20; top: 100%; right: 0; left: 0; margin-top: 4px; padding: 8px; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 10px; box-shadow: var(--shadow-md, 0 8px 24px rgba(0,0,0,.14)); }
    .scan-product-menu[hidden], .scan-capture-actions { display: none !important; }
    .scan-product-menu .input { width: 100%; box-sizing: border-box; margin-bottom: 6px; }
    .scan-product-dropdown { max-height: 260px; overflow-y: auto; padding: 3px; }
    .scan-product-option { display: block; width: 100%; padding: 10px 12px; border: 0; border-radius: 7px; background: transparent; color: var(--text-main); text-align: right; font: inherit; cursor: pointer; }
    .scan-product-option:hover, .scan-product-option:focus { background: var(--bg-muted, #f5f5f5); }
    .scan-total-row { display: flex; justify-content: space-between; align-items: center; background: var(--bg-muted, #f5f5f5); border-radius: 10px; padding: 12px 14px; margin: 14px 0; font-weight: 800; }
    .scan-total-row .val { font-size: 20px; color: var(--brand-primary); }
    .scan-actions { display: flex; gap: 10px; margin-top: 16px; }
    .scan-actions .btn { flex: 1; }
    .scan-calc-field { display: grid; grid-template-columns: minmax(0, 1fr) 48px; gap: 8px; align-items: end; }
    .scan-calc-trigger { min-width: 48px; height: 44px; padding: 0; font-size: 21px; }
    .scan-datetime[readonly] { background: var(--bg-muted, #f5f5f5); color: var(--text-muted); cursor: default; }
    .scan-calc-display { width: 100%; padding: 12px; margin-bottom: 12px; text-align: left; direction: ltr; font-size: 24px; font-weight: 800; border: 1px solid var(--border-color); border-radius: 10px; background: var(--bg-muted, #f5f5f5); box-sizing: border-box; }
    .scan-calc-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .scan-calc-grid .btn { min-height: 48px; padding: 8px; font-size: 18px; font-weight: 700; }
    .confirm-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border-color); font-size: 14px; }
    .confirm-row:last-child { border-bottom: none; }
    .confirm-row .label { color: var(--text-muted); }
    .confirm-row .val { font-weight: 700; }
    .save-status { text-align: center; margin-top: 14px; font-weight: 700; }
    .save-status.saving { color: var(--text-muted); }
    .save-status.success { color: #16a34a; }
    .save-status.error { color: #dc2626; }
    .scan-pending-area { margin: 12px 0; padding: 10px; border: 1px solid var(--pending-border, #f0c36d); border-radius: 10px; background: var(--pending-bg, #fff8e7); }
    .scan-pending-area h4 { margin: 0 0 8px; font-size: 14px; }
    .scan-pending-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid rgba(0,0,0,.08); }
    .scan-pending-row:first-of-type { border-top: 0; }
    .scan-pending-detail { color: var(--text-muted); font-size: 12px; margin-top: 4px; }
    .scan-rejected-row { color: var(--danger, #b91c1c); }
    .badge-pending { display: inline-block; white-space: nowrap; color: var(--pending-text, #8a5a00); font-size: 12px; font-weight: 700; }
  </style>

<body>
<div id="tc-root" dir="rtl"></div>
<script>
  var params = new URLSearchParams(window.location.search);
  var SESSION_TOKEN = params.get('sessionToken') || (API.getSession() || {}).token || '';
  var scriptUrl = window.scriptUrl || '/';
  var IS_SUPER_ADMIN = <?!= user && user.isSuperAdmin ? 'true' : 'false' ?>;
  var COMPANY_LOGO_URL = '<?!= getCompanyLogoUrl_('3fe1b5cb67b7223e') ?>';
  var COMPANY_PAGES = <?!= companyPages ?>;
  var CURRENT_ACTION = '<?!= currentAction ?>';
  var USER_PAGES = <?!= user && user.isSuperAdmin ? 'null' : JSON.stringify((user && user.authorizedPages) || {}) ?>;
  var CAN_WRITE = UIC.canAdd_(); var CAN_FULL = UIC.canFull_();
  var CONTAINER_TYPES = ['شيكارة', 'كرتونة', 'برميل', 'بستلة', 'جونية'];

  function companyCall(moduleAction, data) {
    return API.call('company_action', {
      target_system: '3fe1b5cb67b7223e',
      module_action: moduleAction,
      data: data || {}
    }, SESSION_TOKEN);
  }
  function backgroundCompanyCall(moduleAction, data) {
    var hint = null;
    try {
      if (window.UIC && UIC.REQ_COORD_CORE_ === true) {
        hint = UIC._rpcLaneHint;
        UIC._rpcLaneHint = { lane: 'background', coalesce: true };
      }
      return companyCall(moduleAction, data);
    } finally {
      try { if (window.UIC && UIC.REQ_COORD_CORE_ === true) UIC._rpcLaneHint = hint; } catch (e) {}
    }
  }

  function esc(s) { return FMT.escape(s == null ? '' : s); }
  function scanNow_() { return IS_SUPER_ADMIN ? (window.performance && performance.now ? performance.now() : Date.now()) : 0; }
  function scanUtf8Bytes_(value) {
    var s = String(value == null ? '' : value);
    try { return new Blob([s]).size; } catch (e) { return unescape(encodeURIComponent(s)).length; }
  }
  var scanCatalogLastMetrics = null;
  var scanCatalogFilterLastMs = null;
  var scanCatalogWaitTimer = null;
  function renderScanCatalogMetrics_(metrics) {
    if (!IS_SUPER_ADMIN) return;
    if (metrics) scanCatalogLastMetrics = metrics;
    var el = document.getElementById('scan-catalog-metrics-text');
    var m = scanCatalogLastMetrics;
    if (!el || !m) return;
    function ms(v) { return v != null && v !== '' && Number.isFinite(Number(v)) ? Math.round(Number(v)) + ' ms' : '—'; }
    var db = m.server || {};
    var parts = ['قياس قائمة اختيار الصنف', m.source || ''];
    if (m.count != null) parts.push('الأصناف: ' + m.count);
    if (m.match_count != null) parts.push('المطابق: ' + m.match_count + ' | المعروض: ' + (m.visible_count || 0));
    if (m.payload_bytes != null) parts.push('البيانات: ' + m.payload_bytes + ' bytes');
    if (m.cache_age_ms != null) parts.push('عمر كاش المتصفح: ' + ms(m.cache_age_ms));
    if (m.browser_cache_ms != null) parts.push('قراءة/عرض الكاش: ' + ms(m.browser_cache_ms));
    if (m.rpc_ms != null) parts.push('RPC: ' + ms(m.rpc_ms));
    if (m.accept_ms != null) parts.push('تحليل الكتالوج: ' + ms(m.accept_ms));
    if (m.filter_ms != null) parts.push('البحث المحلي: ' + ms(m.filter_ms));
    if (m.render_ms != null) parts.push('رسم النتائج: ' + ms(m.render_ms));
    if (m.until_visible_ms != null) parts.push('حتى الظهور: ' + ms(m.until_visible_ms));
    if (m.coordinator) parts.push('طلبات منسقة نشطة/انتظار: ' + m.coordinator.active + '/' + m.coordinator.pending);
    if (m.rpc_ms != null || m.server) {
      parts.push('كاش MySQL: ' + (db.cache_hit === true ? 'نعم' : (db.cache_hit === false ? 'لا' : '—')));
      parts.push('اتصال: ' + ms(db.connection_ms));
      parts.push('SQL: ' + ms(db.sql_ms));
      parts.push('قراءة JDBC: ' + ms(db.read_ms));
      parts.push('تحليل JSON بالخادم: ' + ms(db.json_parse_ms));
      parts.push('MySQL إجمالاً: ' + ms(db.elapsed_ms));
      if (db.rows_read != null) parts.push('صفوف JDBC: ' + db.rows_read);
    }
    if (m.error) parts.push('الحالة: ' + m.error);
    el.textContent = parts.filter(Boolean).join(' | ');
  }
  function pad(n) { return ('0' + n).slice(-2); }
  function nowLocalDateTime() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
      'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function round2(n) { return Math.round((Number(n) || 0) * 100) / 100; }

  /* ── State ─────────────────────────────────────────────────────────────── */
  var currentProduct = null;   // { id:String, label:String, perUnit:String, code:String|null }
  var currentWarehouse = null; // { id:String, location:String }
  var warehouses = [];         // [{ value:String, label:String }] from warehouse_locations
  var warehouseById = Object.create(null);
  var warehousesState = 'loading'; // loading | ready | error
  var warehousesError = '';
  var warehousesSequence = 0;
  var balanceGen = 0;
  var currentBalance = { state: 'idle', qty: null, productId: null, warehouseId: null, error: '', at: 0 }; // idle|loading|ready|missing|error
  var recentQueries = Object.create(null); // bounded client reuse, 30s
  var recentQueryKeys = [];
  /* Instant catalog: one complete bounded products list, filtered locally.
     SCAN_LOCAL_CATALOG_ENABLED=false restores pure server search (rollback). */
  var SCAN_LOCAL_CATALOG_ENABLED = true;
  var SCAN_CATALOG_FRESH_MS = 60000;
  var SCAN_CATALOG_STALE_MAX_MS = 600000;
  var SCAN_CATALOG_MAX_OPTIONS = 100;
  var scanCatalog = null; // { products:[{id,name_ar,code,per_unit,key}], byId:{}, deadline }
  var scanCatalogState = 'idle'; // idle|loading|ready|fallback|error
  var scanCatalogError = '';
  var scanCatalogGen = 0;
  var scanCatalogPromise = null;
  var scanCatalogFallback = false; // true once server search takes over
  var scanCatalogStorageKey = '';
  var productBalances = Object.create(null); // productId -> { at, map:{warehouseId:qty} }
  var pendingEntry = null;     // current editable draft only; never used by saves after dispatch
  var retainedWarehouseId = ''; // last explicit selection in this page session
  var scanRejectedDrafts = [];
  var qrReader = null;
  var cameraActive = false;
  var cameraStarting = false;
  var productOptionsById = Object.create(null);
  var productSearchTimer = null;
  var productSearchSequence = 0;
  var productSearchOffset = 0;
  var productSearchText = '';
  var productSearchHasMore = false;
  var productSearchTotal = -1; // catalog-mode total matches; -1 means server mode
  var productSearchBusy = false;
  var productLoadingMore = false;
  var productSearchRetryAppend = false;
  var productSearchWire = 0;
  var productSearchDeferred = null;
  var productSearchResults = [];
  var productDropdownOpen = false;
  var scannerLibraryPromise = null;
  var scanHistoryRows = [];
  var scanHistoryLoadedAll = false;
  var scanHistoryState = 'loading';
  var scanHistoryError = '';
  var scanHistorySequence = 0;
  var scanHistoryFrom = '2026-09-01';
  var scanHistoryTo = '';
  var SCAN_HISTORY_START_DATE = '2026-09-01';

  function load() {
    scanCatalogStorageKey = scanCatalogCacheKey_();
    UIC.appShell('tc-root', {
      companyLogoUrl: COMPANY_LOGO_URL,
      companyLogoHref: scriptUrl + '?action=tc_dashboard&sessionToken=' + SESSION_TOKEN,
      companyLogoTitle: 'توب كيميكال',
      breadcrumb: 'توب كيميكال / المخازن / جرد دوري مخازن باركود',
      contentId: 'scan-content',
      menuGroups: (window.TOPCHEMICAL_MENU || [])
    });
    renderShell();
    showStep('scan');
    loadWarehouses(false);
    if (SCAN_LOCAL_CATALOG_ENABLED) {
      // One bootstrap catalog request; typing filters locally with zero RPC.
      renderProductResults('loading');
      ensureScanCatalog(false);
    } else {
      searchProducts('', false);
    }
    // Give the controls a paint before starting the independent sheet read.
    setTimeout(function () { loadScanHistory(); }, 0);
    if (typeof document.addEventListener === 'function') {
      document.addEventListener('click', function (e) {
        var picker = document.getElementById('scan-product-picker');
        if (picker && !picker.contains(e.target)) closeProductDropdown();
      });
      document.addEventListener('visibilitychange', function () {
        if (isScanPageVisible() && productDropdownOpen && SCAN_LOCAL_CATALOG_ENABLED &&
            scanCatalogState === 'ready' && !scanCatalogFresh()) ensureScanCatalog(false);
      });
      /* A successful product edit in another ERP tab removes this exact
         browser cache key. Keep the old picker usable while fetching its
         replacement; product selection still checks the server on save. */
      window.addEventListener('storage', function (event) {
        if (!SCAN_LOCAL_CATALOG_ENABLED || !scanCatalogStorageKey ||
            event.key !== scanCatalogStorageKey || event.newValue !== null) return;
        if (scanCatalog) scanCatalog.deadline = 0;
        if (isScanPageVisible()) ensureScanCatalog(false);
      });
    }
  }

  function isScanPageVisible() {
    try { return !document || document.visibilityState !== 'hidden'; } catch (e) { return true; }
  }
  function syncProductDropdown() {
    var menu = document.getElementById('scan-product-menu');
    var toggle = document.getElementById('scan-product-toggle');
    var input = document.getElementById('scan-product-search');
    if (menu) menu.hidden = !productDropdownOpen;
    if (toggle) toggle.setAttribute('aria-expanded', productDropdownOpen ? 'true' : 'false');
    if (input) input.setAttribute('aria-expanded', productDropdownOpen ? 'true' : 'false');
  }
  function toggleProductDropdown() {
    if (productDropdownOpen) { closeProductDropdown(); return; }
    openProductDropdown();
    var input = document.getElementById('scan-product-search');
    if (input) { input.value = ''; productSearchText = ''; scheduleProductSearch(''); input.focus(); }
  }
  function openProductDropdown() {
    productDropdownOpen = true; syncProductDropdown();
    // Timers may be delayed: recheck freshness on opening.
    if (SCAN_LOCAL_CATALOG_ENABLED && scanCatalog && !scanCatalogFresh() && isScanPageVisible()) {
      ensureScanCatalog(false);
    }
  }
  function closeProductDropdown() { productDropdownOpen = false; syncProductDropdown(); }
  function handleProductSearchKey(e) {
    if (e.key === 'Escape') {
      closeProductDropdown();
      var toggle = document.getElementById('scan-product-toggle'); if (toggle) toggle.focus();
      return;
    }
    if (e.key === 'ArrowDown') {
      var first = document.querySelector('#scan-product-results .scan-product-option');
      if (first) { e.preventDefault(); first.focus(); }
    }
  }

  function renderProductResults(state, message) {
    var host = document.getElementById('scan-product-results');
    if (!host) return;
    if (state === 'loading') { host.innerHTML = '<div class="scan-hint">جارٍ تحميل الأصناف...</div>'; syncProductDropdown(); return; }
    if (state === 'hint') {
      host.innerHTML = '<div class="scan-hint" role="status">' + esc(message || 'أدخل قيمة البحث') + '</div>';
      syncProductDropdown(); return;
    }
    if (state === 'error') {
      var retry = '<button type="button" class="btn btn-outline" onclick="retryProductSearch()">إعادة المحاولة</button>';
      host.innerHTML = (productSearchResults.length ? productSearchResults.map(function (o) {
        return '<button type="button" class="scan-product-option" role="option" onclick="chooseScanProduct(\'' + esc(String(o.value)) + '\')">' +
          esc(o.label) + ' <span class="scan-hint">#' + esc(String(o.value)) + '</span></button>';
      }).join('') : '') + '<div class="scan-hint" role="status">تعذر تحميل الأصناف' + (message ? ' — ' + esc(message) : '') + ' ' + retry + '</div>';
      syncProductDropdown(); return;
    }
    var html = productSearchResults.length ? productSearchResults.map(function (o) {
      var codeSuffix = o.code ? ' <span class="scan-hint">(' + esc(o.code) + ')</span>' : '';
      return '<button type="button" class="scan-product-option" role="option" onclick="chooseScanProduct(\'' +
        esc(String(o.value)) + '\')">' + esc(o.label) + ' <span class="scan-hint">#' + esc(String(o.value)) + '</span>' + codeSuffix + '</button>';
    }).join('') : '<div class="scan-hint">لا توجد أصناف مطابقة</div>';
    if (productSearchTotal >= 0 && productSearchTotal > productSearchResults.length) {
      html += '<div class="scan-hint">عرض ' + productSearchResults.length + ' من ' + productSearchTotal + ' — ضيّق البحث لعرض نتائج أدق</div>';
    }
    if (productSearchHasMore && !productLoadingMore) html += '<button type="button" class="scan-product-option" onclick="loadMoreProducts()">تحميل المزيد</button>';
    if (productLoadingMore) html += '<div class="scan-hint">جارٍ تحميل المزيد...</div>';
    if (scanCatalogFallback && scanCatalogState === 'fallback') html += '<div class="scan-hint">البحث عبر الخادم</div>';
    host.innerHTML = html;
    syncProductDropdown();
  }

  function recentQueryGet(key) {
    var hit = recentQueries[key];
    if (!hit) return null;
    if (Date.now() - hit.at > 30000) { try { delete recentQueries[key]; } catch (e) {} return null; }
    return hit.result;
  }
  function recentQueryPut(key, result) {
    recentQueries[key] = { at: Date.now(), result: result };
    recentQueryKeys.push(key);
    while (recentQueryKeys.length > 20) {
      var old = recentQueryKeys.shift();
      try { delete recentQueries[old]; } catch (e) {}
    }
  }

  /* Pure local matching over a complete catalog. No RPC, no SQL here:
     id mode matches exact string IDs only, code mode exact codes only,
     name mode matches normalized Arabic substrings (empty query matches all).
     Same-name products with distinct IDs all survive; order is preserved. */
  function normalizeScanName(s) {
    return String(s == null ? '' : s)
      .replace(/[\u064B-\u065F\u0670\u0640]/g, '')
      .replace(/[\u0622\u0623\u0625]/g, 'ا')
      .replace(/\u0649/g, 'ي')
      .replace(/\s+/g, ' ')
      .trim()
      .toLowerCase();
  }
  function isScanExactId(q) { return /^[1-9]\d{0,19}$/.test(String(q)); }
  function compareScanProductIds(left, right) {
    var a = String(left), b = String(right);
    if (/^\d+$/.test(a) && /^\d+$/.test(b)) {
      a = a.replace(/^0+(?=\d)/, ''); b = b.replace(/^0+(?=\d)/, '');
      if (a.length !== b.length) return a.length - b.length;
      return a < b ? -1 : (a > b ? 1 : 0);
    }
    return a.localeCompare(b);
  }
  function filterScanCatalog(products, mode, query, limit) {
    var out = [], total = 0;
    var max = Math.min(Math.max(Math.floor(Number(limit) || SCAN_CATALOG_MAX_OPTIONS), 1), SCAN_CATALOG_MAX_OPTIONS);
    query = String(query == null ? '' : query).trim();
    var list = products || [];
    var i, p;
    if (mode === 'id') {
      if (!isScanExactId(query)) return { matches: out, total: 0 };
      for (i = 0; i < list.length; i++) { if (String(list[i].id) === query) { out.push(list[i]); total = 1; break; } }
      return { matches: out, total: total };
    }
    if (mode === 'code') {
      if (!query || query.length > 64) return { matches: out, total: 0 };
      for (i = 0; i < list.length; i++) {
        p = list[i];
        if (p.code != null && String(p.code) === query) { total++; if (out.length < max) out.push(p); }
      }
      return { matches: out, total: total };
    }
    var nq = normalizeScanName(query).slice(0, 80);
    for (i = 0; i < list.length; i++) {
      p = list[i];
      if (!nq || String(p.id).toLowerCase().indexOf(String(query).toLowerCase()) >= 0 ||
          (p.key != null ? p.key : normalizeScanName(p.name_ar)).indexOf(nq) >= 0) {
        total++;
        if (out.length < max) out.push(p);
      }
    }
    return { matches: out, total: total };
  }
  function isScanDenial(e) {
    var code = String((e && (e.code || e.message)) || '');
    return /NOT_AUTHORIZED|UNAUTHORIZED|AUTHORIZATION|SESSION_EXPIRED|SYSTEM_DISABLED|ACCOUNT_DISABLED|FORBIDDEN|LOGIN_REQUIRED|OWNER_MISMATCH|MYSQL_SCOPE_CHANGED/i.test(code);
  }

  function productQueryKey(mode, query, offset) {
    return String(mode) + '|' + String(query) + '|30|' + String(offset || 0);
  }
  function exactQueryValid(mode, query) {
    if (mode === 'id') return /^[1-9]\d{0,19}$/.test(query);
    if (mode === 'code') return !!query && query.length <= 64;
    return true;
  }
  function invalidateProductSearch() {
    if (productSearchTimer) clearTimeout(productSearchTimer);
    productSearchTimer = null;
    productSearchSequence++;
    productSearchDeferred = null;
    productLoadingMore = false;
  }

  function scanCatalogFresh() {
    return !!scanCatalog && scanCatalogState === 'ready' && Date.now() < scanCatalog.deadline;
  }
  function scanCatalogCacheKey_() {
    var session = API.getSession ? API.getSession() || {} : {};
    var email = String(window.AUTH_USER_EMAIL || (session.user && session.user.email) || session.email || '').trim().toLowerCase();
    return email ? 'erp:mysql-dropdown:3fe1b5cb67b7223e:tc_stock_scan:products:v2:' + encodeURIComponent(email) : '';

        renderScanHistory();
      });
  }

  /* Replace only the confirmed server window. Pending/uncertain rows remain in
     the same live array used by UIC.Live, so an older response cannot erase a
     submission that was already painted. */
  function mergeScanHistory(serverRows) {
    var live = scanHistoryRows, pending = live.filter(function (r) { return r && (r.__pending || r.__status === 'uncertain'); });
    var localConfirmed = live.filter(function (r) { return r && r.__status === 'confirmed' && !r.__pending; });
    var byKey = Object.create(null), merged = [];
    (serverRows || []).forEach(function (r) {
      var key = scanHistoryKey(r); if (key) r.__scanKey = key;
      if (key) byKey[key] = r;
      merged.push(r);
    });
    pending.forEach(function (r) {
      var key = scanHistoryKey(r);
      if (!key || !byKey[key]) merged.push(r);
    });
    localConfirmed.forEach(function (r) {
      var sheetKey = r._sheetRow == null ? '' : 'row_' + String(r._sheetRow);
      if (sheetKey && !byKey[sheetKey]) merged.push(r);
    });
    live.splice(0, live.length);
    Array.prototype.push.apply(live, merged);
  }

  function filterScanHistory() {
    var requestedFrom = (document.getElementById('scan-history-from') || {}).value || '';
    scanHistoryFrom = requestedFrom < SCAN_HISTORY_START_DATE ? SCAN_HISTORY_START_DATE : requestedFrom;
    scanHistoryTo = (document.getElementById('scan-history-to') || {}).value || '';
    renderScanHistory();
  }

  /* ── Step 1: scan ─────────────────────────────────────────────────────── */
  function renderScanStep() {
    var el = document.getElementById('scan-step');
    if (!el) return;
    /* Once the live camera failed with a permission error this session, the

          '<div id="scan-product-results" class="scan-product-dropdown" role="listbox" aria-live="polite"><div class="scan-hint">جارٍ تحميل الأصناف...</div></div>' +
        '</div>' +
      '</div>' +
      (IS_SUPER_ADMIN ? '<div id="scan-catalog-metrics" class="scan-catalog-metrics" aria-live="off">' +
        '<span id="scan-catalog-metrics-text"></span>' +
        '<button type="button" class="btn btn-outline" title="تجاوز كاش الخادم وقياس قراءة جديدة" onclick="retryScanCatalog()">قياس تحديث MySQL</button>' +
      '</div>' : '') +
      '<div class="scan-hint">كود الصنف مطبوع أسفل الباركود أرقاماً فقط (مثال: 12)، والملصقات القديمة بصيغة TCP-12 تُقرأ أيضاً — قارئ الباركود المحمول أو لوحة المفاتيح يعملان في نفس الحقل.</div>' +
      '</div>' +

        if (v) handleScannedCode(v);
      });
    }

       SAME image twice still fires change (a common retry pattern). */
    var fileInput = document.getElementById('scan-file');
    if (fileInput) {
      fileInput.addEventListener('change', function () {
        var f = this.files && this.files[0];

      });
    }
    renderProductResults('ready');
    renderScanCatalogMetrics_();
    renderScanHistory();
  }

  /* ── Live camera — kept where the browser allows it ────────────────────── */
  function loadScannerLibrary() {
    if (typeof Html5Qrcode !== 'undefined' && typeof Html5QrcodeSupportedFormats !== 'undefined') return Promise.resolve();
    if (scannerLibraryPromise) return scannerLibraryPromise;
    scannerLibraryPromise = new Promise(function (resolve, reject) {
      var script = document.createElement('script');
      var settled = false;
      var timer = setTimeout(function () { finish(new Error('timeout')); }, 12000);
      function finish(err) {
        if (settled) return;
        settled = true; clearTimeout(timer);
        if (err) { script.onerror = null; if (script.parentNode) script.parentNode.removeChild(script); reject(err); }
        else resolve();
      }
      script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js';
      script.async = true;
      script.onload = function () {
        if (typeof Html5Qrcode !== 'undefined' && typeof Html5QrcodeSupportedFormats !== 'undefined') finish();
        else finish(new Error('invalid library'));
      };
      script.onerror = function () { finish(new Error('load failed')); };
      document.head.appendChild(script);
    }).catch(function (e) { scannerLibraryPromise = null; throw e; });
    return scannerLibraryPromise;
  }

  function startCamera() {
    if (cameraActive || cameraStarting) return;
    /* Secure-context / support pre-check: a browser without getUserMedia
       (or an insecure embedding) would only fail after a confusing round
       trip — steer the user to the permission-free photo path instead. */
    if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
      rememberCameraBlocked();
      UIC.toast('هذا المتصفح لا يدعم الكاميرا المباشرة هنا — استخدم زر «مسح من صورة» بالأسفل.', 'error');
      suggestPhotoScan();
      return;
    }
    var readerEl = document.getElementById('scan-reader');
    if (!readerEl) return;
    cameraStarting = true;
    readerEl.style.display = '';
    loadScannerLibrary().then(function () {
      qrReader = new Html5Qrcode('scan-reader', { formatsToSupport: [Html5QrcodeSupportedFormats.CODE_128] });
      return qrReader.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 260, height: 140 } },
      function onScanSuccess(decodedText) {
        var code = decodedText;
        stopCamera();
        handleScannedCode(code);
      },
      function onScanFailure() { /* no code in this frame — expected continuously while aiming */ }
      );
    }).then(function () { cameraActive = true; cameraStarting = false; }).catch(function (err) {
      cameraStarting = false;
      if (!qrReader || !(err && err.message === 'timeout')) {
        // Library load errors are distinct from camera permission errors and
        // remain retryable from the camera button.
        if (!qrReader) { UIC.toast('تعذر تحميل مكتبة الكاميرا — حاول مرة أخرى أو استخدم مسح الصورة', 'error'); readerEl.style.display = 'none'; return; }
      }
      UIC.toast(cameraErrorMessage(err), 'error');
      readerEl.style.display = 'none';
    });
  }

  /* A denied/stuck camera is never a dead end: every failure message points
     here, and the button pulses so the user lands on the working path in one
     tap instead of fighting browser settings. Permission-class failures are
     also remembered for the session, so the camera button stops being
     offered at all (see renderScanStep). */
  function rememberCameraBlocked() {
    try { sessionStorage.setItem('tc_scan_cam_blocked', '1'); } catch (e) {}
  }

  function cameraErrorMessage(err) {
    var name = (err && err.name) || '';
    var msg = String((err && err.message) || err || '');
    if (name === 'NotAllowedError' || /permission|denied|dismissed|notallowed/i.test(msg)) {
      rememberCameraBlocked();
      suggestPhotoScan();
      return 'المتصفح يمنع الكاميرا لهذا الموقع — يمكن السماح بها لاحقاً من إعدادات الموقع (أيقونة القفل بجانب الرابط)، أو استخدم زر «مسح من صورة» بالأسفل الآن.';
    }
    if (name === 'NotFoundError' || /no camera|not found|device/i.test(msg)) {
      suggestPhotoScan();
      return 'لا توجد كاميرا متصلة — استخدم زر «مسح من صورة» أو أدخل الكود يدوياً.';
    }
    suggestPhotoScan();
    return 'تعذر الوصول للكاميرا — استخدم زر «مسح من صورة» أو أدخل الكود يدوياً.';
  }

  function suggestPhotoScan() {
    var btn = document.getElementById('photo-scan-btn');
    if (!btn) return;
    btn.classList.remove('suggested');
    void btn.offsetWidth; // restart the pulse animation
    btn.classList.add('suggested');
  }

  /* ── Scan from a photo — the permission-free path, identical on Windows,
     Android and iOS. capture="environment" opens the NATIVE camera app on
     phones (its own permission flow, the one users already understand) and
     the file picker on Windows; html5-qrcode then decodes CODE_128 from the
     image file. getUserMedia is never involved. A fresh instance per scan
     because renderScanStep recreates the reader div on every step return. */
  function pickScanPhoto() {
    var fileInput = document.getElementById('scan-file');
    if (!fileInput) return;
    fileInput.value = '';
    fileInput.click();
  }

  function scanFromImage(file) {
    if (!file) return;
    var inst;
    loadScannerLibrary().then(function () {
      inst = new Html5Qrcode('scan-file-reader', { formatsToSupport: [Html5QrcodeSupportedFormats.CODE_128] });
      return inst.scanFile(file, false);
    })
      .then(function (decodedText) {
        handleScannedCode(decodedText);
      })
      .catch(function (err) {
        if (!inst) { UIC.toast('تعذر تحميل مكتبة قراءة الباركود — حاول اختيار الصورة مرة أخرى', 'error'); return; }
        UIC.toast('لم يتم العثور على باركود واضح في الصورة — أعد التصوير بحيث يظهر الباركود كبيراً ومستقيماً وملامئاً للصورة', 'error');
      })
      .then(function () {
        try { inst.clear().catch(function () {}); } catch (e) {}
      });
  }

  function stopCamera() {
    var readerEl = document.getElementById('scan-reader');
    if (!cameraActive || !qrReader) { if (readerEl) readerEl.style.display = 'none'; return; }
    qrReader.stop().then(function () {
      try { qrReader.clear(); } catch (e) {}
      cameraActive = false;
      if (readerEl) readerEl.style.display = 'none';
    }).catch(function () { cameraActive = false; if (readerEl) readerEl.style.display = 'none'; });
  }

  function handleScannedCode(code) {
    var raw = String(code || '').trim();
    var m = raw.match(/^TCP-(\d+)$/i);
    var digits = m ? m[1] : (/^[1-9]\d{0,19}$/.test(raw) ? raw : '');
    if (!digits) {
      UIC.toast('كود غير صالح: ' + raw, 'error');
      return;
    }
    // A ready catalog resolves barcodes locally with zero RPC.
    if (SCAN_LOCAL_CATALOG_ENABLED && scanCatalogFresh()) {
      var entry = scanCatalog.byId[digits];
      if (entry) {
        productOptionsById[digits] = { value: digits, label: entry.name_ar || ('#' + digits), per_unit: entry.per_unit, code: entry.code };
        selectProduct(digits, entry.name_ar || ('#' + digits), entry.per_unit, entry.code);
      } else {
        UIC.toast('لم يتم العثور على صنف بهذا الكود', 'error');
      }
      return;
    }
    companyCall('get_stock_scan_options', { mode: 'id', id: digits })
      .then(function (r) {
        var opt = (r.product_options || [])[0];
        if (!opt) { UIC.toast('لم يتم العثور على صنف بهذا الكود', 'error'); return; }
        var key = String(opt.value);
        productOptionsById[key] = { value: key, label: opt.label, per_unit: opt.per_unit, code: opt.code };
        selectProduct(key, opt.label, opt.per_unit, opt.code);
      })
      .catch(function () { UIC.toast('تعذر التحقق من كود الصنف — حاول مرة أخرى', 'error'); });
  }

  /* ── Step 2: count entry ──────────────────────────────────────────────── */
  /* Selecting a product never saves: it only opens the count form. The
     warehouse balance loads per pair once both selections exist, and the
     record is saved only from تأكيد الكمية. */
  function selectProduct(pid, label, perUnit, code) {
    var idStr = String(pid == null ? '' : pid).trim();
    if (!/^[1-9]\d{0,19}$/.test(idStr)) return;
    invalidateProductSearch();
    currentProduct = { id: idStr, label: String(label == null ? '' : label), perUnit: perUnit, code: code == null ? null : String(code) };
    currentWarehouse = retainedWarehouseId && warehouseById[retainedWarehouseId]
      ? { id: retainedWarehouseId, location: warehouseById[retainedWarehouseId].label } : null;
    clearBalance();
    showStep('count');
    renderCountStep();
    if (SCAN_LOCAL_CATALOG_ENABLED && scanCatalogState === 'ready' && !scanCatalogFresh()) {
      ensureScanCatalog(false); // refresh in the background; the committed ID is stable
    }
    if (currentWarehouse) requestBalance(currentProduct.id, currentWarehouse.id, {});
    else prefetchProductBalances(currentProduct.id);
  }

  function onWarehouseChange() {
    var sel = document.getElementById('warehouse');
    var val = sel ? String(sel.value || '').trim() : '';
    if (!val) {
      currentWarehouse = null;
      retainedWarehouseId = '';
      clearBalance();
      return;
    }
    if (!warehouseById[val]) { currentWarehouse = null; retainedWarehouseId = ''; clearBalance('المخزن غير متاح'); return; }
    retainedWarehouseId = val;
    currentWarehouse = { id: val, location: resolveWarehouseLabel(val) };
    if (currentProduct) requestBalance(currentProduct.id, val, {});
  }

  function renderCountStep() {
    var el = document.getElementById('count-step');
    if (!el) return;
    /* Pre-filled from the product master (products.number_of_cartons_bags,
       delivered with get_stock_scan_options) but still editable — a physical
       count can disagree with the master. */
    var perUnitVal = (currentProduct && currentProduct.perUnit !== undefined && currentProduct.perUnit !== null)
      ? String(currentProduct.perUnit) : '';
    el.innerHTML =
      '<div class="scan-product-header">' +
        '<div class="name">' + esc(currentProduct.label) + '</div>' +
      '</div>' +
      '<form id="scan-form">' +
        UIC.field({ key: 'warehouse', label: 'المخزن', type: 'select', required: true, options: warehouses, placeholder: 'اختر المخزن...' }) +
        '<div id="scan-warehouse-status"></div>' +
        UIC.field({ key: 'container_type', label: 'نوع العبوات او الشكل الخارجي', type: 'select', required: true, options: CONTAINER_TYPES, placeholder: 'اختر نوع العبوة...' }) +
        UIC.field({ key: 'amount_per_unit', label: 'الكمية بالعبوة الواحدة او الشكل', type: 'number', step: '0.01', required: true, placeholder: 'مثال: 25', value: perUnitVal }) +
        '<div class="scan-calc-field">' +
          UIC.field({ key: 'unit_count', label: 'عدد العبوات او الشكل', type: 'number', step: '1', required: true, placeholder: 'مثال: 40' }) +
          '<button type="button" class="btn btn-outline scan-calc-trigger" aria-label="فتح حاسبة عدد العبوات او الشكل" title="الحاسبة" onclick="openScanCalculator(\'unit_count\')">⌗</button>' +
        '</div>' +
        '<div class="scan-calc-field">' +
          UIC.field({ key: 'loose_amount', label: 'الكمية الفرط', type: 'number', step: '0.01', value: '0', required: true }) +
          '<button type="button" class="btn btn-outline scan-calc-trigger" aria-label="فتح حاسبة الكمية الفرط" title="الحاسبة" onclick="openScanCalculator(\'loose_amount\')">⌗</button>' +
        '</div>' +
        '<div class="form-field" data-field="date">' +
          '<label class="form-label" for="date">التاريخ</label>' +
          '<input id="date" name="date" class="input scan-datetime" type="datetime-local" value="' + nowLocalDateTime() + '" readonly aria-readonly="true">' +
        '</div>' +
      '</form>' +
      '<div class="scan-total-row"><span>الكمية الإجمالية</span><span id="total-preview" class="val">0</span></div>' +
      '<div class="scan-actions">' +
        '<button type="button" class="btn btn-outline" onclick="cancelCount()">إلغاء</button>' +
        '<button type="button" class="btn btn-primary" onclick="goToConfirm()">تأكيد الكمية</button>' +
      '</div>';
    ['unit_count', 'amount_per_unit', 'loose_amount'].forEach(function (key) {
      var input = document.getElementById(key);
      if (input) input.addEventListener('input', updateTotalPreview);
    });
    var warehouseSel = document.getElementById('warehouse');
    if (warehouseSel) warehouseSel.addEventListener('change', onWarehouseChange);
    renderWarehouseState();
    updateTotalPreview();
    if (warehouseSel) setTimeout(function () { try { warehouseSel.focus(); } catch (e) {} }, 0);
  }

  function computeTotal() {
    var count = Number((document.getElementById('unit_count') || {}).value) || 0;
    var perUnit = Number((document.getElementById('amount_per_unit') || {}).value) || 0;
    var loose = Number((document.getElementById('loose_amount') || {}).value) || 0;
    return round2(count * perUnit + loose);
  }

  function updateTotalPreview() {
    var t = document.getElementById('total-preview');
    if (t) t.textContent = computeTotal();
  }

  function openScanCalculator(targetId) {
    var target = document.getElementById(targetId);
    if (!target || (targetId !== 'unit_count' && targetId !== 'loose_amount')) return;
    UIC.Calculator.open({
      target: target,
      title: 'الحاسبة — ' + (targetId === 'unit_count' ? 'عدد العبوات' : 'الكمية الفرط'),
      precision: targetId === 'unit_count' ? 0 : 2,
      integerOnly: targetId === 'unit_count',
      min: 0,
      onApply: function () { updateTotalPreview(); }
    });
  }

  function cancelCount() {
    currentProduct = null;
    currentWarehouse = null;
    clearBalance();
    pendingEntry = null;
    invalidateProductSearch();
    showStep('scan');
  }

  /* ── Optimistic single-record save ───────────────────────────────────────
     The submitted object is captured once. Nothing below reads the mutable
     count form, currentProduct or currentWarehouse after dispatch. */
  function diffText(amount, avail) {
    if (avail === '' || avail == null || isNaN(avail)) return '';
    var d = round2(Number(avail) - Number(amount));
    if (d === 0) return 'مظبوط';
    return d + '  ' + (Number(avail) > Number(amount) ? 'عجز' : 'زيادة');
  }

  function goToConfirm() {
    if (!UIC.validateForm('scan-form')) return;
    if (!currentProduct) { UIC.toast('اختر الصنف أولاً', 'error'); return; }
    if (!currentWarehouse) { UIC.toast('اختر المخزن أولاً', 'error'); return; }
    var data = UIC.collectForm('scan-form');
    if (String(data.warehouse || '').trim() !== String(currentWarehouse.id)) {
      onWarehouseChange();
      UIC.toast('تغير المخزن — جارٍ تحميل رصيده قبل التأكيد', 'error');
      return;
    }
    var total = computeTotal();
    if (!(total > 0)) {
      UIC.toast('الكمية الإجمالية يجب أن تكون أكبر من صفر', 'error');
      return;
    }
    if (!currentBalance || currentBalance.state !== 'ready' ||
        String(currentBalance.productId) !== String(currentProduct.id) ||
        String(currentBalance.warehouseId) !== String(currentWarehouse.id)) {
      UIC.toast('رصيد هذا الصنف والمخزن غير متاح — انتظر تحميله أو أعد المحاولة', 'error');
      requestBalance(currentProduct.id, currentWarehouse.id, { refresh: true });
      return;
    }
    var loose = Number(data.loose_amount) || 0;
    /* Every count detail the operator typed is recorded in notes, labelled and
       complete — including الكمية الفرط when it is zero. */
    var notes = 'نوع العبوة: ' + data.container_type +
      ' | الكمية بالعبوة: ' + data.amount_per_unit +
      ' | عدد العبوات: ' + data.unit_count +
      ' | الكمية الفرط: ' + loose +
      ' | الإجمالي: ' + total;
    var requestId = makeScanRequestId();
    var entry = {
      product: String(currentProduct.id),
      warehouse_id: String(currentWarehouse.id),
      warehouse_location: currentWarehouse.location,
      date: data.date,
      amount: total,
      available_amount: currentBalance.qty,
      balanceAt: currentBalance.at,
      notes: notes,
      unit_count: String(data.unit_count || ''),
      amount_per_unit: String(data.amount_per_unit || ''),
      loose_amount: String(data.loose_amount || ''),
      container_type: String(data.container_type || ''),
      __request_id: requestId,
      __scanKey: 'scan_' + requestId,
      product_name: currentProduct.label,
      name_ar: currentProduct.label,
      warehouse: String(currentWarehouse.id),
      __draftProductLabel: currentProduct.label,
      __draftWarehouseLabel: currentWarehouse.location
    };
    pendingEntry = entry;
    confirmSave(entry);
    pendingEntry = null;
    currentProduct = null;
    currentWarehouse = null;
    clearBalance();
    showStep('scan');
  }

  var submittedScanKeys = Object.create(null);
  function makeScanRequestId() {
    return ('scan' + Date.now().toString(36) + Math.random().toString(36).slice(2, 14)).replace(/[^A-Za-z0-9_-]/g, '').slice(0, 48);
  }
  function scanHistoryKey(row) {
    if (row && row.__scanKey) return String(row.__scanKey);
    if (row && row._sheetRow != null && row._sheetRow !== '') return 'row_' + String(row._sheetRow);
    return '';
  }
  function cloneScan(value) { return JSON.parse(JSON.stringify(value || {})); }
  function pendingScanRows() { return scanHistoryRows.filter(function (r) { return r && (r.__pending || r.__status === 'uncertain'); }); }
  function renderPendingScanRows() {
    var rows = pendingScanRows();
    if (!rows.length && !scanRejectedDrafts.length) return '';
    var html = '<div class="scan-pending-area" aria-live="polite"><h4>عمليات الحفظ الحالية</h4>';
    rows.forEach(function (r) {
      var uncertain = r.__status === 'uncertain';
      html += '<div class="scan-pending-row"><div><b>' + esc(r.product_name || ('#' + r.product)) + '</b> — ' + esc(r.__draftWarehouseLabel || resolveWarehouseLabel(r.warehouse)) +
        '<div class="scan-pending-detail">العبوات: ' + esc(r.unit_count) + ' · الفرط: ' + esc(r.loose_amount) + ' · الإجمالي: ' + esc(r.amount) + '</div></div>' +
        '<span class="badge-pending">' + (uncertain ? 'بانتظار التحقق' : 'جاري الحفظ…') + '</span></div>';
    });
    scanRejectedDrafts.forEach(function (r) {
      html += '<div class="scan-pending-row scan-rejected-row"><div><b>' + esc(r.draft.product_name) + '</b> — تعذر تسجيل الجرد</div>' +
        '<button type="button" class="btn btn-outline" onclick="reopenScanDraft(\'' + esc(r.draft.__scanKey) + '\')">مراجعة وإعادة الإدخال</button></div>';
    });
    return html + '</div>';
  }
  function confirmSave(entry) {
    if (!CAN_WRITE) { UIC.toast('غير مصرح بالحفظ', 'error'); return; }
    if (!entry || !entry.__scanKey || submittedScanKeys[entry.__scanKey]) return;
    submittedScanKeys[entry.__scanKey] = true;
    var payload = {
      product: entry.product, warehouse_id: entry.warehouse_id, warehouse_location: entry.warehouse_location,
      date: entry.date, amount: entry.amount, available_amount: entry.available_amount, notes: entry.notes,
      __request_id: entry.__request_id
    };
    var draft = cloneScan(entry);
    draft.__pending = true; draft.__status = 'pending'; draft.__scanKey = entry.__scanKey;
    UIC.Live.save({
      call: companyCall, action: 'add_stock_scan', data: payload,
      list: scanHistoryRows, key: '__scanKey', draft: draft, render: renderScanHistory,
      uid: '__request_id', queueable: true, message: 'تم تسجيل الجرد',
      recordOf: function (resp) {
        var rec = cloneScan(resp && resp.record ? resp.record : {});
        rec.__scanKey = entry.__scanKey; rec.__pending = false; rec.__status = 'confirmed';
        rec.product_name = rec.product_name || entry.product_name;
        rec.warehouse_location = rec.warehouse_location || entry.warehouse_location;
        rec.__draftProductLabel = entry.product_name; rec.__draftWarehouseLabel = entry.warehouse_location;
        return rec;
      },
      onSuccess: function () { renderScanHistory(); },
      onError: function (err) {
        var row = scanHistoryRows.filter(function (r) { return r.__scanKey === entry.__scanKey; })[0];
        if (err && (err.transport || err.uncertain)) {
          if (row) { row.__pending = true; row.__status = 'uncertain'; row.__error = err.message || ''; }
        } else {
          scanRejectedDrafts.unshift({ draft: draft, payload: payload, message: err && err.message || 'تعذر الحفظ' });
          if (scanRejectedDrafts.length > 5) scanRejectedDrafts.length = 5;
        }
        renderScanHistory();
      }
    }).catch(function () {});
  }
  function reopenScanDraft(key) {
    var at = -1, item;
    scanRejectedDrafts.forEach(function (r, i) { if (r.draft.__scanKey === key) { at = i; item = r; } });
    if (at < 0 || !item) return;
    scanRejectedDrafts.splice(at, 1);
    var d = item.draft;
    currentProduct = { id: String(d.product), label: String(d.product_name || d.name_ar || ('#' + d.product)), perUnit: d.amount_per_unit, code: null };
    retainedWarehouseId = String(d.warehouse_id || d.warehouse || '');
    currentWarehouse = warehouseById[retainedWarehouseId] ? { id: retainedWarehouseId, location: warehouseById[retainedWarehouseId].label } : null;
    showStep('count'); renderCountStep();
    ['container_type','amount_per_unit','unit_count','loose_amount'].forEach(function (field) { var e = document.getElementById(field); if (e) e.value = d[field] == null ? '' : d[field]; });
    var sel = document.getElementById('warehouse'); if (sel) { sel.value = retainedWarehouseId; onWarehouseChange(); }
    updateTotalPreview();
  }

  /* Another device's balance change arrives quietly: warehouses reload and the
     visible pair balance revalidates (the scan flow itself has no list to redraw). */
  UIC.Live.watchPage({
    call: companyCall,
    page: 'tc_stock_scan',
    onChange: function () { UIC.Live.arrive(function () {
      loadWarehouses(true);
      if (currentProduct && currentWarehouse) requestBalance(currentProduct.id, currentWarehouse.id, { refresh: true });
    }); }
  });

  load();
</script>
</body>
</html>
