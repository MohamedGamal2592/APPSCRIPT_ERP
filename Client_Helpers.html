<script>

/* [UI-1.1 / U-02] Guarantee the document direction on every page.
 *
 * Only 24 of the 85 page templates set dir="rtl" on their own <html> element.
 * The other 61 render left-to-right, so every component that positions itself
 * against the document direction — modals, toasts, spinners, the drawer, the
 * combo list, `margin-inline-*` on anything — comes out mirrored. The page
 * *content* still looked right because the text is Arabic and CSS_Tokens sets
 * `[dir="rtl"] body { text-align: right }`, which is why this survived so long.
 *
 * Client_Helpers is included by 82 of the 85 templates, in <head>, before any
 * paint, so one assignment fixes all of them. It is idempotent: the 24 pages
 * that already declare dir="rtl" are unaffected. No page in the tree declares
 * dir="ltr" (verified), so there is nothing to opt out.
 *
 * Expect this to REVEAL small layout bugs that the wrong direction was masking.
 * Those are listed, not silently fixed — they are budgeted as step 3.7.
 *
 * [i18n Stage B] The forced RTL is now the DEFAULT of a small gated
 * bootstrap. The preferred language lives in one validated erp_prefs key and
 * is read ONCE here, before paint, so the root lang/dir are right on the
 * first frame and a saved English choice cannot flash Arabic. With the
 * prototype gate off, only the Arabic default is applied — exactly the
 * direction guarantee this file always made. */
try {
  var __erpLangGate = /(?:^|[?&])langswitch=1(?:&|$)/.test(window.location.search) ||
    localStorage.getItem('erp_lang_test') === '1';
  var __erpLangPref = (JSON.parse(localStorage.getItem('erp_prefs') || '{}') || {}).language;
  var __erpLang = (__erpLangGate && __erpLangPref === 'en') ? 'en' : 'ar';
  document.documentElement.setAttribute('lang', __erpLang);
  document.documentElement.setAttribute('dir', __erpLang === 'en' ? 'ltr' : 'rtl');
} catch (e) { try { document.documentElement.setAttribute('dir', 'rtl'); } catch (e2) {} }

window.API = window.API || {};
window.FMT = window.FMT || {};
window.UI  = window.UI  || {};

/* ── [i18n Stage B] Shared language runtime (the gate governs behavior) ──
 *
 * Everything below is inert unless I18N.ENABLED is true: the header renders
 * no switch, bind() registers nothing, setLang() no-ops and the page stays on
 * the Arabic default. Enabled by ?langswitch=1 or erp_lang_test=1.
 *
 * Lookups are IN-MEMORY ONLY. There is no MutationObserver, no polling, no
 * timer and no document-wide text walker: a label node is registered once
 * with bind(), and setLang() rewrites just those nodes before notifying the
 * page adapters. t() never throws — a missing key is returned as-is and
 * counted in I18N._misses so coverage checks can list it. */
window.I18N = window.I18N || {};

(function (I18N) {
  I18N.ENABLED = window.__erpLangGate === true;
  I18N._misses = {};
  I18N._dict = {};
  I18N._pages = {};

  var current = window.__erpLang === 'en' ? 'en' : 'ar';
  var bindings = [];
  var subscribers = [];

  function entry_(key) {
    var e = I18N._dict[key];
    return (e && (e[current] != null || e.ar != null || e.en != null)) ? e : null;
  }

  function fill_(text, params) {
    if (params == null) return String(text);
    return String(text).replace(/\{(\w+)\}/g, function (m, name) {
      return params[name] != null ? String(params[name]) : m;
    });
  }

  function merge_(dict) {
    if (!dict) return;
    for (var k in dict) {
      if (Object.prototype.hasOwnProperty.call(dict, k)) I18N._dict[k] = dict[k];
    }
  }

  function isLive_(rec) {
    var el = rec.el;
    if (!el) return false;
    try { if (typeof el.isConnected === 'boolean') return el.isConnected; } catch (e) {}
    return true;   /* engines without isConnected are assumed live */
  }

  function applyRecord_(rec) {
    if (!rec.el) return;
    var value = I18N.t(rec.key);
    try {
      if (!rec.attr || rec.attr === 'text') rec.el.textContent = value;
      else rec.el.setAttribute(rec.attr, value);
    } catch (e) {}
  }

  /* Direct in-memory lookup with {name}/{0} substitution. A key with no target
     language falls back to Arabic — the app stays readable, never blank. */
  I18N.t = function (key, params) {
    var e = entry_(key);
    if (!e) {
      I18N._misses[key] = (I18N._misses[key] || 0) + 1;
      return key;
    }
    return fill_(e[current] != null ? e[current] : (e.ar != null ? e.ar : e.en), params);
  };

  I18N.lang = function () { return current; };

  I18N.registerCommon = function (dict) { merge_(dict); };

  I18N.registerPage = function (id, dict) {
    if (!id || !dict) return;
    I18N._pages[id] = dict;
    merge_(dict);
  };

  I18N.bind = function (el, key, attr) {
    if (!I18N.ENABLED || !el || !key) return null;
    var rec = { el: el, key: key, attr: attr || 'text' };
    bindings.push(rec);
    applyRecord_(rec);
    return rec;
  };

  I18N.apply = function () {
    if (!I18N.ENABLED) return;
    var live = [];
    for (var i = 0; i < bindings.length; i++) {
      if (!isLive_(bindings[i])) continue;   /* replaced node — drop the record */
      applyRecord_(bindings[i]);
      live.push(bindings[i]);
    }
    bindings = live;
  };

  I18N.onChange = function (fn) {
    if (typeof fn !== 'function') return function () {};
    subscribers.push(fn);
    return function () {
      var i = subscribers.indexOf(fn);
      if (i !== -1) subscribers.splice(i, 1);
    };
  };

  I18N.setLang = function (next) {
    if (!I18N.ENABLED) return;                       /* gate governs behavior */
    if (next !== 'ar' && next !== 'en') return;      /* validate only ar | en */
    if (next === current) return;                    /* already selected */
    current = next;
    try {
      var root = document.documentElement;
      root.setAttribute('lang', current);
      root.setAttribute('dir', current === 'en' ? 'ltr' : 'rtl');
    } catch (e) {}
    var sw = null;
    try { sw = document.querySelector('.lang-switch'); } catch (e) {}
    if (sw) sw.setAttribute('aria-checked', current === 'en' ? 'true' : 'false');
    I18N.apply();
    try { if (window.UIC && UIC.setPref) UIC.setPref('language', current); } catch (e) {}
    for (var i = 0; i < subscribers.length; i++) {
      try { subscribers[i](current); } catch (err) {}
    }
  };
})(window.I18N);

/* The labels shared by more than one page. Deliberately small — a page embeds
 * only its own catalog through I18N.registerPage. */
I18N.registerCommon({
  'common.loading':      { ar: 'جاري التحميل...', en: 'Loading...' },
  'common.edit':         { ar: 'تعديل', en: 'Edit' },
  'common.delete':       { ar: 'حذف', en: 'Delete' },
  'common.optional':     { ar: 'اختياري', en: 'Optional' },
  'common.typeToSearch': { ar: 'اكتب للبحث…', en: 'Type to search…' },
  'common.done':         { ar: 'تم', en: 'Done' },
  'common.failed':       { ar: 'فشل', en: 'Failed' },
  'common.error':        { ar: 'خطأ', en: 'Error' },
  'common.errorPrefix':  { ar: 'خطأ:', en: 'Error:' }
});

/* Code.js include() now evaluates included files as templates and passes
 * scriptUrl + sessionToken, so these tokens ARE evaluated here. NOTE: the
 * Apps Script template scriptlet context has no JSON global, so use a plain
 * force-print scriptlets — both values are strings (URL / token). */
window.SESSION_TOKEN = '__APP_SESSION_TOKEN__';

/* Surface any uncaught error as a visible banner instead of a silent blank page. */
window.addEventListener('error', function (e) {
  try {
    var b = document.getElementById('app-error-banner');
    if (!b) {
      b = document.createElement('div');
      b.id = 'app-error-banner';
      b.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#7f1d1d;color:#fff;font:13px/1.5 Segoe UI,Tahoma,Arial;padding:10px 14px;white-space:pre-wrap;direction:ltr;text-align:left;';
      (document.body || document.documentElement).appendChild(b);
    }
    b.textContent = 'JS Error: ' + (e.message || e.error || e) + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : '');
  } catch (err) {}
  try { if (window.UIC && UIC.reportError) UIC.reportError((e && e.message) || e, { stack: (e && e.error && e.error.stack) || '' }); } catch (er) {}
});

window.addEventListener('unhandledrejection', function (e) {
  try {
    if (window.UIC && UIC.reportError) UIC.reportError('Unhandled Promise Rejection: ' + ((e && e.reason && (e.reason.message || e.reason)) || e), { stack: (e && e.reason && e.reason.stack) || '' });
  } catch (er) {}
});

(function initVhPolyfill() {
  function setVh() {
    var vh = window.innerHeight * 0.01;
    document.documentElement.style.setProperty('--vh', vh + 'px');
  }
  setVh();
  window.addEventListener('resize', setVh, { passive: true });
  window.addEventListener('orientationchange', function () {

    setTimeout(setVh, 300);
  });
})();

(function initKeyboardDetection() {
  var vv = window.visualViewport;
  if (!vv) return;

  function onViewportChange() {
    var keyboardHeight = Math.max(0, window.innerHeight - vv.height);
    var isOpen = keyboardHeight > 150; // 150px threshold avoids false positives
    document.documentElement.style.setProperty('--keyboard-height', keyboardHeight + 'px');
    document.documentElement.classList.toggle('keyboard-open', isOpen);
  }

  vv.addEventListener('resize', onViewportChange, { passive: true });
  vv.addEventListener('scroll', onViewportChange, { passive: true });
})();

(function initInputAutoScroll() {
  document.addEventListener('focusin', function (e) {
    var el = e.target;
    if (!el || !['INPUT', 'TEXTAREA', 'SELECT'].includes(el.tagName)) return;
    setTimeout(function () {
      try {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      } catch (_) {
        el.scrollIntoView();
      }
    }, 350);
  }, { passive: true });
})();

/* [RT-4b] The last company this tab talked to.
 *
 * UIC.Live's retry queue has to survive a reload, and after a reload it has to
 * be able to REBUILD the request. Every page's companyCall is a closure over a
 * `target_system` literal, so the queue cannot see it and JSON.stringify cannot
 * carry it — which is exactly why a queued entry could never drain in a new
 * session. Recording it here costs one assignment and needs no page to change:
 * companyCall calls API.call synchronously, so by the time UIC.Live.save has
 * its promise back, this is already the target of that very call.
 *
 * Read-only from the outside. Nothing decides anything from it except the queue
 * entry it stamps at save time, and an entry with no stamp is not queued. */
/* A save keeps its request ID through transport failures, queue replays and
 * reloads in this tab. No payload contents or session tokens are persisted here.
 * A completed save is removed from the pending index, allowing a NEW form with
 * identical values to be a separate legitimate transaction.
 */
API._requestGuard = (function () {
  var STORAGE_KEY = 'erp_pending_write_requests_v1';
  var flights = Object.create(null), forms = Object.create(null);
  function canonical(value) {
    if (value === null || typeof value !== 'object') return JSON.stringify(value);
    if (Array.isArray(value)) return '[' + value.map(canonical).join(',') + ']';
    return '{' + Object.keys(value).sort().map(function (k) { return JSON.stringify(k) + ':' + canonical(value[k]); }).join(',') + '}';
  }
  function hash(text) {
    var a = 2166136261, b = 5381;
    for (var i = 0; i < text.length; i++) { a = Math.imul(a ^ text.charCodeAt(i), 16777619); b = Math.imul(b, 33) ^ text.charCodeAt(i); }
    return (a >>> 0).toString(16) + '_' + (b >>> 0).toString(16);
  }
  function read() {
    try {
      var value = JSON.parse(window.sessionStorage.getItem(STORAGE_KEY) || '{}');
      if (!value || typeof value !== 'object' || Array.isArray(value)) throw new Error('Invalid pending-request index');
      return value;
    } catch (e) { throw { status: 'error', code: 'REQUEST_STORAGE_UNAVAILABLE', message: 'تعذر حفظ رقم الطلب في المتصفح. فعّل تخزين الجلسة قبل الحفظ لتجنب التكرار.' }; }
  }
  function persist(value) {
    try { window.sessionStorage.setItem(STORAGE_KEY, JSON.stringify(value)); }
    catch (e) { throw { status: 'error', code: 'REQUEST_STORAGE_UNAVAILABLE', message: 'تعذر حفظ رقم الطلب؛ لم يُرسل الطلب. تحقق من مساحة تخزين المتصفح.' }; }
  }
  function id() {
    if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
    var values = new Uint32Array(4);
    if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(values);
    else for (var i = 0; i < values.length; i++) values[i] = Math.floor(Math.random() * 4294967296);
    return Array.prototype.map.call(values, function (v) { return ('00000000' + v.toString(16)).slice(-8); }).join('');
  }
  function formData(form, data) {
    if (!form || !data) return data;
    var stamp = hash(canonical(JSON.parse(JSON.stringify(data))));
    if (!form.__erpWriteIntent || form.__erpWriteIntent.stamp !== stamp) form.__erpWriteIntent = {stamp:stamp,id:id()};
    var formId = form.__erpWriteIntent.id;
    forms[formId] = form;
    Object.defineProperty(data, '__request_form_id', {value:formId,enumerable:false});
    return data;
  }
  function prepare(action, payload, sessionToken) {
    if (action !== 'company_action' || /^(get_|list_|prefetch_|preview_|search_|check_|validate_|export_|lookup_|ping$)/.test(String(payload.module_action || ''))) return null;
    var data = payload.data || (payload.data = {});
    if (!data || typeof data !== 'object' || Array.isArray(data)) throw { status:'error', message:'Invalid write payload' };
    var clean = JSON.parse(JSON.stringify(data)); delete clean.__request_id; delete clean.__request_owner;
    var session = API.getSession ? API.getSession() || {} : {};
    /* AUTH_USER_EMAIL is injected only after doGet has authenticated the page.
     * Prefer it over browser storage: on iPhone the Apps Script iframe can have
     * the valid URL session but no access to the login page's localStorage. */
    var who = String(window.AUTH_USER_EMAIL || (session.user && session.user.email) || session.email || '').trim().toLowerCase();
    if (!who) throw {status:'error',code:'REQUEST_LOGIN_REQUIRED',message:'أعد تسجيل الدخول لتثبيت هوية الطلب قبل الحفظ.'};
    if (data.__request_owner && data.__request_owner !== who) throw {status:'error',code:'REQUEST_OWNER_MISMATCH',uncertain:true,message:'هذا الطلب المؤجل يخص مستخدمًا آخر. سجّل الدخول بالحساب الأصلي لمراجعته.'};
    var signature = hash(JSON.stringify([who,payload.target_system,payload.module_action])) + ':' + hash(canonical(clean));
    var pending = read(), existing = pending[signature];
    var requestId = data.__request_id || (existing && existing.id) || data.__request_form_id || id();
    if (!/^[A-Za-z0-9_-]{16,100}$/.test(String(requestId))) throw {status:'error',message:'Invalid request ID'};
    var flightKey = signature + ':' + requestId;
    data.__request_id = requestId; data.__request_owner = who;
    try { if (window.UIC && UIC.Live && UIC.Live.markOwnRequest) UIC.Live.markOwnRequest(requestId); } catch (eLive) {}
    if (flights[flightKey]) return flights[flightKey];
    if (!existing && Object.keys(pending).length >= 500) throw {status:'error',message:'يوجد عدد كبير من الطلبات غير المؤكدة؛ راجعها مع المسؤول قبل إضافة طلبات أخرى.'};
    pending[signature] = {id:requestId}; persist(pending);
    var entry = {key:flightKey,signature:signature,id:requestId,formId:data.__request_form_id,promise:null};
    flights[flightKey] = entry;
    return entry;
  }
  function finish(entry, result, error) {
    if (!entry) return;
    delete flights[entry.key];
    // Even an auth rejection may follow an earlier attempt whose reply was lost.
    // The retained intent is released only when the server confirms success or
    // explicitly confirms that no mutation occurred (notApplied).
    if (error) return;
    if (result && result.notApplied === true) {
      try {
        var pending = read();
        if (pending[entry.signature] && pending[entry.signature].id === entry.id) { delete pending[entry.signature]; persist(pending); }
      } catch (e) { /* Keeping a receipt after success is safer than losing an uncertain one. */ }
      return;
    }
    if (entry.formId && forms[entry.formId]) {
      var form = forms[entry.formId];
      if (form.__erpWriteIntent && form.__erpWriteIntent.id === entry.formId) delete form.__erpWriteIntent;
      delete forms[entry.formId];
    }
    try {
      var pending = read();
      if (pending[entry.signature] && pending[entry.signature].id === entry.id) { delete pending[entry.signature]; persist(pending); }
    } catch (e) { /* Keeping a receipt after success is safer than losing an uncertain one. */ }
  }
  /* Bounded recovery poll after a lost response. Keeps the SAME request ID and
   * asks the server for its receipt state (request_status route — read-only,
   * never a mutation). Resolves {outcome:'done'|'failed', ...} when the server
   * proves an outcome, rejects {outcome:'unknown'|'review'} when the budget is
   * exhausted. Never mints a new ID, never advises a replacement request.
   * pollDelays is exposed so verify suites can shrink the backoff. */
  var RECOVER_POLL_MS_ = [700, 1300, 2500];
  function statusCall(meta, sessionToken) {
    return new Promise(function (resolve) {
      var settled = false;
      function done(v) { if (!settled) { settled = true; resolve(v); } }
      /* [Phase C] The recovery poll is required user-facing waiting, so the
         same probe records its queue/round trip and system-wait interval. */
      var probe = (window.PERF && PERF._probe) ? PERF._probe('request_status', {}) : null;
      try {
        if (probe) probe.sent();
        google.script.run
          .withSuccessHandler(function (r) { if (probe) probe.done(true); done({ ok: true, body: r }); })
          .withFailureHandler(function () { if (probe) probe.done(false); done({ ok: false }); })
          .apiRouter({ action: 'request_status',
            payload: { target_system: meta.target_system, module_action: meta.module_action, request_id: meta.requestId },
            sessionToken: sessionToken });
        /* A status poll that never answers is evidence of nothing; treat it
           as a missed round and let the next attempt run. */
        setTimeout(function () { if (probe) probe.done(false); done({ ok: false }); }, 10000);
      } catch (e) { if (probe) probe.done(false); done({ ok: false }); }
    });
  }
  function recoverAfterLoss(meta, sessionToken) {
    var delays = RECOVER_POLL_MS_;
    try {
      if (window.UIC && UIC.toast) UIC.toast('جاري التحقق من نتيجة الحفظ…', 'info');
    } catch (e) {}
    return new Promise(function (resolve, reject) {
      var attempt = 0;
      function next() {
        statusCall(meta, sessionToken).then(function (r) {
          var b = (r && r.ok && r.body) || null;
          var st = b && b.status;
          if (st === 'done' && b.result) { resolve({ outcome: 'done', result: b.result }); return; }
          if (st === 'failed' && b.error) { resolve({ outcome: 'failed', error: b.error }); return; }
          if (st === 'review_required') { reject({ outcome: 'review', requestId: meta.requestId }); return; }
          /* pending, unknown, or a lost poll round: keep checking inside the
             budget, then hand back an actionable uncertain outcome. */
          if (attempt < delays.length) {
            setTimeout(next, delays[attempt++]);
          } else {
            reject({ outcome: 'unknown', requestId: meta.requestId });
          }
        });
      }
      next();
    });
  }
  return {prepare:prepare,finish:finish,formData:formData,recoverAfterLoss:recoverAfterLoss,pollDelays:RECOVER_POLL_MS_};
})();

/* ── [Phase F] The API facade and the request coordinator (flag, default off) ─
 *
 * API.call is the entry point pages already use. With UIC.REQ_COORD_CORE_
 * false (the shipped default) it delegates straight to API._dispatch and the
 * behaviour is exactly today's — no queue, no lanes, no coalescing. When the
 * flag is on, the call is routed through the bounded priority queue in
 * API._coord and the existing dispatcher runs unchanged at dequeue time.
 *
 * API._dispatch is the original body, renamed only; `opts` is the additive
 * fourth argument used by the coordinator (never by existing callers, so
 * existing call sites are untouched). */
API._notifyCapabilityPickers = function (reason) {
  try {
    if (typeof window !== 'undefined' && window.UIC && UIC.TcCapabilityPicker && UIC.TcCapabilityPicker.invalidateAll) {
      UIC.TcCapabilityPicker.invalidateAll(reason);
    }
  } catch (e) {}
};
API.call = function (action, payload, sessionToken, opts) {
  if (API._mysqlReads) {
    API._mysqlReads.scope(sessionToken, payload && payload.target_system);
    if (API._mysqlReads.accepts(action, payload)) return API._mysqlReads.call(action, payload, sessionToken, opts);
    if (action === 'company_action' && payload && /^(add_|save_|update_|delete_|revise_|edit_|close_|make_collection|toggle_)/.test(payload.module_action || '')) {
      API._mysqlReads.clear();
      /* Conservatively expire instant-picker catalogs at the mutation boundary. */
      API._notifyCapabilityPickers('mutation');
    }
  }
  var coord = null;
  try { if (window.UIC && UIC.REQ_COORD_CORE_ === true) coord = API._coord || null; } catch (e) {}
  if (!coord) return API._dispatch(action, payload, sessionToken, opts);
  /* [Phase F] Queueing must not move synchronous target capture: UIC.Live.save
     reads API._lastTarget immediately after the page's companyCall returns, so
     the company of THIS call is recorded before it joins the queue. */
  if (payload && payload.target_system) API._lastTarget = payload.target_system;
  var laneOpts = opts || null;
  if (!laneOpts) {
    /* Reserved hint: UIC.Live tags its own poll for the background lane while
       the coordinator is on. Consumed and cleared synchronously. */
    try {
      if (window.UIC && UIC._rpcLaneHint) { laneOpts = UIC._rpcLaneHint; UIC._rpcLaneHint = null; }
    } catch (eHint) {}
  }
  return coord.submit(action, payload, sessionToken, laneOpts, API._dispatch);
};

/* Safe MySQL reads use the existing coordinator even when the general rollout
 * flag is off. Deduplication includes in-flight calls; the coordinator timeout
 * frees its local slot but cannot cancel an RPC already running on Apps Script. */
API._mysqlReads = (function () {
  var scopeKey = '', generation = 0, flights = {};
  var reads = ('get_system_qty get_stock_scan_qty get_stock_scan_options get_stock_scan_catalog get_stock_scan_balances get_system_product_options get_products_live ' +
    'get_main_review get_client_balance_sheets get_manufacture_headers get_manufacture_footers get_manufacture_refs ' +
    'get_production_capability_catalog get_sales_capacity_catalog ' +
    'get_box_analysis get_box_item_history get_box_alerts').split(' ');
  function clear() { generation++; flights = {}; }
  function scope(token, company) {
    var next = JSON.stringify([token || '', company || 'viewer']);
    if (next !== scopeKey) { scopeKey = next; clear(); }
  }
  function canonical(v, key) {
    if (Array.isArray(v)) {
      var a = v.map(function (x) { return canonical(x); });
      return ['years','months','product_ids','chart_of_accounts_list','ids'].indexOf(key) < 0 ? a : a.sort();
    }
    if (v && typeof v === 'object') {
      var out = {}; Object.keys(v).sort().forEach(function (k) { out[k] = canonical(v[k], k); }); return out;
    }
    return v;
  }
  function accepts(action, p) {
    return ['db_list_tables','db_get_columns','db_query','db_aggregate'].indexOf(action) >= 0 ||
      (action === 'company_action' && p && reads.indexOf(p.module_action) >= 0);
  }
  function call(action, payload, token, opts) {
    var p = JSON.parse(JSON.stringify(payload || {})), gen = generation;
    var key = JSON.stringify([scopeKey, action, canonical(p)]);
    if (flights[key]) return flights[key];
    var coordOpts = Object.assign({ lane: 'foreground' }, opts || {});
    /* A MySQL read that never calls back must not occupy a coordinator slot
       forever. The underlying RPC cannot be cancelled, but timing it out here
       frees the slot, releases this in-flight dedupe entry, and lets the page
       report the failure or retry. Writes never enter this read-only path. */
    coordOpts.timeoutMs = 30000;
    var request = API._coord.submit(action, p, token, coordOpts, API._dispatch);
    var promise = request.then(function (value) {
      if (gen !== generation) throw { code: 'MYSQL_SCOPE_CHANGED', message: 'Request scope changed' };
      return value;
    });

API._dispatch = function (action, payload, sessionToken, opts) {

  payload = payload || {};

     and call -> callback. PERF._probe returns null unless a sampled journey is
     open, so a closed measurement window costs two property reads.
     [Phase F] With the coordinator active the queue wait is recorded by
     API._coord through PERF.recordRpc at dispatch, so the probe is skipped
     here to keep one RPC from being counted twice. With the flag off `opts`
     is undefined and this is exactly the old expression. */

      reject(failure);

       before surfacing anything destructive. The red uncertain message is the
       last resort, and it carries the request ID plus a check-status flag so
       the UI can offer reconciliation instead of a replacement request. */
    function pollThenUncertain(fallbackMessage) {

         * retried. The response can be lost AFTER commit; reuse the original

/* ── [Phase F] API._coord — bounded request coordinator (default off) ───────
 *
 * Reachable ONLY when window.UIC.REQ_COORD_CORE_ === true, and only through
 * the facade above. It wraps the RPC dispatch inside API.call; the dispatcher
 * itself (API._dispatch) is unchanged.
 *
 * NO TIMER, OBSERVER OR POLLER is created here. The queue is pumped by two
 * events only — a new submission, and a settled call — so an idle queue costs
 * nothing. Already-dispatched calls cannot be cancelled; only entries still
 * waiting in the queue may be reordered, coalesced or dropped.
 *
 * LANES, highest priority first:
 *   foreground  user actions and authoritative checks — the default
 *   background  Live refresh (get_page_versions)
 *   prefetch    prefetch_refs and the like
 * The lane comes from opts.lane when a caller states one, otherwise from the
 * module_action, and an unrecognised action defaults to foreground: nothing
 * is demoted to a low lane by accident.
 *
 * BUDGET: 6 concurrent calls (deliberately below the simultaneous-execution
 * ceiling available to this app), with 2 of those slots reserved for
 * foreground work. Background and prefetch may therefore use at most 4 at
 * once, so a low-priority backlog can never occupy a slot a user action
 * needs. The whole queue is capped; prefetch has its own tighter cap and is
 * dropped outright while the tab is hidden — a prefetch is a bet on what the
 * user will do next, and a hidden tab is not doing anything next.
 *
 * COALESCING: ONLY pending entries whose caller explicitly passed
 * opts.coalesce === true, and only outside the foreground lane. Writes,
 * saves and approvals are never coalesced, and a call already on the wire is
 * never merged — it cannot be cancelled.
 *
 * BACKOFF: a transport or uncertain failure puts the LOW lanes on a jittered
 * exponential cooldown; foreground work is never held back by it. Because
 * there is no timer, an expired cooldown is observed at the next pump — and a
 * pump always follows a settle, so a queue with work in it is never stranded. */
API._coord = (function () {
  'use strict';

  var MAX_CONCURRENT = 6;            /* below the safe simultaneous-call budget */
  var FOREGROUND_RESERVE = 2;        /* slots low-priority work may never take */
  var MAX_PENDING = 24;              /* hard queue ceiling */
  var MAX_PREFETCH_PENDING = 8;      /* prefetch is a bet, never a backlog */
  var BACKOFF_BASE_MS = 8000;
  var BACKOFF_MAX_MS = 120000;

  var pending = [];
  var active = 0;
  var failures = 0;
  var backoffUntil = 0;

  var RANK = { foreground: 0, background: 1, prefetch: 2 };

  function laneFor(action, payload, opts) {
    var want = opts && opts.lane;
    if (want === 'foreground' || want === 'background' || want === 'prefetch') return want;
    var ma = String((payload && payload.module_action) || action || '');
    if (/^prefetch_/.test(ma)) return 'prefetch';
    if (ma === 'get_page_versions') return 'background';
    return 'foreground';
  }

  function hidden() {
    try { return document.visibilityState === 'hidden'; } catch (e) { return false; }
  }

  function rejectEntry(e, code, message) {
    e.reject({ status: 'error', code: code, transport: false, message: message });
  }

  function coalesceKey(e) {
    var body;
    try { body = JSON.stringify(e.payload === undefined ? null : e.payload); }
    catch (err) { return null; }         /* unstringifiable payloads never merge */
    return e.action + '\u0000' + body;
  }

  function oldestPrefetchIndex() {
    for (var i = 0; i < pending.length; i++) if (pending[i].lane === 'prefetch') return i;
    return -1;
  }

  function notePerf(e, end, ok) {
    try {
      if (!(window.PERF && PERF.recordRpc)) return;
      PERF.recordRpc({
        action: String((e.payload && e.payload.module_action) || e.action || ''),
        queueMs: Math.max(0, e.dispatchedAt - e.enqueuedAt),
        roundtripMs: Math.max(0, end - e.dispatchedAt),
        ok: ok !== false,
        blocking: e.lane === 'foreground'
      });
    } catch (err) {}
  }

  function noteFailure(ok, err) {
    if (ok) { failures = 0; backoffUntil = 0; return; }
    if (!(err && (err.transport === true || err.uncertain === true || err.code === 'REQUEST_UNCERTAIN'))) return;
    failures = Math.min(failures + 1, 6);
    var wait = Math.min(BACKOFF_BASE_MS * Math.pow(2, failures - 1), BACKOFF_MAX_MS);
    backoffUntil = Date.now() + Math.round(wait * (0.5 + Math.random() * 0.5));
  }

  function dispatch(e) {
    e.dispatchedAt = Date.now();
    active++;
    var settled = false;
    var timeout = null;
    var done = function (ok, value, err) {
      if (settled) return;
      settled = true;
      if (timeout) { clearTimeout(timeout); timeout = null; }
      var end = Date.now();
      active = Math.max(0, active - 1);
      notePerf(e, end, ok);
      noteFailure(ok, err);
      if (ok) e.resolve(value); else e.reject(err);
      pump();                              /* a slot just freed */
    };
    var p;
    try {
      p = e.dispatch(e.action, e.payload, e.sessionToken, { coord: true });
    } catch (errSync) { done(false, null, errSync); return; }
    if (e.timeoutMs > 0) {
      timeout = setTimeout(function () {
        done(false, null, {
          status: 'error', code: 'RPC_TIMEOUT', transport: true,
          message: 'انتهت مهلة انتظار استجابة الخادم لهذا الطلب.'
        });
      }, e.timeoutMs);
    }
    p.then(function (value) { done(true, value, null); },
           function (err) { done(false, null, err); });
  }

  function pump() {
    for (;;) {
      var pick = -1;
      for (var i = 0; i < pending.length; i++) {
        /* a hidden tab is not about to use anything prefetched */
        if (pending[i].lane === 'prefetch' && hidden()) {
          var gone = pending.splice(i, 1)[0];
          rejectEntry(gone, 'COORD_PREFETCH_HIDDEN', 'أُلغي التحميل المسبق أثناء إخفاء التبويب');
          i = -1;
          continue;
        }
        if (pick === -1 || RANK[pending[i].lane] < RANK[pending[pick].lane]) pick = i;
      }
      if (pick === -1) return;
      var e = pending[pick];
      var low = e.lane !== 'foreground';
      if (low) {
        /* reserve: low work stops two slots short of the ceiling */
        if (Date.now() < backoffUntil) return;
        if (active >= MAX_CONCURRENT - FOREGROUND_RESERVE) return;
      } else if (active >= MAX_CONCURRENT) {
        return;
      }
      pending.splice(pick, 1);
      dispatch(e);                         /* foreground keeps FIFO order */
    }
  }

  function submit(action, payload, sessionToken, opts, dispatcher) {
    var lane = laneFor(action, payload, opts);
    var e = {
      lane: lane,
      action: action,
      payload: payload,
      sessionToken: sessionToken,
      dispatch: dispatcher,
      enqueuedAt: Date.now(),
      dispatchedAt: 0,
      timeoutMs: Math.min(Math.max(Math.floor(Number(opts && opts.timeoutMs) || 0), 0), 120000),
      coalesceKey: null,
      resolve: null,
      reject: null,
      promise: null
    };
    e.promise = new Promise(function (resolve, reject) { e.resolve = resolve; e.reject = reject; });

    if (lane === 'prefetch' && hidden()) {
      rejectEntry(e, 'COORD_PREFETCH_HIDDEN', 'أُلغي التحميل المسبق أثناء إخفاء التبويب');
      return e.promise;
    }

    /* Coalesce only explicitly-marked equivalent safe reads, never writes:
       foreground entries are excluded because the foreground lane contains
       every save and approval. Only PENDING entries are considered; a call
       already on the wire cannot be cancelled. */
    if (lane !== 'foreground' && opts && opts.coalesce === true) {
      var key = coalesceKey(e);
      if (key) {
        for (var c = 0; c < pending.length; c++) {
          if (pending[c].lane === lane && pending[c].coalesceKey === key) return pending[c].promise;
        }
        e.coalesceKey = key;
      }
    }

    if (lane !== 'foreground') {
      var oldest = oldestPrefetchIndex();
      if (lane === 'prefetch') {
        var pf = 0;
        for (var p = 0; p < pending.length; p++) if (pending[p].lane === 'prefetch') pf++;
        if (pf >= MAX_PREFETCH_PENDING) {
          rejectEntry(e, 'COORD_QUEUE_FULL', 'تم رفض التحميل المسبق: طابور ممتلئ');
          return e.promise;
        }
      }
      if (pending.length >= MAX_PENDING) {
        if (oldest !== -1) {
          var victim = pending.splice(oldest, 1)[0];
          rejectEntry(victim, 'COORD_QUEUE_FULL', 'أُسقط أقدم تحميل مسبق: طابور ممتلئ');
        } else {
          rejectEntry(e, 'COORD_QUEUE_FULL', 'تعذر جدولة الطلب: طابور ممتلئ');
          return e.promise;
        }
      }
    }
    /* Foreground entries are never refused: a user action must reach the
       wire, even at the queue ceiling. */

    pending.push(e);
    pump();
    return e.promise;
  }

  return {
    submit: submit,
    _state: function () {
      return { pending: pending.length, active: active, failures: failures, backoffUntil: backoffUntil };
    }
  };
})();

/* F-18: xlsx.full.min.js is ~900 KB and was a top-level <script> here, so all 83
 * pages that include Client_Helpers paid for it on every navigation while only
 * the Excel-export button ever uses it. It is now fetched on first export.
 * Resolves immediately once loaded; concurrent callers share one request. */
API._xlsxPromise = null;

API.ensureXlsx = function () {
  if (typeof XLSX !== 'undefined') return Promise.resolve();
  if (API._xlsxPromise) return API._xlsxPromise;
  API._xlsxPromise = new Promise(function (resolve, reject) {
    var s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.async = true;
    s.onload = function () { resolve(); };
    s.onerror = function () {
      API._xlsxPromise = null;   // let a later click retry
      reject(new Error('تعذر تحميل مكتبة Excel'));
    };
    document.head.appendChild(s);
  });
  return API._xlsxPromise;
};

/* ── [UI-9.3 / U-37] Chart.js, fetched on demand ──────────────────────────
 *
 * Chart.js is a blocking <script> in the <head> of 5 dashboard and KPI pages,
 * so every visit to one of them waits for ~200 KB before the page can render —
 * including the visits where the user is only reading the KPI tiles.
 *
 * This is the same shape as API.ensureXlsx directly above, deliberately: one
 * lazy-loader pattern in this codebase rather than two. Concurrent callers
 * share one request, and a failure clears the promise so a later attempt can
 * retry rather than being stuck with a rejected one forever.
 */
API._chartPromise = null;

API.ensureChart = function () {
  if (typeof Chart !== 'undefined') return Promise.resolve();
  if (API._chartPromise) return API._chartPromise;
  API._chartPromise = new Promise(function (resolve, reject) {
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js';
    s.async = true;
    s.onload = function () {
      try { if (window.UIC && UIC.applyChartDefaults) UIC.applyChartDefaults(); } catch (e) {}
      resolve();
    };
    s.onerror = function () {
      API._chartPromise = null;   // let a later call retry
      reject(new Error('تعذر تحميل مكتبة الرسوم البيانية'));
    };
    document.head.appendChild(s);
  });
  return API._chartPromise;
};

API.downloadXlsx = function (base64, filename) {
  var bin = atob(base64);
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  var blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename || 'report.xlsx';
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);
};

API.getSession = function () {
  try {
    return JSON.parse(localStorage.getItem('erp_session') || 'null');
  } catch (e) {
    return null;
  }
};

API.setSession = function (s) {
  if (API._mysqlReads) API._mysqlReads.clear();
  API._notifyCapabilityPickers('session');
  localStorage.setItem('erp_session', JSON.stringify(s || null));
};

API.clearSession = function () {
  if (API._mysqlReads) API._mysqlReads.clear();
  API._notifyCapabilityPickers('session');
  localStorage.removeItem('erp_session');
};

/* ── [UI-3.4 / U-24] One loading overlay, one notification path ──────────
 *
 * UI.showSpinner is called from 80 pages, so the NAME and the SIGNATURE are a
 * public contract and do not change. The implementation moved: it is now a thin
 * wrapper over UIC.showPageLoading, which is the single loading service.
 *
 * The rotating-message behaviour is preserved — passing an array still cycles
 * the lines every 2.5 seconds — because several long saves rely on it. That
 * loop now lives in UIC._loadMessage rather than being duplicated here.
 *
 * The overlay's markup and CSS are the ones that used to live in this file:
 * they were the only ones of the four written against the token layer, so they
 * became the canonical look rather than the one that was hardest to theme. */
UI.showSpinner = function (message) {
  try { UIC.showPageLoading(message); } catch (e) {}
};

UI.hideSpinner = function () {

  /* [RT-3] A read that drew the progress hairline instead of the overlay is
   * finished by the same call, so no call site had to learn a second name. */

/* [UI-3.4] UI.toast and UI.alert did not exist, and that was a real defect —
 * found by tools/ui_check.js check C3 during the Phase 0 baseline and recorded
 * as N-01 and N-02 in UI_BASELINE.md.
 *
 *   N-01  Company_ValleyFoods_MfgOrderView.html calls UI.toast 40 times, every
 *         call guarded as `UI.toast && UI.toast(...)`. Nothing threw, and every
 *         success and error message on the manufacturing order page was
 *         silently discarded. A user saving a manufacturing order got no
 *         confirmation and no error text at all.
 *   N-02  DbLive_Viewer.html calls UI.alert 9 times, UNGUARDED, all on error
 *         paths — so the page threw `UI.alert is not a function` at exactly the
 *         moment it was trying to report a problem.
 *
 * Both are fixed additively: two new names on an existing namespace, delegating
 * to components that already exist. Nothing is renamed or removed. */
UI.toast = function (message, type) {
  try { UIC.toast(message, type); }
  catch (e) { try { console.warn('toast: ' + message); } catch (e2) {} }
};

/* [UI-5.2] Delegates to the styled UIC.alert rather than to a toast. Native
 * alert() required an acknowledgement, and the 9 DbLive_Viewer call sites are
 * all error reports — a toast that vanishes after three seconds can be missed
 * entirely, which is the failure the original code was trying to avoid.
 * Returns the promise so a caller can chain if it ever wants to. */
UI.alert = function (message) {
  try { return UIC.alert(message); }
  catch (e) {
    try { console.warn('alert: ' + message); } catch (e2) {}
    return Promise.resolve(true);
  }
};

/* Batch 10: guard a submit button against double-clicks / double-submits.
 * Disables the button until `fn` (which may return a Promise) settles.
 * Safe no-op if already in flight. Existing loading overlays still apply. */
UI.submitOnce = function (btn, fn) {
  if (!btn) { if (fn) fn(); return; }
  if (btn.dataset && btn.dataset.vfSubmitting === '1') return;
  if (btn.dataset) btn.dataset.vfSubmitting = '1';
  var prev = btn.disabled;
  btn.disabled = true;
  var done = function () { btn.disabled = prev; if (btn.dataset) btn.dataset.vfSubmitting = ''; };
  var p = fn ? fn() : undefined;
  if (p && typeof p.then === 'function') p.then(done, done); else done();
};

    '<button class="btn btn-ghost btn-danger" onclick="SESSION.logout()">تسجيل الخروج</button>';
  el.appendChild(bar);
};

/* Session-bar styles for explicit SESSION.renderBar(containerId) callers.
 * NOTE: جلساتي / عروضي / logout now live in the topbar user-profile dropdown
 * (UIC.appShell), so nothing is auto-injected into .topbar-nav anymore. */
(function initSessionBar() {
  SESSION.ensure();
  var css = document.createElement('style');
  css.textContent =
    '.session-bar{display:inline-flex;gap:6px;margin-inline-start:auto;align-items:center;flex-wrap:wrap;}' +
    '.btn-ghost{background:transparent;border:1px solid var(--border-color);border-radius:var(--radius-sm,8px);padding:6px 12px;font-size:13px;color:var(--text-muted);}' +
    '.btn-danger{color:#c5221f;border-color:#c5221f;}';
  document.head.appendChild(css);
})();

/* Email -> user display name (ERP_Users.name). window.USER_NAMES is injected
 * server-side on every page render. Falls back to the raw value. */
function uname_(email) {
  var e = String(email == null ? '' : email).trim();
  if (!e) return e;
  try {
    var map = window.USER_NAMES || {};
    return map[e.toLowerCase()] || map[e] || e;
  } catch (err) { return e; }
}

</script>
