<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>جرد المخزون</title>
  <?!= include('CSS_Tokens'); ?>
  <?!= include('UI_Components'); ?>
  <?!= include('Client_Helpers'); ?>
  <?!= include('Company_TopChemical_Nav'); ?>
  <?!= getCompanyThemeCSS_('3fe1b5cb67b7223e') ?>
</head>
<body>
<div id="tc-root" dir="rtl"></div>
<script>
  var params = new URLSearchParams(window.location.search);
  var SESSION_TOKEN = params.get('sessionToken') || (API.getSession() || {}).token || '';
  var scriptUrl = window.scriptUrl || '/';
  var IS_SUPER_ADMIN = <?!= user && user.isSuperAdmin ? 'true' : 'false' ?>;
  var COMPANY_LOGO_URL = '<?!= getCompanyLogoUrl_('3fe1b5cb67b7223e') ?>';
  var COMPANY_PAGES = <?!= companyPages ?>;
  var CURRENT_ACTION = '<?!= currentAction ?>';
  var USER_PAGES = <?!= user && user.isSuperAdmin ? 'null' : JSON.stringify((user && user.authorizedPages) || {}) ?>;
  var CAN_WRITE = UIC.canAdd_(); var CAN_FULL = UIC.canFull_();
  var WAREHOUSES = ['1', '2', '3', '4', '5', 'شبرا'];

  /* [live-notice D6] list replies from the device cache, trusted by the stamps */
  if (window.UIC && UIC.Live && UIC.Live.viewCache) companyCall = UIC.Live.viewCache(companyCall, { company: '3fe1b5cb67b7223e', page: 'tc_stock_revision', view: 'list', lists: ['get_stock_revision'] });
  function companyCall(moduleAction, data) {
    return API.call('company_action', {
      target_system: '3fe1b5cb67b7223e',
      module_action: moduleAction,
      data: data || {}
    }, SESSION_TOKEN);
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function todayStr() {
    var d = new Date();
    var p = function (n) { return ('0' + n).slice(-2); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  function fmtDate(v) {
    if (v == null || v === '') return '';
    var d = (v instanceof Date) ? v : new Date(v);
    if (isNaN(d.getTime())) return String(v);
    var p = function (n) { return ('0' + n).slice(-2); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  function load() {
    var contentId = 'stock-content';
    UIC.appShell('tc-root', {
      companyLogoUrl: COMPANY_LOGO_URL,
      companyLogoHref: scriptUrl + '?action=tc_dashboard&sessionToken=' + SESSION_TOKEN,
      companyLogoTitle: 'توب كيميكال',
      breadcrumb: 'توب كيميكال / الحسابات / جرد المخزون',
      contentId: contentId,
      menuGroups: (window.TOPCHEMICAL_MENU || [])
    });
    fetchStock();
  }

  /* Load the complete JSON dataset once. UIC.dataTable handles local search
     and pagination, matching tc_employee_status: the operator can find any
     historical revision without a second "عرض الكل" mode. */
  function fetchStock() {
    UI.showSpinner('جاري تحميل كل سجلات الجرد...');
    companyCall('get_stock_revision', { loadAll: true })
      .then(function (r) {
        window.__stock = r.stock || [];
        window.__productOptions = r.product_options || [];
        renderStock();
      })
      .catch(function (e) { showError(e); })
      .finally(function () { UI.hideSpinner(); try{schedulePrefetch();}catch(e){} });
  }

  /* ── رصيد السيستم: the default comes from the live database ──────────────
   *
   * The form asks for the system balance a physical count is judged against,
   * and it was typed from memory — a fact the system already holds. The MySQL
   * view product_current_quantity keys current_qty by the same product id the
   * المنتج field submits, so the two need no mapping between them.
   *
   * Fetched on its own rather than with the table: a JDBC connection is slower
   * than anything else this page does and no row in the list needs it — the map
   * is wanted only once a form is open. */
  var AVAIL_PLACEHOLDER = 'مثال: 160.00';
  var systemQtyPromise = null;

  function systemQty() {
    if (!systemQtyPromise) {
      systemQtyPromise = companyCall('get_system_qty')
        .then(function (r) {
          window.__systemQty = r.system_qty || {};
          return window.__systemQty;
        })
        .catch(function (e) {
          /* MySQL unreachable: the field stays hand-typed, exactly as before,
             and the next form to open retries instead of inheriting this. A
             wrong view or column name fails the same way, so say so somewhere
             rather than letting it look like an empty balance forever. */
          try { console.warn('get_system_qty: ' + ((e && e.message) || e)); } catch (e2) {}
          systemQtyPromise = null;
          return {};
        });
    }
    return systemQtyPromise;
  }

  /**
   * Fill رصيد السيستم for the product selected NOW.
   *
   * The balance describes the product, so a new product refills the field even
   * over a typed value — carrying the previous product's balance under a new
   * name is the mistake this is here to prevent. Re-confirming the SAME
   * product does not refill, so a deliberate correction survives; a product
   * the view does not carry clears the field for hand entry.
   */
  function fillSystemQty() {
    var prodEl = document.getElementById('product');
    var avEl = document.getElementById('available_amount');
    if (!prodEl || !avEl) return;
    var pid = String(prodEl.value || '').trim();
    if (!pid || avEl.getAttribute('data-filled-for') === pid) return;
    avEl.setAttribute('data-filled-for', pid);
    var apply = function (map) {
      /* The map can arrive after the form closed, or after another product was
         picked; write only into the field this call was made for. */
      var still = document.getElementById('product');
      var el = document.getElementById('available_amount');
      if (!still || !el || String(still.value || '').trim() !== pid) return;
      el.placeholder = AVAIL_PLACEHOLDER;
      var qty = map[pid];
      if (qty === undefined || qty === null) {
        el.value = '';
        el.removeAttribute('data-filled-for');   // nothing filled, so worth retrying
      } else {
        el.value = qty;
      }
    };
    if (window.__systemQty) { apply(window.__systemQty); return; }
    avEl.value = '';
    avEl.placeholder = 'جاري جلب رصيد السيستم...';
    systemQty().then(apply);
  }

  function parseDateVal(v) {
    if (v == null || v === '') return null;
    var d = (v instanceof Date) ? v : new Date(v);
    return isNaN(d.getTime()) ? null : d;
  }

  function fmtPct(v) {
    if (v == null || v === '') return '-';
    var n = Number(v);
    if (isNaN(n)) return esc(v);
    return (n * 100).toFixed(2) + '%';
  }

  function getFilteredStock() {
    var list = window.__stock || [];
    var fromEl = document.getElementById('filter-from');
    var toEl = document.getElementById('filter-to');
    if (!fromEl && !toEl) return list;
    var from = fromEl ? fromEl.value : '';
    var to = toEl ? toEl.value : '';
    if (!from && !to) return list;
    return list.filter(function (s) {
      var d = parseDateVal(s.date);
      if (!d) return false;
      var ds = fmtDate(d);
      if (from && ds < from) return false;
      if (to && ds > to) return false;
      return true;
    });
  }

  function renderStock() {
    var list = getFilteredStock();
    var rows = list.map(function (s) {
      var dateObj = parseDateVal(s.date);
      var dateNum = dateObj ? dateObj.getFullYear() * 10000 + (dateObj.getMonth() + 1) * 100 + dateObj.getDate() : 0;
      return {
        product: esc(s.product_name || ('#' + s.product)),
        name_ar: esc(s.name_ar || '-'),
        category: esc(s.category || '-'),
        unit: esc(s.unit || '-'),
        date: fmtDate(s.date),
        date_sort: dateNum,
        amount: s.amount,
        warehouse: esc(s.warehouse || '-'),
        available_amount: s.available_amount,
        difference: esc(s.difference || '-'),
        percentage: fmtPct(s.percentage),
        actions: UIC.actionBtns([
          { label: 'تعديل', onclick: 'openEdit(' + window.__stock.indexOf(s) + ')' },
          { label: 'عرض', onclick: 'openDetail(' + window.__stock.indexOf(s) + ')' }
        ])
      };
    });
    var headers = [
      { key: 'product', label: 'المنتج' },
      { key: 'name_ar', label: 'الاسم' },
      { key: 'category', label: 'الفئة' },
      { key: 'unit', label: 'الوحدة' },
      { key: 'date', label: 'التاريخ', numeric: true, sortKey: 'date_sort' },
      { key: 'amount', label: 'الكمية', numeric: true },
      { key: 'warehouse', label: 'المخزن', numeric: true },
      { key: 'available_amount', label: 'رصيد السيستم', numeric: true },
      { key: 'difference', label: 'الفرق' },
      { key: 'percentage', label: 'النسبة' },
      { key: 'actions', label: 'إجراءات' }
    ];
    var body = document.getElementById('stock-content');
    body.innerHTML = (CAN_WRITE
      ? '<div style="display:flex;justify-content:flex-end;margin-bottom:12px;"><button id="stock-add-btn" class="btn btn-primary" onclick="openAddModal()">+ إضافة جرد</button></div>'
      : '') +
      '<div style="margin:0 0 10px;color:var(--text-muted);font-size:13px;">إجمالي السجلات: ' + (window.__stock || []).length + ' — البحث يشمل جميع السجلات، والتنقل بين الصفحات للعرض فقط.</div>' +
      '<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;">' +
        '<label style="font-size:13px;">من:</label><input id="filter-from" type="date" class="input" style="width:150px;" value="' + esc((document.getElementById('filter-from') || {}).value || '') + '">' +
        '<label style="font-size:13px;">إلى:</label><input id="filter-to" type="date" class="input" style="width:150px;" value="' + esc((document.getElementById('filter-to') || {}).value || '') + '">' +
        '<button class="btn btn-outline" onclick="renderStock()">فلتر</button>' +
        '<button class="btn btn-outline" onclick="printFiltered()">طباعة</button>' +
      '</div>' +
      UIC.dataTable('stock-table', {
        title: 'جرد المخزون',
        headers: headers,
        rows: rows,
        /* The request always asks for the complete JSON dataset, so the
           in-memory search covers every revision returned by the sheet. */
        truncated: false,
        searchable: true,
        pageSize: 50,
        emptyText: 'لا توجد جرد'
      });
    UIC.initTableSort('stock-table');
    if (CAN_WRITE) UIC.prefetchOnIntent('stock-add-btn', 'tc_system_qty', systemQty);
  }

  function openAddModal() {
    var body =
      '<form id="stock-form">' +
      UIC.field({ key: 'product', label: 'المنتج', type: 'select', required: true,
        options: window.__productOptions || [], placeholder: 'اختر المنتج...' }) +
      UIC.field({ key: 'date', label: 'التاريخ', type: 'date', value: todayStr(), required: true }) +
      UIC.field({ key: 'amount', label: 'الكمية', type: 'number', step: '0.01', required: true, placeholder: 'مثال: 150.50' }) +
      UIC.field({ key: 'warehouse', label: 'المخزن', type: 'select', required: true,
        options: WAREHOUSES, placeholder: 'اختر المخزن...' }) +
      UIC.field({ key: 'available_amount', label: 'رصيد السيستم', type: 'number', step: '0.01', required: true, placeholder: AVAIL_PLACEHOLDER }) +
      UIC.field({ key: 'notes', label: 'ملاحظات', type: 'textarea' }) +
      '</form>';
    UIC.openModal('stock-modal', {
      title: 'إضافة جرد مخزون',
      body: body,
      onSave: 'saveStock()'
    });
    /* The combo writes the chosen id into the hidden #product input and fires
       `change` there (UIC.comboPick). Typing a name in full and tabbing away
       sets that value WITHOUT the event, so the display's blur is watched too;
       fillSystemQty ignores a product it has already filled for. */
    var prodEl = document.getElementById('product');
    if (prodEl) prodEl.addEventListener('change', fillSystemQty);
    var prodDisp = document.getElementById('product_display');
    if (prodDisp) prodDisp.addEventListener('blur', fillSystemQty);
    systemQty();
  }

  function saveStock() {
    var data = UIC.collectForm('stock-form');
    if (!UIC.validateForm('stock-form')) return;
    /* Tier B: the MySQL system balance plus the sheet guards can refuse for
       reasons invisible in the form — another device may have moved the stock
       first. So NO draft is painted: canPatch stays false, only the quiet
       corner hint shows, and the row is patched from the reply instead. A
       refusal toasts exactly as before and never paints a row. No validation
       is changed. queueable:false: I1 is unproven for add_stock_revision, so
       a transport failure rolls back loudly. */
    UIC.Live.save({
      call: companyCall,
      action: 'add_stock_revision',
      data: data,
      modal: 'stock-modal',
      message: 'تم الحفظ',
      queueable: false,
      reload: function () { fetchStock(); },
      onSuccess: function (r) {
        var rec = r.record || null;
        if (rec) {
          window.__stock = window.__stock || [];
          window.__stock.unshift(rec);
          renderStock();
        } else { fetchStock(); }
      }
    }).catch(function () { /* UIC.Live has toasted */ });
  }

  function openDetail(idx) {
    var s = window.__stock[idx];
    if (!s) return;
    var rows = [
      ['المنتج', s.product_name || ('#' + s.product)],
      ['الاسم', s.name_ar || '-'],
      ['الفئة', s.category || '-'],
      ['الوحدة', s.unit || '-'],
      ['التاريخ', fmtDate(s.date)],
      ['الكمية', s.amount],
      ['المخزن', s.warehouse || '-'],
      ['ملاحظات', s.notes || '-'],
      ['رصيد السيستم', s.available_amount],
      ['الفرق', s.difference || '-'],
      ['النسبة', s.percentage || '-'],
      ['أضيف بواسطة', uname_(s.user) || '-'],
      ['وقت الإضافة', s.created_at ? fmtDate(s.created_at) : '-']
    ];
    var body = rows.map(function (r) {
      return '<div class="form-field"><label class="form-label">' + esc(r[0]) + '</label>' +
        '<div style="padding:8px 12px;background:var(--bg-subtle);border-radius:var(--radius-sm);font-size:13px;">' + esc(r[1]) + '</div></div>';
    }).join('');
    UIC.openModal('stock-detail-modal', {
      title: 'تفاصيل الجرد',
      body: body,
      footer: false
    });
  }

  function openEdit(idx) {
    var s = window.__stock[idx];
    if (!s) return;
    var body =
      '<form id="stock-edit-form">' +
      '<input type="hidden" id="edit_sheetRow" value="' + (s._sheetRow || '') + '">' +
      '<input type="hidden" id="edit_expectedProduct" value="' + esc(s.product || '') + '">' +
      UIC.field({ key: 'edit_date', label: 'التاريخ', type: 'date', value: fmtDate(s.date), required: true }) +
      UIC.field({ key: 'edit_amount', label: 'الكمية', type: 'number', step: '0.01', value: s.amount, required: true }) +
      UIC.field({ key: 'edit_warehouse', label: 'المخزن', type: 'select', value: s.warehouse, required: true,
        options: WAREHOUSES, placeholder: 'اختر المخزن...' }) +
      UIC.field({ key: 'edit_available_amount', label: 'رصيد السيستم', type: 'number', step: '0.01', value: s.available_amount, required: true }) +
      UIC.field({ key: 'edit_notes', label: 'ملاحظات', type: 'textarea', value: s.notes || '' }) +
      '</form>';
    UIC.openModal('stock-edit-modal', {
      title: 'تعديل جرد المخزون — ' + esc(s.product_name || ''),
      body: body,
      onSave: 'saveEdit()'
    });
  }

  function saveEdit() {
    if (!CAN_WRITE) { UIC.toast('غير مصرح', 'error'); return; }
    var data = UIC.collectForm('stock-edit-form');
    if (!UIC.validateForm('stock-edit-form')) return;
    var payload = {
      _sheetRow: Number(data.edit_sheetRow),
      _expectedProduct: Number(data.edit_expectedProduct),
      date: data.edit_date,
      amount: data.edit_amount,
      warehouse: data.edit_warehouse,
      available_amount: data.edit_available_amount,
      notes: data.edit_notes
    };
    /* Tier B edit: the row-precondition guard (_expectedProduct vs the live
       sheet row) can refuse for reasons invisible in the form — another
       device may have rewritten the row first. So NO draft is painted:
       canPatch stays false, only the quiet corner hint shows, and the row is
       patched from intent instead (the handler returns a message only). A
       refusal toasts exactly as before and never paints. No validation is
       changed. queueable:false: a stale precondition makes a later replay
       meaningless (I3), so a transport failure rolls back loudly. */
    UIC.Live.save({
      call: companyCall,
      action: 'update_stock_revision',
      data: payload,
      modal: 'stock-edit-modal',
      message: 'تم التحديث',
      queueable: false,
      reload: function () { fetchStock(); },
      onSuccess: function () {
        var list = window.__stock || [];
        var row = null;
        for (var i = 0; i < list.length; i++) {
          if (Number(list[i]._sheetRow) === Number(payload._sheetRow)) { row = list[i]; break; }
        }
        if (row) {
          row.date = payload.date;
          row.amount = payload.amount;
          row.warehouse = payload.warehouse;
          row.available_amount = payload.available_amount;
          row.notes = payload.notes;
          renderStock();
        } else { fetchStock(); }
      }
    }).catch(function () { /* UIC.Live has toasted */ });
  }

  function printFiltered() {
    var list = getFilteredStock();
    var fromEl = document.getElementById('filter-from');
    var toEl = document.getElementById('filter-to');
    var from = fromEl ? fromEl.value : '';
    var to = toEl ? toEl.value : '';
    var dateLabel = (from && to) ? 'من ' + from + ' إلى ' + to : from ? 'من ' + from : to ? 'إلى ' + to : 'الكل';
    var rowsHtml = list.map(function (s) {
      return '<tr>' +
        '<td>' + esc(s.product_name || ('#' + s.product)) + '</td>' +
        '<td>' + esc(s.name_ar || '-') + '</td>' +
        '<td>' + esc(s.category || '-') + '</td>' +
        '<td>' + esc(s.unit || '-') + '</td>' +
        '<td>' + fmtDate(s.date) + '</td>' +
        '<td>' + (s.amount || '') + '</td>' +
        '<td>' + esc(s.warehouse || '-') + '</td>' +
        '<td>' + (s.available_amount || '') + '</td>' +
        '<td>' + esc(s.difference || '-') + '</td>' +
        '<td>' + fmtPct(s.percentage) + '</td>' +
        '</tr>';
    }).join('');
    /* [iPhone run 2] Was window.open + document.write, which ended at the
       null check above on iOS. Same call, same document — see UIC.printDoc. */
    UIC.printDoc(
      '<!DOCTYPE html><html lang="ar"><head><meta charset="utf-8"><title>طباعة جرد المخزون</title>' +
      '<style>body{font-family:Cairo,sans-serif;direction:rtl;padding:20px;}' +
      'h2{text-align:center;margin-bottom:4px;} .date-info{text-align:center;color:var(--text-muted, #666);margin-bottom:16px;}' +
      'table{width:100%;border-collapse:collapse;font-size:12px;} th,td{border:1px solid #ccc;padding:6px 8px;text-align:right;}' +
      'th{background:var(--bg-subtle, #f0f0f0);font-weight:700;} @media print{body{padding:0;}}</style></head><body>' +
      '<h2>جرد المخزون</h2>' +
      '<div class="date-info">التاريخ: ' + esc(dateLabel) + ' — العدد: ' + list.length + '</div>' +
      '<table><thead><tr>' +
      '<th>المنتج</th><th>الاسم</th><th>الفئة</th><th>الوحدة</th><th>التاريخ</th><th>الكمية</th><th>المخزن</th><th>رصيد السيستم</th><th>الفرق</th><th>النسبة</th>' +
      '</tr></thead><tbody>' + rowsHtml + '</tbody></table>' +
      '</body></html>',
      'جرد المخزون',
      { then: function (w) { w.print(); } }
    );
  }

  function showError(e) {
    var body = document.getElementById('stock-content');
    if (body) body.innerHTML = '<div class="empty-state"><span>' + esc(e.message || 'خطأ') + '</span></div>';
  }

  /* Another device's change arrives quietly. The refresh stays on the same
     complete-data path, and arrive() still defers while a save is pending
     (B4 userIsBusy). */
  UIC.Live.watchPage({
    call: companyCall,
    page: 'tc_stock_revision',
    onChange: function () { UIC.Live.arrive(function () { fetchStock(); }); }
  });
  /* [live-notice] the view on screen */
  if (UIC.Live.setView) UIC.Live.setView('list', { refresh: function () { fetchStock(); } });


  load();
</script>
</body>
</html>
