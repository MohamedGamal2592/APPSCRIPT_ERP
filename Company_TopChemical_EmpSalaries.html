<!DOCTYPE html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>صرف المرتبات الشهرية</title>
  <?!= include('CSS_Tokens'); ?>
  <?!= include('UI_Components'); ?>
  <?!= include('Client_Helpers'); ?>
  <?!= include('Company_TopChemical_Nav'); ?>
  <?!= getCompanyThemeCSS_('3fe1b5cb67b7223e') ?>
  <style>
    .salary-report-loading { padding:42px 16px; text-align:center; color:var(--text-muted); }

    #salary-comparison-modal .modal-body { padding-inline:18px; }
    #salary-compare-table_table { min-width:1720px; }

      .salary-report-summary { grid-template-columns:1fr; }
      #salary-comparison-modal .modal { width:100%; max-width:none; }
      #salary-comparison-modal .modal-body { padding-inline:12px; }
    }
  </style>
</head>
<body>
<div id="tc-root" dir="rtl"></div>
<script>
  var params = new URLSearchParams(window.location.search);
  var SESSION_TOKEN = params.get('sessionToken') || (API.getSession() || {}).token || '';
  var scriptUrl = window.scriptUrl || '/';
  var IS_SUPER_ADMIN = <?!= user && user.isSuperAdmin ? 'true' : 'false' ?>;
  var COMPANY_LOGO_URL = '<?!= getCompanyLogoUrl_("3fe1b5cb67b7223e") ?>';
  var COMPANY_PAGES = <?!= companyPages ?>;
  var CURRENT_ACTION = '<?!= currentAction ?>';
  var USER_PAGES = <?!= user && user.isSuperAdmin ? 'null' : JSON.stringify((user && user.authorizedPages) || {}) ?>;
  var CAN_WRITE = UIC.canAdd_(); var CAN_FULL = UIC.canFull_();
  var FILTER_MONTH = '';
  var FILTER_YEAR = '';
  /* [PERF-11] client pager state: 50 rows per page, nav below the table. */
  var SAL_PAGE = 1;
  var SAL_PAGE_SIZE = 50;

  /* [live-notice D6] list replies from the device cache, trusted by the stamps */
  if (window.UIC && UIC.Live && UIC.Live.viewCache) companyCall = UIC.Live.viewCache(companyCall, { company: '3fe1b5cb67b7223e', page: 'tc_emp_salaries', view: 'list', lists: ['get_emp_salaries', 'get_emp_salary_comparison'] });
  function companyCall(a, d) {
    return API.call('company_action', { target_system: '3fe1b5cb67b7223e', module_action: a, data: d || {} }, SESSION_TOKEN);
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function load() {
    UIC.appShell('tc-root', {
      companyLogoUrl: COMPANY_LOGO_URL,
      companyLogoHref: scriptUrl + '?action=tc_dashboard&sessionToken=' + SESSION_TOKEN,
      companyLogoTitle: 'توب كيميكال',
      breadcrumb: 'توب كيميكال / شئون العاملين / صرف المرتبات الشهرية',
      contentId: 'sal-content',
      menuGroups: (window.TOPCHEMICAL_MENU || [])
    });
    fetchSalaries();
  }

  function fetchSalaries(month, year, quiet) {
    if (!quiet) UI.showSpinner(['جاري تحميل المرتبات...', 'جاري استرجاع بيانات الشهر...', 'لحظة، جاري إعداد الجدول...']);
    var data = { loadAll: true };
    if (month) data.month = Number(month);
    if (year) data.year = Number(year);
    companyCall('get_emp_salaries', data)
      .then(function (r) {
        window.__salaries        = r.salaries || [];
        window.__total           = r.total || 0;
        window.__existingIds     = r.existing_emp_ids || [];
        window.__months          = r.months || [];
        window.__monthOptions   = r.month_options || [];
        window.__empOptions      = r.employee_options || [];
        window.__closedMonths    = r.closed_months || {};
        window.__activeEmployees = r.active_employees || [];
        SAL_PAGE = 1;
        renderFilterBar();
        renderSalaries();
      })
      .catch(function (e) { showError(e); })
      .finally(function () { if (!quiet) UI.hideSpinner(); try{schedulePrefetch();}catch(e){} });
  }

  function renderFilterBar() {
    var yr = [];
    window.__months.forEach(function (m) { if (yr.indexOf(String(m.year)) === -1) yr.push(String(m.year)); });
    yr = yr.sort(function (a, b) { return Number(b) - Number(a); });
    var ySel = '<option value="">كل السنوات</option>';
    yr.forEach(function (y) { ySel += '<option value="' + y + '"' + (String(FILTER_YEAR) === y ? ' selected' : '') + '>' + y + '</option>'; });
    var mSel = '<option value="">كل الأشهر</option>';
    window.__monthOptions.forEach(function (m) { mSel += '<option value="' + m.value + '"' + (String(FILTER_MONTH) === String(m.value) ? ' selected' : '') + '>' + esc(m.label) + '</option>'; });
    var html =
      '<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px;">' +
      '<div class="form-field" style="min-width:140px;"><label class="form-label">السنة</label><select id="sal-year" class="input">' + ySel + '</select></div>' +
      '<div class="form-field" style="min-width:140px;"><label class="form-label">الشهر</label><select id="sal-month" class="input">' + mSel + '</select></div>' +
      '<button class="btn btn-outline" onclick="applyFilter()">عرض</button>' +
      (CAN_WRITE ? '<button class="btn btn-primary" onclick="openGenerate()">+ توليد شهر</button>' : '') +
      '<button class="btn btn-outline" onclick="openSalaryComparisonReport()">📊 مقارنة بالشهر السابق</button>' +
      '<button class="btn btn-outline" onclick="printPayrollReport(\'cards\')">🖨️ كشف الكروت</button>' +
      '<button class="btn btn-outline" onclick="printPayrollReport(\'sections\')">🖨️ كشف الأقسام</button>' +
      '</div>';
    document.getElementById('sal-content').innerHTML = html + '<div id="sal-table-wrap"></div>';
  }

  function applyFilter() {
    FILTER_YEAR = document.getElementById('sal-year').value;
    FILTER_MONTH = document.getElementById('sal-month').value;
    fetchSalaries(FILTER_MONTH, FILTER_YEAR);
  }

  function rowKey(r) { return 'emp' + r.emp_id + '_' + r.month + '_' + r.year; }

  function renderSalaries() {
    var wrap = document.getElementById('sal-table-wrap');
    if (!wrap) return;
    var cols = CAN_WRITE ? 12 : 11;
    var totalBar = window.__total ? '<div style="text-align:left;margin-bottom:8px;font-size:14px;color:var(--text-muted);">إجمالي الصافي: <b>' + FMT.currency(window.__total) + '</b></div>' : '';
    var thead = '<thead><tr><th>الكود</th><th>الاسم</th><th>الراتب</th><th>البدلات</th><th>التصنيف</th><th>أيام</th><th>خصم غياب</th><th>إضافي</th><th>صافي</th><th>تقريب</th><th>إيصال</th>' + (CAN_WRITE ? '<th>إجراءات</th>' : '') + '</tr></thead>';
    /* [PERF-11] page slice: render current 50-row window only. */
    var all = window.__salaries || [];
    var totalPages = Math.max(1, Math.ceil(all.length / SAL_PAGE_SIZE));
    if (SAL_PAGE > totalPages) SAL_PAGE = totalPages;
    if (SAL_PAGE < 1) SAL_PAGE = 1;
    var pageRows = all.slice((SAL_PAGE - 1) * SAL_PAGE_SIZE, SAL_PAGE * SAL_PAGE_SIZE);
    var tbody = '<tbody>';
    if (!all.length) {
      tbody += '<tr><td colspan="' + cols + '" style="text-align:center;padding:32px;color:var(--text-muted);">لا توجد مرتبات لهذا الشهر</td></tr>';
    } else {
      pageRows.forEach(function (r) {
        var key = rowKey(r); window['__sal_' + key] = r;
        var isClosed = !!(window.__closedMonths && window.__closedMonths[r.year + '-' + r.month]);
        var badge = r.receipt ? '<span style="color:var(--success,#22c55e);font-weight:600;">✔ نعم</span>' : '<span style="color:var(--text-muted);">لا</span>';
        var act = '';
        if (CAN_WRITE) {
          act = '<td style="white-space:nowrap;">';
          if (isClosed) {
            act += '<span style="display:inline-block;padding:2px 8px;font-size:11px;background:var(--bg-subtle,#e2e8f0);color:var(--text-muted);border-radius:4px;" title="الشهر مغلق">🔒 مغلق</span>';
          } else {
            // Normal system users with CAN_WRITE are allowed to edit working_days, year, month
            act += '<button class="btn btn-outline" style="padding:2px 8px;font-size:12px;margin-inline-end:4px;" onclick="openEditSalary(\'' + key + '\')" title="تعديل أيام العمل والتواريخ">✏️ تعديل</button>';
            if (UIC.canFull_()) {
              act += '<button class="btn" style="padding:2px 8px;font-size:12px;background:var(--danger,var(--danger, #ef4444));color:#fff;margin-inline-end:4px;" onclick="confirmDeleteSalary(\'' + key + '\')" title="حذف">🗑</button>';
            }
            if (!r.receipt) {
              act += '<button class="btn btn-outline" style="padding:2px 8px;font-size:12px;color:var(--success,#22c55e);" onclick="markReceipt(\'' + key + '\')" title="تسجيل استلام">✔ استلم</button>';
            }
          }
          act += '</td>';
        }
        tbody += '<tr id="sal-row-' + key + '"><td>' + esc(r.emp_id) + '</td><td>' + esc(r.name_ar || '-') + '</td><td>' + FMT.number(r.basic_salary) + '</td><td>' + FMT.number(r.allow) + '</td><td>' + esc(r.section || '-') + '</td><td>' + esc(r.working_days) + '</td><td>' + esc(r.deduction_day) + '</td><td>' + esc(r.overtime_days) + '</td><td>' + FMT.number(r.net_salary) + '</td><td>' + FMT.number(r.net_salary_nearest) + '</td><td id="receipt-' + key + '">' + badge + '</td>' + act + '</tr>';
      });
    }
    tbody += '</tbody>';
    wrap.innerHTML = totalBar + '<div class="table-wrap"><table id="sal-table" class="table" style="min-width:900px;">' + thead + tbody + '</table></div>' + salPagerHtml(all.length, totalPages);
    UIC.autoColumns('sal-table');
    salInitSort();
  }

  /* [PERF-11] pager bar below the table + full-dataset sort (search → sort → slice). */
  function salGoto(p) {
    var totalPages = Math.max(1, Math.ceil(((window.__salaries || []).length) / SAL_PAGE_SIZE));
    SAL_PAGE = Math.min(Math.max(1, Number(p) || 1), totalPages);
    renderSalaries();
  }

  function salPagerHtml(total, totalPages) {
    if (totalPages <= 1) {
      return '<div style="padding:8px 4px;font-size:13px;color:var(--text-muted);">العدد: ' + total + '</div>';
    }
    var pg = SAL_PAGE;
    var btn = function (label, target, disabled, primary) {
      return '<button type="button" class="btn ' + (primary ? 'btn-primary' : 'btn-outline') + '"' +
        ' style="padding:4px 10px;min-width:0;"' +
        (disabled ? ' disabled' : ' onclick="salGoto(' + target + ')"') + '>' + label + '</button>';
    };
    var pages = [];
    var push = function (p) { if (pages.indexOf(p) === -1) pages.push(p); };
    if (totalPages <= 7) {
      for (var i = 1; i <= totalPages; i++) push(i);
    } else {
      push(1);
      if (pg > 3) pages.push('…');
      for (var k = Math.max(2, pg - 1); k <= Math.min(totalPages - 1, pg + 1); k++) push(k);
      if (pg < totalPages - 2) pages.push('…');
      push(totalPages);
    }
    var nums = pages.map(function (p) {
      return (p === '…') ? '<span style="padding:0 4px;color:var(--text-muted);">…</span>' : btn(p, p, false, p === pg);
    }).join('');
    var from = (pg - 1) * SAL_PAGE_SIZE + 1;
    var to = Math.min(pg * SAL_PAGE_SIZE, total);
    return '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;padding:10px 4px 2px;">' +
      btn('الأولى', 1, pg === 1) + btn('السابق', pg - 1, pg === 1) + nums +
      btn('التالي', pg + 1, pg === totalPages) + btn('الأخيرة', totalPages, pg === totalPages) +
      '<span style="font-size:13px;color:var(--text-muted);margin-inline-start:8px;">عرض ' + from + ' – ' + to + ' من ' + total + ' سجل</span></div>';
  }

  /* Sort the FULL salary dataset (not just the visible page), then re-slice page 1. */
  function salCellValue(r, ci) {
    switch (ci) {
      case 0: return r.emp_id;
      case 1: return r.name_ar || '';
      case 2: return r.basic_salary;
      case 3: return r.allow;
      case 4: return r.section || '';
      case 5: return r.working_days;
      case 6: return r.deduction_day;
      case 7: return r.overtime_days;
      case 8: return r.net_salary;
      case 9: return r.net_salary_nearest;
      case 10: return r.receipt ? 'نعم' : 'لا';
      default: return '';
    }
  }

  function salInitSort() {
    var tbl = document.getElementById('sal-table');
    if (!tbl) return;
    tbl.querySelectorAll('thead th').forEach(function (th, ci) {
      th.style.cursor = 'pointer';
      th.title = 'اضغط للترتيب';
      th.addEventListener('click', function () {
        var asc = th.getAttribute('data-asc') !== 'true';
        tbl.querySelectorAll('thead th').forEach(function (x) { if (x !== th) x.removeAttribute('data-asc'); });
        var list = window.__salaries || [];
        var decorated = list.map(function (r) {
          var v = salCellValue(r, ci);
          var s = (v == null) ? '' : String(v);
          var n = parseFloat(s.replace(/,/g, ''));
          return { r: r, s: s, n: n, isNum: !isNaN(n) && s.trim() !== '' };
        });
        decorated.sort(function (a, b) {
          if (a.isNum && b.isNum) return asc ? a.n - b.n : b.n - a.n;
          return asc ? a.s.localeCompare(b.s, 'ar') : b.s.localeCompare(a.s, 'ar');
        });
        for (var i = 0; i < decorated.length; i++) list[i] = decorated[i].r;
        SAL_PAGE = 1;
        renderSalaries();
        var nt = document.querySelector('#sal-table thead th:nth-child(' + (ci + 1) + ')');
        if (nt) nt.setAttribute('data-asc', String(asc));
      });
    });
  }

  /* ────────── Edit salary modal ────────── */
  function openEditSalary(key) {
    var r = window['__sal_' + key];
    if (!r) return;
    var isClosed = !!(window.__closedMonths && window.__closedMonths[r.year + '-' + r.month]);
    if (isClosed) {
      UIC.toast('لا يمكن تعديل راتب شهر مغلق', 'error');
      return;
    }
    var mOpts = '';
    (window.__monthOptions || []).forEach(function (mo) {
      mOpts += '<option value="' + mo.value + '"' + (Number(mo.value) === Number(r.month) ? ' selected' : '') + '>' + esc(mo.label) + '</option>';
    });

    UIC.openModal('edit-sal-modal', {
      title: 'تعديل راتب الموظف: ' + esc(r.name_ar || ('#' + r.emp_id)),
      body:
        '<form id="edit-sal-form">' +
        '<p style="font-size:12px;color:var(--text-muted);margin-bottom:12px;">مسموح فقط بتعديل أيام العمل والشهر والسنة (باقي الأعمدة معادلات حية محميّة).</p>' +
        '<div class="form-field" style="margin-bottom:10px;"><label class="form-label">أيام العمل <span class="req">*</span></label>' +
        '<input id="es_wd" class="input" type="number" min="0" max="31" step="0.5" value="' + esc(r.working_days) + '" required></div>' +
        '<div style="display:flex;gap:10px;">' +
        '<div class="form-field" style="flex:1;"><label class="form-label">الشهر <span class="req">*</span></label>' +
        '<select id="es_month" class="input">' + mOpts + '</select></div>' +
        '<div class="form-field" style="flex:1;"><label class="form-label">السنة <span class="req">*</span></label>' +
        '<input id="es_year" class="input" type="number" min="2000" max="2100" value="' + esc(r.year) + '" required></div>' +
        '</div>' +
        '</form>',
      onSave: 'saveEditSalary(\'' + key + '\')'
    });
  }

  function saveEditSalary(key) {
    var r = window['__sal_' + key];
    if (!r) return;
    var wd = document.getElementById('es_wd').value;
    var m  = document.getElementById('es_month').value;
    var y  = document.getElementById('es_year').value;
    if (!wd || !m || !y) { UIC.toast('جميع الحقول مطلوبة', 'error'); return; }

    /* Tier B: the closed-period guard lives server-side (emp_salaries_close)
       and can refuse for reasons invisible in the form — another device may
       have closed the month first. So NO draft is painted: canPatch stays
       false, only the quiet corner hint shows, and the row is patched from
       intent instead. A refusal toasts exactly as before and never paints. No
       validation is changed. queueable:false: a status precondition makes a
       later replay meaningless (I3), so a transport failure rolls back
       loudly. */
    UIC.Live.save({
      call: companyCall,
      action: 'edit_emp_salary',
      data: {
        emp_id: r.emp_id,
        old_month: r.month,
        old_year: r.year,
        month: Number(m),
        year: Number(y),
        working_days: Number(wd)
      },
      modal: 'edit-sal-modal',
      message: 'تم التعديل بنجاح',
      queueable: false,
      reload: function () { fetchSalaries(FILTER_MONTH, FILTER_YEAR, true); },
      onSuccess: function () {
        r.working_days = Number(wd);
        r.month = Number(m);
        r.year = Number(y);
        renderSalaries();
      }
    }).catch(function () { /* UIC.Live has toasted */ });
  }

  function confirmDeleteSalary(key) {
    var r = window['__sal_' + key];
    if (!r) return;
    var isClosed = !!(window.__closedMonths && window.__closedMonths[r.year + '-' + r.month]);
    if (isClosed) { UIC.toast('لا يمكن حذف راتب شهر مغلق', 'error'); return; }
    UIC.openModal('del-sal-modal', {
      title: 'تأكيد الحذف',
      body: '<p>هل تريد حذف راتب <b>' + esc(r.name_ar || r.emp_id) + '</b> لشهر <b>' + esc(r.month_name || r.month) + ' ' + r.year + '</b>؟</p>',
      onSave: 'doDeleteSalary(\'' + key + '\')',
      saveLabel: 'حذف'
    });
  }

  function doDeleteSalary(key) {
    var r = window['__sal_' + key];
    if (!r) return;
    /* Tier B delete: no optimistic paint (there is no record to draw — the
       row is gone), so no draft/list/key/render. onSuccess splices the
       in-memory list and re-renders locally; reload is the error-path
       backstop. No overlay. queueable:false. */
    UIC.Live.save({
      call: companyCall,
      action: 'delete_emp_salary',
      data: { emp_id: r.emp_id, month: r.month, year: r.year },
      modal: 'del-sal-modal',
      message: 'تم الحذف',
      queueable: false,
      reload: function () { fetchSalaries(FILTER_MONTH, FILTER_YEAR, true); },
      onSuccess: function () {
        window.__salaries = (window.__salaries || []).filter(function (s) {
          return !(Number(s.emp_id) === Number(r.emp_id) && Number(s.month) === Number(r.month) && Number(s.year) === Number(r.year));
        });
        renderSalaries(); /* re-slice current page so pager counts stay correct */
      }
    }).catch(function () { /* UIC.Live has toasted */ });
  }

  function markReceipt(key) {
    var r = window['__sal_' + key];
    if (!r) return;
    /* Tier B status flip: the receipt column can refuse on a closed month the
       form cannot see, so no draft is painted and no list/key/render is
       given. onSuccess applies the intent to the in-memory row and patches
       the cell locally; reload is the error-path backstop. No overlay.
       queueable:false. */
    UIC.Live.save({
      call: companyCall,
      action: 'update_emp_salary_receipt',
      data: { emp_id: r.emp_id, month: r.month, year: r.year },
      message: 'تم تسجيل الاستلام',
      queueable: false,
      reload: function () { fetchSalaries(FILTER_MONTH, FILTER_YEAR, true); },
      onSuccess: function () {
        r.receipt = true;
        var cell = document.getElementById('receipt-' + key);
        if (cell) cell.innerHTML = '<span style="color:var(--success,#22c55e);font-weight:600;">✔ نعم</span>';
        var row = document.getElementById('sal-row-' + key);
        if (row) {
          var btn = row.querySelector('button[onclick*="markReceipt"]');
          if (btn) btn.remove();
        }
      }
    }).catch(function () { /* UIC.Live has toasted */ });
  }

  /* ────────── Month Generation ("توليد شهر") Feature ────────── */
  function openGenerate() {
    var m = document.getElementById('sal-month') ? document.getElementById('sal-month').value : FILTER_MONTH;
    var y = document.getElementById('sal-year')  ? document.getElementById('sal-year').value  : FILTER_YEAR;
    if (!m) m = (new Date()).getMonth() + 1;
    if (!y) y = (new Date()).getFullYear();

    var mSel = '';
    (window.__monthOptions || []).forEach(function (mo) {
      mSel += '<option value="' + mo.value + '"' + (String(mo.value) === String(m) ? ' selected' : '') + '>' + esc(mo.label) + '</option>';
    });

    var modalBody =
      '<form id="generate-form">' +
      '<div style="display:flex;gap:12px;margin-bottom:12px;">' +
      '<div class="form-field" style="flex:1;"><label class="form-label">الشهر المطلوب <span class="req">*</span></label>' +
      '<select id="gen-month" class="input" onchange="updateGeneratePreview()">' + mSel + '</select></div>' +
      '<div class="form-field" style="flex:1;"><label class="form-label">السنة المطلوبة <span class="req">*</span></label>' +
      '<input id="gen-year" class="input" type="number" min="2000" max="2100" value="' + esc(y) + '" onchange="updateGeneratePreview()" onkeyup="updateGeneratePreview()"></div>' +
      '</div>' +
      '<div id="gen-notification-box"></div>' +
      '<div id="gen-list-box" style="max-height:320px;overflow:auto;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:4px 10px;"></div>' +
      '</form>';

    UIC.openModal('generate-modal', {
      title: 'توليد مرتبات شهر جديد',
      body: modalBody,
      onSave: 'saveGenerate()'
    });

    updateGeneratePreview();
  }

  function updateGeneratePreview() {
    var mEl = document.getElementById('gen-month');
    var yEl = document.getElementById('gen-year');
    var notifBox = document.getElementById('gen-notification-box');
    var listBox  = document.getElementById('gen-list-box');
    if (!mEl || !yEl || !notifBox || !listBox) return;

    var m = Number(mEl.value);
    var y = Number(yEl.value);
    if (!m || !y) {
      notifBox.innerHTML = '<div style="padding:10px;background:#fee2e2;color:var(--danger-text, #991b1b);border-radius:6px;">الرجاء اختيار الشهر والسنة</div>';
      listBox.innerHTML = '';
      return;
    }

    var isClosed = !!(window.__closedMonths && window.__closedMonths[y + '-' + m]);
    if (isClosed) {
      notifBox.innerHTML =
        '<div style="padding:12px;background:var(--danger-bg, #fef2f2);color:var(--danger-text, #991b1b);border:1px solid #fca5a5;border-radius:6px;font-weight:bold;margin-bottom:10px;">' +
        '🛑 هذا الشهر مغلق مسبقاً في جدول (emp_salaries_close) ولا يمكن توليد مرتبات جديدة له.' +
        '</div>';
      listBox.innerHTML = '';
      return;
    }

    // Check existing salaries for target month & year
    var existingMap = {};
    (window.__salaries || []).forEach(function (s) {
      if (Number(s.month) === m && Number(s.year) === y) {
        existingMap[Number(s.emp_id)] = true;
      }
    });

    // Check 1: Missing Employees with status "يعمل بالشركة"
    var activeList = window.__activeEmployees || [];
    var missing = activeList.filter(function (e) { return !existingMap[e.emp_id]; });

    if (!missing.length) {
      // "All exist" (الكل موجود)
      notifBox.innerHTML =
        '<div style="padding:14px;background:var(--success-bg, #f0fdf4);color:#166534;border:1px solid #86efac;border-radius:6px;text-align:center;margin-bottom:10px;">' +
        '<div style="font-size:18px;font-weight:bold;margin-bottom:4px;">✅ All exist (الكل موجود)</div>' +
        '<div>جميع الموظفين على قيد العمل (يعمل بالشركة) مسجلون مسبقاً في مرتبات شهر ' + m + '/' + y + '.</div>' +
        '</div>';
      listBox.innerHTML = '';
      return;
    }

    // List missing employees with Check 2 calculation
    notifBox.innerHTML =
      '<div style="padding:10px 14px;background:#fefce8;color:#854d0e;border:1px solid #fef08a;border-radius:6px;margin-bottom:10px;">' +
      '<b>📋 يوجدعدد (' + missing.length + ') موظف غير مسجلين في هذا الشهر.</b>' +
      '<div style="font-size:12px;margin-top:2px;">قم بمراجعة أيام العمل المقترحة ثم اضغط حفظ للتوليد.</div>' +
      '</div>';

    var listHtml = missing.map(function (e) {
      var defaultWd = 30;
      var newHireBadge = '';

      // Check 2: Pro-rated Working Days for New Hires whose hiring_date falls within generated month/year
      if (e.hiring_month === m && e.hiring_year === y && e.hiring_day >= 1 && e.hiring_day <= 31) {
        var hiringStartDay = e.hiring_day;
        defaultWd = 30 - hiringStartDay + 1;
        if (defaultWd < 0) defaultWd = 0;
        newHireBadge =
          '<span style="display:inline-block;margin-right:8px;padding:2px 8px;border-radius:12px;background:#fef08a;color:#854d0e;font-size:11px;font-weight:bold;">' +
          '✨ موظف جديد (تعيين: ' + esc(e.hiring_date) + ') ➔ الأيام المقترحة: ' + defaultWd + ' يوم (30 - ' + hiringStartDay + ' + 1)' +
          '</span>';
      }

      return '<div style="display:flex;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--border-subtle);">' +
        '<div style="flex:1;">' +
        '<b>' + esc(e.name_ar) + '</b> <span style="font-size:12px;color:var(--text-muted);">#' + e.emp_id + '</span>' +
        newHireBadge +
        '</div>' +
        '<input type="number" class="input" style="width:80px;" min="0" max="31" step="0.5" data-emp="' + e.emp_id + '" value="' + defaultWd + '">' +
        '<span style="font-size:12px;color:var(--text-muted);">يوم</span>' +
        '</div>';
    }).join('');

    listBox.innerHTML = listHtml;
  }

  function saveGenerate() {
    var mEl = document.getElementById('gen-month');
    var yEl = document.getElementById('gen-year');
    if (!mEl || !yEl) return;
    var month = mEl.value;
    var year  = yEl.value;
    if (!month || !year) { UIC.toast('الشهر والسنة مطلوبان', 'error'); return; }

    var isClosed = !!(window.__closedMonths && window.__closedMonths[year + '-' + month]);
    if (isClosed) { UIC.toast('الشهر مغلق مسبقاً', 'error'); return; }

    var entries = [];
    document.querySelectorAll('#generate-form input[data-emp]').forEach(function (inp) {
      var wd = inp.value.trim();
      if (wd !== '') entries.push({ emp_id: Number(inp.getAttribute('data-emp')), working_days: Number(wd) });
    });
    if (!entries.length) { UIC.toast('لا يوجد موظفون للتوليد', 'error'); return; }

    /* Tier B: generation writes two tables (salaries plus the close guard it
       checks) and the handler can refuse for a duplicate month invisible in
       the form — another device may have generated it first. So NO draft is
       painted: canPatch stays false, only the quiet corner hint shows, and
       the rows are patched from the reply instead. A refusal toasts exactly
       as before and never paints. No validation is changed. queueable:false:
       I1 is unproven for add_emp_salaries, so a transport failure rolls back
       loudly. */
    UIC.Live.save({
      call: companyCall,
      action: 'add_emp_salaries',
      data: { month: Number(month), year: Number(year), entries: entries },
      modal: 'generate-modal',
      message: 'تم التوليد بنجاح',
      queueable: false,
      reload: function () { fetchSalaries(FILTER_MONTH, FILTER_YEAR, true); },
      onSuccess: function (r) {
        var recs = (r && (r.records || r.record)) ? (r.records || [r.record]) : null;
        if (recs && recs.length) {
          window.__salaries = window.__salaries || [];
          recs.forEach(function(rec){ window.__salaries.push(rec); });
          if (window.__salaries.length>10) { /* keep display limit but retain totals from server */ }
          // if current filter matches generated month/year, re-render; else fetch quietly
          if (String(FILTER_MONTH)===String(month) && String(FILTER_YEAR)===String(year)) {
            renderSalaries();
          } else {
            FILTER_MONTH = month; FILTER_YEAR = year;
            fetchSalaries(month, year, true);
          }
        } else {
          FILTER_MONTH = month; FILTER_YEAR = year;
          fetchSalaries(month, year, true);
        }
      }
    }).catch(function () { /* UIC.Live has toasted */ });
  }

  function salaryReportDiff(value, positiveIsGood) {
    var n = Number(value) || 0;
    var cls = 'is-even';
    if (Math.abs(n) >= 0.005) {
      var good = positiveIsGood ? n > 0 : n < 0;
      cls = good ? 'is-good' : 'is-bad';
    }
    return '<span class="salary-report-diff ' + cls + '">' + (n > 0 ? '+' : '') + FMT.currency(n) + '</span>';
  }

  function salaryReportAmount(value, available) {
    if (!available) return '<span style="color:var(--text-muted);">—</span>';
    return '<span dir="ltr" style="white-space:nowrap;">' + FMT.currency(value) + '</span>';
  }

  function salaryReportCard(title, currentLabel, previousLabel, current, previous, difference, positiveIsGood) {
    return '<div class="salary-report-card">' +
      '<h4>' + esc(title) + '</h4>' +
      '<div class="salary-report-card-line"><span>' + esc(currentLabel) + '</span><strong dir="ltr">' + FMT.currency(current) + '</strong></div>' +
      '<div class="salary-report-card-line"><span>' + esc(previousLabel) + '</span><strong dir="ltr">' + FMT.currency(previous) + '</strong></div>' +
      '<div class="salary-report-card-line"><span>الفرق</span>' + salaryReportDiff(difference, positiveIsGood) + '</div>' +
      '</div>';
  }

  function openSalaryComparisonReport() {
    var month = document.getElementById('sal-month') ? document.getElementById('sal-month').value : FILTER_MONTH;
    var year = document.getElementById('sal-year') ? document.getElementById('sal-year').value : FILTER_YEAR;
    if (!month || !year) {
      UIC.toast('اختر الشهر والسنة أولاً لعرض المقارنة', 'error');
      return;
    }

    UIC.openModal('salary-comparison-modal', {
      title: 'تقرير مقارنة الرواتب بالشهر السابق',
      size: 'xl',
      body: '<div class="salary-report-loading">جاري إعداد تقرير المقارنة...</div>',
      footer: '<button type="button" class="btn btn-outline" onclick="UIC.closeModal(\'salary-comparison-modal\')">إغلاق</button>'
    });

    companyCall('get_emp_salary_comparison', { month: Number(month), year: Number(year) })
      .then(function (response) {
        renderSalaryComparisonReport(response || {});
      })
      .catch(function (e) {
        var modal = document.getElementById('salary-comparison-modal');
        var body = modal && modal.querySelector('.modal-body');
        if (body) body.innerHTML = '<div class="empty-state"><span>' + esc((e && e.message) || 'تعذر تحميل تقرير المقارنة') + '</span></div>';
        else UIC.toast((e && e.message) || 'تعذر تحميل تقرير المقارنة', 'error');
      });
  }

  function renderSalaryComparisonReport(report) {
    var modal = document.getElementById('salary-comparison-modal');
    var body = modal && modal.querySelector('.modal-body');
    if (!body) return;
    var selected = report.selected_period || {};
    var previous = report.previous_period || {};
    var summary = report.summary || {};
    var currentTotals = summary.current || {};
    var previousTotals = summary.previous || {};
    var totalDifference = summary.difference || {};
    var selectedLabel = selected.label || ((selected.month || '') + '/' + (selected.year || ''));
    var previousLabel = previous.label || ((previous.month || '') + '/' + (previous.year || ''));

    var summaryHtml = '<div class="salary-report-periods">' +
      '<span>الشهر المختار: <strong>' + esc(selectedLabel) + '</strong></span>' +
      '<span>•</span><span>المقارنة مع: <strong>' + esc(previousLabel) + '</strong></span>' +
      '<span>•</span><span>عدد الموظفين: <strong>' + (report.rows || []).length + '</strong></span>' +
      '</div>' +
      '<div class="salary-report-summary">' +
      salaryReportCard('صافي الرواتب', selectedLabel, previousLabel,
        currentTotals.salary, previousTotals.salary, totalDifference.salary, true) +
      salaryReportCard('إجمالي الخصومات', selectedLabel, previousLabel,
        currentTotals.total_deductions, previousTotals.total_deductions, totalDifference.total_deductions, false) +
      salaryReportCard('إجمالي الإضافي', selectedLabel, previousLabel,
        currentTotals.total_overtime, previousTotals.total_overtime, totalDifference.total_overtime, true) +
      '</div>';

    var rows = (report.rows || []).map(function (row) {
      var current = row.current || {};
      var before = row.previous || {};
      var difference = row.difference || {};
      return {
        emp_id: esc(row.emp_id),
        name_ar: esc(row.name_ar || '-'),
        current_salary: salaryReportAmount(current.salary, row.has_current),
        current_salary_sort: row.has_current ? Number(current.salary) || 0 : -1,
        current_deductions: salaryReportAmount(current.total_deductions, row.has_current),
        current_deductions_sort: row.has_current ? Number(current.total_deductions) || 0 : -1,
        current_overtime: salaryReportAmount(current.total_overtime, row.has_current),
        current_overtime_sort: row.has_current ? Number(current.total_overtime) || 0 : -1,
        previous_salary: salaryReportAmount(before.salary, row.has_previous),
        previous_salary_sort: row.has_previous ? Number(before.salary) || 0 : -1,
        previous_deductions: salaryReportAmount(before.total_deductions, row.has_previous),
        previous_deductions_sort: row.has_previous ? Number(before.total_deductions) || 0 : -1,
        previous_overtime: salaryReportAmount(before.total_overtime, row.has_previous),
        previous_overtime_sort: row.has_previous ? Number(before.total_overtime) || 0 : -1,
        salary_difference: salaryReportDiff(difference.salary, true),
        salary_difference_sort: Number(difference.salary) || 0,
        deduction_difference: salaryReportDiff(difference.total_deductions, false),
        deduction_difference_sort: Number(difference.total_deductions) || 0,
        overtime_difference: salaryReportDiff(difference.total_overtime, true),
        overtime_difference_sort: Number(difference.total_overtime) || 0,
        justification: '<span class="salary-report-justification">' + esc(row.justification || '—') + '</span>'
      };
    });

    var headers = [
      { key: 'emp_id', label: 'الكود', numeric: true },
      { key: 'name_ar', label: 'الموظف' },
      { key: 'current_salary', label: 'الراتب — ' + selectedLabel, sortKey: 'current_salary_sort', numeric: true },
      { key: 'current_deductions', label: 'الخصومات — ' + selectedLabel, sortKey: 'current_deductions_sort', numeric: true },
      { key: 'current_overtime', label: 'الإضافي — ' + selectedLabel, sortKey: 'current_overtime_sort', numeric: true },
      { key: 'previous_salary', label: 'الراتب — ' + previousLabel, sortKey: 'previous_salary_sort', numeric: true },
      { key: 'previous_deductions', label: 'الخصومات — ' + previousLabel, sortKey: 'previous_deductions_sort', numeric: true },
      { key: 'previous_overtime', label: 'الإضافي — ' + previousLabel, sortKey: 'previous_overtime_sort', numeric: true },
      { key: 'salary_difference', label: 'فرق الراتب', sortKey: 'salary_difference_sort', numeric: true },
      { key: 'deduction_difference', label: 'فرق الخصومات', sortKey: 'deduction_difference_sort', numeric: true },
      { key: 'overtime_difference', label: 'فرق الإضافي', sortKey: 'overtime_difference_sort', numeric: true },
      { key: 'justification', label: 'مبررات الفرق' }
    ];

    body.innerHTML = summaryHtml + UIC.dataTable('salary-compare-table', {
      title: 'مقارنة رواتب ' + selectedLabel + ' مع ' + previousLabel,
      headers: headers,
      rows: rows,
      emptyText: 'لا توجد بيانات رواتب للشهر المختار أو الشهر السابق',
      exportXlsx: false,
      printable: false
    });
    UIC.initTableSort('salary-compare-table');
  }

  function printPayrollReport(type) {
    var m = document.getElementById('sal-month') ? document.getElementById('sal-month').value : FILTER_MONTH;
    var y = document.getElementById('sal-year')  ? document.getElementById('sal-year').value  : FILTER_YEAR;
    if (!m || !y) { UIC.toast('اختر الشهر والسنة أولاً لعرض التقرير', 'error'); return; }
    UIC.openDownload(scriptUrl + '?download=payroll_report&type=' + type + '&month=' + encodeURIComponent(m) + '&year=' + encodeURIComponent(y) + '&sessionToken=' + encodeURIComponent(SESSION_TOKEN),
      'فتح تقرير الرواتب');
  }

  function showError(e) {
    var body = document.getElementById('sal-content');
    if (body) body.innerHTML = '<div class="empty-state"><span>' + esc(e.message || 'خطأ') + '</span></div>';
  }

  /* Another device's change arrives quietly, keeping the current filter view. */
  UIC.Live.watchPage({
    call: companyCall,
    page: 'tc_emp_salaries',
    onChange: function () { UIC.Live.arrive(function () { fetchSalaries(FILTER_MONTH, FILTER_YEAR, true); }); }
  });
  /* [live-notice] the view on screen */
  UIC.Live.setView('list', { refresh: function () { fetchSalaries(FILTER_MONTH, FILTER_YEAR, true); } });

  load();
</script>
