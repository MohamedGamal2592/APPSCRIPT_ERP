<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Testing System — المنتجات</title>
  <?!= include('CSS_Tokens'); ?>
  <?!= include('UI_Components'); ?>
  <?!= include('Client_Helpers'); ?>
  <?!= include('Company_ErpTest_Packs'); ?>
  <?!= include('Company_ErpTest_Nav'); ?>
  <?!= include('ERP_Flow'); ?>
  <?!= include('ERP_Modal'); ?>
  <?!= getCompanyThemeCSS_('37fc50edf1424abd') ?>
</head>
<body>
<div id="tl-root" dir="rtl"></div>
<script>
  var params = new URLSearchParams(window.location.search);
  var SESSION_TOKEN = params.get('sessionToken') || (API.getSession() || {}).token || '';
  var scriptUrl = window.scriptUrl || '/';
  var IS_SUPER_ADMIN = <?!= user && user.isSuperAdmin ? 'true' : 'false' ?>;
  var COMPANY_LOGO_URL = '<?!= getCompanyLogoUrl_('37fc50edf1424abd') ?>';
  var COMPANY_PAGES = <?!= companyPages ?>;
  var CURRENT_ACTION = '<?!= currentAction ?>';
  var USER_PAGES = <?!= user && user.isSuperAdmin ? 'null' : JSON.stringify((user && user.authorizedPages) || {}) ?>;
  var CAN_WRITE = UIC.canAdd_(); var CAN_FULL = UIC.canFull_();

  /* [page-boot] This page's first reads — the stamps, then get_et_products
     { skipStock: true } — arrive inside its HTML (declared in
     Page_Boot_Reads.js, answered by API.call). Nothing below depends on it. */

  /* [live-notice D6] list replies from the device cache, trusted by the stamps */
  if (window.UIC && UIC.Live && UIC.Live.viewCache) companyCall = UIC.Live.viewCache(companyCall, { company: '37fc50edf1424abd', page: 'et_products', view: 'list', lists: ['get_et_products'] });
  function companyCall(moduleAction, data) {
    return API.call('company_action', {
      target_system: '37fc50edf1424abd',
      module_action: moduleAction,
      data: data || {}
    }, SESSION_TOKEN);
  }

  function load() {
    var contentId = 'products-content';
    UIC.appShell('tl-root', {
      menuGroups: window.ERPTEST_MENU || [],
      companyLogoUrl: COMPANY_LOGO_URL,
      companyLogoHref: scriptUrl + '?action=et_dashboard&sessionToken=' + SESSION_TOKEN,
      companyLogoTitle: 'النظام التجريبي',
      breadcrumb: 'النظام التجريبي / المنتجات',
      contentId: contentId
    });
    fetchProducts();
  }

  /* The table and its stock are two reads (get_et_products' skipStock and
     stockOnly): the list is products + categories + chart refs, the stock is
     computed live from five movement sheets, and the list must not wait for
     it. STOCK is id -> { qty, cost } once it has arrived; until then the two
     stock columns show «…». Every refresh fetches it again. */
  var STOCK = null;
  var stockPromise = null;

  function fetchProducts() {
    UIC.readSkeleton('products-content', { message: [
      'جاري تحميل قائمة المنتجات...',
      'لحظة، جاري عرض الجدول...'
    ] });
    companyCall('get_et_products', { skipStock: true })
      .then(function (r) {
        window.__categoryOptions = r.category_options || [];
        window.__assetCodeOptions = r.asset_code_options || [];
        window.__unitOptions = r.unit_options || [];
        try{ schedulePrefetch(); }catch(e){}
        renderProducts(r.products || []);
        fetchStock();
      })
      .catch(function (e) { showError(e); })
      .finally(function () { UI.hideSpinner(); });
  }

  /* Fills the two stock columns; the view state (search, sort, page, scroll)
     is snapshotted around the re-render so nothing the user was doing moves. */
  function fetchStock() {
    var p = stockPromise = companyCall('get_et_products', { stockOnly: true })
      .then(function (r) {
        if (p !== stockPromise) return;   // a newer request replaced this one
        STOCK = (r && r.stock) || {};
        var snap = null;
        try { snap = UIC.TableRefresh.snapshot('products-table'); } catch (e) {}
        renderProducts(window.__products || []);
        try { if (snap) UIC.TableRefresh.restore('products-table', snap); } catch (e) {}
        if (window.PageBoot) PageBoot.mark('stock');
      })
      .catch(function (e) {
        if (p !== stockPromise) return;
        UIC.toast('تعذر تحميل المخزون: ' + ((e && e.message) || 'خطأ'), 'error');
      });
    return p;
  }

  /* { qty, cost }, or null while the stock is still on its way. A row the map
     does not know (a product just added) keeps what its own record says. */
  function stockOf(p) {
    if (STOCK && STOCK[String(p.id)]) return STOCK[String(p.id)];
    if (p.current_qty !== undefined && p.current_qty !== null) return { qty: p.current_qty, cost: p.total_cost_sign };
    return STOCK ? { qty: 0, cost: 0 } : null;
  }

  function renderProducts(list) {
    window.__products = list;
    var rows = list.map(function (p) {
      /* Tier A: a __pending row is the form's own JSON drawn before the server
         answers. Its id is a client-side __tmp_ key the server has never seen,
         so it shows «—» and offers no actions until the saved record (with its
         real id) replaces it — as on et_categories and et_cash. */
      var pending = !!p.__pending;
      return {
        id: pending ? '—' : p.id,
        name_ar: p.name_ar,
        name_en: p.name_en || '-',
        category: p.category_name || '-',
        unit: p.unit || '-',
        carton: p.carton || '-',
        current_qty: stockOf(p) ? FMT.number(stockOf(p).qty) : '…',
        total_cost_sign: stockOf(p) ? FMT.currency(stockOf(p).cost) : '…',
        actions: pending ? '…' : UIC.actionBtns([
          { label: 'حركة', onclick: "openMovement('" + FMT.escape(p.id) + "')" }
        ].concat(UIC.canFull_() ? [{ label: 'تعديل', onclick: "openProductModal('" + FMT.escape(p.id) + "')" }] : []))
      };
    });
    var headers = [
      { key: 'id', label: 'المعرف' },
      { key: 'name_ar', label: 'الاسم العربي' },
      { key: 'name_en', label: 'الاسم الإنجليزي' },
      { key: 'category', label: 'التصنيف' },
      { key: 'unit', label: 'الوحدة' },
      { key: 'carton', label: 'الكمية بالكرتونة او الشيكارة' },
      { key: 'current_qty', label: 'الرصيد الحالي', numeric: true },
      { key: 'total_cost_sign', label: 'قيمة الكمية المتاحة', numeric: true },
      { key: 'actions', label: 'إجراءات' }
    ];
    var body = document.getElementById('products-content');
    body.innerHTML = '<div style="display:flex;justify-content:flex-end;margin-bottom:12px;gap:8px;">' +
      '<button class="btn btn-outline" onclick="openPurchaseNeeds()">الاصناف المطلوب شرائها</button>' +
      '<button class="btn btn-primary" onclick="openProductModal(\'\')">+ إضافة منتج</button></div>' +
      UIC.dataTable('products-table', {
        title: 'المنتجات',
        headers: headers,
        rows: rows,
        emptyText: 'لا توجد منتجات'
      });
    UIC.initTableSort('products-table');
  }

  /* Opens in a new tab as before; when the tab is refused, UIC.openTab navigates this frame there instead. */
  function openMovement(id) {
    var base = (window.UIC && UIC.baseUrl) ? UIC.baseUrl() : (window.scriptUrl || scriptUrl);
    var tok = (window.UIC && UIC.token) ? UIC.token() : SESSION_TOKEN;
    UIC.openTab(base + '?action=et_product_movement&purchase_code=' + encodeURIComponent(id) + '&sessionToken=' + encodeURIComponent(tok));
  }

  /* Opens in a new tab as before; when the tab is refused, UIC.openTab navigates this frame there instead. */
  function openPurchaseNeeds() {
    var base = (window.UIC && UIC.baseUrl) ? UIC.baseUrl() : (window.scriptUrl || scriptUrl);
    var tok = (window.UIC && UIC.token) ? UIC.token() : SESSION_TOKEN;
    UIC.openTab(base + '?action=et_purchase_needs&sessionToken=' + encodeURIComponent(tok));
  }

  function openProductModal(id) {
    var p = (window.__products || []).find(function (x) { return String(x.id) === String(id); });
    var categoryOptions = (window.__categoryOptions || []).map(function (c) {
      return { value: c.id, label: c.name_ar };
    });
    var assetCodeOptions = (window.__assetCodeOptions || []).map(function (o) {
      return { value: o.fifth, label: o.code };
    });
    var body =
      '<form id="product-form">' +
      UIC.field({ key: 'name_ar', label: 'الاسم العربي', value: p ? p.name_ar : '', required: true }) +
      UIC.field({ key: 'name_en', label: 'الاسم الإنجليزي', value: p ? p.name_en : '' }) +
      UIC.enumSelect({ key: 'unit', label: 'الوحدة', value: p ? p.unit : '', options: window.__unitOptions || [], required: true }) +
      UIC.field({ key: 'carton', label: 'الكمية بالكرتونة او الشيكارة', value: p ? p.carton : '', required: true }) +
      UIC.field({ key: 'asset_code', label: 'كود الأصل', type: 'select', required: true,
        options: assetCodeOptions, placeholder: 'اختر كود الأصل...', value: p ? p.asset_code : '' }) +
      UIC.combo({ key: 'category', label: 'التصنيف', value: p ? p.category : '', options: categoryOptions, required: true, placeholder: 'اختر التصنيف...' }) +
      UIC.field({ key: 'sales_tax', label: 'ضريبة المبيعات', type: 'select', required: true,
        options: [{ value: '0.14', label: '14%' }, { value: '0.10', label: '10%' }, { value: '0.05', label: '5%' }],
        value: p ? String(p.sales_tax) : '0.14' }) +
      '</form>';
    UIC.openModal('product-modal', {
      title: p ? 'تعديل منتج' : 'إضافة منتج',
      body: body,
      onSave: 'saveProduct(\'' + (p ? p.id : '') + '\')'
    });
  }

  /* The modal's حفظ button already wraps its onclick in UI.submitOnce (see
     UIC.openModal in UI_Components.html), so this handler runs synchronously
     and hands the save straight to UIC.Live.save for the optimistic-JSON
     path. A second, nested submitOnce saw the guard its own button had just
     set and returned before running any save code — the button did nothing.
     Same shape as saveCategory in Company_ErpTest_Categories.html. */
  function saveProduct(id) {
    if (!UIC.validateForm('product-form')) return;
    var data = UIC.collectForm('product-form');
    ['unit'].forEach(function (k) {
      if (data[k] === '__new__') data[k] = data[k + '_custom'] || '';
      delete data[k + '_custom'];
    });
    delete data.category_custom;
    if (id) data.id = id;
    /* [RT-4] Optimistic. The rotating reassurance messages are deleted with
       the wait they were reassuring about. */
    if (!window.__products) window.__products = [];
    var draft = Object.assign({}, data);
    /* The draft is drawn by renderProducts, which reads the joined/computed
       fields the server returns — not the form's raw ids. Carry what the row
       needs so a pending row reads like a real one. */
    var cat = (window.__categoryOptions || []).find(function (c) { return String(c.id) === String(data.category); });
    draft.category_name = cat ? cat.name_ar : '';
    if (!id) { draft.current_qty = 0; draft.total_cost_sign = 0; }
    UIC.Live.save({
      call: companyCall,
      action: id ? 'edit_et_product' : 'add_et_product',
      data: data,
      list: window.__products,
      key: 'id',
      draft: draft,
      render: function () { renderProducts(window.__products); },
      modal: 'product-modal',
      message: 'تم الحفظ',
      recordOf: function (r) {
        var rec = (r && r.record) || null;
        if (rec && !rec.id) rec.id = r.assignedId || r.unique_id;
        return rec;
      },
      reload: fetchProducts
    }).catch(function () { /* Live.save has already toasted and rolled back */ });
  }

  function showError(e) {
    var body = document.getElementById('products-content');
    if (body) body.innerHTML = '<div class="empty-state"><span>' + FMT.escape(e.message || 'خطأ') + '</span></div>';
  }


  if (window.ET_PACKS) companyCall = ET_PACKS.wrapCall(companyCall, { page: 'et_products', list: 'get_et_products', refresh: function () { fetchProducts(); } });
  load();

  /* [RT-6] Another device's change to this page arrives on its own. The poll
     reads timestamps from cache, never a spreadsheet, and stands down while the
     tab is hidden, while a save is in flight, and after fifteen idle minutes.
     UIC.Live.arrive decides whether the list may move right now: it refreshes
     in place when the user is idle at the top, and raises a chip instead when
     they are scrolled away, typing, or have a form open. */
  UIC.Live.watchPage({
    call: companyCall,
    page: 'et_products',
    onChange: function () { UIC.Live.arrive(function () { fetchProducts(); }); }
  });
  /* [live-notice] the view on screen */
  if (UIC.Live.setView) UIC.Live.setView('list', { refresh: function () { fetchProducts(); } });

</script>
</body>
</html>
