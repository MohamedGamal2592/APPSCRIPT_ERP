  <style>
    .odoo-wrap{max-width:1100px;margin:0 auto;padding:14px;}
    .odoo-bar{position:sticky;top:0;z-index:30;background:var(--bg-surface, #fff);border-bottom:1px solid var(--border-color, #e5e7eb);box-shadow:0 1px 3px rgba(0,0,0,.06);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:-14px -14px 16px;}
    .odoo-bar h2{font-size:16px;margin:0;color:var(--text-main, #111827);}
    .odoo-bar .spacer{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
    .odoo-card{background:var(--bg-surface, #fff);border:1px solid #eef2f7;border-radius:12px;box-shadow:0 1px 2px rgba(16,24,40,.05);margin-bottom:14px;overflow:hidden;}
    .odoo-card-h{padding:12px 16px;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:linear-gradient(var(--bg-subtle, #f8fafc),#fff);}
    .odoo-card-h h3{margin:0;font-size:15px;color:#0f172a;}
    .odoo-card-b{padding:16px;}
    .odoo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;}
    .odoo-fld label{display:block;font-size:12px;color:var(--text-muted, #64748b);margin-bottom:4px;}
    .odoo-input{width:100%;padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px;background:var(--bg-surface, #fff);color:#0f172a;box-sizing:border-box;}
    .odoo-input:focus{outline:none;border-color:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.12);}
    .odoo-input:disabled{background:#f1f5f9;color:#94a3b8;}
    .odoo-nb{display:flex;gap:2px;border-bottom:2px solid #16a34a;margin-bottom:14px;flex-wrap:wrap;}
    .odoo-tab{padding:12px 22px;cursor:pointer;border:none;background:transparent;color:#475569;font-size:16px;font-weight:700;border-bottom:2px solid transparent;margin-bottom:-2px;}
    .odoo-tab.active{color:#15803d;border-bottom-color:#15803d;}
    .odoo-pane{display:none;}
    .odoo-pane.active{display:block;}
    /* [iPhone run 2] Verbatim, but scoped: from 600px up and on paper this is
       exactly the table it always was. Below 600px .card-table
       (UI_Components) turns each row into a card — white-space:nowrap on the
       header is one of the things that made this clip on a phone. */
    @media print, (min-width: 600px) {
      .odoo-table{width:100%;border-collapse:collapse;font-size:13px;}
      .odoo-table th{background:#f1f5f9;color:#334155;text-align:right;padding:8px 10px;border-bottom:1px solid var(--border-color, #e2e8f0);white-space:nowrap;}
      .odoo-table td{padding:7px 10px;border-bottom:1px solid #f1f5f9;vertical-align:middle;}
    }
    .odoo-ro{color:#94a3b8;font-size:12px;}
    /* Quantity field with its calculator trigger beside it, as on tc_stock_scan.
       A .form-field ends in a 16px .field-error line; discounting it puts the
       button's bottom edge exactly on the input's, and 44px is .input's own
       min-height, so the two read as one control at any text size. */
    .mo-calc-field{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px;align-items:end;}
    .mo-calc-trigger{min-width:44px;height:44px;padding:0;font-size:18px;line-height:1;margin-bottom:16px;}
    /* The same trigger beside a compact .odoo-input (row quantity, pause hours). */
    .mo-calc-inline{display:flex;gap:4px;align-items:center;}
    .mo-calc-inline .odoo-input{flex:1 1 auto;min-width:0;}
    .mo-calc-mini{flex:0 0 auto;padding:4px 8px;font-size:15px;line-height:1;}
    .pc-modes{display:flex;gap:6px;margin-bottom:10px;}
    .pc-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 70px 30px;gap:6px;align-items:center;margin-bottom:6px;}
    .pc-total{margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--bg-subtle, #f8fafc);font-weight:700;}
    .odoo-sub{background:var(--bg-subtle, #fafafa);border:1px dashed var(--border-color, #e2e8f0);border-radius:8px;padding:8px 10px;margin-top:8px;}
    .btn{cursor:pointer;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;}
    .btn-primary{background:#16a34a;color:#fff;}
    .btn-outline{background:var(--bg-surface, #fff);border:1px solid #cbd5e1;color:#334155;}
    .btn-ghost{background:transparent;border:1px solid transparent;color:var(--danger, #dc2626);}
    .odoo-pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;}
    .odoo-pill.Draft{background:#f1f5f9;color:#475569;}
    .odoo-pill.InProgress{background:#fef3c7;color:#92400e;}
    .odoo-pill.Locked{background:#dcfce7;color:#166534;}
  </style>

<body>
  <div id="vf-root"></div>

  <script>
    var PAGE_PARAMS = <?!= pageParams ?>;
    var SESSION_TOKEN = (PAGE_PARAMS && PAGE_PARAMS.sessionToken) || (API.getSession() || {}).token || '';
    var scriptUrl = window.scriptUrl || '/';
    var IS_SUPER_ADMIN = <?!= user && user.isSuperAdmin ? 'true' : 'false' ?>;
    var COMPANY_LOGO_URL = '<?!= getCompanyLogoUrl_('9940659bd83035d7') ?>';
    var COMPANY_PAGES = <?!= companyPages ?>;
    var CURRENT_ACTION = '<?!= currentAction ?>';
    var USER_PAGES = <?!= user && user.isSuperAdmin ? 'null' : JSON.stringify((user && user.authorizedPages) || {}) ?>;
    /* Permission is derived from the vf_mfg_orders page (the detail route shares its grants). */
    var PERM_ACTION = 'vf_mfg_orders';
    var CAN_WRITE = UIC.canAdd_(); var CAN_FULL = UIC.canFull_();

    /* [live-notice D6] list replies from the device cache, trusted by the stamps */
    if (window.UIC && UIC.Live && UIC.Live.viewCache) companyCall = UIC.Live.viewCache(companyCall, { company: '9940659bd83035d7', page: 'vf_mfg_orders', view: 'detail', lists: ['get_valley_mfg_order_detail', 'get_valley_product_batches_multi', 'get_valley_recipe_plan'] });
    function companyCall(moduleAction, data) {
      return API.call('company_action', {
        target_system: '9940659bd83035d7',
        module_action: moduleAction,
        data: data || {}
      }, SESSION_TOKEN);
    }
    function esc(v) {
      /* [UI-2.8 / U-36] Delegates to the shared formatter. This body used to
         carry its own replace-chain behind a `typeof FMT !== 'undefined'`
         guard, but Client_Helpers.html defines FMT in <head> before any page
         script runs, so that fallback was unreachable and the duplicate was
         pure drift risk. Output is identical for every input — proved in
         tools/verify/ui2_formatters.js. */
      return FMT.escape(v);
    }
    function num0(v) { var n = Number(v); return isNaN(n) ? 0 : n; }
    function todayStr() { return new Date().toISOString().slice(0, 10); }
    function toInputDate(v) {
      if (!v) return '';
      try { var d = (v instanceof Date) ? v : new Date(v); if (isNaN(d)) return ''; return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); } catch (e) { return ''; }
    }

    (function () {
      var UI = (typeof UIC !== 'undefined') ? UIC : { toast: function (m) { alert(m); } };
      (function () { var ps = document.createElement('style'); ps.textContent = '.odoo-neg{color:#c0392b;font-weight:600;}@media print{.odoo-bar,#page-loading,.btn{display:none!important;}.odoo-card{break-inside:avoid;}.odoo-wrap{padding:0!important;}}'; if (document.head) document.head.appendChild(ps); })();
      var root = function () { return document.getElementById('vf-mo-view') || document.getElementById('vf-root'); };

      var MO_UID = (PAGE_PARAMS && PAGE_PARAMS.mo) ? String(PAGE_PARAMS.mo) : '';
      var IS_NEW = !MO_UID;
      var MO_STATUS = 'Draft';
      var MFG_YIELD_FACTOR = 0.65;
      var CURRENT_ORDER = {};
      var RECIPE_OPTIONS = [], PRODUCT_OPTIONS = [], ENUMS = {}, WORKCENTER_OPTIONS = [];
      /* Batch numbers already in use, newest first — the reference list offered
         under رقم التشغيلة. It is a suggestion list, never a constraint: the
         field remains free text and a new batch number is typed straight in. */
      var BATCH_OPTIONS = [];
      var MFG_OUTPUTS = [];      /* [{uid,product_id,qty,cost_unit,total_cost,product_name}] */
      var OUTPUT_FOOTERS = [];   /* [[{item,item_code,qty,unit_cost,total_cost}]] parallel to MFG_OUTPUTS */
      var OUTPUT_BATCHES = [];   /* [[batches]] parallel to MFG_OUTPUTS (lazy-loaded per material) */
      var OUTPUT_BATCH_PROMISES = []; /* one in-flight batch request per material */
      var OUTPUT_BATCHES_FETCHED = []; /* true once a fetch for that material finished, even when it returned none */
      var OUTPUT_BATCH_GENERATION = 0;
      var OUTPUT_BATCH_REQUEST_TOKEN = [];
      var MFG_WORKOPS = [];      /* [{uid,work_center_id,operation_status,notes,start_time,last_pause_time,end_time,actual_hours,work_center_cost,total_cost}] */
      var MFG_BYPRODUCTS = [];   /* [{uid,item,qty,manufacture_internal_batch,transaction_code,total_cost}] */
      var MFG_DELETED_UIDS = { outputs: [], consumption: [], work_ops: [], byproducts: [] };
      /* Schema-free edit token for the loaded MO (detail scope). Returned as
         base_token/save_scope so the server can reject stale editors. */
      var MFG_EDIT_TOKEN = '';
      var MFG_SAVE_SCOPE = ['header', 'outputs', 'consumption', 'work_ops', 'byproducts'];
      var MFG_EDIT_TOKENS_V2 = {};
      var MFG_FAST_SAVE_V2 = false;
      var MFG_BASELINE_SIGNATURES = null;

      /* Stage F candidate (plan §6): shared retained form state for this
         editor. FALSE as shipped, and UIC.FormState.enabled() also requires the
         shared FORM_STATE_CORE_ master switch, so with either false the editor
         runs its existing path exactly as before. */
      var MFG_FORMSTATE_CANDIDATE_ = false;
      var MFG_FORM_ = null;
      var LAZY_TAB_DRAWN_ = {};
      function mfgFormStateOn_() {
        return !!(window.UIC && UIC.FormState && UIC.FormState.enabled(MFG_FORMSTATE_CANDIDATE_));
      }
      function mfgFormState_() {
        if (!mfgFormStateOn_()) return null;
        if (!MFG_FORM_) {
          MFG_FORM_ = UIC.FormState.create({
            key: 'vf_mfg_order_view',
            fields: ['manufacture_date', 'operation_type', 'shift', 'produced_product_id', 'manufactured_qty',
              'actual_qty', 'recipe_id', 'mo_status', 'manufacture_batch'],
            sections: ['outputs', 'work_ops', 'byproducts']
          });
        }
        return MFG_FORM_;
      }

      /* U-46. Whether this user may see cost figures. Set from the server's
         can_see_cost on every load, and deliberately NOT re-derived from
         USER_PAGES here: the browser cannot see the fail-open guard (which
         keeps costs visible until the owner grants valley_cost_view to a first
         role), so deriving it locally would hide figures the server had
         deliberately sent. Defaults to true, so a response that carries no flag
         behaves exactly as today. */
      var CAN_SEE_COST = true;
      function canCost() { return CAN_SEE_COST !== false; }

      function editable() { return (IS_SUPER_ADMIN || CAN_WRITE) && MO_STATUS !== 'Locked'; }
      function productOption_(productId) {
        var id = String(productId == null ? '' : productId).trim();
        if (!id) return null;
        var found = null;
        (PRODUCT_OPTIONS || []).forEach(function (o) { if (String(o.value) === id) found = o; });
        return found;
      }
      /* valley_products.carton — the packing size, delivered on product_options.
         null when the product is unchosen or its carton cell is blank/non-numeric,
         which the calculator note reports instead of showing a misleading 0. */
      function productCarton_(productId) {
        var o = productOption_(productId);
        if (!o || o.carton === '' || o.carton == null) return null;
        var n = Number(o.carton);
        return isNaN(n) ? null : n;
      }
      /* The quantity calculator (UIC.Calculator, as on tc_stock_scan). Applying a
         result fires input/change on the target, so the expected-quantity recalc
         and the KPI strip update through the listeners already bound in
         renderDetail — this path adds no second write. */
      function openCalc(targetId) {
        if (!editable()) return;
        var el = document.getElementById(targetId);
        if (!el) return;
        if (targetId.indexOf('out-qty-') === 0) {
          var mo = MFG_OUTPUTS[Number(targetId.slice(8))];
          UIC.Calculator.open({ target: el, title: 'الحاسبة — كمية الخامة' + (mo && mo.product_name ? ' (' + mo.product_name + ')' : ''), precision: 3, min: 0 });
          return;
        }
        if (targetId === 'f-manufactured') {
          UIC.Calculator.open({ target: el, title: 'الحاسبة — كمية الخام الداخلة', precision: 3, min: 0 });
          return;
        }
        var carton = productCarton_(getCombo_('f-product'));
        var prod = productOption_(getCombo_('f-product'));
        UIC.Calculator.open({
          target: el, title: 'الحاسبة — الكمية الفعلية المنتجة', precision: 2, min: 0,
          note: carton == null
            ? (prod ? 'لا توجد كرتونة او تغليف مسجلة لهذا المنتج' : 'اختر «المنتج المنتج» أولاً لعرض الكرتونة او التغليف')
            : 'الكرتونة او التغليف — ' + (prod.label || '') + ': ' + carton,
          noteValue: carton
        });
      }
      function calcField_(fieldHtml, targetId, aria) {
        if (!editable()) return fieldHtml;
        return '<div class="mo-calc-field">' + fieldHtml +
          '<button type="button" class="btn btn-outline mo-calc-trigger" id="calc-' + targetId + '" title="الحاسبة" aria-label="' + esc(aria) + '">⌗</button></div>';
      }
      /* Compact variant for the row inputs: the calculator button sits inside
         the same cell, so it survives a row redraw with no extra wiring. */
      function inlineCalc_(inputHtml_, onClick, aria) {
        if (!editable()) return inputHtml_;
        return '<div class="mo-calc-inline">' + inputHtml_ +
          '<button type="button" class="btn btn-outline mo-calc-mini" title="الحاسبة" aria-label="' + esc(aria) + '" onclick="' + onClick + '">⌗</button></div>';
      }
      function rememberDeleted_(section, uid) {
        uid = String(uid || '').trim();
        if (!uid) return;
        var list = MFG_DELETED_UIDS[section] || (MFG_DELETED_UIDS[section] = []);
        if (list.indexOf(uid) === -1) list.push(uid);
      }
      function fmt3(v) { return Number(v || 0).toFixed(3); }
      function fmtMoney(v) { return fmt3(v); }
      function fmtDateTime(v) { if (!v) return '—'; try { var d = (v instanceof Date) ? v : new Date(v); if (isNaN(d.getTime())) return String(v); var p = function (n) { return n < 10 ? '0' + n : '' + n; }; return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); } catch (e) { return String(v); } }
      function disOpt() { return editable() ? null : { disabled: true }; }

      /* ---------- loading overlay ----------
         [UI-3.4 / U-24] Delegates to the one shared loading service. This page
         used to build its own full-screen overlay with a hardcoded #875A7B
         spinner — a colour belonging to no company in this app — which made it
         the fourth distinct loading look in the product. The local NAMES are
         kept so the ~10 call sites on this page are untouched. */
      function showLoading(msg) { try { UIC.showPageLoading(msg || 'جاري التحميل…'); } catch (e) {} }
      function hideLoading() { try { UIC.hidePageLoading(true); } catch (e) {} }
      function getV_(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }
      function getCombo_(id) { var el = document.getElementById(id); return el ? el.value : ''; }

      /* ---------- small html builders ---------- */
      function selHtml(id, options, value, onChange, placeholder, opts) {
        opts = opts || {};
        var ph = placeholder ? '<option value="">' + esc(placeholder) + '</option>' : '';
        var optsHtml = (options || []).map(function (o) {
          var v = (o && o.value !== undefined) ? o.value : o;
          var l = (o && o.label !== undefined) ? o.label : o;
          return '<option value="' + esc(v) + '"' + (String(v) === String(value) ? ' selected' : '') + '>' + esc(l) + '</option>';
        }).join('');
        return '<select id="' + id + '" class="odoo-input"' + (opts.disabled ? ' disabled' : '') + (onChange ? ' onchange="' + onChange + '"' : '') + '>' + ph + optsHtml + '</select>';
      }
      function inputHtml(id, value, type, onChange, opts) {
        opts = opts || {};
        var attr = '';
        if (opts.min != null) attr += ' min="' + opts.min + '"';
        if (opts.step != null) attr += ' step="' + opts.step + '"';
        if (opts.inputmode) attr += ' inputmode="' + opts.inputmode + '"';
        if (opts.disabled) attr += ' disabled';
        return '<input id="' + id + '" class="odoo-input" type="' + (type || 'text') + '" value="' + esc(value) + '"' + (onChange ? ' onchange="' + onChange + '"' : '') + attr + '>';
      }
      function statusPill(s) {
        var cls = s === 'Locked' ? 'Locked' : (s === 'In Progress' ? 'InProgress' : 'Draft');
        var label = s === 'Locked' ? 'مقفل' : (s === 'In Progress' ? 'قيد التنفيذ' : 'مسودة');
        return '<span class="odoo-pill ' + cls + '">' + label + '</span>';
      }

      /* ---------- load ---------- */
      function validateDetailResponse_(res) {
        if (!res || typeof res !== 'object' || Array.isArray(res)) {
          throw new Error('لم يُرجع الخادم بيانات أمر التصنيع. أعد المحاولة، وإذا استمرت المشكلة تواصل مع مسؤول النظام.');
        }
        if (!IS_NEW && (!res.order || typeof res.order !== 'object' || Array.isArray(res.order))) {
          throw new Error('لم يُرجع الخادم سجل أمر التصنيع المطلوب. أعد فتح الأمر من القائمة.');
        }
        return res;
      }
      function invalidateOutputBatchRequests_() {
        OUTPUT_BATCH_GENERATION++;
        OUTPUT_BATCH_REQUEST_TOKEN = (MFG_OUTPUTS || []).map(function (_, i) { return (Number(OUTPUT_BATCH_REQUEST_TOKEN[i]) || 0) + 1; });
        OUTPUT_BATCH_PROMISES = (MFG_OUTPUTS || []).map(function () { return null; });
        OUTPUT_BATCHES = (MFG_OUTPUTS || []).map(function () { return []; });
        OUTPUT_BATCHES_FETCHED = (MFG_OUTPUTS || []).map(function () { return false; });
      }

      /* If google.script.run completes with a null result instead of invoking
         the failure handler, this read-only request may be replayed safely.
         Keep the replay bounded so a persistently empty backend response is
         reported instead of becoming "Cannot read properties of null". */
      function requestDetail_() {
        var payload = { mo_uid: IS_NEW ? '' : MO_UID };
        return companyCall('get_valley_mfg_order_detail', payload).then(function (res) {
          if (res !== null && res !== undefined) return validateDetailResponse_(res);
          return companyCall('get_valley_mfg_order_detail', payload).then(validateDetailResponse_);
        });
      }

      /* quiet: refresh in the background with no blocking overlay, for a
         user who has already seen the change and must not be interrupted
         to confirm it. */
      function load(quiet) {
        if (!quiet) showLoading('جاري تحميل أمر التصنيع…');
        var watchdog = setTimeout(function () { if (!quiet) hideLoading(); if (UI.toast) UI.toast('انتهت مهلة التحميل — تحقق من الاتصال وأعد المحاولة', 'error'); }, 25000);
        return requestDetail_().then(function (res) {
          invalidateOutputBatchRequests_();
          CAN_SEE_COST = (res.can_see_cost !== false);
          RECIPE_OPTIONS = res.recipe_options || [];
          PRODUCT_OPTIONS = res.product_options || [];
          BATCH_OPTIONS = res.batch_options || [];
          ENUMS = res.enums || {};
          WORKCENTER_OPTIONS = res.work_center_options || {};
          if (IS_NEW) {
            MO_STATUS = 'Draft';
            MFG_OUTPUTS = []; OUTPUT_FOOTERS = []; OUTPUT_BATCHES = []; OUTPUT_BATCH_PROMISES = []; OUTPUT_BATCHES_FETCHED = []; OUTPUT_BATCH_REQUEST_TOKEN = []; MFG_WORKOPS = []; MFG_BYPRODUCTS = [];
            MFG_DELETED_UIDS = { outputs: [], consumption: [], work_ops: [], byproducts: [] };
            MFG_EDIT_TOKEN = '';
            MFG_EDIT_TOKENS_V2 = {};
            MFG_FAST_SAVE_V2 = res.fast_save_v2 === true;
            MFG_BASELINE_SIGNATURES = null;
            MFG_SAVE_SCOPE = ['header', 'outputs', 'consumption', 'work_ops', 'byproducts'];
            renderDetail({ transaction_code: '', mo_status: 'Draft', operation_type: '', shift: '', manufacture_date: '', expected_qty: '', manufactured_qty: '', actual_qty: '', produced_product: '', recipe_id: '' }, res);
          } else {
            var full = res;
            MFG_DELETED_UIDS = { outputs: [], consumption: [], work_ops: [], byproducts: [] };
            MO_STATUS = (res.order && res.order.mo_status) || 'Draft';
            MFG_EDIT_TOKEN = res.edit_token || '';
            MFG_EDIT_TOKENS_V2 = res.edit_tokens_v2 || {};
            MFG_FAST_SAVE_V2 = res.fast_save_v2 === true && !!MFG_EDIT_TOKENS_V2.header;
            MFG_SAVE_SCOPE = res.save_scope || ['header', 'outputs', 'consumption', 'work_ops', 'byproducts'];
            MFG_OUTPUTS = (full.outputs || []).map(function (o) {
              return { uid: o.unique_id || '', product_id: String(o.product_id || ''), qty: o.product_qty != null ? o.product_qty : '', cost_unit: o.cost_unit || '', total_cost: o.total_cost || '', product_name: o.product_name || '' };
            });
            OUTPUT_FOOTERS = (full.outputs || []).map(function (o) {
              return (o.footers || []).map(function (f) { return { uid: f.unique_id || '', item: f.item || '', item_code: f.item_code || '', qty: f.qty != null ? f.qty : '', unit_cost: f.unit_cost != null ? f.unit_cost : 0, total_cost: f.total_cost != null ? f.total_cost : 0, saved: true }; });
            });
            OUTPUT_BATCHES = (full.outputs || []).map(function (o) { return o.batches || []; });
            OUTPUT_BATCHES_FETCHED = (full.outputs || []).map(function () { return false; });
            OUTPUT_BATCH_PROMISES = (full.outputs || []).map(function () { return null; });
            OUTPUT_BATCH_REQUEST_TOKEN = (full.outputs || []).map(function () { return 0; });
            MFG_WORKOPS = (res.workops || []).map(function (w) {
              /* U-45: work_center_cost / total_cost are sheet-computed and now
                 arrive from the server. They may be absent when the user has no
                 cost grant, so keep them undefined rather than defaulting to 0 —
                 the table tells the two cases apart. */
              /* total_pause_duration rides along now: it is editable in the row,
                 and dropping it here made the value invisible after a reload. */
              return { uid: w.unique_id || '', work_center_id: String(w.work_center_id || ''), operation_status: w.operation_status || 'Pending', notes: w.notes || '', start_time: w.start_time || '', last_pause_time: w.last_pause_time || '', end_time: w.end_time || '', actual_hours: w.actual_hours != null ? w.actual_hours : '', total_pause_duration: w.total_pause_duration != null && w.total_pause_duration !== '' ? Number(w.total_pause_duration) || 0 : 0, work_center_cost: w.work_center_cost, total_cost: w.total_cost };
            }).filter(function (w) {
              if (w.work_center_id) return true;
              rememberDeleted_('work_ops', w.uid);
              return false;
            });
            MFG_BYPRODUCTS = (res.byproducts || []).map(function (b) {
              return { uid: b.unique_id || '', item: String(b.item || ''), qty: b.qty || '', manufacture_internal_batch: b.manufacture_internal_batch || '', transaction_code: b.transaction_code || '', total_cost: b.total_cost || '' };
            }).filter(function (b) {
              if (b.item) return true;
              rememberDeleted_('byproducts', b.uid);
              return false;
            });
            renderDetail(res.order, res);
          }
        }).catch(function (e) {
          var message = (e && e.message) || 'خطأ في التحميل';
          /* A failed first request previously left only the floating home icon,
             which looked like a blank page. Keep the error visible and give the
             user deterministic retry/back actions even if a future server-side
             validation or network failure occurs. */
          var host = root();
          if (host) host.innerHTML =
            '<div class="odoo-wrap"><div class="odoo-card"><div class="odoo-card-b" style="text-align:center;padding:28px 18px;">' +
              '<div style="font-weight:700;color:#b91c1c;margin-bottom:10px;">تعذر تحميل أمر التصنيع</div>' +
              '<div style="color:#64748b;line-height:1.8;margin-bottom:18px;word-break:break-word;">' + esc(message) + '</div>' +
              '<button class="btn btn-primary" onclick="MFGVIEW_PAGE.load()">إعادة المحاولة</button> ' +
              '<button class="btn btn-outline" onclick="MFGVIEW_PAGE.goBack()">العودة إلى القائمة</button>' +
            '</div></div></div>';
          if (UI.toast) UI.toast(message, 'error');
        })
          .finally(function () { clearTimeout(watchdog); if (!quiet) hideLoading(); });
      }

      function renderKpiShell() {

      }
      function renderKpi() {
        var host = document.getElementById('mo-kpi-body'); if (!host) return;
        var inv = 0;

        var ord = CURRENT_ORDER || {};
        var other = IS_NEW ? 0 : num0(ord.total_other_cost);
        var batch = IS_NEW ? inv : (num0(ord.total_batch_cost) || (inv + other));
        var actual = num0(getV_('f-actual')) || num0(ord.actual_qty);
        var unit = actual > 0 ? batch / actual : 0;
        /* U-46. The quantity tile stays; the four cost tiles go. */
        host.innerHTML = '<div style="display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:13px;">' +
          (canCost()
            ? '<div>تكلفة الخامات: <b>' + fmtMoney(inv) + '</b></div>' +
              '<div>تكلفة التشغيل: <b>' + (IS_NEW ? 'تُحسب بعد الحفظ' : fmtMoney(other)) + '</b></div>' +
              '<div>تكلفة الدفعة: <b>' + fmtMoney(batch) + '</b></div>'
            : '') +
          '<div>الكمية الفعلية: <b>' + fmt3(actual) + '</b></div>' +
          (canCost() ? '<div>تكلفة الوحدة: <b>' + (actual > 0 ? fmtMoney(unit) : '—') + '</b></div>' : '') +
          '</div>' + referenceKpiHtml_(actual);

      /* Reference tiles (الزيت المتوقع / كمية السولار المتوقعة). Live previews of
         the production plan — never stored. Shown only while the order is not
         Locked AND نوع العملية is تصنيع وتعبئة or تصنيع (كميات); every other
         operation type (اعادة تعبئة / empty) hides both boxes. */
      var REFERENCE_OP_TYPES = ['تصنيع وتعبئة', 'تصنيع (كميات)'];
      function referenceKpiHtml_(actual) {
        if (MO_STATUS === 'Locked') return '';
        var opType = '';
        try { opType = getCombo_('f-op-type') || (CURRENT_ORDER || {}).operation_type || ''; }
        catch (e) { opType = (CURRENT_ORDER || {}).operation_type || ''; }
        if (REFERENCE_OP_TYPES.indexOf(String(opType).trim()) === -1) return '';
        var byprodQty = (MFG_BYPRODUCTS || []).reduce(function (s, b) { return s + (Number(b.qty) || 0); }, 0);
        var oil = (byprodQty + num0(actual)) * 58 / 1000;

          '</div>';

        MFG_WORKOPS.forEach(function (wop) {

      function selList_(list) { return (list || []).map(function (v) { return (v && typeof v === 'object') ? v : { value: v, label: v }; }); }

      function statusActionsHTML() {
        if (IS_NEW) return '';
        var s = MO_STATUS, btns = '';
        if (!editable() && s !== 'Locked') return '';
        if (s === 'Locked') return IS_SUPER_ADMIN ? '<button class="btn btn-outline" style="color:#b45309;" onclick="MFGVIEW_PAGE.changeStatus(\'unlock\')">فتح القفل</button>' : '';
        if (s === 'Draft') btns += '<button class="btn btn-primary" onclick="MFGVIEW_PAGE.changeStatus(\'start\')">بدء الإنتاج</button>';
        if (s === 'In Progress' && editable()) btns += '<button class="btn btn-primary" onclick="MFGVIEW_PAGE.changeStatus(\'lock\')">إنهاء الأمر</button>';
        return btns;
      }
      function changeStatus(kind) {
        if (kind === 'lock') {
          var batch = getV_('f-batch');
          var actualText = getV_('f-actual');
          var actual = Number(actualText);
          if (!batch) { UI.toast && UI.toast('لا يمكن إنهاء الأمر: أدخل رقم التشغيلة أولاً', 'error'); return; }
          if (!actualText || !isFinite(actual) || actual <= 0) {
            UI.toast && UI.toast('لا يمكن إنهاء الأمر: يجب أن تكون الكمية الفعلية المنتجة أكبر من صفر', 'error'); return;
          }
          var savedBatch = String((CURRENT_ORDER && CURRENT_ORDER.manufacture_batch) || '').trim();
          var savedActual = Number(CURRENT_ORDER && CURRENT_ORDER.actual_qty);
          if (batch !== savedBatch || !isFinite(savedActual) || Math.abs(actual - savedActual) > 0.000001) {
            UI.toast && UI.toast('احفظ رقم التشغيلة والكمية الفعلية أولاً، ثم أعد إنهاء الأمر', 'error'); return;
          }
        }
        if (kind === 'lock' && !confirm('قفل الأمر سيجعله غير قابل للتعديل إلا بصلاحية مدير النظام. متابعة؟')) return;
        if (kind === 'unlock' && !confirm('فتح القفل سيعيد الأمر إلى «قيد التنفيذ». متابعة؟')) return;
        showLoading();
        companyCall('change_valley_mfg_status', { mo_uid: MO_UID, kind: kind })
          .then(function (r) { UI.toast && UI.toast((r && r.message) || 'تم', 'success'); load(); })
          .catch(function (e) { UI.toast && UI.toast((e && e.message) || 'فشل', 'error'); })
          .finally(function () { hideLoading(); });
      }
      function goBack() { window.location.href = scriptUrl + '?action=vf_mfg_orders&sessionToken=' + SESSION_TOKEN; }

      /* ---------- FIRST SAVE OF A NEW MO ---------- */
      /* The ?new=1 page has no MO_UID, so التشغيل، الاعتماد، القفل والدفعات all
         refuse to act on it even after the order exists in the sheet. Reopening
         it by unique_id — byte for byte the URL the MOs list uses — is what
         turns it into a real, workable order, so that is what the modal offers.
         Adopting the uid here first matters just as much: this page no longer
         closes itself, so without it a second حفظ would insert a SECOND order
         instead of updating the one just created. */
      function moUrl_(uid) { return scriptUrl + '?action=vf_mfg_order&mo=' + encodeURIComponent(uid) + '&sessionToken=' + SESSION_TOKEN; }
      function listUrl_() { return scriptUrl + '?action=vf_mfg_orders&sessionToken=' + SESSION_TOKEN; }
      function navSelf_(url) {
        if (typeof UIC !== 'undefined' && UIC.navTo) { UIC.navTo(null, url); return; }
        window.location.href = url;
      }
      function onFirstSave(uid) {
        MO_UID = uid;
        IS_NEW = false;
        /* the list that opened this tab is now stale — refresh it where it exists */
        try { if (window.opener && !window.opener.closed) window.opener.location.href = listUrl_(); } catch (eOp) {}
        if (typeof UIC === 'undefined' || !UIC.openModal) { navSelf_(moUrl_(uid)); return; }
        UIC.openModal('mo-created', {
          size: 'sm',
          title: 'تم إنشاء أمر التصنيع',

      function switchTab(id) {

      /* ---------- OUTPUTS (valley_manufacture_header_products) ---------- */
      function addOutput() {
        MFG_OUTPUTS.push({ uid: '', product_id: '', qty: '', cost_unit: '', total_cost: '', product_name: '' });
        OUTPUT_FOOTERS.push([]); OUTPUT_BATCHES.push([]); OUTPUT_BATCHES_FETCHED.push(false); OUTPUT_BATCH_PROMISES.push(null);
        OUTPUT_BATCH_REQUEST_TOKEN.push(0);

           typing into on the row above. */

      }
      function removeOutput(i) {
        var old = MFG_OUTPUTS[i] || {};
        rememberDeleted_('outputs', old.uid);
        (OUTPUT_FOOTERS[i] || []).forEach(function (f) { rememberDeleted_('consumption', f.uid); });
        MFG_OUTPUTS.splice(i, 1); OUTPUT_FOOTERS.splice(i, 1); OUTPUT_BATCHES.splice(i, 1); OUTPUT_BATCHES_FETCHED.splice(i, 1); OUTPUT_BATCH_PROMISES.splice(i, 1); OUTPUT_BATCH_REQUEST_TOKEN.splice(i, 1); drawOutputs();
      }
      function setOutputProduct(i, v) {
        MFG_OUTPUTS[i].product_id = v;
        var nm = ''; (PRODUCT_OPTIONS || []).forEach(function (p) { if (String(p.value) === String(v)) nm = p.label; });
        MFG_OUTPUTS[i].product_name = nm;
        OUTPUT_BATCH_REQUEST_TOKEN[i] = (Number(OUTPUT_BATCH_REQUEST_TOKEN[i]) || 0) + 1;
        OUTPUT_BATCH_PROMISES[i] = null;
        if (v) {
          companyCall('get_valley_product_batches', { product_id: v, mo_uid: MO_UID }).then(function (r) { OUTPUT_BATCHES[i] = r.batches || []; OUTPUT_BATCHES_FETCHED[i] = true; autoAllocFifo_(i); redrawOutputRow_(i); })
            .catch(function () { OUTPUT_BATCHES[i] = []; OUTPUT_BATCHES_FETCHED[i] = false; redrawOutputRow_(i); });
        } else { OUTPUT_BATCHES[i] = []; OUTPUT_BATCHES_FETCHED[i] = false; OUTPUT_FOOTERS[i] = []; redrawOutputRow_(i); }
      }
      /* U-44. This used to skip re-allocation entirely once ANY batch had been
       * allocated by hand, so changing the quantity left quantity and batches
       * silently out of step until the save threw. Now:
       *   nothing allocated  -> full FIFO, as before;
       *   allocated < qty    -> keep every hand-made allocation and fill only
       *                         the shortfall, oldest-first;
       *   allocated > qty    -> say so. Silently discarding somebody's own
       *                         allocation would be worse than telling them,
       *                         and the per-row indicator (S8) shows where. */
      function setOutputQty(i, v) {
        MFG_OUTPUTS[i].qty = v;
        var existing = OUTPUT_FOOTERS[i] || [];
        if (!existing.length) {
          autoAllocFifo_(i);
        } else {
          var qty = round3(v);
          var keep = allocatedMap_(i);
          var sum = 0;
          Object.keys(keep).forEach(function (k) { sum = round3(sum + keep[k]); });
          if (round3(sum - qty) > BATCH_TOLERANCE) {
            UI.toast && UI.toast('الدفعات المخصصة (' + fmt3(sum) + ') أكبر من الكمية الجديدة (' + fmt3(qty) + ') — عدّل الدفعات من «+ دفعة».', 'warning');
          } else if (round3(qty - sum) > BATCH_TOLERANCE) {
            OUTPUT_FOOTERS[i] = fifoFill_(OUTPUT_BATCHES[i] || [], qty, keep, footerUidMap_(i));
          }
        }
        redrawOutputRow_(i);
      }
      function round3(v) { return Math.round((Number(v) || 0) * 1000) / 1000; }

      /* THE FIFO. There is one, and this is it — autoAllocFifo_ and the batch
       * modal both go through here, so oldest-first allocation can never drift
       * between the two.
       *
       * `keep` is an optional { batch_uid: qty } of allocations the user has
       * already made by hand. Those are honoured in batch order and count
       * against the requirement; only the SHORTFALL is filled, oldest-first,
       * from batches not already held. With no `keep` it behaves exactly as the
       * original autoAllocFifo_ did. */
      function fifoFill_(batches, qty, keep, keepUid) {
        keep = keep || {};
        keepUid = keepUid || {};
        var out = [];
        var remaining = round3(qty);
        if (remaining <= 0 || !batches || !batches.length) return out;

        /* 1) what the user already allocated, in batch (oldest-first) order.
           The kept rows carry their server uid forward so a quantity change
           never orphans the original rows on the next save. */
        batches.forEach(function (b) {
          var uid = String(b.batch_uid || '');
          var held = round3(keep[uid]);
          if (!uid || held <= 0) return;
          var row = { uid: keepUid[uid] || '', item: uid, item_code: String(b.lot || ''), qty: held };
          if (b.unit_cost != null) row.unit_cost = Number(b.unit_cost) || 0;
          out.push(row);
          remaining = round3(remaining - held);
        });

        /* 2) the shortfall, oldest-first, from batches not already held */
        for (var i = 0; i < batches.length && remaining > 0.0001; i++) {
          var bb = batches[i];
          var uid2 = String(bb.batch_uid || '');
          if (round3(keep[uid2]) > 0) continue;
          var avail = Number(bb.available) || 0;
          if (avail <= 0) continue;
          var take = avail >= remaining ? remaining : avail;
          var row2 = { uid: '', item: uid2, item_code: String(bb.lot || ''), qty: round3(take) };
          if (bb.unit_cost != null) row2.unit_cost = Number(bb.unit_cost) || 0;
          out.push(row2);
          remaining = round3(remaining - take);
        }
        return out;
      }

      /* Allocate the output quantity across available batches FIFO (oldest-first). */
      function autoAllocFifo_(i) {
        var o = MFG_OUTPUTS[i]; if (!o) return;
        OUTPUT_FOOTERS[i] = fifoFill_(OUTPUT_BATCHES[i] || [], Number(o.qty) || 0, null);
      }

      /* What is currently allocated for material i, as { batch_uid: qty }. */
      function allocatedMap_(i) {
        var m = {};
        (OUTPUT_FOOTERS[i] || []).forEach(function (f) {
          var uid = String(f.item || '').trim();
          if (uid) m[uid] = round3((m[uid] || 0) + (Number(f.qty) || 0));
        });
        return m;
      }

      /* Server uid per allocated batch (first uid wins), so refills keep identity. */
      function footerUidMap_(i) {
        var m = {};
        (OUTPUT_FOOTERS[i] || []).forEach(function (f) {
          var k = String(f.item || '').trim();
          if (k && f.uid && !m[k]) m[k] = f.uid;
        });
        return m;
      }

      /* ---------- U-44: the FIFO batch modal ---------- */
      /* The server's tolerance, mirrored EXACTLY. Company_ValleyFoods_Actions.js
       * throws 'مجموع الدفعات للصنف … يجب أن يساوي كمية البند' when
       * Math.abs(paySum - payQty) > 0.01, both rounded to 3 decimals. A looser
       * client tolerance would accept an allocation the save then rejects. */
      var BATCH_TOLERANCE = 0.01;
      var BM = null;   /* { i, qty, rows:[{batch_uid,lot,available,alloc,unit_cost}] } */

      /* Pure: the current arithmetic of the open modal. */
      function batchModalState_() {
        if (!BM) return null;
        var sum = 0;
        var over = [];
        BM.rows.forEach(function (r, ix) {
          var a = round3(r.alloc);
          sum = round3(sum + a);
          if (a - (Number(r.available) || 0) > 0.0001) over.push(ix);
        });
        var qty = round3(BM.qty);
        var diff = round3(sum - qty);
        return {
          sum: sum, qty: qty, diff: diff,
          matched: Math.abs(diff) <= BATCH_TOLERANCE,
          over: over
        };
      }

      /* Pure: the running-total line. */
      function batchSummaryHtml_(st) {
        if (!st) return '';
        var head = 'مجموع الدفعات: ' + fmt3(st.sum) + ' من ' + fmt3(st.qty);
        if (st.matched) {
          return '<span style="color:var(--success,#0a7a34);font-weight:700;">' + head + '</span>' +
            (st.over.length ? '<div class="odoo-neg" style="margin-top:4px;">⚠ تجاوز المتاح في ' + st.over.length +
              ' دفعة — المتاح المعروض تقديري، والخادم يتحقق منه مقابل أرصدة الدفعات الفعلية عند الحفظ.</div>' : '');
        }
        var msg = st.diff < 0
          ? 'ينقص ' + fmt3(Math.abs(st.diff))
          : 'يزيد ' + fmt3(st.diff);
        return '<span class="odoo-neg" style="font-weight:700;">✖ ' + head + ' — ' + msg + '</span>' +
          (st.over.length ? '<div class="odoo-neg" style="margin-top:4px;">⚠ تجاوز المتاح في ' + st.over.length +
            ' دفعة — المتاح المعروض تقديري، والخادم يتحقق منه مقابل أرصدة الدفعات الفعلية عند الحفظ.</div>' : '');
      }

      /* [iPhone run 2] Column labels for the four .odoo-table / .card-table
         tables on this page. Each list is the SAME text as the <th> row it
         belongs to, and each row builder indexes it, so a header and its
         card label cannot drift apart. Below 600px the shared .card-table
         rules turn each row into a card and print these as the labels;
         from 600px up and on paper they are invisible. */
      var BATCH_COLS = ['الدفعة', 'المتاح', 'المخصص', 'المتبقي', 'تكلفة الوحدة', 'الإجمالي'];
      var FOOTER_COLS = ['الدفعة', 'المتاح', 'المخصص', 'المتبقي', 'إجمالي التكلفة', ''];
      var WORKOP_COLS = ['مركز العمل', 'الحالة', 'بدء', 'إنهاء', 'التوقف (ساعات)', 'الساعات الفعلية', 'ملاحظات', 'تكلفة المركز', 'الإجمالي', 'أدوات', ''];
      var BYPROD_COLS = ['المنتج الثانوي', 'الكمية', 'رقم التشغيلة الداخلية (اختياري)', ''];

      function batchModalRowsHtml_() {
        return BM.rows.map(function (r, ix) {
          var alloc = round3(r.alloc);
          var remain = round3((Number(r.available) || 0) - alloc);
          var overCls = remain < -0.0001 ? 'odoo-neg' : 'odoo-ro';
          var lineTotal = (Number(r.unit_cost) || 0) * alloc;
          return '<tr>' +
            '<td data-label="' + BATCH_COLS[0] + '">' + esc(r.lot || r.batch_uid) + '</td>' +
            '<td class="odoo-ro" data-label="' + BATCH_COLS[1] + '">' + fmt3(r.available) + '</td>' +
            '<td data-label="' + BATCH_COLS[2] + '">' + inputHtml('bm-qty-' + ix, alloc || '', 'number', 'MFGVIEW_PAGE.batchModalSet(' + ix + ',this.value)', { min: '0', step: '0.001' }) + '</td>' +
            '<td id="bm-remain-' + ix + '" class="' + overCls + '" data-label="' + BATCH_COLS[3] + '">' + fmt3(remain) + '</td>' +
            (canCost()
              ? '<td class="odoo-ro" data-label="' + BATCH_COLS[4] + '">' + fmtMoney(r.unit_cost) + '</td><td id="bm-line-' + ix + '" class="odoo-ro" data-label="' + BATCH_COLS[5] + '">' + fmtMoney(lineTotal) + '</td>'
              : '') +
            '</tr>';
        }).join('');
      }

      function batchModalBodyHtml_() {
        var st = batchModalState_();
        return '<div class="odoo-ro" style="margin-bottom:8px;">' +
            esc(MFG_OUTPUTS[BM.i].product_name || MFG_OUTPUTS[BM.i].product_id || '') +
            ' — الكمية المطلوبة: <b>' + fmt3(BM.qty) + '</b>' +
          '</div>' +
          '<div style="overflow-x:auto;"><table class="odoo-table card-table"><thead><tr>' +
            '<th>الدفعة (transaction_code)</th>' +
            '<th style="width:110px;">المتاح</th>' +
            '<th style="width:120px;">المخصص</th>' +
            '<th style="width:110px;">المتبقي</th>' +
            (canCost() ? '<th style="width:120px;">تكلفة الوحدة</th><th style="width:130px;">الإجمالي</th>' : '') +
          '</tr></thead><tbody>' + batchModalRowsHtml_() + '</tbody></table></div>' +
          '<div id="bm-summary" style="margin-top:10px;font-size:13px;">' + batchSummaryHtml_(st) + '</div>';
      }

      function batchModalFooterHtml_() {
        var st = batchModalState_();
        return '<button class="btn btn-outline" onclick="MFGVIEW_PAGE.batchModalCancel()">إلغاء</button> ' +
          '<button id="bm-confirm" class="btn btn-primary" ' + (st && st.matched ? '' : 'disabled ') +
          'onclick="MFGVIEW_PAGE.batchModalConfirm()">تأكيد</button>';
      }

      /* Opens on + دفعة. Runs FIFO over the shortfall only, so batches the user
         already chose are kept — the owner's "if there already chosen batches it
         continue". */
      function openBatchModal(i) {
        var o = MFG_OUTPUTS[i];
        if (!o) return;
        var qty = round3(o.qty);
        if (qty <= 0) { UI.toast && UI.toast('أدخل كمية الخامة أولاً', 'error'); return; }

        /* F2. The balances are read when the modal opens, never from the
           render-time cache: allocating against a batch that has since been
           exhausted is the one thing this modal exists to prevent.
           ensureOutputBatches_(i, true) refetches (or joins an in-flight read)
           before a single row is built. */
        function buildModal(batches) {
          var keep = allocatedMap_(i);
          var proposed = fifoFill_(batches, qty, keep);
          var byUid = {};
          proposed.forEach(function (p) { byUid[p.item] = round3((byUid[p.item] || 0) + p.qty); });

          /* One row per batch, oldest-first (the server already sorts them that
             way), plus any already-allocated batch that is no longer offered — a
             saved row whose batch is now exhausted must stay visible and editable
             rather than vanish. */
          var rows = batches.map(function (b) {
            var uid = String(b.batch_uid || '');
            return {
              batch_uid: uid, lot: String(b.lot || uid),
              available: Number(b.available) || 0,
              unit_cost: b.unit_cost,
              alloc: round3(byUid[uid] || 0)
            };
          });
          var seen = {};
          rows.forEach(function (r) { seen[r.batch_uid] = true; });
          Object.keys(keep).forEach(function (uid) {
            if (seen[uid]) return;
            var f = (OUTPUT_FOOTERS[i] || []).filter(function (x) { return String(x.item) === uid; })[0] || {};
            rows.push({ batch_uid: uid, lot: String(f.item_code || uid), available: 0, unit_cost: f.unit_cost, alloc: round3(keep[uid]) });
          });

          BM = { i: i, qty: qty, rows: rows };
          UIC.openModal('vf-batch-modal', {
            title: 'تخصيص الدفعات (FIFO — الأقدم أولاً)',
            size: 'lg',
            body: batchModalBodyHtml_(),
            footer: batchModalFooterHtml_()
          });
        }

        showLoading('جاري تحميل الدفعات…');
        return ensureOutputBatches_(i, true).then(function (batches) {
          batches = batches || [];
          if (!batches.length) { UI.toast && UI.toast('لا توجد دفعات متاحة لهذه الخامة', 'error'); return; }
          buildModal(batches);
        }).catch(function (e) {
          UI.toast && UI.toast((e && e.message) || 'تعذر تحميل الدفعات', 'error');
        }).finally(function () { hideLoading(); });
      }

      /* In-place update: the row's remaining, its line total, the running total
         and the confirm button. The table is NOT re-rendered, so the number
         being typed into keeps its focus and caret. */
      function batchModalSet(ix, v) {
        if (!BM || !BM.rows[ix]) return;
        BM.rows[ix].alloc = Number(v) || 0;
        var st = batchModalState_();
        var alloc = round3(BM.rows[ix].alloc);
        var remain = round3((Number(BM.rows[ix].available) || 0) - alloc);
        var rEl = document.getElementById('bm-remain-' + ix);
        if (rEl) {
          rEl.textContent = fmt3(remain);
          rEl.className = remain < -0.0001 ? 'odoo-neg' : 'odoo-ro';
        }
        var lEl = document.getElementById('bm-line-' + ix);
        if (lEl) lEl.textContent = fmtMoney((Number(BM.rows[ix].unit_cost) || 0) * alloc);
        var sEl = document.getElementById('bm-summary');
        if (sEl) sEl.innerHTML = batchSummaryHtml_(st);
        var cEl = document.getElementById('bm-confirm');
        if (cEl) cEl.disabled = !st.matched;
      }

      /* Cancel leaves the existing allocation exactly as it was. */
      function batchModalCancel() { BM = null; UIC.closeModal('vf-batch-modal'); }

      function batchModalConfirm() {
        if (!BM) return;
        var st = batchModalState_();
        if (!st.matched) return;   /* the button is disabled; belt and braces */
        var i = BM.i;
        var oldRows = (OUTPUT_FOOTERS[i] || []).slice();
        var oldUidByBatch = footerUidMap_(i);
        var keptOld = {};
        OUTPUT_FOOTERS[i] = BM.rows
          .filter(function (r) { return round3(r.alloc) > 0; })
          .map(function (r) {
            var oldUid = oldUidByBatch[String(r.batch_uid || '')] || '';
            if (oldUid) keptOld[oldUid] = true;
            var row = { uid: oldUid, item: r.batch_uid, item_code: r.lot, qty: round3(r.alloc) };
            if (r.unit_cost != null) row.unit_cost = Number(r.unit_cost) || 0;
            return row;
          });
        oldRows.forEach(function (f) { if (f.uid && !keptOld[f.uid]) rememberDeleted_('consumption', f.uid); });
        BM = null;
        UIC.closeModal('vf-batch-modal');
        redrawOutputRow_(i);
      }

      function addFooterRow(i) { if (!OUTPUT_FOOTERS[i]) OUTPUT_FOOTERS[i] = []; OUTPUT_FOOTERS[i].push({ uid: '', item: '', item_code: '', qty: '' }); redrawOutputRow_(i); }
      function removeFooterRow(i, fi) { var f = (OUTPUT_FOOTERS[i] || [])[fi] || {}; rememberDeleted_('consumption', f.uid); OUTPUT_FOOTERS[i].splice(fi, 1); redrawOutputRow_(i); }
      function setFooterItem(i, fi, el) {
        OUTPUT_FOOTERS[i][fi].item = el.value;
        var opt = el.selectedOptions && el.selectedOptions[0];
        OUTPUT_FOOTERS[i][fi].item_code = opt ? opt.getAttribute('data-code') : '';
        OUTPUT_FOOTERS[i][fi].unit_cost = opt ? (Number(opt.getAttribute('data-unitcost')) || 0) : 0;
        refreshFooterRow_(i, fi);
      }
      function setFooterQty(i, fi, v) { OUTPUT_FOOTERS[i][fi].qty = v; refreshFooterRow_(i, fi); }
      function refreshFooterRow_(i, fi) {
        var sel = document.getElementById('ft-item-' + i + '-' + fi);
        var tr = sel && sel.closest ? sel.closest('tr') : null;
        if (!tr) return;
        var f = (OUTPUT_FOOTERS[i] || [])[fi]; if (!f) return;
        var batches = OUTPUT_BATCHES[i] || [];
        var b = null; for (var bi = 0; bi < batches.length; bi++) { if (String(batches[bi].batch_uid) === String(f.item)) { b = batches[bi]; break; } }
        var avail = b ? (Number(b.available) || 0) : 0;
        var alloc = Number(f.qty) || 0;
        if (f.saved) {
          tr.cells[1].textContent = '—';
          tr.cells[3].textContent = '—'; tr.cells[3].className = 'odoo-ro';
        } else {
          var remain = avail - alloc;
          tr.cells[1].textContent = fmt3(avail);
          tr.cells[3].textContent = fmt3(remain);
          tr.cells[3].className = remain < -0.0001 ? 'odoo-neg' : 'odoo-ro';
        }
        /* U-46. Cell 4 is the line-total column, which is not rendered without
           the cost grant — writing to it blind would overwrite the delete
           button's cell. */
        if (canCost() && tr.cells[4]) tr.cells[4].textContent = fmtMoney((Number(f.unit_cost) || 0) * alloc);
        /* U-43: keep the row's allocated/short/over indicator honest while the
           user types, without re-rendering the row underneath them. */
        var sEl = document.getElementById('out-sum-' + i);
        if (sEl) sEl.innerHTML = outputSummaryInnerHtml_(i);
        renderKpi();
      }

      /* U-43. The allocation state of one material, for the row indicator. */
      function outputAllocState_(i) {
        var footers = OUTPUT_FOOTERS[i] || [];
        var qty = round3((MFG_OUTPUTS[i] || {}).qty);
        var sum = 0;
        footers.forEach(function (f) { sum = round3(sum + (Number(f.qty) || 0)); });
        var diff = round3(sum - qty);
        return {
          count: footers.length, sum: sum, qty: qty, diff: diff,
          state: (qty <= 0 || !footers.length) ? 'none'
            : (Math.abs(diff) <= BATCH_TOLERANCE ? 'ok' : (diff < 0 ? 'short' : 'over'))
        };
      }

      /* U-43. The one-line summary every material row carries: what it is, how
         much, how many batches, the allocated/short/over state, and — only with
         the grant — the cost. */
      function outputSummaryHtml_(i) {
        /* The wrapper carries the id, so refreshFooterRow_ can refresh just the
           indicator while the user is typing a batch quantity. */
        return '<div id="out-sum-' + i + '" class="odoo-ro" style="margin-top:6px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;">' +
          outputSummaryInnerHtml_(i) + '</div>';
      }

      function outputSummaryInnerHtml_(i) {
        var o = MFG_OUTPUTS[i] || {};
        var st = outputAllocState_(i);
        var footers = OUTPUT_FOOTERS[i] || [];
        var outTotal = footers.reduce(function (t, f) { return t + (Number(f.unit_cost) || 0) * (Number(f.qty) || 0); }, 0);
        var badge = st.state === 'ok'
          ? '<span style="color:var(--success,#0a7a34);font-weight:700;">الدفعات مطابقة</span>'

      /* ---------- WORK OPS (valley_manufacture_work_center) ---------- */
      var WO_STATUSES = ['Pending', 'In Progress', 'Paused', 'Done'];

      function applyWorkOpStatusLocally_(i, status) {

      }

        for (var j = 0; j < MFG_WORKOPS.length; j++) {
          if (j === i) continue;

          var st = String((o && o.operation_status) || 'Pending');

      function applyWorkOpsStatus() {

        var idx = woSelectedIndexes_();
        if (!idx.length) { UI.toast && UI.toast('حدّد عملية واحدة على الأقل', 'error'); return; }

      function addWorkOp() {

      /* The MO's chosen shift (الوردية) drives new work-op times: start/end come

            if (refreshBatchBalances) invalidateOutputBatchRequests_();
            if (IS_NEW && r && r.mo_uid) { onFirstSave(String(r.mo_uid)); return; }
            /* Candidate: reconcile from the versioned reply instead of a full
               document reload. The next edit token and the new child identities
               come from the committed reply; the KPI is redrawn from local
               preview data only. Anything the reply does not carry still falls
               back to the existing quiet reload. */
            if (r && r.reconciliation && ((fastScopedSave && r.reconciliation.next_tokens) || (fs && submission))) {
              var rec = r.reconciliation;
              if (fs && submission) {
                fs.settle(submission, {
                  saved: rec.saved || {},
                  token: rec.next_token || MFG_EDIT_TOKEN,
                  mapped: rec.mapped || {},
                  removed: rec.removed || {}
                });
                fs.setControlsEnabled('vf-root', true);
              }
              if (rec.next_token) MFG_EDIT_TOKEN = rec.next_token;
              Object.keys(rec.next_tokens || {}).forEach(function (key) { MFG_EDIT_TOKENS_V2[key] = rec.next_tokens[key]; });
              try {
                var mapped = fastScopedSave ? (rec.client_mapped || rec.mapped || {}) : (rec.mapped || {});
                Object.keys(mapped.outputs || {}).forEach(function (i) { if (MFG_OUTPUTS[i]) MFG_OUTPUTS[i].uid = mapped.outputs[i]; });
                Object.keys(mapped.work_ops || {}).forEach(function (i) { if (MFG_WORKOPS[i]) MFG_WORKOPS[i].uid = mapped.work_ops[i]; });
                Object.keys(mapped.byproducts || {}).forEach(function (i) { if (MFG_BYPRODUCTS[i]) MFG_BYPRODUCTS[i].uid = mapped.byproducts[i]; });
                if (fastScopedSave) {
                  Object.keys(mapped.consumption || {}).forEach(function (oi) {
                    Object.keys(mapped.consumption[oi] || {}).forEach(function (fi) {
                      var footer = (OUTPUT_FOOTERS[Number(oi)] || [])[Number(fi)];
                      if (footer) footer.uid = mapped.consumption[oi][fi];
                    });
                  });
                } else {
                  var footIdx = 0;
                  MFG_OUTPUTS.forEach(function (o, oi) {
                    (OUTPUT_FOOTERS[oi] || []).forEach(function (f) {
                      var uid = (mapped.consumption || {})[String(footIdx)];
                      if (uid) f.uid = uid;
                      footIdx++;
                    });
                  });
                }
                var saved = rec.saved || {};
                (saved.outputs || []).forEach(function (row) {
                  var out = MFG_OUTPUTS[Number(row.index)];
                  if (!out) return;
                  if (row.uid) out.uid = row.uid;
                  if (row.product_name != null) out.product_name = row.product_name;
                  if (row.product_qty != null) out.qty = row.product_qty;
                  if (row.cost_unit != null) out.cost_unit = row.cost_unit;
                  if (row.total_cost != null) out.total_cost = row.total_cost;
                  (row.footers || []).forEach(function (savedFooter) {
                    var list = OUTPUT_FOOTERS[Number(row.index)] || [];
                    var target = list.filter(function (f) { return savedFooter.uid && String(f.uid) === String(savedFooter.uid); })[0] || list[Number(savedFooter.index)];
                    if (!target) return;
                    if (savedFooter.uid) target.uid = savedFooter.uid;
                    if (savedFooter.item_code != null) target.item_code = savedFooter.item_code;
                    if (savedFooter.qty != null) target.qty = savedFooter.qty;
                    if (savedFooter.unit_cost != null) target.unit_cost = savedFooter.unit_cost;
                    if (savedFooter.total_cost != null) target.total_cost = savedFooter.total_cost;
                  });
                });
                (saved.work_ops || []).forEach(function (row) {
                  var w = MFG_WORKOPS[Number(row.index)];
                  if (!w) return;
                  if (row.uid) w.uid = row.uid;
                  if (row.actual_hours != null) w.actual_hours = row.actual_hours;
                  if (row.work_center_cost != null) w.work_center_cost = row.work_center_cost;
                  if (row.total_cost != null) w.total_cost = row.total_cost;
                });
                (saved.byproducts || []).forEach(function (row) {
                  var b = MFG_BYPRODUCTS[Number(row.index)];
                  if (!b) return;
                  if (row.uid) b.uid = row.uid;
                  if (row.transaction_code != null) b.transaction_code = row.transaction_code;
                  if (row.total_cost != null) b.total_cost = row.total_cost;
                });

              } catch (eMap) {}
              MFG_BASELINE_SIGNATURES = mfgSectionSignatures_(mfgCollectEditPayload_());
              if (fastScopedSave && refreshBatchBalances) { preloadOutputBatches_(); drawOutputs(); }
              if (fastScopedSave && (payload.save_scope.indexOf('work_ops') !== -1)) drawWorkOps();
              if (fastScopedSave && (payload.save_scope.indexOf('byproducts') !== -1)) drawByproducts();
              renderKpi();
              if (fastScopedSave) return;
              if (window.confirm('تم الحفظ. هل تريد الانتقال إلى تبويب ورديات التشغيل (البدء/الإيقاف) الآن؟')) { switchTab('workops'); }
              return;
            }
            if (fs && submission) fs.setControlsEnabled('vf-root', true);
            load(true);
            if (window.confirm('تم حفظ أمر التصنيع. هل تريد إدخال بيانات التشغيل (الخطوات/الدفعات) الآن؟')) { switchTab('workops'); }
          })
          .catch(function (e) { try { console.error('[MFGVIEW][save] FAILED:', (e && e.message) || e); } catch (eLog3) {}
            /* Candidate: a rejection restores editability without discarding
               entered values; an uncertain transport outcome is named as
               uncertain and never reported as saved. */
            if (fs && submission) {
              fs.setControlsEnabled('vf-root', true);
              if (e && e.uncertain) fs.markUncertain(e); else fs.markRejected(e);
            }
            UI.toast && UI.toast((e && e.code === 'VERSION_CONFLICT' ? (e.message + ' — أعد تحميل الصفحة') : ((e && e.message) || 'فشل الحفظ')), 'error'); })
          .finally(function () { hideLoading(); });
      }

      window.MFGVIEW_PAGE = {
        load: load, renderDetail: renderDetail, saveHeader: saveHeader, goBack: goBack,
        openCreatedMo: openCreatedMo, backToList: backToList,
        switchTab: switchTab, changeStatus: changeStatus, onRecipeChange: onRecipeChange,
        addOutput: addOutput, removeOutput: removeOutput, setOutputProduct: setOutputProduct, setOutputQty: setOutputQty,
        addFooterRow: addFooterRow, removeFooterRow: removeFooterRow, setFooterItem: setFooterItem, setFooterQty: setFooterQty,
        openBatchModal: openBatchModal, batchModalSet: batchModalSet,
        batchModalConfirm: batchModalConfirm, batchModalCancel: batchModalCancel,
        addWorkOp: addWorkOp, removeWorkOp: removeWorkOp, setWorkOp: setWorkOp, clockWorkOp: clockWorkOp,
        toggleWorkOpSelect: toggleWorkOpSelect, toggleAllWorkOps: toggleAllWorkOps, applyWorkOpsStatus: applyWorkOpsStatus,
        openWorkOpNotes: openWorkOpNotes, closeWorkOpNotes: closeWorkOpNotes, saveWorkOpNotes: saveWorkOpNotes,
        openWorkOpWorkCenter: openWorkOpWorkCenter, closeWorkOpWorkCenter: closeWorkOpWorkCenter, saveWorkOpWorkCenter: saveWorkOpWorkCenter,
        addByproduct: addByproduct, removeByproduct: removeByproduct, setByproduct: setByproduct,
        approveMo: approveMo, printMo: printMo, openCalc: openCalc,
        openPauseCalc: openPauseCalc, closePauseCalc: closePauseCalc, applyPauseCalc: applyPauseCalc,

      document.addEventListener('DOMContentLoaded', load);
      /* Another device's change to this page arrives on its own. The poll

      UIC.Live.watchPage({
        call: companyCall,
        page: 'vf_mfg_orders',
        onChange: function () { UIC.Live.arrive(function () { load(true); }); }
      });
      /* [live-notice] the view on screen */
      if (UIC.Live.setView) UIC.Live.setView('detail', { refresh: function () { load(true); } });

    })();
