<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Valley Foods — أمر تصنيع</title>
  <?!= include('CSS_Tokens'); ?>
  <?!= include('UI_Components'); ?>
  <?!= include('Client_Helpers'); ?>
  <?!= include('Company_ValleyFoods_Nav'); ?>
  <?!= getCompanyThemeCSS_('9940659bd83035d7') ?>
  <style>
    .odoo-wrap{max-width:1100px;margin:0 auto;padding:14px;}
    .odoo-bar{position:sticky;top:0;z-index:30;background:var(--bg-surface, #fff);border-bottom:1px solid var(--border-color, #e5e7eb);box-shadow:0 1px 3px rgba(0,0,0,.06);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:-14px -14px 16px;}
    .odoo-bar h2{font-size:16px;margin:0;color:var(--text-main, #111827);}
    .odoo-bar .spacer{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
    .odoo-card{background:var(--bg-surface, #fff);border:1px solid #eef2f7;border-radius:12px;box-shadow:0 1px 2px rgba(16,24,40,.05);margin-bottom:14px;overflow:hidden;}
    .odoo-card-h{padding:12px 16px;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:linear-gradient(var(--bg-subtle, #f8fafc),#fff);}
    .odoo-card-h h3{margin:0;font-size:15px;color:#0f172a;}
    .odoo-card-b{padding:16px;}
    .odoo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;}
    .odoo-fld label{display:block;font-size:12px;color:var(--text-muted, #64748b);margin-bottom:4px;}
    .odoo-input{width:100%;padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px;background:var(--bg-surface, #fff);color:#0f172a;box-sizing:border-box;}
    .odoo-input:focus{outline:none;border-color:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.12);}
    .odoo-input:disabled{background:#f1f5f9;color:#94a3b8;}
    .odoo-nb{display:flex;gap:2px;border-bottom:2px solid #16a34a;margin-bottom:14px;flex-wrap:wrap;}
    .odoo-tab{padding:9px 16px;cursor:pointer;border:none;background:transparent;color:#475569;font-size:13px;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-2px;}
    .odoo-tab.active{color:#15803d;border-bottom-color:#15803d;}
    .odoo-pane{display:none;}
    .odoo-pane.active{display:block;}
    .odoo-table{width:100%;border-collapse:collapse;font-size:13px;}
    .odoo-table th{background:#f1f5f9;color:#334155;text-align:right;padding:8px 10px;border-bottom:1px solid var(--border-color, #e2e8f0);white-space:nowrap;}
    .odoo-table td{padding:7px 10px;border-bottom:1px solid #f1f5f9;vertical-align:middle;}
    .odoo-ro{color:#94a3b8;font-size:12px;}
    .odoo-sub{background:var(--bg-subtle, #fafafa);border:1px dashed var(--border-color, #e2e8f0);border-radius:8px;padding:8px 10px;margin-top:8px;}
    .btn{cursor:pointer;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;}
    .btn-primary{background:#16a34a;color:#fff;}
    .btn-outline{background:var(--bg-surface, #fff);border:1px solid #cbd5e1;color:#334155;}
    .btn-ghost{background:transparent;border:1px solid transparent;color:var(--danger, #dc2626);}
    .odoo-pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;}
    .odoo-pill.Draft{background:#f1f5f9;color:#475569;}
    .odoo-pill.InProgress{background:#fef3c7;color:#92400e;}
    .odoo-pill.Locked{background:#dcfce7;color:#166534;}
  </style>
</head>
<body>
  <div id="vf-root"></div>

  <script>
    var PAGE_PARAMS = <?!= pageParams ?>;
    var SESSION_TOKEN = (PAGE_PARAMS && PAGE_PARAMS.sessionToken) || (API.getSession() || {}).token || '';
    var scriptUrl = window.scriptUrl || '/';
    var IS_SUPER_ADMIN = <?!= user && user.isSuperAdmin ? 'true' : 'false' ?>;
    var COMPANY_LOGO_URL = '<?!= getCompanyLogoUrl_('9940659bd83035d7') ?>';
    var COMPANY_PAGES = <?!= companyPages ?>;
    var CURRENT_ACTION = '<?!= currentAction ?>';
    var USER_PAGES = <?!= user && user.isSuperAdmin ? 'null' : JSON.stringify((user && user.authorizedPages) || {}) ?>;
    /* Permission is derived from the vf_mfg_orders page (the detail route shares its grants). */
    var PERM_ACTION = 'vf_mfg_orders';
    var CAN_WRITE = UIC.canAdd_(); var CAN_FULL = UIC.canFull_();

    function companyCall(moduleAction, data) {
      return API.call('company_action', {
        target_system: '9940659bd83035d7',
        module_action: moduleAction,
        data: data || {}
      }, SESSION_TOKEN);
    }
    function esc(v) {
      var s = (v === undefined || v === null) ? '' : String(v);
      if (typeof FMT !== 'undefined' && FMT.escape) return FMT.escape(s);
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function num0(v) { var n = Number(v); return isNaN(n) ? 0 : n; }
    function todayStr() { return new Date().toISOString().slice(0, 10); }
    function toInputDate(v) {
      if (!v) return '';
      try { var d = (v instanceof Date) ? v : new Date(v); if (isNaN(d)) return ''; return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); } catch (e) { return ''; }
    }

    (function () {
      var UI = (typeof UIC !== 'undefined') ? UIC : { toast: function (m) { alert(m); } };
      (function () { var ps = document.createElement('style'); ps.textContent = '.odoo-neg{color:#c0392b;font-weight:600;}@media print{.odoo-bar,#vf-loading-overlay,.btn{display:none!important;}.odoo-card{break-inside:avoid;}.odoo-wrap{padding:0!important;}}'; if (document.head) document.head.appendChild(ps); })();
      var root = function () { return document.getElementById('vf-mo-view') || document.getElementById('vf-root'); };

      var MO_UID = (PAGE_PARAMS && PAGE_PARAMS.mo) ? String(PAGE_PARAMS.mo) : '';
      var IS_NEW = !MO_UID;
      var MO_STATUS = 'Draft';
      var MFG_YIELD_FACTOR = 0.65;
      var CURRENT_ORDER = {};
      var RECIPE_OPTIONS = [], PRODUCT_OPTIONS = [], ENUMS = {}, WORKCENTER_OPTIONS = [];
      var MFG_OUTPUTS = [];      /* [{uid,product_id,qty,cost_unit,total_cost,product_name}] */
      var OUTPUT_FOOTERS = [];   /* [[{item,item_code,qty,unit_cost,total_cost}]] parallel to MFG_OUTPUTS */
      var OUTPUT_BATCHES = [];   /* [[batches]] parallel to MFG_OUTPUTS (preloaded) */
      var MFG_WORKOPS = [];      /* [{uid,work_center_id,operation_status,notes,start_time,last_pause_time,end_time,actual_hours,work_center_cost,total_cost}] */
      var MFG_BYPRODUCTS = [];   /* [{uid,item,qty,transaction_code,total_cost}] */

      /* U-46. Whether this user may see cost figures. Set from the server's
         can_see_cost on every load, and deliberately NOT re-derived from
         USER_PAGES here: the browser cannot see the fail-open guard (which
         keeps costs visible until the owner grants valley_cost_view to a first
         role), so deriving it locally would hide figures the server had
         deliberately sent. Defaults to true, so a response that carries no flag
         behaves exactly as today. */
      var CAN_SEE_COST = true;
      function canCost() { return CAN_SEE_COST !== false; }

      function editable() { return IS_SUPER_ADMIN ? true : (CAN_WRITE && MO_STATUS !== 'Locked'); }
      function fmt3(v) { return Number(v || 0).toFixed(3); }
      function fmtMoney(v) { return fmt3(v); }
      function fmtDateTime(v) { if (!v) return '—'; try { var d = (v instanceof Date) ? v : new Date(v); if (isNaN(d.getTime())) return String(v); var p = function (n) { return n < 10 ? '0' + n : '' + n; }; return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); } catch (e) { return String(v); } }
      function disOpt() { return editable() ? null : { disabled: true }; }

      /* ---------- loading overlay (popup so the user knows it is working) ---------- */
      function showLoading(msg) {
        var el = document.getElementById('vf-loading-overlay');
        if (!el) {
          el = document.createElement('div');
          el.id = 'vf-loading-overlay';
          el.style.cssText = 'position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,0.78);direction:rtl;';
          el.innerHTML =             '<div style="background:var(--bg-surface, #fff);border:1px solid #e3e3e3;border-radius:12px;padding:22px 30px;box-shadow:0 6px 24px rgba(0,0,0,0.12);display:flex;flex-direction:column;align-items:center;gap:12px;">' +
            '<div style="width:34px;height:34px;border:4px solid var(--border-color, #eee);border-top-color:#875A7B;border-radius:50%;animation:vfspin 0.8s linear infinite;"></div>' +
            '<div id="vf-loading-msg" style="font-family:Tahoma;color:#444;font-size:14px;">جاري التحميل…</div></div>';
          var st = document.createElement('style'); st.textContent = '@keyframes vfspin{to{transform:rotate(360deg)}}'; document.head.appendChild(st);
          document.body.appendChild(el);
        }
        var m = document.getElementById('vf-loading-msg'); if (m && msg) m.textContent = msg;
        el.style.display = 'flex';
      }
      function hideLoading() { var el = document.getElementById('vf-loading-overlay'); if (el) el.style.display = 'none'; }
      function getV_(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }
      function getCombo_(id) { var el = document.getElementById(id); return el ? el.value : ''; }

      /* ---------- small html builders ---------- */
      function selHtml(id, options, value, onChange, placeholder, opts) {
        opts = opts || {};
        var ph = placeholder ? '<option value="">' + esc(placeholder) + '</option>' : '';
        var optsHtml = (options || []).map(function (o) {
          var v = (o && o.value !== undefined) ? o.value : o;
          var l = (o && o.label !== undefined) ? o.label : o;
          return '<option value="' + esc(v) + '"' + (String(v) === String(value) ? ' selected' : '') + '>' + esc(l) + '</option>';
        }).join('');
        return '<select id="' + id + '" class="odoo-input"' + (opts.disabled ? ' disabled' : '') + (onChange ? ' onchange="' + onChange + '"' : '') + '>' + ph + optsHtml + '</select>';
      }
      function inputHtml(id, value, type, onChange, opts) {
        opts = opts || {};
        var attr = '';
        if (opts.min != null) attr += ' min="' + opts.min + '"';
        if (opts.step != null) attr += ' step="' + opts.step + '"';
        if (opts.disabled) attr += ' disabled';
        return '<input id="' + id + '" class="odoo-input" type="' + (type || 'text') + '" value="' + esc(value) + '"' + (onChange ? ' onchange="' + onChange + '"' : '') + attr + '>';
      }
      function statusPill(s) {
        var cls = s === 'Locked' ? 'Locked' : (s === 'In Progress' ? 'InProgress' : 'Draft');
        var label = s === 'Locked' ? 'مقفل 🔒' : (s === 'In Progress' ? 'قيد التنفيذ' : 'مسودة');
        return '<span class="odoo-pill ' + cls + '">' + label + '</span>';
      }

      /* ---------- load ---------- */
      function load() {
        showLoading('جاري تحميل أمر التصنيع…');
        var watchdog = setTimeout(function () { hideLoading(); if (UI.toast) UI.toast('انتهت مهلة التحميل — تحقق من الاتصال وأعد المحاولة', 'error'); }, 25000);
        companyCall('get_valley_mfg_order_detail', { mo_uid: IS_NEW ? '' : MO_UID }).then(function (res) {
          CAN_SEE_COST = (res.can_see_cost !== false);
          RECIPE_OPTIONS = res.recipe_options || [];
          PRODUCT_OPTIONS = res.product_options || [];
          ENUMS = res.enums || {};
          WORKCENTER_OPTIONS = res.work_center_options || {};
          if (IS_NEW) {
            MO_STATUS = 'Draft';
            MFG_OUTPUTS = []; OUTPUT_FOOTERS = []; OUTPUT_BATCHES = []; MFG_WORKOPS = []; MFG_BYPRODUCTS = [];
            renderDetail({ transaction_code: '', mo_status: 'Draft', operation_type: '', shift: '', manufacture_date: '', expected_qty: '', manufactured_qty: '', actual_qty: '', produced_product: '', recipe_id: '' }, res);
          } else {
            var full = res;
            MO_STATUS = (res.order && res.order.mo_status) || 'Draft';
            MFG_OUTPUTS = (full.outputs || []).map(function (o) {
              return { uid: o.unique_id || '', product_id: String(o.product_id || ''), qty: o.product_qty != null ? o.product_qty : '', cost_unit: o.cost_unit || '', total_cost: o.total_cost || '', product_name: o.product_name || '' };
            });
            OUTPUT_FOOTERS = (full.outputs || []).map(function (o) {
              return (o.footers || []).map(function (f) { return { item: f.item || '', item_code: f.item_code || '', qty: f.qty != null ? f.qty : '', unit_cost: f.unit_cost != null ? f.unit_cost : 0, total_cost: f.total_cost != null ? f.total_cost : 0, saved: true }; });
            });
            OUTPUT_BATCHES = (full.outputs || []).map(function (o) { return o.batches || []; });
            MFG_WORKOPS = (res.workops || []).map(function (w) {
              /* U-45: work_center_cost / total_cost are sheet-computed and now
                 arrive from the server. They may be absent when the user has no
                 cost grant, so keep them undefined rather than defaulting to 0 —
                 the table tells the two cases apart. */
              return { uid: w.unique_id || '', work_center_id: String(w.work_center_id || ''), operation_status: w.operation_status || 'Pending', notes: w.notes || '', start_time: w.start_time || '', last_pause_time: w.last_pause_time || '', end_time: w.end_time || '', actual_hours: w.actual_hours != null ? w.actual_hours : '', work_center_cost: w.work_center_cost, total_cost: w.total_cost };
            });
            MFG_BYPRODUCTS = (res.byproducts || []).map(function (b) {
              return { uid: b.unique_id || '', item: String(b.item || ''), qty: b.qty || '', transaction_code: b.transaction_code || '', total_cost: b.total_cost || '' };
            });
            renderDetail(res.order, res);
          }
        }).catch(function (e) { if (UI.toast) UI.toast((e && e.message) || 'خطأ في التحميل', 'error'); })
          .finally(function () { clearTimeout(watchdog); hideLoading(); });
      }

      /* ---------- render ---------- */
      function renderDetail(order, full) {
        CURRENT_ORDER = order || {};
        var bar = '<div class="odoo-bar">' +
          '<div style="display:flex;align-items:center;gap:10px;"><h2>أمر تصنيع ' + esc(order.transaction_code || '#') + '</h2>' + statusPill(MO_STATUS) + '</div>' +
          '<div class="spacer">' + statusActionsHTML() +
            (editable() ? '<button class="btn btn-primary" onclick="UI.submitOnce(this, MFGVIEW_PAGE.saveHeader)">💾 حفظ</button>' : '') +
            '<button class="btn btn-outline" onclick="MFGVIEW_PAGE.printMo()">🖨️ طباعة</button>' +
            '<button class="btn btn-outline" onclick="MFGVIEW_PAGE.goBack()">← رجوع</button>' +
          '</div></div>';

        var headerCard = '<div class="odoo-card"><div class="odoo-card-h"><h3>بيانات الأمر</h3></div><div class="odoo-card-b">' +
          (MO_STATUS === 'Locked' && !IS_SUPER_ADMIN ? '<div class="odoo-ro" style="margin-bottom:10px;color:#b45309;">الأمر مقفل — العرض فقط (يلزم مدير النظام للتعديل).</div>' : '') +
          '<form id="mo-form"><input type="hidden" id="f-status" value="' + esc(MO_STATUS) + '">' +
          '<div class="odoo-grid">' +
            UIC.combo({ key: 'f-op-type', label: 'نوع العملية', required: true, options: selList_(ENUMS.operation_type), value: order.operation_type || '', placeholder: 'اكتب للبحث…' }) +
            UIC.combo({ key: 'f-shift', label: 'الوردية', required: true, options: selList_(ENUMS.shift), value: order.shift || '', placeholder: 'اكتب للبحث…' }) +
            UIC.field({ key: 'f-date', label: 'تاريخ التصنيع', type: 'date', required: true, value: toInputDate(order.manufacture_date) }) +
            UIC.field({ key: 'f-expected', label: 'الكمية المتوقعة (تلقائي = الخام × 0.65)', type: 'number', required: true, min: '0', step: '0.001', value: num0(order.expected_qty), disabled: true }) +
            UIC.field({ key: 'f-manufactured', label: 'كمية الخام الداخلة', type: 'number', required: true, min: '0', step: '0.001', value: num0(order.manufactured_qty) }) +
            UIC.field({ key: 'f-batch', label: 'رقم التشغيلة', type: 'text', value: esc(order.manufacture_batch || '') }) +
            UIC.field({ key: 'f-actual', label: 'الكمية الفعلية المنتجة', type: 'number', min: '0', step: '0.01', value: order.actual_qty != null ? num0(order.actual_qty) : '' }) +
          '</div>' +
          '<div class="odoo-grid" style="margin-top:14px;">' +
            UIC.combo({ key: 'f-product', label: 'المنتج المنتج', required: true, options: PRODUCT_OPTIONS, value: String(order.produced_product || ''), placeholder: 'اكتب للبحث…' }) +
            UIC.combo({ key: 'f-recipe', label: 'الوصفة', required: false, options: RECIPE_OPTIONS.filter(function (o) { return o.active !== false; }), value: String(order.recipe_id || ''), placeholder: 'اختر الوصفة (اختياري)…' }) +
          '</div>' +
          '</form></div></div>';

        var notebook = '<div class="odoo-nb">' +
          '<button class="odoo-tab active" onclick="MFGVIEW_PAGE.switchTab(\'tab-products\')">📦 الخامات الداخلة</button>' +
          '<button class="odoo-tab" onclick="MFGVIEW_PAGE.switchTab(\'tab-work\')">⚙️ ورديات التشغيل</button>' +
          '<button class="odoo-tab" onclick="MFGVIEW_PAGE.switchTab(\'tab-byproduct\')">♻️ المنتجات الثانوية</button>' +
          '</div>' +
          '<div id="tab-products" class="odoo-pane active"><div id="outputs-body"></div></div>' +
          '<div id="tab-work" class="odoo-pane"><div id="workops-body"></div></div>' +
          '<div id="tab-byproduct" class="odoo-pane"><div id="byproducts-body"></div></div>';

        root().innerHTML = bar + '<div class="odoo-wrap">' + renderKpiShell() + headerCard + renderApprovals(order) + notebook + '</div>';

        drawOutputs();
        drawWorkOps();
        drawByproducts();
        renderKpi();

        var rec = document.getElementById('f-recipe');
        if (rec && editable()) rec.addEventListener('change', function () { MFGVIEW_PAGE.onRecipeChange(); });

        var mEl = document.getElementById('f-manufactured'); var eEl = document.getElementById('f-expected');
        if (mEl && eEl) {
          eEl.disabled = true; eEl.readOnly = true;
          var recalcExpected = function () { var v = Number(mEl.value) || 0; eEl.value = (v * MFG_YIELD_FACTOR).toFixed(3); renderKpi(); };
          mEl.addEventListener('input', recalcExpected);
          mEl.addEventListener('change', recalcExpected);
          recalcExpected();
        }
        var aEl = document.getElementById('f-actual');
        if (aEl) { aEl.addEventListener('input', renderKpi); aEl.addEventListener('change', renderKpi); }
      }

      function renderKpiShell() {
        return '<div class="odoo-card"><div class="odoo-card-b" id="mo-kpi-body" style="padding:10px 12px;"></div></div>';
      }
      function renderKpi() {
        var host = document.getElementById('mo-kpi-body'); if (!host) return;
        var inv = 0;
        (OUTPUT_FOOTERS || []).forEach(function (frs) { (frs || []).forEach(function (f) { inv += (Number(f.unit_cost) || 0) * (Number(f.qty) || 0); }); });
        var ord = CURRENT_ORDER || {};
        var other = IS_NEW ? 0 : num0(ord.total_other_cost);
        var batch = IS_NEW ? inv : (num0(ord.total_batch_cost) || (inv + other));
        var actual = num0(getV_('f-actual')) || num0(ord.actual_qty);
        var unit = actual > 0 ? batch / actual : 0;
        /* U-46. The quantity tile stays; the four cost tiles go. */
        host.innerHTML = '<div style="display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:13px;">' +
          (canCost()
            ? '<div>🧪 تكلفة الخامات: <b>' + fmtMoney(inv) + '</b></div>' +
              '<div>⚙️ تكلفة التشغيل: <b>' + (IS_NEW ? 'تُحسب بعد الحفظ' : fmtMoney(other)) + '</b></div>' +
              '<div>📦 تكلفة الدفعة: <b>' + fmtMoney(batch) + '</b></div>'
            : '') +
          '<div>⚖️ الكمية الفعلية: <b>' + fmt3(actual) + '</b></div>' +
          (canCost() ? '<div>💰 تكلفة الوحدة: <b>' + (actual > 0 ? fmtMoney(unit) : '—') + '</b></div>' : '') +
          '</div>';
      }

      function renderApprovals(order) {
        var pa = order.production_approval || ''; var pat = order.production_approval_time || '';
        var qa = order.quality_approval || ''; var qat = order.quality_approval_time || '';
        var canApprove = !IS_NEW;
        return '<div class="odoo-card" style="margin-bottom:12px;"><div class="odoo-card-b" style="padding:10px 12px;">' +
          '<div class="odoo-ro" style="margin-bottom:6px;">الاعتمادات</div>' +
          '<div style="display:flex;gap:18px;flex-wrap:wrap;align-items:center;">' +
            '<div><b>اعتماد الإنتاج:</b> ' + (pa ? esc(uname_(pa)) + (pat ? ' — ' + fmtDateTime(pat) : '') : '<span class="odoo-ro">بانتظار</span>') + '</div>' +
            '<div><b>اعتماد الجودة:</b> ' + (qa ? esc(uname_(qa)) + (qat ? ' — ' + fmtDateTime(qat) : '') : '<span class="odoo-ro">بانتظار</span>') + '</div>' +
            (canApprove ? '<div style="display:flex;gap:8px;">' +
              '<button class="btn btn-outline" onclick="MFGVIEW_PAGE.approveMo(\'production\')">اعتماد الإنتاج</button>' +
              '<button class="btn btn-outline" onclick="MFGVIEW_PAGE.approveMo(\'quality\')">اعتماد الجودة</button></div>' : '') +
          '</div></div></div>';
      }

      function approveMo(kind) {
        if (!MO_UID) { UI.toast && UI.toast('احفظ الأمر أولاً', 'error'); return; }
        showLoading();
        companyCall('approve_valley_mfg_order', { mo_uid: MO_UID, kind: kind })
          .then(function (r) { UI.toast && UI.toast((r && r.message) || 'تم', 'success'); load(); })
          .catch(function (e) { UI.toast && UI.toast((e && e.message) || 'فشل', 'error'); })
          .finally(function () { hideLoading(); });
      }

      function printMo() {
        var w = window.open('', '_blank');
        if (!w) { UI.toast && UI.toast('تعذر فتح نافذة الطباعة', 'error'); return; }
        var order = CURRENT_ORDER || {};

      function selList_(list) { return (list || []).map(function (v) { return { value: v, label: v }; }); }

      function statusActionsHTML() {

      }
      function changeStatus(kind) {

      function switchTab(id) {

      /* ---------- OUTPUTS (valley_manufacture_header_products) ---------- */
      function addOutput() {
        MFG_OUTPUTS.push({ uid: '', product_id: '', qty: '', cost_unit: '', total_cost: '', product_name: '' });
        OUTPUT_FOOTERS.push([]); OUTPUT_BATCHES.push([]);
        /* U-43: append only. A full redraw here destroyed the combo the user was
           typing into on the row above. */
        appendOutputRow_(MFG_OUTPUTS.length - 1);
      }
      function removeOutput(i) {
        MFG_OUTPUTS.splice(i, 1); OUTPUT_FOOTERS.splice(i, 1); OUTPUT_BATCHES.splice(i, 1); drawOutputs();
      }
      function setOutputProduct(i, v) {
        MFG_OUTPUTS[i].product_id = v;
        var nm = ''; (PRODUCT_OPTIONS || []).forEach(function (p) { if (String(p.value) === String(v)) nm = p.label; });
        MFG_OUTPUTS[i].product_name = nm;
        if (v) {
          companyCall('get_valley_product_batches', { product_id: v }).then(function (r) { OUTPUT_BATCHES[i] = r.batches || []; autoAllocFifo_(i); redrawOutputRow_(i); })
            .catch(function () { OUTPUT_BATCHES[i] = []; redrawOutputRow_(i); });
        } else { OUTPUT_BATCHES[i] = []; OUTPUT_FOOTERS[i] = []; redrawOutputRow_(i); }
      }
      /* U-44. This used to skip re-allocation entirely once ANY batch had been
       * allocated by hand, so changing the quantity left quantity and batches
       * silently out of step until the save threw. Now:
       *   nothing allocated  -> full FIFO, as before;
       *   allocated < qty    -> keep every hand-made allocation and fill only
       *                         the shortfall, oldest-first;
       *   allocated > qty    -> say so. Silently discarding somebody's own
       *                         allocation would be worse than telling them,
       *                         and the per-row indicator (S8) shows where. */
      function setOutputQty(i, v) {
        MFG_OUTPUTS[i].qty = v;
        var existing = OUTPUT_FOOTERS[i] || [];
        if (!existing.length) {
          autoAllocFifo_(i);
        } else {
          var qty = round3(v);
          var keep = allocatedMap_(i);
          var sum = 0;
          Object.keys(keep).forEach(function (k) { sum = round3(sum + keep[k]); });
          if (round3(sum - qty) > BATCH_TOLERANCE) {
            UI.toast && UI.toast('الدفعات المخصصة (' + fmt3(sum) + ') أكبر من الكمية الجديدة (' + fmt3(qty) + ') — عدّل الدفعات من «+ دفعة».', 'warning');
          } else if (round3(qty - sum) > BATCH_TOLERANCE) {
            OUTPUT_FOOTERS[i] = fifoFill_(OUTPUT_BATCHES[i] || [], qty, keep);
          }
        }
        redrawOutputRow_(i);
      }
      function round3(v) { return Math.round((Number(v) || 0) * 1000) / 1000; }

      /* THE FIFO. There is one, and this is it — autoAllocFifo_ and the batch
       * modal both go through here, so oldest-first allocation can never drift
       * between the two.
       *
       * `keep` is an optional { batch_uid: qty } of allocations the user has
       * already made by hand. Those are honoured in batch order and count
       * against the requirement; only the SHORTFALL is filled, oldest-first,
       * from batches not already held. With no `keep` it behaves exactly as the
       * original autoAllocFifo_ did. */
      function fifoFill_(batches, qty, keep) {
        keep = keep || {};
        var out = [];
        var remaining = round3(qty);
        if (remaining <= 0 || !batches || !batches.length) return out;

        /* 1) what the user already allocated, in batch (oldest-first) order */
        batches.forEach(function (b) {
          var uid = String(b.batch_uid || '');
          var held = round3(keep[uid]);
          if (!uid || held <= 0) return;
          var row = { item: uid, item_code: String(b.lot || ''), qty: held };
          if (b.unit_cost != null) row.unit_cost = Number(b.unit_cost) || 0;
          out.push(row);
          remaining = round3(remaining - held);
        });

        /* 2) the shortfall, oldest-first, from batches not already held */
        for (var i = 0; i < batches.length && remaining > 0.0001; i++) {
          var bb = batches[i];
          var uid2 = String(bb.batch_uid || '');
          if (round3(keep[uid2]) > 0) continue;
          var avail = Number(bb.available) || 0;
          if (avail <= 0) continue;
          var take = avail >= remaining ? remaining : avail;
          var row2 = { item: uid2, item_code: String(bb.lot || ''), qty: round3(take) };
          if (bb.unit_cost != null) row2.unit_cost = Number(bb.unit_cost) || 0;
          out.push(row2);
          remaining = round3(remaining - take);
        }
        return out;
      }

      /* Allocate the output quantity across available batches FIFO (oldest-first). */
      function autoAllocFifo_(i) {
        var o = MFG_OUTPUTS[i]; if (!o) return;
        OUTPUT_FOOTERS[i] = fifoFill_(OUTPUT_BATCHES[i] || [], Number(o.qty) || 0, null);
      }

      /* What is currently allocated for material i, as { batch_uid: qty }. */
      function allocatedMap_(i) {
        var m = {};
        (OUTPUT_FOOTERS[i] || []).forEach(function (f) {
          var uid = String(f.item || '').trim();
          if (uid) m[uid] = round3((m[uid] || 0) + (Number(f.qty) || 0));
        });
        return m;
      }

      /* ---------- U-44: the FIFO batch modal ---------- */
      /* The server's tolerance, mirrored EXACTLY. Company_ValleyFoods_Actions.js
       * throws 'مجموع الدفعات للصنف … يجب أن يساوي كمية البند' when
       * Math.abs(paySum - payQty) > 0.01, both rounded to 3 decimals. A looser
       * client tolerance would accept an allocation the save then rejects. */
      var BATCH_TOLERANCE = 0.01;
      var BM = null;   /* { i, qty, rows:[{batch_uid,lot,available,alloc,unit_cost}] } */

      /* Pure: the current arithmetic of the open modal. */
      function batchModalState_() {
        if (!BM) return null;
        var sum = 0;
        var over = [];
        BM.rows.forEach(function (r, ix) {
          var a = round3(r.alloc);
          sum = round3(sum + a);
          if (a - (Number(r.available) || 0) > 0.0001) over.push(ix);
        });
        var qty = round3(BM.qty);
        var diff = round3(sum - qty);
        return {
          sum: sum, qty: qty, diff: diff,
          matched: Math.abs(diff) <= BATCH_TOLERANCE,
          over: over
        };
      }

      /* Pure: the running-total line. */
      function batchSummaryHtml_(st) {
        if (!st) return '';
        var head = 'مجموع الدفعات: ' + fmt3(st.sum) + ' من ' + fmt3(st.qty);
        if (st.matched) {
          return '<span style="color:var(--success,#0a7a34);font-weight:700;">✔ ' + head + '</span>' +
            (st.over.length ? '<div class="odoo-neg" style="margin-top:4px;">⚠ تجاوز المتاح في ' + st.over.length +
              ' دفعة — المتاح المعروض تقديري، والخادم يتحقق منه مقابل أرصدة الدفعات الفعلية عند الحفظ.</div>' : '');
        }
        var msg = st.diff < 0
          ? 'ينقص ' + fmt3(Math.abs(st.diff))
          : 'يزيد ' + fmt3(st.diff);
        return '<span class="odoo-neg" style="font-weight:700;">✖ ' + head + ' — ' + msg + '</span>' +
          (st.over.length ? '<div class="odoo-neg" style="margin-top:4px;">⚠ تجاوز المتاح في ' + st.over.length +
            ' دفعة — المتاح المعروض تقديري، والخادم يتحقق منه مقابل أرصدة الدفعات الفعلية عند الحفظ.</div>' : '');
      }

      function batchModalRowsHtml_() {
        return BM.rows.map(function (r, ix) {
          var alloc = round3(r.alloc);
          var remain = round3((Number(r.available) || 0) - alloc);
          var overCls = remain < -0.0001 ? 'odoo-neg' : 'odoo-ro';
          var lineTotal = (Number(r.unit_cost) || 0) * alloc;
          return '<tr>' +
            '<td>' + esc(r.lot || r.batch_uid) + '</td>' +
            '<td class="odoo-ro">' + fmt3(r.available) + '</td>' +
            '<td>' + inputHtml('bm-qty-' + ix, alloc || '', 'number', 'MFGVIEW_PAGE.batchModalSet(' + ix + ',this.value)', { min: '0', step: '0.001' }) + '</td>' +
            '<td id="bm-remain-' + ix + '" class="' + overCls + '">' + fmt3(remain) + '</td>' +
            (canCost()
              ? '<td class="odoo-ro">' + fmtMoney(r.unit_cost) + '</td><td id="bm-line-' + ix + '" class="odoo-ro">' + fmtMoney(lineTotal) + '</td>'
              : '') +
            '</tr>';
        }).join('');
      }

      function batchModalBodyHtml_() {
        var st = batchModalState_();
        return '<div class="odoo-ro" style="margin-bottom:8px;">' +
            esc(MFG_OUTPUTS[BM.i].product_name || MFG_OUTPUTS[BM.i].product_id || '') +
            ' — الكمية المطلوبة: <b>' + fmt3(BM.qty) + '</b>' +
          '</div>' +
          '<div style="overflow-x:auto;"><table class="odoo-table"><thead><tr>' +
            '<th>الدفعة (transaction_code)</th>' +
            '<th style="width:110px;">المتاح</th>' +
            '<th style="width:120px;">المخصص</th>' +
            '<th style="width:110px;">المتبقي</th>' +
            (canCost() ? '<th style="width:120px;">تكلفة الوحدة</th><th style="width:130px;">الإجمالي</th>' : '') +
          '</tr></thead><tbody>' + batchModalRowsHtml_() + '</tbody></table></div>' +
          '<div id="bm-summary" style="margin-top:10px;font-size:13px;">' + batchSummaryHtml_(st) + '</div>';
      }

      function batchModalFooterHtml_() {
        var st = batchModalState_();
        return '<button class="btn btn-outline" onclick="MFGVIEW_PAGE.batchModalCancel()">إلغاء</button> ' +
          '<button id="bm-confirm" class="btn btn-primary" ' + (st && st.matched ? '' : 'disabled ') +
          'onclick="MFGVIEW_PAGE.batchModalConfirm()">تأكيد</button>';
      }

      /* Opens on + دفعة. Runs FIFO over the shortfall only, so batches the user
         already chose are kept — the owner's "if there already chosen batches it
         continue". */
      function openBatchModal(i) {
        var o = MFG_OUTPUTS[i];
        if (!o) return;
        var qty = round3(o.qty);
        if (qty <= 0) { UI.toast && UI.toast('أدخل كمية الخامة أولاً', 'error'); return; }
        var batches = (OUTPUT_BATCHES[i] || []);
        if (!batches.length) { UI.toast && UI.toast('لا توجد دفعات متاحة لهذه الخامة', 'error'); return; }

        var keep = allocatedMap_(i);
        var proposed = fifoFill_(batches, qty, keep);
        var byUid = {};
        proposed.forEach(function (p) { byUid[p.item] = round3((byUid[p.item] || 0) + p.qty); });

        /* One row per batch, oldest-first (the server already sorts them that
           way), plus any already-allocated batch that is no longer offered — a
           saved row whose batch is now exhausted must stay visible and editable
           rather than vanish. */
        var rows = batches.map(function (b) {
          var uid = String(b.batch_uid || '');
          return {
            batch_uid: uid, lot: String(b.lot || uid),
            available: Number(b.available) || 0,
            unit_cost: b.unit_cost,
            alloc: round3(byUid[uid] || 0)
          };
        });
        var seen = {};
        rows.forEach(function (r) { seen[r.batch_uid] = true; });
        Object.keys(keep).forEach(function (uid) {
          if (seen[uid]) return;
          var f = (OUTPUT_FOOTERS[i] || []).filter(function (x) { return String(x.item) === uid; })[0] || {};
          rows.push({ batch_uid: uid, lot: String(f.item_code || uid), available: 0, unit_cost: f.unit_cost, alloc: round3(keep[uid]) });
        });

        BM = { i: i, qty: qty, rows: rows };
        UIC.openModal('vf-batch-modal', {
          title: 'تخصيص الدفعات (FIFO — الأقدم أولاً)',
          size: 'lg',
          body: batchModalBodyHtml_(),
          footer: batchModalFooterHtml_()
        });
      }

      /* In-place update: the row's remaining, its line total, the running total
         and the confirm button. The table is NOT re-rendered, so the number
         being typed into keeps its focus and caret. */
      function batchModalSet(ix, v) {
        if (!BM || !BM.rows[ix]) return;
        BM.rows[ix].alloc = Number(v) || 0;
        var st = batchModalState_();
        var alloc = round3(BM.rows[ix].alloc);
        var remain = round3((Number(BM.rows[ix].available) || 0) - alloc);
        var rEl = document.getElementById('bm-remain-' + ix);
        if (rEl) {
          rEl.textContent = fmt3(remain);
          rEl.className = remain < -0.0001 ? 'odoo-neg' : 'odoo-ro';
        }
        var lEl = document.getElementById('bm-line-' + ix);
        if (lEl) lEl.textContent = fmtMoney((Number(BM.rows[ix].unit_cost) || 0) * alloc);
        var sEl = document.getElementById('bm-summary');
        if (sEl) sEl.innerHTML = batchSummaryHtml_(st);
        var cEl = document.getElementById('bm-confirm');
        if (cEl) cEl.disabled = !st.matched;
      }

      /* Cancel leaves the existing allocation exactly as it was. */
      function batchModalCancel() { BM = null; UIC.closeModal('vf-batch-modal'); }

      function batchModalConfirm() {
        if (!BM) return;
        var st = batchModalState_();
        if (!st.matched) return;   /* the button is disabled; belt and braces */
        var i = BM.i;
        OUTPUT_FOOTERS[i] = BM.rows
          .filter(function (r) { return round3(r.alloc) > 0; })
          .map(function (r) {
            var row = { item: r.batch_uid, item_code: r.lot, qty: round3(r.alloc) };
            if (r.unit_cost != null) row.unit_cost = Number(r.unit_cost) || 0;
            return row;
          });
        BM = null;
        UIC.closeModal('vf-batch-modal');
        redrawOutputRow_(i);
      }

      function addFooterRow(i) { if (!OUTPUT_FOOTERS[i]) OUTPUT_FOOTERS[i] = []; OUTPUT_FOOTERS[i].push({ item: '', item_code: '', qty: '' }); redrawOutputRow_(i); }
      function removeFooterRow(i, fi) { OUTPUT_FOOTERS[i].splice(fi, 1); redrawOutputRow_(i); }
      function setFooterItem(i, fi, el) {
        OUTPUT_FOOTERS[i][fi].item = el.value;
        var opt = el.selectedOptions && el.selectedOptions[0];
        OUTPUT_FOOTERS[i][fi].item_code = opt ? opt.getAttribute('data-code') : '';
        OUTPUT_FOOTERS[i][fi].unit_cost = opt ? (Number(opt.getAttribute('data-unitcost')) || 0) : 0;
        refreshFooterRow_(i, fi);
      }
      function setFooterQty(i, fi, v) { OUTPUT_FOOTERS[i][fi].qty = v; refreshFooterRow_(i, fi); }
      function refreshFooterRow_(i, fi) {
        var sel = document.getElementById('ft-item-' + i + '-' + fi);
        var tr = sel && sel.closest ? sel.closest('tr') : null;
        if (!tr) return;
        var f = (OUTPUT_FOOTERS[i] || [])[fi]; if (!f) return;
        var batches = OUTPUT_BATCHES[i] || [];
        var b = null; for (var bi = 0; bi < batches.length; bi++) { if (String(batches[bi].batch_uid) === String(f.item)) { b = batches[bi]; break; } }
        var avail = b ? (Number(b.available) || 0) : 0;
        var alloc = Number(f.qty) || 0;
        if (f.saved) {
          tr.cells[1].textContent = '—';
          tr.cells[3].textContent = '—'; tr.cells[3].className = 'odoo-ro';
        } else {
          var remain = avail - alloc;
          tr.cells[1].textContent = fmt3(avail);
          tr.cells[3].textContent = fmt3(remain);
          tr.cells[3].className = remain < -0.0001 ? 'odoo-neg' : 'odoo-ro';
        }
        /* U-46. Cell 4 is the line-total column, which is not rendered without
           the cost grant — writing to it blind would overwrite the delete
           button's cell. */
        if (canCost() && tr.cells[4]) tr.cells[4].textContent = fmtMoney((Number(f.unit_cost) || 0) * alloc);
        /* U-43: keep the row's allocated/short/over indicator honest while the
           user types, without re-rendering the row underneath them. */
        var sEl = document.getElementById('out-sum-' + i);
        if (sEl) sEl.innerHTML = outputSummaryInnerHtml_(i);

      /* U-43. The allocation state of one material, for the row indicator. */
      function outputAllocState_(i) {
        var footers = OUTPUT_FOOTERS[i] || [];
        var qty = round3((MFG_OUTPUTS[i] || {}).qty);
        var sum = 0;
        footers.forEach(function (f) { sum = round3(sum + (Number(f.qty) || 0)); });
        var diff = round3(sum - qty);
        return {
          count: footers.length, sum: sum, qty: qty, diff: diff,
          state: (qty <= 0 || !footers.length) ? 'none'
            : (Math.abs(diff) <= BATCH_TOLERANCE ? 'ok' : (diff < 0 ? 'short' : 'over'))

      }

      /* U-43. The one-line summary every material row carries: what it is, how
         much, how many batches, the allocated/short/over state, and — only with
         the grant — the cost. */

              : '<span class="odoo-ro">— لم تُخصص دفعات بعد</span>';
        return (o.product_name ? '<span>الصنف: ' + esc(o.product_name) + '</span>' : '') +
          '<span>الكمية: ' + fmt3(st.qty) + '</span>' +
          '<span>الدفعات: ' + st.count + ' (' + fmt3(st.sum) + ')</span>' +
          (canCost() && footers.length ? '<span>إجمالي التكلفة: ' + fmtMoney(outTotal) + '</span>' : '') +
          badge;
      }

      /* U-43. The inside of one material row. Kept separate from the wrapper so
         a single row can be re-rendered without touching its siblings — the
         combo the user is typing into lives in a sibling and must survive. */
      function outputRowInner_(i) {
          var o = MFG_OUTPUTS[i];
          var footers = OUTPUT_FOOTERS[i] || [];
          var outTotal = footers.reduce(function (s, f) { return s + (Number(f.unit_cost) || 0) * (Number(f.qty) || 0); }, 0);

            var avail = b ? (Number(b.available) || 0) : 0;

            var batchOpts = batches.map(function (bt) { return { value: bt.batch_uid, label: (bt.lot || bt.batch_uid) + ' (متاح: ' + Number(bt.available || 0).toLocaleString('en-US') + ')' }; });
            if (f.item && !batchOpts.some(function (bo) { return String(bo.value).trim() === String(f.item).trim(); })) {
              batchOpts.push({ value: f.item, label: (f.item_code || f.item) + ' (متاح: 0)' });
            }
            return '<tr style="background:#f3faf3;">' +
              '<td>' + selHtml('ft-item-' + i + '-' + fi, batchOpts, f.item, 'MFGVIEW_PAGE.setFooterItem(' + i + ',' + fi + ',this)', '— اختر دفعة —', disOpt()) + '</td>' +
              '<td class="odoo-ro">' + availCell + '</td>' +
              '<td>' + inputHtml('ft-qty-' + i + '-' + fi, f.qty, 'number', 'MFGVIEW_PAGE.setFooterQty(' + i + ',' + fi + ',this.value)', { min: '0', step: '0.001', disabled: !editable() }) + '</td>' +
              '<td class="' + remainCellCls + '">' + remainCell + '</td>' +
              (canCost() ? '<td class="odoo-ro">' + fmtMoney(lineTotal) + '</td>' : '') +
              (editable() ? '<td><button class="btn btn-ghost" style="padding:2px 6px;font-size:11px;" onclick="MFGVIEW_PAGE.removeFooterRow(' + i + ',' + fi + ')">✕</button></td>' : '<td></td>') +
              '</tr>';
          }).join('');
          /* U-43. The batch sub-table appears only once there is a product AND
             a quantity. The old code rendered an empty table reading
             "لا توجد دفعات مسجلة" before the user had entered anything. */
          var ready = !!String(o.product_id || '').trim() && round3(o.qty) > 0;
          var footerTable = !ready
            ? ''
            : footers.length
              ? '<table class="odoo-table"><thead><tr><th>الدفعة (transaction_code)</th><th style="width:110px;">المتاح</th><th style="width:120px;">المخصص</th><th style="width:110px;">المتبقي</th>' + (canCost() ? '<th style="width:130px;">إجمالي التكلفة</th>' : '') + '<th style="width:30px;"></th></tr></thead><tbody>' + footerRows + '</tbody></table>'
              : '<div class="odoo-ro" style="padding:4px;">اضغط «+ دفعة» لتخصيص الدفعات آلياً (الأقدم أولاً)</div>';
          var prodCell = editable()

          return '<div class="odoo-card-b" style="padding:10px 12px;">' +
            '<div class="odoo-grid" style="grid-template-columns:1fr 150px 40px;">' +
              '<div class="odoo-fld"><label>الخامة الداخلة</label>' + prodCell + '</div>' +
              '<div class="odoo-fld"><label>الكمية</label>' + inputHtml('out-qty-' + i, o.qty, 'number', 'MFGVIEW_PAGE.setOutputQty(' + i + ',this.value)', { min: '0.001', step: '0.001', disabled: !editable() }) + '</div>' +
              (editable() ? '<div style="display:flex;align-items:flex-end;"><button class="btn btn-ghost" style="padding:6px 8px;" onclick="MFGVIEW_PAGE.removeOutput(' + i + ')">✕</button></div>' : '<div></div>') +
            '</div>' +
            (ready
              ? '<div class="odoo-sub">' +
                  '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;"><span class="odoo-ro">🧪 المواد المستهلكة (الدفعات)</span>' + (editable() ? '<button class="btn btn-outline" style="padding:2px 8px;font-size:11px;" onclick="MFGVIEW_PAGE.openBatchModal(' + i + ')">+ دفعة</button>' : '') + '</div>' +
                  footerTable +
                '</div>'

            outputSummaryHtml_(i) +
            '</div>';
      }

      function outputRowHtml_(i) {
        return '<div class="odoo-card" id="out-row-' + i + '" style="margin-bottom:10px;">' + outputRowInner_(i) + '</div>';
      }

      /* Listeners and batch selects for ONE row. */
      function wireOutputRow_(i) {
        if (editable()) {
          var el = document.getElementById('out-prod-' + i);
          if (el) el.addEventListener('change', function () { MFGVIEW_PAGE.setOutputProduct(i, el.value); });
        }
        (OUTPUT_FOOTERS[i] || []).forEach(function (f, fi) {
          populateFooterItem(i, fi, (MFG_OUTPUTS[i] || {}).product_id, f.item);
        });

      /* U-43. Re-render ONE material row. drawOutputs() used to run on every
       * keystroke path, rebuilding every card and destroying the combo the user
       * was typing into. This is the same in-place discipline the TopLight sales
       * page applies for the same reason (Company_TopLight_Sales.html:318-330). */
      function redrawOutputRow_(i) {
        var host = document.getElementById('out-row-' + i);
        if (!host) { drawOutputs(); return; }
        host.innerHTML = outputRowInner_(i);
        wireOutputRow_(i);
        renderKpi();
      }

      /* Append a newly added material without touching the existing rows. */
      function appendOutputRow_(i) {
        var host = document.getElementById('outputs-rows');
        if (!host) { drawOutputs(); return; }

        renderKpi();

      function drawOutputs() {
        var tb = document.getElementById('outputs-body'); if (!tb) return;
        var mfgQty = Number(getV_('f-manufactured')) || 0;
        if (!MFG_OUTPUTS.length) {
          if (!mfgQty) {

              + (editable() ? '<button class="btn btn-outline" onclick="MFGVIEW_PAGE.addOutput()">+ خامة داخلة</button>' : '');

          }

        tb.innerHTML = '<div id="outputs-rows">' +
            MFG_OUTPUTS.map(function (o, i) { return outputRowHtml_(i); }).join('') +
          '</div>' +
          (editable() ? '<button class="btn btn-outline" onclick="MFGVIEW_PAGE.addOutput()">+ خامة داخلة</button>' : '');

      function populateFooterItem(i, fi, productId, selUid) {
        var sel = document.getElementById('ft-item-' + i + '-' + fi);
        if (!sel) return;
        if (!productId) { sel.innerHTML = '<option value="">— اختر منتج الناتج أولاً —</option>'; sel.disabled = !editable(); return; }
        function fill(list) {
          var selStr = String(selUid == null ? '' : selUid).trim();
          var opts = (list || []).filter(function (b) { return Number(b.available) > 0 || (selStr && String(b.batch_uid).trim() === selStr); });
          var html = '<option value="">— اختر دفعة —</option>';
          opts.forEach(function (b) {
            var code = b.lot || b.batch_uid;
            html += '<option value="' + esc(b.batch_uid) + '" data-code="' + esc(code) + '" data-unitcost="' + esc(b.unit_cost) + '"' + (selStr && String(b.batch_uid).trim() === selStr ? ' selected' : '') + '>' + esc(code) + ' (متاح: ' + Number(b.available).toLocaleString('en-US') + ')</option>';
          });
          if (selStr && !opts.some(function (b) { return String(b.batch_uid).trim() === selStr; })) {
            var saved = ((OUTPUT_FOOTERS[i] || [])[fi]) || {};
            var savedCode = saved.item_code || selStr;
            var savedCost = (saved.unit_cost != null && saved.unit_cost !== '') ? saved.unit_cost : 0;
            html += '<option value="' + esc(selStr) + '" data-code="' + esc(savedCode) + '" data-unitcost="' + esc(savedCost) + '" selected>' + esc(savedCode) + ' (متاح: 0)</option>';
          }
          sel.innerHTML = html;
          sel.disabled = !editable();
        }
        var pre = OUTPUT_BATCHES[i];
        if (pre && pre.length) { fill(pre); }
        else { companyCall('get_valley_product_batches', { product_id: productId }).then(function (r) { OUTPUT_BATCHES[i] = r.batches || []; fill(OUTPUT_BATCHES[i]); }).catch(function () { sel.innerHTML = '<option value="">خطأ في تحميل الدفعات</option>'; }); }
      }

      /* ---------- WORK OPS (valley_manufacture_work_center) ---------- */
      var WO_STATUSES = ['Pending', 'In Progress', 'Paused', 'Done'];
      function addWorkOp() {
        MFG_WORKOPS.push({ uid: '', work_center_id: '', operation_status: 'Pending', notes: '', start_time: '', end_time: '', last_pause_time: '', total_pause_duration: 0, actual_hours: '' });
        drawWorkOps();
      }
      function removeWorkOp(i) { MFG_WORKOPS.splice(i, 1); drawWorkOps(); }
      function setWorkOp(i, field, val) { MFG_WORKOPS[i][field] = val; }
      function clockWorkOp(i, command) {
        var w = MFG_WORKOPS[i];
        if (!w) return;
        if (w.uid) {
          showLoading();
          companyCall('control_valley_mfg_workop', { workop_uid: w.uid, command: command, start_time: w.start_time, end_time: w.end_time })
            .then(function (r) {
              var up = r && r.workop;
              if (up) {
                MFG_WORKOPS[i].operation_status = up.operation_status || MFG_WORKOPS[i].operation_status;
                MFG_WORKOPS[i].start_time = up.start_time || MFG_WORKOPS[i].start_time;
                MFG_WORKOPS[i].end_time = up.end_time || MFG_WORKOPS[i].end_time;
                MFG_WORKOPS[i].last_pause_time = up.last_pause_time || '';
                MFG_WORKOPS[i].total_pause_duration = up.total_pause_duration != null ? up.total_pause_duration : MFG_WORKOPS[i].total_pause_duration;
                MFG_WORKOPS[i].actual_hours = up.actual_hours != null ? up.actual_hours : MFG_WORKOPS[i].actual_hours;
              }
              UI.toast && UI.toast((r && r.message) || 'تم', 'success');
              drawWorkOps();
            })
            .catch(function (e) { UI.toast && UI.toast((e && e.message) || 'فشل', 'error'); })
            .finally(function () { hideLoading(); });
        } else {
          /* unsaved op — apply locally; persists when the MO is saved */
          if (command === 'start') { w.operation_status = 'In Progress'; if (!w.start_time) w.start_time = new Date(); }
          else if (command === 'pause') { w.operation_status = 'Paused'; w.last_pause_time = new Date(); }
          else if (command === 'resume') { w.operation_status = 'In Progress'; w.last_pause_time = ''; }
          else if (command === 'stop') {
            w.operation_status = 'Done';
            if (!w.end_time) w.end_time = new Date();
            var st = w.start_time ? new Date(w.start_time) : null;
            var et = w.end_time ? new Date(w.end_time) : null;
            if (st && et && !isNaN(st.getTime()) && !isNaN(et.getTime())) {
              var ms = et.getTime() - st.getTime();
              var pause = Number(w.total_pause_duration) || 0;
              w.actual_hours = Math.round((ms / 3600000 - pause) * 100) / 100;
            }
          }
          drawWorkOps();
        }
      }
      /* U-45. The two sheet-computed cost columns of the work-ops table.
         Kept as small helpers so the cost gate (S6) has one place to switch. */
      function wcCostHeaders() {
        if (!canCost()) return '';
        return '<th style="width:120px;">تكلفة المركز</th><th style="width:120px;">الإجمالي</th>';
      }
      function wcCostCells(w) {
        if (!canCost()) return '';
        var unsaved = !w.uid;
        var wcc = unsaved ? '—' : fmtMoney(w.work_center_cost);
        var tot = unsaved ? '—' : fmtMoney(w.total_cost);
        return '<td class="odoo-ro">' + wcc + '</td><td class="odoo-ro">' + tot + '</td>';
      }
      function drawWorkOps() {
        var tb = document.getElementById('workops-body'); if (!tb) return;
        function statusLabel(s) { return s === 'Done' ? 'منتهية' : (s === 'Paused' ? 'متوقف مؤقتاً' : (s === 'In Progress' ? 'قيد التشغيل' : 'بانتظار')); }
        function dt(v) { return fmtDateTime(v); }
        function rowBtns(i, w, canClock) {
          if (!canClock) return '';
          var st = w.operation_status;
          if (st === 'Pending') return (w.start_time && w.end_time)
            ? '<button class="btn btn-primary" style="padding:3px 10px;font-size:11px;" onclick="MFGVIEW_PAGE.clockWorkOp(' + i + ',\'stop\')">✔ إنهاء</button>'
            : '<button class="btn btn-primary" style="padding:3px 10px;font-size:11px;" onclick="MFGVIEW_PAGE.clockWorkOp(' + i + ',\'start\')">▶ بدء</button>';
          if (st === 'In Progress') return '<button class="btn btn-outline" style="padding:3px 10px;font-size:11px;" onclick="MFGVIEW_PAGE.clockWorkOp(' + i + ',\'pause\')">⏸ إيقاف مؤقت</button> <button class="btn btn-outline" style="padding:3px 10px;font-size:11px;" onclick="MFGVIEW_PAGE.clockWorkOp(' + i + ',\'stop\')">⏹ إنهاء</button>';
          if (st === 'Paused') return '<button class="btn btn-outline" style="padding:3px 10px;font-size:11px;" onclick="MFGVIEW_PAGE.clockWorkOp(' + i + ',\'resume\')">▶ استئناف</button> <button class="btn btn-outline" style="padding:3px 10px;font-size:11px;" onclick="MFGVIEW_PAGE.clockWorkOp(' + i + ',\'stop\')">⏹ إنهاء</button>';
          return '';
        }
        function toDtInput(v) { if (!v) return ''; var d = (v instanceof Date) ? v : new Date(v); if (isNaN(d.getTime())) return ''; var p = function (n) { return n < 10 ? '0' + n : '' + n; }; return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()); }
        var rows = MFG_WORKOPS.map(function (w, i) {
          var canClock = editable() || IS_SUPER_ADMIN;
          var timing = '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px;">' +
              inputHtml('wo-start-' + i, toDtInput(w.start_time), 'datetime-local', 'MFGVIEW_PAGE.setWorkOp(' + i + ',\'start_time\',this.value)', { disabled: !editable() }) +
              inputHtml('wo-end-' + i, toDtInput(w.end_time), 'datetime-local', 'MFGVIEW_PAGE.setWorkOp(' + i + ',\'end_time\',this.value)', { disabled: !editable() }) +
            '</div>' + rowBtns(i, w, canClock);
          return '<tr>' +
            '<td>' + selHtml('wo-wc-' + i, WORKCENTER_OPTIONS, w.work_center_id, 'MFGVIEW_PAGE.setWorkOp(' + i + ',\'work_center_id\',this.value)', 'اختر مركز العمل', disOpt()) + '</td>' +
            '<td><span class="odoo-pill ' + (w.operation_status === 'Done' ? 'Done' : (w.operation_status === 'Paused' ? 'Paused' : (w.operation_status === 'In Progress' ? 'InProgress' : 'Draft'))) + '">' + statusLabel(w.operation_status) + '</span></td>' +
            '<td>' + inputHtml('wo-notes-' + i, w.notes, 'text', 'MFGVIEW_PAGE.setWorkOp(' + i + ',\'notes\',this.value)', disOpt()) + '</td>' +
            '<td style="min-width:240px;">' + timing + '</td>' +
            '<td class="odoo-ro">' + fmt3(w.actual_hours) + '<div style="font-size:10px;color:#888;">توقف: ' + fmt3(w.total_pause_duration) + '</div></td>' +
            /* U-45: read-only, sheet-computed. An unsaved row has no cost yet —
               the formulas run on save — so it shows a dash, not a false zero. */
            wcCostCells(w) +
            (editable() ? '<td><button class="btn btn-ghost" style="padding:2px 6px;font-size:11px;" onclick="MFGVIEW_PAGE.removeWorkOp(' + i + ')">✕</button></td>' : '<td></td>') +
            '</tr>';
        }).join('');
        var addBtn = editable() ? '<button class="btn btn-outline" style="margin-top:8px;" onclick="MFGVIEW_PAGE.addWorkOp()">+ عملية تشغيل</button>' : '';
        tb.innerHTML = (MFG_WORKOPS.length
          ? '<table class="odoo-table"><thead><tr><th>مركز العمل</th><th>الحالة</th><th>ملاحظات</th><th>بدء / إنهاء (توقيت يدوي)</th><th>الساعات الفعلية</th>' + wcCostHeaders() + '<th></th></tr></thead><tbody>' + rows + '</tbody></table>'
          : '<div class="odoo-ro">لا توجد ورديات تشغيل</div>') + addBtn;
      }

      /* ---------- BY-PRODUCTS (valley_manufacture_by_product) ---------- */

          : '<div class="odoo-ro">لا توجد منتجات ثانوية</div>') + addBtn;

      /* ---------- RECIPE AUTO-GRASP ---------- */
      function onRecipeChange() {
        var recipeUid = getCombo_('f-recipe');
        var qty = num0(getV_('f-manufactured'));
        if (!recipeUid || qty <= 0) { UI.toast && UI.toast('اختر الوصفة والكمية المصنعة أولاً', 'error'); return; }
        showLoading();
        companyCall('get_valley_recipe_plan', { recipe_uid: recipeUid, qty: qty })
          .then(function (r) {
            autofillWorkOps(r.ops || []);
            return autofillOutputs(r.materials || []);
          })
          .then(function () { UI.toast && UI.toast('تم جلب بنود الوصفة — راجعها وعدّلها قبل الحفظ', 'success'); })
          .catch(function (e) { UI.toast && UI.toast((e && e.message) || 'خطأ في جفت الوصفة', 'error'); })
          .finally(function () { hideLoading(); });
      }
      function autofillWorkOps(ops) {
        MFG_WORKOPS = (ops || []).map(function (op) {
          return { uid: '', work_center_id: String(op.work_center_id || ''), operation_status: 'Pending', notes: op.step_name || '', start_time: '', end_time: '', actual_hours: '' };
        });
        drawWorkOps();
      }
      function autofillOutputs(materials) {
        (materials || []).forEach(function (m) {
          var pid = String(m.raw_material_id || '');
          if (!pid) return;
          var existing = -1;
          for (var k = 0; k < MFG_OUTPUTS.length; k++) { if (String(MFG_OUTPUTS[k].product_id) === pid) { existing = k; break; } }
          if (existing === -1) {
            var rQty = Math.ceil(num0(m.required_qty) / 10) * 10;
            MFG_OUTPUTS.push({ uid: '', product_id: pid, qty: rQty, cost_unit: '', total_cost: '', product_name: m.raw_material_name || '' });
            OUTPUT_FOOTERS.push([]);
          }
        });
        var pending = allocateBatchesAll();
        return pending.then(function () { drawOutputs(); });
      }
      function allocateBatchesAll() {
        var pids = MFG_OUTPUTS.map(function (o) { return o.product_id; });
        var hasManual = (OUTPUT_FOOTERS || []).some(function (frs) { return (frs || []).length; });
        if (hasManual && !window.confirm('جلب الوصفة سيستبدل الدفعات الحالية. متابعة؟')) return Promise.resolve();
        OUTPUT_FOOTERS = MFG_OUTPUTS.map(function () { return []; });
        if (!pids.filter(function (p) { return p; }).length) return Promise.resolve();
        return companyCall('get_valley_product_batches_multi', { product_ids: pids }).then(function (r) {
          var byProduct = (r && r.batches_by_product) || {};
          MFG_OUTPUTS.forEach(function (o, i) {
            var batches = (byProduct[String(o.product_id)] || []).filter(function (b) { return Number(b.available) > 0; });
            OUTPUT_BATCHES[i] = byProduct[String(o.product_id)] || [];
            var remaining = num0(o.qty), footers = [];
            batches.forEach(function (b) {
              if (remaining <= 0) return;
              var avail = Number(b.available) || 0;
              if (avail <= 0) return;
              var take = Math.min(remaining, avail);
              var uc = Number(b.unit_cost) || 0;
              footers.push({ item: b.batch_uid, item_code: b.lot || b.batch_uid, qty: take, unit_cost: uc, total_cost: uc * take });
              remaining -= take;
            });
            OUTPUT_FOOTERS[i] = footers;
          });
        });
      }
      /* ---------- SAVE (consolidated) ---------- */
      function saveHeader() {
        if (UIC.validateForm && !UIC.validateForm('mo-form')) return;
        var outputs = MFG_OUTPUTS.map(function (o, i) {
          var pid = o.product_id || (function () { var el = document.getElementById('out-prod-' + i); return el ? el.value : ''; })();
          /* U-47/U-46: unit_cost is deliberately NOT sent. The server resolves
             it from valley_current_products and ignores the payload's value, so
             a client without the cost grant (which has no unit_cost to send)
             saves exactly as correctly as one with it. */
          var footers = (OUTPUT_FOOTERS[i] || []).filter(function (f) { return f.item; }).map(function (f) { return { item: f.item, item_code: f.item_code, qty: f.qty }; });
          return { product_id: pid, qty: o.qty, footers: footers };
        }).filter(function (o) { return o.product_id && num0(o.qty) > 0; });
        if (!outputs.length) { UI.toast && UI.toast('أضف خامة داخلة واحدة على الأقل', 'error'); return; }
        for (var si = 0; si < outputs.length; si++) {
          var sq = Math.round((Number(outputs[si].qty) || 0) * 1000) / 1000;
          var ss = Math.round(outputs[si].footers.reduce(function (t, f) { return t + (Number(f.qty) || 0); }, 0) * 1000) / 1000;
          if (Math.abs(ss - sq) > 0.01) {
            var sName = (MFG_OUTPUTS[si] && MFG_OUTPUTS[si].product_name) || outputs[si].product_id;
            try { console.error('[MFGVIEW][save] footer sum mismatch:', sName, 'sum=' + ss, 'qty=' + sq); } catch (eLgS) {}
            UI.toast && UI.toast('مجموع الدفعات للصنف (' + sName + ') يجب أن يساوي الكمية (' + sq + '). المجموع الحالي: ' + ss, 'error');
            return;
          }
        }

        var payload = {
          mo_uid: MO_UID,
          manufacture_date: getV_('f-date'),
          operation_type: getCombo_('f-op-type'),
          shift: getCombo_('f-shift'),
          produced_product_id: getCombo_('f-product'),
          expected_qty: getV_('f-expected'),
          manufactured_qty: getV_('f-manufactured'),
          actual_qty: getV_('f-actual'),
          recipe_id: getCombo_('f-recipe'),
          mo_status: getV_('f-status'),
          manufacture_batch: getV_('f-batch'),
          outputs: outputs,
          work_ops: MFG_WORKOPS.map(function (w) { return { uid: w.uid, work_center_id: w.work_center_id, operation_status: w.operation_status, notes: w.notes, start_time: w.start_time, last_pause_time: w.last_pause_time, end_time: w.end_time, actual_hours: w.actual_hours, total_pause_duration: w.total_pause_duration }; }),
          byproducts: MFG_BYPRODUCTS.map(function (b, bi) { return { item: b.item || getCombo_('bp-item-' + bi), qty: b.qty, transaction_code: b.transaction_code, total_cost: b.total_cost }; }),
          consumption: []
        };
        try { console.log('[MFGVIEW][save] outgoing payload:', JSON.stringify(payload)); } catch (eLog) { console.log('[MFGVIEW][save] outgoing payload (raw):', payload); }
        showLoading();
        companyCall('save_valley_mfg_order', payload)
          .then(function (r) {
            try { console.log('[MFGVIEW][save] server response:', JSON.stringify(r)); } catch (eLog2) { console.log('[MFGVIEW][save] server response (raw):', r); }
            UI.toast && UI.toast((r && r.message) || 'تم الحفظ بنجاح', 'success');
            if (IS_NEW && r && r.mo_uid) {
              var listUrl = scriptUrl + '?action=vf_mfg_orders&sessionToken=' + SESSION_TOKEN;
              try { if (window.opener && !window.opener.closed) window.opener.location.href = listUrl; } catch (eOp) {}
              window.close();
              setTimeout(function () { try { window.location.href = listUrl; } catch (eNav) {} }, 400);
              return;
            }
            load();
            if (window.confirm('تم حفظ أمر التصنيع. هل تريد إدخال بيانات التشغيل (الخطوات/الدفعات) الآن؟')) { switchTab('workops'); }
          })
          .catch(function (e) { try { console.error('[MFGVIEW][save] FAILED:', (e && e.message) || e); } catch (eLog3) {} UI.toast && UI.toast((e && e.message) || 'فشل الحفظ', 'error'); })
          .finally(function () { hideLoading(); });
      }

      window.MFGVIEW_PAGE = {
        load: load, renderDetail: renderDetail, saveHeader: saveHeader, goBack: goBack,
        switchTab: switchTab, changeStatus: changeStatus, onRecipeChange: onRecipeChange,
        addOutput: addOutput, removeOutput: removeOutput, setOutputProduct: setOutputProduct, setOutputQty: setOutputQty,
        addFooterRow: addFooterRow, removeFooterRow: removeFooterRow, setFooterItem: setFooterItem, setFooterQty: setFooterQty,
        openBatchModal: openBatchModal, batchModalSet: batchModalSet,
        batchModalConfirm: batchModalConfirm, batchModalCancel: batchModalCancel,
        addWorkOp: addWorkOp, removeWorkOp: removeWorkOp, setWorkOp: setWorkOp, clockWorkOp: clockWorkOp,
        addByproduct: addByproduct, removeByproduct: removeByproduct, setByproduct: setByproduct,
        approveMo: approveMo, printMo: printMo
      };
      document.addEventListener('DOMContentLoaded', load);
    })();
  </script>
</body>
