    }

      border: 1px dashed var(--border-color);
      border-radius: var(--radius-sm);

      background: var(--bg-subtle);
    }
  </style>
</head>
<body>
<div id="tc-root" dir="rtl"></div>
<script>
  var params = new URLSearchParams(window.location.search);
  var SESSION_TOKEN = params.get('sessionToken') || (API.getSession() || {}).token || '';
  var scriptUrl = window.scriptUrl || '/';
  var IS_SUPER_ADMIN = <?!= user && user.isSuperAdmin ? 'true' : 'false' ?>;
  var COMPANY_LOGO_URL = '<?!= getCompanyLogoUrl_('3fe1b5cb67b7223e') ?>';
  var COMPANY_PAGES = <?!= companyPages ?>;
  var CURRENT_ACTION = '<?!= currentAction ?>';
  var USER_PAGES = <?!= user && user.isSuperAdmin ? 'null' : JSON.stringify((user && user.authorizedPages) || {}) ?>;
  var CAN_WRITE = UIC.canAdd_(); var CAN_FULL = UIC.canFull_();
  var MONTHS = ['', 'يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
  
  var COSTING = [];
  var LINES = [];
  var REFS = null;
  var PARTIES = [];
  var CFILTER = { month: '', year: '', search: '' };
  var LINELIST = [];
  var LINE_CTR = 0;
  var UPLOAD_KEYS = [
    { key: 'شهادة_تحليل_ان_وجد', label: 'شهادة تحليل (إن وجد)' },
    { key: 'ترخيص_بالافراج_الزراعي', label: 'ترخيص بالإفراج الزراعي' },
    { key: 'صورة الافراج', label: 'صورة الإفراج' },
    { key: 'صورة التسجيل', label: 'صورة التسجيل' }
  ];
  
  var COSTING_NUM_KEYS = [
    'في حالة شحن CIF ادخل قيمة التامين', 'نسبة التامين للـ CIF', 'القيمه بالدولار',
    'سعر الصرف', 'القيمه المحسنه', 'القيمه المقر عنها', 'م اداريه', 'رسوم جمركيه',
    'مصاريف تفريغ', 'عمولة بنكية', 'ايصالات تخليص وميناء', 'رسوم اضافية',
    'م تخليص', 'م اخري', 'ض شراء', 'ضريبة أ.ت.ص', 'تعديل_داخلي_للتكلفة', 'فروق الحد الادني'
  ];
  var COSTING_NUM_LABELS = { 'القيمه بالدولار': 'القيمة بالعملة الأجنبية' };
  var COSTING_CHOICE_KEYS = ['نوع الشهادة', 'نوع الشحن', 'اسم_المورد', 'البنك المرتبط'];

  function companyCall(moduleAction, data) {
    return API.call('company_action', {
      target_system: '3fe1b5cb67b7223e',
      module_action: moduleAction,
      data: data || {}
    }, SESSION_TOKEN);
  }

  function pad(n) { return n < 10 ? '0' + n : String(n); }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function normalizeDate(d) {
    if (!d) return '';
    if (d instanceof Date) {
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    }
    var s = String(d).trim();
    if (!s) return '';
    var mIso = s.match(/^\d{4}[-\/](\d{1,2})[-\/](\d{1,2})$/);
    if (mIso) {
      return mIso[1] + '-' + pad(Number(mIso[2])) + '-' + pad(Number(mIso[3]));
    }
    var mDm = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);
    if (mDm) {
      return mDm[3] + '-' + pad(Number(mDm[2])) + '-' + pad(Number(mDm[1]));
    }
    var dt = new Date(s);
    if (!isNaN(dt.getTime())) {
      return dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate());
    }
    return s;
  }

  function addYears(dateStr, years) {
    var d = dateStr ? new Date(dateStr) : new Date();
    if (isNaN(d.getTime())) d = new Date();
    d.setFullYear(d.getFullYear() + (years || 3));
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function getCertNo(r) {
    if (!r) return '';
    return String(r['رقم الشهاده'] || r['الرقم'] || r['رقم الشهادة'] || r['رقم_الشهاده'] || '').trim();
  }

  function load() {
    UIC.appShell('tc-root', {
      companyLogoUrl: COMPANY_LOGO_URL,
      companyLogoHref: scriptUrl + '?action=tc_dashboard&sessionToken=' + SESSION_TOKEN,
      companyLogoTitle: 'توب كيميكال',
      breadcrumb: 'توب كيميكال / حسابات الميزانية / المدخلات - اصول ومخزون',
      contentId: 'budget-inputs-content',
      menuGroups: (window.TOPCHEMICAL_MENU || [])
    });
    fetchInputs();
  }

  function fetchInputs() {
    UI.showSpinner('جاري تحميل بيانات الشهادات والبنود...');
    Promise.all([
      companyCall('get_legal_inputs'),
      companyCall('get_budget_refs'),
      companyCall('get_legal_parties')
    ])
      .then(function (res) {
        var rawCosting = res[0].costing || [];
        // Assign default Google Sheet row number (starts at row 2)
        rawCosting.forEach(function (r, idx) {
          if (r._sheetRow === undefined) r._sheetRow = idx + 2;
        });
        // Sort descending by default Google Sheet row number (newest row first)
        rawCosting.sort(function (a, b) {
          return (Number(b._sheetRow) || 0) - (Number(a._sheetRow) || 0);
        });

        COSTING = rawCosting;
        LINES = res[0].lines || [];
        REFS = res[1].refs || {};
        PARTIES = (res[2].parties || []).filter(function (p) { return String(p.name || '').trim(); });
        render(); try{schedulePrefetch();}catch(e){};
      })
      .catch(function (e) { showError(e); })
      .finally(function () { UI.hideSpinner(); });
  }

  function render() {
    document.getElementById('budget-inputs-content').innerHTML = '<div id="inputs-table-area"></div>';
    renderCosting();
  }

  function enumOptionsFrom(list, fallback) {
    var opts = [];
    var seen = {};
    (list || []).forEach(function (v) {
      var s = String(v == null ? '' : v).trim();
      if (s && !seen[s]) { seen[s] = true; opts.push(s); }
    });
    (fallback || []).forEach(function (f) { if (!seen[f]) { seen[f] = true; opts.push(f); } });
    return opts;
  }

  function escHtml(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  var CFILTER = { month: '', year: '', fromDate: '', toDate: '', itemType: '', search: '' };

  function renderCosting() {
    var list = COSTING.filter(function (r) {
      var cert = getCertNo(r);
      var lines = LINES.filter(function (l) { return getCertNo(l) === cert; });

      if (CFILTER.month && String(r['الشهر']) !== CFILTER.month) return false;
      if (CFILTER.year && String(r['العام']) !== CFILTER.year) return false;
      var relDate = normalizeDate(r['تاريخ الافراج']);
      if (CFILTER.fromDate && relDate && relDate < CFILTER.fromDate) return false;
      if (CFILTER.toDate && relDate && relDate > CFILTER.toDate) return false;

      if (CFILTER.itemType) {
        var shipType = String(r['نوع الشحن'] || '').trim();
        var hasMatchingLine = lines.some(function (l) {
          return String(l['نوع البند'] || shipType).trim() === CFILTER.itemType;
        });
        if (!hasMatchingLine && shipType !== CFILTER.itemType) return false;
      }

      if (CFILTER.search) {
        var q = CFILTER.search.toLowerCase();
        var certLower = cert.toLowerCase();
        var item = String(r['الصنف'] || '').toLowerCase();
        var supp = String(r['اسم_المورد'] || '').toLowerCase();
        var hasLineMatch = lines.some(function (l) {
          return String(l['المادة'] || '').toLowerCase().indexOf(q) !== -1 ||
                 String(l['تفاصيل بند'] || '').toLowerCase().indexOf(q) !== -1;
        });
        return certLower.indexOf(q) !== -1 || item.indexOf(q) !== -1 || supp.indexOf(q) !== -1 || hasLineMatch;
      }
      return true;
    });

    var mOpts = MONTHS.map(function (m, i) {
      if (!i) return '<option value="">كل الشهور</option>';
      return '<option value="' + i + '"' + (String(CFILTER.month) === String(i) ? ' selected' : '') + '>' + m + '</option>';
    }).join('');

    var years = [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026, 2027];
    var yOpts = '<option value="">كل السنوات</option>' + years.map(function (y) {
      return '<option value="' + y + '"' + (String(CFILTER.year) === String(y) ? ' selected' : '') + '>' + y + '</option>';
    }).join('');

    var typeOptions = ['محلي', 'مستورد'];
    LINES.forEach(function (l) {
      var t = String(l['نوع البند'] || '').trim();
      if (t && typeOptions.indexOf(t) === -1) typeOptions.push(t);
    });
    var typeOpts = '<option value="">كل أنواع البنود</option>' + typeOptions.map(function (t) {
      return '<option value="' + escHtml(t) + '"' + (CFILTER.itemType === t ? ' selected' : '') + '>' + escHtml(t) + '</option>';
    }).join('');

    var html =
      '<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px;background:var(--bg-surface);padding:14px 16px;border:1px solid var(--border-color);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);">' +
        '<div style="display:flex;flex-direction:column;gap:3px;">' +
          '<label style="font-size:11px;font-weight:700;color:var(--text-muted);" for="cf-from-date">من تاريخ (الإفراج/الدخول):</label>' +
          '<input id="cf-from-date" class="input" type="date" style="width:auto;min-height:36px;" onchange="setCFilter(\'fromDate\', this.value)" value="' + escHtml(CFILTER.fromDate) + '">' +
        '</div>' +
        '<div style="display:flex;flex-direction:column;gap:3px;">' +
          '<label style="font-size:11px;font-weight:700;color:var(--text-muted);" for="cf-to-date">إلى تاريخ:</label>' +
          '<input id="cf-to-date" class="input" type="date" style="width:auto;min-height:36px;" onchange="setCFilter(\'toDate\', this.value)" value="' + escHtml(CFILTER.toDate) + '">' +
        '</div>' +
        '<div style="display:flex;flex-direction:column;gap:3px;">' +
          '<label style="font-size:11px;font-weight:700;color:var(--text-muted);" for="cf-item-type">نوع البند:</label>' +
          '<select id="cf-item-type" class="input" style="width:auto;min-width:115px;min-height:36px;" onchange="setCFilter(\'itemType\', this.value)">' + typeOpts + '</select>' +
        '</div>' +
        '<div style="display:flex;flex-direction:column;gap:3px;">' +
          '<label style="font-size:11px;font-weight:700;color:var(--text-muted);" for="cf-month">الشهر:</label>' +
          '<select id="cf-month" class="input" style="width:auto;min-width:110px;min-height:36px;" onchange="setCFilter(\'month\', this.value)">' + mOpts + '</select>' +
        '</div>' +
        '<div style="display:flex;flex-direction:column;gap:3px;">' +
          '<label style="font-size:11px;font-weight:700;color:var(--text-muted);" for="cf-year">السنة:</label>' +
          '<select id="cf-year" class="input" style="width:auto;min-width:105px;min-height:36px;" onchange="setCFilter(\'year\', this.value)">' + yOpts + '</select>' +
        '</div>' +
        '<div style="display:flex;flex-direction:column;gap:3px;flex:1;min-width:180px;">' +
          '<label style="font-size:11px;font-weight:700;color:var(--text-muted);" for="cf-search">بحث:</label>' +
          '<input id="cf-search" class="input" style="width:100%;min-height:36px;" type="search" placeholder="بحث برقم الشهادة، الصنف، المورد..." onkeyup="setCFilter(\'search\', this.value)" value="' + escHtml(CFILTER.search) + '">' +
        '</div>' +
        '<div style="display:flex;gap:6px;align-items:flex-end;margin-top:auto;">' +
          '<button class="btn btn-outline" style="min-height:36px;padding:6px 12px;font-size:13px;" onclick="resetCFilters()" title="إعادة تعيين كافة الفلاتر">مسح الفلاتر</button>' +
          '<button class="btn btn-outline" style="min-height:36px;padding:6px 14px;font-size:13px;background:var(--success-bg);color:var(--success-text);border-color:var(--success-border);" onclick="exportVatPurchasingXlsx()" title="تحميل شيت Excel المعتمد لضريبة القيمة المضافة مع لوحة المؤشرات (RTL)">📊 تصدير Excel الضريبي (VAT)</button>' +
          (CAN_WRITE ? '<button class="btn btn-primary" style="min-height:36px;padding:6px 14px;font-size:13px;" onclick="openCostingModal()">+ إضافة شهادة وبنودها</button>' : '') +
        '</div>' +
      '</div>' +
      '<div style="margin-bottom:12px;font-size:13px;color:var(--text-muted);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">' +
        '<span>إجمالي الشهادات المعروضة: <strong>' + list.length + '</strong> شهادة</span>' +
        '<span style="font-size:12px;">(اضغط على كود أو سطر الشهادة لعرض/إخفاء البنود والمنتجات المرتبطة بها)</span>' +
      '</div>' +
      (list.length ? '' : '<div class="empty-state"><span>لا توجد بيانات مطابقة لخيارات البحث المحددة.</span></div>');

    list.forEach(function (r, i) {
      var cert = getCertNo(r);
      
      // Filter child lines in legal_product_purchasing linked to this cert
      var lines = LINES.filter(function (l) {
        return getCertNo(l) === cert;
      });

      var materials = lines.map(function (l) { return String(l['المادة'] || '').trim(); }).filter(Boolean);
      var matText = materials.length
        ? materials.slice(0, 3).join('، ') + (materials.length > 3 ? ' … و' + (materials.length - 3) + ' أخرى' : '')
        : 'لا توجد مواد مسجلة';

      var totalLineQty = 0;
      var totalLineCost = 0;
      var totalLineSales = 0;

      var lineRows = lines.map(function (l, li) {
        var q = Number(l['الكمية']) || 0;
        var c = Number(l['قيمة التكلفة']) || 0;
        var s = Number(l['سعر البيع']) || Number(l['قيمة البيع']) || 0;
        var unitCost = q > 0 ? (c / q) : (Number(l['تكلفة الوحدة']) || 0);
        totalLineQty += q;
        totalLineCost += c;
        totalLineSales += s;

        var uploadsHtml = UPLOAD_KEYS.map(function (u) {
          var ref = l[u.key];
          if (!ref) return '';
          return '<button class="btn btn-outline" style="padding:2px 6px;font-size:11px;margin-left:4px;" onclick="viewAttachment(\'' + escHtml(ref).replace(/\'/g, "\\\'") + '\')" title="' + u.label + '">📎 ' + u.label.split(' ')[0] + ' / View</button>';
        }).filter(Boolean).join('');

        return '<tr>' +
          '<td><span class="badge-tag badge-primary">' + escHtml(l['كود المعاملة'] || (cert + '-' + (li + 1))) + '</span></td>' +
          '<td><strong>' + escHtml(l['المادة'] || '-') + '</strong></td>' +
          '<td>' + escHtml(l['تفاصيل بند'] || r['اسم_المورد'] || '-') + '</td>' +
          '<td><span class="badge-tag">' + escHtml(l['نوع البند'] || (r['نوع الشحن'] === 'محلي' ? 'محلي' : 'مستورد')) + '</span></td>' +
          '<td>' + escHtml(l['المعاملة'] || 'مشتريات') + '</td>' +
          '<td style="text-align:center;font-weight:600;">' + FMT.number(q) + '</td>' +
          '<td style="text-align:left;color:var(--brand-primary);">' + FMT.currency(unitCost) + '</td>' +
          '<td style="text-align:left;font-weight:700;">' + FMT.currency(c) + '</td>' +
          '<td style="text-align:left;">' + FMT.currency(s) + '</td>' +
          '<td>' + escHtml(l['تاريخ الانتاج'] || '-') + '</td>' +
          '<td>' + escHtml(l['تاريخ الانتهاء'] || '-') + '</td>' +
          '<td>' + (uploadsHtml || '<span style="color:var(--text-muted);font-size:11px;">-</span>') + '</td>' +
          '</tr>';
      }).join('');

      var lineTable = lines.length ? (
        '<table class="table" style="min-width:960px;">' +
          '<thead><tr>' +
            '<th>كود المعاملة</th><th>المادة</th><th>تفاصيل البند</th><th>نوع البند</th><th>المعاملة</th><th>الكمية</th><th>تكلفة الوحدة</th><th>قيمة التكلفة</th><th>سعر البيع</th><th>تاريخ الإنتاج</th><th>تاريخ الانتهاء</th><th>المرفقات</th>' +
          '</tr></thead>' +
          '<tbody>' + lineRows + '</tbody>' +
          '<tfoot><tr style="background:var(--bg-subtle);font-weight:700;">' +
            '<td colspan="5">الإجمالي الكلي لبنود الشهادة (' + lines.length + ' بند)</td>' +
            '<td style="text-align:center;">' + FMT.number(totalLineQty) + '</td>' +
            '<td>-</td>' +
            '<td style="text-align:left;color:var(--brand-primary);">' + FMT.currency(totalLineCost) + '</td>' +
            '<td style="text-align:left;">' + FMT.currency(totalLineSales) + '</td>' +
            '<td colspan="3"></td>' +
          '</tr></tfoot>' +
        '</table>'
      ) : (
        '<div class="empty-state" style="padding:24px;">' +
          '<span>لا توجد بنود منتجات مرتبطة بهذه الشهادة في جدول (legal_product_purchasing).</span><br>' +
          (CAN_WRITE ? '<button class="btn btn-outline" style="margin-top:10px;" onclick="event.stopPropagation();openCostingModal(\'' + escHtml(cert) + '\')">+ إضافة وتعديل بنود المنتجات</button>' : '') +
        '</div>'
      );

      html +=
        '<div class="master-card" id="master-card-' + i + '">' +
          '<div class="master-head" onclick="toggleExpand(' + i + ')">' +
            '<span id="exp-arrow-' + i + '" style="color:var(--brand-primary);font-size:14px;font-weight:700;width:16px;">▶</span>' +
            '<span class="badge-tag badge-primary" style="font-size:13px;padding:4px 10px;">' + escHtml(cert || 'بدون رقم') + '</span>' +
            '<strong style="font-size:14px;color:var(--text-main);">' + escHtml(r['الصنف'] || '-') + '</strong>' +
            '<span class="badge-tag">' + escHtml(r['نوع الشهادة'] || '-') + '</span>' +
            '<span class="badge-tag">' + escHtml(r['نوع الشحن'] || '-') + '</span>' +
            '<span style="color:var(--text-muted);font-size:13px;">المورد: <strong style="color:var(--text-main);">' + escHtml(r['اسم_المورد'] || '-') + '</strong></span>' +
            '<span style="color:var(--text-muted);font-size:13px;">المواد: ' + escHtml(matText) + '</span>' +
            '<span class="badge-tag" style="background:var(--success-bg);color:var(--success-text);">' + lines.length + ' بنود منتجات</span>' +
            '<span style="flex:1;"></span>' +
            '<div style="text-align:left;margin-left:8px;">' +
              '<div style="font-size:11px;color:var(--text-muted);">إجمالي التكاليف</div>' +

  function uploadFieldFile(formEl, key, sheet) {
    var input = formEl.querySelector('[data-field-name="' + key + '"]');
    if (!input || !input.files || !input.files[0]) return Promise.resolve('');
    var file = input.files[0];
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error('خطأ في قراءة الملف')); };
      reader.onload = function () {
        var b64 = String(reader.result || '').split(',')[1] || '';
        companyCall('add_upload_file', { sheet: sheet, field: key, filename: file.name, base64: b64 })
          .then(function (res) {
            if (res && res.status === 'success') resolve(res.reference);
            else reject(new Error((res && res.message) || 'خطأ في رفع الملف'));
          })
          .catch(function (err) { reject(new Error((err && err.message) || 'خطأ في رفع الملف')); });
      };
      reader.readAsDataURL(file);
    });
  }

  function saveCosting() {
    if (!UIC.validateForm('costing-form')) return;
    var formEl = document.getElementById('costing-form');
    var data = UIC.collectForm('costing-form');
    
    COSTING_CHOICE_KEYS.forEach(function (k) {
      if (data[k] === '__new__') data[k] = data[k + '_custom'] || '';
    });
    
    var certEl = document.getElementById('رقم الشهاده');
    var editMode = certEl ? certEl.disabled : false;
    var cert = String(data['رقم الشهاده'] || '').trim();
    if (!cert) { showError({ message: 'رقم الشهادة مطلوب' }); return; }

    var mVal = String(data['تم_الاقرار_شهر'] == null ? '' : data['تم_الاقرار_شهر']).trim();
    if (mVal !== '') {
      var mNum = Number(mVal);
      if (!Number.isInteger(mNum) || mNum < 0 || mNum > 12) {
        showError({ message: 'شهر الإقرار يجب أن يكون رقماً صحيحاً بين 0 و 12' });
        return;
      }
    }

    var lines = [];
    var uploads = [];
    LINELIST.forEach(function (idx) {
      var l = {};
      var matEl = document.getElementById('line_idx_' + idx + '_المادة');
      var matVal = matEl ? matEl.value : '';
      if (matVal === '__new__') matVal = (document.getElementById('line_idx_' + idx + '_المادة_custom') || {}).value || '';
      l['المادة'] = matVal;

      var dealEl = document.getElementById('line_idx_' + idx + '_المعاملة');
      var dealVal = dealEl ? dealEl.value : 'مشتريات';
      l['المعاملة'] = dealVal;

      ['الكمية', 'قيمة التكلفة', 'سعر البيع', 'تاريخ الانتاج', 'تاريخ الانتهاء'].forEach(function (k) {
        var el = document.getElementById('line_idx_' + idx + '_' + k);
        if (el) l[k] = el.value;
      });

      UPLOAD_KEYS.forEach(function (u) {
        var fi = document.getElementById('line_idx_' + idx + '_upload_' + u.key);
        if (fi && fi.files && fi.files[0]) uploads.push({ line: l, key: u.key, input: fi });
        else l[u.key] = fi ? fi.getAttribute('data-ref') || '' : '';
      });

      lines.push(l);
    });

    if (!lines.length) {
      showError({ message: 'يرجى إضافة بند مشتريات واحد على الأقل للشهادة' });
      return;
    }

    var bad = lines.find(function (l) {
      return !String(l['المادة'] || '').trim() || !(Number(l['الكمية']) > 0) || !(Number(l['قيمة التكلفة']) > 0);
    });
    if (bad) {
      showError({ message: 'يرجى إكمال الحقول الإلزامية لكل بند: المادة، الكمية (> 0)، وقيمة التكلفة (> 0)' });
      return;
    }

    UI.showSpinner('جاري رفع المرفقات وحفظ الشهادة وبنودها...');
    uploadFieldFile(formEl, 'invoice_swift', 'legal_purchasing_costing')
      .then(function (ref) {
        if (ref) data.invoice_swift = ref;
        var chain = Promise.resolve();
        uploads.forEach(function (u) {
          chain = chain.then(function () {
            return uploadFileInput(u.input, u.key, 'legal_product_purchasing').then(function (ref2) {
              if (ref2) u.line[u.key] = ref2;
            });
          });
        });
        return chain.then(function () {
          var payload = { header: data, lines: lines };
          return companyCall(editMode ? 'edit_legal_costing_bundle' : 'add_legal_costing_bundle', payload);
        });
      })
      .then(function (r) {
        UIC.closeModal('costing-modal');
        UIC.toast(r.message || 'تم حفظ الشهادة وبنودها بنجاح', 'success');
        if (r && r.record) {
          if (editMode) {
            var idx = COSTING.findIndex(function(c){ return getCertNo(c)===getCertNo(r.record); });
            if (idx!==-1) COSTING[idx]=r.record; else COSTING.unshift(r.record);
            // replace lines for this cert
            LINES = LINES.filter(function(l){ return getCertNo(l)!==getCertNo(r.record); });
            (r.lines||r.records||[]).forEach(function(l){ LINES.push(l); });
          } else {
            COSTING.unshift(r.record);
            (r.lines||r.records||[]).forEach(function(l){ LINES.push(l); });
          }
          renderCosting();
        } else { fetchInputs(); }
      })
      .catch(function (e) { showError(e); })
      .finally(function () { UI.hideSpinner(); });
  }

  function deleteCosting(cert) {
    if (!confirm('هل أنت متأكد من حذف الشهادة رقم ' + cert + ' وجميع بنود المنتجات المرتبطة بها؟ لا يمكن التراجع عن هذا الإجراء.')) return;
    UI.showSpinner('جاري الحذف...');
    companyCall('delete_legal_costing', { cert: cert })
      .then(function (r) {
        UIC.toast(r.message || 'تم حذف الشهادة وبنودها بنجاح', 'success');
        fetchInputs();
      })
      .catch(function (e) { showError(e); })
      .finally(function () { UI.hideSpinner(); });
  }

  function showError(e) {
    UIC.toast((e && e.message) || 'حدث خطأ أثناء معالجة الطلب', 'error');
  }

  load();
</script>
</body>
</html>
