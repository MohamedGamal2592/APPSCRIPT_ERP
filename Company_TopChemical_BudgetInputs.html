<div id="tc-root" dir="rtl"></div>
<script>
  var params = new URLSearchParams(window.location.search);
  var SESSION_TOKEN = params.get('sessionToken') || (API.getSession() || {}).token || '';
  var scriptUrl = window.scriptUrl || '/';
  var IS_SUPER_ADMIN = <?!= user && user.isSuperAdmin ? 'true' : 'false' ?>;
  var COMPANY_LOGO_URL = '<?!= getCompanyLogoUrl_('3fe1b5cb67b7223e') ?>';
  var COMPANY_PAGES = <?!= companyPages ?>;
  var CURRENT_ACTION = '<?!= currentAction ?>';
  var USER_PAGES = <?!= user && user.isSuperAdmin ? 'null' : JSON.stringify((user && user.authorizedPages) || {}) ?>;
  var CAN_WRITE = UIC.canAdd_(); var CAN_FULL = UIC.canFull_();
  var MONTHS = ['', 'يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
  
  var COSTING = [];
  var LINES = [];
  var REFS = null;
  var PARTIES = [];
  var CFILTER = { month: '', year: '', search: '' };
  var LINELIST = [];
  var LINE_CTR = 0;
  var UPLOAD_KEYS = [
    { key: 'شهادة_تحليل_ان_وجد', label: 'شهادة تحليل (إن وجد)' },
    { key: 'ترخيص_بالافراج_الزراعي', label: 'ترخيص بالإفراج الزراعي' },
    { key: 'صورة الافراج', label: 'صورة الإفراج' },
    { key: 'صورة التسجيل', label: 'صورة التسجيل' }
  ];
  
  var COSTING_NUM_KEYS = [
    'في حالة شحن CIF ادخل قيمة التامين', 'نسبة التامين للـ CIF', 'القيمه بالدولار',
    'سعر الصرف', 'القيمه المحسنه', 'القيمه المقر عنها', 'م اداريه', 'رسوم جمركيه',
    'مصاريف تفريغ', 'عمولة بنكية', 'ايصالات تخليص وميناء', 'رسوم اضافية',
    'م تخليص', 'م اخري', 'ض شراء', 'ضريبة أ.ت.ص', 'تعديل_داخلي_للتكلفة', 'فروق الحد الادني'
  ];
  var COSTING_NUM_LABELS = { 'القيمه بالدولار': 'القيمة بالعملة الأجنبية' };
  var COSTING_CHOICE_KEYS = ['نوع الشهادة', 'نوع الشحن', 'اسم_المورد', 'البنك المرتبط'];

  function companyCall(moduleAction, data) {
    return API.call('company_action', {
      target_system: '3fe1b5cb67b7223e',
      module_action: moduleAction,
      data: data || {}
    }, SESSION_TOKEN);
  }

  function pad(n) { return n < 10 ? '0' + n : String(n); }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function normalizeDate(d) {
    if (!d) return '';
    if (d instanceof Date) {
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    }
    var s = String(d).trim();
    if (!s) return '';
    var mIso = s.match(/^\d{4}[-\/](\d{1,2})[-\/](\d{1,2})$/);
    if (mIso) {
      return mIso[1] + '-' + pad(Number(mIso[2])) + '-' + pad(Number(mIso[3]));
    }
    var mDm = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);
    if (mDm) {
      return mDm[3] + '-' + pad(Number(mDm[2])) + '-' + pad(Number(mDm[1]));
    }
    var dt = new Date(s);
    if (!isNaN(dt.getTime())) {
      return dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate());
    }
    return s;
  }

  function addYears(dateStr, years) {
    var d = dateStr ? new Date(dateStr) : new Date();
    if (isNaN(d.getTime())) d = new Date();
    d.setFullYear(d.getFullYear() + (years || 3));
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function getCertNo(r) {
    if (!r) return '';
    return String(r['رقم الشهاده'] || r['الرقم'] || r['رقم الشهادة'] || r['رقم_الشهاده'] || '').trim();
  }

  function load() {
    UIC.appShell('tc-root', {
      companyLogoUrl: COMPANY_LOGO_URL,
      companyLogoHref: scriptUrl + '?action=tc_dashboard&sessionToken=' + SESSION_TOKEN,
      companyLogoTitle: 'توب كيميكال',
      breadcrumb: 'توب كيميكال / حسابات الميزانية / المدخلات - اصول ومخزون',
      contentId: 'budget-inputs-content',
      menuGroups: (window.TOPCHEMICAL_MENU || [])
    });
    fetchInputs();
  }

  function fetchInputs(quiet) {
    if (!quiet) UIC.readSkeleton('budget-inputs-content', { message: 'جاري تحميل بيانات الشهادات والبنود...' });
    Promise.all([
      companyCall('get_legal_inputs'),
      companyCall('get_budget_refs'),
      companyCall('get_legal_parties')
    ])
      .then(function (res) {
        var rawCosting = res[0].costing || [];
        // Assign default Google Sheet row number (starts at row 2)
        rawCosting.forEach(function (r, idx) {
          if (r._sheetRow === undefined) r._sheetRow = idx + 2;
        });
        // Sort descending by default Google Sheet row number (newest row first)
        rawCosting.sort(function (a, b) {
          return (Number(b._sheetRow) || 0) - (Number(a._sheetRow) || 0);
        });

        COSTING = rawCosting;
        LINES = res[0].lines || [];
        REFS = res[1].refs || {};
        PARTIES = (res[2].parties || []).filter(function (p) { return String(p.name || '').trim(); });
        render(); try{schedulePrefetch();}catch(e){};
      })
      .catch(function (e) { showError(e); })
      .finally(function () { UI.hideSpinner(); });
  }

  function render() {
    document.getElementById('budget-inputs-content').innerHTML = '<div id="inputs-table-area"></div>';
    renderCosting();
  }

  function enumOptionsFrom(list, fallback) {
    var opts = [];
    var seen = {};
    (list || []).forEach(function (v) {
      var s = String(v == null ? '' : v).trim();
      if (s && !seen[s]) { seen[s] = true; opts.push(s); }
    });
    (fallback || []).forEach(function (f) { if (!seen[f]) { seen[f] = true; opts.push(f); } });
    return opts;
  }

  function escHtml(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  var CFILTER = { month: '', year: '', fromDate: '', toDate: '', itemType: '', search: '' };

  function renderCosting() {
    /* Preserve search focus across re-renders: this function rebuilds
       #inputs-table-area (including the filter bar), so without this every
       keystroke in #cf-search destroys the focused input. */
    var prevActiveId = document.activeElement ? document.activeElement.id : '';
    var prevSel = null;
    if (prevActiveId === 'cf-search') {
      try { prevSel = { start: document.activeElement.selectionStart, end: document.activeElement.selectionEnd }; } catch (e) {}
    }
    var list = COSTING.filter(function (r) {
      var cert = getCertNo(r);
      var lines = LINES.filter(function (l) { return getCertNo(l) === cert; });

      if (CFILTER.month && String(r['الشهر']) !== CFILTER.month) return false;
      if (CFILTER.year && String(r['العام']) !== CFILTER.year) return false;
      var relDate = normalizeDate(r['تاريخ الافراج']);
      if (CFILTER.fromDate && relDate && relDate < CFILTER.fromDate) return false;
      if (CFILTER.toDate && relDate && relDate > CFILTER.toDate) return false;

      if (CFILTER.itemType) {
        var shipType = String(r['نوع الشحن'] || '').trim();
        var hasMatchingLine = lines.some(function (l) {
          return String(l['نوع البند'] || shipType).trim() === CFILTER.itemType;
        });
        if (!hasMatchingLine && shipType !== CFILTER.itemType) return false;
      }

      if (CFILTER.search && String(CFILTER.search).trim()) {
        var q = String(CFILTER.search).trim().toLowerCase();
        var certLower = cert.toLowerCase();
        var item = String(r['الصنف'] || '').toLowerCase();
        var supp = String(r['اسم_المورد'] || '').toLowerCase();
        var hasLineMatch = lines.some(function (l) {
          return String(l['المادة'] || '').toLowerCase().indexOf(q) !== -1 ||
                 String(l['تفاصيل بند'] || '').toLowerCase().indexOf(q) !== -1;
        });
        return certLower.indexOf(q) !== -1 || item.indexOf(q) !== -1 || supp.indexOf(q) !== -1 || hasLineMatch;
      }
      return true;
    });

    var mOpts = MONTHS.map(function (m, i) {
      if (!i) return '<option value="">كل الشهور</option>';
      return '<option value="' + i + '"' + (String(CFILTER.month) === String(i) ? ' selected' : '') + '>' + m + '</option>';
    }).join('');

    var years = [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026, 2027];
    var yOpts = '<option value="">كل السنوات</option>' + years.map(function (y) {
      return '<option value="' + y + '"' + (String(CFILTER.year) === String(y) ? ' selected' : '') + '>' + y + '</option>';
    }).join('');

    var typeOptions = ['محلي', 'مستورد'];
    LINES.forEach(function (l) {
      var t = String(l['نوع البند'] || '').trim();
      if (t && typeOptions.indexOf(t) === -1) typeOptions.push(t);
    });
    var typeOpts = '<option value="">كل أنواع البنود</option>' + typeOptions.map(function (t) {
      return '<option value="' + escHtml(t) + '"' + (CFILTER.itemType === t ? ' selected' : '') + '>' + escHtml(t) + '</option>';
    }).join('');

    var rows = list.map(function (r) {
      var cert = getCertNo(r);
      var lines = certLines(cert);
      var pending = !!r.__pending;
      var certSafe = escHtml(cert).replace(/'/g, "\\'");
      var actions = pending
        ? '<span style="color:var(--text-muted);font-size:12px;">جارٍ الحفظ...</span>'
        : UIC.actionBtns(
            [{ label: '🖨️ طباعة', onclick: 'printCosting(\'' + certSafe + '\')' }].concat(IS_SUPER_ADMIN ? [
              { label: '✏️ تعديل', onclick: 'openCostingModal(\'' + certSafe + '\')' },
              { label: '🗑️ حذف', color: 'var(--danger)', onclick: 'deleteCosting(\'' + certSafe + '\')' }
            ] : [])
          );
      return {
        _cert: cert,
        cert: '<b>' + escHtml(cert || 'بدون رقم') + '</b>',
        release_date: escHtml(fmtDateSmart(r['تاريخ الافراج']) || '-'),
        item: escHtml(r['الصنف'] || '-'),
        supplier: escHtml(r['اسم_المورد'] || '-'),
        cert_type: escHtml(r['نوع الشهادة'] || '-'),
        ship_type: escHtml(r['نوع الشحن'] || '-'),
        lines_count: lines.length,
        total_cost: pending ? '—' : moneyCell(Number(r['اجمالي التكاليف']) || 0),
        actions: actions
      };
    });
    var headers = [
      { key: 'cert', label: 'رقم الشهادة' },
      { key: 'release_date', label: 'تاريخ الإفراج' },
      { key: 'item', label: 'الصنف' },
      { key: 'supplier', label: 'المورد' },
      { key: 'cert_type', label: 'نوع الشهادة' },
      { key: 'ship_type', label: 'نوع الشحن' },
      { key: 'lines_count', label: 'عدد البنود', numeric: true },
      { key: 'total_cost', label: 'إجمالي التكاليف', numeric: true },
      { key: 'actions', label: 'إجراءات' }
    ];
    var filterBar =
      '<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px;background:var(--bg-surface);padding:14px 16px;border:1px solid var(--border-color);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);">' +
        '<div style="display:flex;flex-direction:column;gap:3px;">' +
          '<label style="font-size:11px;font-weight:700;color:var(--text-muted);" for="cf-from-date">من تاريخ (الإفراج/الدخول):</label>' +
          '<input id="cf-from-date" class="input" type="date" style="width:auto;min-height:36px;" onchange="setCFilter(\'fromDate\', this.value)" value="' + escHtml(CFILTER.fromDate) + '">' +
        '</div>' +
        '<div style="display:flex;flex-direction:column;gap:3px;">' +
          '<label style="font-size:11px;font-weight:700;color:var(--text-muted);" for="cf-to-date">إلى تاريخ:</label>' +
          '<input id="cf-to-date" class="input" type="date" style="width:auto;min-height:36px;" onchange="setCFilter(\'toDate\', this.value)" value="' + escHtml(CFILTER.toDate) + '">' +
        '</div>' +
        '<div style="display:flex;flex-direction:column;gap:3px;">' +
          '<label style="font-size:11px;font-weight:700;color:var(--text-muted);" for="cf-item-type">نوع البند:</label>' +
          '<select id="cf-item-type" class="input" style="width:auto;min-width:115px;min-height:36px;" onchange="setCFilter(\'itemType\', this.value)">' + typeOpts + '</select>' +
        '</div>' +
        '<div style="display:flex;flex-direction:column;gap:3px;">' +
          '<label style="font-size:11px;font-weight:700;color:var(--text-muted);" for="cf-month">الشهر:</label>' +
          '<select id="cf-month" class="input" style="width:auto;min-width:110px;min-height:36px;" onchange="setCFilter(\'month\', this.value)">' + mOpts + '</select>' +
        '</div>' +
        '<div style="display:flex;flex-direction:column;gap:3px;">' +
          '<label style="font-size:11px;font-weight:700;color:var(--text-muted);" for="cf-year">السنة:</label>' +
          '<select id="cf-year" class="input" style="width:auto;min-width:105px;min-height:36px;" onchange="setCFilter(\'year\', this.value)">' + yOpts + '</select>' +
        '</div>' +
        '<div style="display:flex;flex-direction:column;gap:3px;flex:1;min-width:180px;">' +
          '<label style="font-size:11px;font-weight:700;color:var(--text-muted);" for="cf-search">بحث:</label>' +
          '<input id="cf-search" class="input" style="width:100%;min-height:36px;" type="search" placeholder="بحث برقم الشهادة، الصنف، المورد..." oninput="setCFilter(\'search\', this.value)" value="' + escHtml(CFILTER.search) + '">' +
        '</div>' +
        '<div style="display:flex;gap:6px;align-items:flex-end;margin-top:auto;">' +
          '<button class="btn btn-outline" style="min-height:36px;padding:6px 12px;font-size:13px;" onclick="resetCFilters()" title="إعادة تعيين كافة الفلاتر">مسح الفلاتر</button>' +
          '<button class="btn btn-outline" style="min-height:36px;padding:6px 14px;font-size:13px;background:var(--success-bg);color:var(--success-text);border-color:var(--success-border);" onclick="exportVatPurchasingXlsx()" title="تحميل شيت Excel المعتمد لضريبة القيمة المضافة مع لوحة المؤشرات (RTL)">📊 تصدير Excel الضريبي (VAT)</button>' +
          (CAN_WRITE ? '<button class="btn btn-primary" style="min-height:36px;padding:6px 14px;font-size:13px;" onclick="openCostingModal()">+ إضافة شهادة وبنودها</button>' : '') +
        '</div>' +
      '</div>';

    document.getElementById('inputs-table-area').innerHTML =
      filterBar +
      '<div style="margin-bottom:12px;font-size:13px;color:var(--text-muted);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">' +
        '<span>إجمالي الشهادات المعروضة: <strong>' + FMT.number(list.length) + '</strong> شهادة</span>' +
        '<span style="font-size:12px;">(اضغط على أي سطر لعرض بيانات الشهادة وبنودها)</span>' +
      '</div>' +
      UIC.dataTable('inputs-table', {
        title: 'شهادات التسعير',
        headers: headers,
        rows: rows,
        searchable: false,
        emptyText: 'لا توجد بيانات مطابقة لخيارات البحث المحددة.',
        rowClick: function (rec, tr) {
          if (tr && tr.querySelector && tr.querySelector('.action-dropdown.open')) return;
          if (rec && rec._cert !== undefined) openInputModal(rec._cert);
        }
      });
    UIC.initTableSort('inputs-table');
    /* Restore search caret if the user was typing (or a quiet background
       refresh rebuilt the DOM mid-typing). Only restores when cf-search had
       focus before the rebuild, so select/date changes are unaffected. */
    if (prevActiveId === 'cf-search') {
      var searchEl = document.getElementById('cf-search');
      if (searchEl) {
        searchEl.focus();
        if (prevSel) { try { searchEl.setSelectionRange(prevSel.start, prevSel.end); } catch (e) {} }
      }
    }
  }

  function certLines(cert) {
    return LINES.filter(function (l) { return getCertNo(l) === cert; });
  }

  function certTotals(lines) {
    var qty = 0, cost = 0, sales = 0;
    (lines || []).forEach(function (l) {
      qty += Number(l['الكمية']) || 0;
      cost += Number(l['قيمة التكلفة']) || 0;
      sales += Number(l['سعر البيع']) || Number(l['قيمة البيع']) || 0;
    });
    return { qty: qty, cost: cost, sales: sales };
  }

  /* Wall date a user can read: date-only strings stay opaque; a Date or an
     ISO datetime is rendered with local getters, so a sheet date cell never
     shows its UTC '2026-05-05T21:00:00.000Z' form. */
  function fmtDateSmart(v) {
    if (v === null || v === undefined || v === '') return '';
    if (v instanceof Date) {
      if (isNaN(v.getTime())) return '';
      return dateWithOptionalTime(v);
    }
    var s = String(v).trim();
    if (!s) return '';
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    var d = new Date(s);
    if (isNaN(d.getTime())) return s;
    return dateWithOptionalTime(d);
  }

  function dateWithOptionalTime(d) {
    var p = function (n) { return ('0' + n).slice(-2); };
    var day = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
    var hasTime = d.getHours() || d.getMinutes();
    return hasTime ? day + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) : day;
  }

  function moneyCell(n) {
    var v = Number(n) || 0;
    return '<span data-num="' + v + '">' + FMT.currency(v) + '</span>';
  }

  function statCell(label, val) {
    return '<div><span style="color:var(--text-muted);">' + label + ':</span> <strong>' + val + '</strong></div>';
  }

  function openInputModal(cert) {
    var h = COSTING.find(function (c) { return getCertNo(c) === cert; });
    if (!h) { UIC.toast('لم يتم العثور على الشهادة — تم تحديث القائمة', 'error'); fetchInputs(true); return; }
    var lines = certLines(cert);
    var totals = certTotals(lines);
    var pending = !!h.__pending;
    var certSafe = escHtml(cert).replace(/'/g, "\\'");
    var lineHeaders = [
      { key: 'transaction_code', label: 'كود المعاملة' },
      { key: 'item', label: 'المادة' },
      { key: 'details', label: 'تفاصيل البند' },
      { key: 'item_type', label: 'نوع البند' },
      { key: 'deal', label: 'المعاملة' },
      { key: 'qty', label: 'الكمية', numeric: true },
      { key: 'unit_cost', label: 'تكلفة الوحدة', money: true },
      { key: 'cost', label: 'قيمة التكلفة', money: true },
      { key: 'sales', label: 'سعر البيع', money: true },
      { key: 'prod_date', label: 'تاريخ الإنتاج' },
      { key: 'exp_date', label: 'تاريخ الانتهاء' },
      { key: 'attachments', label: 'المرفقات' }
    ];
    var lineRows = lines.map(function (l, li) {
      var q = Number(l['الكمية']) || 0;
      var c = Number(l['قيمة التكلفة']) || 0;
      var s = Number(l['سعر البيع']) || Number(l['قيمة البيع']) || 0;
      var unitCost = q > 0 ? (c / q) : (Number(l['تكلفة الوحدة']) || 0);
      var uploadsHtml = UPLOAD_KEYS.map(function (u) {

  function setCFilter(k, v) {
    /* Search is debounced: without this each keystroke rebuilds the whole
       list (COSTING x LINES scan) and the input. Keep the raw value while
       typing (no trim) so caret/spaces behave; filtering trims itself. */
    if (k === 'search') {
      CFILTER.search = v;
      if (__cfSearchTimer) clearTimeout(__cfSearchTimer);
      __cfSearchTimer = setTimeout(function () { renderCosting(); }, 250);
      return;
    }
    CFILTER[k] = v;

  }

  function uploadFieldFile(formEl, key, sheet) {
    try {
      if (window.UIC && UIC.UploadSet) {
        var inp0 = formEl.querySelector('[data-field-name="' + key + '"]');
        var b0 = inp0 ? UIC.UploadSet.getBound(inp0) : null;
        if (b0 && b0.ref) return Promise.resolve({ reference: b0.ref, fileId: b0.id || '' });
        if (inp0 && !(inp0.files && inp0.files[0])) return Promise.resolve(null);
      }
    } catch (e) {}
    var input = formEl.querySelector('[data-field-name="' + key + '"]');
    if (!input || !input.files || !input.files[0]) return Promise.resolve(null);
    var file = input.files[0];
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error('خطأ في قراءة الملف')); };
      reader.onload = function () {
        var b64 = String(reader.result || '').split(',')[1] || '';
        companyCall('add_upload_file', { sheet: sheet, field: key, filename: file.name, base64: b64 })
          .then(function (res) {
            if (res && res.status === 'success') resolve({ reference: res.reference, fileId: res.fileId || '' });
            else reject(new Error((res && res.message) || 'خطأ في رفع الملف'));
          })
          .catch(function (err) { reject(new Error((err && err.message) || 'خطأ في رفع الملف')); });
      };
      reader.readAsDataURL(file);
    });
  }

      if (certEl) certEl.setAttribute('disabled', 'disabled');
      if (existingLines.length) {
        existingLines.forEach(function (l) { addLineRow(l); });
      } else {
        addLineRow(null);
      }
    } else {
      addLineRow(null);
    }
    try { UIC.trackDirty('costing-form'); } catch (e) {}
    try {
      if (UIC.UploadSet) {
        var swiftRef = v('invoice_swift') || '';
        var swiftId = v('invoice_swift_id') || '';
        if (swiftRef) UIC.UploadSet.setBound('cf-invoice_swift', swiftRef, swiftId);
        UPLOAD_KEYS.forEach(function (u) {
          LINELIST.forEach(function (idx) {
            var fi = document.getElementById('line_idx_' + idx + '_upload_' + u.key);
            if (fi) {
              var r0 = fi.getAttribute('data-ref') || '';
              var i0 = fi.getAttribute('data-upload-id') || '';
              if (r0) {
                try { UIC.UploadSet.setBound(fi, r0, i0); } catch (e2) {}
              }
            }
          });
        });
      }
    } catch (e3) {}
  }

  function viewAttachment(ref, id, sheet, field){
    if(!ref && (id == null || String(id) === '')) return;
    UIC.openDownload(scriptUrl + '?download=attachment&page=tc_budget_inputs&ref=' + encodeURIComponent(ref || '') + ((id != null && String(id) !== '') ? '&id=' + encodeURIComponent(id) : '') + (sheet ? '&sheet=' + encodeURIComponent(sheet) : '') + (field ? '&field=' + encodeURIComponent(field) : '') + '&sessionToken=' + encodeURIComponent(SESSION_TOKEN),
      'فتح المرفق');
  }
  function printCosting(cert) {
    if (!cert) return;
    UIC.openDownload(scriptUrl + '?download=budget_print&type=costing&id=' + encodeURIComponent(cert) + '&sessionToken=' + encodeURIComponent(SESSION_TOKEN),
      'فتح التقرير');
  }

  function saveCosting() {
    if (!UIC.validateForm('costing-form')) return;
    var formEl = document.getElementById('costing-form');
    var data = UIC.collectForm('costing-form');
    
    COSTING_CHOICE_KEYS.forEach(function (k) {
      if (data[k] === '__new__') data[k] = data[k + '_custom'] || '';
    });
    
    var certEl = document.getElementById('رقم الشهاده');
    var editMode = certEl ? certEl.disabled : false;
    var cert = String(data['رقم الشهاده'] || '').trim();
    if (!cert) { showError({ message: 'رقم الشهادة مطلوب' }); return; }

    var mVal = String(data['تم_الاقرار_شهر'] == null ? '' : data['تم_الاقرار_شهر']).trim();
    if (mVal !== '') {
      var mNum = Number(mVal);
      if (!Number.isInteger(mNum) || mNum < 0 || mNum > 12) {
        showError({ message: 'شهر الإقرار يجب أن يكون رقماً صحيحاً بين 0 و 12' });
        return;
      }
    }

    var lines = [];
    LINELIST.forEach(function (idx) {
      var l = {};
      var matEl = document.getElementById('line_idx_' + idx + '_المادة');
      var matVal = matEl ? matEl.value : '';
      if (matVal === '__new__') matVal = (document.getElementById('line_idx_' + idx + '_المادة_custom') || {}).value || '';
      l['المادة'] = matVal;

      var dealEl = document.getElementById('line_idx_' + idx + '_المعاملة');
      var dealVal = dealEl ? dealEl.value : 'مشتريات';
      l['المعاملة'] = dealVal;

      ['الكمية', 'قيمة التكلفة', 'سعر البيع', 'تاريخ الانتاج', 'تاريخ الانتهاء'].forEach(function (k) {
        var el = document.getElementById('line_idx_' + idx + '_' + k);
        if (el) l[k] = el.value;
      });

      /* Option A instant-upload: per-row bound ref (retain data-ref). */
      UPLOAD_KEYS.forEach(function (u) {
        var fi = document.getElementById('line_idx_' + idx + '_upload_' + u.key);
        var bound = (fi && UIC.UploadSet) ? UIC.UploadSet.getBound(fi) : null;
        if (bound && bound.ref) {
          l[u.key] = bound.ref;
          if (bound.id) l[u.key + '_id'] = bound.id;
        } else if (fi && fi.files && fi.files[0]) {
          l[u.key] = fi.getAttribute('data-ref') || '';
        } else {
          l[u.key] = fi ? (fi.getAttribute('data-upload-ref') || fi.getAttribute('data-ref') || '') : '';
          try {
            var bid = fi ? (fi.getAttribute('data-upload-id') || '') : '';
            if (bid) l[u.key + '_id'] = bid;
          } catch (e) {}
        }
      });

      lines.push(l);
    });

    if (!lines.length) {
      showError({ message: 'يرجى إضافة بند مشتريات واحد على الأقل للشهادة' });
      return;
    }

    var bad = lines.find(function (l) {
      return !String(l['المادة'] || '').trim() || !(Number(l['الكمية']) > 0) || !(Number(l['قيمة التكلفة']) > 0);
    });
    if (bad) {
      showError({ message: 'يرجى إكمال الحقول الإلزامية لكل بند: المادة، الكمية (> 0)، وقيمة التكلفة (> 0)' });
      return;
    }

    var doSaveInputs = function () {
      /* Header swift pre-bound on selection. */
      try {
        var swiftInput = formEl ? formEl.querySelector('[data-field-name="invoice_swift"]') : null;
        var swiftBound = (swiftInput && UIC.UploadSet) ? UIC.UploadSet.getBound(swiftInput) : null;
        if (swiftBound && swiftBound.ref) {
          data.invoice_swift = swiftBound.ref;
          if (swiftBound.id) data.invoice_swift_id = swiftBound.id;
        } else if (swiftInput) {
          var sr = swiftInput.getAttribute('data-upload-ref') || swiftInput.getAttribute('data-ref') || '';
          if (sr && !data.invoice_swift) data.invoice_swift = sr;
        }
      } catch (e) {}
      return { header: data, lines: lines };
    };

    var runSaveInputs = function (payload) {
        /* Tier A: master card on screen before reply; no blocking overlay for
           instant uploads (inline per-row status only). */
        var draft = Object.assign({}, payload.header);
        draft['رقم الشهاده'] = cert;
        UIC.Live.save({
          call: companyCall,
          action: editMode ? 'edit_legal_costing_bundle' : 'add_legal_costing_bundle',
          data: payload,
          list: COSTING,
          key: 'رقم الشهاده',
          draft: draft,
          render: renderCosting,
          modal: 'costing-modal',
          message: 'تم حفظ الشهادة وبنودها بنجاح',
          queueable: false,
          reload: function () { fetchInputs(true); },
          recordOf: function (resp) {
            if (resp && resp.record) return resp.record;
            if (editMode) return Object.assign({}, draft);
            return null;
          },
          onSuccess: function (resp) {
            var fresh = (resp && (resp.lines || resp.records)) || [];
            LINES = LINES.filter(function (l) { return getCertNo(l) !== cert; });
            fresh.forEach(function (l) { LINES.push(l); });
            renderCosting();
          }
        }).catch(function () { /* UIC.Live has toasted and rolled back */ });
    };
    try {
      if (window.UIC && UIC.UploadSet && UIC.UploadSet.isBusy('costing-modal')) {
        UIC.toast('جاري رفع الملفات... يرجى الانتظار', 'warning');
        UIC.UploadSet.awaitPending('costing-modal').then(function () { runSaveInputs(doSaveInputs()); });
        return;
      }
    } catch (e) {}
    runSaveInputs(doSaveInputs());
  }

  function deleteCosting(cert) {
    if (!confirm('هل أنت متأكد من حذف الشهادة رقم ' + cert + ' وجميع بنود المنتجات المرتبطة بها؟ لا يمكن التراجع عن هذا الإجراء.')) return;
    /* Tier A delete: no optimistic paint (there is no record to draw — the
       row is gone), so no draft/list/key/render. onSuccess splices the
       in-memory lists and re-renders locally; reload is the error-path
       backstop. No overlay. queueable:false: a transport failure rolls back
       loudly instead of queueing a delete. */
    UIC.Live.save({
      call: companyCall,
      action: 'delete_legal_costing',
      data: { cert: cert },
      onSuccess: function () {
        COSTING = COSTING.filter(function (c) { return getCertNo(c) !== cert; });
        LINES = LINES.filter(function (l) { return getCertNo(l) !== cert; });
        renderCosting();
      },
      message: 'تم حذف الشهادة وبنودها بنجاح',
      queueable: false,
      reload: function () { fetchInputs(true); }
    }).catch(function () { /* UIC.Live has toasted */ });
  }

  function showError(e) {
    UIC.toast((e && e.message) || 'حدث خطأ أثناء معالجة الطلب', 'error');
  }

  /* Another device's change arrives quietly. */
  UIC.Live.watchPage({
    call: companyCall,
    page: 'tc_budget_inputs',
    onChange: function () { UIC.Live.arrive(function () { fetchInputs(true); }); }
  });

  load();
</script>
</body>
</html>
