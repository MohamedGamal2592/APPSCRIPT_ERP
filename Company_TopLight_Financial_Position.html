<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Top Light — قائمة المركز المالي</title>
  <?!= include('CSS_Tokens'); ?>
  <?!= include('UI_Components'); ?>
  <?!= include('Client_Helpers'); ?>
  <?!= include('Company_TopLight_Nav'); ?>
  <?!= getCompanyThemeCSS_('8df5c89a117fe9a5') ?>
  <style>
    @media print {
      .topbar, .breadcrumb, .no-print { display: none !important; }
      body { background: var(--bg-surface, #ffffff) !important; }
    }
    .is-period { font-size: 0.8em; color: var(--text-muted); margin-bottom: 0.9em; }
    .is-statement { font-size: 18px; max-width: 44em; margin-inline: auto; }
    .is-section { margin-bottom: 1.1em; border: 2px solid #111111; border-radius: 8px; overflow: hidden; background: var(--bg-surface); }
    .is-sec-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 0.55em 0.9em; background: var(--bg-subtle, #f3f4f6); border-bottom: 2px solid #111111; font-weight: 800; font-size: 1.12em; }
    .is-sec-total { font-weight: 800; white-space: nowrap; }
    .is-table { width: 100%; border-collapse: collapse; font-size: 1em; }
    .is-table th, .is-table td { border-bottom: 1px solid var(--border-color, #e5e7eb); padding: 0.55em 1em; text-align: right; }
    .is-table th { background: var(--bg-subtle, #f9fafb); font-size: 0.8em; color: var(--text-muted); }
    .is-table tr:last-child td { border-bottom: 0; }
    .is-table td.num, .is-table th.num { text-align: left; font-variant-numeric: tabular-nums; direction: ltr; width: 11em; white-space: nowrap; }
    .is-subtotal td { font-weight: 800; font-size: 1.08em; background: #f0fdfa; border-top: 2px solid #111111; }
    .is-grand { margin-top: 0.4em; padding: 0.7em 0.9em; background: #374151; color: #fff; border-radius: 8px; font-size: 1.35em; font-weight: 800; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .is-grand .num { direction: ltr; }
    .is-neg { color: #dc2626; }
    .is-grand .is-neg, .is-grand .check-bad { color: #fca5a5; }
    .is-grand .check-ok { color: #86efac; }
    .is-foot { margin-top: 0.9em; font-size: 0.8em; color: var(--text-muted); line-height: 2; }
    .check-ok { color: #16a34a; font-weight: 800; }
    .check-bad { color: #dc2626; font-weight: 800; }
    .is-sec-head.is-toggle { cursor: pointer; user-select: none; }
    .is-sec-head.is-toggle:hover { background: #e5e7eb; }
    .is-chev { display: inline-block; font-size: 0.8em; margin-inline-start: 8px; transition: transform .15s; transform: rotate(90deg); }
    .is-sec-head.is-toggle[data-open="true"] .is-chev { transform: rotate(0deg); }
    tr.is-group td { background: var(--bg-subtle, #f3f4f6); font-weight: 700; font-size: 0.8em; color: var(--text-muted); }
    @media (max-width: 600px) {
      .is-statement { font-size: 16px; max-width: 100%; }
    }
    tr.is-link { cursor: pointer; }
    tr.is-link:hover td { background: #f8fafc; }
    .is-open-hint { color: #0369a1; font-weight: 800; margin-inline-end: 6px; }
    @page { size: A4 portrait; margin: 10mm; }
    @media print {
      .is-statement { font-size: 10pt; max-width: 100%; }
      .is-section { margin-bottom: 8px; break-inside: avoid; }
      .is-table th, .is-table td { padding: 3px 10px; }
      .is-table thead { display: table-header-group; }
      .is-grand { padding: 6px 10px; }
      .is-foot { font-size: 8pt; line-height: 1.6; }
      .is-period { margin-bottom: 6px; }
      .modal-overlay { display: none !important; }
    }
  </style>
</head>
<body>
<div id="tl-root" dir="rtl"></div>
<script>
  var params = new URLSearchParams(window.location.search);
  var SESSION_TOKEN = params.get('sessionToken') || (API.getSession() || {}).token || '';
  var scriptUrl = window.scriptUrl || '/';
  var IS_SUPER_ADMIN = <?!= user && user.isSuperAdmin ? 'true' : 'false' ?>;
  var USER_PAGES = <?!= user && user.isSuperAdmin ? 'null' : JSON.stringify((user && user.authorizedPages) || {}) ?>;
  var COMPANY_LOGO_URL = '<?!= getCompanyLogoUrl_('8df5c89a117fe9a5') ?>';
  var COMPANY_PAGES = <?!= companyPages ?>;
  var CURRENT_ACTION = '<?!= currentAction ?>';

  function companyCall(moduleAction, data) {
    return API.call('company_action', {
      target_system: '8df5c89a117fe9a5',
      module_action: moduleAction,
      data: data || {}
    }, SESSION_TOKEN);
  }

  function load() {
    UIC.appShell('tl-root', {
      menuGroups: window.TOPLIGHT_MENU || [],
      companyLogoUrl: COMPANY_LOGO_URL,
      companyLogoHref: scriptUrl + '?action=tl_dashboard&sessionToken=' + SESSION_TOKEN,
      companyLogoTitle: 'القمة لايت',
      breadcrumb: 'القمة لايت / الميزانية / قائمة المركز المالي',
      contentId: 'tl-content'
    });
    fetchData();
  }

  function filterPayload() {
    return {
      date_from: document.getElementById('f_from') ? document.getElementById('f_from').value : '',
      date_to: document.getElementById('f_to') ? document.getElementById('f_to').value : '',
      recalc_running: document.getElementById('f_recalc') ? document.getElementById('f_recalc').checked : false
    };
  }

  var __filtersBuilt = false;
  var __lastQuery = null;
  var LAST = null;

  function fetchData() {
    UIC.readSkeleton('tl-content', { message: [
      'جاري إعداد قائمة المركز المالي...',
      'جاري تجميع الأصول والالتزامات...',
      'لحظة، جاري مطابقة الميزانية...'
    ] });
    __lastQuery = filterPayload();
    companyCall('get_financial_position', __lastQuery)
      .then(function (r) {
        var content = document.getElementById('tl-content');
        if (!__filtersBuilt) {
          content.innerHTML = renderFilters() + '<div id="results"></div>';
          __filtersBuilt = true;
        }
        renderPosition(r);
        LAST = r || {};
      })
      .catch(function (e) { showError(e); })
      .finally(function () { UI.hideSpinner(); try{schedulePrefetch();}catch(e){} });
  }

  function renderFilters() {
    return '<div class="no-print" style="display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:16px;padding:12px;background:var(--bg-surface);border:2px solid #111111;border-radius:8px;">' +
      '<div class="form-field" style="margin:0;"><label class="form-label" for="f_from">من تاريخ (لأرباح الفترة)</label><input id="f_from" class="input" type="date" onchange="fetchData()"></div>' +
      '<div class="form-field" style="margin:0;"><label class="form-label" for="f_to">إلى تاريخ (الرصيد في)</label><input id="f_to" class="input" type="date" onchange="fetchData()"></div>' +
      '<div class="form-field" style="margin:0;"><label class="form-label" for="f_recalc">الجاري</label><label style="font-size:12px;display:flex;gap:6px;align-items:center;"><input id="f_recalc" type="checkbox" onchange="fetchData()"> إعادة احتساب ليتمم الرصيد</label></div>' +
      '<button class="btn btn-outline" onclick="window.print()">طباعة</button>' +
      '</div>';
  }

  function pct(num, den) {
    num = Number(num) || 0;
    den = Number(den) || 0;
    if (den === 0) return '—';
    return excelNumber(num / den * 100, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' %';
  }

  function excelNumber(v, options) {
    var n = Number(v);
    if (!isFinite(n)) n = 0;
    var formatted = Math.abs(n).toLocaleString('en-US', options || {});
    return n < 0 ? '(' + formatted + ')' : formatted;
  }

  function money(v) {
    return '<span class="num">' + excelNumber(v) + '</span>';
  }

  function moneySigned(v) {
    var n = Number(v) || 0;
    return '<span class="num' + (n < 0 ? ' is-neg' : '') + '">' + excelNumber(v) + '</span>';
  }

  function row(label, valueHtml, ratioHtml, subtotal, modalKey) {
    var clickable = !!modalKey;
    var cls = (subtotal ? 'is-subtotal ' : '') + (clickable ? 'is-link' : '');
    return '<tr' + (cls ? ' class="' + cls.trim() + '"' : '') + (clickable ? ' onclick="openLine(\'' + modalKey + '\')"' : '') + '><td>' +
      (clickable ? '<span class="is-open-hint">‹</span>' : '') + label + '</td><td class="num">' + valueHtml + '</td><td class="num">' + (ratioHtml || '—') + '</td></tr>';
  }

  function section(idx, title, totalHtml, rowsHtml, colLabel) {
    return '<div class="is-section">' +
      '<div class="is-sec-head"><span>' + idx + ' - ' + FMT.escape(title) + '</span>' +
      '<span class="is-sec-total">' + totalHtml + '</span></div>' +
      '<table class="is-table"><thead><tr><th>البيان</th><th class="num">القيمة</th><th class="num">' + FMT.escape(colLabel) + '</th></tr></thead>' +
      '<tbody>' + rowsHtml + '</tbody></table></div>';
  }

  function modalTable(heads, bodyRows) {
    return '<div style="overflow:auto;"><table class="is-table"><thead><tr>' +
      heads.map(function (h) { return '<th' + (h.num ? ' class="num"' : '') + '>' + h.label + '</th>'; }).join('') +
      '</tr></thead><tbody>' + (bodyRows || '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);">لا توجد بنود</td></tr>') + '</tbody></table></div>';
  }

  function openLine(key) {
    var b = detailBuilders[key] ? detailBuilders[key]() : null;
    if (!b) return;
    UIC.openModal('sfp-line-modal', { title: b.title, body: b.body, size: 'lg', footer: false });
  }

  var detailBuilders = {
    fixed: function () {
      var s = (LAST && LAST.summary) || {};
      var rows = ((LAST && LAST.fixedLines) || []).map(function (l) {
        return '<tr><td>' + FMT.escape(l.product_name || '-') + '</td><td>' + FMT.escape(l.movement_type) + '</td><td>' + fmtDate(l.date) + '</td><td class="num">' + excelNumber(l.amount) + '</td></tr>';
      }).join('');
      return { title: 'تفاصيل الأصول الثابتة (' + excelNumber(s.fixedAssets) + ')', body: modalTable(
        [{ label: 'الصنف' }, { label: 'نوع الحركة' }, { label: 'التاريخ' }, { label: 'القيمة', num: 1 }], rows) };
    },
    boxes: function () {
      var s = (LAST && LAST.summary) || {};
      var rows = ((LAST && LAST.boxes) || []).map(function (b) {
        return '<tr><td>' + FMT.escape(b.box_name || b.box) + ' (' + FMT.escape(b.box) + ')</td><td class="num">' + excelNumber(b.amount) + '</td><td class="num">' + pct(b.amount, s.cash) + '</td></tr>';
      }).join('');
      return { title: 'تفاصيل النقدية (' + excelNumber(s.cash) + ')', body: modalTable(
        [{ label: 'الصندوق' }, { label: 'الرصيد', num: 1 }, { label: 'النسبة', num: 1 }], rows) };
    },
    ar: function () {
      var s = (LAST && LAST.summary) || {};
      var rows = ((LAST && LAST.ar) || []).map(function (p) {
        return '<tr><td>' + FMT.escape(p.name || ('#' + p.id)) + ' (' + FMT.escape(p.direction || '') + ')</td><td class="num">' + excelNumber(p.balance) + '</td><td class="num">' + pct(p.balance, s.arTotal) + '</td></tr>';
      }).join('');
      return { title: 'تفاصيل العملاء (' + excelNumber(s.arTotal) + ')', body: modalTable(
        [{ label: 'الشريك' }, { label: 'الرصيد', num: 1 }, { label: 'النسبة', num: 1 }], rows) };
    },
    stock: function () {
      var s = (LAST && LAST.summary) || {};
      var rows = ((LAST && LAST.stockDetail) || []).map(function (l) {
        return '<tr><td>' + FMT.escape(l.product_name || ('#' + l.product_id)) + '</td>' +
          '<td class="num">' + excelNumber(l.qty) + '</td><td class="num">' + excelNumber(l.unit_cost) + '</td><td class="num">' + excelNumber(l.value) + '</td></tr>';
      }).join('');
      return { title: 'تفاصيل المخزون (' + excelNumber(s.stock) + ')', body: modalTable(
        [{ label: 'الصنف' }, { label: 'الكمية', num: 1 }, { label: 'التكلفة', num: 1 }, { label: 'القيمة', num: 1 }], rows) };
    },
    ap: function () {
      var s = (LAST && LAST.summary) || {};
      var rows = ((LAST && LAST.ap) || []).map(function (p) {
        return '<tr><td>' + FMT.escape(p.name || ('#' + p.id)) + ' (' + FMT.escape(p.direction || '') + ')</td><td class="num">' + excelNumber(p.balance) + '</td><td class="num">' + pct(p.balance, s.apTotal) + '</td></tr>';
      }).join('');
      return { title: 'تفاصيل الموردين (' + excelNumber(s.apTotal) + ')', body: modalTable(
        [{ label: 'الشريك' }, { label: 'الرصيد', num: 1 }, { label: 'النسبة', num: 1 }], rows) };
    }
  };

  function fmtDate(v) {
    if (!v) return '-';
    var d = new Date(v);
    if (isNaN(d.getTime())) return String(v).slice(0, 10);
    return d.toLocaleDateString('en-GB');
  }

  function renderPosition(r) {
    var el = document.getElementById('results');
    if (!el) return;
    var s = r.summary || {};
    var html = '<div class="is-statement">';

    html += '<div class="is-period">الرصيد في: <strong>' + fmtDate(r.asof) + '</strong>' +
      ' · أرباح الفترة (من ' + FMT.escape((__lastQuery && __lastQuery.date_from) || 'البداية') + ')' +
      (s.runningRecalculated ? ' · <strong>الجاري أعيد احتسابه ليتمم الرصيد</strong>' : '') + '</div>';

    /* 1 — الأصول */
    html += section(1, 'الأصول', money(s.totalAssets),
      row('<strong>الأصول الثابتة</strong> <span style="color:var(--text-muted);font-size:11px;">(' + excelNumber(s.fixedCount) + ' بند)</span>', money(s.fixedAssets), pct(s.fixedAssets, s.totalAssets), false, 'fixed') +
      row('النقدية بالخزينة والبنوك', moneySigned(s.cash), pct(s.cash, s.totalAssets), false, 'boxes') +
      row('العملاء (أرصدة مدينة) <span style="color:var(--text-muted);font-size:11px;">(' + excelNumber(s.arCount) + ')</span>', money(s.arTotal), pct(s.arTotal, s.totalAssets), false, 'ar') +
      row('المخزون <span style="color:var(--text-muted);font-size:11px;">(' + excelNumber(s.stockCount) + ' صنف)</span>', money(s.stock), pct(s.stock, s.totalAssets), false, 'stock') +
      row('<strong>إجمالي الأصول</strong>', money(s.totalAssets), '—', true),
      'النسبة من الإجمالي');

    /* 2 — الالتزامات وحقوق الملكية */
    html += section(2, 'الالتزامات وحقوق الملكية', money(s.totalLiabEquity),
      row('الموردون (أرصدة دائنة) <span style="color:var(--text-muted);font-size:11px;">(' + excelNumber(s.apCount) + ')</span>', money(s.apTotal), pct(s.apTotal, s.totalAssets), false, 'ap') +
      row('رأس المال (ثابت)', money(s.capital), pct(s.capital, s.totalLiabEquity)) +
      row('جاري المالك' + (s.runningRecalculated ? ' (معاد احتسابه)' : ''), moneySigned(s.running), pct(s.running, s.totalLiabEquity)) +
      row('أرباح / (خسائر) الفترة', moneySigned(s.periodProfit), pct(s.periodProfit, s.totalLiabEquity)) +
      row('<strong>إجمالي الالتزامات وحقوق الملكية</strong>', money(s.totalLiabEquity), '—', true),
      'النسبة');

    /* مطابقة الميزان */
    var balanced = Math.abs(Number(s.balanceDiff) || 0) < 0.01;
    html += '<div class="is-grand"><span>فرق الميزان (أصول − خصوم وحقوق)</span>' +
      '<span class="' + (balanced ? 'check-ok' : 'check-bad') + '">' + excelNumber(s.balanceDiff) + (balanced ? ' — متطابقة' : ' — غير متطابقة') + '</span></div>';

    html += '<div class="is-foot">الأصول الثابتة: بنود المشتريات ذات movement_type بين 121100 و 211100 · النقدية: مجموع balance_amount باستبعاد الصندوق 111103 · العملاء/الموردون: أرصدة الشركاء كما في كشف الحساب بتاريخ الرصيد · المخزون: صافي كميات الحركة حتى تاريخ الرصيد × تكلفة الوحدة (مطابق لمخزون آخر المدة بقائمة الدخل).</div>';

    el.innerHTML = html + '</div>';
  }

  function showError(e) {
    var content = document.getElementById('tl-content');
    if (content) content.innerHTML = '<div class="empty-state"><span>' + FMT.escape(e.message || 'خطأ') + '</span></div>';
  }

  load();
</script>
</body>
</html>
