 * The app's icons were emoji (📥 🖨️ 👤 🚪 🎨), HTML entities (&#9662;) and bare
 * text, mixed. Emoji are rendered by the OPERATING SYSTEM, so the same button is
 * a flat glyph on Windows, a colourful one on Android and a third thing on iOS;
 * they cannot inherit the text colour, cannot be sized reliably, and carry
 * accessible names ("outbox tray") that have nothing to do with what the button
 * does.
 *
 * These are 24×24 stroke paths on `currentColor`, so an icon is automatically
 * the right colour in the topbar, on a primary button and under all three
 * company themes, with no per-theme rules at all.
 *
 * WHY INLINE PATHS RATHER THAN A <symbol>/<use> SPRITE: several pages open a
 * NEW WINDOW and write a document into it (UIC.printTable, and the per-company
 * print pages). A document-level sprite does not exist in that window, so every
 * <use> reference would render as nothing — and print is exactly where a
 * missing icon is least recoverable. Inline paths are self-contained and work
 * anywhere the markup lands. The cost is bytes in the emitted HTML, which is
 * why UIC.icon is used in toolbars, tiles, dialogs and empty states, and NOT
 * per table row: the row action stays a text glyph so the DOM cost per row is

/**
 * UIC.icon(name, opts) -> inline <svg> string.
 *
 *   opts.size       px, default 20
 *   opts.className  extra classes
 *   opts.label      accessible name. Without it the icon is aria-hidden, which
 *                   is correct when it sits next to visible text; with it the
 *                   icon becomes the accessible name of an icon-only control.
 *
 * Returns '' for an unknown name rather than throwing, so a typo degrades to a
 * missing glyph instead of a blank page.
 */
UIC.icon = function (name, opts) {
  var o = opts || {};
  var d = UIC.ICONS[name];
  if (!d) return '';
  var size = o.size || 20;
  var a11y = o.label
    ? ' role="img" aria-label="' + UIC.escHtml(o.label) + '"'
    : ' aria-hidden="true" focusable="false"';
  return '<svg class="uic-icon' + (o.className ? ' ' + o.className : '') + '"' +
    ' width="' + size + '" height="' + size + '" viewBox="0 0 24 24"' +
    ' fill="none" stroke="currentColor" stroke-width="1.8"' +
    ' stroke-linecap="round" stroke-linejoin="round"' + a11y + '>' + d + '</svg>';
};

UIC.button = function (opts) {
  const o = opts || {};
  const type = o.type || 'primary';
  const cls = 'btn btn-' + type + (o.icon && !o.text ? ' btn-icon-only' : '');
  const icon = o.icon ? '<span class="btn-icon">' + o.icon + '</span>' : '';
  const attrs = o.onClick ? ' onclick="' + o.onClick + '"' : '';
  const disabled = o.disabled ? ' disabled' : '';
  return '<button class="' + cls + '"' + attrs + disabled + ' title="' + (o.tooltip || '') + '">' + icon + '<span>' + (o.text || '') + '</span></button>';
};

UIC.actionBtns = function (btns) {
  // Now delegates to dropdown for list-view pleadability — single unified look
  return UIC.actionDropdown(btns);
};

/* ── [UI-1.2 / U-01] Escaping the table's clip box ────────────────────────
 *
 * `.table-wrap` sets `overflow-x: auto` so wide tables scroll instead of the
 * page. That makes it a clipping box, and any `position: absolute` popup inside
 * it — a row's action menu, a combo list in a cell — is cut off at its edge. On
 * the last row of a table the menu is invisible entirely.
 *
 * A `position: fixed` element is laid out against the viewport and is NOT
 * clipped by an ancestor's overflow, so switching the popup to fixed while it is
 * open solves it WITHOUT reparenting the element into <body>. That matters: the
 * combo's blur/pick/keyboard handlers and the outside-click handlers all walk
 * the DOM with `.closest('.combo')`, and moving the node would silently break
 * every one of them.
 *
 * The one catch is that `position: fixed` resolves against the nearest ancestor
 * that establishes a containing block — an ancestor with `transform`, `filter`,
 * `contain` or `will-change: transform`. `.modal` carries
 * `will-change: transform`, so a combo inside a dialog would land in the wrong
 * place. Rather than enumerate those cases, the helper writes the coordinates,
 * measures where the element actually landed, and corrects by the difference.
 * That is exact for every containing block, present or future. */
UIC._anchored = [];

UIC._anchorFixed = function (el, anchor, opts) {
  if (!el || !anchor) return;
  var o = opts || {};
  var GAP = 4, EDGE = 8;
  try {
    /* Remember the inline styles so _unanchor can put them back exactly. */
    if (el.__uicHome === undefined) el.__uicHome = el.getAttribute('style') || '';

    el.style.position = 'fixed';
    el.style.margin = '0';
    /* A combo list must stay exactly as wide as its input; its CSS achieved that
       with `left:0; right:0`, which no longer applies once it is fixed. */
    if (o.matchWidth) el.style.width = anchor.getBoundingClientRect().width + 'px';

    var a = anchor.getBoundingClientRect();
    var m = el.getBoundingClientRect();
    var vw = window.innerWidth || document.documentElement.clientWidth;
    var vh = window.innerHeight || document.documentElement.clientHeight;

    /* Vertical: below the anchor, flipping above when there is no room. */
    var below = vh - a.bottom - GAP;
    var above = a.top - GAP;
    var flip = (m.height > below) && (above > below);
    var top = flip ? (a.top - m.height - GAP) : (a.bottom + GAP);
    top = Math.max(EDGE, Math.min(top, vh - m.height - EDGE));

    /* Horizontal: RTL is the primary direction, so align the popup's END edge
       with the anchor's, then clamp into the viewport. */
    var rtl = (document.documentElement.getAttribute('dir') || '').toLowerCase() === 'rtl';
    var left = rtl ? (a.right - m.width) : a.left;
    left = Math.max(EDGE, Math.min(left, vw - m.width - EDGE));

    el.style.left = left + 'px';
    el.style.top = top + 'px';
    el.style.right = 'auto';
    el.style.bottom = 'auto';

    /* Measure, then correct for any containing block that is not the viewport. */
    var got = el.getBoundingClientRect();
    var dx = left - got.left, dy = top - got.top;
    if (dx || dy) {
      el.style.left = (left + dx) + 'px';
      el.style.top = (top + dy) + 'px';
    }

    if (UIC._anchored.indexOf(el) === -1) UIC._anchored.push(el);
    UIC._anchored.__reanchor = UIC._anchored.__reanchor || {};
    el.__uicAnchor = anchor;
    el.__uicOpts = o;
  } catch (e) {}
};

UIC._unanchor = function (el) {
  if (!el) return;
  try {
    if (el.__uicHome !== undefined) {
      if (el.__uicHome) el.setAttribute('style', el.__uicHome);
      else el.removeAttribute('style');
      el.__uicHome = undefined;
    }
    el.__uicAnchor = null;
    var i = UIC._anchored.indexOf(el);
    if (i !== -1) UIC._anchored.splice(i, 1);
  } catch (e) {}
};

/* Anything open follows its anchor while the page or a table scrolls. Capture
 * phase, because the scroll happens on `.table-wrap`, not on the window. */
(function () {
  var queued = false;
  var reflow = function () {
    if (queued || !UIC._anchored.length) return;
    queued = true;
    requestAnimationFrame(function () {
      queued = false;
      UIC._anchored.slice().forEach(function (el) {
        if (!el.__uicAnchor || !el.__uicAnchor.isConnected) return;
        UIC._anchorFixed(el, el.__uicAnchor, el.__uicOpts);
      });
    });
  };
  window.addEventListener('scroll', reflow, true);
  window.addEventListener('resize', reflow);
})();

/* Row action menu open/close. The menu element stays where it is in the DOM, so
 * `.action-dropdown.open .action-dropdown-menu { display: flex }` still applies;
 * only its positioning changes. */
UIC.openActionMenu = function (id, ev) {
  try { if (ev && ev.stopPropagation) ev.stopPropagation(); } catch (e) {}
  var wrap = document.getElementById(id);
  if (!wrap) return;
  var menu = wrap.querySelector('.action-dropdown-menu');
  var btn = wrap.querySelector('button');
  document.querySelectorAll('.action-dropdown.open').forEach(function (el) {
    if (el !== wrap) UIC.closeActionMenu(el.id);
  });
  wrap.classList.add('open');
  if (menu && btn) UIC._anchorFixed(menu, btn, {});
};

UIC.closeActionMenu = function (id) {
  var wrap = document.getElementById(id);
  if (!wrap) return;
  wrap.classList.remove('open');
  var menu = wrap.querySelector('.action-dropdown-menu');
  if (menu) UIC._unanchor(menu);
};

UIC.toggleActionMenu = function (id, ev) {
  var wrap = document.getElementById(id);
  if (!wrap) return;
  if (wrap.classList.contains('open')) UIC.closeActionMenu(id);
  else UIC.openActionMenu(id, ev);
};

UIC.actionDropdown = function (btns) {
  if (!btns || !btns.length) return '';
  var id = 'ad_' + Math.random().toString(36).slice(2, 8);
  var items = btns.map(function (b) {
    if (!b) return '';
    var color = b.color ? 'color:' + b.color + ';' : '';
    var extra = b.color ? 'border-color:transparent;' : '';
    return '<button type="button" class="action-dropdown-item" style="display:block;width:100%;text-align:right;padding:8px 10px;font-size:13px;background:transparent;border:0;border-radius:6px;cursor:pointer;' + color + extra + '" onmouseover="this.style.background=\'var(--bg-subtle,#f3f4f6)\'" onmouseout="this.style.background=\'transparent\'" onclick="' + b.onclick.replace(/"/g, '&quot;') + ';try{UIC.closeActionMenu(\'' + id + '\');}catch(e){}">' + UIC.escHtml(b.label) + '</button>';
  }).join('');
  /* [UI-1.2 / U-01] z-index raised from 30 to 1400 to match .combo-list: once the
     menu is positioned against the viewport it is no longer stacked inside the
     table, so it must clear the sticky table header and the topbar. */
  return '<div class="action-dropdown" id="' + id + '" style="position:relative;display:inline-block;">' +
    '<button type="button" class="btn btn-primary" style="padding:6px 14px;font-size:12px;border-radius:999px;" onclick="UIC.toggleActionMenu(\'' + id + '\', event)">إجراءات / Actions ' + UIC.icon('chevron-down', { size: 13 }) + '</button>' +
    '<div class="action-dropdown-menu" style="display:none;position:absolute;right:0;top:100%;margin-top:6px;z-index:1400;min-width:200px;background:var(--bg-surface,#fff);border:1px solid var(--border-color,#e5e7eb);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:6px;flex-direction:column;gap:2px;max-height:320px;overflow:auto;">' + items + '</div></div>';
};
document.addEventListener('click', function(e){
  document.querySelectorAll('.action-dropdown.open').forEach(function(el){
    if(!el.contains(e.target)) UIC.closeActionMenu(el.id);
  });
});
/* Escape closes an open row menu, matching the drawer and the combo. */
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  document.querySelectorAll('.action-dropdown.open').forEach(function (el) { UIC.closeActionMenu(el.id); });
});
(function(){
  var st=document.createElement('style');
  st.textContent='.action-dropdown.open .action-dropdown-menu{display:flex!important;} .action-dropdown-item:hover{background:var(--bg-subtle,#f3f4f6)!important;}';
  document.head.appendChild(st);
})();

UIC.statusPill = function (label, tone) {
  const t = tone || 'neutral';
  return '<span class="pill pill-' + t + '">' + (label || '') + '</span>';
};

UIC.pageAuthorized_ = function (action) {
  const up = window.USER_PAGES;
  if (!up) return true;
  return !!(up[action] && up[action].length);
};
UIC.canAdd_ = function (page) {
  const p = page || window.CURRENT_ACTION;
  const up = window.USER_PAGES;
  if (!up) return true;
  if (window.IS_SUPER_ADMIN) return true;
  const grants = up[p] || [];
  return grants.includes('write') || grants.includes('full');
};
UIC.canFull_ = function (page) {
  const p = page || window.CURRENT_ACTION;
  const up = window.USER_PAGES;
  if (!up) return true;
  if (window.IS_SUPER_ADMIN) return true;
  const grants = up[p] || [];
  return grants.includes('full');
};

/* Navigation helpers — never depend on fragile globals; fall back to the
 * current page URL so links (logo, nav, dropdowns) always work. */
UIC.baseUrl = function () {
  if (window.scriptUrl) return window.scriptUrl;
  try { if (window.top && window.top !== window) return window.top.location.origin + window.top.location.pathname; } catch (e) {}
  return window.location.origin + window.location.pathname;
};
UIC.token = function () {
  try { return window.SESSION_TOKEN || new URLSearchParams(window.location.search).get('sessionToken') || ''; }
  catch (e) { return ''; }
};

/* Navigate to an in-app URL. Prefers TOP-frame navigation so the address bar
 * reflects ?action=… (back/forward + deep-links work); falls back to iframe
 * navigation if the sandbox blocks top-navigation. `ev` = click event. */
UIC.navTo = function (ev, href) {
  try { if (ev && ev.preventDefault) ev.preventDefault(); } catch (e) {}
  if (!href) return;
  try { UIC.showPageLoading('جاري التحميل...'); } catch (e) {}
  try { if (window.top && window.top !== window) { window.top.location.href = href; return; } } catch (e) {}
  window.location.href = href;
};

/* ── Full-screen page-loading overlay (seamless navigation) ───────────────── */
UIC.ensurePageLoading = function () {
  if (document.getElementById('page-loading')) return;
  var st = document.createElement('style');
  st.textContent = '#page-loading{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,.6);direction:rtl;}' +
    '#page-loading.show{display:flex;}' +
    '#page-loading .pl-card{background:#fff;border-radius:12px;padding:18px 26px;box-shadow:0 8px 30px rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;gap:10px;}' +
    '#page-loading .pl-spin{width:34px;height:34px;border:4px solid #eee;border-top-color:#4a90d9;border-radius:50%;animation:plspin .8s linear infinite;}' +
    '@keyframes plspin{to{transform:rotate(360deg);}}' +
    '#page-loading .pl-msg{font-family:inherit;color:#444;font-size:14px;}';
  document.head.appendChild(st);
  var d = document.createElement('div');
  d.id = 'page-loading';
  d.innerHTML = '<div class="pl-card"><div class="pl-spin"></div><div class="pl-msg">جاري التحميل...</div></div>';
  document.body.appendChild(d);
};
UIC.showPageLoading = function (msg) {
  try {
    UIC.ensurePageLoading();
    var d = document.getElementById('page-loading');
    if (msg) { var m = d.querySelector('.pl-msg'); if (m) m.textContent = msg; }
    d.classList.add('show');
  } catch (e) {}
};
UIC.hidePageLoading = function () {
  try { var d = document.getElementById('page-loading'); if (d) d.classList.remove('show'); } catch (e) {}
};
UIC.withPageLoading = function (promise, msg) {
  UIC.showPageLoading(msg || 'جاري التحميل...');
  return Promise.resolve(promise).then(function (r) { UIC.hidePageLoading(); return r; }, function (e) { UIC.hidePageLoading(); throw e; });
};

/* ── Persistent home logo (far-right) → main dashboard, ONLY on ERP Dashboard ─────── */
UIC.ensureHomeLogo = function () {
  // Show FAB only on ERP Dashboard (central hub), not inside company pages which already have topbar company+system logos
  try {
    var action = '';
    try { action = new URLSearchParams(window.location.search).get('action') || ''; } catch(e) {}

  } catch(e) {}
  if (document.getElementById('home-logo-fab')) return;

  document.body.appendChild(a);

  st.textContent = '#home-logo-fab{position:fixed;top:10px;right:10px;z-index:9998;width:38px;height:38px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;cursor:pointer;}' +
    '#home-logo-fab img{width:26px;height:26px;object-fit:contain;}' +
    /* [UI-2.9b / U-48] Was `@media (max-width: 768px)`, while the shell switched
       at 767/768 — so at exactly 768px the two disagreed. Now mobile-first on
       the tier scale: the small size is the base and it grows at tablet-p. */
    '@media (min-width: 600px){#home-logo-fab{width:44px;height:44px;}#home-logo-fab img{width:32px;height:32px;}}';

};

/* Client-side error reporting → server-side ERP_Client_Log sheet. */
UIC.__errCount = 0;
UIC.reportError = function (detail, opt) {
  try {
    if (UIC.__errCount >= 12) return;
    UIC.__errCount = (UIC.__errCount || 0) + 1;
    var payload = {
      page: location.pathname,
      message: String(detail || '').slice(0, 2000),
      stack: (opt && opt.stack ? String(opt.stack).slice(0, 4000) : ''),
      url: location.href ? location.href.slice(0, 1500) : '',
      user: ((window.API && API.getSession && API.getSession() && API.getSession().user && API.getSession().user.email) || '')
    };
    try { google.script.run.withFailureHandler(function () {}).logClientError_(payload); } catch (e2) {}
  } catch (e) {}
};

/* [PERF-11] Uniform page size: every data list paginates at 50 rows per page
 * with navigation rendered BELOW the table. Kept under the legacy AUTO_PAGE_SIZE
 * name so any external readers keep working. */
UIC.AUTO_PAGE_SIZE = 50;

UIC.dataTable = function (containerId, opts) {
  const o = opts || {};
  const rawHeaders = o.headers || [];
  const rows = o.rows || [];
  const searchable = o.searchable !== false;
  const id = containerId || 'datatable';

  /* ── Backward compatibility: accept plain-string headers and/or array rows.
   *     Strings become positional columns ({key:'__col<i>', label:h});
   *     array rows are matched to columns by index. Object usage unchanged. ── */
  const hasStringHeaders = rawHeaders.some(h => typeof h === 'string');
  const headers = hasStringHeaders
    ? rawHeaders.map((h, i) => (typeof h === 'string' ? { key: '__col' + i, label: h } : h))
    : rawHeaders;

  if (rows.length === 0) {
    return '<div class="empty-state"><span>' + (o.emptyText || 'لا توجد بيانات') + '</span></div>';
  }

  const fmtMoney = function (n) {
    if (window.FMT && FMT.currency) return FMT.currency(n);
    const v = Number(n) || 0;
    const parts = v.toFixed(2).split('.');
    return parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + parts[1];
  };

  /* [PERF-11] Uniform 50-row pager (opt out with autoPage:false).
   * Explicit o.pageSize values above 50 are clamped to 50 so every list
   * paginates identically; smaller explicit values are honored as-is. */
  let pageSize = 0;
  if (o.autoPage !== false && rows.length > 50) {
    pageSize = Math.min(o.pageSize || 50, 50);
  }

  /* [UI-1.3 / U-03] Sortable columns advertise their state to assistive tech and
     carry a chevron. `sortable: false` on a header opts a column out — the
     actions column is opted out automatically, since sorting by a block of
     buttons is meaningless. */
  const isSortable = h => h.sortable !== false && (h.key || h.label) !== 'actions';
  const thead = '<thead><tr>' + headers.map(function (h) {
    const key = h.key || h.label;
    return '<th data-key="' + key + '"' +
      (isSortable(h) ? ' data-sortable="true" aria-sort="none"' : '') + '>' +
      '<span class="th-label">' + h.label + '</span>' +
      (isSortable(h) ? '<span class="th-sort" aria-hidden="true"></span>' : '') +
      '</th>';
  }).join('') + '</tr></thead>';

  window.__dtStore = window.__dtStore || {};
  /* [UI-1.3 / U-03] `originalRows` is the load order, and nothing ever reorders
     it. Before this, sorting wrote back into `st.filtered`, which at first
     render was the SAME array object as `st.rows` AND as the caller's own array
     — so a single click on a column header permanently destroyed the order the
     server sent, with no way back. The pipeline is now
     search -> filter -> sort -> slice, re-derived from originalRows each time. */
  window.__dtStore[id] = {
    headers: headers,
    originalRows: rows.slice(),
    rows: rows,
    filtered: rows.slice(),
    pageSize: pageSize, page: 1, pageRows: null,
    fmtMoney: fmtMoney, opts: o,
    searchTerm: '', dateFrom: '', dateTo: '',
    sortKey: null, sortDir: null
  };

  /* ── Toolbar: search + date filter + Excel + Print ── */
  var toolbarParts = [];
  if (searchable) {
    toolbarParts.push('<input class="input" type="search" placeholder="بحث..." oninput="UIC._dtSearchInput(\'' + id + '\', this.value)">');
  }
  if (o.dateFilter) {
    toolbarParts.push('<label style="font-size:13px;">من:</label><input id="' + id + '-from" type="date" class="input" style="width:150px;">');
    toolbarParts.push('<label style="font-size:13px;">إلى:</label><input id="' + id + '-to" type="date" class="input" style="width:150px;">');
    toolbarParts.push('<button type="button" class="btn btn-outline" onclick="UIC.applyDateFilter(\'' + id + '\')">فلتر</button>');
  }
  if (o.exportXlsx !== false) {
    toolbarParts.push('<button type="button" class="btn btn-outline" onclick="UIC.exportExcel(\'' + id + '\')">' + UIC.icon('download') + '<span>Excel</span></button>');
  }
  if (o.printable !== false) {
    toolbarParts.push('<button type="button" class="btn btn-outline" onclick="UIC.printTable(\'' + id + '\')">' + UIC.icon('print') + '<span>طباعة</span></button>');
  }
  var toolbarHtml = toolbarParts.length
    ? '<div class="table-toolbar" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">' + toolbarParts.join('') + '</div>'
    : '';

  // MIT/Harvard chunked: return skeleton, fill tbody chunked via rAF to keep 60fps
  // [PERF-11] pager navigation renders BELOW the table (replaces "show more").
  var pagerHtml = (pageSize > 0)
    ? '<div class="dt-pager" id="' + id + '_pager">' + UIC._dtPagerHtml(id) + '</div>'
    : '';

  const clickAttr = o.rowClick ? ' onclick="UIC._dtRowClick(event, \'' + id + '\')"' : '';
  const html = '<div id="' + id + '" class="table-wrap"' + clickAttr + '>' + toolbarHtml +
    '<table class="table" data-sortable="true"><caption class="sr-only">' + (o.title || '') + '</caption>' + thead +
    '<tbody id="' + id + '_tbody"></tbody></table>' + pagerHtml + '</div>';
  // schedule chunked fill (75 rows per frame, 12ms budget) — Harvard windowed
  setTimeout(function(){ UIC._renderChunked(id, 0); }, 0);
  return html;
};

UIC._dtRowHtml = function (r, headers, fmtMoney, idx) {
  return '<tr' + (idx != null ? ' data-idx="' + idx + '"' : '') + '>' + headers.map((h, i) => {
    const raw = Array.isArray(r) ? r[i] : r[h.key || h.label];
    const v = (raw !== undefined && raw !== null) ? raw : '';
    if (h.money) {
      const num = Number(v) || 0;
      return '<td class="num" data-num="' + num + '">' + fmtMoney(num) + '</td>';
    }
    const sortAttr = h.sortKey ? ' data-sort="' + esc(String(r[h.sortKey] != null ? r[h.sortKey] : '')) + '"' : '';
    return '<td' + (h.numeric ? ' class="num"' : '') + sortAttr + '>' + v + '</td>';
  }).join('') + '</tr>';
};

// MIT/Harvard: chunked tbody fill — 75 rows / 12ms per frame, DocumentFragment, keeps 60fps
UIC._renderChunked = function(id, offset){
  const st = (window.__dtStore || {})[id];
  const tbody = document.getElementById(id + '_tbody');
  if (!st || !tbody) return;
  const CHUNK = 75, BUDGET = 12;
  const list = st.filtered || st.rows;
  // [PERF-11] render the current page slice only (≤ pageSize DOM rows).
  const ps = st.pageSize || 0;
  const pg = Math.max(1, st.page || 1);
  const view = (ps > 0 ? list.slice((pg - 1) * ps, pg * ps) : list);
  st.pageRows = view;
  const total = view.length;
  let idx = offset || 0;
  // first chunk clears
  if(idx===0) tbody.innerHTML = '';
  function tick(){
    const start = performance.now();
    const frag = document.createDocumentFragment();
    // Use template element for fast parsing (Harvard: createContextualFragment)
    const tmp = document.createElement('tbody');
    let html = '';
    const end = Math.min(idx + CHUNK, total);
    for(; idx < end; idx++){
      html += UIC._dtRowHtml(view[idx], st.headers, st.fmtMoney, idx);
      // flush per CHUNK to respect budget
      if (performance.now() - start >= BUDGET) break;
    }
    if (html) { tmp.innerHTML = html; while(tmp.firstChild) frag.appendChild(tmp.firstChild); tbody.appendChild(frag); }
    if (idx < total) requestAnimationFrame(tick);
    else if (st.opts && st.opts.onRendered) { try{ st.opts.onRendered(id); }catch(e){} }
  }
  requestAnimationFrame(tick);
};

UIC._dtRowClick = function (event, id) {
  try {
    const tr = event.target.closest('tr');
    if (!tr) return;
    const st = (window.__dtStore || {})[id];
    if (!st || !st.opts || !st.opts.rowClick) return;
    const ia = tr.getAttribute('data-idx');
    // data-idx is relative to the rendered page slice ([PERF-11] pager).
    const list = st.pageRows || st.filtered || st.rows;
    const rec = (ia != null) ? list[Number(ia)] : null;
    if (rec != null) st.opts.rowClick(rec, tr);
  } catch (e) {}
};

UIC._dtRenderBody = function (id) {
  const st = (window.__dtStore || {})[id];
  const tbody = document.getElementById(id + '_tbody');
  if (!st || !tbody) return;
  // Harvard chunked: delegate to _renderChunked for incremental DOM
  UIC._renderChunked(id, 0);
};

// Backward-compat shim: the "show more" button was replaced by the [PERF-11]
// pager; legacy callers now advance one page. No live pages call this directly.
UIC.dataTableMore = function (id) {
  const st = (window.__dtStore || {})[id];
  if (!st) return;
  UIC.dtGoto(id, (st.page || 1) + 1);
};

/* [PERF-11] pager engine — 50-row pages, navigation BELOW the table.
 * Pipeline: search → filter → sort → slice. Page flips re-slice only (<2ms),
 * never re-running search/filter/sort. Operates purely on data already loaded. */
UIC._dtTotalPages = function (id) {
  const st = (window.__dtStore || {})[id];
  if (!st || !(st.pageSize > 0)) return 1;
  const list = st.filtered || st.rows;
  return Math.max(1, Math.ceil(list.length / st.pageSize));
};

UIC.dtGoto = function (id, page) {
  const st = (window.__dtStore || {})[id];
  if (!st || !(st.pageSize > 0)) return;
  const totalPages = UIC._dtTotalPages(id);
  st.page = Math.min(Math.max(1, Number(page) || 1), totalPages);
  UIC._dtRenderBody(id);
  UIC._dtRefreshPager(id);
};

UIC._dtPagerHtml = function (id) {
  const st = (window.__dtStore || {})[id];
  if (!st || !(st.pageSize > 0)) return '';
  const list = st.filtered || st.rows;
  const total = list.length;
  const ps = st.pageSize;
  const totalPages = Math.max(1, Math.ceil(total / ps));
  if (totalPages <= 1) return '';
  const pg = Math.min(Math.max(1, st.page || 1), totalPages);
  st.page = pg;
  const from = total === 0 ? 0 : (pg - 1) * ps + 1;
  const to = Math.min(pg * ps, total);
  // Windowed numbers: up to 7 (1 … window … last), RTL-friendly order.
  var pages = [];
  var push = function (p) { if (pages.indexOf(p) === -1) pages.push(p); };
  if (totalPages <= 7) {
    for (var i = 1; i <= totalPages; i++) push(i);
  } else {
    push(1);
    if (pg > 3) pages.push('…');
    for (var k = Math.max(2, pg - 1); k <= Math.min(totalPages - 1, pg + 1); k++) push(k);
    if (pg < totalPages - 2) pages.push('…');
    push(totalPages);
  }
  var btn = function (label, target, disabled, primary) {
    return '<button type="button" class="btn ' + (primary ? 'btn-primary' : 'btn-outline') + '"' +
      ' style="padding:4px 10px;min-width:0;"' +
      (disabled ? ' disabled' : ' onclick="UIC.dtGoto(\'' + id + '\',' + target + ')"') + '>' + label + '</button>';
  };
  var nums = pages.map(function (p) {
    return (p === '…') ? '<span style="padding:0 4px;color:var(--text-muted);">…</span>' : btn(p, p, false, p === pg);
  }).join('');
  return '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;padding:10px 4px 2px;">' +
    btn('الأولى', 1, pg === 1) + btn('السابق', pg - 1, pg === 1) + nums +
    btn('التالي', pg + 1, pg === totalPages) + btn('الأخيرة', totalPages, pg === totalPages) +
    '<span style="font-size:13px;color:var(--text-muted);margin-inline-start:8px;">عرض ' + from + ' – ' + to + ' من ' + total + ' سجل</span></div>';
};

UIC._dtRefreshPager = function (id) {
  const st = (window.__dtStore || {})[id];
  if (!st) return;
  var el = document.getElementById(id + '_pager');
  if (!el && st.pageSize > 0) {
    // Pager div was absent (table built with ≤50 rows, then grew): append below table.
    var wrap = document.getElementById(id);
    if (wrap) {
      el = document.createElement('div');
      el.className = 'dt-pager';
      el.id = id + '_pager';
      wrap.appendChild(el);
    }
  }
  if (el) el.innerHTML = UIC._dtPagerHtml(id);
};

/* [PERF-11] 150ms debounced search input (replaces raw per-keystroke filtering).
 * UIC.filterPaged stays immediate for programmatic callers. */
UIC._dtSearchInput = function (id, term) {
  var st = (window.__dtStore || {})[id];
  if (!st) return;
  try { clearTimeout(st._searchTimer); } catch (e) {}
  st._searchTimer = setTimeout(function () { UIC.filterPaged(id, term); }, 150);
};

UIC.filterPaged = function (id, term) {
  var st = (window.__dtStore || {})[id];
  if (!st) return;
  st.searchTerm = (term || '').trim().toLowerCase();
  UIC._applyFilters(id);
};

UIC._applyFilters = function (id) {
  var st = (window.__dtStore || {})[id];
  if (!st) return;
  var q = st.searchTerm || '';
  var dateFrom = st.dateFrom || '';
  var dateTo = st.dateTo || '';
  var dateKey = (st.opts && st.opts.dateKey) || 'date';
  /* [UI-1.3 / U-03] Filter from the untouched load order, never from a
     previously sorted result, so clearing a sort really does restore it. */
  st.filtered = (st.originalRows || st.rows).filter(function (r) {
    if (q) {
      try { if (JSON.stringify(r == null ? '' : r).toLowerCase().indexOf(q) === -1) return false; } catch (e) { return false; }
    }
    if (dateFrom || dateTo) {
      var rv = r[dateKey];
      if (!rv) return false;
      var ds = String(rv).slice(0, 10);
      if (dateFrom && ds < dateFrom) return false;
      if (dateTo && ds > dateTo) return false;
    }
    return true;
  });
  // [PERF-11] Global search already ran above across ALL loaded records
  // (st.rows); reset to page 1 and re-slice. Pager follows the filtered list.
  UIC._applySort(id);
  st.page = 1;
  st.pageSize = (st.opts.autoPage === false) ? 0 : ((st.filtered.length > 50) ? 50 : 0);
  UIC._dtRenderBody(id);
  UIC._dtRefreshPager(id);
};

/* [UI-1.3 / U-03] Sort the current filtered set in place.
 *
 * `st.filtered` is always a fresh array produced by `.filter()` or by
 * `originalRows.slice()`, so reordering it never touches the load order.
 *
 * The comparator keeps the O(n) decorate–sort–undecorate shape the performance
 * run built: each row's sort value is read and parsed ONCE into a decorated
 * record, the sort compares pre-parsed fields, and the rows are read back out.
 * Complexity is unchanged; only the third state and the stable tie-break are
 * new. The tie-break on the original index makes the sort stable, so rows that
 * compare equal keep their load order instead of shuffling between sorts. */
UIC._applySort = function (id) {
  var st = (window.__dtStore || {})[id];
  if (!st) return;
  if (!st.sortKey || !st.sortDir) return;          /* third state: load order */
  var list = st.filtered;
  if (!list || list.length < 2) return;

  var asc = st.sortDir === 'asc';
  var hIdx = st.headers.findIndex(function (h) { return (h.key || h.label) === st.sortKey; });
  if (hIdx === -1) return;
  var sortKey = st.headers[hIdx].sortKey || null;
  var key = st.sortKey;

  var decorated = list.map(function (r, i) {
    var raw;
    if (Array.isArray(r)) raw = r[hIdx];
    else if (sortKey) raw = r[sortKey];
    else raw = r[key];
    var s = (raw == null) ? '' : String(raw);
    var n = parseFloat(s.replace(/,/g, ''));
    return { r: r, s: s, n: n, i: i, isNum: !isNaN(n) && s.trim() !== '' };
  });
  decorated.sort(function (a, b) {
    var c;
    if (a.isNum && b.isNum) c = a.n - b.n;
    else c = a.s.localeCompare(b.s, 'ar');
    if (c !== 0) return asc ? c : -c;
    return a.i - b.i;                              /* stable */
  });
  for (var j = 0; j < decorated.length; j++) list[j] = decorated[j].r;
};

/* Reflect the sort state onto the header cells: aria-sort for assistive tech,
 * a class for the chevron. Called after every sort change. */
UIC._dtSyncSortIndicators = function (id) {
  var st = (window.__dtStore || {})[id];
  var container = document.getElementById(id);
  if (!container) return;
  container.querySelectorAll('th[data-sortable="true"]').forEach(function (th) {
    var key = th.getAttribute('data-key');
    var active = st && st.sortKey === key && st.sortDir;
    th.setAttribute('aria-sort', active ? (st.sortDir === 'asc' ? 'ascending' : 'descending') : 'none');
    th.classList.remove('sorted-asc', 'sorted-desc');
    if (active) th.classList.add(st.sortDir === 'asc' ? 'sorted-asc' : 'sorted-desc');
  });
};

UIC.applyDateFilter = function (id) {
  var st = (window.__dtStore || {})[id];
  if (!st) return;
  var fromEl = document.getElementById(id + '-from');
  var toEl = document.getElementById(id + '-to');
  st.dateFrom = fromEl ? fromEl.value : '';
  st.dateTo = toEl ? toEl.value : '';
  UIC._applyFilters(id);
};

UIC.exportExcel = function (id) {
  var st = (window.__dtStore || {})[id];
  if (!st) return;
  var rows = st.filtered || st.rows;
  if (!rows || !rows.length) { UIC.toast('لا توجد بيانات للتصدير', 'error'); return; }
  // F-18: the library is fetched on first export instead of on every page load.
  if (typeof XLSX === 'undefined') UIC.toast('جاري تحميل مكتبة Excel...', 'info');
  API.ensureXlsx().then(function () {
    var headers = st.headers.filter(function (h) { return h.key !== 'actions'; });
    var data = rows.map(function (r) {
      var obj = {};
      headers.forEach(function (h) { obj[h.label] = r[h.key] != null ? r[h.key] : ''; });
      return obj;
    });
    var ws = XLSX.utils.json_to_sheet(data);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
    var from = st.dateFrom || '';
    var to = st.dateTo || '';
    var title = (st.opts && st.opts.title) || 'report';
    var filename = title + (from ? '_' + from : '') + (to ? '_to_' + to : '') + '.xlsx';
    XLSX.writeFile(wb, filename);
  }).catch(function (e) {
    UIC.toast((e && e.message) || 'تعذر تحميل مكتبة Excel', 'error');
  });
};

UIC.printTable = function (id) {
  var st = (window.__dtStore || {})[id];
  if (!st) return;
  var rows = st.filtered || st.rows;
  if (!rows || !rows.length) { UIC.toast('لا توجد بيانات للطباعة', 'error'); return; }
  var headers = st.headers.filter(function (h) { return h.key !== 'actions'; });
  var from = st.dateFrom || '';
  var to = st.dateTo || '';
  var title = (st.opts && st.opts.title) || '';
  var dateLabel = (from && to) ? 'من ' + from + ' إلى ' + to : from ? 'من ' + from : to ? 'إلى ' + to : 'الكل';
  var logoUrl = window.COMPANY_LOGO_URL || '';
  var w = window.open('', '_blank');
  if (!w) { UIC.toast('تم حظر النافذة المنبثقة', 'error'); return; }
  var rowsHtml = rows.map(function (r) {
    return '<tr>' + headers.map(function (h) {
      var v = r[h.key] != null ? r[h.key] : '';
      return '<td>' + esc(String(v)) + '</td>';
    }).join('') + '</tr>';
  }).join('');
  var theadHtml = '<tr>' + headers.map(function (h) {
    return '<th>' + esc(h.label) + '</th>';
  }).join('') + '</tr>';
  w.document.open();
  w.document.write(
    '<!DOCTYPE html><html lang="ar"><head><meta charset="utf-8"><title>' + esc(title) + '</title>' +
    '<style>body{font-family:Cairo,sans-serif;direction:rtl;padding:20px;}' +
    'h2{text-align:center;margin-bottom:4px;} .date-info{text-align:center;color:#666;margin-bottom:16px;}' +
    '.logo{text-align:center;margin-bottom:8px;} .logo img{max-height:60px;}' +
    'table{width:100%;border-collapse:collapse;font-size:12px;} th,td{border:1px solid #ccc;padding:6px 8px;text-align:right;}' +
    'th{background:#f0f0f0;font-weight:700;} @media print{body{padding:0;}}</style></head><body>' +
    (logoUrl ? '<div class="logo"><img src="' + esc(logoUrl) + '"></div>' : '') +
    '<h2>' + esc(title) + '</h2>' +
    '<div class="date-info">التاريخ: ' + esc(dateLabel) + ' — العدد: ' + rows.length + '</div>' +
    '<table><thead>' + theadHtml + '</thead><tbody>' + rowsHtml + '</tbody></table>' +
    '</body></html>'
  );
  w.document.close();
  w.print();
};

UIC.filterTable = function (containerId, term) {
  UIC._ftTimers = UIC._ftTimers || {};
  const timers = UIC._ftTimers;
  if (timers[containerId]) clearTimeout(timers[containerId]);
  timers[containerId] = setTimeout(function () { UIC.filterPaged(containerId, term); }, 120);
};

/* ── Client-side reference-enum cache (avoid repeated server round-trips) ─── */
UIC.cacheOptions = function (key, arr, ttlMs) {
  try {
    localStorage.setItem('erp_opt_' + key, JSON.stringify({ t: Date.now(), ttl: ttlMs || 600000, v: arr }));
  } catch (e) {}
};
UIC.getCachedOptions = function (key) {
  try {
    const raw = localStorage.getItem('erp_opt_' + key);
    if (!raw) return null;
    const p = JSON.parse(raw);
    if (!p || !p.v) return null;
    if (p.ttl && (Date.now() - p.t) > p.ttl) return null;
    return p.v;
  } catch (e) { return null; }
};

/* ── Server-paged table: loads one window at a time, "load more" appends ─────
 * opts: { container, headers, pageSize, searchable, mapRow, fetcher, onFirst }
 *   mapRow(rawRecord) -> array of cell-HTML strings (UIC.dataTable row format)
 *   fetcher(offset, limit) -> Promise<{ rows: rawRecords[], total: number }>
 *   onFirst(firstResponse) -> capture globals (parties/enums) on first load   */
/* Skeleton placeholder: shimmering table + spinner shown while the first fetch is in flight. */
UIC.tableSkeleton = function (headers, rowCount) {
  var cols = (headers || []).map(function (h) { return (h && typeof h === 'object') ? (h.label || '') : String(h == null ? '' : h); });
  var n = rowCount || 8;
  var ths = cols.map(function (c) { return '<th>' + c + '</th>'; }).join('');
  var rows = '';
  for (var i = 0; i < n; i++) {
    rows += '<tr>' + cols.map(function () { return '<td><div class="pt-sk-bar"></div></td>'; }).join('') + '</tr>';
  }
  return '<div class="pt-loading"><div class="pt-spin"></div><span>جاري تحميل البيانات…</span></div>' +
    '<table class="pt-sk-table"><thead><tr>' + ths + '</tr></thead><tbody>' + rows + '</tbody></table>';
};

UIC.PagedTable = function (opts) {
  try {
    var container = typeof opts.container === 'string' ? document.getElementById(opts.container) : opts.container;
    if (!container) return;
    var hostId = 'pt_' + Math.random().toString(36).slice(2);
    var PAGE = opts.pageSize || 100;
    var offset = 0, total = 0, loading = false, done = false;
    var allRows = [];
    container.innerHTML =
      '<div id="' + hostId + '"></div>' +
      '<div class="pt-foot" style="display:flex;gap:12px;align-items:center;margin-top:10px;">' +
        '<button type="button" class="btn-secondary" id="' + hostId + '_more" style="display:none;">عرض المزيد</button>' +
        '<span class="pt-count" id="' + hostId + '_count" style="color:#666;font-size:13px;"></span>' +
      '</div>';
    var host = container.querySelector('#' + hostId);
    var moreBtn = container.querySelector('#' + hostId + '_more');
    var countEl = container.querySelector('#' + hostId + '_count');
    host.innerHTML = UIC.tableSkeleton(opts.headers, 8);

    function render() {
      host.innerHTML = UIC.dataTable(hostId, {
        headers: opts.headers,
        rows: allRows,
        searchable: opts.searchable !== false,
        emptyText: opts.emptyText || 'لا توجد بيانات',
        autoPage: false
      });
    }
    function setCount() {
      if (!countEl) return;
      countEl.textContent = 'إجمالي ' + total + (offset > 0 && offset < total ? ' — معروض ' + offset : '');
    }
    function loadMore() {
      if (loading || done) return;
      loading = true; moreBtn.disabled = true; moreBtn.textContent = 'جاري التحميل...';
      Promise.resolve(opts.fetcher(offset, PAGE)).then(function (raw) {
        raw = raw || {};
        var recs = (opts.getRows ? opts.getRows(raw)
          : (raw.rows || raw.invoices || raw.returns || raw.orders || raw.sessions || raw.headers || [])) || [];
        if (offset === 0 && opts.onFirst) { try { opts.onFirst(raw); } catch (e) {} }
        recs.forEach(function (rec) { try { allRows.push(opts.mapRow(rec)); } catch (e) {} });
        offset += recs.length;
        total = (opts.getTotal ? opts.getTotal(raw) : (raw.total != null ? raw.total : offset));
        done = offset >= total;
        render();
        if (opts.onRendered) { try { opts.onRendered(hostId); } catch (e) {} }
        moreBtn.style.display = done ? 'none' : '';
        setCount();
      }).catch(function (e) {
        if (offset === 0 && host) host.innerHTML = '<div class="empty-state"><span>تعذر تحميل البيانات — أعد المحاولة</span></div>';
        UIC.toast('خطأ: ' + (e && e.message ? e.message : e), 'error');
      }).finally(function () {
        loading = false; moreBtn.disabled = false; moreBtn.textContent = 'عرض المزيد';
      });
    }
    moreBtn.addEventListener('click', loadMore);
    setCount();
    loadMore();
  } catch (e) {
    UIC.toast('خطأ في الجدول: ' + (e && e.message ? e.message : e), 'error');
  }
};

/* [UI-1.3 / U-03] Tri-state column sort: ascending -> descending -> load order.
 *
 * Before this the sort was binary, had no visible indicator, and wrote its
 * result back over the only copy of the rows — so there was no way to get the
 * original order back short of reloading the page. */
UIC._dtNextSortDir = function (current) {
  return current === 'asc' ? 'desc' : current === 'desc' ? null : 'asc';
};

UIC.initTableSort = function (containerId) {
  const container = document.getElementById(containerId);
  if (!container) return;
  const st = (window.__dtStore || {})[containerId];

  /* Tables built by UIC.dataTable mark the columns that opted in, so a header
     carrying `sortable: false` — and the actions column — gets no listener, no
     pointer cursor and no chevron. Tables a page hand-built have no store and
     no markers, so they keep the legacy behaviour of every header being
     sortable; 50 pages call this function and some of them pass such a table. */
  const managed = !!st;
  const cells = container.querySelectorAll(managed ? 'th[data-sortable="true"]' : 'th');

  cells.forEach(th => {
    th.style.cursor = 'pointer';
    /* Reachable by keyboard, not only by mouse (U-33 asks for this everywhere;
       here it costs two attributes). */
    th.setAttribute('tabindex', '0');

    const activate = function () {
      if (managed) {
        const key = th.getAttribute('data-key');
        if (!key || !st.filtered) return;
        /* asc -> desc -> load order */
        st.sortDir = (st.sortKey === key) ? UIC._dtNextSortDir(st.sortDir) : 'asc';
        st.sortKey = st.sortDir ? key : null;
        /* Re-derive from the untouched load order, then re-apply search, date
           filter and sort. This is what makes the third click genuinely restore
           the original order. _applyFilters ends by sorting, rendering and
           refreshing the pager. */
        UIC._applyFilters(containerId);
        UIC._dtSyncSortIndicators(containerId);
        return;
      }

      /* Legacy DOM-row sort, for tables not built by UIC.dataTable. Unchanged
         except that it now cycles through three states like the managed path. */
      const prev = th.getAttribute('data-sort-dir');
      const dir = UIC._dtNextSortDir(prev);
      container.querySelectorAll('th').forEach(function (x) {
        if (x !== th) { x.removeAttribute('data-sort-dir'); x.setAttribute('aria-sort', 'none'); }
      });
      const tbody = container.querySelector('tbody');
      if (!tbody) return;
      const rows = Array.from(tbody.querySelectorAll('tr'));
      if (!dir) {
        /* Third state: put the DOM rows back in the order they were first seen. */
        if (!th.__uicDomOrder) return;
        th.__uicDomOrder.forEach(r => tbody.appendChild(r));
        th.removeAttribute('data-sort-dir');
        th.setAttribute('aria-sort', 'none');
        th.classList.remove('sorted-asc', 'sorted-desc');
        return;
      }
      if (!th.__uicDomOrder) th.__uicDomOrder = rows.slice();
      const asc = dir === 'asc';
      const cellIdx = Array.prototype.indexOf.call(th.parentNode.children, th) + 1;
      const valueOf = function (tr) {
        const c = tr.querySelector('td:nth-child(' + cellIdx + ')');
        if (!c) return '';
        if (c.getAttribute('data-sort') != null) return c.getAttribute('data-sort');
        if (c.getAttribute('data-num') != null) return c.getAttribute('data-num');
        return c.textContent.trim();
      };
      rows.sort((a, b) => {
        const av = valueOf(a), bv = valueOf(b);
        const numA = parseFloat(av), numB = parseFloat(bv);
        if (!isNaN(numA) && !isNaN(numB)) return asc ? numA - numB : numB - numA;
        return asc ? String(av).localeCompare(String(bv), 'ar') : String(bv).localeCompare(String(av), 'ar');
      });
      rows.forEach(r => tbody.appendChild(r));
      th.setAttribute('data-sort-dir', dir);
      th.setAttribute('aria-sort', asc ? 'ascending' : 'descending');
      th.classList.remove('sorted-asc', 'sorted-desc');
      th.classList.add(asc ? 'sorted-asc' : 'sorted-desc');
    };

    th.addEventListener('click', activate);
    th.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); activate(); }
    });
  });

  if (managed) UIC._dtSyncSortIndicators(containerId);
};

UIC.field = function (o) {
  const t = o.type || 'text';
  const required = o.required ? ' required' : '';
  const value = o.value !== undefined && o.value !== null ? ' value="' + o.value + '"' : '';
  const placeholder = o.placeholder ? ' placeholder="' + o.placeholder + '"' : '';
  const listAttr = o.list ? ' list="' + o.list + '"' : '';
  const minAttr = o.min !== undefined ? ' min="' + o.min + '"' : '';
  const stepAttr = o.step !== undefined ? ' step="' + o.step + '"' : '';

  /* ── Mobile: smart inputmode + enterkeyhint attributes ── */
  let inputmode = '';
  let enterkeyhint = '';
  let autocomplete = o.autocomplete ? ' autocomplete="' + o.autocomplete + '"' : '';
  let autocapitalize = '';
  if (t === 'tel')   { inputmode = ' inputmode="tel"'; enterkeyhint = ' enterkeyhint="done"'; }
  if (t === 'email') { inputmode = ' inputmode="email"'; enterkeyhint = ' enterkeyhint="done"'; autocapitalize = ' autocapitalize="off"'; if (!autocomplete) autocomplete = ' autocomplete="email"'; }
  if (t === 'number' || t === 'text' && o.numeric) { inputmode = ' inputmode="decimal"'; enterkeyhint = ' enterkeyhint="done"'; }
  if (t === 'search') { inputmode = ' inputmode="search"'; enterkeyhint = ' enterkeyhint="search"'; }
  if (t === 'password') { if (!autocomplete) autocomplete = ' autocomplete="current-password"'; }
  /* Prevent Android keyboard from autocorrecting code/ID fields */
  if (o.noCorrect) { autocapitalize = ' autocapitalize="off" autocorrect="off" autocomplete="off"'; }

  let control;
  if (t === 'select') {
    if (o.combo === false) {
      const emptyOpt = o.placeholder ? '<option value="">' + o.placeholder + '</option>' : '';
      const options = (o.options || []).map(opt => {
        const v = typeof opt === 'object' ? opt.value : opt;
        const l = typeof opt === 'object' ? opt.label : opt;
        const sel = String(v) === String(o.value) ? ' selected' : '';
        return '<option value="' + v + '"' + sel + '>' + l + '</option>';
      }).join('');
      control = '<select id="' + o.key + '" class="input"' + required + '>' + emptyOpt + options + '</select>';
    } else {
      return UIC.combo(o);
    }
  } else if (t === 'textarea') {
    control = '<textarea id="' + o.key + '" class="input" rows="' + (o.rows || 3) + '"' + required + inputmode + '>' + (o.value || '') + '</textarea>';
  } else {
    control = '<input id="' + o.key + '" class="input" type="' + t + '"' + value + placeholder + required + listAttr + minAttr + stepAttr + inputmode + enterkeyhint + autocomplete + autocapitalize + '>';
  }

  const errId = 'err-' + o.key;
  return '<div class="form-field" data-field="' + o.key + '">' +
    '<label class="form-label" for="' + o.key + '">' + (o.label || '') + (required ? ' <span class="req">*</span>' : '') + '</label>' +
    control +
    '<div class="field-error" id="' + errId + '"></div>' +
    '</div>';
};

UIC.datalist = function (id, values) {
  const esc = function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  };
  return '<datalist id="' + id + '">' +
    (values || []).map(function (v) { return '<option value="' + esc(v) + '"></option>'; }).join('') +
    '</datalist>';
};

UIC.combo = function (o) {
  const key = o.key;
  const esc = function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  };
  const opts = (o.options || []).map(function (opt) {
    const v = typeof opt === 'object' ? opt.value : opt;
    const l = typeof opt === 'object' ? opt.label : opt;
    return { value: String(v).trim(), label: String(l).trim() };
  });
  const byVal = {};
  const byLabel = {};
  opts.forEach(function (op) { byVal[op.value] = op; byLabel[op.label] = op; byVal[op.value.toLowerCase()] = op; byLabel[op.label.toLowerCase()] = op; });
  const req = o.required ? ' required' : '';
  const ph = o.placeholder ? ' placeholder="' + esc(o.placeholder) + '"' : '';
  const cur = o.value !== undefined && o.value !== null ? String(o.value).trim() : '';
  const curLabel = (byVal[cur] && byVal[cur].label) || (byLabel[cur] && byLabel[cur].label) || (byVal[cur.toLowerCase()] && byVal[cur.toLowerCase()].label) || (byLabel[cur.toLowerCase()] && byLabel[cur.toLowerCase()].label) || cur;
  const optHtml = opts.map(function (op, i) {
    return '<div class="combo-option" data-value="' + esc(op.value) + '" data-i="' + i + '" onmousedown="event.preventDefault();UIC.comboPick(\'' + key + '\',' + i + ')">' + esc(op.label) + '</div>';
  }).join('');
  const allowNew = o.allowNew ? ' data-allownew="1"' : '';
  window.__comboData = window.__comboData || {};
  window.__comboData[key] = { opts: opts, allowNew: !!o.allowNew };
  const inner = '<div class="combo" data-combo="' + key + '">' +
    '<input id="' + key + '_display" class="input combo-input" autocomplete="off"' + ph + req + ' value="' + esc(curLabel) + '"' +
    ' onfocus="UIC.comboOpen(\'' + key + '\')" oninput="UIC.comboFilter(\'' + key + '\', this.value)" onblur="UIC.comboBlur(\'' + key + '\')" onkeydown="UIC.comboKey(\'' + key + '\', event)">' +
    '<input type="hidden" id="' + key + '" value="' + esc(cur) + '"' + allowNew + '>' +
    '<div class="combo-list" id="' + key + '_list" hidden>' + optHtml + '</div>' +
    '</div>';
  if (o.inline) return inner;
  return '<div class="form-field" data-field="' + key + '">' +
    '<label class="form-label" for="' + key + '_display">' + (o.label || '') + (o.required ? ' <span class="req">*</span>' : '') + '</label>' +
    inner +
    (o.allowNew ? '<input id="' + key + '_custom" class="input" style="margin-top:8px;display:none;" placeholder="أدخل القيمة الجديدة">' : '') +
    '<div class="field-error" id="err-' + key + '"></div>' +
    '</div>';
};

/* Searchable select alias (same component, clearer name for reference enums). */
UIC.SearchableSelect = UIC.combo;

/* [UI-1.2 / U-01] A combo inside a table cell was clipped by `.table-wrap`, and
 * one near the bottom of a modal was clipped by the modal's own scroll box.
 * Anchoring the list to its input against the viewport fixes both. The element
 * does not move in the DOM, so comboBlur / comboPick / comboKey and the
 * outside-click handler — all of which use `.closest('.combo')` — are unchanged. */
UIC._comboAnchor = function (key) {
  var list = document.getElementById(key + '_list');
  var input = document.getElementById(key + '_display');
  if (!list || !input || list.hidden) return;
  UIC._anchorFixed(list, input, { matchWidth: true });
};
UIC._comboUnanchor = function (key) {
  var list = document.getElementById(key + '_list');
  if (list) UIC._unanchor(list);
};

UIC.comboOpen = function (key) {
  const list = document.getElementById(key + '_list');
  if (!list) return;
  list.hidden = false;
  UIC.comboFilter(key, document.getElementById(key + '_display').value);
  UIC._comboAnchor(key);
};

UIC.escHtml = function (s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
};
UIC.comboHighlight = function (label, q) {
  var s = UIC.escHtml(label);
  try {
    var qEsc = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    var re = new RegExp('(' + qEsc + ')', 'ig');
    s = s.replace(re, '<mark>$1</mark>');
  } catch (e) {}
  return s;
};
UIC.comboFilter = function (key, text) {
  const list = document.getElementById(key + '_list');
  if (!list) return;
  const data = (window.__comboData || {})[key];
  const q = String(text || '').trim().toLowerCase();
  const opts = (data && data.opts) || [];
  let visible = 0;
  opts.forEach(function (op, i) {
    const el = list.querySelector('[data-i="' + i + '"]');
    if (!el) return;
    const match = !q || op.label.toLowerCase().indexOf(q) !== -1 || op.value.toLowerCase().indexOf(q) !== -1;
    el.style.display = match ? '' : 'none';
    if (match) {
      visible++;
      el.innerHTML = q ? UIC.comboHighlight(op.label, q) : UIC.escHtml(op.label);
    }
  });
  list.style.display = visible ? '' : 'none';
  /* Filtering changes the list's height, so an anchored list must be re-placed
     or it drifts away from its input as options disappear. */
  if (list.__uicAnchor) UIC._anchorFixed(list, list.__uicAnchor, list.__uicOpts);
};

UIC.comboPick = function (key, i) {
  const data = (window.__comboData || {})[key];
  if (!data || !data.opts[i]) return;
  const op = data.opts[i];
  const disp = document.getElementById(key + '_display');
  const hidden = document.getElementById(key);
  if (disp) disp.value = op.label;
  if (hidden) {
    const changed = String(hidden.value) !== op.value;
    hidden.value = op.value;
    if (changed) hidden.dispatchEvent(new Event('change'));
  }
  const cust = document.getElementById(key + '_custom');
  if (cust) { cust.style.display = 'none'; cust.removeAttribute('required'); cust.value = ''; }
  const list = document.getElementById(key + '_list');
  if (list) { list.hidden = true; UIC._unanchor(list); }
};

UIC.comboBlur = function (key) {
  const disp = document.getElementById(key + '_display');
  const hidden = document.getElementById(key);
  const data = (window.__comboData || {})[key];
  if (!disp || !hidden || !data) return;
  const text = String(disp.value || '').trim();
  const textLower = text.toLowerCase();
  let match = null;
  data.opts.forEach(function (op) { if (String(op.label).trim().toLowerCase() === textLower || String(op.value).trim().toLowerCase() === textLower) match = op; });
  if (match) {
    hidden.value = match.value;
    const cust = document.getElementById(key + '_custom');
    if (cust) { cust.style.display = 'none'; cust.removeAttribute('required'); cust.value = ''; }
  } else if (text) {
    if (data.allowNew) {
      const cust = document.getElementById(key + '_custom');
      hidden.value = '__new__';
      if (cust) { cust.style.display = ''; cust.value = text; cust.setAttribute('required', 'required'); }
    } else {
      disp.value = '';
      hidden.value = '';
    }
  } else {
    hidden.value = '';
  }
  const list = document.getElementById(key + '_list');
  if (list) { list.hidden = true; UIC._unanchor(list); }
};

UIC.comboKey = function (key, ev) {
  const list = document.getElementById(key + '_list');
  if (!list) return;
  const visibleEls = [].slice.call(list.querySelectorAll('.combo-option')).filter(function (el) { return el.style.display !== 'none'; });
  if (!visibleEls.length) return;
  let idx = visibleEls.indexOf(list.querySelector('.combo-option.active'));
  if (ev.key === 'ArrowDown') {
    ev.preventDefault();
    idx = (idx + 1) % visibleEls.length;
  } else if (ev.key === 'ArrowUp') {
    ev.preventDefault();
    idx = (idx - 1 + visibleEls.length) % visibleEls.length;
  } else if (ev.key === 'Enter') {
    ev.preventDefault();
    const el = idx >= 0 ? visibleEls[idx] : visibleEls[0];
    UIC.comboPick(key, Number(el.getAttribute('data-i')));
    return;
  } else if (ev.key === 'Escape') {
    list.hidden = true;
    UIC._unanchor(list);
    return;
  } else {
    return;
  }
  visibleEls.forEach(function (el) { el.classList.remove('active'); });
  visibleEls[idx].classList.add('active');
  visibleEls[idx].scrollIntoView({ block: 'nearest' });
};

document.addEventListener('click', function (ev) {
  document.querySelectorAll('.combo-list').forEach(function (list) {
    if (list.hidden) return;
    const host = list.closest('.combo');
    if (!host) return;
    if (!ev.target.closest('.combo') || ev.target.closest('.combo') !== host) {
      list.hidden = true;
      UIC._unanchor(list);
    }
  });
});

UIC.enumSelect = function (o) {
  return UIC.combo(Object.assign({}, o, { allowNew: true }));
};

UIC.enumToggle = function (id) {
  const sel = document.getElementById(id);
  const custom = document.getElementById(id + '_custom');
  if (!sel || !custom) return;
  if (sel.value === '__new__') {
    custom.style.display = '';
    custom.setAttribute('required', 'required');
    custom.focus();
  } else {
    custom.style.display = 'none';
    custom.removeAttribute('required');
    custom.value = '';
  }
};

UIC.fileField = function (o) {
  const accept = o.accept || '';
  const required = o.required ? ' required' : '';
  return '<div class="form-field" data-field="' + o.key + '">' +
    '<label class="form-label" for="' + o.key + '">' + (o.label || '') + '</label>' +
    '<input id="' + o.key + '" name="' + (o.name || 'file') + '" class="input" type="file"' +
    (accept ? ' accept="' + accept + '"' : '') + required + '>' +
    '<div class="field-error" id="err-' + o.key + '"></div>' +
    '</div>';
};

UIC.fileError = function (key, msg) {
  const err = document.getElementById('err-' + key);
  if (err) err.textContent = msg || '';
};

UIC._readForm = function (formId) {
  const form = document.getElementById(formId);
  if (!form) return { data: {}, valid: true };
  const data = {};
  let valid = true;
  form.querySelectorAll('.form-field').forEach(function (field) {
    const err = field.querySelector('.field-error');
    let fieldError = false;
    field.querySelectorAll('input, select, textarea').forEach(function (input) {
      if (input.type === 'file') return;
      data[input.id] = input.value.trim();
      if (input.hasAttribute('required') && input.value.trim() === '') fieldError = true;
    });
    if (fieldError) {
      if (err) err.textContent = 'هذا الحقل مطلوب';
      field.classList.add('has-error');
      valid = false;
    } else {
      if (err) err.textContent = '';
      field.classList.remove('has-error');
    }
  });
  return { data: data, valid: valid };
};

UIC.validateForm = function (formId) {
  return UIC._readForm(formId).valid;
};

UIC.collectForm = function (formId) {
  return UIC._readForm(formId).data;
};

UIC.collectAndValidateForm = function (formId) {
  const r = UIC._readForm(formId);
  return { data: r.data, valid: r.valid };
};

/* Dialog widths. 'md' (560px) is the default and deliberately emits NO class, so
   markup for every caller that passes no size stays byte-identical to before. */
UIC.MODAL_SIZES = { sm: ' modal-sm', md: '', lg: ' modal-lg', xl: ' modal-xl' };

UIC.openModal = function (modalId, opts) {
  const o = opts || {};
  const existing = document.getElementById(modalId);
  if (existing) existing.remove();

  const sizeClass = UIC.MODAL_SIZES[o.size] || '';

  const div = document.createElement('div');
  div.id = modalId;
  div.className = 'modal-overlay';
  div.innerHTML =
    '<div class="modal' + sizeClass + '" role="dialog" aria-modal="true">' +
      '<div class="modal-header"><h3>' + (o.title || '') + '</h3>' +
        '<button class="btn-icon" onclick="UIC.closeModal(\'' + modalId + '\')" aria-label="إغلاق">' + UIC.icon('close', { size: 18 }) + '</button></div>' +
      '<div class="modal-body">' + (o.body || '') + '</div>' +
      (o.footer === false
        ? ''
        : typeof o.footer === 'string'
          /* Custom footer markup. Additive: every caller before this passed
             either nothing or false, so the default below is untouched. */
          ? '<div class="modal-footer">' + o.footer + '</div>'
          : '<div class="modal-footer">' + UIC.button({ text: 'إلغاء', type: 'outline', onClick: 'UIC.closeModal(\'' + modalId + '\')' }) + ' ' + UIC.button({ text: 'حفظ', onClick: 'UI.submitOnce(this, function(){' + (o.onSave || '') + '})' }) + '</div>') +
    '</div>';
  document.body.appendChild(div);
  document.body.classList.add('modal-open');
  return div;
};

UIC.closeModal = function (modalId) {
  const el = document.getElementById(modalId);
  if (el) el.remove();
  document.body.classList.remove('modal-open');
};

UIC.toast = function (message, type) {
  const t = type || 'success';
  const toast = document.createElement('div');
  toast.className = 'toast toast-' + t;
  toast.setAttribute('role', 'status');
  toast.setAttribute('aria-live', 'polite');
  toast.textContent = message;
  document.body.appendChild(toast);

  /* ── Swipe-to-dismiss (horizontal swipe) ── */
  let startX = 0;
  toast.addEventListener('touchstart', function (e) {
    startX = e.touches[0].clientX;
  }, { passive: true });
  toast.addEventListener('touchend', function (e) {
    const dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > 80) {
      toast.style.transition = 'transform 0.2s, opacity 0.2s';
      toast.style.transform  = 'translateX(' + (dx > 0 ? '120%' : '-120%') + ')';
      toast.style.opacity    = '0';
      setTimeout(function () { toast.remove(); }, 200);
    }
  }, { passive: true });

  setTimeout(function () {
    toast.classList.add('toast-out');
    setTimeout(function () { toast.remove(); }, 300);
  }, 3000);
};

UIC.statCard = function (o) {
  const tone = o.tone || 'default';

UIC.companyTile = function (o) {

function buildCompanyNav_(currentAction) {
  const pages = (window.COMPANY_PAGES || []).filter(function (p) {
    return UIC.pageAuthorized_(p.action);
  });
  const scriptUrl = UIC.baseUrl();
  const token = UIC.token();
  return pages.map(function (p) {
    const isActive = p.action === currentAction;
    return {
      label: p.label || p.action,
      active: isActive,
      href: isActive ? '#' : scriptUrl + '?action=' + p.action + '&sessionToken=' + token
    };
  });
}

UIC.buildLogoMarkup = function (homeHref, companyLogoUrl, companyLogoHref, companyLogoTitle, lazy) {
  var lazyAttr = lazy ? ' loading="lazy" decoding="async"' : ' decoding="async"';
  var main = '<a class="app-logo app-logo-main" href="' + (homeHref || '#') + '" title="الرئيسية" onclick="UIC.navTo(event, this.getAttribute(\'href\'))">' +
    '<img src="' + (UIC.SYSTEM_LOGO_URL || '') + '" alt="الرئيسية" height="32" width="auto"' + lazyAttr + '></a>';
  var company = companyLogoUrl
    ? '<a class="app-logo app-logo-company" href="' + (companyLogoHref || '#') + '" title="' + (companyLogoTitle || '') + '" onclick="UIC.navTo(event, this.getAttribute(\'href\'))">' +
      '<img src="' + companyLogoUrl + '" alt="" height="40" width="auto"' + lazyAttr + '></a>'
    : '';
  return main + company;
};

UIC.appShell = function (containerId, o) {
  const opts = o || {};
  const navItems = opts.nav || buildCompanyNav_(window.CURRENT_ACTION);

  /* Build nav links for BOTH the topbar (desktop) and the mobile drawer */
  const navLinkHtml = function (extraClass) {
    return navItems.map(n =>
      '<a class="nav-item' + (n.active ? ' active' : '') + (extraClass ? ' ' + extraClass : '') + '" href="' + (n.href || '#') + '"' +
      (n.onclick ? ' onclick="' + n.onclick + '"' :
        (n.href && n.href !== '#' ? ' onclick="UIC.navTo(event, this.getAttribute(\'href\'))"' : '')) +
      '>' + (n.label || '') + '</a>'
    ).join('');
  };

  const menuGroupsHtml = function (drawerMode) {
    return (opts.menuGroups || []).map(function (g, gi) {
      const items = (g.items || []).filter(function (it) {
        return !(typeof it === 'object' && it.action && !UIC.pageAuthorized_(it.action));
      }).map(function (it) {
        const isObj = typeof it === 'object';
        if (isObj && it.action) {
          const label = it.label || it.action;
          const href = UIC.baseUrl() + '?action=' + encodeURIComponent(it.action) + '&sessionToken=' + encodeURIComponent(UIC.token());
          const active = it.action === window.CURRENT_ACTION ? ' nav-dropdown-item-active' : '';
          return '<a class="nav-dropdown-item' + active + '" href="' + href + '" onclick="UIC.navTo(event, this.getAttribute(\'href\'))">' + label + '</a>';
        }
        return '';
      }).join('');
      if (!items) return ''; /* whole group unauthorized — hide its header too */
      if (drawerMode) {
        /* In drawer: render as flat section header + items (no dropdown) */
        return '<div class="drawer-group"><div class="drawer-group-label">' + (g.label || '') + '</div>' + items + '</div>';
      }
      return '<div class="nav-dropdown">' +
        '<button type="button" class="nav-dropdown-toggle" onclick="UIC.toggleDropdown(\'nav-dd-' + gi + '\', event)">' +
        (g.label || '') + ' <span class="nav-dropdown-caret">' + UIC.icon('chevron-down', { size: 14 }) + '</span></button>' +
        '<div class="nav-dropdown-menu" id="nav-dd-' + gi + '">' + items + '</div>' +
        '</div>';
    }).join('');
  };

  const homeHref = UIC.baseUrl() + '?action=ERPDashboard&sessionToken=' + encodeURIComponent(UIC.token());
  const logoTop = UIC.buildLogoMarkup(homeHref, opts.companyLogoUrl, opts.companyLogoHref, opts.companyLogoTitle, false);
  const logoDrawer = UIC.buildLogoMarkup(homeHref, opts.companyLogoUrl, opts.companyLogoHref, opts.companyLogoTitle, true);

  const sessUser = (window.API && API.getSession) ? (API.getSession() || {}) : {};
  const userName = opts.userName || ((sessUser.user && sessUser.user.name) ? sessUser.user.name : '');
  const userEmail = (sessUser.user && sessUser.user.email) ? sessUser.user.email : '';
  const escH = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  };
  const userBlock = '<div class="user-block">' +
    '<span class="user-name">' + escH(userName) + '</span>' +
    '<button class="user-logout" onclick="logout()">خروج</button>' +
    '</div>';
  /* User-profile dropdown (topbar): avatar + name button; menu holds the
   * identity header, جلساتي / عروضي links and logout. Reuses .nav-dropdown
   * mechanics (single-open + outside-click close via UIC.toggleDropdown). */
  const avatarLetter = escH((userName || userEmail || '?').trim().charAt(0));
  const userProfileBlock =
    '<div class="nav-dropdown user-profile">' +
      '<button type="button" class="nav-dropdown-toggle user-profile-toggle" onclick="UIC.toggleDropdown(\'nav-user-menu\', event)" aria-label="حسابي" aria-haspopup="true">' +
        '<span class="user-avatar">' + avatarLetter + '</span>' +
        '<span class="user-name">' + escH(userName || userEmail) + '</span>' +
        ' <span class="nav-dropdown-caret">' + UIC.icon('chevron-down', { size: 14 }) + '</span>' +
      '</button>' +
      '<div class="nav-dropdown-menu user-profile-menu" id="nav-user-menu">' +
        '<div class="user-profile-head">' +
          '<span class="user-avatar user-avatar-lg">' + avatarLetter + '</span>' +
          '<div class="user-profile-id"><div class="user-profile-name">' + escH(userName || userEmail) + '</div>' +
          (userEmail ? '<div class="user-profile-email">' + escH(userEmail) + '</div>' : '') + '</div>' +
        '</div>' +
        '<a class="nav-dropdown-item" href="#" onclick="SESSION.openSessions();return false;">' + UIC.icon('user') + '<span>جلساتي</span></a>' +
        '<a class="nav-dropdown-item" href="#" onclick="SESSION.openViews();return false;">' + UIC.icon('settings') + '<span>عروضي</span></a>' +
        '<div class="user-profile-divider"></div>' +
        '<a class="nav-dropdown-item user-profile-logout" href="#" onclick="logout();return false;">' + UIC.icon('logout') + '<span>تسجيل الخروج</span></a>' +
      '</div>' +
    '</div>';

  /* Hamburger button — visible only on mobile */
  const hamburger = '<button class="topbar-hamburger" aria-label="القائمة" aria-expanded="false" onclick="UIC.openDrawer()">' +
    '<span class="hamburger-bar"></span><span class="hamburger-bar"></span><span class="hamburger-bar"></span>' +
    '</button>';

  /* Mobile slide-out drawer is built inside the try below (it executes nav
   * builders that could throw on unexpected input). */
  let html;
  try {
    const drawerHtml =
      '<div class="drawer-overlay" id="uic-drawer-overlay" onclick="UIC.closeDrawer()" aria-hidden="true"></div>' +
      '<nav class="mobile-drawer" id="uic-drawer" aria-label="القائمة الرئيسية">' +
        '<div class="drawer-header">' + logoDrawer +
          '<button class="drawer-close" aria-label="إغلاق القائمة" onclick="UIC.closeDrawer()">' + UIC.icon('close', { size: 18 }) + '</button>' +
        '</div>' +
        '<div class="drawer-nav">' +
          navLinkHtml('drawer-nav-item') +
          menuGroupsHtml(true) +
        '</div>' +
        '<div class="drawer-footer">' + (opts.userHtml || userBlock) + '</div>' +
      '</nav>';
    html =
      '<header class="topbar">' +
        '<div class="topbar-left">' + hamburger + logoTop + '</div>' +
        '<nav class="topbar-nav" aria-label="التنقل الرئيسي">' + navLinkHtml() + menuGroupsHtml(false) + '</nav>' +
        '<div class="topbar-right">' + (opts.userHtml || userProfileBlock) + '</div>' +
      '</header>' +
      drawerHtml +
      (opts.breadcrumb ? '<div class="breadcrumb">' + opts.breadcrumb + '</div>' : '') +
      '<main class="app-content" id="' + (opts.contentId || 'app-content') + '"></main>';
  } catch (shellErr) {
    /* Never blank the page: emit at least the content container so the page's
     * own render can populate it. Surface the error for diagnosis. */
    html = '<main class="app-content" id="' + (opts.contentId || 'app-content') + '"></main>';
    try { console.error('appShell build failed: ' + (shellErr && shellErr.message)); if (window.UIC && UIC.reportError) UIC.reportError('appShell build failed: ' + (shellErr && shellErr.message)); } catch (e) {}
  }

  const el = document.getElementById(containerId);
  if (el) el.innerHTML = html;

  /* Initialise drawer swipe-to-close after render */
  try { UIC._initDrawerSwipe(); } catch (e) {}

  return opts.contentId || 'app-content';
};

UIC.toggleDropdown = function (id, event) {
  if (event) { event.preventDefault(); event.stopPropagation(); }
  const target = document.getElementById(id);
  if (!target) return;
  const isOpen = target.classList.contains('open');
  document.querySelectorAll('.nav-dropdown-menu').forEach(function (m) { m.classList.remove('open'); });
  document.querySelectorAll('.nav-dropdown-toggle').forEach(function (b) { b.classList.remove('open'); });
  if (!isOpen) {
    target.classList.add('open');
    const btn = target.parentNode ? target.parentNode.querySelector('.nav-dropdown-toggle') : null;
    if (btn) btn.classList.add('open');
  }
};

document.addEventListener('click', function (event) {
  const dd = event.target && event.target.closest ? event.target.closest('.nav-dropdown') : null;
  if (!dd) {
    document.querySelectorAll('.nav-dropdown-menu').forEach(function (m) { m.classList.remove('open'); });
    document.querySelectorAll('.nav-dropdown-toggle').forEach(function (b) { b.classList.remove('open'); });
  }
});

UIC.openDrawer = function () {
  const drawer  = document.getElementById('uic-drawer');
  const overlay = document.getElementById('uic-drawer-overlay');
  const ham     = document.querySelector('.topbar-hamburger');
  if (!drawer) return;
  drawer.classList.add('is-open');
  if (overlay) overlay.classList.add('is-open');
  if (ham) ham.setAttribute('aria-expanded', 'true');
  document.body.style.overflow = 'hidden'; // prevent body scroll behind drawer
};

UIC.closeDrawer = function () {
  const drawer  = document.getElementById('uic-drawer');
  const overlay = document.getElementById('uic-drawer-overlay');
  const ham     = document.querySelector('.topbar-hamburger');
  if (!drawer) return;
  drawer.classList.remove('is-open');
  if (overlay) overlay.classList.remove('is-open');
  if (ham) ham.setAttribute('aria-expanded', 'false');
  document.body.style.overflow = '';
};

UIC._initDrawerSwipe = function () {
  const drawer = document.getElementById('uic-drawer');
  if (!drawer) return;
  let startX = 0;
  let dragging = false;
  drawer.addEventListener('touchstart', function (e) {
    startX = e.touches[0].clientX;
    dragging = true;
  }, { passive: true });
  drawer.addEventListener('touchmove', function (e) {
    if (!dragging) return;
    const dx = e.touches[0].clientX - startX;
    /* Only track swipe in the closing direction (right for RTL drawer = left for LTR) */
    if (dx < -10) {
      drawer.style.transform = 'translateX(' + dx + 'px)';
      drawer.style.transition = 'none';
    }
  }, { passive: true });
  drawer.addEventListener('touchend', function (e) {
    if (!dragging) return;
    dragging = false;
    drawer.style.transform = '';
    drawer.style.transition = '';
    const dx = e.changedTouches[0].clientX - startX;
    if (dx < -60) UIC.closeDrawer();
  }, { passive: true });
};

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') UIC.closeDrawer();
});

(function () {
  const css = `
  /* ── Buttons ─────────────────────────────────────────────────────────── */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 20px; font-size: var(--text-sm); font-weight: 700;

    .btn-outline:active { background: var(--bg-subtle); }
    .btn-danger:active  { background: #b91c1c; transform: scale(0.97); }
  }

  /* ── [UI-3.1 / U-09] Icons ───────────────────────────────────────────── */
  .uic-icon {
    display: inline-block; vertical-align: -0.15em; flex-shrink: 0;
    /* No fill/stroke here: the paths use currentColor, so an icon is the
       colour of the text around it under every theme, with no per-theme rule. */
  }
  .btn .uic-icon { margin-inline-end: 2px; }
  /* An icon-only button must still meet the tap target at every width. */
  .btn-icon-only { min-width: var(--tap-min, 48px); justify-content: center; }

  /* ── Pills ───────────────────────────────────────────────────────────── */
  .pill { display: inline-flex; align-items: center; padding: 3px 10px; font-size: var(--text-xs); font-weight: 600; border-radius: 999px; }
  .pill-success { background: var(--success-bg); color: var(--success-text); border: 1px solid var(--success-border); }
  .pill-danger  { background: var(--danger-bg);  color: var(--danger-text);  border: 1px solid var(--danger-border); }
  .pill-warning { background: var(--warning-bg); color: var(--warning-text); border: 1px solid var(--warning-border); }
  .pill-neutral { background: var(--bg-subtle);  color: var(--text-muted);   border: 1px solid var(--border-color); }

  /* ── Data Table ──────────────────────────────────────────────────────── */
  .table-wrap {
    background: var(--bg-surface); border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    /* Mobile: horizontal scroll instead of overflow:hidden */
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;

    /* [UI-1.5 / U-05] The table scrolls inside its own box, so the header can
       stick. This is REQUIRED for the sticky header, not decoration — see the
       note on the header rule below. max-height never stretches a short
       table, so a three-row list is still three rows tall. */
    overflow-y: auto;
    overscroll-behavior-y: contain;
    max-height: calc(var(--vh, 1vh) * 70);
    max-height: 70dvh;
  }
  .table-toolbar { padding: var(--space-3); border-bottom: 1px solid var(--border-color); }
  .table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
  .table thead th {
    padding: 10px 12px; background: var(--bg-subtle); color: var(--text-muted);
    font-weight: 600; font-size: var(--text-xs); text-align: right;
    border-bottom: 1px solid var(--border-color);
    /* Prevent headers shrinking too small on mobile */
    white-space: nowrap;

    /* [UI-1.5 / U-05] Column headers stay visible while a long table scrolls.
       Two things make this work, and it is a no-op without both:
       1. A sticky element sticks within its nearest SCROLLPORT. .table-wrap
          sets overflow-x: auto, and per the overflow spec that computes
          overflow-y from visible to auto - so .table-wrap is already the
          scrollport, and a bare top:0 would have nothing to stick to because
          the box was exactly as tall as its content. Giving it a max-height is
          what creates the scroll range.
       2. The background must be opaque or the rows scroll through the header.

    position: sticky;

  /* [UI-1.5] The pager lives inside the scroll box, so it is pinned to the

  .dt-pager {

    border-top: 1px solid var(--border-color);
  }

  /* [UI-1.5] Printing must never be clipped to 70dvh. Full print treatment is
     Phase 7; this is the minimum that keeps today's output correct. */
  @media print {
    .table-wrap { max-height: none; overflow: visible; }
    .table thead th { position: static; }
    .dt-pager { display: none; }

  /* [UI-1.3 / U-03] Sort affordance. The chevron is a glyph rather than an
