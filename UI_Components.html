   *
   * 22 pages each reimplemented their own invoice CSS and print output was
   * uncontrolled: no @page size or margins, so the browser's defaults decided
   * them; column headers appeared once and then vanished, so page 2 of a long
   * invoice was a wall of unlabelled numbers; and totals or signature blocks
   * split across a page break.
   *
   * These rules live in the SHARED stylesheet rather than in a new partial the
   * 16 print pages would each have to include — every page already loads
   * UI_Components, so all of them get correct print behaviour with no page edit
   * and no chance of one being missed.
   */
  @media print {
    /* A4 with real margins, instead of whatever the browser chose. */
    @page { size: A4; margin: 14mm 10mm; }

    /* Nothing that is chrome belongs on paper. */
    .topbar, .mobile-drawer, .drawer-overlay, .breadcrumb, .control-panel,
    .table-toolbar, .dt-pager, .dt-batch, .dt-progress, .toast,
    #home-logo-fab, #page-loading, .skip-link, .no-print,
    .action-dropdown, .erp-kebab, .smart-buttons, .nb-tabs {
      display: none !important;
    }

    /* The table scroll box is a screen idea; on paper it must simply flow. */
    .table-wrap { max-height: none; overflow: visible; border: 0; }
    .app-content { max-width: none; padding: 0; }

    /* THE HEADER REPEATS. This one line is most of the value: without it, page
       two of a two-page invoice has no column labels at all. */
    .table thead { display: table-header-group; }
    .table tfoot { display: table-footer-group; }
    .table thead th { position: static; }

    /* Do not break a row, a totals block or a signature across pages. */
    .table tbody tr, .dt-total, .stat-card, .invoice-totals,
    .inv-totals, .signature, .sig-block { break-inside: avoid; page-break-inside: avoid; }

    /* The phone card layout must never reach paper: below tablet-p the base
       rules turn the table into blocks, and a print stylesheet inherits the
       BASE, not the tier. Without this, printing from a narrow window produced
       a column of cards instead of a table. */
    .table { display: table; }
    .table thead { display: table-header-group; }
    .table tbody { display: table-row-group; }
    .table tr { display: table-row; }
    .table td { display: table-cell; text-align: right; border: 1px solid var(--border-color); }
    .table tbody td[data-label]::before { content: none; }
    .table tbody tr { border: 0; margin: 0; padding: 0; }

    /* [7.2] The print palette. The two bespoke themes carried a blanket
       universal print-color-adjust:exact rule, which forces the browser to
       render EVERY background — so a TopLight header row printed as a black bar
       and a TopChemical one as solid green, using a cartridge of toner per
       report. Colour is now applied deliberately and only where it carries
       meaning: the document's header rule and the totals row. */
    body { background: #fff !important; }
    .table thead th {
      background: #fff !important; color: #000 !important;
      border-bottom: 2px solid var(--brand-primary);
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .table tfoot .dt-total td, .dt-total td {
      background: #fff !important; color: #000 !important;
      border-top: 2px solid var(--brand-primary);
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .table tbody tr:hover { background: transparent !important; }
    .pill { border: 1px solid #999 !important; background: #fff !important; color: #000 !important; }

    /* A link's target is invisible on paper, so print it. Skipped for in-app
       links, whose ?action= URLs are noise to a reader. */
    a[href^="http"]:not([href*="?action="])::after {
      content: ' (' attr(href) ')'; font-size: 10px; color: #555;
    }
  }
  /* [UI-1.3 / U-03] Sort affordance. The chevron is a glyph rather than an
     image so it inherits the header colour under all three company themes.
     A neutral double-arrow shows the column CAN be sorted; it darkens and
     resolves to one direction once it is. Reserving the width in both states
     stops the header text jumping as the state cycles. */
  .table thead th[data-sortable="true"] { user-select: none; }
  .table thead th .th-label { vertical-align: middle; }
  .table thead th .th-sort {
    display: inline-block; width: 1em; margin-inline-start: var(--space-1);
    font-size: var(--text-xs); line-height: 1; opacity: .45; vertical-align: middle;
  }
  /* NB: this stylesheet lives in a JS template literal, so every CSS unicode
     escape must have its backslash doubled. A single-backslash escape here is
     read by JavaScript as an OCTAL escape, which is a SyntaxError in a template
     string and would take the whole shared layer down on all 85 pages. */
  .table thead th .th-sort::before { content: '\\2195'; }              /* ↕ */
  .table thead th.sorted-asc  .th-sort { opacity: 1; }
  .table thead th.sorted-desc .th-sort { opacity: 1; }
  .table thead th.sorted-asc  .th-sort::before { content: '\\25B2'; }  /* ▲ */
  .table thead th.sorted-desc .th-sort::before { content: '\\25BC'; }  /* ▼ */
  .table thead th[data-sortable="true"]:hover .th-sort { opacity: .8; }
  .table thead th[data-sortable="true"]:focus-visible { outline: 2px solid var(--brand-primary); outline-offset: -2px; }
  .table thead th.sorted-asc, .table thead th.sorted-desc { color: var(--text-main); }

  .table tbody td { padding: 10px 12px; border-bottom: 1px solid var(--border-color); }

  /* [UI-1.4 / U-04] Numeric cells, in the SHARED layer.
     UIC._dtRowHtml puts class="num" on every money and numeric cell, but the
     rule that styles it existed only inside the two bespoke company themes.
     ValleyFoods therefore rendered its numbers in the body font, right-aligned
     and non-tabular, so columns of figures did not line up.
     The declarations are exactly those the two themes already carried, and
     --font-mono resolves to the same stack they define, so TopLight and
     TopChemical render identically to before; only ValleyFoods changes. */
  .num {
    font-family: var(--font-mono, 'Consolas', 'Courier New', monospace);
    direction: ltr;
    text-align: left;
    font-variant-numeric: tabular-nums;
  }
  .table tbody tr:hover { background: var(--brand-subtle-bg); }
  /* Tall enough rows for finger tapping */
  .table tbody tr { min-height: var(--tap-sm, 44px); }
  /* ── [UI-4.4 / U-18] Group rows, subtotals and the column footer ─────── */
  .table tbody tr.dt-group td {
    background: var(--bg-subtle);
    font-weight: 700; color: var(--text-main);
    border-top: 1px solid var(--border-strong);
    position: sticky; top: 32px; z-index: 1;
  }
  .dt-group-lead { display: flex; align-items: center; gap: var(--space-2); }
  .dt-group-toggle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; min-width: 24px;
    border: 0; background: transparent; color: var(--text-muted);
    cursor: pointer; border-radius: var(--radius-sm); padding: 0;
  }
  .dt-group-toggle:hover { background: var(--bg-sunken); color: var(--text-main); }
  .dt-group-label { font-weight: 800; }
  .dt-group-count {
    font-size: var(--text-xs); font-weight: 700;
    background: var(--brand-subtle-bg); color: var(--brand-primary);
    border-radius: 999px; padding: 1px 8px;
  }
  .dt-group-sum { font-weight: 700; }
  .dt-total-lead { font-weight: 800; white-space: nowrap; }
  .table tfoot .dt-total td {
    background: var(--bg-subtle);
    border-top: 2px solid var(--border-strong);
    font-weight: 800; color: var(--text-main);
    position: sticky; bottom: 0;
  }

  /* [UI-4.7 / U-23] Inline refresh progress — reading never blocks the page. */
  .dt-progress {
    height: 3px; width: 100%; overflow: hidden;
    background: var(--bg-sunken);
    background-image: linear-gradient(90deg, transparent, var(--brand-primary), transparent);
    background-size: 40% 100%; background-repeat: no-repeat;
    animation: dt-progress-slide 1.1s ease-in-out infinite;
  }
  @keyframes dt-progress-slide { 0% { background-position: 120% 0; } 100% { background-position: -40% 0; } }
  @media (prefers-reduced-motion: reduce) { .dt-progress { animation: none; opacity: .5; } }

  /* ── [UI-4.6 / U-17] Selection and the batch bar ─────────────────────── */
  .table .dt-sel { width: var(--tap-sm, 44px); text-align: center; }
  .dt-sel-box, .dt-sel-all { width: 18px; height: 18px; cursor: pointer; accent-color: var(--brand-primary); }
  .dt-batch {
    display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap;
    padding: var(--space-2) var(--space-3);
    background: var(--brand-subtle-bg);
    border-bottom: 1px solid var(--border-color);
    position: sticky; top: 0; z-index: 3;
  }
  .dt-batch-count { font-size: var(--text-sm); font-weight: 700; color: var(--brand-primary); }
  .dt-batch .btn { padding: 6px 12px; min-height: var(--tap-sm, 44px); }

  /* ── [UI-4.5 / U-19] Optional columns ────────────────────────────────── */
  .dt-col-menu { max-height: 60dvh; overflow-y: auto; }
  .dt-col-item {
    display: flex; align-items: center; gap: var(--space-2);
    padding: var(--space-2) 10px; border-radius: var(--radius-sm);
    font-size: var(--text-sm); cursor: pointer; min-height: var(--tap-sm, 44px);
  }
  .dt-col-item:hover { background: var(--bg-subtle); }
  .dt-col-item input { accent-color: var(--brand-primary); width: 16px; height: 16px; }
  /* [UI-4.9 / U-16] Saved views */
  .dt-fav-empty { padding: var(--space-3) 10px; font-size: var(--text-xs); color: var(--text-muted); text-align: center; }

  /* ── [UI-3.5 / U-22] Empty state ─────────────────────────────────────── */
  .empty-state { padding: 48px 16px; text-align: center; color: var(--text-muted); background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-md); }
  .empty-state-icon { color: var(--text-disabled); margin-bottom: var(--space-3); }
  .empty-state-title { font-size: var(--text-base); font-weight: 700; color: var(--text-main); margin-bottom: var(--space-1); }
  .empty-state-body { font-size: var(--text-sm); color: var(--text-muted); max-width: 46ch; margin: 0 auto var(--space-4); line-height: 1.7; }
  .empty-state-action { margin-top: var(--space-2); }
  .pt-loading { display:flex; align-items:center; gap:10px; padding:14px 4px; color:var(--text-muted); font-size: var(--text-sm); }
  .pt-spin { width:22px; height:22px; flex:0 0 auto; border:3px solid var(--border-color,#e2e8f0); border-top-color:var(--brand-primary,#16a34a); border-radius:50%; animation:ptspin .8s linear infinite; }
  @keyframes ptspin { to { transform: rotate(360deg); } }
  .pt-sk-table { width:100%; border-collapse:collapse; }
  .pt-sk-table thead th { padding:10px 12px; background:var(--bg-subtle); color:var(--text-muted); font-weight:600; font-size: var(--text-xs); text-align:right; border-bottom:1px solid var(--border-color); white-space:nowrap; }
  .pt-sk-table tbody td { padding:10px 12px; border-bottom:1px solid var(--border-color); }
  .pt-sk-bar { height:12px; border-radius:6px; background:linear-gradient(90deg,var(--bg-subtle,#eef2f7) 25%,var(--border-color,#e2e8f0) 37%,var(--bg-subtle,#eef2f7) 63%); background-size:400% 100%; animation:ptshimmer 1.2s ease infinite; }
  @keyframes ptshimmer { 0% { background-position:100% 0; } 100% { background-position:-100% 0; } }

  /* ── Form Controls ───────────────────────────────────────────────────── */
  .input {
    width: 100%; padding: 10px 12px;
    /* 16px minimum to prevent Android Chrome from zooming on focus */
    font-size: max(16px, 1rem);
    font-family: var(--font-sans);
    border: 1px solid var(--border-color); border-radius: var(--radius-sm);
    background: var(--bg-surface); color: var(--text-main);
    /* Expand height for comfortable touch input */
    min-height: var(--tap-sm, 44px);
    line-height: 1.4;
  }
  .input:focus { outline: none; border-color: var(--brand-primary); box-shadow: 0 0 0 2px var(--brand-subtle-bg); }
  .form-field { margin-bottom: var(--space-4); }
  .form-label { display: block; font-size: var(--text-sm); font-weight: 600; margin-bottom: 6px; color: var(--text-main); }
  .req { color: var(--danger); }
  .field-error { color: var(--danger); font-size: var(--text-xs); min-height: 16px; }
  .form-field.has-error .input { border-color: var(--danger); }

  /* ── [UI-5.2 / U-28] Styled confirm ──────────────────────────────────── */
  .uic-confirm-msg { font-size: var(--text-base); color: var(--text-main); line-height: 1.7; }
  .uic-confirm-record {
    margin-top: var(--space-3); padding: var(--space-2) var(--space-3);
    background: var(--bg-sunken); border-radius: var(--radius-sm);
    font-weight: 700; color: var(--text-main); font-size: var(--text-sm);
    word-break: break-word;
  }
  .uic-confirm-detail { margin-top: var(--space-2); font-size: var(--text-sm); color: var(--text-muted); line-height: 1.7; }

  /* ── [UI-5.3 / U-27] Line-level validation ───────────────────────────── */
  .line-error > td { background: var(--danger-bg); }
  .line-error > td:first-child { box-shadow: inset 3px 0 0 var(--danger); }
  [dir="rtl"] .line-error > td:first-child { box-shadow: inset -3px 0 0 var(--danger); }
  .line-error::after {
    content: attr(data-line-error);
    display: block; padding: 4px var(--space-3);
    color: var(--danger-text); font-size: var(--text-xs); font-weight: 600;
  }

  /* ── Searchable Combo ────────────────────────────────────────────────── */
  .combo { position: relative; }
  .combo-input { width: 100%; }
  .combo-list {
    position: absolute; top: 100%; right: 0; left: 0; z-index: 1400;
    margin-top: 2px; max-height: 240px; overflow-y: auto;
    background: var(--bg-surface); border: 1px solid var(--border-color);
    border-radius: 6px; box-shadow: 0 8px 20px rgba(0,0,0,.12);
    -webkit-overflow-scrolling: touch;
  }
  .combo-option {
    padding: 12px 10px; /* taller for touch */
    font-size: var(--text-sm); cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .combo-option:hover, .combo-option.active { background: var(--brand-subtle-bg); color: var(--brand-primary); }

  /* ── Modal ───────────────────────────────────────────────────────────── */
  .modal-open { overflow: hidden; }
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.45);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 1000;
    /* Safe area padding so overlay doesn't clip on notch devices */
    padding: max(16px, var(--safe-top)) max(16px, var(--safe-left)) max(0px, var(--safe-bottom)) max(16px, var(--safe-right));
  }
  .modal {
    background: var(--bg-surface);
    border-radius: var(--radius-lg) var(--radius-lg) 0 0; /* bottom sheet on mobile */
    width: 100%;
    max-height: 90dvh;
    max-height: calc(var(--vh, 1vh) * 90); /* fallback */
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    box-shadow: var(--shadow-lg);
    /* GPU layer for smooth slide-in */
    will-change: transform;
    /* Bottom padding so content clears gesture bar */
    padding-bottom: var(--safe-bottom);
  }
  /* [UI-3.6 / U-40] The bottom-sheet grab handle. A ::before rather than an
     element, so no call site's markup changes and no DOM node is added. It
     exists only where the dialog IS a sheet — the tablet-p tier hides it. */
  .modal::before {
    content: ''; display: block;
    width: 36px; height: 4px; border-radius: 999px;
    background: var(--border-strong, #cfd4db);
    margin: var(--space-2) auto 0;
    flex-shrink: 0;
  }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: var(--space-4) var(--space-6); border-bottom: 1px solid var(--border-color);
    /* Sticky so close button is always accessible */
    position: sticky; top: 0; background: var(--bg-surface); z-index: 1;
  }
  .modal-header h3 { font-size: var(--text-base); }
  .modal-body  { padding: var(--space-6); }
  .modal-footer {
    display: flex; justify-content: flex-end; gap: var(--space-2);
    padding: var(--space-4) var(--space-6); border-top: 1px solid var(--border-color);
    flex-wrap: wrap; /* allow buttons to wrap on very small screens */
  }
  .btn-icon { background: none; border: none; font-size: var(--text-xl); cursor: pointer; color: var(--text-muted); padding: var(--space-2); min-height: var(--tap-sm, 44px); min-width: var(--tap-sm, 44px); }
  /* [UI-2.9b] The dialog widths moved into the tablet-p (600px) tier with the
     rest of the responsive rules, so the whole scale lives in one place and
     640px — which was on no tier — is retired. Optional widths via
     UIC.openModal({ size: 'sm'|'md'|'lg'|'xl' }): 'md' is the default and emits
     no class, so untouched callers keep 560px, and below tablet-p every size is
     a full-width bottom sheet exactly as before. */

  /* ── Toast ───────────────────────────────────────────────────────────── */
  .toast {
    position: fixed; top: max(20px, calc(var(--safe-top) + 12px));
    left: 50%; transform: translateX(-50%);
    padding: var(--space-3) var(--space-6); border-radius: var(--radius-md); color: #fff;
    font-size: var(--text-sm); font-weight: 600; z-index: 2000;
    box-shadow: var(--shadow-md);
    transition: opacity .3s ease, transform .3s ease;
    max-width: min(90vw, 360px);
    text-align: center;
    /* GPU layer */
    will-change: transform, opacity;
    cursor: pointer;
  }
  .toast-success { background: var(--success); }
  .toast-error   { background: var(--danger); }
  .toast-warning { background: var(--warning); }
  .toast-out { opacity: 0; transform: translateX(-50%) translateY(-8px); }

  /* ── [UI-5.4 / U-29] Workflow statusbar ──────────────────────────────── */
  .statusbar { overflow-x: auto; }
  .sb-list { display: flex; align-items: center; gap: var(--space-1); list-style: none; margin: 0; padding: 0; }
  .sb-stage {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px var(--space-3); border-radius: 999px;
    font-size: var(--text-xs); font-weight: 700; white-space: nowrap;
    background: var(--bg-subtle); color: var(--text-muted);
    min-height: var(--tap-sm, 44px);
  }
  .sb-stage[role="button"] { cursor: pointer; }
  .sb-stage[role="button"]:hover { background: var(--bg-sunken); color: var(--text-main); }
  .sb-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--border-strong); display: inline-flex; align-items: center; justify-content: center; color: var(--bg-surface); }
  .sb-done { background: var(--success-bg); color: var(--success-text); }
  .sb-done .sb-dot { background: var(--success); }
  .sb-current { background: var(--brand-primary); color: var(--btn-text-color); }
  .sb-current .sb-dot { background: var(--btn-text-color); }
  .sb-todo { opacity: .75; }
  .sb-label { line-height: 1; }

  /* ── [UI-5.5 / U-29] Smart buttons ───────────────────────────────────── */
  .smart-buttons { display: flex; gap: var(--space-2); flex-wrap: wrap; }
  .smart-btn {
    display: inline-flex; flex-direction: column; align-items: flex-start; gap: 2px;
    padding: var(--space-2) var(--space-3);
    background: var(--bg-surface); border: 1px solid var(--border-color);
    border-radius: var(--radius-md); cursor: pointer; min-height: var(--tap-min, 48px);
    font-family: var(--font-sans); color: var(--text-main); position: relative;
  }
  .smart-btn:hover:not(:disabled) { border-color: var(--brand-primary); box-shadow: var(--shadow-sm); }
  .smart-btn:disabled { opacity: .55; cursor: default; }
  .smart-btn-icon { position: absolute; inset-inline-end: var(--space-2); top: var(--space-2); color: var(--text-disabled); }
  .smart-btn-count { font-size: var(--text-lg); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .smart-btn-label { font-size: var(--text-xs); color: var(--text-muted); }

  /* ── [UI-5.6 / U-29] Notebook tabs ───────────────────────────────────── */
  .nb-tabs {
    display: flex; gap: 2px; overflow-x: auto;
    border-bottom: 1px solid var(--border-color); margin-bottom: var(--space-4);
  }
  .nb-tab {
    display: inline-flex; align-items: center; gap: 6px;
    padding: var(--space-3) var(--space-4); min-height: var(--tap-sm, 44px);
    background: transparent; border: 0; border-bottom: 2px solid transparent;
    font-family: var(--font-sans); font-size: var(--text-sm); font-weight: 700;
    color: var(--text-muted); cursor: pointer; white-space: nowrap;
  }
  .nb-tab:hover { color: var(--text-main); background: var(--bg-subtle); }
  .nb-tab-active { color: var(--brand-primary); border-bottom-color: var(--brand-primary); }
  .nb-badge {
    font-size: var(--text-xs); font-weight: 700; border-radius: 999px;
    background: var(--bg-sunken); color: var(--text-muted); padding: 1px 7px;
  }
  .nb-tab-active .nb-badge { background: var(--brand-subtle-bg); color: var(--brand-primary); }
  .notebook { display: block; }
  .nb-panel { display: block; }

  /* ── Stat Card ───────────────────────────────────────────────────────── */
  .stat-card {
    display: flex; align-items: center; gap: var(--space-4);
    background: var(--bg-surface); border: 1px solid var(--border-color);
    border-radius: var(--radius-md); padding: var(--space-4);
    contain: layout style; /* reduce paint cost */
  }
  .stat-icon { font-size: 28px; width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-md); background: var(--bg-subtle); flex-shrink: 0; }
  .stat-success .stat-icon { background: var(--success-bg); }
  .stat-danger  .stat-icon { background: var(--danger-bg); }
  .stat-warning .stat-icon { background: var(--warning-bg); }
  .stat-value { font-size: var(--text-2xl); font-weight: 700; line-height: 1.2; }
  .stat-label { font-size: var(--text-xs); color: var(--text-muted); }

  /* ── Company Tile ────────────────────────────────────────────────────── */
  .company-tile {
    background: var(--bg-surface); border: 1px solid var(--border-color);
    border-radius: var(--radius-lg); padding: var(--space-6);
    text-align: center; cursor: pointer; transition: all .15s ease;
    contain: layout style;
  }
  .company-tile:hover { border-color: var(--brand-primary); box-shadow: var(--shadow-brand); transform: translateY(-2px); }
  @media (hover: none) { .company-tile:active { transform: scale(0.98); border-color: var(--brand-primary); } }
  .tile-logo { width: 84px; height: 84px; object-fit: contain; border-radius: 50%; background: #fff; padding: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.18); margin: 0 auto var(--space-4); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; color: var(--brand-primary); }
  .tile-logo:hover { box-shadow: 0 6px 18px rgba(0,0,0,.22); transform: translateY(-1px); }
  .tile-logo-fallback { border: 1px solid var(--border-color); }
  .tile-name-ar { font-size: var(--text-base); font-weight: 700; margin-bottom: var(--space-1); }
  .tile-name-en { font-size: var(--text-xs); color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: var(--space-4); }
  .tile-enter   { font-size: var(--text-xs); font-weight: 600; color: var(--brand-primary); }

  /* ── Module Tile ─────────────────────────────────────────────────────── */
  .module-tile {
    position: relative; background: var(--bg-surface); border: 1px solid var(--border-color);
    border-radius: var(--radius-lg); padding: var(--space-6);
    text-align: center; cursor: pointer; transition: all .15s ease;
    contain: layout style;
  }
  .module-tile:hover { border-color: var(--brand-primary); box-shadow: var(--shadow-brand); transform: translateY(-2px); }
  @media (hover: none) { .module-tile:active { transform: scale(0.98); } }
  .module-tile-disabled { opacity: .5; cursor: not-allowed; }
  .module-tile-disabled:hover { border-color: var(--border-color); box-shadow: none; transform: none; }
  .module-tile-icon { width: 64px; height: 64px; margin: 0 auto var(--space-4); display: flex; align-items: center; justify-content: center; font-size: 32px; border-radius: var(--radius-md); background: var(--brand-subtle-bg); }
  .module-tile-title    { font-size: var(--text-base); font-weight: 700; margin-bottom: var(--space-1); }
  .module-tile-subtitle { font-size: var(--text-xs); color: var(--text-muted); }
  /* [UI-3.7] Was a physical right:8px. A tile badge belongs in the far corner — top
     RIGHT while the page rendered LTR. After step 1.1 corrected the direction,
     a physical right put it in the NEAR corner instead. inset-inline-end is
     the far corner in both directions. */
  .module-tile-badge { position: absolute; top: 8px; inset-inline-end: 8px; background: var(--warning); color: #fff; font-size: var(--text-xs); font-weight: 600; padding: 2px 8px; border-radius: 999px; }

  /* ── Topbar ──────────────────────────────────────────────────────────── */
  .topbar {
    position: sticky; top: 0; z-index: 1000;
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-4);
    background: var(--bg-surface); border-bottom: 1px solid var(--border-color);
    padding: 0 var(--space-4);
    height: var(--topbar-h, 56px);
    /* Allow dropdown menus to expand outside the header */
    overflow: visible;
  }
  .topbar-left  { display: flex; align-items: center; gap: var(--space-2); min-width: 0; }
  .topbar-right { display: flex; align-items: center; flex-shrink: 0; }
  .user-block { display: flex; flex-direction: column; align-items: center; gap: var(--space-1); line-height: 1.2; padding: 4px 10px; background: var(--bg-subtle); border-radius: var(--radius-lg); border: 1px solid var(--border-color); }
  .user-name   { font-size: var(--text-sm); color: var(--text-main); font-weight: 700; white-space: nowrap; max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
  .user-logout { padding: 4px 12px; font-size: var(--text-xs); font-weight: 700; border-radius: 20px; transition: all 0.2s; background: var(--danger-bg); color: var(--danger-text); border: 1px solid var(--danger-border); cursor: pointer; }
  .user-logout:hover { background: var(--danger); color: #fff; }

  /* ── User profile dropdown ─────────────────────────────────────────── */
  .user-profile .user-profile-toggle { gap: var(--space-2); }
  .user-avatar {
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    background: var(--brand-primary); color: #fff;
    font-weight: 800; font-size: var(--text-base); line-height: 1;
  }
  .user-avatar-lg { width: 46px; height: 46px; font-size: var(--text-xl); }
  .user-profile .user-name { max-width: 110px; }
  .user-profile-menu { min-width: 250px; }
  .user-profile-head {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px 12px; margin-bottom: var(--space-1);
    border-bottom: 1px solid var(--border-color);
  }
  .user-profile-id { min-width: 0; }
  .user-profile-name {
    font-size: var(--text-sm); font-weight: 800; color: var(--text-main);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px;
  }
  .user-profile-email {
    font-size: var(--text-xs); color: var(--text-muted); direction: ltr; text-align: end;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px;
  }
  .user-profile-divider { height: 1px; background: var(--border-color); margin: var(--space-1) 0; }
  .user-profile-logout { color: var(--danger-text); font-weight: 700; }
  .user-profile-logout:hover { background: var(--danger-bg); color: var(--danger-text); }

  /* ── Mobile drawer nav contrast ──────────────────────────────────────
   * Drawer links used muted text on surface — too faint on phones. Force
   * full-contrast ink, bolder weights, and a solid active treatment. */
  .drawer-nav .nav-item,
  .drawer-nav-item { color: var(--text-main); font-weight: 700; }
  .drawer-nav .nav-item.active,
  .drawer-nav-item.active { background: var(--brand-primary); color: #fff; }
  .drawer-group-label { color: var(--text-main); font-size: var(--text-xs); font-weight: 800; }
  .drawer-group .nav-dropdown-item { color: var(--text-main); font-weight: 600; }
  .drawer-group .nav-dropdown-item-active { background: var(--brand-primary); color: #fff; }
  .app-logo { display: inline-flex; align-items: center; flex-shrink: 0; }
  .app-logo img { height: 32px; width: 32px; display: block; object-fit: contain; border-radius: 50%; background: #fff; padding: 3px; box-shadow: 0 2px 8px rgba(0,0,0,.14); }
  .app-logo-company img { height: 40px; width: 40px; }

  /* ── Desktop topbar nav (hidden on mobile) ───────────────────────────── */
  .topbar-nav {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    flex: 1;
    overflow: visible;
  }
  .nav-item { padding: var(--space-2) var(--space-3); font-size: var(--text-sm); font-weight: 600; color: var(--text-muted); text-decoration: none; border-radius: var(--radius-sm); white-space: nowrap; display: inline-flex; align-items: center; min-height: var(--tap-sm, 44px); transition: color 0.15s, background-color 0.15s; }
  .nav-item:hover, .nav-item.active { color: var(--brand-primary); background: var(--brand-subtle-bg); }

  /* ── Hamburger button (mobile only) ─────────────────────────────────── */
  .topbar-hamburger {
    display: none; /* hidden on desktop */
    flex-direction: column; justify-content: center; align-items: center; gap: 5px;
    width: var(--tap-min, 48px); height: var(--tap-min, 48px);
    background: none; border: none; cursor: pointer; padding: var(--space-2); border-radius: var(--radius-sm);
    flex-shrink: 0;
  }
  .hamburger-bar { display: block; width: 22px; height: 2px; background: var(--text-main); border-radius: 2px; transition: all 0.2s; }

  /* ── Dropdowns ───────────────────────────────────────────────────────── */
  .nav-dropdown         { position: relative; display: inline-block; }
  .nav-dropdown-toggle  { display: inline-flex; align-items: center; gap: 6px; padding: var(--space-2) var(--space-3); font-size: var(--text-sm); font-weight: 600; font-family: var(--font-sans); color: var(--text-muted); background: none; border: none; border-radius: var(--radius-sm); cursor: pointer; min-height: var(--tap-sm, 44px); white-space: nowrap; transition: color 0.15s, background-color 0.15s; }
  .nav-dropdown-toggle:hover, .nav-dropdown-toggle.open { color: var(--brand-primary); background: var(--brand-subtle-bg); }
  .nav-dropdown-caret   { font-size: var(--text-xs); transition: transform 0.2s; }
  .nav-dropdown-toggle.open .nav-dropdown-caret { transform: rotate(180deg); }
  .nav-dropdown-menu    {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    /* [UI-3.7] Was a physical right:0. In RTL that is the START edge, which is where a
       menu should hang from its toggle — so the RTL rendering is unchanged —
       but it was hanging from the wrong edge in LTR. */
    inset-inline-start: 0;
    min-width: 230px;
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15), 0 2px 6px rgba(0, 0, 0, 0.08);
    z-index: 2500;
    padding: var(--space-2);
    max-height: 75dvh;
    max-height: calc(var(--vh, 1vh) * 75);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .nav-dropdown-menu.open { display: block; }
  .nav-dropdown-item { display: flex; align-items: center; padding: 10px 12px; font-size: var(--text-sm); color: var(--text-main); text-decoration: none; border-radius: var(--radius-sm); cursor: pointer; white-space: nowrap; min-height: 40px; transition: background-color 0.15s, color 0.15s; }
  .nav-dropdown-item:hover { background: var(--brand-subtle-bg); color: var(--brand-primary); }
  .nav-dropdown-item-active { background: var(--brand-subtle-bg); color: var(--brand-primary); font-weight: 700; }

  /* ── [UI-8.3 / U-41] Preferences panel ───────────────────────────────── */
  .pref-group { margin-bottom: var(--space-4); }
  .pref-label { font-size: var(--text-xs); font-weight: 800; color: var(--text-muted); margin-bottom: var(--space-2); text-transform: uppercase; letter-spacing: .06em; }
  .pref-choice {
    display: flex; align-items: center; gap: var(--space-2);
    padding: var(--space-2) 10px; border-radius: var(--radius-sm);
    font-size: var(--text-sm); cursor: pointer; min-height: var(--tap-sm, 44px);
  }
  .pref-choice:hover { background: var(--bg-subtle); }
  .pref-choice input { accent-color: var(--brand-primary); width: 16px; height: 16px; }
  .pref-note { font-size: var(--text-xs); color: var(--text-muted); margin-top: var(--space-2); }

  /* ── [UI-6.5 / U-33] Skip link ───────────────────────────────────────── */
  .skip-link {
    position: absolute; inset-inline-start: -9999px; top: 0; z-index: 3000;
    background: var(--brand-primary); color: var(--btn-text-color);
    padding: var(--space-3) var(--space-4); border-radius: 0 0 var(--radius-md) 0;
    font-weight: 700; font-size: var(--text-sm); text-decoration: none;
  }
  /* Off-screen until focused, then it takes its place — the standard pattern:
     invisible to everyone except the keyboard user who needs it. */
  .skip-link:focus { inset-inline-start: 0; }

  /* ── [UI-4.1 / U-13] Control panel ───────────────────────────────────── */
  .control-panel {
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border-color);
    padding: var(--space-2) var(--space-3) var(--space-3);
    display: flex; flex-direction: column; gap: var(--space-2);
  }
  .cp-row { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
  .cp-row-top { justify-content: space-between; min-height: 24px; }
  .cp-breadcrumb {
    display: flex; align-items: center; gap: 4px;
    font-size: var(--text-xs); color: var(--text-muted);
    overflow-x: auto; white-space: nowrap; min-width: 0;
  }
  .cp-crumb { color: var(--text-muted); text-decoration: none; padding: 2px 0; }
  a.cp-crumb:hover { color: var(--brand-primary); text-decoration: underline; }
  .cp-crumb-current { color: var(--text-main); font-weight: 700; }
  .cp-sep { display: inline-flex; color: var(--text-disabled); }
  .cp-title { font-size: var(--text-lg); font-weight: 800; margin: 0; color: var(--text-main); }

  /* Mobile-first: the three groups stack, then sit on one row from tablet-l,
     which is the first tier with room for a search box beside an action. */
  .cp-row-main { flex-direction: column; align-items: stretch; }
  .cp-lead { min-width: 0; }
  .cp-controls { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; flex: 1; min-width: 0; }
  .cp-actions { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }

  .cp-search { position: relative; display: flex; align-items: center; flex: 1; min-width: 0; flex-wrap: wrap; gap: 6px; }
  .cp-search-icon {
    position: absolute; inset-inline-start: 10px; top: 50%; transform: translateY(-50%);
    color: var(--text-disabled); pointer-events: none; display: inline-flex;
  }
  .cp-search-input { padding-inline-start: 34px; flex: 1; min-width: 140px; }
  .cp-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .cp-chip {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--brand-subtle-bg); color: var(--brand-primary);
    border: 1px solid var(--brand-border); border-radius: 999px;
    padding: 2px 6px 2px 10px; font-size: var(--text-xs); font-weight: 600;
    max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .cp-chip-x {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; border: 0; border-radius: 50%;
    background: transparent; color: inherit; cursor: pointer; padding: 0;
  }
  .cp-chip-x:hover { background: rgba(0,0,0,.08); }

  .cp-pager { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .cp-pager-btn { padding: 4px 8px; min-height: var(--tap-sm, 44px); min-width: var(--tap-sm, 44px); justify-content: center; }
  .cp-pager-count { font-size: var(--text-xs); color: var(--text-muted); font-variant-numeric: tabular-nums; }

  /* ── Breadcrumb & content area ───────────────────────────────────────── */
  .breadcrumb { padding: var(--space-3) var(--space-4); font-size: var(--text-sm); color: var(--text-muted); overflow-x: auto; white-space: nowrap; }
  .app-content { width: 100%; max-width: 1200px; margin: 0 auto; padding: var(--space-4); box-sizing: border-box; }

  /* ── Mobile Drawer ───────────────────────────────────────────────────── */
  .drawer-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 800;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s;
    /* GPU layer */
    will-change: opacity;
  }
  .drawer-overlay.is-open { opacity: 1; pointer-events: auto; }

  .mobile-drawer {
    position: fixed;
    top: 0; bottom: 0;
    /* RTL: drawer slides from right; LTR: from left */
    right: 0;
    width: min(80vw, 320px);
    background: var(--bg-surface);
    /* Start off-screen to the right */
    transform: translateX(100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 900;
    display: flex; flex-direction: column;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    /* Pad for safe areas (notch/gesture bar) */
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
    will-change: transform;
    box-shadow: var(--shadow-lg);
  }
  [dir="ltr"] .mobile-drawer { right: auto; left: 0; transform: translateX(-100%); }
  .mobile-drawer.is-open { transform: translateX(0); }

  .drawer-header {
    display: flex; align-items: center; gap: var(--space-2);
    padding: 12px var(--space-4); border-bottom: 1px solid var(--border-color);
    flex-shrink: 0;
  }
  .drawer-close {
    /* [UI-3.7] Was margin-right:auto plus a [dir=ltr] rule to undo it.
       margin-inline-start resolves to the same thing in both directions, so the
       override below is no longer needed. */
    margin-inline-start: auto; background: none; border: none; font-size: var(--text-xl);
    cursor: pointer; color: var(--text-muted); padding: var(--space-2);
    min-width: var(--tap-min, 48px); min-height: var(--tap-min, 48px);
    display: flex; align-items: center; justify-content: center;
  }

  .drawer-nav {
    flex: 1; overflow-y: auto; padding: var(--space-4) 0;
    -webkit-overflow-scrolling: touch;
  }
  .drawer-nav .nav-item,
  .drawer-nav-item {
    display: flex; align-items: center;
    padding: 14px var(--space-4);
    min-height: var(--tap-min, 48px);
    border-radius: 0;
    font-size: var(--text-base); font-weight: 600;
    border-bottom: 1px solid var(--border-color);
  }
  .drawer-nav .nav-item:last-child { border-bottom: none; }
  .drawer-group-label {
    padding: 10px var(--space-4) 4px;
    font-size: var(--text-xs); font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-muted);
  }
  .drawer-group .nav-dropdown-item {
    padding: 12px var(--space-6);
    white-space: normal;
    min-height: var(--tap-min, 48px);
  }
  .drawer-footer {
    padding: var(--space-4); border-top: 1px solid var(--border-color);
    flex-shrink: 0;
  }

  /* ── [UI-2.9b / U-48] Responsive tiers ───────────────────────────────────
   *
   * Five tiers, authored MOBILE-FIRST with min-width only, so each tier
   * inherits the one below it and every rule is additive:
   *
   *   phone     <= 599    base, no query
   *   tablet-p   600      drawer STAYS; the topbar cannot hold five dropdown
   *                       groups at this width
   *   tablet-l   900      topbar nav appears, drawer retires
   *   desktop   1280      the primary working target
   *   wide      1920      content unclamps
   *
   * The values are recorded as --bp-* tokens in CSS_Tokens.html. They cannot be
   * referenced here: a media query is evaluated before custom properties are
   * resolved, so a query written as min-width: var(--bp-tablet-l) is invalid in
   * every browser. The tokens are the canonical record and are readable from
   * JS; these literals must be kept equal to them.
   *
   * What changed: there were two tiers, 767 and 768, so a 768px iPad in
   * portrait got the identical layout to a 2560px monitor — the full topbar
   * nav crammed into 768px, and .app-content clamped to 1200px on a screen
   * twice that wide.
   *
   * NOTE ON INPUT TYPE: none of these tiers is a proxy for touch. Tap targets
   * stay 44/48px at every width because a Windows desktop can have a
   * touchscreen, and pointer affordances are gated on (hover: hover) /
   * (pointer: fine) instead — see the (hover: none) blocks above. */

  /* ── phone (base, <= 599px) ── */
  .topbar-hamburger { display: flex; }
  .topbar-nav       { display: none; }
  .topbar-right .user-block { display: none; }   /* the user lives in the drawer */
  /* The avatar-only profile button stays: below tablet-l it is the only route
   * to جلساتي / عروضي / logout now that the nav buttons are gone. */
  .topbar-right .user-profile .user-name { display: none; }
  .topbar      { padding: 0 var(--space-3); }
  .app-content { padding: var(--space-3); }
  .breadcrumb  { padding: var(--space-2) var(--space-3); }
  .modal-footer { flex-direction: column-reverse; }
  .modal-footer .btn { width: 100%; justify-content: center; }
  .stat-card { padding: var(--space-3); }

  /* ── [UI-4.8 / U-39] Phone: a table becomes a stack of cards ───────────
   * A data table on a 390px phone is a horizontal scroll box you have to drag
   * sideways to read one record. Below tablet-p each row becomes a card and
   * each cell a label/value line, using the data-label attribute _dtRowHtml
   * already emits.
   *
   * This is CSS only. It adds no elements and no JavaScript, so the DOM cost
   * per row is unchanged and there is no second render path that could drift
   * from the desktop one. The base (phone) styles come first because the whole
   * stylesheet is mobile-first; the tablet-p block below restores the table. */
  .table-wrap { max-height: none; }          /* the card list scrolls with the page */
  .table, .table tbody, .table tr, .table td { display: block; width: 100%; }
  .table thead { display: none; }            /* the labels move into the cells */
  .table tbody tr {
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    margin-bottom: var(--space-2);
    padding: var(--space-2);
    background: var(--bg-surface);
  }
  .table tbody td {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: var(--space-3);
    border: 0; border-bottom: 1px solid var(--border-color);
    padding: 8px 4px;
    text-align: start;
  }
  .table tbody td:last-child { border-bottom: 0; }
  .table tbody td[data-label]::before {
    content: attr(data-label);
    font-size: var(--text-xs); font-weight: 700; color: var(--text-muted);
    flex: 0 0 auto; max-width: 45%;
  }
  /* A numeric cell keeps its LTR direction but sits at the row's end. */
  .table tbody td.num { direction: ltr; justify-content: space-between; }
  .table tbody td.num::before { direction: rtl; }
  .table .dt-sel { justify-content: flex-start; }
  .table .dt-sel::before { content: none; }

  /* ── tablet-p (>= 600px) — the drawer deliberately STAYS ── */
  @media (min-width: 600px) {
    /* [UI-4.8] Back to a real table from tablet-p up. */
    .table-wrap { max-height: 70dvh; }
    .table { display: table; }
    .table thead { display: table-header-group; }
    .table tbody { display: table-row-group; }
    .table tr { display: table-row; }
    .table td { display: table-cell; }
    .table tbody tr { border: 0; border-radius: 0; margin: 0; padding: 0; background: transparent; }
    .table tbody td {
      display: table-cell; border: 0; border-bottom: 1px solid var(--border-color);
      padding: 10px 12px; text-align: right;
    }
    .table tbody td[data-label]::before { content: none; }
    .table tbody td.num { text-align: left; }
    .table .dt-sel { display: table-cell; text-align: center; }
    /* Enough width for the user's name beside the avatar. */
    .topbar-right .user-profile .user-name { display: inline; }
    /* Dialogs stop being bottom sheets and centre. */
    .modal-overlay { align-items: center; }
    .modal { border-radius: var(--radius-lg); max-width: 560px; padding-bottom: 0; }
    .modal.modal-sm { max-width: 420px; }
    .modal.modal-lg { max-width: 880px; }
    .modal.modal-xl { max-width: 1100px; }
    .modal-footer { flex-direction: row; }
    .modal-footer .btn { width: auto; }
    /* [UI-3.6] Above tablet-p a dialog is a centred box, not a sheet, so the
       grab handle would be meaningless. */
    .modal::before { display: none; }
    .stat-card { padding: var(--space-4); }
  }

  /* ── tablet-l (>= 900px) — the topbar nav appears ── */
  @media (min-width: 900px) {
    .topbar-hamburger { display: none !important; }
    .topbar-nav       { display: flex; }
    .topbar-right .user-block, .topbar-right .user-profile { display: flex !important; }
    .topbar      { padding: 0 var(--space-6); height: 60px; }
    .app-content { padding: var(--space-6); }
    /* [UI-4.1] From tablet-l the control panel's three groups fit on one row. */
    .cp-row-main { flex-direction: row; align-items: center; }
    .control-panel { padding: var(--space-2) var(--space-6) var(--space-3); }
  }

  /* ── wide (>= 1920px) — unclamp the content ──
   * .app-content is capped at 1200px, which leaves a 2560px monitor mostly
   * empty while the table inside it scrolls sideways. Raised rather than
   * removed: a fully fluid measure makes text lines uncomfortably long. */
  @media (min-width: 1920px) {
    .app-content { max-width: 1600px; }
  }

  /* Landscape compact: a height query, not a width one, so it is orthogonal to
   * the tiers and applies within whichever one is active. */
  @media (orientation: landscape) and (max-height: 500px) {
    .topbar { height: 44px; }
    .app-logo img { height: 24px; }
    .app-content { padding-top: var(--space-2); }
  }

  /* ── Keyboard-open layout adjustments ───────────────────────────────── */
  .keyboard-open .modal {
    /* When keyboard is open, shrink modal so it stays above keyboard */
    max-height: calc(100dvh - var(--keyboard-height, 0px) - 32px);
    max-height: calc(var(--vh, 1vh) * 100 - var(--keyboard-height, 0px) - 32px);
  }

  /* ── Screen reader only ──────────────────────────────────────────────── */
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  `;
  const style = document.createElement('style');
  style.textContent = css;
  document.head.appendChild(style);
})();

/* ── Side audit-history panel (السجل) ─────────────────────────────────────── */
/* Opens beside the current table: by default shows the LAST record's most
   recent change; when a record is selected (row click or السجل button) it
   shows that record's full history. Detailed log lives in ERP_Record_History. */
UIC.HistorySide = (function () {
  var panel = null, body = null, titleEl = null;

  function ensure() {
    if (panel) return;
    var css = '#history-side{position:fixed;top:0;right:0;height:100%;width:340px;max-width:90vw;background:#fff;' +
      'box-shadow:-4px 0 20px rgba(0,0,0,.15);z-index:9999;transform:translateX(100%);transition:transform .25s ease;' +
      'display:flex;flex-direction:column;direction:rtl;font-family:inherit;}' +
      '#history-side.open{transform:translateX(0);}' +
      '#history-side .hs-head{padding:12px 14px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;}' +
      '#history-side .hs-head h3{margin:0;font-size:15px;}' +
      '#history-side .hs-close{border:none;background:none;font-size:22px;cursor:pointer;line-height:1;}' +
      '#history-side .hs-body{padding:10px 14px;overflow:auto;flex:1;font-size:13px;}' +
      '#history-side .hs-card{border:1px solid #eee;border-radius:8px;padding:8px 10px;margin-bottom:8px;background:#fafafa;}' +
      '#history-side .hs-meta{color:#777;font-size:11px;margin-bottom:4px;}' +
      '#history-side .hs-change{font-size:12px;}' +
      '#history-side .hs-change b{color:#333;}' +
      '#history-side .hs-empty,#history-side .hs-load{color:#999;padding:20px 0;text-align:center;}';
    var st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
    panel = document.createElement('div'); panel.id = 'history-side';
    panel.innerHTML = '<div class="hs-head"><h3 id="hs-title">السجل</h3>' +
      '<button class="hs-close" onclick="UIC.HistorySide.close()">×</button></div>' +
      '<div class="hs-body" id="hs-body"></div>';
    document.body.appendChild(panel);
    body = panel.querySelector('#hs-body');
    titleEl = panel.querySelector('#hs-title');
    document.addEventListener('click', onDocClick);
  }

  function onDocClick(e) {
    var el = e.target.closest('[data-history-id]');
    if (el) { open(el.getAttribute('data-sheet') || window.SHEET, el.getAttribute('data-history-id')); return; }
    var row = e.target.closest('tr[data-id]');
    if (row && window.SHEET && !e.target.closest('button,a,input,select,textarea,[data-no-history]')) {
      open(window.SHEET, row.getAttribute('data-id'));
    }
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function render(rows) {
    if (!rows || !rows.length) { body.innerHTML = '<div class="hs-empty">لا يوجد سجل</div>'; return; }
    var html = '';
    rows.forEach(function (r) {
      var changed = (r.old_value || '') + '  →  ' + (r.new_value || '');
      html += '<div class="hs-card">' +
        '<div class="hs-meta">#' + esc(r.record_id || r.record_uid) + ' · ' + esc(r.action) +
        ' · ' + esc(typeof uname_ === 'function' ? uname_(r.changed_by) : r.changed_by) + ' · ' + esc(r.changed_at) + '</div>' +
        '<div class="hs-change"><b>' + esc(r.column_name) + ':</b> ' + esc(changed) + '</div>' +
        '</div>';
    });
    body.innerHTML = html;
  }

  function fetchAndRender(sheet, recordId, title) {
    ensure();
    if (!sheet) return;
    panel.classList.add('open');
    titleEl.textContent = title + ' · ' + sheet;
    body.innerHTML = '<div class="hs-load">جاري التحميل...</div>';
    API.call('get_record_history', { sheet_name: sheet, record_id: recordId || '' }, SESSION.token())
      .then(function (r) {
        var rows = (r && r.history) || [];
        if (recordId) { render(rows); return; }
        render(rows.length ? [rows[0]] : []);
      })
      .catch(function (e) { body.innerHTML = '<div class="hs-empty">تعذر التحميل: ' + esc(e.message || e) + '</div>'; });
  }

  function open(sheet, recordId) { fetchAndRender(sheet, recordId, 'السجل'); }
  function showLatest(sheet) { fetchAndRender(sheet, '', 'آخر سجل'); }
  function close() { if (panel) panel.classList.remove('open'); }

  return { open: open, showLatest: showLatest, close: close, ensure: ensure };
})();

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', function () {
    if (window.SHEET && window.ERP_HISTORY_AUTO !== false) UIC.HistorySide.showLatest(window.SHEET);
  });
} else if (window.SHEET && window.ERP_HISTORY_AUTO !== false) {
  UIC.HistorySide.showLatest(window.SHEET);
}
</script>
