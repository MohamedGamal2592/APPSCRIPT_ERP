UIC.filterTable = function (containerId, term) {
  UIC._ftTimers = UIC._ftTimers || {};
  const timers = UIC._ftTimers;
  if (timers[containerId]) clearTimeout(timers[containerId]);
  timers[containerId] = setTimeout(function () { UIC.filterPaged(containerId, term); }, 120);
};

/* ── Client-side reference-enum cache (avoid repeated server round-trips) ─── */
UIC.cacheOptions = function (key, arr, ttlMs) {
  try {
    localStorage.setItem('erp_opt_' + key, JSON.stringify({ t: Date.now(), ttl: ttlMs || 600000, v: arr }));
  } catch (e) {}
};
UIC.getCachedOptions = function (key) {
  try {
    const raw = localStorage.getItem('erp_opt_' + key);
    if (!raw) return null;
    const p = JSON.parse(raw);
    if (!p || !p.v) return null;
    if (p.ttl && (Date.now() - p.t) > p.ttl) return null;
    return p.v;
  } catch (e) { return null; }
};

/* ── Server-paged table: loads one window at a time, "load more" appends ─────
 * opts: { container, headers, pageSize, searchable, mapRow, fetcher, onFirst }
 *   mapRow(rawRecord) -> array of cell-HTML strings (UIC.dataTable row format)
 *   fetcher(offset, limit) -> Promise<{ rows: rawRecords[], total: number }>
 *   onFirst(firstResponse) -> capture globals (parties/enums) on first load   */
/* Skeleton placeholder: shimmering table + spinner shown while the first fetch is in flight. */
UIC.tableSkeleton = function (headers, rowCount) {
  var cols = (headers || []).map(function (h) { return (h && typeof h === 'object') ? (h.label || '') : String(h == null ? '' : h); });
  var n = rowCount || 8;
  var ths = cols.map(function (c) { return '<th>' + c + '</th>'; }).join('');
  var rows = '';
  for (var i = 0; i < n; i++) {
    rows += '<tr>' + cols.map(function () { return '<td><div class="pt-sk-bar"></div></td>'; }).join('') + '</tr>';
  }
  return '<div class="pt-loading"><div class="pt-spin"></div><span>جاري تحميل البيانات…</span></div>' +
    '<table class="pt-sk-table"><thead><tr>' + ths + '</tr></thead><tbody>' + rows + '</tbody></table>';
};

UIC.PagedTable = function (opts) {
  try {
    var container = typeof opts.container === 'string' ? document.getElementById(opts.container) : opts.container;
    if (!container) return;
    var hostId = 'pt_' + Math.random().toString(36).slice(2);
    var PAGE = opts.pageSize || 100;
    var offset = 0, total = 0, loading = false, done = false;
    var allRows = [];
    container.innerHTML =
      '<div id="' + hostId + '"></div>' +
      '<div class="pt-foot" style="display:flex;gap:12px;align-items:center;margin-top:10px;">' +
        '<button type="button" class="btn-secondary" id="' + hostId + '_more" style="display:none;">عرض المزيد</button>' +
        '<span class="pt-count" id="' + hostId + '_count" style="color:#666;font-size:13px;"></span>' +
      '</div>';
    var host = container.querySelector('#' + hostId);
    var moreBtn = container.querySelector('#' + hostId + '_more');
    var countEl = container.querySelector('#' + hostId + '_count');
    host.innerHTML = UIC.tableSkeleton(opts.headers, 8);

    function render() {
      host.innerHTML = UIC.dataTable(hostId, {
        headers: opts.headers,
        rows: allRows,
        searchable: opts.searchable !== false,
        emptyText: opts.emptyText || 'لا توجد بيانات',
        autoPage: false
      });
    }
    function setCount() {
      if (!countEl) return;
      countEl.textContent = 'إجمالي ' + total + (offset > 0 && offset < total ? ' — معروض ' + offset : '');
    }
    function loadMore() {
      if (loading || done) return;
      loading = true; moreBtn.disabled = true; moreBtn.textContent = 'جاري التحميل...';
      Promise.resolve(opts.fetcher(offset, PAGE)).then(function (raw) {
        raw = raw || {};
        var recs = (opts.getRows ? opts.getRows(raw)
          : (raw.rows || raw.invoices || raw.returns || raw.orders || raw.sessions || raw.headers || [])) || [];
        if (offset === 0 && opts.onFirst) { try { opts.onFirst(raw); } catch (e) {} }
        recs.forEach(function (rec) { try { allRows.push(opts.mapRow(rec)); } catch (e) {} });
        offset += recs.length;
        total = (opts.getTotal ? opts.getTotal(raw) : (raw.total != null ? raw.total : offset));
        done = offset >= total;
        render();
        if (opts.onRendered) { try { opts.onRendered(hostId); } catch (e) {} }
        moreBtn.style.display = done ? 'none' : '';
        setCount();
      }).catch(function (e) {
        if (offset === 0 && host) host.innerHTML = '<div class="empty-state"><span>تعذر تحميل البيانات — أعد المحاولة</span></div>';
        UIC.toast('خطأ: ' + (e && e.message ? e.message : e), 'error');
      }).finally(function () {
        loading = false; moreBtn.disabled = false; moreBtn.textContent = 'عرض المزيد';
      });
    }
    moreBtn.addEventListener('click', loadMore);
    setCount();
    loadMore();
  } catch (e) {
    UIC.toast('خطأ في الجدول: ' + (e && e.message ? e.message : e), 'error');
  }
};

/* [UI-1.3 / U-03] Tri-state column sort: ascending -> descending -> load order.
 *
 * Before this the sort was binary, had no visible indicator, and wrote its
 * result back over the only copy of the rows — so there was no way to get the
 * original order back short of reloading the page. */
UIC._dtNextSortDir = function (current) {
  return current === 'asc' ? 'desc' : current === 'desc' ? null : 'asc';
};

UIC.initTableSort = function (containerId) {
  const container = document.getElementById(containerId);
  if (!container) return;
  const st = (window.__dtStore || {})[containerId];

  /* Tables built by UIC.dataTable mark the columns that opted in, so a header
     carrying `sortable: false` — and the actions column — gets no listener, no
     pointer cursor and no chevron. Tables a page hand-built have no store and
     no markers, so they keep the legacy behaviour of every header being
     sortable; 50 pages call this function and some of them pass such a table. */
  const managed = !!st;
  const cells = container.querySelectorAll(managed ? 'th[data-sortable="true"]' : 'th');

  cells.forEach(th => {
    th.style.cursor = 'pointer';
    /* Reachable by keyboard, not only by mouse (U-33 asks for this everywhere;
       here it costs two attributes). */
    th.setAttribute('tabindex', '0');

    const activate = function () {
      if (managed) {
        const key = th.getAttribute('data-key');
        if (!key || !st.filtered) return;
        /* asc -> desc -> load order */
        st.sortDir = (st.sortKey === key) ? UIC._dtNextSortDir(st.sortDir) : 'asc';
        st.sortKey = st.sortDir ? key : null;
        /* Re-derive from the untouched load order, then re-apply search, date
           filter and sort. This is what makes the third click genuinely restore
           the original order. _applyFilters ends by sorting, rendering and
           refreshing the pager. */
        UIC._applyFilters(containerId);
        UIC._dtSyncSortIndicators(containerId);
        return;
      }

      /* Legacy DOM-row sort, for tables not built by UIC.dataTable. Unchanged
         except that it now cycles through three states like the managed path. */
      const prev = th.getAttribute('data-sort-dir');
      const dir = UIC._dtNextSortDir(prev);
      container.querySelectorAll('th').forEach(function (x) {
        if (x !== th) { x.removeAttribute('data-sort-dir'); x.setAttribute('aria-sort', 'none'); }
      });
      const tbody = container.querySelector('tbody');
      if (!tbody) return;
      const rows = Array.from(tbody.querySelectorAll('tr'));
      if (!dir) {
        /* Third state: put the DOM rows back in the order they were first seen. */
        if (!th.__uicDomOrder) return;
        th.__uicDomOrder.forEach(r => tbody.appendChild(r));
        th.removeAttribute('data-sort-dir');
        th.setAttribute('aria-sort', 'none');
        th.classList.remove('sorted-asc', 'sorted-desc');
        return;
      }
      if (!th.__uicDomOrder) th.__uicDomOrder = rows.slice();
      const asc = dir === 'asc';
      const cellIdx = Array.prototype.indexOf.call(th.parentNode.children, th) + 1;
      const valueOf = function (tr) {
        const c = tr.querySelector('td:nth-child(' + cellIdx + ')');
        if (!c) return '';
        if (c.getAttribute('data-sort') != null) return c.getAttribute('data-sort');
        if (c.getAttribute('data-num') != null) return c.getAttribute('data-num');
        return c.textContent.trim();
      };
      rows.sort((a, b) => {
        const av = valueOf(a), bv = valueOf(b);
        const numA = parseFloat(av), numB = parseFloat(bv);
        if (!isNaN(numA) && !isNaN(numB)) return asc ? numA - numB : numB - numA;
        return asc ? String(av).localeCompare(String(bv), 'ar') : String(bv).localeCompare(String(av), 'ar');
      });
      rows.forEach(r => tbody.appendChild(r));
      th.setAttribute('data-sort-dir', dir);
      th.setAttribute('aria-sort', asc ? 'ascending' : 'descending');
      th.classList.remove('sorted-asc', 'sorted-desc');
      th.classList.add(asc ? 'sorted-asc' : 'sorted-desc');
    };

    th.addEventListener('click', activate);
    th.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); activate(); }
    });
  });

  if (managed) UIC._dtSyncSortIndicators(containerId);
};

UIC.field = function (o) {
  const t = o.type || 'text';
  const required = o.required ? ' required' : '';
  const value = o.value !== undefined && o.value !== null ? ' value="' + o.value + '"' : '';
  const placeholder = o.placeholder ? ' placeholder="' + o.placeholder + '"' : '';
  const listAttr = o.list ? ' list="' + o.list + '"' : '';
  const minAttr = o.min !== undefined ? ' min="' + o.min + '"' : '';
  const stepAttr = o.step !== undefined ? ' step="' + o.step + '"' : '';

  /* ── Mobile: smart inputmode + enterkeyhint attributes ── */
  let inputmode = '';
  let enterkeyhint = '';
  let autocomplete = o.autocomplete ? ' autocomplete="' + o.autocomplete + '"' : '';
  let autocapitalize = '';
  if (t === 'tel')   { inputmode = ' inputmode="tel"'; enterkeyhint = ' enterkeyhint="done"'; }
  if (t === 'email') { inputmode = ' inputmode="email"'; enterkeyhint = ' enterkeyhint="done"'; autocapitalize = ' autocapitalize="off"'; if (!autocomplete) autocomplete = ' autocomplete="email"'; }
  if (t === 'number' || t === 'text' && o.numeric) { inputmode = ' inputmode="decimal"'; enterkeyhint = ' enterkeyhint="done"'; }
  if (t === 'search') { inputmode = ' inputmode="search"'; enterkeyhint = ' enterkeyhint="search"'; }
  if (t === 'password') { if (!autocomplete) autocomplete = ' autocomplete="current-password"'; }
  /* Prevent Android keyboard from autocorrecting code/ID fields */
  if (o.noCorrect) { autocapitalize = ' autocapitalize="off" autocorrect="off" autocomplete="off"'; }

  let control;
  if (t === 'select') {
    if (o.combo === false) {
      const emptyOpt = o.placeholder ? '<option value="">' + o.placeholder + '</option>' : '';
      const options = (o.options || []).map(opt => {
        const v = typeof opt === 'object' ? opt.value : opt;
        const l = typeof opt === 'object' ? opt.label : opt;
        const sel = String(v) === String(o.value) ? ' selected' : '';
        return '<option value="' + v + '"' + sel + '>' + l + '</option>';
      }).join('');
      control = '<select id="' + o.key + '" class="input"' + required + '>' + emptyOpt + options + '</select>';
    } else {
      return UIC.combo(o);
    }
  } else if (t === 'textarea') {
    control = '<textarea id="' + o.key + '" class="input" rows="' + (o.rows || 3) + '"' + required + inputmode + '>' + (o.value || '') + '</textarea>';
  } else {
    control = '<input id="' + o.key + '" class="input" type="' + t + '"' + value + placeholder + required + listAttr + minAttr + stepAttr + inputmode + enterkeyhint + autocomplete + autocapitalize + '>';
  }

  const errId = 'err-' + o.key;
  return '<div class="form-field" data-field="' + o.key + '">' +
    '<label class="form-label" for="' + o.key + '">' + (o.label || '') + (required ? ' <span class="req">*</span>' : '') + '</label>' +
    control +
    '<div class="field-error" id="' + errId + '"></div>' +
    '</div>';
};

UIC.datalist = function (id, values) {
  const esc = function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  };
  return '<datalist id="' + id + '">' +
    (values || []).map(function (v) { return '<option value="' + esc(v) + '"></option>'; }).join('') +
    '</datalist>';
};

UIC.combo = function (o) {
  const key = o.key;
  const esc = function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  };
  const opts = (o.options || []).map(function (opt) {
    const v = typeof opt === 'object' ? opt.value : opt;
    const l = typeof opt === 'object' ? opt.label : opt;
    return { value: String(v).trim(), label: String(l).trim() };
  });
  const byVal = {};
  const byLabel = {};
  opts.forEach(function (op) { byVal[op.value] = op; byLabel[op.label] = op; byVal[op.value.toLowerCase()] = op; byLabel[op.label.toLowerCase()] = op; });
  const req = o.required ? ' required' : '';
  const ph = o.placeholder ? ' placeholder="' + esc(o.placeholder) + '"' : '';
  const cur = o.value !== undefined && o.value !== null ? String(o.value).trim() : '';
  const curLabel = (byVal[cur] && byVal[cur].label) || (byLabel[cur] && byLabel[cur].label) || (byVal[cur.toLowerCase()] && byVal[cur.toLowerCase()].label) || (byLabel[cur.toLowerCase()] && byLabel[cur.toLowerCase()].label) || cur;
  const optHtml = opts.map(function (op, i) {
    return '<div class="combo-option" role="option" aria-selected="false" id="' + key + '_opt' + i + '" data-value="' + esc(op.value) + '" data-i="' + i + '" onmousedown="event.preventDefault();UIC.comboPick(\'' + key + '\',' + i + ')">' + esc(op.label) + '</div>';
  }).join('');
  const allowNew = o.allowNew ? ' data-allownew="1"' : '';
  window.__comboData = window.__comboData || {};
  window.__comboData[key] = { opts: opts, allowNew: !!o.allowNew };
  /* [UI-6.2 / U-31] The combo is a real ARIA combobox. Without this a screen
     reader announces it as a plain text box: no indication that a list exists,
     that it is open, or which option is highlighted. */
  const inner = '<div class="combo" data-combo="' + key + '">' +
    '<input id="' + key + '_display" class="input combo-input" autocomplete="off"' + ph + req + ' value="' + esc(curLabel) + '"' +
    ' role="combobox" aria-expanded="false" aria-autocomplete="list"' +
    ' aria-controls="' + key + '_list" aria-haspopup="listbox"' +
    ' onfocus="UIC.comboOpen(\'' + key + '\')" oninput="UIC.comboFilter(\'' + key + '\', this.value)" onblur="UIC.comboBlur(\'' + key + '\')" onkeydown="UIC.comboKey(\'' + key + '\', event)">' +
    '<input type="hidden" id="' + key + '" value="' + esc(cur) + '"' + allowNew + '>' +
    '<div class="combo-list" id="' + key + '_list" role="listbox" hidden>' + optHtml + '</div>' +
    '</div>';
  if (o.inline) return inner;
  return '<div class="form-field" data-field="' + key + '">' +
    '<label class="form-label" for="' + key + '_display">' + (o.label || '') + (o.required ? ' <span class="req">*</span>' : '') + '</label>' +
    inner +
    (o.allowNew ? '<input id="' + key + '_custom" class="input" style="margin-top:8px;display:none;" placeholder="أدخل القيمة الجديدة">' : '') +
    '<div class="field-error" id="err-' + key + '"></div>' +
    '</div>';
};

/* Searchable select alias (same component, clearer name for reference enums). */
UIC.SearchableSelect = UIC.combo;

/* [UI-1.2 / U-01] A combo inside a table cell was clipped by `.table-wrap`, and
 * one near the bottom of a modal was clipped by the modal's own scroll box.
 * Anchoring the list to its input against the viewport fixes both. The element
 * does not move in the DOM, so comboBlur / comboPick / comboKey and the
 * outside-click handler — all of which use `.closest('.combo')` — are unchanged. */
/* [UI-6.2 / U-31] One place that owns the combobox's ARIA state, so open,
 * close, filter and keyboard navigation cannot drift out of sync with it. */
UIC._comboAria = function (key, expanded, activeId) {
  var input = document.getElementById(key + '_display');
  if (!input) return;
  input.setAttribute('aria-expanded', expanded ? 'true' : 'false');
  if (activeId) input.setAttribute('aria-activedescendant', activeId);
  else input.removeAttribute('aria-activedescendant');
};

UIC._comboAnchor = function (key) {
  var list = document.getElementById(key + '_list');
  var input = document.getElementById(key + '_display');
  if (!list || !input || list.hidden) return;
  UIC._anchorFixed(list, input, { matchWidth: true });
};
UIC._comboUnanchor = function (key) {
  var list = document.getElementById(key + '_list');
  if (list) UIC._unanchor(list);
};

UIC.comboOpen = function (key) {
  const list = document.getElementById(key + '_list');
  if (!list) return;
  list.hidden = false;
  UIC._comboAria(key, true);
  UIC.comboFilter(key, document.getElementById(key + '_display').value);
  UIC._comboAnchor(key);
};

UIC.escHtml = function (s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
};
UIC.comboHighlight = function (label, q) {
  var s = UIC.escHtml(label);
  try {
    var qEsc = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    var re = new RegExp('(' + qEsc + ')', 'ig');
    s = s.replace(re, '<mark>$1</mark>');
  } catch (e) {}
  return s;
};
UIC.comboFilter = function (key, text) {
  const list = document.getElementById(key + '_list');
  if (!list) return;
  const data = (window.__comboData || {})[key];
  const q = String(text || '').trim().toLowerCase();
  const opts = (data && data.opts) || [];
  let visible = 0;
  opts.forEach(function (op, i) {
    const el = list.querySelector('[data-i="' + i + '"]');
    if (!el) return;
    const match = !q || op.label.toLowerCase().indexOf(q) !== -1 || op.value.toLowerCase().indexOf(q) !== -1;
    el.style.display = match ? '' : 'none';
    if (match) {
      visible++;
      el.innerHTML = q ? UIC.comboHighlight(op.label, q) : UIC.escHtml(op.label);
    }
  });
  list.style.display = visible ? '' : 'none';
  /* Filtering changes the list's height, so an anchored list must be re-placed
     or it drifts away from its input as options disappear. */
  if (list.__uicAnchor) UIC._anchorFixed(list, list.__uicAnchor, list.__uicOpts);
};

UIC.comboPick = function (key, i) {
  const data = (window.__comboData || {})[key];
  if (!data || !data.opts[i]) return;
  const op = data.opts[i];
  const disp = document.getElementById(key + '_display');
  const hidden = document.getElementById(key);
  if (disp) disp.value = op.label;
  if (hidden) {
    const changed = String(hidden.value) !== op.value;
    hidden.value = op.value;
    if (changed) hidden.dispatchEvent(new Event('change'));
  }
  const cust = document.getElementById(key + '_custom');
  if (cust) { cust.style.display = 'none'; cust.removeAttribute('required'); cust.value = ''; }
  const list = document.getElementById(key + '_list');
  if (list) { list.hidden = true; UIC._unanchor(list); }
  UIC._comboAria(key, false);
};

UIC.comboBlur = function (key) {
  const disp = document.getElementById(key + '_display');
  const hidden = document.getElementById(key);
  const data = (window.__comboData || {})[key];
  if (!disp || !hidden || !data) return;
  const text = String(disp.value || '').trim();
  const textLower = text.toLowerCase();
  let match = null;
  data.opts.forEach(function (op) { if (String(op.label).trim().toLowerCase() === textLower || String(op.value).trim().toLowerCase() === textLower) match = op; });
  if (match) {
    hidden.value = match.value;
    const cust = document.getElementById(key + '_custom');
    if (cust) { cust.style.display = 'none'; cust.removeAttribute('required'); cust.value = ''; }
  } else if (text) {
    if (data.allowNew) {
      const cust = document.getElementById(key + '_custom');
      hidden.value = '__new__';
      if (cust) { cust.style.display = ''; cust.value = text; cust.setAttribute('required', 'required'); }
    } else {
      disp.value = '';
      hidden.value = '';
    }
  } else {
    hidden.value = '';
  }
  const list = document.getElementById(key + '_list');
  if (list) { list.hidden = true; UIC._unanchor(list); }
  UIC._comboAria(key, false);
};

UIC.comboKey = function (key, ev) {
  const list = document.getElementById(key + '_list');
  if (!list) return;
  const visibleEls = [].slice.call(list.querySelectorAll('.combo-option')).filter(function (el) { return el.style.display !== 'none'; });
  if (!visibleEls.length) return;
  let idx = visibleEls.indexOf(list.querySelector('.combo-option.active'));
  if (ev.key === 'ArrowDown') {
    ev.preventDefault();
    idx = (idx + 1) % visibleEls.length;
  } else if (ev.key === 'ArrowUp') {
    ev.preventDefault();
    idx = (idx - 1 + visibleEls.length) % visibleEls.length;
  } else if (ev.key === 'Enter') {
    ev.preventDefault();
    const el = idx >= 0 ? visibleEls[idx] : visibleEls[0];
    UIC.comboPick(key, Number(el.getAttribute('data-i')));
    return;
  } else if (ev.key === 'Escape') {
    list.hidden = true;
    UIC._unanchor(list);
    UIC._comboAria(key, false);
    return;
  } else {
    return;
  }
  visibleEls.forEach(function (el) {
    el.classList.remove('active');
    el.setAttribute('aria-selected', 'false');
  });
  visibleEls[idx].classList.add('active');
  visibleEls[idx].setAttribute('aria-selected', 'true');
  /* aria-activedescendant is what tells a screen reader WHICH option is
     highlighted while focus stays in the text box. */
  UIC._comboAria(key, true, visibleEls[idx].id);
  visibleEls[idx].scrollIntoView({ block: 'nearest' });
};

document.addEventListener('click', function (ev) {
  document.querySelectorAll('.combo-list').forEach(function (list) {
    if (list.hidden) return;
    const host = list.closest('.combo');
    if (!host) return;
    if (!ev.target.closest('.combo') || ev.target.closest('.combo') !== host) {
      list.hidden = true;
      UIC._unanchor(list);
    }
  });
});

UIC.enumSelect = function (o) {
  return UIC.combo(Object.assign({}, o, { allowNew: true }));
};

UIC.enumToggle = function (id) {
  const sel = document.getElementById(id);
  const custom = document.getElementById(id + '_custom');
  if (!sel || !custom) return;
  if (sel.value === '__new__') {
    custom.style.display = '';
    custom.setAttribute('required', 'required');
    custom.focus();
  } else {
    custom.style.display = 'none';
    custom.removeAttribute('required');
    custom.value = '';
  }
};

UIC.fileField = function (o) {
  const accept = o.accept || '';
  const required = o.required ? ' required' : '';
  return '<div class="form-field" data-field="' + o.key + '">' +
    '<label class="form-label" for="' + o.key + '">' + (o.label || '') + '</label>' +
    '<input id="' + o.key + '" name="' + (o.name || 'file') + '" class="input" type="file"' +
    (accept ? ' accept="' + accept + '"' : '') + required + '>' +
    '<div class="field-error" id="err-' + o.key + '"></div>' +
    '</div>';
};

UIC.fileError = function (key, msg) {
  const err = document.getElementById('err-' + key);
  if (err) err.textContent = msg || '';
};

UIC._readForm = function (formId) {
  const form = document.getElementById(formId);
  if (!form) return { data: {}, valid: true };
  const data = {};
  let valid = true;
  form.querySelectorAll('.form-field').forEach(function (field) {
    const err = field.querySelector('.field-error');
    let fieldError = false;
    field.querySelectorAll('input, select, textarea').forEach(function (input) {
      if (input.type === 'file') return;
      data[input.id] = input.value.trim();
      if (input.hasAttribute('required') && input.value.trim() === '') fieldError = true;
    });
    if (fieldError) {
      if (err) err.textContent = 'هذا الحقل مطلوب';
      field.classList.add('has-error');
      valid = false;
    } else {
      if (err) err.textContent = '';
      field.classList.remove('has-error');
    }
  });
  return { data: data, valid: valid };
};

UIC.validateForm = function (formId) {
  return UIC._readForm(formId).valid;
};

UIC.collectForm = function (formId) {
  return UIC._readForm(formId).data;
};

UIC.collectAndValidateForm = function (formId) {
  const r = UIC._readForm(formId);
  return { data: r.data, valid: r.valid };
};

/* Dialog widths. 'md' (560px) is the default and deliberately emits NO class, so
   markup for every caller that passes no size stays byte-identical to before. */
UIC.MODAL_SIZES = { sm: ' modal-sm', md: '', lg: ' modal-lg', xl: ' modal-xl' };

UIC.openModal = function (modalId, opts) {
  const o = opts || {};
  const existing = document.getElementById(modalId);
  if (existing) existing.remove();

  const sizeClass = UIC.MODAL_SIZES[o.size] || '';

  const div = document.createElement('div');
  div.id = modalId;
  div.className = 'modal-overlay';
  /* [UI-3.6 / U-40] The bottom-sheet drag handle is a CSS ::before on .modal,
     not an element. Keeping it out of the markup means every one of the 78
     existing call sites still renders byte-identically — which
     tools/verify/s0_modal_size.js asserts — and it costs no DOM node. */
  div.innerHTML =
    '<div class="modal' + sizeClass + '" role="dialog" aria-modal="true">' +
      '<div class="modal-header"><h3>' + (o.title || '') + '</h3>' +
        '<button class="btn-icon" onclick="UIC.closeModal(\'' + modalId + '\')" aria-label="إغلاق">' + UIC.icon('close', { size: 18 }) + '</button></div>' +
      '<div class="modal-body">' + (o.body || '') + '</div>' +
      (o.footer === false
        ? ''
        : typeof o.footer === 'string'
          /* Custom footer markup. Additive: every caller before this passed
             either nothing or false, so the default below is untouched. */
          ? '<div class="modal-footer">' + o.footer + '</div>'
          : '<div class="modal-footer">' + UIC.button({ text: 'إلغاء', type: 'outline', onClick: 'UIC.closeModal(\'' + modalId + '\')' }) + ' ' + UIC.button({ text: 'حفظ', onClick: 'UI.submitOnce(this, function(){' + (o.onSave || '') + '})' }) + '</div>') +
    '</div>';
  document.body.appendChild(div);
  document.body.classList.add('modal-open');
  try { UIC._initSheetSwipe(div, modalId); } catch (e) {}
  try { UIC._trapFocus(div, modalId); } catch (e) {}
  return div;
};

/* ── [UI-6.1 / U-31] Focus trap, focus restore, Escape ────────────────────
 *
 * A dialog opened and focus stayed behind it, so a keyboard user tabbed through
 * the page UNDERNEATH — invisible, and able to change fields they could not
 * see. Escape did nothing, and on close focus was lost to <body>, so the next
 * Tab started from the top of the page rather than from the control the user
 * had just been on.
 */
UIC._FOCUSABLE = 'a[href], button:not([disabled]), input:not([disabled]), ' +
  'select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';

UIC._trapFocus = function (overlay, modalId) {
  if (!overlay || !overlay.querySelectorAll) return;
  UIC._focusReturn = UIC._focusReturn || {};
  /* Remember where focus was, so it can go back exactly there on close. */
  try { UIC._focusReturn[modalId] = document.activeElement; } catch (e) {}

  var focusables = function () {
    try { return [].slice.call(overlay.querySelectorAll(UIC._FOCUSABLE)); } catch (e) { return []; }
  };

  /* Focus the first meaningful control, not the close button: on a form dialog
     that is the first field, which is where the user wants to be. */
  setTimeout(function () {
    var els = focusables();
    var first = els.filter(function (e) { return !/btn-icon/.test(String(e.className || '')); })[0] || els[0];
    if (first && first.focus) { try { first.focus(); } catch (e) {} }
  }, 0);

  overlay.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      e.stopPropagation();
      UIC.closeModal(modalId);
      return;
    }
    if (e.key !== 'Tab') return;
    var els = focusables();
    if (!els.length) return;
    var first = els[0], last = els[els.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); if (last.focus) last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); if (first.focus) first.focus(); }
  });
};

/* ── [UI-3.6 / U-40] Swipe a bottom sheet down to dismiss ─────────────────
 *
 * Below tablet-p a dialog is a bottom sheet, and a bottom sheet that can only
 * be closed by finding a small × in its corner is the wrong shape on a phone.
 * The drawer and toasts already swipe; dialogs did not.
 *
 * Two rules keep this from fighting the content:
 *   - it only engages while the sheet is scrolled to the TOP, so dragging to
 *     read a long form scrolls it instead of dismissing it;
 *   - it only engages below the tablet-p tier, because above it the dialog is
 *     a centred box, not a sheet, and dragging it would mean nothing.
 * Listeners are passive: the drag follows the finger without blocking scroll,
 * which is what keeps it smooth on a mid-range Android.
 */
UIC._initSheetSwipe = function (overlayEl, modalId) {
  var sheet = overlayEl && overlayEl.querySelector ? overlayEl.querySelector('.modal') : null;
  if (!sheet) return;
  var startY = 0, dy = 0, dragging = false;

  sheet.addEventListener('touchstart', function (e) {
    /* Centred dialogs (tablet-p and up) are not sheets. */
    if ((window.innerWidth || 0) >= 600) return;
    if (sheet.scrollTop > 0) return;            /* let the content scroll */
    startY = e.touches[0].clientY;
    dy = 0;
    dragging = true;
    sheet.style.transition = 'none';
  }, { passive: true });

  sheet.addEventListener('touchmove', function (e) {
    if (!dragging) return;
    dy = e.touches[0].clientY - startY;
    if (dy <= 0) return;                        /* only downward */
    sheet.style.transform = 'translateY(' + dy + 'px)';
  }, { passive: true });

  sheet.addEventListener('touchend', function () {
    if (!dragging) return;
    dragging = false;
    sheet.style.transition = '';
    if (dy > 80) {
      sheet.style.transform = 'translateY(100%)';
      setTimeout(function () { try { UIC.closeModal(modalId); } catch (e) {} }, 180);
    } else {
      sheet.style.transform = '';
    }
  }, { passive: true });
};

UIC.closeModal = function (modalId) {
  const el = document.getElementById(modalId);
  if (el) el.remove();
  /* Only drop the body class when no dialog remains: a confirm opened ON TOP of
     a form dialog must not unlock the page behind both when it closes. */
  if (!document.querySelector('.modal-overlay')) {
    document.body.classList.remove('modal-open');
  }
  /* [UI-6.1 / U-31] Put focus back where it was, so the next Tab continues from
     the control the user was on rather than from the top of the page. */
  try {
    var back = (UIC._focusReturn || {})[modalId];
    if (back && back.focus && back.isConnected !== false) back.focus();
    if (UIC._focusReturn) delete UIC._focusReturn[modalId];
  } catch (e) {}
};

/* ── [UI-3.5 / U-22] Empty states ─────────────────────────────────────────
 *
 * An empty list showed a grey box containing one sentence — "لا توجد بيانات" —
 * which tells the user nothing about WHY it is empty or what to do next. It
 * reads the same whether the table has no records at all, or a filter matched
 * nothing, or the user lacks the grant to see anything.
 *
 * UIC.emptyState({ icon, title, body, action }) gives it an illustration, an
 * explanation and a primary action. Every field is optional.
 *
 * The old contract is untouched: UIC.dataTable's `emptyText` string still works
 * and still reads the same, it simply renders inside the better container. A
 * plain string may also be passed directly.
 */
UIC.emptyState = function (opts) {
  var o = (typeof opts === 'string') ? { title: opts } : (opts || {});
  var icon = (o.icon === false) ? '' :
    '<div class="empty-state-icon">' + UIC.icon(o.icon || 'inbox', { size: 40 }) + '</div>';
  var body = o.body ? '<p class="empty-state-body">' + UIC.escHtml(o.body) + '</p>' : '';
  /* o.action is a UIC.button options object, so the caller cannot accidentally
     inject markup here and the button matches every other button in the app. */
  var action = o.action ? '<div class="empty-state-action">' + UIC.button(o.action) + '</div>' : '';
  return '<div class="empty-state">' + icon +
    '<div class="empty-state-title">' + UIC.escHtml(o.title || 'لا توجد بيانات') + '</div>' +
    body + action + '</div>';
};

/* ── [UI-5.2 / U-28] Styled confirm and alert ─────────────────────────────
 *
 * The app used 34 native confirm() and 10 native alert() calls. A native dialog
 * is drawn by the BROWSER: it cannot carry the app's typeface, it is not RTL,
 * it names the origin ("googleusercontent.com says…") rather than the app, and
 * — worst for a destructive action — it says "Are you sure?" without naming
 * WHAT is about to be deleted.
 *
 * UIC.confirm returns a Promise<boolean>, because a styled dialog cannot block
 * the way confirm() does. That is the one real cost of the change and it is why
 * call sites have to be restructured rather than swapped.
 */
UIC.confirm = function (opts) {
  var o = (typeof opts === 'string') ? { message: opts } : (opts || {});
  var danger = o.danger !== false && (o.danger === true || /حذف|delete/i.test(o.confirmText || ''));
  return new Promise(function (resolve) {
    var id = 'uic-confirm-' + Math.random().toString(36).slice(2, 8);
    var settled = false;
    var done = function (v) {
      if (settled) return;
      settled = true;
      try { UIC.closeModal(id); } catch (e) {}
      resolve(v);
    };
    UIC._confirmResolvers = UIC._confirmResolvers || {};
    UIC._confirmResolvers[id] = done;

    var body =
      (o.message ? '<p class="uic-confirm-msg">' + UIC.escHtml(o.message) + '</p>' : '') +
      /* Naming the record is the point: "Delete?" and
         "Delete invoice INV-2026-0043?" are not the same question. */
      (o.record ? '<p class="uic-confirm-record">' + UIC.escHtml(o.record) + '</p>' : '') +
      (o.detail ? '<p class="uic-confirm-detail">' + UIC.escHtml(o.detail) + '</p>' : '');

    /* cancelText: null means acknowledge-only — that is how UIC.alert is built
       on top of this, and it must not render a Cancel the user could read as a
       meaningful choice. */
    var cancelBtn = (o.cancelText === null) ? '' :
      UIC.button({ text: o.cancelText || 'إلغاء', type: 'outline',
        onClick: "UIC._confirmAnswer('" + id + "', false)" }) + ' ';
    var footer = cancelBtn +
      UIC.button({ text: o.confirmText || 'تأكيد', type: danger ? 'danger' : 'primary',
        onClick: "UIC._confirmAnswer('" + id + "', true)" });

    UIC.openModal(id, {
      title: o.title || (danger ? 'تأكيد الحذف' : 'تأكيد'),
      size: 'sm',
      body: body,
      footer: footer
    });
    /* Closing by the × or by Escape is a "no", never a silent hang. */
    var overlay = document.getElementById(id);
    if (overlay) {
      overlay.addEventListener('click', function (e) { if (e.target === overlay) done(false); });
    }
  });
};

UIC._confirmAnswer = function (id, value) {
  var f = (UIC._confirmResolvers || {})[id];
  if (f) { delete UIC._confirmResolvers[id]; f(value); }
};

/* A styled replacement for alert(). Resolves when acknowledged. */
UIC.alert = function (opts) {
  var o = (typeof opts === 'string') ? { message: opts } : (opts || {});
  return UIC.confirm({
    title: o.title || 'تنبيه',
    message: o.message,
    detail: o.detail,
    danger: o.danger === true,
    confirmText: o.confirmText || 'حسناً',
    cancelText: null
  });
};

/* ── [UI-5.1 / U-26] Unsaved-changes protection ───────────────────────────
 *
 * There was none, anywhere. A half-finished multi-line invoice was lost
 * silently to a mis-click on a nav link or a browser Back — the single most
 * expensive small defect in the investigation, because the work lost is
 * proportional to how much the user had done.
 *
 * UIC.trackDirty(formId) snapshots a form and watches it. Two guards then
 * apply: the browser's own beforeunload for a tab close or a Back, and an
 * in-app interception of UIC.navTo for a nav click, where a styled dialog can
 * actually name what is about to be discarded.
 */
UIC._dirty = { forms: {}, wired: false };

UIC.trackDirty = function (formId, opts) {
  var el = typeof formId === 'string' ? document.getElementById(formId) : formId;
  if (!el) return;
  var key = (el.id || formId);
  UIC._dirty.forms[key] = {
    el: el,
    snapshot: UIC._formSignature(el),
    label: (opts && opts.label) || ''
  };
  UIC._wireDirtyGuard();
};

UIC.clearDirty = function (formId) {
  var key = (typeof formId === 'string') ? formId : (formId && formId.id);
  if (key && UIC._dirty.forms[key]) {
    /* Re-snapshot rather than delete: after a save the form is clean but still
       on screen, and the user may start editing again. */
    UIC._dirty.forms[key].snapshot = UIC._formSignature(UIC._dirty.forms[key].el);
  }
};

UIC.untrackDirty = function (formId) {
  var key = (typeof formId === 'string') ? formId : (formId && formId.id);
  if (key) delete UIC._dirty.forms[key];
};

UIC._formSignature = function (el) {
  if (!el || !el.querySelectorAll) return '';
  var parts = [];
  try {
    [].slice.call(el.querySelectorAll('input, select, textarea')).forEach(function (f) {
      if (f.type === 'file') return;
      parts.push((f.id || f.name || '') + '=' + (f.type === 'checkbox' || f.type === 'radio' ? f.checked : f.value));
    });
  } catch (e) {}
  return parts.join('');
};

/** Which tracked forms currently differ from their snapshot. */
UIC.dirtyForms = function () {
  var out = [];
  Object.keys(UIC._dirty.forms).forEach(function (k) {
    var f = UIC._dirty.forms[k];
    if (!f || !f.el) return;
    if (UIC._formSignature(f.el) !== f.snapshot) out.push(f);
  });
  return out;
};

UIC.isDirty = function () { return UIC.dirtyForms().length > 0; };

UIC._wireDirtyGuard = function () {
  if (UIC._dirty.wired) return;
  UIC._dirty.wired = true;

  /* The browser guard. It cannot be styled and its wording is the browser's,
     but it is the ONLY thing that catches a tab close or a Back. */
  window.addEventListener('beforeunload', function (e) {
    if (!UIC.isDirty()) return;
    if (UIC._dirty.bypass) return;
    e.preventDefault();
    e.returnValue = '';
    return '';
  });

  /* The in-app guard. Every nav link in the shell routes through UIC.navTo, so
     wrapping it once covers the topbar, the drawer, the dropdowns, the
     breadcrumb and the home button. */
  if (!UIC._navToOriginal) {
    UIC._navToOriginal = UIC.navTo;
    UIC.navTo = function (ev, href) {
      if (!UIC.isDirty()) return UIC._navToOriginal(ev, href);
      try { if (ev && ev.preventDefault) ev.preventDefault(); } catch (e) {}
      var dirty = UIC.dirtyForms();
      var names = dirty.map(function (f) { return f.label; }).filter(Boolean).join('، ');
      UIC.confirm({
        title: 'تغييرات غير محفوظة',
        message: 'لديك تغييرات لم يتم حفظها. هل تريد الخروج وتجاهلها؟',
        record: names || '',
        confirmText: 'تجاهل التغييرات',
        cancelText: 'البقاء في الصفحة',
        danger: true
      }).then(function (go) {
        if (!go) return;
        UIC._dirty.bypass = true;          /* do not also raise the browser one */
        UIC._navToOriginal(ev, href);
      });
    };
  }
};

/* ── [UI-5.3 / U-27] Field validation ─────────────────────────────────────
 *
 * Validation was required-fields-only, and it reported failures in a toast that
 * disappeared after three seconds — so on a long form the user was told
 * something was wrong but not which field, and the message was gone before they
 * finished scrolling.
 *
 * Errors are anchored to the field. UIC.field already renders a
 * `.field-error` element beside every input; this fills it.
 */
UIC.validators = {
  required: function (v) { return String(v == null ? '' : v).trim() !== '' || 'هذا الحقل مطلوب'; },
  number:   function (v) { return v === '' || !isNaN(parseFloat(v)) || 'أدخل رقماً صحيحاً'; },
  positive: function (v) { return v === '' || parseFloat(v) > 0 || 'يجب أن يكون أكبر من صفر'; },
  min:      function (v, arg) { return v === '' || parseFloat(v) >= arg || ('أقل قيمة مسموحة ' + arg); },
  max:      function (v, arg) { return v === '' || parseFloat(v) <= arg || ('أكبر قيمة مسموحة ' + arg); },
  email:    function (v) { return v === '' || /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v) || 'بريد إلكتروني غير صحيح'; },
  pattern:  function (v, arg) { return v === '' || new RegExp(arg).test(v) || 'صيغة غير صحيحة'; }
};

UIC.setFieldError = function (key, message) {
  var err = document.getElementById('err-' + key);
  if (err) err.textContent = message || '';
  var field = document.querySelector('[data-field="' + key + '"]');
  if (field) {
    if (message) field.classList.add('has-error'); else field.classList.remove('has-error');
  }
  var input = document.getElementById(key);
  if (input) {
    if (message) {
      input.setAttribute('aria-invalid', 'true');
      input.setAttribute('aria-describedby', 'err-' + key);
    } else {
      input.removeAttribute('aria-invalid');
      input.removeAttribute('aria-describedby');
    }
  }
};

/**
 * UIC.validate(rules, values) -> { valid, errors }
 *   rules: { fieldKey: [ 'required', ['min', 0], fn ] }
 * A rule returns true, or the message to show. Cross-field rules get the whole
 * value object as a second argument.
 */
UIC.validate = function (rules, values) {
  var errors = {};
  var vals = values || {};
  Object.keys(rules || {}).forEach(function (key) {
    var list = rules[key];
    if (!Array.isArray(list)) list = [list];
    for (var i = 0; i < list.length; i++) {
      var rule = list[i], fn, arg;
      if (typeof rule === 'function') { fn = rule; }
      else if (Array.isArray(rule)) { fn = UIC.validators[rule[0]]; arg = rule[1]; }
      else { fn = UIC.validators[rule]; }
      if (!fn) continue;
      var r = fn(vals[key], arg, vals);
      if (r !== true) { errors[key] = (typeof r === 'string') ? r : 'قيمة غير صحيحة'; break; }
    }
  });
  return { valid: Object.keys(errors).length === 0, errors: errors };
};

/** Validate, paint the errors onto the fields, and focus the first bad one. */
UIC.validateAndShow = function (rules, values) {
  var res = UIC.validate(rules, values);
  Object.keys(rules || {}).forEach(function (k) { UIC.setFieldError(k, res.errors[k] || ''); });
  if (!res.valid) {
    var first = Object.keys(res.errors)[0];
    var el = document.getElementById(first);
    if (el && el.focus) { try { el.focus(); } catch (e) {} }
    if (el && el.scrollIntoView) { try { el.scrollIntoView({ block: 'center' }); } catch (e) {} }
  }
  return res;
};

/** Error anchored to a LINE in a line-item table, not to the form as a whole. */
UIC.setLineError = function (rowEl, message) {
  if (!rowEl) return;
  if (message) {
    rowEl.classList.add('line-error');
    rowEl.setAttribute('data-line-error', message);
  } else {
    rowEl.classList.remove('line-error');
    rowEl.removeAttribute('data-line-error');
  }
};

UIC.toast = function (message, type) {
  const t = type || 'success';
  const toast = document.createElement('div');
  toast.className = 'toast toast-' + t;
  toast.setAttribute('role', 'status');
  toast.setAttribute('aria-live', 'polite');
  toast.textContent = message;
  document.body.appendChild(toast);

  /* ── Swipe-to-dismiss (horizontal swipe) ── */
  let startX = 0;
  toast.addEventListener('touchstart', function (e) {
    startX = e.touches[0].clientX;
  }, { passive: true });
  toast.addEventListener('touchend', function (e) {
    const dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > 80) {
      toast.style.transition = 'transform 0.2s, opacity 0.2s';
      toast.style.transform  = 'translateX(' + (dx > 0 ? '120%' : '-120%') + ')';
      toast.style.opacity    = '0';
      setTimeout(function () { toast.remove(); }, 200);
    }
  }, { passive: true });

  setTimeout(function () {
    toast.classList.add('toast-out');
    setTimeout(function () { toast.remove(); }, 300);
  }, 3000);
};

/* ── [UI-5.4 / U-29] The workflow statusbar ───────────────────────────────
 *
 * A record's position in its workflow was a text pill somewhere on the page, so
 * "what happens next" was something you had to already know. This shows the
 * whole sequence with the current stage marked.
 *
 * UIC.statusbar(stages, current, opts)
 *   stages   ['مسودة', 'قيد المراجعة', 'معتمد']  or  [{key, label}]
 *   current  the key or label of the active stage
 *   opts.onSelect  'fn("<key>")' — makes stages clickable. Omit it and the bar
 *                  is purely informational, which is the safe default: a stage
 *                  that looks clickable and is not is worse than a plain label.
 */
UIC.statusbar = function (stages, current, opts) {
  var o = opts || {};
  var list = (stages || []).map(function (s) {
    return (typeof s === 'string') ? { key: s, label: s } : s;
  });
  var activeIdx = -1;
  list.forEach(function (s, i) {
    if (String(s.key) === String(current) || String(s.label) === String(current)) activeIdx = i;
  });
  var items = list.map(function (s, i) {
    var state = i < activeIdx ? 'done' : (i === activeIdx ? 'current' : 'todo');
    var clickable = o.onSelect && i !== activeIdx;
    var attrs = clickable
      ? ' role="button" tabindex="0" onclick="' + o.onSelect.replace('{key}', UIC.escHtml(String(s.key))) + '"'
      : '';
    return '<li class="sb-stage sb-' + state + '"' + attrs +
      (i === activeIdx ? ' aria-current="step"' : '') + '>' +
      '<span class="sb-dot" aria-hidden="true">' +
      (state === 'done' ? UIC.icon('check', { size: 12 }) : '') + '</span>' +
      '<span class="sb-label">' + UIC.escHtml(String(s.label)) + '</span></li>';
  }).join('');
  return '<nav class="statusbar" aria-label="حالة السجل"><ol class="sb-list">' + items + '</ol></nav>';
};

/* ── [UI-5.5 / U-29] Smart buttons ────────────────────────────────────────
 *
 * 37 places opened a related record with window.open() into a new tab, which on
 * a phone is a lost context and in the Apps Script sandbox is often blocked
 * outright. A smart button shows the COUNT and navigates in place.
 *
 * Per the standing answer: only counts derivable from data the page has ALREADY
 * LOADED. A button whose count would need a new server endpoint is not built —
 * it is written up as a proposal instead. `count` is therefore a required
 * number here; there is no fetching path at all, by design.
 */
UIC.smartButtons = function (buttons) {
  var list = (buttons || []).filter(function (b) { return b && b.count != null; });
  if (!list.length) return '';
  return '<div class="smart-buttons">' + list.map(function (b) {
    var disabled = !b.onClick || Number(b.count) === 0;
    return '<button type="button" class="smart-btn" ' +
      (disabled ? 'disabled ' : 'onclick="' + b.onClick + '" ') +
      'aria-label="' + UIC.escHtml(String(b.label)) + ': ' + UIC.escHtml(String(b.count)) + '">' +
      (b.icon ? '<span class="smart-btn-icon">' + UIC.icon(b.icon, { size: 18 }) + '</span>' : '') +
      '<span class="smart-btn-count">' + UIC.escHtml(String(b.count)) + '</span>' +
      '<span class="smart-btn-label">' + UIC.escHtml(String(b.label)) + '</span>' +
      '</button>';
  }).join('') + '</div>';
};

/* ── [UI-5.6 / U-29] Notebook tabs ────────────────────────────────────────
 *
 * Four pages hand-rolled their own tab strip, none with keyboard support and
 * none with a role. This is one component with the ARIA tab pattern: arrow keys
 * move between tabs, Home/End jump to the ends, and only the active tab is in
 * the tab order.
 */
UIC.notebook = function (id, tabs, activeKey) {
  var list = tabs || [];
  var active = activeKey || (list[0] && list[0].key);
  var heads = list.map(function (t) {
    var on = String(t.key) === String(active);
    return '<button type="button" role="tab" id="' + id + '-tab-' + t.key + '"' +
      ' aria-selected="' + on + '" aria-controls="' + id + '-panel-' + t.key + '"' +
      ' tabindex="' + (on ? '0' : '-1') + '" class="nb-tab' + (on ? ' nb-tab-active' : '') + '"' +
      ' onclick="UIC.notebookSelect(\'' + id + '\', \'' + UIC.escHtml(String(t.key)) + '\')"' +
      ' onkeydown="UIC._notebookKey(\'' + id + '\', event)">' +
      (t.icon ? UIC.icon(t.icon, { size: 15 }) : '') +
      '<span>' + UIC.escHtml(String(t.label)) + '</span>' +
      (t.badge != null ? '<span class="nb-badge">' + UIC.escHtml(String(t.badge)) + '</span>' : '') +
      '</button>';
  }).join('');
  var panels = list.map(function (t) {
    var on = String(t.key) === String(active);
    return '<div role="tabpanel" id="' + id + '-panel-' + t.key + '"' +
      ' aria-labelledby="' + id + '-tab-' + t.key + '" class="nb-panel"' +
      (on ? '' : ' hidden') + '>' + (t.content || '') + '</div>';
  }).join('');
  window.__notebooks = window.__notebooks || {};
  window.__notebooks[id] = list.map(function (t) { return String(t.key); });
  return '<div class="notebook" id="' + id + '">' +
    '<div class="nb-tabs" role="tablist">' + heads + '</div>' + panels + '</div>';
};

UIC.notebookSelect = function (id, key) {
  var keys = (window.__notebooks || {})[id] || [];
  keys.forEach(function (k) {
    var tab = document.getElementById(id + '-tab-' + k);
    var panel = document.getElementById(id + '-panel-' + k);
    var on = String(k) === String(key);
    if (tab) {
      tab.setAttribute('aria-selected', String(on));
      tab.setAttribute('tabindex', on ? '0' : '-1');
      tab.classList.toggle('nb-tab-active', on);
    }
    if (panel) panel.hidden = !on;
  });
};

UIC._notebookKey = function (id, ev) {
  var keys = (window.__notebooks || {})[id] || [];
  if (!keys.length) return;
  var cur = -1;
  keys.forEach(function (k, i) {
    var t = document.getElementById(id + '-tab-' + k);
    if (t && t.getAttribute('aria-selected') === 'true') cur = i;
  });
  var next = null;
  /* RTL: ArrowLeft advances, ArrowRight goes back. */
  var rtl = (document.documentElement.getAttribute('dir') || '') === 'rtl';
  if (ev.key === 'ArrowRight') next = rtl ? cur - 1 : cur + 1;
  else if (ev.key === 'ArrowLeft') next = rtl ? cur + 1 : cur - 1;
  else if (ev.key === 'Home') next = 0;
  else if (ev.key === 'End') next = keys.length - 1;
  else return;
  ev.preventDefault();
  next = (next + keys.length) % keys.length;
  UIC.notebookSelect(id, keys[next]);
  var el = document.getElementById(id + '-tab-' + keys[next]);
  if (el && el.focus) el.focus();
};

/* ── [UI-9.2 / U-37] Chart defaults, read from the theme ──────────────────
 *
 * Every chart in the app hardcoded #111111 for its text and carried its own
 * 9-colour palette, so charts did not follow the company theme and — after
 * Phase 8 — would have been black-on-black in dark mode.
 *
 * UIC.applyChartDefaults reads the ACTUAL computed token values, so it is
 * correct under all three companies, both themes, and any company colour added
 * later, with no per-chart configuration.
 *
 * The categorical palette is NOT taken from the theme: a series colour has to
 * stay distinguishable from its neighbours, which a single brand hue cannot do.
 * It is a fixed, ordered set chosen to stay separable in both light and dark.
 */
UIC.cssVar = function (name, fallback) {
  try {
    var v = getComputedStyle(document.documentElement).getPropertyValue(name);
    v = String(v || '').trim();
    return v || fallback;
  } catch (e) { return fallback; }
};

UIC.CHART_PALETTE = [
  '#2563eb', '#16a34a', '#d97706', '#dc2626', '#7c3aed',
  '#0891b2', '#c2410c', '#4d7c0f', '#be185d', '#475569'
];

UIC.applyChartDefaults = function () {
  if (typeof Chart === 'undefined') return false;
  try {
    var ink    = UIC.cssVar('--text-main', '#111827');
    var muted  = UIC.cssVar('--text-muted', '#5b6572');
    var border = UIC.cssVar('--border-color', '#e2e5ea');
    var surface = UIC.cssVar('--bg-surface', '#ffffff');
    var font   = UIC.cssVar('--font-sans', "'Cairo', sans-serif");

    Chart.defaults.color = muted;
    Chart.defaults.borderColor = border;
    Chart.defaults.font.family = font;
    Chart.defaults.font.size = 12;
    Chart.defaults.plugins.legend.labels.color = ink;
    Chart.defaults.plugins.tooltip.backgroundColor = ink;
    Chart.defaults.plugins.tooltip.titleColor = surface;
    Chart.defaults.plugins.tooltip.bodyColor = surface;
    /* RTL: the legend and tooltips read right to left like everything else. */
    Chart.defaults.plugins.legend.rtl = true;
    Chart.defaults.plugins.tooltip.rtl = true;
    Chart.defaults.plugins.legend.textDirection = 'rtl';
    /* A chart that animates on every render is noise in a dashboard someone
       refreshes all day, and it is a real problem for anyone motion-sensitive. */
    try {
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        Chart.defaults.animation = false;
      }
    } catch (e) {}
    return true;
  } catch (e) { return false; }
};

/** Colour n series from the categorical palette, wrapping if there are more. */
UIC.chartColors = function (n) {
  var out = [];
  for (var i = 0; i < (n || 0); i++) out.push(UIC.CHART_PALETTE[i % UIC.CHART_PALETTE.length]);
  return out;
};

UIC.statCard = function (o) {
  const tone = o.tone || 'default';
  return '<div class="stat-card stat-' + tone + '">' +
    '<div class="stat-icon">' + (o.icon || '') + '</div>' +
    '<div class="stat-body"><div class="stat-value">' + (o.value !== undefined ? o.value : '') + '</div>' +
    '<div class="stat-label">' + (o.label || '') + '</div></div></div>';
};

UIC.companyTile = function (o) {
  const logo = o.logo_url
    ? '<img src="' + o.logo_url + '" class="tile-logo" alt="' + (o.name_en || '') + '" onerror="this.style.display=\'none\'">'
    : '<div class="tile-logo tile-logo-fallback">' + (o.name_ar || '').charAt(0) + '</div>';
  return '<div class="company-tile" onclick="' + (o.onOpen || '') + '" title="' + (o.name_en || '') + '">' +
    logo +
    '<div class="tile-name-ar">' + (o.name_ar || '') + '</div>' +
    '<div class="tile-name-en">' + (o.name_en || '') + '</div>' +
    '<span class="tile-enter">دخول ' + UIC.icon('arrow-left', { size: 14 }) + '</span></div>';
};

UIC.moduleTile = function (o) {
  const isDisabled = !!o.disabled;
  const cls = 'module-tile' + (isDisabled ? ' module-tile-disabled' : '');
  const onclick = isDisabled
    ? 'onclick="UIC.toast(\'' + (o.disabledMessage || 'هذا العنصر غير متاح حالياً') + '\', \'warning\')"'
    : 'onclick="' + (o.onOpen || '') + '"';
  const badge = o.badgeText
    ? '<span class="module-tile-badge">' + o.badgeText + '</span>'
    : '';
  return '<div class="' + cls + '" ' + onclick + '>' +
    badge +
    '<div class="module-tile-icon">' + (o.icon || '') + '</div>' +
    '<div class="module-tile-title">' + (o.title || '') + '</div>' +
    '<div class="module-tile-subtitle">' + (o.subtitle || '') + '</div>' +
    '</div>';
};

function buildCompanyNav_(currentAction) {
  const pages = (window.COMPANY_PAGES || []).filter(function (p) {
    return UIC.pageAuthorized_(p.action);
  });
  const scriptUrl = UIC.baseUrl();
  const token = UIC.token();
  return pages.map(function (p) {
    const isActive = p.action === currentAction;
    return {
      label: p.label || p.action,
      active: isActive,
      href: isActive ? '#' : scriptUrl + '?action=' + p.action + '&sessionToken=' + token
    };
  });
}

UIC.buildLogoMarkup = function (homeHref, companyLogoUrl, companyLogoHref, companyLogoTitle, lazy) {
  var lazyAttr = lazy ? ' loading="lazy" decoding="async"' : ' decoding="async"';
  var main = '<a class="app-logo app-logo-main" href="' + (homeHref || '#') + '" title="الرئيسية" onclick="UIC.navTo(event, this.getAttribute(\'href\'))">' +
    '<img src="' + (UIC.SYSTEM_LOGO_URL || '') + '" alt="الرئيسية" height="32" width="auto"' + lazyAttr + '></a>';
  var company = companyLogoUrl
    ? '<a class="app-logo app-logo-company" href="' + (companyLogoHref || '#') + '" title="' + (companyLogoTitle || '') + '" onclick="UIC.navTo(event, this.getAttribute(\'href\'))">' +
      '<img src="' + companyLogoUrl + '" alt="" height="40" width="auto"' + lazyAttr + '></a>'
    : '';
  return main + company;
};

/* ── [UI-4.1 / U-13] The control panel ────────────────────────────────────
 *
 * Odoo puts one bar between the chrome and the content: breadcrumb, search,
 * filters, and the primary action. This app had none — every list page
 * hand-typed its own breadcrumb string and put its "new record" button wherever
 * the author happened to place a right-aligned div, so the same control sat in
 * a different place on every screen.
 *
 * OPT-IN. UIC.appShell renders this only when a page passes `controlPanel`.
 * A page that passes nothing renders exactly as it does today — which is what
 * makes converting 53 list pages safe to do a few at a time, and lets any
 * awkward page be left behind indefinitely.
 *
 * opts:
 *   breadcrumb  string (rendered as-is, so today's hand-typed strings keep
 *               working) or an array of { label, href, action } segments
 *   title       optional heading shown under the breadcrumb
 *   search      { table: '<dataTable id>', placeholder }  — wires to the
 *               existing debounced search, so no new filtering code
 *   actions     array of UIC.button option objects — the primary action slot
 *   tools       array of raw markup strings, for page-specific dropdowns
 *   pager       { index, total, onPrev, onNext } — the record pager
 */
UIC.controlPanel = function (opts) {
  var o = opts || {};

  /* Breadcrumb. An array gets clickable segments; a string is emitted as-is so
     every page that already passes one keeps working unchanged. */
  var crumbs = '';
  if (Array.isArray(o.breadcrumb)) {
    crumbs = o.breadcrumb.map(function (c, i, arr) {
      var last = i === arr.length - 1;
      var label = UIC.escHtml(c.label || '');
      var href = c.href || (c.action
        ? UIC.baseUrl() + '?action=' + encodeURIComponent(c.action) + '&sessionToken=' + encodeURIComponent(UIC.token())
        : '');
      var seg = (last || !href)
        ? '<span class="cp-crumb cp-crumb-current"' + (last ? ' aria-current="page"' : '') + '>' + label + '</span>'
        : '<a class="cp-crumb" href="' + href + '" onclick="UIC.navTo(event, this.getAttribute(\'href\'))">' + label + '</a>';
      return seg + (last ? '' : '<span class="cp-sep" aria-hidden="true">' + UIC.icon('chevron-left', { size: 12 }) + '</span>');
    }).join('');
  } else if (o.breadcrumb) {
    crumbs = '<span class="cp-crumb cp-crumb-current">' + o.breadcrumb + '</span>';
  }

  var title = o.title ? '<h1 class="cp-title">' + UIC.escHtml(o.title) + '</h1>' : '';

  var search = '';
  if (o.search && o.search.table) {
    search = '<div class="cp-search">' +
      '<span class="cp-search-icon" aria-hidden="true">' + UIC.icon('search', { size: 16 }) + '</span>' +
      '<input type="search" class="input cp-search-input" ' +
      'aria-label="' + UIC.escHtml(o.search.placeholder || 'بحث') + '" ' +
      'placeholder="' + UIC.escHtml(o.search.placeholder || 'بحث…') + '" ' +
      'oninput="UIC._cpSearch(\'' + o.search.table + '\', this.value)">' +
      '<div class="cp-chips" id="cp-chips-' + o.search.table + '"></div>' +
      '</div>';
  }

  var tools = (o.tools || []).join('');

  var actions = (o.actions || []).map(function (b) { return UIC.button(b); }).join('');

  var pager = '';
  if (o.pager && o.pager.total) {
    pager = '<div class="cp-pager">' +
      '<button type="button" class="btn btn-outline cp-pager-btn" aria-label="السابق"' +
      (o.pager.onPrev ? ' onclick="' + o.pager.onPrev + '"' : ' disabled') + '>' +
      UIC.icon('chevron-right', { size: 16 }) + '</button>' +
      '<span class="cp-pager-count">' + (o.pager.index || 1) + ' / ' + o.pager.total + '</span>' +
      '<button type="button" class="btn btn-outline cp-pager-btn" aria-label="التالي"' +
      (o.pager.onNext ? ' onclick="' + o.pager.onNext + '"' : ' disabled') + '>' +
      UIC.icon('chevron-left', { size: 16 }) + '</button>' +
      '</div>';
  }

  return '<div class="control-panel">' +
    '<div class="cp-row cp-row-top">' +
      '<nav class="cp-breadcrumb" aria-label="مسار التنقل">' + crumbs + '</nav>' +
      pager +
    '</div>' +
    (title || search || tools || actions
      ? '<div class="cp-row cp-row-main">' +
          '<div class="cp-lead">' + title + '</div>' +
          '<div class="cp-controls">' + search + tools + '</div>' +
          '<div class="cp-actions">' + actions + '</div>' +
        '</div>'
      : '') +
    '</div>';
};

/* Search box -> the table's existing debounced filter, plus a removable chip so
 * the user can see what is currently narrowing the list. No new filter code:
 * this calls straight into UIC._dtSearchInput. */
UIC._cpSearch = function (tableId, term) {
  UIC._dtSearchInput(tableId, term);
  var box = document.getElementById('cp-chips-' + tableId);
  if (!box) return;
  var t = String(term || '').trim();
  box.innerHTML = t
    ? '<span class="cp-chip">' + UIC.escHtml(t) +

      'onclick="UIC._cpClearSearch(\'' + tableId + '\')">' + UIC.icon('close', { size: 12 }) + '</button></span>'

UIC._cpClearSearch = function (tableId) {

UIC.appShell = function (containerId, o) {
  const opts = o || {};
  const navItems = opts.nav || buildCompanyNav_(window.CURRENT_ACTION);

  /* Build nav links for BOTH the topbar (desktop) and the mobile drawer */
  const navLinkHtml = function (extraClass) {
    return navItems.map(n =>
      '<a class="nav-item' + (n.active ? ' active' : '') + (extraClass ? ' ' + extraClass : '') + '" href="' + (n.href || '#') + '"' +
      (n.onclick ? ' onclick="' + n.onclick + '"' :
        (n.href && n.href !== '#' ? ' onclick="UIC.navTo(event, this.getAttribute(\'href\'))"' : '')) +
      '>' + (n.label || '') + '</a>'
    ).join('');
  };

  const menuGroupsHtml = function (drawerMode) {
    return (opts.menuGroups || []).map(function (g, gi) {
      const items = (g.items || []).filter(function (it) {
        return !(typeof it === 'object' && it.action && !UIC.pageAuthorized_(it.action));
      }).map(function (it) {
        const isObj = typeof it === 'object';
        if (isObj && it.action) {
          const label = it.label || it.action;
          const href = UIC.baseUrl() + '?action=' + encodeURIComponent(it.action) + '&sessionToken=' + encodeURIComponent(UIC.token());
          const active = it.action === window.CURRENT_ACTION ? ' nav-dropdown-item-active' : '';
          return '<a class="nav-dropdown-item' + active + '" href="' + href + '" onclick="UIC.navTo(event, this.getAttribute(\'href\'))">' + label + '</a>';
        }
        return '';
      }).join('');
      if (!items) return ''; /* whole group unauthorized — hide its header too */
      if (drawerMode) {
        /* In drawer: render as flat section header + items (no dropdown) */
        return '<div class="drawer-group"><div class="drawer-group-label">' + (g.label || '') + '</div>' + items + '</div>';
      }
      return '<div class="nav-dropdown">' +
        '<button type="button" class="nav-dropdown-toggle" onclick="UIC.toggleDropdown(\'nav-dd-' + gi + '\', event)">' +
        (g.label || '') + ' <span class="nav-dropdown-caret">' + UIC.icon('chevron-down', { size: 14 }) + '</span></button>' +
        '<div class="nav-dropdown-menu" id="nav-dd-' + gi + '">' + items + '</div>' +
        '</div>';
    }).join('');
  };

  const homeHref = UIC.baseUrl() + '?action=ERPDashboard&sessionToken=' + encodeURIComponent(UIC.token());
  const logoTop = UIC.buildLogoMarkup(homeHref, opts.companyLogoUrl, opts.companyLogoHref, opts.companyLogoTitle, false);
  const logoDrawer = UIC.buildLogoMarkup(homeHref, opts.companyLogoUrl, opts.companyLogoHref, opts.companyLogoTitle, true);

  const sessUser = (window.API && API.getSession) ? (API.getSession() || {}) : {};
  const userName = opts.userName || ((sessUser.user && sessUser.user.name) ? sessUser.user.name : '');
  const userEmail = (sessUser.user && sessUser.user.email) ? sessUser.user.email : '';
  const escH = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  };
  const userBlock = '<div class="user-block">' +
    '<span class="user-name">' + escH(userName) + '</span>' +
    '<button class="user-logout" onclick="logout()">خروج</button>' +
    '</div>';
  /* User-profile dropdown (topbar): avatar + name button; menu holds the
   * identity header, جلساتي / عروضي links and logout. Reuses .nav-dropdown
   * mechanics (single-open + outside-click close via UIC.toggleDropdown). */
  const avatarLetter = escH((userName || userEmail || '?').trim().charAt(0));
  const userProfileBlock =
    '<div class="nav-dropdown user-profile">' +
      '<button type="button" class="nav-dropdown-toggle user-profile-toggle" onclick="UIC.toggleDropdown(\'nav-user-menu\', event)" aria-label="حسابي" aria-haspopup="true">' +
        '<span class="user-avatar">' + avatarLetter + '</span>' +
        '<span class="user-name">' + escH(userName || userEmail) + '</span>' +
        ' <span class="nav-dropdown-caret">' + UIC.icon('chevron-down', { size: 14 }) + '</span>' +
      '</button>' +
      '<div class="nav-dropdown-menu user-profile-menu" id="nav-user-menu">' +
        '<div class="user-profile-head">' +
          '<span class="user-avatar user-avatar-lg">' + avatarLetter + '</span>' +
          '<div class="user-profile-id"><div class="user-profile-name">' + escH(userName || userEmail) + '</div>' +
          (userEmail ? '<div class="user-profile-email">' + escH(userEmail) + '</div>' : '') + '</div>' +
        '</div>' +
        '<a class="nav-dropdown-item" href="#" onclick="SESSION.openSessions();return false;">' + UIC.icon('user') + '<span>جلساتي</span></a>' +
        '<a class="nav-dropdown-item" href="#" onclick="SESSION.openViews();return false;">' + UIC.icon('settings') + '<span>عروضي</span></a>' +
        /* [UI-8.3 / U-41] Preferences, reachable from the one menu that is on
           every page. */
        '<a class="nav-dropdown-item" href="#" onclick="UIC.openPreferences();return false;">' + UIC.icon('eye') + '<span>التفضيلات</span></a>' +
        '<div class="user-profile-divider"></div>' +
        '<a class="nav-dropdown-item user-profile-logout" href="#" onclick="logout();return false;">' + UIC.icon('logout') + '<span>تسجيل الخروج</span></a>' +
      '</div>' +
    '</div>';

  /* Hamburger button — visible only on mobile */
  const hamburger = '<button class="topbar-hamburger" aria-label="القائمة" aria-expanded="false" onclick="UIC.openDrawer()">' +
    '<span class="hamburger-bar"></span><span class="hamburger-bar"></span><span class="hamburger-bar"></span>' +
    '</button>';

  /* Mobile slide-out drawer is built inside the try below (it executes nav
   * builders that could throw on unexpected input). */
  /* [UI-6.5 / U-33] A skip link, first in the tab order. Without it a keyboard
   * user tabs through the hamburger, both logos, every nav item and every
   * dropdown before reaching the page content — on every single navigation. */
  const skipLink = '<a class="skip-link" href="#' + (opts.contentId || 'app-content') + '">' +
    'تخطي إلى المحتوى</a>';

  let html;
  try {
    const drawerHtml =
      '<div class="drawer-overlay" id="uic-drawer-overlay" onclick="UIC.closeDrawer()" aria-hidden="true"></div>' +
      '<nav class="mobile-drawer" id="uic-drawer" aria-label="القائمة الرئيسية">' +
        '<div class="drawer-header">' + logoDrawer +
          '<button class="drawer-close" aria-label="إغلاق القائمة" onclick="UIC.closeDrawer()">' + UIC.icon('close', { size: 18 }) + '</button>' +
        '</div>' +
        '<div class="drawer-nav">' +
          navLinkHtml('drawer-nav-item') +
          menuGroupsHtml(true) +
        '</div>' +
        '<div class="drawer-footer">' + (opts.userHtml || userBlock) + '</div>' +
      '</nav>';
    html = skipLink +
      '<header class="topbar">' +
        '<div class="topbar-left">' + hamburger + logoTop + '</div>' +
        '<nav class="topbar-nav" aria-label="التنقل الرئيسي">' + navLinkHtml() + menuGroupsHtml(false) + '</nav>' +
        '<div class="topbar-right">' + (opts.userHtml || userProfileBlock) + '</div>' +
      '</header>' +
      drawerHtml +
      /* [UI-4.1 / U-13] The control panel replaces the plain breadcrumb strip
         when a page opts in. A page passing only `breadcrumb` still gets the
         old strip, byte for byte, so nothing has to be converted at once. */
      (opts.controlPanel
        ? UIC.controlPanel(Object.assign(
            { breadcrumb: opts.breadcrumb }, opts.controlPanel))
        : (opts.breadcrumb ? '<div class="breadcrumb">' + opts.breadcrumb + '</div>' : '')) +
      '<main class="app-content" id="' + (opts.contentId || 'app-content') + '"></main>';
  } catch (shellErr) {
    /* Never blank the page: emit at least the content container so the page's
     * own render can populate it. Surface the error for diagnosis. */
    html = '<main class="app-content" id="' + (opts.contentId || 'app-content') + '"></main>';
    try { console.error('appShell build failed: ' + (shellErr && shellErr.message)); if (window.UIC && UIC.reportError) UIC.reportError('appShell build failed: ' + (shellErr && shellErr.message)); } catch (e) {}
  }

  const el = document.getElementById(containerId);
  if (el) el.innerHTML = html;

  /* Initialise drawer swipe-to-close after render */
  try { UIC._initDrawerSwipe(); } catch (e) {}

  return opts.contentId || 'app-content';
};

/* ── [UI-8.3 / U-41] User preferences ─────────────────────────────────────
 *
 * There were none at all — no theme choice, no density, nothing remembered.
 *
 * Everything here lives in localStorage. NO SCHEMA CHANGE: hard constraint 1
 * forbids adding a column, and these are per-device display choices anyway —
 * someone using the app on a phone in the warehouse and on a desktop in the
 * office genuinely may want different densities.
 *
 * Applied as early as possible, before first paint where the browser allows it,
 * so a dark-mode user does not get a white flash on every navigation.
 */
UIC.PREFS_KEY = 'erp_prefs';

UIC.getPrefs = function () {
  try {
    var raw = localStorage.getItem(UIC.PREFS_KEY);
    return raw ? (JSON.parse(raw) || {}) : {};
  } catch (e) { return {}; }
};

UIC.setPref = function (key, value) {
  var p = UIC.getPrefs();
  if (value == null || value === '') delete p[key]; else p[key] = value;
  try { localStorage.setItem(UIC.PREFS_KEY, JSON.stringify(p)); } catch (e) {}
  UIC.applyPrefs();
  return p;
};

UIC.applyPrefs = function () {
  var p = UIC.getPrefs();
  var root = document.documentElement;
  if (!root) return;
  /* Absent means "follow the operating system", which is why the attribute is
     REMOVED rather than set to a third value: the CSS guard is written around
     the attribute being missing. */
  if (p.theme === 'dark' || p.theme === 'light') root.setAttribute('data-theme', p.theme);
  else root.removeAttribute('data-theme');
  if (p.density === 'compact') root.setAttribute('data-density', 'compact');
  else root.removeAttribute('data-density');
};

/* Run immediately, not on DOMContentLoaded: this file is included in <head>,
   so setting the attribute here happens before the body is painted. */
try { UIC.applyPrefs(); } catch (e) {}

UIC.openPreferences = function () {
  var p = UIC.getPrefs();
  var radio = function (name, value, label, current) {
    var id = 'pref-' + name + '-' + value;
    return '<label class="pref-choice" for="' + id + '">' +
      '<input type="radio" id="' + id + '" name="pref-' + name + '" value="' + value + '"' +
      (String(current || '') === value || (!current && value === 'system') || (!current && value === 'comfortable') ? ' checked' : '') +
      ' onchange="UIC.setPref(\'' + name + '\', this.value === \'system\' || this.value === \'comfortable\' ? null : this.value)">' +
      '<span>' + label + '</span></label>';
  };
  UIC.openModal('uic-prefs', {
    title: 'التفضيلات',
    size: 'sm',
    footer: UIC.button({ text: 'تم', onClick: "UIC.closeModal('uic-prefs')" }),
    body:
      '<div class="pref-group"><div class="pref-label">المظهر</div>' +
        radio('theme', 'system', 'حسب النظام', p.theme) +
        radio('theme', 'light', 'فاتح', p.theme) +
        radio('theme', 'dark', 'داكن', p.theme) +
      '</div>' +
      '<div class="pref-group"><div class="pref-label">كثافة العرض</div>' +
        radio('density', 'comfortable', 'مريح', p.density) +
        radio('density', 'compact', 'مضغوط', p.density) +
      '</div>' +
      '<p class="pref-note">تُحفظ هذه التفضيلات على هذا الجهاز فقط.</p>'
  });
};

UIC.toggleDropdown = function (id, event) {
  if (event) { event.preventDefault(); event.stopPropagation(); }
  const target = document.getElementById(id);
  if (!target) return;
  const isOpen = target.classList.contains('open');
  document.querySelectorAll('.nav-dropdown-menu').forEach(function (m) { m.classList.remove('open'); });
  document.querySelectorAll('.nav-dropdown-toggle').forEach(function (b) { b.classList.remove('open'); });
  if (!isOpen) {
    target.classList.add('open');
    const btn = target.parentNode ? target.parentNode.querySelector('.nav-dropdown-toggle') : null;
    if (btn) btn.classList.add('open');
  }
};

document.addEventListener('click', function (event) {
  const dd = event.target && event.target.closest ? event.target.closest('.nav-dropdown') : null;
  if (!dd) {
    document.querySelectorAll('.nav-dropdown-menu').forEach(function (m) { m.classList.remove('open'); });
    document.querySelectorAll('.nav-dropdown-toggle').forEach(function (b) { b.classList.remove('open'); });
  }
});

UIC.openDrawer = function () {
  const drawer  = document.getElementById('uic-drawer');
  const overlay = document.getElementById('uic-drawer-overlay');
  const ham     = document.querySelector('.topbar-hamburger');
  if (!drawer) return;
  drawer.classList.add('is-open');
  UIC._syncHomeFabForDrawer(true);
  if (overlay) overlay.classList.add('is-open');
  if (ham) ham.setAttribute('aria-expanded', 'true');
  document.body.style.overflow = 'hidden'; // prevent body scroll behind drawer
};

UIC.closeDrawer = function () {
  const drawer  = document.getElementById('uic-drawer');
  const overlay = document.getElementById('uic-drawer-overlay');
  const ham     = document.querySelector('.topbar-hamburger');
  if (!drawer) return;
  drawer.classList.remove('is-open');
  UIC._syncHomeFabForDrawer(false);
  if (overlay) overlay.classList.remove('is-open');
  if (ham) ham.setAttribute('aria-expanded', 'false');
  document.body.style.overflow = '';
};

UIC._initDrawerSwipe = function () {
  const drawer = document.getElementById('uic-drawer');
  if (!drawer) return;
  let startX = 0;
  let dragging = false;
  drawer.addEventListener('touchstart', function (e) {
    startX = e.touches[0].clientX;
    dragging = true;
  }, { passive: true });
  drawer.addEventListener('touchmove', function (e) {
    if (!dragging) return;
    const dx = e.touches[0].clientX - startX;
    /* Only track swipe in the closing direction (right for RTL drawer = left for LTR) */
    if (dx < -10) {
      drawer.style.transform = 'translateX(' + dx + 'px)';
      drawer.style.transition = 'none';
    }
  }, { passive: true });
  drawer.addEventListener('touchend', function (e) {
    if (!dragging) return;
    dragging = false;
    drawer.style.transform = '';
    drawer.style.transition = '';
    const dx = e.changedTouches[0].clientX - startX;
    if (dx < -60) UIC.closeDrawer();
  }, { passive: true });
};

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') UIC.closeDrawer();
});

/* ── [UI-6.5 / U-33] Application keyboard shortcuts ───────────────────────
 *
 * Alt+S saves, Alt+N creates. Alt is used rather than Ctrl because Ctrl+S and
 * Ctrl+N belong to the browser, and a shortcut that fights the browser is a
 * shortcut people learn not to press.
 *
 * Both are OPT-IN per page: a page registers what they should do. A shortcut
 * wired by guessing at the first button on the page would eventually press the
 * wrong one, and on a save path that is unacceptable.
 */
UIC.shortcuts = { save: null, create: null };

UIC.registerShortcuts = function (map) {
  UIC.shortcuts.save = (map && map.save) || null;
  UIC.shortcuts.create = (map && map.create) || null;
};

document.addEventListener('keydown', function (e) {
  if (!e.altKey || e.ctrlKey || e.metaKey) return;
  var k = String(e.key || '').toLowerCase();
  var fn = null;
  if (k === 's') fn = UIC.shortcuts.save;
  else if (k === 'n') fn = UIC.shortcuts.create;
  if (typeof fn !== 'function') return;
  /* Never fire while a dialog is open: the dialog owns the keyboard. */
  if (document.body.classList.contains('modal-open')) return;
  e.preventDefault();
  try { fn(); } catch (err) {}
});
