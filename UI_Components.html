      (b.icon ? '<span class="smart-btn-icon">' + UIC.icon(b.icon, { size: 18 }) + '</span>' : '') +
      '<span class="smart-btn-count">' + UIC.escHtml(String(b.count)) + '</span>' +
      '<span class="smart-btn-label">' + UIC.escHtml(String(b.label)) + '</span>' +
      '</button>';
  }).join('') + '</div>';
};

/* ── [UI-5.6 / U-29] Notebook tabs ────────────────────────────────────────
 *
 * Four pages hand-rolled their own tab strip, none with keyboard support and
 * none with a role. This is one component with the ARIA tab pattern: arrow keys
 * move between tabs, Home/End jump to the ends, and only the active tab is in
 * the tab order.
 */
UIC.notebook = function (id, tabs, activeKey) {
  var list = tabs || [];
  var active = activeKey || (list[0] && list[0].key);
  var heads = list.map(function (t) {
    var on = String(t.key) === String(active);
    return '<button type="button" role="tab" id="' + id + '-tab-' + t.key + '"' +
      ' aria-selected="' + on + '" aria-controls="' + id + '-panel-' + t.key + '"' +
      ' tabindex="' + (on ? '0' : '-1') + '" class="nb-tab' + (on ? ' nb-tab-active' : '') + '"' +
      ' onclick="UIC.notebookSelect(\'' + id + '\', \'' + UIC.escHtml(String(t.key)) + '\')"' +
      ' onkeydown="UIC._notebookKey(\'' + id + '\', event)">' +
      (t.icon ? UIC.icon(t.icon, { size: 15 }) : '') +
      '<span>' + UIC.escHtml(String(t.label)) + '</span>' +
      (t.badge != null ? '<span class="nb-badge">' + UIC.escHtml(String(t.badge)) + '</span>' : '') +
      '</button>';
  }).join('');
  var panels = list.map(function (t) {
    var on = String(t.key) === String(active);
    return '<div role="tabpanel" id="' + id + '-panel-' + t.key + '"' +
      ' aria-labelledby="' + id + '-tab-' + t.key + '" class="nb-panel"' +
      (on ? '' : ' hidden') + '>' + (t.content || '') + '</div>';
  }).join('');
  window.__notebooks = window.__notebooks || {};
  window.__notebooks[id] = list.map(function (t) { return String(t.key); });
  return '<div class="notebook" id="' + id + '">' +
    '<div class="nb-tabs" role="tablist">' + heads + '</div>' + panels + '</div>';
};

UIC.notebookSelect = function (id, key) {
  var keys = (window.__notebooks || {})[id] || [];
  keys.forEach(function (k) {
    var tab = document.getElementById(id + '-tab-' + k);
    var panel = document.getElementById(id + '-panel-' + k);
    var on = String(k) === String(key);
    if (tab) {
      tab.setAttribute('aria-selected', String(on));
      tab.setAttribute('tabindex', on ? '0' : '-1');
      tab.classList.toggle('nb-tab-active', on);
    }
    if (panel) panel.hidden = !on;
  });
};

UIC._notebookKey = function (id, ev) {
  var keys = (window.__notebooks || {})[id] || [];
  if (!keys.length) return;
  var cur = -1;
  keys.forEach(function (k, i) {
    var t = document.getElementById(id + '-tab-' + k);
    if (t && t.getAttribute('aria-selected') === 'true') cur = i;
  });
  var next = null;
  /* RTL: ArrowLeft advances, ArrowRight goes back. */
  var rtl = (document.documentElement.getAttribute('dir') || '') === 'rtl';
  if (ev.key === 'ArrowRight') next = rtl ? cur - 1 : cur + 1;
  else if (ev.key === 'ArrowLeft') next = rtl ? cur + 1 : cur - 1;
  else if (ev.key === 'Home') next = 0;
  else if (ev.key === 'End') next = keys.length - 1;
  else return;
  ev.preventDefault();
  next = (next + keys.length) % keys.length;
  UIC.notebookSelect(id, keys[next]);
  var el = document.getElementById(id + '-tab-' + keys[next]);
  if (el && el.focus) el.focus();
};

/* ── [UI-9.2 / U-37] Chart defaults, read from the theme ──────────────────
 *
 * Every chart in the app hardcoded #111111 for its text and carried its own
 * 9-colour palette, so charts did not follow the company theme and — after
 * Phase 8 — would have been black-on-black in dark mode.
 *
 * UIC.applyChartDefaults reads the ACTUAL computed token values, so it is
 * correct under all three companies, both themes, and any company colour added
 * later, with no per-chart configuration.
 *
 * The categorical palette is NOT taken from the theme: a series colour has to
 * stay distinguishable from its neighbours, which a single brand hue cannot do.
 * It is a fixed, ordered set chosen to stay separable in both light and dark.
 */
UIC.cssVar = function (name, fallback) {
  try {
    var v = getComputedStyle(document.documentElement).getPropertyValue(name);
    v = String(v || '').trim();
    return v || fallback;
  } catch (e) { return fallback; }
};

UIC.CHART_PALETTE = [
  '#2563eb', '#16a34a', '#d97706', '#dc2626', '#7c3aed',
  '#0891b2', '#c2410c', '#4d7c0f', '#be185d', '#475569'
];

UIC.applyChartDefaults = function () {
  if (typeof Chart === 'undefined') return false;
  try {
    var ink    = UIC.cssVar('--text-main', '#111827');
    var muted  = UIC.cssVar('--text-muted', '#5b6572');
    var border = UIC.cssVar('--border-color', '#e2e5ea');
    var surface = UIC.cssVar('--bg-surface', '#ffffff');
    var font   = UIC.cssVar('--font-sans', "'Cairo', sans-serif");

    Chart.defaults.color = muted;
    Chart.defaults.borderColor = border;
    Chart.defaults.font.family = font;
    Chart.defaults.font.size = 12;
    Chart.defaults.plugins.legend.labels.color = ink;
    Chart.defaults.plugins.tooltip.backgroundColor = ink;
    Chart.defaults.plugins.tooltip.titleColor = surface;
    Chart.defaults.plugins.tooltip.bodyColor = surface;
    /* RTL: the legend and tooltips read right to left like everything else. */
    Chart.defaults.plugins.legend.rtl = true;
    Chart.defaults.plugins.tooltip.rtl = true;
    Chart.defaults.plugins.legend.textDirection = 'rtl';
    /* A chart that animates on every render is noise in a dashboard someone
       refreshes all day, and it is a real problem for anyone motion-sensitive. */
    try {
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        Chart.defaults.animation = false;
      }
    } catch (e) {}
    return true;
  } catch (e) { return false; }
};

/** Colour n series from the categorical palette, wrapping if there are more. */
UIC.chartColors = function (n) {
  var out = [];
  for (var i = 0; i < (n || 0); i++) out.push(UIC.CHART_PALETTE[i % UIC.CHART_PALETTE.length]);
  return out;
};

UIC.statCard = function (o) {

UIC.companyTile = function (o) {

UIC.moduleTile = function (o) {

function buildCompanyNav_(currentAction) {
  const pages = (window.COMPANY_PAGES || []).filter(function (p) {
    return UIC.pageAuthorized_(p.action);
  });
  const scriptUrl = UIC.baseUrl();
  const token = UIC.token();
  return pages.map(function (p) {
    const isActive = p.action === currentAction;
    return {
      label: p.label || p.action,
      active: isActive,
      href: isActive ? '#' : scriptUrl + '?action=' + p.action + '&sessionToken=' + token
    };
  });
}

UIC.buildLogoMarkup = function (homeHref, companyLogoUrl, companyLogoHref, companyLogoTitle, lazy) {
  var lazyAttr = lazy ? ' loading="lazy" decoding="async"' : ' decoding="async"';
  var main = '<a class="app-logo app-logo-main" href="' + (homeHref || '#') + '" title="الرئيسية" onclick="UIC.navTo(event, this.getAttribute(\'href\'))">' +
    '<img src="' + (UIC.SYSTEM_LOGO_URL || '') + '" alt="الرئيسية" height="32" width="auto"' + lazyAttr + '></a>';
  var company = companyLogoUrl
    ? '<a class="app-logo app-logo-company" href="' + (companyLogoHref || '#') + '" title="' + (companyLogoTitle || '') + '" onclick="UIC.navTo(event, this.getAttribute(\'href\'))">' +
      '<img src="' + companyLogoUrl + '" alt="" height="40" width="auto"' + lazyAttr + '></a>'
    : '';
  return main + company;
};

/* ── [UI-4.1 / U-13] The control panel ────────────────────────────────────
 *
 * Odoo puts one bar between the chrome and the content: breadcrumb, search,
 * filters, and the primary action. This app had none — every list page
 * hand-typed its own breadcrumb string and put its "new record" button wherever
 * the author happened to place a right-aligned div, so the same control sat in
 * a different place on every screen.
 *
 * OPT-IN. UIC.appShell renders this only when a page passes `controlPanel`.
 * A page that passes nothing renders exactly as it does today — which is what
 * makes converting 53 list pages safe to do a few at a time, and lets any
 * awkward page be left behind indefinitely.
 *
 * opts:
 *   breadcrumb  string (rendered as-is, so today's hand-typed strings keep
 *               working) or an array of { label, href, action } segments
 *   title       optional heading shown under the breadcrumb
 *   search      { table: '<dataTable id>', placeholder }  — wires to the
 *               existing debounced search, so no new filtering code
 *   actions     array of UIC.button option objects — the primary action slot
 *   tools       array of raw markup strings, for page-specific dropdowns
 *   pager       { index, total, onPrev, onNext } — the record pager
 */
UIC.controlPanel = function (opts) {
  var o = opts || {};

  /* Breadcrumb. An array gets clickable segments; a string is emitted as-is so
     every page that already passes one keeps working unchanged. */
  var crumbs = '';
  if (Array.isArray(o.breadcrumb)) {
    crumbs = o.breadcrumb.map(function (c, i, arr) {
      var last = i === arr.length - 1;
      var label = UIC.escHtml(c.label || '');
      var href = c.href || (c.action
        ? UIC.baseUrl() + '?action=' + encodeURIComponent(c.action) + '&sessionToken=' + encodeURIComponent(UIC.token())
        : '');
      var seg = (last || !href)
        ? '<span class="cp-crumb cp-crumb-current"' + (last ? ' aria-current="page"' : '') + '>' + label + '</span>'
        : '<a class="cp-crumb" href="' + href + '" onclick="UIC.navTo(event, this.getAttribute(\'href\'))">' + label + '</a>';
      return seg + (last ? '' : '<span class="cp-sep" aria-hidden="true">' + UIC.icon('chevron-left', { size: 12 }) + '</span>');
    }).join('');
  } else if (o.breadcrumb) {
    crumbs = '<span class="cp-crumb cp-crumb-current">' + o.breadcrumb + '</span>';
  }

  var title = o.title ? '<h1 class="cp-title">' + UIC.escHtml(o.title) + '</h1>' : '';

  var search = '';
  if (o.search && o.search.table) {
    search = '<div class="cp-search">' +
      '<span class="cp-search-icon" aria-hidden="true">' + UIC.icon('search', { size: 16 }) + '</span>' +
      '<input type="search" class="input cp-search-input" ' +
      'aria-label="' + UIC.escHtml(o.search.placeholder || 'بحث') + '" ' +
      'placeholder="' + UIC.escHtml(o.search.placeholder || 'بحث…') + '" ' +
      'oninput="UIC._cpSearch(\'' + o.search.table + '\', this.value)">' +
      '<div class="cp-chips" id="cp-chips-' + o.search.table + '"></div>' +
      '</div>';
  }

  var tools = (o.tools || []).join('');

  var actions = (o.actions || []).map(function (b) { return UIC.button(b); }).join('');

  var pager = '';
  if (o.pager && o.pager.total) {
    pager = '<div class="cp-pager">' +
      '<button type="button" class="btn btn-outline cp-pager-btn" aria-label="السابق"' +
      (o.pager.onPrev ? ' onclick="' + o.pager.onPrev + '"' : ' disabled') + '>' +
      UIC.icon('chevron-right', { size: 16 }) + '</button>' +
      '<span class="cp-pager-count">' + (o.pager.index || 1) + ' / ' + o.pager.total + '</span>' +
      '<button type="button" class="btn btn-outline cp-pager-btn" aria-label="التالي"' +
      (o.pager.onNext ? ' onclick="' + o.pager.onNext + '"' : ' disabled') + '>' +
      UIC.icon('chevron-left', { size: 16 }) + '</button>' +
      '</div>';
  }

  return '<div class="control-panel">' +
    '<div class="cp-row cp-row-top">' +
      '<nav class="cp-breadcrumb" aria-label="مسار التنقل">' + crumbs + '</nav>' +
      pager +
    '</div>' +
    (title || search || tools || actions
      ? '<div class="cp-row cp-row-main">' +
          '<div class="cp-lead">' + title + '</div>' +
          '<div class="cp-controls">' + search + tools + '</div>' +
          '<div class="cp-actions">' + actions + '</div>' +
        '</div>'
      : '') +
    '</div>';
};

/* Search box -> the table's existing debounced filter, plus a removable chip so
 * the user can see what is currently narrowing the list. No new filter code:
 * this calls straight into UIC._dtSearchInput. */
UIC._cpSearch = function (tableId, term) {
  UIC._dtSearchInput(tableId, term);
  var box = document.getElementById('cp-chips-' + tableId);
  if (!box) return;
  var t = String(term || '').trim();
  box.innerHTML = t
    ? '<span class="cp-chip">' + UIC.escHtml(t) +
      '<button type="button" class="cp-chip-x" aria-label="إزالة عامل التصفية" ' +
      'onclick="UIC._cpClearSearch(\'' + tableId + '\')">' + UIC.icon('close', { size: 12 }) + '</button></span>'
    : '';
};

UIC._cpClearSearch = function (tableId) {
  var panel = document.querySelector('.control-panel');
  var input = panel ? panel.querySelector('.cp-search-input') : null;
  if (input) input.value = '';
  UIC._cpSearch(tableId, '');
};

UIC.appShell = function (containerId, o) {
  const opts = o || {};
  const navItems = opts.nav || buildCompanyNav_(window.CURRENT_ACTION);

  /* Build nav links for BOTH the topbar (desktop) and the mobile drawer */
  const navLinkHtml = function (extraClass) {
    return navItems.map(n =>
      '<a class="nav-item' + (n.active ? ' active' : '') + (extraClass ? ' ' + extraClass : '') + '" href="' + (n.href || '#') + '"' +
      (n.onclick ? ' onclick="' + n.onclick + '"' :
        (n.href && n.href !== '#' ? ' onclick="UIC.navTo(event, this.getAttribute(\'href\'))"' : '')) +
      '>' + (n.label || '') + '</a>'
    ).join('');
  };

  const menuGroupsHtml = function (drawerMode) {
    return (opts.menuGroups || []).map(function (g, gi) {
      const items = (g.items || []).filter(function (it) {
        return !(typeof it === 'object' && it.action && !UIC.pageAuthorized_(it.action));
      }).map(function (it) {
        const isObj = typeof it === 'object';
        if (isObj && it.action) {
          const label = it.label || it.action;
          const href = UIC.baseUrl() + '?action=' + encodeURIComponent(it.action) + '&sessionToken=' + encodeURIComponent(UIC.token());
          const active = it.action === window.CURRENT_ACTION ? ' nav-dropdown-item-active' : '';
          return '<a class="nav-dropdown-item' + active + '" href="' + href + '" onclick="UIC.navTo(event, this.getAttribute(\'href\'))">' + label + '</a>';
        }
        return '';
      }).join('');
      if (!items) return ''; /* whole group unauthorized — hide its header too */
      if (drawerMode) {
        /* In drawer: render as flat section header + items (no dropdown) */
        return '<div class="drawer-group"><div class="drawer-group-label">' + (g.label || '') + '</div>' + items + '</div>';
      }
      return '<div class="nav-dropdown">' +
        '<button type="button" class="nav-dropdown-toggle" onclick="UIC.toggleDropdown(\'nav-dd-' + gi + '\', event)">' +
        (g.label || '') + ' <span class="nav-dropdown-caret">' + UIC.icon('chevron-down', { size: 14 }) + '</span></button>' +
        '<div class="nav-dropdown-menu" id="nav-dd-' + gi + '">' + items + '</div>' +
        '</div>';
    }).join('');
  };

  const homeHref = UIC.baseUrl() + '?action=ERPDashboard&sessionToken=' + encodeURIComponent(UIC.token());
  const logoTop = UIC.buildLogoMarkup(homeHref, opts.companyLogoUrl, opts.companyLogoHref, opts.companyLogoTitle, false);
  const logoDrawer = UIC.buildLogoMarkup(homeHref, opts.companyLogoUrl, opts.companyLogoHref, opts.companyLogoTitle, true);

  const sessUser = (window.API && API.getSession) ? (API.getSession() || {}) : {};
  const userName = opts.userName || ((sessUser.user && sessUser.user.name) ? sessUser.user.name : '');
  const userEmail = (sessUser.user && sessUser.user.email) ? sessUser.user.email : '';
  const escH = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  };
  const userBlock = '<div class="user-block">' +
    '<span class="user-name">' + escH(userName) + '</span>' +
    '<button class="user-logout" onclick="logout()">خروج</button>' +
    '</div>';
  /* User-profile dropdown (topbar): avatar + name button; menu holds the
   * identity header, جلساتي / عروضي links and logout. Reuses .nav-dropdown
   * mechanics (single-open + outside-click close via UIC.toggleDropdown). */
  const avatarLetter = escH((userName || userEmail || '?').trim().charAt(0));
  const userProfileBlock =
    '<div class="nav-dropdown user-profile">' +
      '<button type="button" class="nav-dropdown-toggle user-profile-toggle" onclick="UIC.toggleDropdown(\'nav-user-menu\', event)" aria-label="حسابي" aria-haspopup="true">' +
        '<span class="user-avatar">' + avatarLetter + '</span>' +
        '<span class="user-name">' + escH(userName || userEmail) + '</span>' +
        ' <span class="nav-dropdown-caret">' + UIC.icon('chevron-down', { size: 14 }) + '</span>' +
      '</button>' +
      '<div class="nav-dropdown-menu user-profile-menu" id="nav-user-menu">' +
        '<div class="user-profile-head">' +
          '<span class="user-avatar user-avatar-lg">' + avatarLetter + '</span>' +
          '<div class="user-profile-id"><div class="user-profile-name">' + escH(userName || userEmail) + '</div>' +
          (userEmail ? '<div class="user-profile-email">' + escH(userEmail) + '</div>' : '') + '</div>' +
        '</div>' +
        '<a class="nav-dropdown-item" href="#" onclick="SESSION.openSessions();return false;">' + UIC.icon('user') + '<span>جلساتي</span></a>' +
        '<a class="nav-dropdown-item" href="#" onclick="SESSION.openViews();return false;">' + UIC.icon('settings') + '<span>عروضي</span></a>' +
        /* [UI-8.3 / U-41] Preferences, reachable from the one menu that is on
           every page. */
        '<a class="nav-dropdown-item" href="#" onclick="UIC.openPreferences();return false;">' + UIC.icon('eye') + '<span>التفضيلات</span></a>' +
        '<div class="user-profile-divider"></div>' +
        '<a class="nav-dropdown-item user-profile-logout" href="#" onclick="logout();return false;">' + UIC.icon('logout') + '<span>تسجيل الخروج</span></a>' +
      '</div>' +
    '</div>';

  /* Hamburger button — visible only on mobile */
  const hamburger = '<button class="topbar-hamburger" aria-label="القائمة" aria-expanded="false" onclick="UIC.openDrawer()">' +
    '<span class="hamburger-bar"></span><span class="hamburger-bar"></span><span class="hamburger-bar"></span>' +
    '</button>';

  /* Mobile slide-out drawer is built inside the try below (it executes nav
   * builders that could throw on unexpected input). */
  /* [UI-6.5 / U-33] A skip link, first in the tab order. Without it a keyboard
   * user tabs through the hamburger, both logos, every nav item and every
   * dropdown before reaching the page content — on every single navigation. */
  const skipLink = '<a class="skip-link" href="#' + (opts.contentId || 'app-content') + '">' +
    'تخطي إلى المحتوى</a>';

  let html;
  try {
    const drawerHtml =

/* ── [UI-8.3 / U-41] User preferences ─────────────────────────────────────
 *
 * There were none at all — no theme choice, no density, nothing remembered.
 *
 * Everything here lives in localStorage. NO SCHEMA CHANGE: hard constraint 1
 * forbids adding a column, and these are per-device display choices anyway —
 * someone using the app on a phone in the warehouse and on a desktop in the
 * office genuinely may want different densities.
 *
 * Applied as early as possible, before first paint where the browser allows it,
 * so a dark-mode user does not get a white flash on every navigation.
 */
UIC.PREFS_KEY = 'erp_prefs';

UIC.getPrefs = function () {
  try {
    var raw = localStorage.getItem(UIC.PREFS_KEY);
    return raw ? (JSON.parse(raw) || {}) : {};
  } catch (e) { return {}; }
};

UIC.setPref = function (key, value) {
  var p = UIC.getPrefs();
  if (value == null || value === '') delete p[key]; else p[key] = value;
  try { localStorage.setItem(UIC.PREFS_KEY, JSON.stringify(p)); } catch (e) {}
  UIC.applyPrefs();
  return p;
};

UIC.applyPrefs = function () {
  var p = UIC.getPrefs();
  var root = document.documentElement;
  if (!root) return;
  /* Absent means "follow the operating system", which is why the attribute is
     REMOVED rather than set to a third value: the CSS guard is written around
     the attribute being missing. */
  if (p.theme === 'dark' || p.theme === 'light') root.setAttribute('data-theme', p.theme);
  else root.removeAttribute('data-theme');
  if (p.density === 'compact') root.setAttribute('data-density', 'compact');
  else root.removeAttribute('data-density');
};

/* Run immediately, not on DOMContentLoaded: this file is included in <head>,
   so setting the attribute here happens before the body is painted. */
try { UIC.applyPrefs(); } catch (e) {}

UIC.openPreferences = function () {
  var p = UIC.getPrefs();
  var radio = function (name, value, label, current) {
    var id = 'pref-' + name + '-' + value;
    return '<label class="pref-choice" for="' + id + '">' +
      '<input type="radio" id="' + id + '" name="pref-' + name + '" value="' + value + '"' +
      (String(current || '') === value || (!current && value === 'system') || (!current && value === 'comfortable') ? ' checked' : '') +
      ' onchange="UIC.setPref(\'' + name + '\', this.value === \'system\' || this.value === \'comfortable\' ? null : this.value)">' +
      '<span>' + label + '</span></label>';
  };
  UIC.openModal('uic-prefs', {
    title: 'التفضيلات',
    size: 'sm',
    footer: UIC.button({ text: 'تم', onClick: "UIC.closeModal('uic-prefs')" }),
    body:
      '<div class="pref-group"><div class="pref-label">المظهر</div>' +
        radio('theme', 'system', 'حسب النظام', p.theme) +
        radio('theme', 'light', 'فاتح', p.theme) +
        radio('theme', 'dark', 'داكن', p.theme) +
      '</div>' +
      '<div class="pref-group"><div class="pref-label">كثافة العرض</div>' +
        radio('density', 'comfortable', 'مريح', p.density) +
        radio('density', 'compact', 'مضغوط', p.density) +
      '</div>' +
      '<p class="pref-note">تُحفظ هذه التفضيلات على هذا الجهاز فقط.</p>'
  });
};

UIC.toggleDropdown = function (id, event) {
  if (event) { event.preventDefault(); event.stopPropagation(); }
  const target = document.getElementById(id);
  if (!target) return;
  const isOpen = target.classList.contains('open');
  document.querySelectorAll('.nav-dropdown-menu').forEach(function (m) { m.classList.remove('open'); });
  document.querySelectorAll('.nav-dropdown-toggle').forEach(function (b) { b.classList.remove('open'); });
  if (!isOpen) {
    target.classList.add('open');
    const btn = target.parentNode ? target.parentNode.querySelector('.nav-dropdown-toggle') : null;
    if (btn) btn.classList.add('open');
  }
};

document.addEventListener('click', function (event) {
  const dd = event.target && event.target.closest ? event.target.closest('.nav-dropdown') : null;
  if (!dd) {
    document.querySelectorAll('.nav-dropdown-menu').forEach(function (m) { m.classList.remove('open'); });
    document.querySelectorAll('.nav-dropdown-toggle').forEach(function (b) { b.classList.remove('open'); });
  }
});

UIC.openDrawer = function () {
  const drawer  = document.getElementById('uic-drawer');
  const overlay = document.getElementById('uic-drawer-overlay');
  const ham     = document.querySelector('.topbar-hamburger');
  if (!drawer) return;
  drawer.classList.add('is-open');
  UIC._syncHomeFabForDrawer(true);
  if (overlay) overlay.classList.add('is-open');
  if (ham) ham.setAttribute('aria-expanded', 'true');
  document.body.style.overflow = 'hidden'; // prevent body scroll behind drawer
};

UIC.closeDrawer = function () {
  const drawer  = document.getElementById('uic-drawer');
  const overlay = document.getElementById('uic-drawer-overlay');
  const ham     = document.querySelector('.topbar-hamburger');
  if (!drawer) return;
  drawer.classList.remove('is-open');
  UIC._syncHomeFabForDrawer(false);
  if (overlay) overlay.classList.remove('is-open');
  if (ham) ham.setAttribute('aria-expanded', 'false');
  document.body.style.overflow = '';
};

UIC._initDrawerSwipe = function () {
  const drawer = document.getElementById('uic-drawer');
  if (!drawer) return;
  let startX = 0;
  let dragging = false;
  drawer.addEventListener('touchstart', function (e) {
    startX = e.touches[0].clientX;
    dragging = true;
  }, { passive: true });
  drawer.addEventListener('touchmove', function (e) {
    if (!dragging) return;
    const dx = e.touches[0].clientX - startX;
    /* Only track swipe in the closing direction (right for RTL drawer = left for LTR) */
    if (dx < -10) {
      drawer.style.transform = 'translateX(' + dx + 'px)';
      drawer.style.transition = 'none';
    }
  }, { passive: true });
  drawer.addEventListener('touchend', function (e) {
    if (!dragging) return;
    dragging = false;
    drawer.style.transform = '';
    drawer.style.transition = '';
    const dx = e.changedTouches[0].clientX - startX;
    if (dx < -60) UIC.closeDrawer();
  }, { passive: true });
};

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') UIC.closeDrawer();
});

/* ── [UI-6.5 / U-33] Application keyboard shortcuts ───────────────────────
 *
 * Alt+S saves, Alt+N creates. Alt is used rather than Ctrl because Ctrl+S and
 * Ctrl+N belong to the browser, and a shortcut that fights the browser is a
 * shortcut people learn not to press.
 *
 * Both are OPT-IN per page: a page registers what they should do. A shortcut
 * wired by guessing at the first button on the page would eventually press the
 * wrong one, and on a save path that is unacceptable.
 */
UIC.shortcuts = { save: null, create: null };

UIC.registerShortcuts = function (map) {
  UIC.shortcuts.save = (map && map.save) || null;
  UIC.shortcuts.create = (map && map.create) || null;
};

document.addEventListener('keydown', function (e) {
  if (!e.altKey || e.ctrlKey || e.metaKey) return;
  var k = String(e.key || '').toLowerCase();
  var fn = null;
  if (k === 's') fn = UIC.shortcuts.save;
  else if (k === 'n') fn = UIC.shortcuts.create;
  if (typeof fn !== 'function') return;
  /* Never fire while a dialog is open: the dialog owns the keyboard. */
  if (document.body.classList.contains('modal-open')) return;
  e.preventDefault();
  try { fn(); } catch (err) {}
});

       two of a two-page invoice has no column labels at all. */
    .table thead { display: table-header-group; }
    .table tfoot { display: table-footer-group; }
    .table thead th { position: static; }

    /* Do not break a row, a totals block or a signature across pages. */
    .table tbody tr, .dt-total, .stat-card, .invoice-totals,
    .inv-totals, .signature, .sig-block { break-inside: avoid; page-break-inside: avoid; }

    /* The phone card layout must never reach paper: below tablet-p the base
       rules turn the table into blocks, and a print stylesheet inherits the
       BASE, not the tier. Without this, printing from a narrow window produced
       a column of cards instead of a table. */
    .table { display: table; }
    .table thead { display: table-header-group; }
    .table tbody { display: table-row-group; }
    .table tr { display: table-row; }
    .table td { display: table-cell; text-align: right; border: 1px solid var(--border-color); }
    .table tbody td[data-label]::before { content: none; }
    .table tbody tr { border: 0; margin: 0; padding: 0; }
    /* [iPhone run] .inv-table — the invoice line table — must never print as
       cards either. Its card rules sit further down this stylesheet, after
       this block, so at equal specificity they would win here; the type
       selector out-ranks them without touching any property a page sets. */
    table.card-table, table.inv-table { display: table; }
    table.card-table thead, table.inv-table thead { display: table-header-group; }
    table.card-table tbody, table.inv-table tbody { display: table-row-group; width: auto; }
    table.card-table tr, table.inv-table tr { display: table-row; width: auto; border: 0; border-radius: 0; margin: 0; padding: 0; background: transparent; }
    table.card-table td, table.inv-table td { display: table-cell; width: auto; align-items: normal; justify-content: normal; gap: normal; }
    table.card-table td[data-label]::before, table.inv-table td[data-label]::before { content: none; }

    /* [7.2] The print palette. The two bespoke themes carried a blanket
       universal print-color-adjust:exact rule, which forces the browser to
       render EVERY background — so a TopLight header row printed as a black bar
       and a TopChemical one as solid green, using a cartridge of toner per
       report. Colour is now applied deliberately and only where it carries
       meaning: the document's header rule and the totals row. */
    body { background: #fff !important; }
    .table thead th {
      background: #fff !important; color: #000 !important;
      border-bottom: 2px solid var(--brand-primary);
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .table tfoot .dt-total td, .dt-total td {
      background: #fff !important; color: #000 !important;
      border-top: 2px solid var(--brand-primary);
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .table tbody tr:hover { background: transparent !important; }
    .pill { border: 1px solid #999 !important; background: #fff !important; color: #000 !important; }

    /* A link's target is invisible on paper, so print it. Skipped for in-app
       links, whose ?action= URLs are noise to a reader. */
    a[href^="http"]:not([href*="?action="])::after {
      content: ' (' attr(href) ')'; font-size: 10px; color: #555;
    }
  }
  /* [UI-1.3 / U-03] Sort affordance. The chevron is a glyph rather than an
     image so it inherits the header colour under all three company themes.
     A neutral double-arrow shows the column CAN be sorted; it darkens and
     resolves to one direction once it is. Reserving the width in both states
     stops the header text jumping as the state cycles. */
  .table thead th[data-sortable="true"] { user-select: none; }
  .table thead th .th-label { vertical-align: middle; }
  .table thead th .th-sort {
    display: inline-block; width: 1em; margin-inline-start: var(--space-1);
    font-size: var(--text-xs); line-height: 1; opacity: .45; vertical-align: middle;
  }
  /* NB: this stylesheet lives in a JS template literal, so every CSS unicode
     escape must have its backslash doubled. A single-backslash escape here is
     read by JavaScript as an OCTAL escape, which is a SyntaxError in a template
     string and would take the whole shared layer down on all 85 pages. */
  .table thead th .th-sort::before { content: '\\2195'; }              /* ↕ */
  .table thead th.sorted-asc  .th-sort { opacity: 1; }
  .table thead th.sorted-desc .th-sort { opacity: 1; }
  .table thead th.sorted-asc  .th-sort::before { content: '\\25B2'; }  /* ▲ */
  .table thead th.sorted-desc .th-sort::before { content: '\\25BC'; }  /* ▼ */
  .table thead th[data-sortable="true"]:hover .th-sort { opacity: .8; }
  .table thead th[data-sortable="true"]:focus-visible { outline: 2px solid var(--brand-primary); outline-offset: -2px; }
  .table thead th.sorted-asc, .table thead th.sorted-desc { color: var(--text-main); }

  .table tbody td { padding: 10px 12px; border-bottom: 1px solid var(--border-color); }

  /* [UI-1.4 / U-04] Numeric cells, in the SHARED layer.
     UIC._dtRowHtml puts class="num" on every money and numeric cell, but the
     rule that styles it existed only inside the two bespoke company themes.
     ValleyFoods therefore rendered its numbers in the body font, right-aligned
     and non-tabular, so columns of figures did not line up.
     The declarations are exactly those the two themes already carried, and
     --font-mono resolves to the same stack they define, so TopLight and
     TopChemical render identically to before; only ValleyFoods changes. */
  .num {
    font-family: var(--font-mono, 'Consolas', 'Courier New', monospace);
    direction: ltr;
    text-align: left;
    font-variant-numeric: tabular-nums;
  }
  .table tbody tr:hover { background: var(--brand-subtle-bg); }
  /* Tall enough rows for finger tapping */
  .table tbody tr { min-height: var(--tap-sm, 44px); }
  /* ── [UI-4.4 / U-18] Group rows, subtotals and the column footer ─────── */
  .table tbody tr.dt-group td {
    background: var(--bg-subtle);
    font-weight: 700; color: var(--text-main);
    border-top: 1px solid var(--border-strong);
    position: sticky; top: 32px; z-index: 1;
  }
  .dt-group-lead { display: flex; align-items: center; gap: var(--space-2); }
  .dt-group-toggle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; min-width: 24px;
    border: 0; background: transparent; color: var(--text-muted);
    cursor: pointer; border-radius: var(--radius-sm); padding: 0;
  }
  .dt-group-toggle:hover { background: var(--bg-sunken); color: var(--text-main); }
  .dt-group-label { font-weight: 800; }
  .dt-group-count {
    font-size: var(--text-xs); font-weight: 700;
    background: var(--brand-subtle-bg); color: var(--brand-primary);
    border-radius: 999px; padding: 1px 8px;
  }
  .dt-group-sum { font-weight: 700; }
  .dt-total-lead { font-weight: 800; white-space: nowrap; }
  .table tfoot .dt-total td {
    background: var(--bg-subtle);
    border-top: 2px solid var(--border-strong);
    font-weight: 800; color: var(--text-main);
    position: sticky; bottom: 0;
  }

  /* [UI-4.7 / U-23] Inline refresh progress — reading never blocks the page. */
  .dt-progress {
    height: 3px; width: 100%; overflow: hidden;
    background: var(--bg-sunken);
    background-image: linear-gradient(90deg, transparent, var(--brand-primary), transparent);
    background-size: 40% 100%; background-repeat: no-repeat;
    animation: dt-progress-slide 1.1s ease-in-out infinite;
  }
  @keyframes dt-progress-slide { 0% { background-position: 120% 0; } 100% { background-position: -40% 0; } }
  @media (prefers-reduced-motion: reduce) { .dt-progress { animation: none; opacity: .5; } }

  /* ── [UI-4.6 / U-17] Selection and the batch bar ─────────────────────── */
  .table .dt-sel { width: var(--tap-sm, 44px); text-align: center; }
  .dt-sel-box, .dt-sel-all { width: 18px; height: 18px; cursor: pointer; accent-color: var(--brand-primary); }
  .dt-batch {
    display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap;
    padding: var(--space-2) var(--space-3);
    background: var(--brand-subtle-bg);
    border-bottom: 1px solid var(--border-color);
    position: sticky; top: 0; z-index: 3;
  }
  .dt-batch-count { font-size: var(--text-sm); font-weight: 700; color: var(--brand-primary); }
  .dt-batch .btn { padding: 6px 12px; min-height: var(--tap-sm, 44px); }

  /* ── [RT-3] Read skeletons ──────────────────────────────────── */
  .rt-skel { padding: var(--space-3); }
  .rt-skel .pt-sk-bar { opacity: .75; }
  .rt-skel-form { display: grid; gap: var(--space-3); }
  .rt-skel-field { display: grid; gap: 6px; }
  .rt-skel-label { width: 34%; height: 10px; }
  .rt-skel-input { width: 100%; height: 34px; border-radius: var(--radius-sm, 6px); }
  .rt-skel-cards {
    display: grid; gap: var(--space-3);
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  }
  .rt-skel-card {
    display: grid; gap: 10px;
    padding: var(--space-3);
    border: 1px solid var(--border-color); border-radius: var(--radius-md, 8px);
    background: var(--bg-surface);
  }
  .rt-skel-figure { width: 60%; height: 24px; }
  /* A skeleton is decoration, not information: someone who has asked for less
     motion gets the shape without the shimmer. */
  @media (prefers-reduced-motion: reduce) {
    .rt-skel .pt-sk-bar { animation: none; }
  }

  /* [RT-7] The previous paint, shown while the real one loads. Inert on
     purpose: its action buttons name record ids that may no longer be right. */
  .rt-stale > *:not(.pt-loading) { pointer-events: none; opacity: .5; filter: saturate(.5); }
  .rt-stale .table-toolbar { display: none; }

  /* ── [RT-1] Search-scope notice ──────────────────────────────── */
  .dt-search-scope {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: var(--text-sm); color: var(--text-muted);
  }
  .dt-search-scope svg { width: 15px; height: 15px; flex: none; }
  .dt-search-scope-all {
    background: none; border: 0; padding: 0;
    font: inherit; color: var(--brand-primary);
    text-decoration: underline; cursor: pointer;
  }

  /* ── [UI-4.5 / U-19] Optional columns ────────────────────────────────── */
  .dt-col-menu { max-height: 60dvh; overflow-y: auto; }
  .dt-col-item {
    display: flex; align-items: center; gap: var(--space-2);
    padding: var(--space-2) 10px; border-radius: var(--radius-sm);
    font-size: var(--text-sm); cursor: pointer; min-height: var(--tap-sm, 44px);
  }
  .dt-col-item:hover { background: var(--bg-subtle); }
  .dt-col-item input { accent-color: var(--brand-primary); width: 16px; height: 16px; }
  /* [UI-4.9 / U-16] Saved views */
  .dt-fav-empty { padding: var(--space-3) 10px; font-size: var(--text-xs); color: var(--text-muted); text-align: center; }

  /* ── [UI-3.5 / U-22] Empty state ─────────────────────────────────────── */
  /* [UI-10.1 / D-8] The last pattern harvested from the dead ERP_DataTable
     engine before it was deleted: a row whose write has not been confirmed yet.
     CSS_Tokens has carried --pending-* and --row-pending-opacity all along with
     nothing left to consume them once that engine stopped being included. */
  .table tbody tr.row-pending { opacity: var(--row-pending-opacity, .62); }
  .table tbody tr.row-pending td { background: var(--pending-bg) !important; }
  .badge-pending {
    display: inline-block; font-size: var(--text-xs); padding: 2px 6px;
    border-radius: 999px; background: var(--pending-bg);
    border: 1px solid var(--pending-border); color: var(--pending-text);
    margin-inline-start: 6px;
  }

  .empty-state { padding: 48px 16px; text-align: center; color: var(--text-muted); background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-md); }
  .empty-state-icon { color: var(--text-disabled); margin-bottom: var(--space-3); }
  .empty-state-title { font-size: var(--text-base); font-weight: 700; color: var(--text-main); margin-bottom: var(--space-1); }
  .empty-state-body { font-size: var(--text-sm); color: var(--text-muted); max-width: 46ch; margin: 0 auto var(--space-4); line-height: 1.7; }
  .empty-state-action { margin-top: var(--space-2); }
  .pt-loading { display:flex; align-items:center; gap:10px; padding:14px 4px; color:var(--text-muted); font-size: var(--text-sm); }
  .pt-spin { width:22px; height:22px; flex:0 0 auto; border:3px solid var(--border-color,#e2e8f0); border-top-color:var(--brand-primary,#16a34a); border-radius:50%; animation:ptspin .8s linear infinite; }
  @keyframes ptspin { to { transform: rotate(360deg); } }
  .pt-sk-table { width:100%; border-collapse:collapse; }
  .pt-sk-table thead th { padding:10px 12px; background:var(--bg-subtle); color:var(--text-muted); font-weight:600; font-size: var(--text-xs); text-align:right; border-bottom:1px solid var(--border-color); white-space:nowrap; }
  .pt-sk-table tbody td { padding:10px 12px; border-bottom:1px solid var(--border-color); }
  .pt-sk-bar { height:12px; border-radius:6px; background:linear-gradient(90deg,var(--bg-subtle,#eef2f7) 25%,var(--border-color,#e2e8f0) 37%,var(--bg-subtle,#eef2f7) 63%); background-size:400% 100%; animation:ptshimmer 1.2s ease infinite; }
  @keyframes ptshimmer { 0% { background-position:100% 0; } 100% { background-position:-100% 0; } }

  /* ── Form Controls ───────────────────────────────────────────────────── */
  .input {
    width: 100%; padding: 10px 12px;
    /* 16px minimum to prevent Android Chrome from zooming on focus */
    font-size: max(16px, 1rem);
    font-family: var(--font-sans);
    border: 1px solid var(--border-color); border-radius: var(--radius-sm);
    background: var(--bg-surface); color: var(--text-main);
    /* Expand height for comfortable touch input */
    min-height: var(--tap-sm, 44px);
    line-height: 1.4;
  }
  .input:focus { outline: none; border-color: var(--brand-primary); box-shadow: 0 0 0 2px var(--brand-subtle-bg); }
  .form-field { margin-bottom: var(--space-4); }

  /* [F4a] The house form grid.
     Before this there was no shared form-grid class at all — 83 inline
     grid-template-columns across 43 pages, with minimums from 110px to 320px
     and 16 hard 1fr-1fr splits carrying no minimum whatsoever. A hard
     1fr 1fr inside the 512px body of a default modal holds two ~236px
     columns on a phone rather than collapsing, which is what clips long
     Arabic names.
     One column by default; from tablet-p up, as many columns as fit above
     the floor. 240px, not the previously most-common 220px: at 220px inside
     a 512px body the two resulting columns leave ~226px of text after
     .input's 10px 12px padding — the exact margin where long Arabic party
     names begin to clip. */
  .form-grid { display: grid; gap: 0 var(--space-4); grid-template-columns: 1fr; align-items: start; }
  .form-grid-wide { display: grid; gap: 0 var(--space-4); grid-template-columns: 1fr; align-items: start; }
  .form-grid-narrow { display: grid; gap: 0 var(--space-4); grid-template-columns: 1fr; align-items: start; }
  /* The responsive halves of these three live in the single canonical
     tablet-p tier below, not in a second @media block here: the house
     convention is one block per breakpoint tier. */
  .form-label { display: block; font-size: var(--text-sm); font-weight: 600; margin-bottom: 6px; color: var(--text-main); }
  .req { color: var(--danger); }
  .field-error { color: var(--danger); font-size: var(--text-xs); min-height: 16px; }
  .form-field.has-error .input { border-color: var(--danger); }

  /* ── UIC.Live — the "still saving" hint, and a pending row ───────────── */
  /* Deliberately NOT the blocking overlay: an optimistic save has already
     shown the user their change, so the indicator's job is to say the write
     is still travelling, not to stop them working. */
  .uic-live-busy {
    position: fixed; inset-inline-end: var(--space-4); inset-block-end: var(--space-4);
    z-index: 9000; padding: var(--space-2) var(--space-4);
    background: var(--bg-surface); color: var(--text-muted);
    border: 1px solid var(--border-color); border-radius: var(--radius-pill);
    font-size: var(--text-xs); font-weight: 700;
    box-shadow: 0 2px 8px rgba(0,0,0,.12); pointer-events: none;
  }
  /* A row the server has not confirmed yet. Pages opt in by rendering the
     class; nothing breaks if they do not. */
  .row-pending, tr.row-pending td { opacity: .62; font-style: italic; }

  /* [RT-6] "Someone else changed something" — shown ONLY when the user is in
     the middle of something, so the list never moves under a person who is
     reading or typing. It waits to be clicked rather than expiring, because a
     change that arrived while you were typing is still there afterwards. */
  .uic-live-fresh {
    position: fixed; inset-inline-start: 50%; transform: translateX(-50%);
    inset-block-start: var(--space-4); z-index: 9002;
  }
  .uic-live-fresh-go {
    padding: var(--space-2) var(--space-4);
    background: var(--brand-primary); color: #fff;
    border: 0; border-radius: var(--radius-pill);
    font: inherit; font-size: var(--text-xs); font-weight: 700;
    box-shadow: 0 2px 10px rgba(0,0,0,.2); cursor: pointer;
  }
  /* The brief flash when a change IS merged in place. */
  .rt-arrived { animation: rt-arrive 900ms ease; }
  @keyframes rt-arrive {
    0%   { box-shadow: inset 0 0 0 2px var(--brand-primary); }
    100% { box-shadow: inset 0 0 0 2px transparent; }
  }
  @media (prefers-reduced-motion: reduce) { .rt-arrived { animation: none; } }

  /* [RT-4] The retry chip. It is not a toast, and the difference is the whole
     point: a toast that disappears in three seconds is how a change made on a
     phone with no signal goes missing without anyone noticing. This stays on
     screen, in an alert region, until the change is saved or the user
     explicitly discards it. */
  .uic-live-retry {
    position: fixed; inset-inline-end: var(--space-4); inset-block-end: calc(var(--space-4) + 44px);
    z-index: 9001; display: flex; align-items: center; gap: var(--space-2);
    padding: var(--space-2) var(--space-3);
    background: var(--danger-bg, #fee2e2); color: var(--text-main);
    border: 1px solid var(--danger); border-radius: var(--radius-pill);
    font-size: var(--text-xs); font-weight: 700;
    box-shadow: 0 2px 10px rgba(0,0,0,.18);
  }
  .uic-live-retry-go, .uic-live-retry-drop {
    background: none; border: 0; padding: 4px 8px; cursor: pointer;
    font: inherit; border-radius: var(--radius-sm);
  }
  .uic-live-retry-go { color: var(--brand-primary); text-decoration: underline; }
  .uic-live-retry-drop { color: var(--text-muted); }
  .uic-live-retry { flex-wrap: wrap; max-inline-size: min(92vw, 520px); }

  /* ── [UI-5.2 / U-28] Styled confirm ──────────────────────────────────── */
  .uic-confirm-msg { font-size: var(--text-base); color: var(--text-main); line-height: 1.7; }
  .uic-confirm-record {
    margin-top: var(--space-3); padding: var(--space-2) var(--space-3);
    background: var(--bg-sunken); border-radius: var(--radius-sm);
    font-weight: 700; color: var(--text-main); font-size: var(--text-sm);
    word-break: break-word;
  }
  .uic-confirm-detail { margin-top: var(--space-2); font-size: var(--text-sm); color: var(--text-muted); line-height: 1.7; }

  /* ── [UI-5.3 / U-27] Line-level validation ───────────────────────────── */
  .line-error > td { background: var(--danger-bg); }
  .line-error > td:first-child { box-shadow: inset 3px 0 0 var(--danger); }
  [dir="rtl"] .line-error > td:first-child { box-shadow: inset -3px 0 0 var(--danger); }
  .line-error::after {
    content: attr(data-line-error);
    display: block; padding: 4px var(--space-3);
    color: var(--danger-text); font-size: var(--text-xs); font-weight: 600;
  }

  /* ── Searchable Combo ────────────────────────────────────────────────── */
  .combo { position: relative; }
  .combo-input { width: 100%; }
  .combo-list {
    position: absolute; top: 100%; right: 0; left: 0; z-index: 1400;
    margin-top: 2px; max-height: 240px; overflow-y: auto;
    background: var(--bg-surface); border: 1px solid var(--border-color);
    border-radius: 6px; box-shadow: 0 8px 20px rgba(0,0,0,.12);
    -webkit-overflow-scrolling: touch;
  }
  .combo-option {
    padding: 12px 10px; /* taller for touch */
    font-size: var(--text-sm); cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .combo-option:hover, .combo-option.active { background: var(--brand-subtle-bg); color: var(--brand-primary); }

  /* ── Modal ───────────────────────────────────────────────────────────── */
  .modal-open { overflow: hidden; }
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.45);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 1000;
    /* Safe area padding so overlay doesn't clip on notch devices */
    padding: max(16px, var(--safe-top)) max(16px, var(--safe-left)) max(0px, var(--safe-bottom)) max(16px, var(--safe-right));
  }
  .modal {
    background: var(--bg-surface);
    border-radius: var(--radius-lg) var(--radius-lg) 0 0; /* bottom sheet on mobile */
    width: 100%;
    max-height: 90dvh;
    max-height: calc(var(--vh, 1vh) * 90); /* fallback */
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    box-shadow: var(--shadow-lg);
    /* GPU layer for smooth slide-in */
    will-change: transform;
    /* Bottom padding so content clears gesture bar */
    padding-bottom: var(--safe-bottom);
  }
  /* [UI-3.6 / U-40] The bottom-sheet grab handle. A ::before rather than an
     element, so no call site's markup changes and no DOM node is added. It
     exists only where the dialog IS a sheet — the tablet-p tier hides it. */
  .modal::before {
    content: ''; display: block;
    width: 36px; height: 4px; border-radius: 999px;
    background: var(--border-strong, #cfd4db);
    margin: var(--space-2) auto 0;
    flex-shrink: 0;
  }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: var(--space-4) var(--space-6); border-bottom: 1px solid var(--border-color);
    /* Sticky so close button is always accessible */
    position: sticky; top: 0; background: var(--bg-surface); z-index: 1;
  }
  .modal-header h3 { font-size: var(--text-base); }
  .modal-body  { padding: var(--space-6); }
  .modal-footer {
    display: flex; justify-content: flex-end; gap: var(--space-2);
    padding: var(--space-4) var(--space-6); border-top: 1px solid var(--border-color);
    flex-wrap: wrap; /* allow buttons to wrap on very small screens */
  }
  .btn-icon { background: none; border: none; font-size: var(--text-xl); cursor: pointer; color: var(--text-muted); padding: var(--space-2); min-height: var(--tap-sm, 44px); min-width: var(--tap-sm, 44px); }
  /* [UI-2.9b] The dialog widths moved into the tablet-p (600px) tier with the
     rest of the responsive rules, so the whole scale lives in one place and
     640px — which was on no tier — is retired. Optional widths via
     UIC.openModal({ size: 'sm'|'md'|'lg'|'xl' }): 'md' is the default and emits
     no class, so untouched callers keep 560px, and below tablet-p every size is
     a full-width bottom sheet exactly as before. */

  /* ── Toast ───────────────────────────────────────────────────────────── */
  .toast {
    position: fixed; top: max(20px, calc(var(--safe-top) + 12px));
    left: 50%; transform: translateX(-50%);
    padding: var(--space-3) var(--space-6); border-radius: var(--radius-md); color: #fff;
    font-size: var(--text-sm); font-weight: 600; z-index: 2000;
    box-shadow: var(--shadow-md);
    transition: opacity .3s ease, transform .3s ease;
    max-width: min(90vw, 360px);
    text-align: center;
    /* GPU layer */
    will-change: transform, opacity;
    cursor: pointer;
  }
  .toast-success { background: var(--success); }
  .toast-error   { background: var(--danger); }
  .toast-warning { background: var(--warning); }
  .toast-out { opacity: 0; transform: translateX(-50%) translateY(-8px); }

  /* ── [UI-5.4 / U-29] Workflow statusbar ──────────────────────────────── */
  .statusbar { overflow-x: auto; }
  .sb-list { display: flex; align-items: center; gap: var(--space-1); list-style: none; margin: 0; padding: 0; }
  .sb-stage {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px var(--space-3); border-radius: 999px;
    font-size: var(--text-xs); font-weight: 700; white-space: nowrap;
    background: var(--bg-subtle); color: var(--text-muted);
    min-height: var(--tap-sm, 44px);
  }
  .sb-stage[role="button"] { cursor: pointer; }
  .sb-stage[role="button"]:hover { background: var(--bg-sunken); color: var(--text-main); }
  .sb-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--border-strong); display: inline-flex; align-items: center; justify-content: center; color: var(--bg-surface); }
  .sb-done { background: var(--success-bg); color: var(--success-text); }
  .sb-done .sb-dot { background: var(--success); }
  .sb-current { background: var(--brand-primary); color: var(--btn-text-color); }
  .sb-current .sb-dot { background: var(--btn-text-color); }
  .sb-todo { opacity: .75; }
  .sb-label { line-height: 1; }

  /* ── [UI-5.5 / U-29] Smart buttons ───────────────────────────────────── */
  .smart-buttons { display: flex; gap: var(--space-2); flex-wrap: wrap; }
  .smart-btn {
    display: inline-flex; flex-direction: column; align-items: flex-start; gap: 2px;
    padding: var(--space-2) var(--space-3);
    background: var(--bg-surface); border: 1px solid var(--border-color);
    border-radius: var(--radius-md); cursor: pointer; min-height: var(--tap-min, 48px);
    font-family: var(--font-sans); color: var(--text-main); position: relative;
  }
  .smart-btn:hover:not(:disabled) { border-color: var(--brand-primary); box-shadow: var(--shadow-sm); }
  .smart-btn:disabled { opacity: .55; cursor: default; }
  .smart-btn-icon { position: absolute; inset-inline-end: var(--space-2); top: var(--space-2); color: var(--text-disabled); }
  .smart-btn-count { font-size: var(--text-lg); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .smart-btn-label { font-size: var(--text-xs); color: var(--text-muted); }

  /* ── [UI-5.6 / U-29] Notebook tabs ───────────────────────────────────── */
  .nb-tabs {
    display: flex; gap: 2px; overflow-x: auto;
    border-bottom: 1px solid var(--border-color); margin-bottom: var(--space-4);
  }
  .nb-tab {
    display: inline-flex; align-items: center; gap: 6px;
    padding: var(--space-3) var(--space-4); min-height: var(--tap-sm, 44px);
    background: transparent; border: 0; border-bottom: 2px solid transparent;
    font-family: var(--font-sans); font-size: var(--text-sm); font-weight: 700;
    color: var(--text-muted); cursor: pointer; white-space: nowrap;
  }
  .nb-tab:hover { color: var(--text-main); background: var(--bg-subtle); }
  .nb-tab-active { color: var(--brand-primary); border-bottom-color: var(--brand-primary); }
  .nb-badge {
    font-size: var(--text-xs); font-weight: 700; border-radius: 999px;
    background: var(--bg-sunken); color: var(--text-muted); padding: 1px 7px;
  }
  .nb-tab-active .nb-badge { background: var(--brand-subtle-bg); color: var(--brand-primary); }
  .notebook { display: block; }
  .nb-panel { display: block; }

  /* ── Stat Card ───────────────────────────────────────────────────────── */
  .stat-card {
    display: flex; align-items: center; gap: var(--space-4);
    background: var(--bg-surface); border: 1px solid var(--border-color);
    border-radius: var(--radius-md); padding: var(--space-4);
    contain: layout style; /* reduce paint cost */
  }
  .stat-icon { font-size: 28px; width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-md); background: var(--bg-subtle); flex-shrink: 0; }
  .stat-success .stat-icon { background: var(--success-bg); }
  .stat-danger  .stat-icon { background: var(--danger-bg); }
  .stat-warning .stat-icon { background: var(--warning-bg); }
  .stat-value { font-size: var(--text-2xl); font-weight: 700; line-height: 1.2; }
  .stat-label { font-size: var(--text-xs); color: var(--text-muted); }

  /* ── Company Tile ────────────────────────────────────────────────────── */
  .company-tile {
    background: var(--bg-surface); border: 1px solid var(--border-color);
    border-radius: var(--radius-lg); padding: var(--space-6);
    text-align: center; cursor: pointer; transition: all .15s ease;
    contain: layout style;
  }
  .company-tile:hover { border-color: var(--brand-primary); box-shadow: var(--shadow-brand); transform: translateY(-2px); }
  @media (hover: none) { .company-tile:active { transform: scale(0.98); border-color: var(--brand-primary); } }
  .tile-logo { width: 84px; height: 84px; object-fit: contain; border-radius: 50%; background: #fff; padding: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.18); margin: 0 auto var(--space-4); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; color: var(--brand-primary); }
  .tile-logo:hover { box-shadow: 0 6px 18px rgba(0,0,0,.22); transform: translateY(-1px); }
  .tile-logo-fallback { border: 1px solid var(--border-color); }
  .tile-name-ar { font-size: var(--text-base); font-weight: 700; margin-bottom: var(--space-1); }
  .tile-name-en { font-size: var(--text-xs); color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: var(--space-4); }
  .tile-enter   { font-size: var(--text-xs); font-weight: 600; color: var(--brand-primary); }

  /* ── Module Tile ─────────────────────────────────────────────────────── */
  .module-tile {
    position: relative; background: var(--bg-surface); border: 1px solid var(--border-color);
    border-radius: var(--radius-lg); padding: var(--space-6);
    text-align: center; cursor: pointer; transition: all .15s ease;
    contain: layout style;
  }
  .module-tile:hover { border-color: var(--brand-primary); box-shadow: var(--shadow-brand); transform: translateY(-2px); }
  @media (hover: none) { .module-tile:active { transform: scale(0.98); } }
  .module-tile-disabled { opacity: .5; cursor: not-allowed; }
  .module-tile-disabled:hover { border-color: var(--border-color); box-shadow: none; transform: none; }
  .module-tile-icon { width: 64px; height: 64px; margin: 0 auto var(--space-4); display: flex; align-items: center; justify-content: center; font-size: 32px; border-radius: var(--radius-md); background: var(--brand-subtle-bg); }
  .module-tile-title    { font-size: var(--text-base); font-weight: 700; margin-bottom: var(--space-1); }
  .module-tile-subtitle { font-size: var(--text-xs); color: var(--text-muted); }
  /* [UI-3.7] Was a physical right:8px. A tile badge belongs in the far corner — top
     RIGHT while the page rendered LTR. After step 1.1 corrected the direction,
     a physical right put it in the NEAR corner instead. inset-inline-end is
     the far corner in both directions. */
  .module-tile-badge { position: absolute; top: 8px; inset-inline-end: 8px; background: var(--warning); color: #fff; font-size: var(--text-xs); font-weight: 600; padding: 2px 8px; border-radius: 999px; }

  /* ── Topbar ──────────────────────────────────────────────────────────── */
  .topbar {
    position: sticky; top: 0; z-index: 1000;
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-4);
    background: var(--bg-surface); border-bottom: 1px solid var(--border-color);
    padding: 0 var(--space-4);
    height: var(--topbar-h, 56px);
    /* Allow dropdown menus to expand outside the header */
    overflow: visible;
  }
  .topbar-left  { display: flex; align-items: center; gap: var(--space-2); min-width: 0; }
  .topbar-right { display: flex; align-items: center; flex-shrink: 0; }
  .user-block { display: flex; flex-direction: column; align-items: center; gap: var(--space-1); line-height: 1.2; padding: 4px 10px; background: var(--bg-subtle); border-radius: var(--radius-lg); border: 1px solid var(--border-color); }
  .user-name   { font-size: var(--text-sm); color: var(--text-main); font-weight: 700; white-space: nowrap; max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
  .user-logout { padding: 4px 12px; font-size: var(--text-xs); font-weight: 700; border-radius: 20px; transition: all 0.2s; background: var(--danger-bg); color: var(--danger-text); border: 1px solid var(--danger-border); cursor: pointer; }
  .user-logout:hover { background: var(--danger); color: #fff; }

  /* ── User profile dropdown ─────────────────────────────────────────── */
  .user-profile .user-profile-toggle { gap: var(--space-2); }
  .user-avatar {
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    background: var(--brand-primary); color: #fff;
    font-weight: 800; font-size: var(--text-base); line-height: 1;
  }
  .user-avatar-lg { width: 46px; height: 46px; font-size: var(--text-xl); }
  .user-profile .user-name { max-width: 110px; }
  .user-profile-menu { min-width: 250px; }
  .user-profile-head {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px 12px; margin-bottom: var(--space-1);
    border-bottom: 1px solid var(--border-color);
  }
  .user-profile-id { min-width: 0; }
  .user-profile-name {
    font-size: var(--text-sm); font-weight: 800; color: var(--text-main);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px;
  }
  .user-profile-email {
    font-size: var(--text-xs); color: var(--text-muted); direction: ltr; text-align: end;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px;
  }
  .user-profile-divider { height: 1px; background: var(--border-color); margin: var(--space-1) 0; }
  .user-profile-logout { color: var(--danger-text); font-weight: 700; }
  .user-profile-logout:hover { background: var(--danger-bg); color: var(--danger-text); }

  /* ── Mobile drawer nav contrast ──────────────────────────────────────
   * Drawer links used muted text on surface — too faint on phones. Force
   * full-contrast ink, bolder weights, and a solid active treatment. */
  .drawer-nav .nav-item,
  .drawer-nav-item { color: var(--text-main); font-weight: 700; }
  .drawer-nav .nav-item.active,
  .drawer-nav-item.active { background: var(--brand-primary); color: #fff; }
  .drawer-group-label { color: var(--text-main); font-size: var(--text-xs); font-weight: 800; }
  .drawer-group .nav-dropdown-item { color: var(--text-main); font-weight: 600; }
  .drawer-group .nav-dropdown-item-active { background: var(--brand-primary); color: #fff; }
  .app-logo { display: inline-flex; align-items: center; flex-shrink: 0; }
  .app-logo img { height: 32px; width: 32px; display: block; object-fit: contain; border-radius: 50%; background: #fff; padding: 3px; box-shadow: 0 2px 8px rgba(0,0,0,.14); }
  .app-logo-company img { height: 40px; width: 40px; }

  /* ── Desktop topbar nav (hidden on mobile) ───────────────────────────── */
  .topbar-nav {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    flex: 1;
    overflow: visible;
  }
  .nav-item { padding: var(--space-2) var(--space-3); font-size: var(--text-sm); font-weight: 600; color: var(--text-muted); text-decoration: none; border-radius: var(--radius-sm); white-space: nowrap; display: inline-flex; align-items: center; min-height: var(--tap-sm, 44px); transition: color 0.15s, background-color 0.15s; }
  .nav-item:hover, .nav-item.active { color: var(--brand-primary); background: var(--brand-subtle-bg); }

  /* ── Hamburger button (mobile only) ─────────────────────────────────── */
  .topbar-hamburger {
    display: none; /* hidden on desktop */
    flex-direction: column; justify-content: center; align-items: center; gap: 5px;
    width: var(--tap-min, 48px); height: var(--tap-min, 48px);
    background: none; border: none; cursor: pointer; padding: var(--space-2); border-radius: var(--radius-sm);
    flex-shrink: 0;
  }
  .hamburger-bar { display: block; width: 22px; height: 2px; background: var(--text-main); border-radius: 2px; transition: all 0.2s; }

  /* ── Dropdowns ───────────────────────────────────────────────────────── */
  .nav-dropdown         { position: relative; display: inline-block; }
  .nav-dropdown-toggle  { display: inline-flex; align-items: center; gap: 6px; padding: var(--space-2) var(--space-3); font-size: var(--text-sm); font-weight: 600; font-family: var(--font-sans); color: var(--text-muted); background: none; border: none; border-radius: var(--radius-sm); cursor: pointer; min-height: var(--tap-sm, 44px); white-space: nowrap; transition: color 0.15s, background-color 0.15s; }
  .nav-dropdown-toggle:hover, .nav-dropdown-toggle.open { color: var(--brand-primary); background: var(--brand-subtle-bg); }
  .nav-dropdown-caret   { font-size: var(--text-xs); transition: transform 0.2s; }
  .nav-dropdown-toggle.open .nav-dropdown-caret { transform: rotate(180deg); }
  .nav-dropdown-menu    {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    /* [UI-3.7] Was a physical right:0. In RTL that is the START edge, which is where a
       menu should hang from its toggle — so the RTL rendering is unchanged —
       but it was hanging from the wrong edge in LTR. */
    inset-inline-start: 0;
    min-width: 230px;
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15), 0 2px 6px rgba(0, 0, 0, 0.08);
    z-index: 2500;
    padding: var(--space-2);
    max-height: 75dvh;
    max-height: calc(var(--vh, 1vh) * 75);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .nav-dropdown-menu.open { display: block; }
  .nav-dropdown-item { display: flex; align-items: center; padding: 10px 12px; font-size: var(--text-sm); color: var(--text-main); text-decoration: none; border-radius: var(--radius-sm); cursor: pointer; white-space: nowrap; min-height: 40px; transition: background-color 0.15s, color 0.15s; }
  .nav-dropdown-item:hover { background: var(--brand-subtle-bg); color: var(--brand-primary); }
  .nav-dropdown-item-active { background: var(--brand-subtle-bg); color: var(--brand-primary); font-weight: 700; }

  /* ── [UI-8.3 / U-41] Preferences panel ───────────────────────────────── */
  .pref-group { margin-bottom: var(--space-4); }
  .pref-label { font-size: var(--text-xs); font-weight: 800; color: var(--text-muted); margin-bottom: var(--space-2); text-transform: uppercase; letter-spacing: .06em; }
  .pref-choice {
    display: flex; align-items: center; gap: var(--space-2);
    padding: var(--space-2) 10px; border-radius: var(--radius-sm);
    font-size: var(--text-sm); cursor: pointer; min-height: var(--tap-sm, 44px);
  }
  .pref-choice:hover { background: var(--bg-subtle); }
  .pref-choice input { accent-color: var(--brand-primary); width: 16px; height: 16px; }
  .pref-note { font-size: var(--text-xs); color: var(--text-muted); margin-top: var(--space-2); }

  /* ── [UI-6.5 / U-33] Skip link ───────────────────────────────────────── */
  .skip-link {
    position: absolute; inset-inline-start: -9999px; top: 0; z-index: 3000;
    background: var(--brand-primary); color: var(--btn-text-color);
    padding: var(--space-3) var(--space-4); border-radius: 0 0 var(--radius-md) 0;
    font-weight: 700; font-size: var(--text-sm); text-decoration: none;
  }
  /* Off-screen until focused, then it takes its place — the standard pattern:
     invisible to everyone except the keyboard user who needs it. */
  .skip-link:focus { inset-inline-start: 0; }

  /* ── [UI-4.1 / U-13] Control panel ───────────────────────────────────── */
  .control-panel {
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border-color);
    padding: var(--space-2) var(--space-3) var(--space-3);
    display: flex; flex-direction: column; gap: var(--space-2);
  }
  .cp-row { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
  .cp-row-top { justify-content: space-between; min-height: 24px; }
  .cp-breadcrumb {
    display: flex; align-items: center; gap: 4px;
    font-size: var(--text-xs); color: var(--text-muted);
    overflow-x: auto; white-space: nowrap; min-width: 0;
  }
  .cp-crumb { color: var(--text-muted); text-decoration: none; padding: 2px 0; }
  a.cp-crumb:hover { color: var(--brand-primary); text-decoration: underline; }
  .cp-crumb-current { color: var(--text-main); font-weight: 700; }
  .cp-sep { display: inline-flex; color: var(--text-disabled); }
  .cp-title { font-size: var(--text-lg); font-weight: 800; margin: 0; color: var(--text-main); }

  /* Mobile-first: the three groups stack, then sit on one row from tablet-l,
     which is the first tier with room for a search box beside an action. */
  .cp-row-main { flex-direction: column; align-items: stretch; }
  .cp-lead { min-width: 0; }
  .cp-controls { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; flex: 1; min-width: 0; }
  .cp-actions { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }

  .cp-search { position: relative; display: flex; align-items: center; flex: 1; min-width: 0; flex-wrap: wrap; gap: 6px; }
  .cp-search-icon {
    position: absolute; inset-inline-start: 10px; top: 50%; transform: translateY(-50%);
    color: var(--text-disabled); pointer-events: none; display: inline-flex;
  }
  .cp-search-input { padding-inline-start: 34px; flex: 1; min-width: 140px; }
  .cp-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .cp-chip {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--brand-subtle-bg); color: var(--brand-primary);
    border: 1px solid var(--brand-border); border-radius: 999px;
    padding: 2px 6px 2px 10px; font-size: var(--text-xs); font-weight: 600;
    max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .cp-chip-x {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; border: 0; border-radius: 50%;
    background: transparent; color: inherit; cursor: pointer; padding: 0;
  }
  .cp-chip-x:hover { background: rgba(0,0,0,.08); }

  .cp-pager { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .cp-pager-btn { padding: 4px 8px; min-height: var(--tap-sm, 44px); min-width: var(--tap-sm, 44px); justify-content: center; }
  .cp-pager-count { font-size: var(--text-xs); color: var(--text-muted); font-variant-numeric: tabular-nums; }

  /* ── Breadcrumb & content area ───────────────────────────────────────── */
  .breadcrumb { padding: var(--space-3) var(--space-4); font-size: var(--text-sm); color: var(--text-muted); overflow-x: auto; white-space: nowrap; }
  .app-content { width: 100%; max-width: 1200px; margin: 0 auto; padding: var(--space-4); box-sizing: border-box; }

  /* ── Mobile Drawer ───────────────────────────────────────────────────── */
  .drawer-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 800;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s;
    /* GPU layer */
    will-change: opacity;
  }
  .drawer-overlay.is-open { opacity: 1; pointer-events: auto; }

  .mobile-drawer {
    position: fixed;
    top: 0; bottom: 0;
    /* RTL: drawer slides from right; LTR: from left */
    right: 0;
    width: min(80vw, 320px);
    background: var(--bg-surface);
    /* Start off-screen to the right */
    transform: translateX(100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 900;
    display: flex; flex-direction: column;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    /* Pad for safe areas (notch/gesture bar) */
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
    will-change: transform;
    box-shadow: var(--shadow-lg);
  }
  [dir="ltr"] .mobile-drawer { right: auto; left: 0; transform: translateX(-100%); }
  .mobile-drawer.is-open { transform: translateX(0); }

  .drawer-header {
    display: flex; align-items: center; gap: var(--space-2);
    padding: 12px var(--space-4); border-bottom: 1px solid var(--border-color);
    flex-shrink: 0;
  }
  .drawer-close {
    /* [UI-3.7] Was margin-right:auto plus a [dir=ltr] rule to undo it.
       margin-inline-start resolves to the same thing in both directions, so the
       override below is no longer needed. */
    margin-inline-start: auto; background: none; border: none; font-size: var(--text-xl);
    cursor: pointer; color: var(--text-muted); padding: var(--space-2);
    min-width: var(--tap-min, 48px); min-height: var(--tap-min, 48px);
    display: flex; align-items: center; justify-content: center;
  }

  .drawer-nav {
    flex: 1; overflow-y: auto; padding: var(--space-4) 0;
    -webkit-overflow-scrolling: touch;
  }
  .drawer-nav .nav-item,
  .drawer-nav-item {
    display: flex; align-items: center;
    padding: 14px var(--space-4);
    min-height: var(--tap-min, 48px);
    border-radius: 0;
    font-size: var(--text-base); font-weight: 600;
    border-bottom: 1px solid var(--border-color);
  }
  .drawer-nav .nav-item:last-child { border-bottom: none; }
  .drawer-group-label {

   *      and the tier/print restores reset each property they touch to its

   *   2. The card cell rules are wrapped in :where(), so they carry no

   *      .inv-table td:last-child would beat a page's border on the desktop.

  .card-table tr, .inv-table tr {

    border-radius: var(--radius-md);
    margin-bottom: var(--space-2);
    padding: var(--space-2);
    background: var(--bg-surface);

  .card-table td.num::before, .inv-table td.num::before { direction: rtl; }

    .form-grid-wide { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
    /* An honest home for the read-only computed-total strips that legitimately
       want to be dense. */
    .form-grid-narrow { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
    /* [UI-4.8] Back to a real table from tablet-p up. */
    .table-wrap { max-height: 70dvh; }

    .table thead { display: table-header-group; }
    .table tbody { display: table-row-group; }
    .table tr { display: table-row; }
    .table td { display: table-cell; }
    .table tbody tr { border: 0; border-radius: 0; margin: 0; padding: 0; background: transparent; }
    .table tbody td {
      display: table-cell; border: 0; border-bottom: 1px solid var(--border-color);
      padding: 10px 12px; text-align: right;
    }
    .table tbody td[data-label]::before { content: none; }
    .table tbody td.num { text-align: left; }
    .table .dt-sel { display: table-cell; text-align: center; }
    /* [iPhone run] .inv-table back to a real table — layout only. Every
       property here returns to its initial value; the page's own declarations

    .card-table, .inv-table { display: table; }
    .card-table thead, .inv-table thead { display: table-header-group; }
    .card-table tbody, .inv-table tbody { display: table-row-group; width: auto; }
    .card-table tr, .inv-table tr { display: table-row; width: auto; border: 0; border-radius: 0; margin: 0; padding: 0; background: transparent; }
    .card-table td, .inv-table td { display: table-cell; width: auto; align-items: normal; justify-content: normal; gap: normal; }
    .card-table td[data-label]::before, .inv-table td[data-label]::before { content: none; }

    /* Dialogs stop being bottom sheets and centre. */

    .modal { border-radius: var(--radius-lg); max-width: 560px; padding-bottom: 0; }
    .modal.modal-sm { max-width: 420px; }
    .modal.modal-lg { max-width: 880px; }
    .modal.modal-xl { max-width: 1100px; }
    .modal-footer { flex-direction: row; }
    .modal-footer .btn { width: auto; }

    .app-content { padding: var(--space-6); }

   * the tiers and applies within whichever one is active. */

    /* When keyboard is open, shrink modal so it stays above keyboard */

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
