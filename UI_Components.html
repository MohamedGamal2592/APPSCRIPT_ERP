/* ── Side audit-history panel (السجل) ─────────────────────────────────────── */
/* Opens beside the current table: by default shows the LAST record's most
   recent change; when a record is selected (row click or السجل button) it
   shows that record's full history. Detailed log lives in ERP_Record_History. */
UIC.HistorySide = (function () {
  var panel = null, body = null, titleEl = null;

  function ensure() {
    if (panel) return;
    var css = '#history-side{position:fixed;top:0;right:0;height:100%;width:340px;max-width:90vw;background:#fff;' +
      'box-shadow:-4px 0 20px rgba(0,0,0,.15);z-index:9999;transform:translateX(100%);transition:transform .25s ease;' +
      'display:flex;flex-direction:column;direction:rtl;font-family:inherit;}' +
      '#history-side.open{transform:translateX(0);}' +
      '#history-side .hs-head{padding:12px 14px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;}' +
      '#history-side .hs-head h3{margin:0;font-size:15px;}' +
      '#history-side .hs-close{border:none;background:none;font-size:22px;cursor:pointer;line-height:1;}' +
      '#history-side .hs-body{padding:10px 14px;overflow:auto;flex:1;font-size:13px;}' +
      '#history-side .hs-card{border:1px solid #eee;border-radius:8px;padding:8px 10px;margin-bottom:8px;background:#fafafa;}' +
      '#history-side .hs-meta{color:#777;font-size:11px;margin-bottom:4px;}' +
      '#history-side .hs-change{font-size:12px;}' +
      '#history-side .hs-change b{color:#333;}' +
      '#history-side .hs-empty,#history-side .hs-load{color:#999;padding:20px 0;text-align:center;}';
    var st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
    panel = document.createElement('div'); panel.id = 'history-side';
    panel.innerHTML = '<div class="hs-head"><h3 id="hs-title">السجل</h3>' +
      '<button class="hs-close" onclick="UIC.HistorySide.close()">×</button></div>' +
      '<div class="hs-body" id="hs-body"></div>';
    document.body.appendChild(panel);
    body = panel.querySelector('#hs-body');
    titleEl = panel.querySelector('#hs-title');
    document.addEventListener('click', onDocClick);
  }

  function onDocClick(e) {
    var el = e.target.closest('[data-history-id]');
    if (el) { open(el.getAttribute('data-sheet') || window.SHEET, el.getAttribute('data-history-id')); return; }
    var row = e.target.closest('tr[data-id]');
    if (row && window.SHEET && !e.target.closest('button,a,input,select,textarea,[data-no-history]')) {
      open(window.SHEET, row.getAttribute('data-id'));
    }
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function render(rows) {
    if (!rows || !rows.length) { body.innerHTML = '<div class="hs-empty">لا يوجد سجل</div>'; return; }
    var html = '';
    rows.forEach(function (r) {
      var changed = (r.old_value || '') + '  →  ' + (r.new_value || '');
      html += '<div class="hs-card">' +
        '<div class="hs-meta">#' + esc(r.record_id || r.record_uid) + ' · ' + esc(r.action) +
        ' · ' + esc(typeof uname_ === 'function' ? uname_(r.changed_by) : r.changed_by) + ' · ' + esc(r.changed_at) + '</div>' +
        '<div class="hs-change"><b>' + esc(r.column_name) + ':</b> ' + esc(changed) + '</div>' +
        '</div>';
    });
    body.innerHTML = html;
  }

  function fetchAndRender(sheet, recordId, title) {
    ensure();
    if (!sheet) return;
    panel.classList.add('open');
    titleEl.textContent = title + ' · ' + sheet;
    body.innerHTML = '<div class="hs-load">جاري التحميل...</div>';
    API.call('get_record_history', { sheet_name: sheet, record_id: recordId || '' }, SESSION.token())
      .then(function (r) {
        var rows = (r && r.history) || [];
        if (recordId) { render(rows); return; }
        render(rows.length ? [rows[0]] : []);
      })
      .catch(function (e) { body.innerHTML = '<div class="hs-empty">تعذر التحميل: ' + esc(e.message || e) + '</div>'; });
  }

  function open(sheet, recordId) { fetchAndRender(sheet, recordId, 'السجل'); }
  function showLatest(sheet) { fetchAndRender(sheet, '', 'آخر سجل'); }
  function close() { if (panel) panel.classList.remove('open'); }

  return { open: open, showLatest: showLatest, close: close, ensure: ensure };
})();

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', function () {
    if (window.SHEET && window.ERP_HISTORY_AUTO !== false) UIC.HistorySide.showLatest(window.SHEET);
  });
} else if (window.SHEET && window.ERP_HISTORY_AUTO !== false) {
  UIC.HistorySide.showLatest(window.SHEET);
}

/* ══════════════════════════════════════════════════════════════════════════
 * UIC.Live — saves that feel immediate, and pages that notice each other.
 *
 * The problem this solves is not that Sheets is slow, though it is. It is that
 * every page waited for a full round trip and THEN asked the server to send the
 * whole list back, so the user watched a spinner for the sum of two requests
 * before seeing a change they had already decided on.
 *
 * Apps Script gives no server push — no socket worth having, no long poll — so
 * "realtime" here means two specific things, and neither of them is magic:
 *
 *   1. The row appears the instant you save it, because the browser already
 *      knows what you typed. The request still takes as long as it takes; it
 *      just stops being the thing you wait for. If it fails, the row goes back
 *      exactly as it was and you are told why.
 *
 *   2. Other people's changes arrive within one poll interval, because the poll
 *      is cheap enough to repeat: get_page_versions reads ONE CacheService
 *      entry set, never a spreadsheet, and returns timestamps rather than data.
 *
 * What it deliberately does NOT do:
 *   - It does not merge concurrent edits. Two people saving the same record is
 *     still last-write-wins, exactly as before; the poll makes that VISIBLE
 *     sooner rather than making it safe.
 *   - It does not treat a vanished version stamp as a change. CacheService can
 *     evict, and a storm of refreshes is worse than a missed one.
 * ══════════════════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════════════════
 * [RT-7] UIC.Cache — stale-while-revalidate over localStorage
 *
 * What this is for. Two round trips still sat in front of every form. Reference
 * options are fetched on first form open, which is right, but it is still a
 * wait the first time — on every page, on every navigation — because NOTHING
 * survived a page load. localStorage held preferences, column widths and the
 * session, and no data at all. Every navigation in this application is a full
 * document load, so "nothing survives" means "every screen starts from zero".
 *
 * The contract, and it has one rule that matters more than the rest:
 *
 *   A CACHED VALUE IS ALWAYS RENDERED **AND** ALWAYS REVALIDATED. Never one
 *   without the other. Rendering from cache alone is how a stale option list
 *   becomes a wrong record; revalidating without rendering is just a slow
 *   fetch with extra steps.
 *
 * Freshness rides on the table stamps the previous two commits made reliable.
 * That ordering is not incidental — caching against stamps that miss writes
 * serves stale data with confidence, which is worse than no cache at all.
 *
 * Failure is designed for rather than hoped against. Safari in private mode
 * throws on ACCESS, not on quota, so every read and every write is wrapped;
 * a store that throws, or is full, or has been cleared, degrades to a normal
 * fetch and never to a broken page. The cap is a real cap with LRU eviction,
 * because the alternative to evicting is a quota exception on someone else's
 * unrelated setItem.
 * ══════════════════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════════════════
 * [RT-9] UIC.Router — the shell stops reloading
 *
 * Every in-app navigation is a full top-frame document load: UIC.navTo sets
 * window.top.location.href, doGet runs the kill-switch read, the company
 * registration, the session authentication and the page-access check, and the
 * browser then downloads, parses and executes the whole 190 KB shared bundle
 * again — a bundle that is byte-identical to the one it already has, because
 * HtmlService cannot set Cache-Control. Then the new page's load() makes a
 * SEPARATE round trip for its data. Four serialised stages, a blank screen
 * across all of them, and one of them returns anything the user asked for.
 *
 * The router replaces the middle two for pages that opt in: it fetches the
 * page's own body and script, swaps the content region, and leaves the header,
 * the nav, the drawer and the scroll position exactly where they are.
 *
 * THREE THINGS MAKE THIS SAFE ENOUGH TO SHIP AT ALL:
 *
 * 1. OPT-IN, per page. A page registers itself with UIC.Router.register. Every
 *    page that has not is hard-navigated exactly as today. There is no flag
 *    day and both modes coexist indefinitely.
 *
 * 2. HARD-NAVIGATION FALLBACK on ANY error. Authorization failure, network
 *    failure, a script that throws while mounting — all of them fall through
 *    to the ordinary navigation. The worst case of this whole phase is
 *    precisely today's behaviour.
 *
 * 3. unmount IS THE PHASE. A router that mounts correctly and unmounts
 *    sloppily leaks a watchPage poll for every page visited, and a user's tab
 *    quietly turns into a quota problem over an afternoon. Page scripts here
 *    assume they own the document — they register window listeners, they start
 *    intervals, they call UIC.Live.watchPage — so the router tracks every
 *    timer and every listener started while a page is mounted and tears all of
 *    them down before the next one mounts. A page that cannot prove that is
 *    not converted.
 * ══════════════════════════════════════════════════════════════════════════ */
UIC.Router = (function () {

  var current = null;       /* the action currently mounted */
  var teardown = [];        /* what to undo before the next mount */
  var busy = false;

  var timers = [];
  var intervals = [];

   * While a routed page is mounting and running, window.setTimeout,
   * window.setInterval and window.addEventListener are wrapped so everything
   * the page starts is recorded. This is deliberately blunt: asking eighty-nine
   * page authors to remember to clean up is how leaks happen, and the router
   * is the only place that knows when a page's life ends.

})();

   * full sheet read as seeing it for the first time.

   * visit while the real fetch runs. One list per page, which is all D-K asks
   * for and all any of these pages has.

   * carry action buttons whose onclick names a record id, and a click on a row

   * it is replaced by the real one a moment later. */

    return set(lastPaintKey(), html, {});

    key: keyFor, hash: hash,
    get: get, set: set, remove: remove, bust: bust, clear: clear, swr: swr,
    saveLastPaint: saveLastPaint, lastPaint: lastPaint,

})();

    var entry = queue[0];
    var send = callFor(entry);
    /* An entry from a build that did not stamp target_system cannot be rebuilt
       and cannot be sent from this session. It is NOT dropped: the chip goes on
       saying it is unsaved, which is what it did before, and «تجاهل» is still
       the only thing that removes it. (Rotating it past the live entries would
       cost wire bytes this page does not have — headroom 601 B — so a legacy
       head still waits for the next drain event like it always has. Once any
       save in this session stamps queue._call, callFor drains it normally.) */
    if (!send) { renderChip(); return; }

    entry.tries = (entry.tries || 0) + 1;
    persistQueue();
    send(entry.action, entry.data)
      .then(function () {
        queue.shift();
        persistQueue();
        renderChip();
        try { UIC.toast(entry.message || 'تم حفظ التغيير المؤجل', 'success'); } catch (e) {}
        if (queue.length) scheduleRetry();
      })
      .catch(function (err) {
        if (!err || !err.transport || entry.tries >= RETRY_MAX) {
          /* Either the server has now refused it, or we have tried enough. It
           * stops being a retry and becomes a dead letter (§I6 above): named,
           * persistent, and dismissed only by an explicit ack. */
          queue.shift();
          persistQueue();
          dead.push({ a: entry.action, m: (err && err.transport) ? 'تعذر الاتصال — أعد إدخال التغيير' : ((err && err.message) || 'تعذر الحفظ') });
          persistDead();
          renderChip();
        }
        if (queue.length) scheduleRetry();
      });
  }

  /* ── The navigation guard ────────────────────────────────────────────────
   *
   * UIC.trackDirty already refuses to leave with unsaved FORM state. An
   * optimistic row is the same problem one step later: it is on screen, it is
   * not in the sheet yet, and leaving the page that drew it loses it with no
   * trace. So leaving is refused while anything is in flight or queued. */
  /* ── [§I7/§I8] The page-side half of the contract ─────────────────────────
   *
   * The row is already flagged: draft.__pending is true until the server's
   * record replaces it (pinned by s18). Pages render a __pending row with the
   * .rt-stale treatment — inert actions, dimmed — because its buttons name a
   * __tmp_ id the server has never seen, and they keep __pending rows across
   * a quiet refresh. This file's half is below: userIsBusy() counts pending
   * saves, so arrive() defers the refresh while anything is unconfirmed. */
  function pendingCount() { return inFlight + queue.length; }

  function guardMessage() {
    var n = pendingCount();
    if (!n) return null;
    return n === 1
      ? 'هناك تغيير لم يُحفظ بعد. الخروج الآن سيفقده.'
      : ('هناك ' + n + ' تغييرات لم تُحفظ بعد. الخروج الآن سيفقدها.');
  }

  /**
   * [§I1] A client-minted natural key, in the shape the server's own uid16_
   * produces, so a row created from a client key is indistinguishable from one
   * created from a server key.
   *
   * This IS the idempotency key. It is minted ONCE, before the first attempt,
   * and it travels inside o.data — which is what the queue persists — so every
   * retry re-sends the same one. A fresh key per attempt would defeat the whole
   * mechanism, which is why nothing regenerates it on the retry path.
   */
  function uid16() {
    return (Math.random().toString(16).slice(2) + Math.random().toString(16).slice(2) + '0000000000000000').slice(0, 16);
  }

  function save(o) {
    o = o || {};
    var list = o.list;
    var key = o.key;
    var draft = o.draft;
    var canPatch = !!(list && key && draft && typeof o.render === 'function');
    /* Mint the natural key when the caller asked for one and has not supplied
       it. Never overwrite: a page that mints its own (because the draft row
       needs the same value) stays in charge of it. */
    if (o.uid && o.data && !o.data[o.uid]) o.data[o.uid] = uid16();

    /* Enough state to put the list back EXACTLY as it was. */
    var undo = null;
    if (canPatch) {
      if (!draft[key]) draft[key] = '__tmp_' + Math.random().toString(36).slice(2, 10);
      draft.__pending = true;
      var at = indexOfKey(list, key, draft[key]);
      if (at === -1) {
        list.unshift(draft);
        undo = { kind: 'insert' };
      } else {
        undo = { kind: 'replace', at: at, was: list[at] };
        list[at] = draft;
      }
      try { o.render(); } catch (e) {}
    }

    if (o.modal) { try { UIC.closeModal(o.modal); } catch (e) {} }
    /* A quiet indicator, not the blocking overlay: the point is that the user
       is free to carry on. */
    setBusy(inFlight + 1);
    inFlight++;

    var wire = o.call(o.action, o.data);
    /* [RT-4b] Captured SYNCHRONOUSLY, not in the .catch below: companyCall has
     * already called API.call by the time it returns its promise, so this is
     * the target of THIS call and not of whatever the page did next. An
     * explicit o.targetSystem (additive option) always wins. */
    var target = o.targetSystem || (window.API && API._lastTarget) || '';

    return wire
      .then(function (resp) {
        if (canPatch) {
          var rec = null;
          try { rec = o.recordOf ? o.recordOf(resp) : (resp && (resp.record || (resp.data && resp.data.record))); } catch (e) { rec = null; }
          var at2 = indexOfKey(list, key, draft[key]);
          if (rec && typeof rec === 'object') {
            /* The server's version wins — it carries the assigned id and any
               field the server computed. */
            rec.__pending = false;
            if (at2 !== -1) list[at2] = rec; else list.unshift(rec);
          } else if (at2 !== -1) {
            /* No record came back. Keep what we drew, but drop the temporary
               key so a later real load replaces it rather than duplicating it. */
            delete list[at2].__pending;
            if (String(list[at2][key]).indexOf('__tmp_') === 0) list[at2].__stale = true;
          }
          try { o.render(); } catch (e) {}
        }
        try { UIC.toast((resp && resp.message) || o.message || 'تم الحفظ', 'success'); } catch (e) {}
        if (typeof o.onSuccess === 'function') o.onSuccess(resp);
        /* Nothing reloads here. That second round trip is what this replaces. */
        return resp;
      })
      .catch(function (err) {
        /* [RT-4] A request that never reached a handler is retried, not
         * thrown away. The row stays on screen marked pending and the chip
         * says so, because the payload is still good and the user's change is
         * still going to land. Everything else — a handler that refused the
         * payload — rolls back exactly as it always has, because retrying a
         * rejection just shows the same error five times. */
        /* ── [§I3] Queueable is a SEPARATE axis from tier ──────────────────
         *
         *   Tier      decides whether the row is drawn before the server
         *             answers.
         *   Queueable decides whether the write may be replayed later.
         *
         * They are independent, and a save may be optimistic and NOT
         * queueable. A write is only allowed into the queue when a replay
         * cannot duplicate it — which, on the server, means its handler
         * dedupes on the unique_id this payload carries (liveDedupe_ in
         * 02_DataAccess.js). A save that fails that test is never queued: it
         * rolls back and says so, loudly and immediately. Losing a write the
         * user is TOLD about beats duplicating a cash row they are not.
         *
         * `queueable` is an additive option and defaults to today's behaviour,
         * so the seven pages already on UIC.Live are unchanged. Every page
         * converted from here on states it explicitly. */
        if (err && err.transport && o.queueable !== false) {
          /* `_call` stays as the same-session sender, so a save whose call is
             not a companyCall still retries while this tab is open. What is new
             is `target_system`: one string, which JSON can carry, so the entry
             can be REBUILT after a reload instead of rotting. */
          queue._call = o.call;
          enqueue({
            v: 1,
            target_system: target,
            action: o.action,
            data: o.data,
            message: o.message || 'تم الحفظ',
            tries: 0,
            at: Date.now()
          });
          try { UIC.toast('لا يوجد اتصال — سيتم الحفظ تلقائيًا', 'error'); } catch (e) {}
          if (typeof o.onError === 'function') o.onError(err);
          throw err;
        }
        if (canPatch && undo) {
          var at3 = indexOfKey(list, key, draft[key]);
          if (undo.kind === 'insert') { if (at3 !== -1) list.splice(at3, 1); }
          else if (at3 !== -1) list[at3] = undo.was;
          try { o.render(); } catch (e) {}
        }
        /* [§I3/§I6] A transport failure that was refused entry to the queue is
           NOT the same event as a refusal, and the driver's own message
           ("network") does not tell the user what happened to their change. It
           is named, because losing a write the user is told about is only
           better than duplicating one if they are actually told. */
        try {
          UIC.toast((err && err.transport)
            ? 'تعذر الاتصال — لم يتم تسجيل التغيير، أعد إدخاله'
            : ((err && err.message) || 'تعذر الحفظ — لم يتم تسجيل التغيير'), 'error');
        } catch (e) {}
        if (typeof o.onError === 'function') o.onError(err);
        else if (!canPatch && typeof o.reload === 'function') o.reload();
        throw err;
      })
      .finally(function () {
        inFlight = Math.max(0, inFlight - 1);
        setBusy(inFlight);
      });
  }

  /** A non-blocking "still saving" hint in the corner. */
  function setBusy(n) {
    var el = document.getElementById('uic-live-busy');
    if (n <= 0) { if (el) el.remove(); return; }
    if (!el) {
      el = document.createElement('div');
      el.id = 'uic-live-busy';
      el.className = 'uic-live-busy';
      document.body.appendChild(el);
    }
    el.textContent = n === 1 ? 'جاري الحفظ...' : ('جاري حفظ ' + n + ' تغييرات...');
  }

  /** True while any optimistic save is still on the wire. */
  function busy() { return inFlight > 0; }

  /* ── [RT-6] How another device's change ARRIVES ──────────────────────────
   *
   * watchPage answers "did something move?". What every page then did with that
   * answer was call its own load(true) — a full, quiet refetch that redraws the
   * list. That is correct and it is also rude: it moves the page under someone
   * who is reading row forty, and it can redraw the row behind a form they are
   * halfway through filling.
   *
   * So the arrival is now split on one question — is the user in the middle of
   * something?
   *
   *   NO  (at the top, no modal, not typing, nothing selected) → refresh in
   *       place immediately, and flash the table briefly so the change is
   *       noticed rather than silently swapped in.
   *
   *   YES → do NOTHING to the page. Raise a chip that says there is something
   *       new and refreshes when it is clicked. The user decides when the
   *       ground moves.
   *
   * The chip is deliberately dismissible-by-use rather than on a timer: a
   * change that arrived while you were typing is still there when you finish.
   */
  var freshRefresh = null;

  function userIsBusy() {
    try {
      /* [§I8] A pending save is the busiest state there is: a quiet refresh
         redraws from the server, which does not have the row yet, so the
         optimistic row would disappear while the chip insists it is pending. */
      if (pendingCount() > 0) return true;
      /* A modal is open — almost always a form. */
      if (document.querySelector && document.querySelector('.modal-backdrop, .uic-modal, [data-modal-open="true"]')) return true;
      /* Typing. */
      var a = document.activeElement;
      if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(String(a.tagName || '').toUpperCase())) return true;
      /* Scrolled away from the top of the list. */
      var y = window.scrollY || window.pageYOffset || 0;
      if (y > 120) return true;
      /* Rows are selected for a batch action; redrawing would drop them. */
      if (document.querySelector && document.querySelector('.dt-batch:not([hidden])')) return true;
    } catch (e) {}
    return false;
  }

  function showFreshChip() {
    var el = document.getElementById('uic-live-fresh');
    if (!el) {
      el = document.createElement('div');
      el.id = 'uic-live-fresh';
      el.className = 'uic-live-fresh';
      el.setAttribute('role', 'status');
      document.body.appendChild(el);
    }
    /* Honest wording. The poll returns timestamps, not rows, so the number of
     * new rows is not known here and is not claimed. */
    el.innerHTML = '<button type="button" class="uic-live-fresh-go" onclick="UIC.Live.applyFresh()">' +
      'هناك تغييرات جديدة · اضغط للتحديث</button>';
  }

  function hideFreshChip() {
    var el = document.getElementById('uic-live-fresh');
    if (el && el.remove) el.remove();
  }

  /** Refresh now, from the chip. */
  function applyFresh() {
    var fn = freshRefresh;
    freshRefresh = null;
    hideFreshChip();
    if (typeof fn === 'function') { try { fn(); } catch (e) {} }
  }

  /**
   * Called by a page from its watchPage onChange, in place of refreshing
   * directly. `refresh` is the page's own quiet reload.
   */
  function arrive(refresh) {
    if (typeof refresh !== 'function') return;
    if (userIsBusy()) { freshRefresh = refresh; showFreshChip(); return; }
    hideFreshChip();
    freshRefresh = null;
    try { refresh(); } catch (e) {}
    /* A brief flash, so a silent swap is not mistaken for nothing happening. */
    try {
      var host = document.querySelector('.table-wrap');
      if (host && host.classList) {
        host.classList.add('rt-arrived');
        setTimeout(function () { try { host.classList.remove('rt-arrived'); } catch (e) {} }, 900);
      }
    } catch (e) {}
  }

  /* ── change polling ──────────────────────────────────────────────────── */
  var watch = null;

  /**
   * Poll for other devices' changes to the tables this page uses.
   *
   * QUOTA, stated plainly: every poll is a real Apps Script execution. At the
   * 30s default, twenty people with the page open cost ~2400 executions an
   * eight-hour day before anyone saves anything. That is affordable on a
   * Workspace account and is NOT affordable at a 2-second interval, which is
   * why the interval is floored at 10s, paused entirely while the tab is
   * hidden, and stopped after fifteen idle minutes until the tab is touched
   * again.
   *
   * @param {object} o
   *   call        function(action, data) -> Promise
   *   page        string          the page id, e.g. 'vf_cash'
   *   intervalMs  number          default 30000, floored at 10000
   *   onChange    function(tables) called with the names that moved
   */
  function watchPage(o) {
    o = o || {};
    if (!o.call || !o.page || typeof o.onChange !== 'function') return;
    unwatchPage();

    var interval = Math.max(MIN_INTERVAL, Number(o.intervalMs) || DEFAULT_INTERVAL);
    var seen = null;             // null until the first reply sets the baseline
    var lastActive = Date.now();
    var failures = 0;
    var timer = null;
    var stopped = false;

    function touch() { lastActive = Date.now(); }
    ['click', 'keydown', 'focus'].forEach(function (ev) {
      window.addEventListener(ev, touch, true);
    });

    function schedule(ms) {
      if (stopped) return;
      timer = setTimeout(tick, ms);
    }

    function tick() {
      if (stopped) return;
      /* Do not poll a page nobody is looking at, and do not poll over a save
         that has not landed — the reply would undo the row the user just saw
         appear. */
      var hidden = (typeof document.hidden === 'boolean') ? document.hidden : false;
      if (hidden || busy() || (Date.now() - lastActive) > IDLE_STOP_MS) {
        schedule(interval);
        return;
      }
      o.call('get_page_versions', { page: o.page })
        .then(function (resp) {
          failures = 0;
          var now = (resp && resp.versions) || {};
          if (seen === null) { seen = now; schedule(interval); return; }
          var moved = [];
          Object.keys(now).forEach(function (t) {
            /* A stamp that EXISTS and DIFFERS is a change. A stamp that has
               disappeared is a cache eviction and means nothing. */
            if (seen[t] !== undefined && seen[t] !== now[t]) moved.push(t);
            else if (seen[t] === undefined) seen[t] = now[t];
          });
          seen = now;
          if (moved.length) {
            /* [RT-7] A table moved, so anything this device has cached for it
             * is now known-wrong rather than merely old. The whole cache is
             * dropped rather than the entries for those tables specifically:
             * cache keys are company+action+payload and the action-to-table
             * map lives on the server, so picking out "the entries for this
             * table" would mean shipping that map to the client and keeping
             * two copies of it in step. A user has ONE page open, so the cost
             * of the coarse version is a handful of refetches at exactly the
             * moment refetching is what you want — someone else just wrote. */
            try { UIC.Cache.bust(); } catch (e) {}
            try { o.onChange(moved); } catch (e) {}
          }
          schedule(interval);
        })
        .catch(function () {
          /* Back off rather than hammer a system that is already unhappy. */
          failures++;
          schedule(Math.min(interval * Math.pow(2, Math.min(failures, 4)), 5 * 60 * 1000));
        });
    }

    watch = {
      stop: function () {
        stopped = true;
        if (timer) clearTimeout(timer);
        ['click', 'keydown', 'focus'].forEach(function (ev) {
          window.removeEventListener(ev, touch, true);
        });
      }
    };
    schedule(interval);
  }

  function unwatchPage() {
    if (watch) { try { watch.stop(); } catch (e) {} watch = null; }
  }

  /* Anything queued from a previous session is picked up on load, so a change
   * made just before the tab was closed is not lost — it is retried the moment
   * the page comes back.
   *
   * That sentence used to be false. loadQueue() ran, the chip appeared, and
   * nothing ever started a drain: scheduleRetry() was not called here, and
   * drainQueue() would have refused anyway because the persisted array has no
   * `_call`. Both halves are fixed — callFor() rebuilds the request from the
   * entry, and the drain is armed below. */
  loadQueue();
  loadDead();
  try {
    if (queue.length || dead.length) {
      renderChip();
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function () { renderChip(); });
      }
      scheduleRetry();
    }
    /* [§I4] Another tab moved the queue. Re-read and re-render — never race it.
       This is what stops a follower's stale in-memory copy from being written
       back over the leader's progress. */
    window.addEventListener('storage', function (e) {
      if (e && e.key === RETRY_KEY) { loadQueue(); renderChip(); }
    });
    window.addEventListener('online', function () { retryNow(); });
    window.addEventListener('beforeunload', function (e) {
      var msg = guardMessage();
      if (!msg) return undefined;
      e.preventDefault();
      e.returnValue = msg;
      return msg;
    });
  } catch (e) {}

  /** Retry now, from the chip or from the network coming back. */
  function retryNow() {
    if (retryTimer) { try { clearTimeout(retryTimer); } catch (e) {} retryTimer = null; }
    drainQueue();
  }

  /** The user's explicit "I accept losing these". Never automatic.
   *
   * OPEN QUESTION for the owner (plan §11.1): discarding a real write is the
   * one remaining way this system can lose data on purpose, and «تجاهل» is
   * available to every user. The stated default is implemented unchanged — it
   * stays available to anyone — and is recorded as an open question. */
  function discardQueue() {
    if (!queue.length) return;
    var n = queue.length;
    var ok = true;
    try {
      ok = window.confirm(n === 1
        ? 'سيتم تجاهل تغيير لم يُحفظ. متابعة؟'
        : ('سيتم تجاهل ' + n + ' تغييرات لم تُحفظ. متابعة؟'));
    } catch (e) {}
    if (!ok) return;
    queue.length = 0;
    persistQueue();
    renderChip();
  }

  /** Acknowledge the dead letters. See the §I6 note on persistDead: the click
   * is the acknowledgement, so unlike discardQueue this asks nothing. */
  function ackDead() {
    dead.length = 0;
    persistDead();
    renderChip();
  }


  return {
    save: save,
    busy: busy,
    watchPage: watchPage,
    unwatchPage: unwatchPage,
    /* [RT-4] pending() counts saves in flight AND changes queued for retry.
     * The navigation guard and UIC.navTo both read it: leaving a page while an
     * optimistic row is unsaved loses it with the page that drew it. */
    pending: pendingCount,
    guardMessage: guardMessage,
    /* [RT-6] A page's watch calls arrive() instead of refreshing directly, so
     * the decision "may the list move right now?" is made in ONE place rather
     * than seventy. */
    arrive: arrive,
    applyFresh: applyFresh,
    retryNow: retryNow,
    discardQueue: discardQueue,
    ackDead: ackDead,
    queued: function () { return queue.length; }
  };
})();

</script>
