 *
 * The app's icons were emoji (📥 🖨️ 👤 🚪 🎨), HTML entities (&#9662;) and bare
 * text, mixed. Emoji are rendered by the OPERATING SYSTEM, so the same button is
 * a flat glyph on Windows, a colourful one on Android and a third thing on iOS;
 * they cannot inherit the text colour, cannot be sized reliably, and carry
 * accessible names ("outbox tray") that have nothing to do with what the button
 * does.
 *
 * These are 24×24 stroke paths on `currentColor`, so an icon is automatically
 * the right colour in the topbar, on a primary button and under all three
 * company themes, with no per-theme rules at all.
 *
 * WHY INLINE PATHS RATHER THAN A <symbol>/<use> SPRITE: several pages open a
 * NEW WINDOW and write a document into it (UIC.printTable, and the per-company
 * print pages). A document-level sprite does not exist in that window, so every
 * <use> reference would render as nothing — and print is exactly where a
 * missing icon is least recoverable. Inline paths are self-contained and work
 * anywhere the markup lands. The cost is bytes in the emitted HTML, which is
 * why UIC.icon is used in toolbars, tiles, dialogs and empty states, and NOT
 * per table row: the row action stays a text glyph so the DOM cost per row is

/**
 * UIC.icon(name, opts) -> inline <svg> string.
 *
 *   opts.size       px, default 20
 *   opts.className  extra classes
 *   opts.label      accessible name. Without it the icon is aria-hidden, which
 *                   is correct when it sits next to visible text; with it the
 *                   icon becomes the accessible name of an icon-only control.
 *
 * Returns '' for an unknown name rather than throwing, so a typo degrades to a
 * missing glyph instead of a blank page.
 */
UIC.icon = function (name, opts) {
  var o = opts || {};
  var d = UIC.ICONS[name];
  if (!d) return '';
  var size = o.size || 20;
  var a11y = o.label
    ? ' role="img" aria-label="' + UIC.escHtml(o.label) + '"'
    : ' aria-hidden="true" focusable="false"';
  return '<svg class="uic-icon' + (o.className ? ' ' + o.className : '') + '"' +
    ' width="' + size + '" height="' + size + '" viewBox="0 0 24 24"' +
    ' fill="none" stroke="currentColor" stroke-width="1.8"' +
    ' stroke-linecap="round" stroke-linejoin="round"' + a11y + '>' + d + '</svg>';
};

UIC.button = function (opts) {
  const o = opts || {};
  const type = o.type || 'primary';
  const cls = 'btn btn-' + type + (o.icon && !o.text ? ' btn-icon-only' : '');
  const icon = o.icon ? '<span class="btn-icon">' + o.icon + '</span>' : '';
  const attrs = o.onClick ? ' onclick="' + o.onClick + '"' : '';
  const disabled = o.disabled ? ' disabled' : '';
  return '<button class="' + cls + '"' + attrs + disabled + ' title="' + (o.tooltip || '') + '">' + icon + '<span>' + (o.text || '') + '</span></button>';
};

UIC.actionBtns = function (btns) {
  // Now delegates to dropdown for list-view pleadability — single unified look
  return UIC.actionDropdown(btns);
};

/* ── [UI-1.2 / U-01] Escaping the table's clip box ────────────────────────
 *
 * `.table-wrap` sets `overflow-x: auto` so wide tables scroll instead of the
 * page. That makes it a clipping box, and any `position: absolute` popup inside
 * it — a row's action menu, a combo list in a cell — is cut off at its edge. On
 * the last row of a table the menu is invisible entirely.
 *
 * A `position: fixed` element is laid out against the viewport and is NOT
 * clipped by an ancestor's overflow, so switching the popup to fixed while it is
 * open solves it WITHOUT reparenting the element into <body>. That matters: the
 * combo's blur/pick/keyboard handlers and the outside-click handlers all walk
 * the DOM with `.closest('.combo')`, and moving the node would silently break
 * every one of them.
 *
 * The one catch is that `position: fixed` resolves against the nearest ancestor
 * that establishes a containing block — an ancestor with `transform`, `filter`,
 * `contain` or `will-change: transform`. `.modal` carries
 * `will-change: transform`, so a combo inside a dialog would land in the wrong
 * place. Rather than enumerate those cases, the helper writes the coordinates,
 * measures where the element actually landed, and corrects by the difference.
 * That is exact for every containing block, present or future. */
UIC._anchored = [];

UIC._anchorFixed = function (el, anchor, opts) {
  if (!el || !anchor) return;
  var o = opts || {};
  var GAP = 4, EDGE = 8;
  try {
    /* Remember the inline styles so _unanchor can put them back exactly. */
    if (el.__uicHome === undefined) el.__uicHome = el.getAttribute('style') || '';

    el.style.position = 'fixed';
    el.style.margin = '0';
    /* A combo list must stay exactly as wide as its input; its CSS achieved that
       with `left:0; right:0`, which no longer applies once it is fixed. */
    if (o.matchWidth) el.style.width = anchor.getBoundingClientRect().width + 'px';

    var a = anchor.getBoundingClientRect();
    var m = el.getBoundingClientRect();
    var vw = window.innerWidth || document.documentElement.clientWidth;
    var vh = window.innerHeight || document.documentElement.clientHeight;

    /* Vertical: below the anchor, flipping above when there is no room. */
    var below = vh - a.bottom - GAP;
    var above = a.top - GAP;
    var flip = (m.height > below) && (above > below);
    var top = flip ? (a.top - m.height - GAP) : (a.bottom + GAP);
    top = Math.max(EDGE, Math.min(top, vh - m.height - EDGE));

    /* Horizontal: RTL is the primary direction, so align the popup's END edge
       with the anchor's, then clamp into the viewport. */
    var rtl = (document.documentElement.getAttribute('dir') || '').toLowerCase() === 'rtl';
    var left = rtl ? (a.right - m.width) : a.left;
    left = Math.max(EDGE, Math.min(left, vw - m.width - EDGE));

    el.style.left = left + 'px';
    el.style.top = top + 'px';
    el.style.right = 'auto';
    el.style.bottom = 'auto';

    /* Measure, then correct for any containing block that is not the viewport. */
    var got = el.getBoundingClientRect();
    var dx = left - got.left, dy = top - got.top;
    if (dx || dy) {
      el.style.left = (left + dx) + 'px';
      el.style.top = (top + dy) + 'px';
    }

    if (UIC._anchored.indexOf(el) === -1) UIC._anchored.push(el);
    UIC._anchored.__reanchor = UIC._anchored.__reanchor || {};
    el.__uicAnchor = anchor;
    el.__uicOpts = o;
  } catch (e) {}
};

UIC._unanchor = function (el) {
  if (!el) return;
  try {
    if (el.__uicHome !== undefined) {
      if (el.__uicHome) el.setAttribute('style', el.__uicHome);
      else el.removeAttribute('style');
      el.__uicHome = undefined;
    }
    el.__uicAnchor = null;
    var i = UIC._anchored.indexOf(el);
    if (i !== -1) UIC._anchored.splice(i, 1);
  } catch (e) {}
};

/* Anything open follows its anchor while the page or a table scrolls. Capture
 * phase, because the scroll happens on `.table-wrap`, not on the window. */
(function () {
  var queued = false;
  var reflow = function () {
    if (queued || !UIC._anchored.length) return;
    queued = true;
    requestAnimationFrame(function () {
      queued = false;
      UIC._anchored.slice().forEach(function (el) {
        if (!el.__uicAnchor || !el.__uicAnchor.isConnected) return;
        UIC._anchorFixed(el, el.__uicAnchor, el.__uicOpts);
      });
    });
  };
  window.addEventListener('scroll', reflow, true);
  window.addEventListener('resize', reflow);
})();

/* Row action menu open/close. The menu element stays where it is in the DOM, so
 * `.action-dropdown.open .action-dropdown-menu { display: flex }` still applies;
 * only its positioning changes. */
UIC.openActionMenu = function (id, ev) {
  try { if (ev && ev.stopPropagation) ev.stopPropagation(); } catch (e) {}
  var wrap = document.getElementById(id);
  if (!wrap) return;
  var menu = wrap.querySelector('.action-dropdown-menu');
  var btn = wrap.querySelector('button');
  document.querySelectorAll('.action-dropdown.open').forEach(function (el) {
    if (el !== wrap) UIC.closeActionMenu(el.id);
  });
  wrap.classList.add('open');
  if (btn) btn.setAttribute('aria-expanded', 'true');
  if (menu && btn) UIC._anchorFixed(menu, btn, {});
};

UIC.closeActionMenu = function (id) {
  var wrap = document.getElementById(id);
  if (!wrap) return;
  wrap.classList.remove('open');
  var btn = wrap.querySelector('button');
  if (btn) btn.setAttribute('aria-expanded', 'false');
  var menu = wrap.querySelector('.action-dropdown-menu');
  if (menu) UIC._unanchor(menu);
};

UIC.toggleActionMenu = function (id, ev) {
  var wrap = document.getElementById(id);
  if (!wrap) return;
  if (wrap.classList.contains('open')) UIC.closeActionMenu(id);
  else UIC.openActionMenu(id, ev);
};

UIC.actionDropdown = function (btns) {
  if (!btns || !btns.length) return '';
  var id = 'ad_' + Math.random().toString(36).slice(2, 8);
  var items = btns.map(function (b) {
    if (!b) return '';
    var color = b.color ? 'color:' + b.color + ';' : '';
    var extra = b.color ? 'border-color:transparent;' : '';
    /* Styling moved to .erp-kebab-item in the stylesheet — an inline style
       block per item, on every row, was both unthemeable and pure payload. */
    return '<button type="button" class="action-dropdown-item erp-kebab-item"' +
      (b.color ? ' style="color:' + b.color + ';"' : '') +
      ' onclick="' + b.onclick.replace(/"/g, '&quot;') + ';try{UIC.closeActionMenu(\'' + id + '\');}catch(e){}">' +
      UIC.escHtml(b.label) + '</button>';
  }).join('');
  /* [UI-3.3 / U-20] A quiet kebab, not a primary-coloured pill on every row.
   *
   * A 50-row list drew 50 filled brand-coloured buttons reading
   * "إجراءات / Actions", which is the loudest thing on the page and competes
   * with the data for attention — the opposite of what a row action should do.
   * The glyph is a text character, NOT UIC.icon, deliberately: this is the one
   * control that renders once per row, and an inline <svg> here would add two
   * elements to every row of every list in the app.
   *
   * The button is quiet until the row is hovered ON POINTER DEVICES ONLY. On
   * touch, and for keyboard focus, it is always visible — a hover-only action
   * with no other path is unusable on the tablets and phones this app has to
   * support. See the (hover: hover) and (pointer: fine) guard in the stylesheet.
   *
   * [UI-1.2 / U-01] z-index 1400 matches .combo-list: once the menu is
   * positioned against the viewport it is no longer stacked inside the table,
   * so it must clear the sticky table header and the topbar. */
  return '<div class="action-dropdown erp-kebab" id="' + id + '">' +
    '<button type="button" class="erp-kebab-btn" aria-haspopup="true" aria-expanded="false"' +
    ' aria-label="إجراءات" title="إجراءات" onclick="UIC.toggleActionMenu(\'' + id + '\', event)">⋮</button>' +
    '<div class="action-dropdown-menu erp-kebab-menu" style="display:none;position:absolute;right:0;top:100%;margin-top:6px;z-index:1400;min-width:200px;background:var(--bg-surface,#fff);border:1px solid var(--border-color,#e5e7eb);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:6px;flex-direction:column;gap:2px;max-height:320px;overflow:auto;">' + items + '</div></div>';
};
document.addEventListener('click', function(e){
  document.querySelectorAll('.action-dropdown.open').forEach(function(el){
    if(!el.contains(e.target)) UIC.closeActionMenu(el.id);
  });
});
/* Escape closes an open row menu, matching the drawer and the combo. */
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  document.querySelectorAll('.action-dropdown.open').forEach(function (el) { UIC.closeActionMenu(el.id); });
});
(function(){
  var st=document.createElement('style');
  st.textContent='.action-dropdown.open .action-dropdown-menu{display:flex!important;} .action-dropdown-item:hover{background:var(--bg-subtle,#f3f4f6)!important;}';
  document.head.appendChild(st);
})();

UIC.statusPill = function (label, tone) {
  const t = tone || 'neutral';
  return '<span class="pill pill-' + t + '">' + (label || '') + '</span>';
};

UIC.pageAuthorized_ = function (action) {
  const up = window.USER_PAGES;
  if (!up) return true;
  return !!(up[action] && up[action].length);
};
UIC.canAdd_ = function (page) {
  const p = page || window.CURRENT_ACTION;
  const up = window.USER_PAGES;
  if (!up) return true;
  if (window.IS_SUPER_ADMIN) return true;
  const grants = up[p] || [];
  return grants.includes('write') || grants.includes('full');
};
UIC.canFull_ = function (page) {
  const p = page || window.CURRENT_ACTION;
  const up = window.USER_PAGES;
  if (!up) return true;
  if (window.IS_SUPER_ADMIN) return true;
  const grants = up[p] || [];
  return grants.includes('full');
};

/* Navigation helpers — never depend on fragile globals; fall back to the
 * current page URL so links (logo, nav, dropdowns) always work. */
UIC.baseUrl = function () {
  if (window.scriptUrl) return window.scriptUrl;
  try { if (window.top && window.top !== window) return window.top.location.origin + window.top.location.pathname; } catch (e) {}
  return window.location.origin + window.location.pathname;
};
UIC.token = function () {
  try { return window.SESSION_TOKEN || new URLSearchParams(window.location.search).get('sessionToken') || ''; }
  catch (e) { return ''; }
};

/* Navigate to an in-app URL. Prefers TOP-frame navigation so the address bar
 * reflects ?action=… (back/forward + deep-links work); falls back to iframe
 * navigation if the sandbox blocks top-navigation. `ev` = click event. */
UIC.navTo = function (ev, href) {
  try { if (ev && ev.preventDefault) ev.preventDefault(); } catch (e) {}
  if (!href) return;
  try { UIC.showPageLoading('جاري التحميل...'); } catch (e) {}
  try { if (window.top && window.top !== window) { window.top.location.href = href; return; } } catch (e) {}
  window.location.href = href;
};

/* ── [UI-3.4 / U-24] The ONE loading overlay ──────────────────────────────
 *
 * There were four implementations, each with its own look:
 *   UI.showSpinner      #app-spinner, a token-styled card — the best of them
 *   UIC.showPageLoading #page-loading, hardcoded #4a90d9 on rgba(255,255,255,.6)
 *   ERPFlow.start       #erp-flow-overlay, on the 3 pages that include ERP_Flow
 *   two page-local overlays in ValleyFoods, one with a hardcoded #875A7B spinner
 *
 * So the same action showed a different spinner depending on which page you were
 * on, and on the three ERP_Flow pages TWO overlays fired on a single navigation.
 *
 * There is now one element, one markup, one stylesheet, and everything else
 * delegates. The markup and CSS kept are the ones from UI.showSpinner, because
 * they were already written against the token layer — the other three were not.
 *
 * Ref-counted: nested callers (a page starts a save while a navigation overlay
 * is already up) do not hide each other's overlay. The count is clamped at zero
 * so a stray hide, such as the boot watchdog below, can never make it negative
 * and strand the overlay on screen forever.
 */
UIC._loadCount = 0;
UIC._loadTimer = null;

UIC.ensurePageLoading = function () {
  if (document.getElementById('page-loading')) return;
  var st = document.createElement('style');
  st.textContent =
    '#page-loading{position:fixed;inset:0;z-index:1500;display:none;align-items:center;justify-content:center;background:rgba(17,24,39,.4);}' +
    '#page-loading.show{display:flex;}' +
    '.spinner-box{display:flex;flex-direction:column;align-items:center;gap:12px;background:var(--bg-surface,#fff);padding:24px 32px;border-radius:var(--radius-md,8px);box-shadow:var(--shadow-lg,0 10px 30px rgba(0,0,0,.12));max-width:90vw;}' +
    '.spinner{width:32px;height:32px;border:3px solid var(--brand-border,#e5e7eb);border-top-color:var(--brand-primary,#111827);border-radius:50%;animation:erp-spin .8s linear infinite;will-change:transform;}' +
    '.spinner-msg{font-size:var(--text-sm,13px);color:var(--text-muted,#5b6572);text-align:center;}' +
    '@keyframes erp-spin{to{transform:rotate(360deg);}}' +
    /* Someone who has asked for reduced motion gets a pulse, not a spin. */
    '@media (prefers-reduced-motion: reduce){.spinner{animation:none;opacity:.6;}}';
  document.head.appendChild(st);
  var d = document.createElement('div');
  d.id = 'page-loading';
  d.className = 'spinner-overlay';
  d.setAttribute('role', 'status');
  d.setAttribute('aria-live', 'polite');
  d.innerHTML = '<div class="spinner-box"><div class="spinner"></div>' +
    '<div class="spinner-msg">جاري التحميل...</div></div>';
  document.body.appendChild(d);
};

/** Set the visible message. `msg` may be a string or an array to cycle through. */
UIC._loadMessage = function (msg) {
  var d = document.getElementById('page-loading');
  if (!d) return;
  var m = d.querySelector('.spinner-msg');
  if (!m) return;
  if (UIC._loadTimer) { clearInterval(UIC._loadTimer); UIC._loadTimer = null; }
  var list = Array.isArray(msg) ? msg.filter(Boolean) : (msg ? [msg] : []);
  if (!list.length) return;
  m.textContent = list[0];
  /* The rotating-message behaviour came from UI.showSpinner and is preserved:
     long saves showed a sequence of reassuring lines every 2.5s. */
  if (list.length > 1) {
    var i = 0;
    UIC._loadTimer = setInterval(function () {
      i++;
      if (i < list.length) { m.textContent = list[i]; }
      else { clearInterval(UIC._loadTimer); UIC._loadTimer = null; }
    }, 2500);
  }
};

UIC.showPageLoading = function (msg) {
  try {
    UIC.ensurePageLoading();
    UIC._loadCount++;
    var d = document.getElementById('page-loading');
    UIC._loadMessage(msg);
    d.classList.add('show');
    d.setAttribute('aria-busy', 'true');
  } catch (e) {}
};

/** hide(true) drops the overlay regardless of the ref count. */
UIC.hidePageLoading = function (force) {
  try {
    UIC._loadCount = force ? 0 : Math.max(0, UIC._loadCount - 1);
    if (UIC._loadCount > 0) return;
    if (UIC._loadTimer) { clearInterval(UIC._loadTimer); UIC._loadTimer = null; }
    var d = document.getElementById('page-loading');
    if (d) { d.classList.remove('show'); d.setAttribute('aria-busy', 'false'); }
  } catch (e) {}
};
UIC.withPageLoading = function (promise, msg) {
  UIC.showPageLoading(msg || 'جاري التحميل...');
  return Promise.resolve(promise).then(function (r) { UIC.hidePageLoading(); return r; }, function (e) { UIC.hidePageLoading(); throw e; });
};

/* ── [UI-3.8 / U-42] The persistent home button ──────────────────────────
 *
 * OWNER-REQUESTED, explicitly: the system logo floats above the page on EVERY
 * page, one click back to the main dashboard.
 *
 * The component already existed and was gated off — it rendered only on
 * ERPDashboard, login and setup, which is to say only on the three pages you
 * would never need it from. Removing the gate is most of this step. The rest is
 * fixing the two things that would otherwise have shipped it broken.
 *
 * 1. POSITION. It was `top: 10px; right: 10px`. This app is RTL, so
 *    `.topbar-left` — the hamburger plus BOTH logos — renders on the RIGHT, and
 *    a top-right FAB lands directly on top of it on all 82 shell pages. It now
 *    sits at the BOTTOM, inline-end (bottom-left in RTL), clearing the safe
 *    area. The owner can move it back with one rule, but it then needs an
 *    offset for the 56px topbar and it will still overlap the company logo on
 *    the pages whose topbar is densest.
 *
 * 2. STACKING. It was `z-index: 9998`, which is ABOVE the modal overlay (1000),
 *    the drawer (900) and the loading overlay (1500) — so it floated over open
 *    dialogs. It is now 1100: above page content, the sticky topbar (1000) and
 *    the breadcrumb; below toasts (2000), dialogs, the drawer and loading. It
 *    is also hidden outright whenever a dialog or the drawer is open, because a
 *    home link sitting over a half-finished Save dialog is a way to lose work,
 *    not a convenience.
 *
 * Also: a real aria-label (it had only title and alt), a visible focus ring, a
 * 44px minimum target, colours from the Phase 2 tokens rather than a hardcoded
 * #fff and rgba(0,0,0,.2), and it does not print.
 */
UIC.ensureHomeLogo = function () {
  if (document.getElementById('home-logo-fab')) return;
  var a = document.createElement('a');
  a.id = 'home-logo-fab';
  a.href = UIC.baseUrl() + '?action=ERPDashboard&sessionToken=' + encodeURIComponent(UIC.token());
  a.title = 'الرئيسية';
  /* It had title and alt but no aria-label, so a screen reader announced the
     image's alt text inside a link with no name of its own. */
  a.setAttribute('aria-label', 'الرئيسية');
  a.setAttribute('onclick', "UIC.navTo(event, this.getAttribute('href'))");
  a.innerHTML = '<img src="' + (UIC.SYSTEM_LOGO_URL || '') + '" alt="" loading="lazy" decoding="async">';
  document.body.appendChild(a);

  var st = document.createElement('style');
  st.textContent =
    '#home-logo-fab{' +
      'position:fixed;' +
      /* Bottom, inline-end. In RTL that is bottom-LEFT, well clear of
         .topbar-left and of the row action kebabs on the right of every table. */
      'bottom:max(16px, var(--safe-bottom, 0px));' +
      'inset-inline-end:max(16px, var(--safe-right, 0px));' +
      'z-index:1100;' +
      'width:var(--tap-sm, 44px);height:var(--tap-sm, 44px);' +
      'border-radius:50%;' +
      'background:var(--bg-surface, #fff);' +
      'border:1px solid var(--border-color, #e2e5ea);' +
      'box-shadow:var(--shadow-md, 0 4px 12px rgba(0,0,0,.08));' +
      'display:flex;align-items:center;justify-content:center;cursor:pointer;' +
      'transition:transform .15s ease, box-shadow .15s ease;' +
    '}' +
    '#home-logo-fab img{width:28px;height:28px;object-fit:contain;pointer-events:none;}' +
    '#home-logo-fab:hover{box-shadow:var(--shadow-lg, 0 10px 30px rgba(0,0,0,.12));transform:translateY(-1px);}' +
    '#home-logo-fab:focus-visible{outline:2px solid var(--brand-primary);outline-offset:2px;}' +
    /* Yields to anything modal. .modal-open is set by BOTH UIC.openModal and
       ERPModal.open, so this covers every dialog in the app. */
    'body.modal-open #home-logo-fab{display:none;}' +
    /* The drawer sets body overflow hidden rather than a class, so match the
       drawer's own open state. */
    'body.drawer-open #home-logo-fab{display:none;}' +
    '@media print{#home-logo-fab{display:none;}}' +
    /* Slightly larger where there is room. Mobile-first, on the tier scale. */
    '@media (min-width: 600px){#home-logo-fab{width:48px;height:48px;}#home-logo-fab img{width:32px;height:32px;}}';
  document.head.appendChild(st);
};

/* The drawer is not a sibling of the FAB in every page's DOM order, so the CSS
 * sibling rule above cannot be relied on alone. Toggle a body class too. */
UIC._syncHomeFabForDrawer = function (open) {
  try { document.body.classList.toggle('drawer-open', !!open); } catch (e) {}
};

(function () {
  var boot = function () {
    try {
      UIC.ensureHomeLogo();
      UIC.showPageLoading('جاري التحميل...');
      var hide = function () { try { UIC.hidePageLoading(); } catch (e) {} };
      window.addEventListener('load', hide);
      /* [UI-3.4] The watchdog FORCES the overlay down. Now that the service is
         ref-counted, a page that started its own load during boot would
         otherwise leave the count above zero and strand the overlay on screen
         with no way for the user to dismiss it. A stuck full-screen overlay is
         a far worse failure than a spinner that vanishes half a second early. */
      setTimeout(function () { try { UIC.hidePageLoading(true); } catch (e) {} }, 6000);
    } catch (e) {}
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

/* Client-side error reporting → server-side ERP_Client_Log sheet. */
UIC.__errCount = 0;
UIC.reportError = function (detail, opt) {
  try {
    if (UIC.__errCount >= 12) return;
    UIC.__errCount = (UIC.__errCount || 0) + 1;
    var payload = {
      page: location.pathname,
      message: String(detail || '').slice(0, 2000),
      stack: (opt && opt.stack ? String(opt.stack).slice(0, 4000) : ''),
      url: location.href ? location.href.slice(0, 1500) : '',
      user: ((window.API && API.getSession && API.getSession() && API.getSession().user && API.getSession().user.email) || '')
    };
    try { google.script.run.withFailureHandler(function () {}).logClientError_(payload); } catch (e2) {}
  } catch (e) {}
};

/* [PERF-11] Uniform page size: every data list paginates at 50 rows per page
 * with navigation rendered BELOW the table. Kept under the legacy AUTO_PAGE_SIZE
 * name so any external readers keep working. */
UIC.AUTO_PAGE_SIZE = 50;

UIC.dataTable = function (containerId, opts) {
  const o = opts || {};
  const rawHeaders = o.headers || [];
  const rows = o.rows || [];
  const searchable = o.searchable !== false;
  const id = containerId || 'datatable';

  /* ── Backward compatibility: accept plain-string headers and/or array rows.
   *     Strings become positional columns ({key:'__col<i>', label:h});
   *     array rows are matched to columns by index. Object usage unchanged. ── */
  const hasStringHeaders = rawHeaders.some(h => typeof h === 'string');
  const headers = hasStringHeaders
    ? rawHeaders.map((h, i) => (typeof h === 'string' ? { key: '__col' + i, label: h } : h))
    : rawHeaders;

  if (rows.length === 0) {
    /* [UI-3.5 / U-22] `emptyText` keeps working exactly as before; a page can
       now also pass a richer `emptyState` object with an icon, an explanation
       and a create action. */
    return UIC.emptyState(o.emptyState || { title: o.emptyText || 'لا توجد بيانات' });
  }

  const fmtMoney = function (n) {
    if (window.FMT && FMT.currency) return FMT.currency(n);
    const v = Number(n) || 0;
    const parts = v.toFixed(2).split('.');
    return parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + parts[1];
  };

  /* [PERF-11] Uniform 50-row pager (opt out with autoPage:false).
   * Explicit o.pageSize values above 50 are clamped to 50 so every list
   * paginates identically; smaller explicit values are honored as-is. */
  let pageSize = 0;
  if (o.autoPage !== false && rows.length > 50) {
    pageSize = Math.min(o.pageSize || 50, 50);
  }

  /* [UI-1.3 / U-03] Sortable columns advertise their state to assistive tech and
     carry a chevron. `sortable: false` on a header opts a column out — the
     actions column is opted out automatically, since sorting by a block of
     buttons is meaningless. */
  const isSortable = h => h.sortable !== false && (h.key || h.label) !== 'actions';
  /* thead is rebuilt whenever the visible column set changes (UI-4.5), so it is
     a function of the store rather than a one-off string. */
  const theadFor = function (st) {
    const cols = UIC._dtVisibleHeaders(st);
    const selTh = st.selectable
      ? '<th class="dt-sel"><input type="checkbox" class="dt-sel-all" aria-label="تحديد الكل" ' +
        'onclick="UIC._dtToggleAll(\'' + st.id + '\', this)"></th>'
      : '';
    return '<thead><tr>' + selTh + cols.map(function (h) {
      const key = h.key || h.label;
      return '<th scope="col" data-key="' + key + '"' +
        (isSortable(h) ? ' data-sortable="true" aria-sort="none"' : '') + '>' +
        '<span class="th-label">' + h.label + '</span>' +
        (isSortable(h) ? '<span class="th-sort" aria-hidden="true"></span>' : '') +
        '</th>';
    }).join('') + '</tr></thead>';
  };

  window.__dtStore = window.__dtStore || {};
  /* [UI-1.3 / U-03] `originalRows` is the load order, and nothing ever reorders
     it. Before this, sorting wrote back into `st.filtered`, which at first
     render was the SAME array object as `st.rows` AND as the caller's own array
     — so a single click on a column header permanently destroyed the order the
     server sent, with no way back. The pipeline is now
     search -> filter -> sort -> slice, re-derived from originalRows each time. */
  window.__dtStore[id] = {
    id: id,
    headers: headers,
    originalRows: rows.slice(),
    rows: rows,
    filtered: rows.slice(),
    pageSize: pageSize, page: 1, pageRows: null,
    fmtMoney: fmtMoney, opts: o,
    searchTerm: '', dateFrom: '', dateTo: '',
    sortKey: null, sortDir: null,
    /* [UI-4.5 / U-19] Hidden columns, remembered per page + table. */
    hidden: {},
    /* [UI-4.6 / U-17] Selection, keyed by row identity so it survives sorting,
       filtering and paging. */
    selectable: o.selectable === true,
    selected: {}
  };
  UIC._dtLoadColumnPrefs(id);

  /* ── Toolbar: search + date filter + Excel + Print ── */
  var toolbarParts = [];
  if (searchable) {
    toolbarParts.push('<input class="input" type="search" placeholder="بحث..." oninput="UIC._dtSearchInput(\'' + id + '\', this.value)">');
  }
  if (o.dateFilter) {
    toolbarParts.push('<label style="font-size:13px;">من:</label><input id="' + id + '-from" type="date" class="input" style="width:150px;">');
    toolbarParts.push('<label style="font-size:13px;">إلى:</label><input id="' + id + '-to" type="date" class="input" style="width:150px;">');
    toolbarParts.push('<button type="button" class="btn btn-outline" onclick="UIC.applyDateFilter(\'' + id + '\')">فلتر</button>');
  }
  if (o.exportXlsx !== false) {
    toolbarParts.push('<button type="button" class="btn btn-outline" onclick="UIC.exportExcel(\'' + id + '\')">' + UIC.icon('download') + '<span>Excel</span></button>');
  }
  if (o.printable !== false) {
    toolbarParts.push('<button type="button" class="btn btn-outline" onclick="UIC.printTable(\'' + id + '\')">' + UIC.icon('print') + '<span>طباعة</span></button>');
  }
  var toolbarHtml = toolbarParts.length
    ? '<div class="table-toolbar" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">' + toolbarParts.join('') + '</div>'
    : '';

  // MIT/Harvard chunked: return skeleton, fill tbody chunked via rAF to keep 60fps
  // [PERF-11] pager navigation renders BELOW the table (replaces "show more").
  var pagerHtml = (pageSize > 0)
    ? '<div class="dt-pager" id="' + id + '_pager">' + UIC._dtPagerHtml(id) + '</div>'
    : '';

  const clickAttr = o.rowClick ? ' onclick="UIC._dtRowClick(event, \'' + id + '\')"' : '';
  const st0 = window.__dtStore[id];
  /* [UI-4.6] The batch bar lives above the table and is empty until something
     is selected, so it costs one div and no layout shift when it appears. */
  const batchHtml = st0.selectable ? '<div class="dt-batch" id="' + id + '_batch" hidden></div>' : '';
  const html = '<div id="' + id + '" class="table-wrap"' + clickAttr + '>' + toolbarHtml + batchHtml +
    '<table class="table" data-sortable="true" id="' + id + '_table"><caption class="sr-only">' + (o.title || '') + '</caption>' +
    theadFor(st0) +
    '<tbody id="' + id + '_tbody"></tbody></table>' + pagerHtml + '</div>';
  // schedule chunked fill (75 rows per frame, 12ms budget) — Harvard windowed
  setTimeout(function(){ UIC._renderChunked(id, 0); }, 0);
  return html;
};

UIC._dtRowHtml = function (r, headers, fmtMoney, idx, st) {
  /* [UI-4.6 / U-17] The selection checkbox, when the table opted in. */
  var sel = '';
  if (st && st.selectable) {
    var key = UIC._dtRowKey(st, r, idx);
    var on = st.selected && st.selected[key] ? ' checked' : '';
    sel = '<td class="dt-sel"><input type="checkbox" class="dt-sel-box" aria-label="تحديد السجل"' +
      ' data-key="' + UIC.escHtml(String(key)) + '"' + on +
      ' onclick="event.stopPropagation();UIC._dtToggleRow(\'' + st.id + '\', this)"></td>';
  }
  return '<tr' + (idx != null ? ' data-idx="' + idx + '"' : '') + '>' + sel + headers.map((h, i) => {
    const raw = Array.isArray(r) ? r[i] : r[h.key || h.label];
    const v = (raw !== undefined && raw !== null) ? raw : '';
    /* [UI-4.8 / U-39] data-label carries the column name so the phone card
       layout can print it beside the value. It is an ATTRIBUTE, not an element,
       so the DOM node count per row is unchanged — which is the number the
       performance programme owns. */
    const label = h.label ? ' data-label="' + UIC.escHtml(String(h.label)) + '"' : '';
    if (h.money) {
      const num = Number(v) || 0;
      return '<td class="num"' + label + ' data-num="' + num + '">' + fmtMoney(num) + '</td>';
    }
    const sortAttr = h.sortKey ? ' data-sort="' + esc(String(r[h.sortKey] != null ? r[h.sortKey] : '')) + '"' : '';
    return '<td' + (h.numeric ? ' class="num"' : '') + label + sortAttr + '>' + v + '</td>';
  }).join('') + '</tr>';
};

/* A stable identity for a row, so a selection survives sorting, filtering and
 * paging. Falls back to the index only when the table has no id-ish column —
 * in which case the selection is per-page, which is stated rather than hidden. */
UIC._dtRowKey = function (st, r, idx) {
  var f = st && st.opts && st.opts.rowKey;
  if (f) { try { return typeof f === 'function' ? f(r) : r[f]; } catch (e) {} }
  if (r && typeof r === 'object' && !Array.isArray(r)) {
    var candidates = ['id', 'uid', 'unique_id', 'record_uid', 'invoice_unique_id', 'code'];
    for (var i = 0; i < candidates.length; i++) {
      if (r[candidates[i]] != null && r[candidates[i]] !== '') return r[candidates[i]];
    }
  }
  return '#' + idx;
};

// MIT/Harvard: chunked tbody fill — 75 rows / 12ms per frame, DocumentFragment, keeps 60fps
UIC._renderChunked = function(id, offset){
  const st = (window.__dtStore || {})[id];
  const tbody = document.getElementById(id + '_tbody');
  if (!st || !tbody) return;
  const CHUNK = 75, BUDGET = 12;
  const list = st.filtered || st.rows;
  // [PERF-11] render the current page slice only (≤ pageSize DOM rows).
  const ps = st.pageSize || 0;
  const pg = Math.max(1, st.page || 1);
  const view = (ps > 0 ? list.slice((pg - 1) * ps, pg * ps) : list);
  st.pageRows = view;
  const total = view.length;
  let idx = offset || 0;
  /* [UI-4.4] Group bookkeeping. The index is built ONCE per render, in O(n),
     so the per-row work inside the chunk loop stays a single comparison and the
     renderer's complexity is unchanged. */
  let lastGroup = null;
  const groupIndex = {};
  if (st.groupKey) {
    view.forEach(function (r) {
      if (!r || Array.isArray(r)) return;
      var gv = r[st.groupKey];
      var gid = String(gv == null || gv === '' ? '—' : gv);
      (groupIndex[gid] = groupIndex[gid] || []).push(r);
    });
  }
  // first chunk clears
  if(idx===0) tbody.innerHTML = '';
  function tick(){
    const start = performance.now();
    const frag = document.createDocumentFragment();
    // Use template element for fast parsing (Harvard: createContextualFragment)
    const tmp = document.createElement('tbody');
    let html = '';
    const end = Math.min(idx + CHUNK, total);
    for(; idx < end; idx++){
      /* [UI-4.4 / U-18] Emit a group header whenever the group value changes.
         This stays inside the same chunk loop and the same 12ms budget: it is
         one comparison per row, not a second pass over the data. */
      if (st.groupKey) {
        var gv = view[idx] && !Array.isArray(view[idx]) ? view[idx][st.groupKey] : null;
        var gid = String(gv == null || gv === '' ? '—' : gv);
        if (gid !== lastGroup) {
          lastGroup = gid;
          html += UIC._dtGroupRowHtml(st, gid, gid, groupIndex[gid] || []);
        }
        if (st.collapsed && st.collapsed[gid]) continue;
      }
      html += UIC._dtRowHtml(view[idx], UIC._dtVisibleHeaders(st), st.fmtMoney, idx, st);
      // flush per CHUNK to respect budget
      if (performance.now() - start >= BUDGET) break;
    }
    if (html) { tmp.innerHTML = html; while(tmp.firstChild) frag.appendChild(tmp.firstChild); tbody.appendChild(frag); }
    if (idx < total) requestAnimationFrame(tick);
    else {
      try { UIC._dtRefreshBatchBar(id); } catch (e) {}
      try { UIC._dtRefreshFooter(id); } catch (e) {}
      if (st.opts && st.opts.onRendered) { try{ st.opts.onRendered(id); }catch(e){} }
    }
  }
  requestAnimationFrame(tick);
};

/* ── [UI-4.4 / U-18] Group by, with subtotals and a column footer ─────────
 *
 * A list could be sorted but not grouped, so "what did each customer buy this
 * month" meant exporting to Excel and building a pivot. Grouping runs entirely
 * on rows already loaded client-side — st.filtered — so it adds ZERO server
 * calls, which is the constraint the performance programme cares about.
 *
 * Choosing a group also sorts by that key, because a group is only meaningful
 * when its rows are contiguous. That is stated here rather than being a
 * surprise: picking a group changes the sort.
 */
UIC.dtGroupBy = function (id, key) {
  var st = (window.__dtStore || {})[id];
  if (!st) return;
  st.groupKey = key || null;
  st.collapsed = {};
  if (key) { st.sortKey = key; st.sortDir = 'asc'; }
  UIC._applyFilters(id);
  UIC._dtSyncSortIndicators(id);
};

UIC.dtToggleGroup = function (id, groupId) {
  var st = (window.__dtStore || {})[id];
  if (!st) return;
  st.collapsed = st.collapsed || {};
  if (st.collapsed[groupId]) delete st.collapsed[groupId]; else st.collapsed[groupId] = true;
  UIC._dtRenderBody(id);
};

/** Sum the money/numeric columns over a set of rows. */
UIC._dtAggregate = function (st, list) {
  var cols = UIC._dtVisibleHeaders(st).filter(function (h) { return h.money || h.numeric; });
  var sums = {};
  cols.forEach(function (h) { sums[h.key || h.label] = 0; });
  (list || []).forEach(function (r) {
    cols.forEach(function (h) {
      var k = h.key || h.label;
      var v = Array.isArray(r) ? null : r[k];
      var n = parseFloat(String(v == null ? '' : v).replace(/,/g, ''));
      if (!isNaN(n)) sums[k] += n;
    });
  });
  return { cols: cols, sums: sums };
};

/** A group header row: label, count, and the subtotal of each numeric column. */
UIC._dtGroupRowHtml = function (st, groupId, label, list) {
  var cols = UIC._dtVisibleHeaders(st);
  var agg = UIC._dtAggregate(st, list);
  var collapsed = !!(st.collapsed && st.collapsed[groupId]);
  var span = (st.selectable ? 1 : 0) + cols.length;
  var cells = cols.map(function (h, i) {
    var k = h.key || h.label;
    if (i === 0) {
      return '<td class="dt-group-lead">' +
        '<button type="button" class="dt-group-toggle" aria-expanded="' + (!collapsed) + '" ' +
        'onclick="event.stopPropagation();UIC.dtToggleGroup(\'' + st.id + '\', \'' + UIC.escHtml(groupId) + '\')">' +
        (collapsed ? UIC.icon('chevron-left', { size: 14 }) : UIC.icon('chevron-down', { size: 14 })) +
        '</button>' +
        '<span class="dt-group-label">' + UIC.escHtml(label || '—') + '</span>' +
        '<span class="dt-group-count">' + list.length + '</span></td>';
    }
    if (agg.sums.hasOwnProperty(k)) {
      return '<td class="num dt-group-sum">' + st.fmtMoney(agg.sums[k]) + '</td>';
    }
    return '<td></td>';
  }).join('');
  return '<tr class="dt-group" data-group="' + UIC.escHtml(groupId) + '" data-span="' + span + '">' +
    (st.selectable ? '<td class="dt-sel"></td>' : '') + cells + '</tr>';
};

/** The table footer: the same aggregates across the whole filtered set. */
UIC._dtRefreshFooter = function (id) {
  var st = (window.__dtStore || {})[id];
  var table = document.getElementById(id + '_table');
  if (!st || !table) return;
  if (!(st.opts && st.opts.totals)) return;
  var cols = UIC._dtVisibleHeaders(st);
  var agg = UIC._dtAggregate(st, st.filtered);
  var cells = cols.map(function (h, i) {
    var k = h.key || h.label;
    if (i === 0) return '<td class="dt-total-lead">الإجمالي (' + (st.filtered || []).length + ')</td>';
    return agg.sums.hasOwnProperty(k)
      ? '<td class="num">' + st.fmtMoney(agg.sums[k]) + '</td>'
      : '<td></td>';
  }).join('');
  var foot = table.querySelector('tfoot');
  if (!foot) {
    foot = document.createElement('tfoot');
    table.appendChild(foot);
  }
  foot.innerHTML = '<tr class="dt-total">' + (st.selectable ? '<td class="dt-sel"></td>' : '') + cells + '</tr>';
};

/** Markup for the "تجميع" dropdown. A page drops this into controlPanel.tools. */
UIC.groupMenu = function (id, keys) {
  var st = (window.__dtStore || {})[id];
  if (!st) return '';
  var ddId = 'grp-' + id;
  var choices = (keys && keys.length ? keys : st.headers.map(function (h) { return h.key || h.label; }))
    .filter(function (k) { return k !== 'actions'; });
  var label = function (k) {
    var h = st.headers.filter(function (x) { return (x.key || x.label) === k; })[0];
    return (h && h.label) || k;
  };
  var items = '<button type="button" class="nav-dropdown-item" onclick="UIC.dtGroupBy(\'' + id + '\', null)">بدون تجميع</button>' +
    choices.map(function (k) {
      return '<button type="button" class="nav-dropdown-item" onclick="UIC.dtGroupBy(\'' + id + '\', \'' +
        UIC.escHtml(String(k)) + '\')">' + UIC.escHtml(String(label(k))) + '</button>';
    }).join('');
  return '<div class="nav-dropdown" id="' + ddId + '-wrap">' +
    '<button type="button" class="btn btn-outline nav-dropdown-toggle" aria-haspopup="true" aria-expanded="false" ' +
    'onclick="UIC.toggleDropdown(\'' + ddId + '\', event)">' + UIC.icon('filter', { size: 15 }) +
    '<span>تجميع</span></button>' +
    '<div class="nav-dropdown-menu" id="' + ddId + '">' + items + '</div></div>';
};

/* ── [UI-4.9 / U-16] Saved views, wired into a Favourites menu ────────────
 *
 * SESSION.saveCurrentView and SESSION.loadActiveView already existed and were
 * reachable from exactly two pages, so almost nobody knew the feature was
 * there. This surfaces them on any list that opts in.
 *
 * NO SCHEMA CHANGE: a view rides on the EXISTING ERP_User_Views.layout_json
 * column through the existing save_user_view / list_user_views endpoints. This
 * programme adds no column and writes no data of its own — the only write is
 * the one a real user causes by choosing "save this view".
 */
UIC.dtViewState = function (id) {
  var st = (window.__dtStore || {})[id];
  if (!st) return {};
  return {
    v: 1,
    search: st.searchTerm || '',
    dateFrom: st.dateFrom || '',
    dateTo: st.dateTo || '',
    sortKey: st.sortKey || null,
    sortDir: st.sortDir || null,
    groupKey: st.groupKey || null,
    hidden: st.hidden || {}
  };
};

UIC.dtApplyViewState = function (id, state) {
  var st = (window.__dtStore || {})[id];
  if (!st || !state) return;
  st.searchTerm = state.search || '';
  st.dateFrom = state.dateFrom || '';
  st.dateTo = state.dateTo || '';
  st.sortKey = state.sortKey || null;
  st.sortDir = state.sortDir || null;
  st.groupKey = state.groupKey || null;
  st.hidden = state.hidden || {};
  UIC._dtSaveColumnPrefs(id);
  UIC._dtRebuildHead(id);
  UIC._applyFilters(id);
  UIC._dtSyncSortIndicators(id);
};

/** Ask for a name in a styled dialog, then hand off to the existing endpoint. */
UIC.dtSaveView = function (id, pageKey) {
  var inputId = 'view-name-' + id;
  UIC.openModal('save-view-modal', {
    title: 'حفظ العرض الحالي',
    size: 'sm',
    body: UIC.field({ key: inputId, label: 'اسم العرض', required: true, placeholder: 'مثال: فواتير هذا الشهر' }),
    onSave: "UIC._dtSaveViewConfirm('" + id + "','" + UIC.escHtml(String(pageKey || '')) + "','" + inputId + "')"
  });
};

UIC._dtSaveViewConfirm = function (id, pageKey, inputId) {
  var el = document.getElementById(inputId);
  var name = el ? String(el.value || '').trim() : '';
  if (!name) { UIC.toast('أدخل اسماً للعرض', 'warning'); return; }
  UIC.closeModal('save-view-modal');
  /* The existing helper, unmodified. Passing presetName means it does not fall
     back to the native prompt() it uses when called without one. */
  SESSION.saveCurrentView(pageKey, UIC.dtViewState(id), name);
};

UIC.favouritesMenu = function (id, pageKey) {
  var ddId = 'fav-' + id;
  return '<div class="nav-dropdown" id="' + ddId + '-wrap">' +
    '<button type="button" class="btn btn-outline nav-dropdown-toggle" aria-haspopup="true" aria-expanded="false" ' +
    'onclick="UIC._dtOpenFavourites(\'' + id + '\', \'' + UIC.escHtml(String(pageKey || '')) + '\', event)">' +
    UIC.icon('tag', { size: 15 }) + '<span>المفضلة</span></button>' +
    '<div class="nav-dropdown-menu" id="' + ddId + '">' +
      '<button type="button" class="nav-dropdown-item" onclick="UIC.dtSaveView(\'' + id + '\', \'' +
      UIC.escHtml(String(pageKey || '')) + '\')">' + UIC.icon('save', { size: 14 }) +
      '<span>حفظ العرض الحالي</span></button>' +
      '<div class="user-profile-divider"></div>' +
      '<div id="' + ddId + '-list"><div class="dt-fav-empty">…</div></div>' +
    '</div></div>';
};

UIC._dtOpenFavourites = function (id, pageKey, ev) {
  UIC.toggleDropdown('fav-' + id, ev);
  var box = document.getElementById('fav-' + id + '-list');
  if (!box) return;
  box.innerHTML = '<div class="dt-fav-empty">جاري التحميل…</div>';
  API.call('list_user_views', {}, SESSION.token()).then(function (r) {
    var views = ((r && r.views) || []).filter(function (v) {
      return !pageKey || String(v.page_key) === String(pageKey);
    });
    if (!views.length) {
      box.innerHTML = '<div class="dt-fav-empty">لا توجد عروض محفوظة</div>';
      return;
    }
    box.innerHTML = views.map(function (v) {
      return '<button type="button" class="nav-dropdown-item" ' +
        'onclick="UIC._dtApplySavedView(\'' + id + '\', ' + JSON.stringify(String(v.view_id)) + ')">' +
        UIC.escHtml(String(v.name || v.view_id)) + '</button>';
    }).join('');
    UIC._dtFavCache = UIC._dtFavCache || {};
    views.forEach(function (v) { UIC._dtFavCache[String(v.view_id)] = v; });
  }).catch(function () {
    box.innerHTML = '<div class="dt-fav-empty">تعذر تحميل العروض</div>';
  });
};

UIC._dtApplySavedView = function (id, viewId) {
  var v = (UIC._dtFavCache || {})[String(viewId)];
  if (!v) return;
  var def = v.layout_json;
  try { if (typeof def === 'string') def = JSON.parse(def); } catch (e) { def = null; }
  if (!def) { UIC.toast('تعذر قراءة العرض المحفوظ', 'error'); return; }
  UIC.dtApplyViewState(id, def);
  UIC.toast('تم تطبيق العرض: ' + (v.name || ''), 'success');
};

/* ── [UI-4.7 / U-23] Skeleton loading for lists ───────────────────────────
 *
 * A list load put a full-screen blocking overlay over the page on 80 of 85
 * pages, so fetching a list looked exactly like saving a record — and the user
 * could not tell whether they were allowed to keep working.
 *
 * The rule this establishes: SKELETON for reading, INLINE PROGRESS for
 * refreshing, and the blocking overlay reserved for writes, where blocking is
 * the point.
 */
UIC.listSkeleton = function (containerId, headers, rowCount) {
  var el = typeof containerId === 'string' ? document.getElementById(containerId) : containerId;
  if (!el) return;
  el.innerHTML = '<div class="table-wrap">' + UIC.tableSkeleton(headers, rowCount || 8) + '</div>';
};

UIC.listProgress = function (containerId, on) {
  var el = typeof containerId === 'string' ? document.getElementById(containerId) : containerId;
  if (!el) return;
  var bar = el.querySelector ? el.querySelector('.dt-progress') : null;
  if (on) {
    if (bar) return;
    bar = document.createElement('div');
    bar.className = 'dt-progress';
    bar.setAttribute('role', 'progressbar');
    bar.setAttribute('aria-label', 'جاري التحديث');
    if (el.firstChild) el.insertBefore(bar, el.firstChild); else el.appendChild(bar);
  } else if (bar && bar.remove) {
    bar.remove();
  }
};

/* ── [UI-4.5 / U-19] Optional columns, remembered per page ────────────────
 *
 * A list showed every column its author chose, in that order, for everyone. A
 * user who never looks at three of them scrolled past them on every screen.
 *
 * Visibility rides on localStorage, keyed by page action + table id. NO SCHEMA
 * CHANGE and no server round-trip: this is a per-device preference, which is
 * what localStorage is for, and hard constraint 1 forbids the alternative.
 */
UIC._dtColKey = function (id) {
  var action = '';
  try { action = window.CURRENT_ACTION || new URLSearchParams(window.location.search).get('action') || ''; } catch (e) {}
  return 'erp_cols_' + action + '_' + id;
};

UIC._dtLoadColumnPrefs = function (id) {
  var st = (window.__dtStore || {})[id];
  if (!st) return;
  try {
    var raw = localStorage.getItem(UIC._dtColKey(id));
    if (!raw) return;
    var saved = JSON.parse(raw);
    if (saved && typeof saved === 'object') st.hidden = saved;
  } catch (e) { /* a corrupt or unavailable store just means no preference */ }
};

UIC._dtSaveColumnPrefs = function (id) {
  var st = (window.__dtStore || {})[id];
  if (!st) return;
  try { localStorage.setItem(UIC._dtColKey(id), JSON.stringify(st.hidden || {})); } catch (e) {}
};

/** The headers actually rendered, in order. */
UIC._dtVisibleHeaders = function (st) {
  if (!st) return [];
  if (!st.hidden) return st.headers;
  return st.headers.filter(function (h) { return !st.hidden[h.key || h.label]; });
};

UIC.dtToggleColumn = function (id, key, visible) {
  var st = (window.__dtStore || {})[id];
  if (!st) return;
  st.hidden = st.hidden || {};
  if (visible) delete st.hidden[key]; else st.hidden[key] = true;
  /* Never let the user hide every column — an empty table with no headers is
     indistinguishable from a broken page. */
  if (!UIC._dtVisibleHeaders(st).length) { delete st.hidden[key]; return; }
  UIC._dtSaveColumnPrefs(id);
  UIC._dtRebuildHead(id);
  UIC._dtRenderBody(id);
};

UIC._dtRebuildHead = function (id) {
  var st = (window.__dtStore || {})[id];
  var table = document.getElementById(id + '_table');
  if (!st || !table) return;
  var old = table.querySelector('thead');
  if (!old) return;
  var cols = UIC._dtVisibleHeaders(st);
  var selTh = st.selectable
    ? '<th class="dt-sel"><input type="checkbox" class="dt-sel-all" aria-label="تحديد الكل" onclick="UIC._dtToggleAll(\'' + id + '\', this)"></th>'
    : '';
  old.innerHTML = '<tr>' + selTh + cols.map(function (h) {
    var key = h.key || h.label;
    var sortable = h.sortable !== false && key !== 'actions';
    return '<th scope="col" data-key="' + key + '"' + (sortable ? ' data-sortable="true" aria-sort="none"' : '') + '>' +
      '<span class="th-label">' + h.label + '</span>' +
      (sortable ? '<span class="th-sort" aria-hidden="true"></span>' : '') + '</th>';
  }).join('') + '</tr>';
  try { UIC.initTableSort(id); } catch (e) {}
  UIC._dtSyncSortIndicators(id);
};

/** Markup for the "الأعمدة" dropdown. A page drops this into controlPanel.tools. */
UIC.columnsMenu = function (id) {
  var st = (window.__dtStore || {})[id];
  if (!st) return '';
  var ddId = 'cols-' + id;
  var items = st.headers.map(function (h) {
    var key = h.key || h.label;
    var shown = !(st.hidden && st.hidden[key]);
    return '<label class="dt-col-item"><input type="checkbox"' + (shown ? ' checked' : '') +
      ' onchange="UIC.dtToggleColumn(\'' + id + '\', \'' + UIC.escHtml(String(key)) + '\', this.checked)"> ' +
      '<span>' + UIC.escHtml(String(h.label || key)) + '</span></label>';
  }).join('');
  return '<div class="nav-dropdown" id="' + ddId + '-wrap">' +
    '<button type="button" class="btn btn-outline nav-dropdown-toggle" aria-haspopup="true" aria-expanded="false" ' +
    'onclick="UIC.toggleDropdown(\'' + ddId + '\', event)">' + UIC.icon('settings', { size: 15 }) +
    '<span>الأعمدة</span></button>' +
    '<div class="nav-dropdown-menu dt-col-menu" id="' + ddId + '">' + items + '</div></div>';
};

/* ── [UI-4.6 / U-17] Multi-select and the batch bar ───────────────────────
 *
 * READ-ONLY ACTIONS ONLY, per standing answer D-5. A selection can be exported
 * or printed; there is no approve-many and no delete-many. The mechanics are
 * built so a write action could be added later, but none ships here: batch
 * writes touch the save paths the performance run identified as the sharpest
 * edge in the codebase, and they deserve their own phase and their own testing.
 */
UIC._dtSelectedRows = function (id) {
  var st = (window.__dtStore || {})[id];
  if (!st) return [];
  var out = [];
  (st.originalRows || []).forEach(function (r, i) {
    if (st.selected[UIC._dtRowKey(st, r, i)]) out.push(r);
  });
  return out;
};

UIC._dtToggleRow = function (id, box) {
  var st = (window.__dtStore || {})[id];
  if (!st || !box) return;
  var key = box.getAttribute('data-key');
  if (box.checked) st.selected[key] = true; else delete st.selected[key];
  UIC._dtRefreshBatchBar(id);
};

UIC._dtToggleAll = function (id, box) {
  var st = (window.__dtStore || {})[id];
  if (!st) return;
  /* Select-all applies to what is currently FILTERED, not to every loaded row.
     Selecting rows the user cannot see is how people delete the wrong things. */
  var list = st.filtered || st.rows || [];
  list.forEach(function (r) {
    var i = (st.originalRows || []).indexOf(r);
    var key = UIC._dtRowKey(st, r, i);
    if (box.checked) st.selected[key] = true; else delete st.selected[key];
  });
  UIC._dtRenderBody(id);
  UIC._dtRefreshBatchBar(id);
};

UIC.dtClearSelection = function (id) {
  var st = (window.__dtStore || {})[id];
  if (!st) return;
  st.selected = {};
  UIC._dtRenderBody(id);
  UIC._dtRefreshBatchBar(id);
  var all = document.querySelector('#' + id + ' .dt-sel-all');
  if (all) all.checked = false;
};

UIC._dtRefreshBatchBar = function (id) {
  var st = (window.__dtStore || {})[id];
  var bar = document.getElementById(id + '_batch');
  if (!st || !bar) return;
  var n = Object.keys(st.selected || {}).length;
  if (!n) { bar.hidden = true; bar.innerHTML = ''; return; }
  bar.hidden = false;
  bar.innerHTML =
    '<span class="dt-batch-count" role="status">' + n + ' محدد</span>' +
    '<button type="button" class="btn btn-outline" onclick="UIC.dtExportSelection(\'' + id + '\')">' +
      UIC.icon('download', { size: 15 }) + '<span>تصدير المحدد</span></button>' +
    '<button type="button" class="btn btn-outline" onclick="UIC.dtPrintSelection(\'' + id + '\')">' +
      UIC.icon('print', { size: 15 }) + '<span>طباعة المحدد</span></button>' +
    '<button type="button" class="btn btn-outline" onclick="UIC.dtClearSelection(\'' + id + '\')">' +
      UIC.icon('close', { size: 15 }) + '<span>إلغاء التحديد</span></button>';
};

/* Export and print reuse the existing implementations by narrowing the table's
 * filtered set for the duration of the call, so there is exactly one exporter
 * and one printer in the codebase rather than three. */
UIC._dtWithSelection = function (id, fn) {
  var st = (window.__dtStore || {})[id];
  if (!st) return;
  var rows = UIC._dtSelectedRows(id);
  if (!rows.length) { UIC.toast('لم يتم تحديد أي سجل', 'warning'); return; }
  var saved = st.filtered;
  st.filtered = rows;
  try { fn(); } finally { st.filtered = saved; }
};

UIC.dtExportSelection = function (id) { UIC._dtWithSelection(id, function () { UIC.exportExcel(id); }); };
UIC.dtPrintSelection = function (id) { UIC._dtWithSelection(id, function () { UIC.printTable(id); }); };

UIC._dtRowClick = function (event, id) {
  try {
    const tr = event.target.closest('tr');
    if (!tr) return;
    const st = (window.__dtStore || {})[id];
    if (!st || !st.opts || !st.opts.rowClick) return;
    const ia = tr.getAttribute('data-idx');
    // data-idx is relative to the rendered page slice ([PERF-11] pager).
    const list = st.pageRows || st.filtered || st.rows;
    const rec = (ia != null) ? list[Number(ia)] : null;
    if (rec != null) st.opts.rowClick(rec, tr);
  } catch (e) {}
};

UIC._dtRenderBody = function (id) {
  const st = (window.__dtStore || {})[id];
  const tbody = document.getElementById(id + '_tbody');
  if (!st || !tbody) return;
  // Harvard chunked: delegate to _renderChunked for incremental DOM
  UIC._renderChunked(id, 0);
};

// Backward-compat shim: the "show more" button was replaced by the [PERF-11]
// pager; legacy callers now advance one page. No live pages call this directly.
UIC.dataTableMore = function (id) {
  const st = (window.__dtStore || {})[id];
  if (!st) return;
  UIC.dtGoto(id, (st.page || 1) + 1);
};

/* [PERF-11] pager engine — 50-row pages, navigation BELOW the table.
 * Pipeline: search → filter → sort → slice. Page flips re-slice only (<2ms),
 * never re-running search/filter/sort. Operates purely on data already loaded. */
UIC._dtTotalPages = function (id) {
  const st = (window.__dtStore || {})[id];
  if (!st || !(st.pageSize > 0)) return 1;
  const list = st.filtered || st.rows;
  return Math.max(1, Math.ceil(list.length / st.pageSize));
};

UIC.dtGoto = function (id, page) {
  const st = (window.__dtStore || {})[id];
  if (!st || !(st.pageSize > 0)) return;
  const totalPages = UIC._dtTotalPages(id);
  st.page = Math.min(Math.max(1, Number(page) || 1), totalPages);
  UIC._dtRenderBody(id);
  UIC._dtRefreshPager(id);
};

UIC._dtPagerHtml = function (id) {
  const st = (window.__dtStore || {})[id];
  if (!st || !(st.pageSize > 0)) return '';
  const list = st.filtered || st.rows;
  const total = list.length;
  const ps = st.pageSize;
  const totalPages = Math.max(1, Math.ceil(total / ps));
  if (totalPages <= 1) return '';
  const pg = Math.min(Math.max(1, st.page || 1), totalPages);
  st.page = pg;
  const from = total === 0 ? 0 : (pg - 1) * ps + 1;
  const to = Math.min(pg * ps, total);
  // Windowed numbers: up to 7 (1 … window … last), RTL-friendly order.
  var pages = [];
  var push = function (p) { if (pages.indexOf(p) === -1) pages.push(p); };
  if (totalPages <= 7) {
    for (var i = 1; i <= totalPages; i++) push(i);
  } else {
    push(1);
    if (pg > 3) pages.push('…');
    for (var k = Math.max(2, pg - 1); k <= Math.min(totalPages - 1, pg + 1); k++) push(k);
    if (pg < totalPages - 2) pages.push('…');
    push(totalPages);
  }
  var btn = function (label, target, disabled, primary) {
    return '<button type="button" class="btn ' + (primary ? 'btn-primary' : 'btn-outline') + '"' +
      ' style="padding:4px 10px;min-width:0;"' +
      (disabled ? ' disabled' : ' onclick="UIC.dtGoto(\'' + id + '\',' + target + ')"') + '>' + label + '</button>';
  };
  var nums = pages.map(function (p) {
    return (p === '…') ? '<span style="padding:0 4px;color:var(--text-muted);">…</span>' : btn(p, p, false, p === pg);
  }).join('');
  return '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;padding:10px 4px 2px;">' +
    btn('الأولى', 1, pg === 1) + btn('السابق', pg - 1, pg === 1) + nums +
    btn('التالي', pg + 1, pg === totalPages) + btn('الأخيرة', totalPages, pg === totalPages) +
    '<span style="font-size:13px;color:var(--text-muted);margin-inline-start:8px;">عرض ' + from + ' – ' + to + ' من ' + total + ' سجل</span></div>';
};

UIC._dtRefreshPager = function (id) {
  const st = (window.__dtStore || {})[id];
  if (!st) return;
  var el = document.getElementById(id + '_pager');
  if (!el && st.pageSize > 0) {
    // Pager div was absent (table built with ≤50 rows, then grew): append below table.
    var wrap = document.getElementById(id);
    if (wrap) {
      el = document.createElement('div');
      el.className = 'dt-pager';
      el.id = id + '_pager';
      wrap.appendChild(el);
    }
  }
  if (el) el.innerHTML = UIC._dtPagerHtml(id);
};

/* [PERF-11] 150ms debounced search input (replaces raw per-keystroke filtering).
 * UIC.filterPaged stays immediate for programmatic callers. */
UIC._dtSearchInput = function (id, term) {
  var st = (window.__dtStore || {})[id];
  if (!st) return;
  try { clearTimeout(st._searchTimer); } catch (e) {}
  st._searchTimer = setTimeout(function () { UIC.filterPaged(id, term); }, 150);
};

UIC.filterPaged = function (id, term) {
  var st = (window.__dtStore || {})[id];
  if (!st) return;
  st.searchTerm = (term || '').trim().toLowerCase();
  UIC._applyFilters(id);
};

UIC._applyFilters = function (id) {
  var st = (window.__dtStore || {})[id];
  if (!st) return;
  var q = st.searchTerm || '';
  var dateFrom = st.dateFrom || '';
  var dateTo = st.dateTo || '';
  var dateKey = (st.opts && st.opts.dateKey) || 'date';
  /* [UI-1.3 / U-03] Filter from the untouched load order, never from a
     previously sorted result, so clearing a sort really does restore it. */
  /* [UI-4.3 / U-13] Field-targeted search: "العميل: أحمد" narrows to one column
     instead of scanning the whole row.
     GUARDED so ordinary searching is untouched: the text before the colon must
     resolve to a real column on THIS table. A term like "10:30" or a product
     code containing a colon therefore still searches the whole row exactly as
     it does today. */
  var field = null, fieldVal = '';
  if (q) {
    var m = /^([^:]+):\s*(.+)$/.exec(q);
    if (m) {
      var want = m[1].trim();
      var hit = (st.headers || []).filter(function (h) {
        return String(h.label || '').trim().toLowerCase() === want ||
               String(h.key || '').trim().toLowerCase() === want;
      })[0];
      if (hit) { field = hit.key || hit.label; fieldVal = m[2].trim(); }
    }
  }

  st.filtered = (st.originalRows || st.rows).filter(function (r) {
    if (q && field) {
      var cell = (r && !Array.isArray(r)) ? r[field] : null;
      if (String(cell == null ? '' : cell).toLowerCase().indexOf(fieldVal) === -1) return false;
    } else if (q) {
      try { if (JSON.stringify(r == null ? '' : r).toLowerCase().indexOf(q) === -1) return false; } catch (e) { return false; }
    }
    if (dateFrom || dateTo) {
      var rv = r[dateKey];
      if (!rv) return false;
      var ds = String(rv).slice(0, 10);
      if (dateFrom && ds < dateFrom) return false;
      if (dateTo && ds > dateTo) return false;
    }
    return true;
  });
  // [PERF-11] Global search already ran above across ALL loaded records
  // (st.rows); reset to page 1 and re-slice. Pager follows the filtered list.
  UIC._applySort(id);
  st.page = 1;
  st.pageSize = (st.opts.autoPage === false) ? 0 : ((st.filtered.length > 50) ? 50 : 0);
  UIC._dtRenderBody(id);
  UIC._dtRefreshPager(id);
};

/* [UI-1.3 / U-03] Sort the current filtered set in place.
 *
 * `st.filtered` is always a fresh array produced by `.filter()` or by
 * `originalRows.slice()`, so reordering it never touches the load order.
 *
 * The comparator keeps the O(n) decorate–sort–undecorate shape the performance
 * run built: each row's sort value is read and parsed ONCE into a decorated
 * record, the sort compares pre-parsed fields, and the rows are read back out.
 * Complexity is unchanged; only the third state and the stable tie-break are
 * new. The tie-break on the original index makes the sort stable, so rows that
 * compare equal keep their load order instead of shuffling between sorts. */
UIC._applySort = function (id) {
  var st = (window.__dtStore || {})[id];
  if (!st) return;
  if (!st.sortKey || !st.sortDir) return;          /* third state: load order */
  var list = st.filtered;
  if (!list || list.length < 2) return;

  var asc = st.sortDir === 'asc';
  var hIdx = st.headers.findIndex(function (h) { return (h.key || h.label) === st.sortKey; });
  if (hIdx === -1) return;
  var sortKey = st.headers[hIdx].sortKey || null;
  var key = st.sortKey;

  var decorated = list.map(function (r, i) {
    var raw;
    if (Array.isArray(r)) raw = r[hIdx];
    else if (sortKey) raw = r[sortKey];
    else raw = r[key];
    var s = (raw == null) ? '' : String(raw);
    var n = parseFloat(s.replace(/,/g, ''));
    return { r: r, s: s, n: n, i: i, isNum: !isNaN(n) && s.trim() !== '' };
  });
  decorated.sort(function (a, b) {
    var c;
    if (a.isNum && b.isNum) c = a.n - b.n;
    else c = a.s.localeCompare(b.s, 'ar');
    if (c !== 0) return asc ? c : -c;
    return a.i - b.i;                              /* stable */
  });
  for (var j = 0; j < decorated.length; j++) list[j] = decorated[j].r;
};

/* Reflect the sort state onto the header cells: aria-sort for assistive tech,
 * a class for the chevron. Called after every sort change. */
UIC._dtSyncSortIndicators = function (id) {
  var st = (window.__dtStore || {})[id];
  var container = document.getElementById(id);
  if (!container) return;
  container.querySelectorAll('th[data-sortable="true"]').forEach(function (th) {
    var key = th.getAttribute('data-key');
    var active = st && st.sortKey === key && st.sortDir;
    th.setAttribute('aria-sort', active ? (st.sortDir === 'asc' ? 'ascending' : 'descending') : 'none');
    th.classList.remove('sorted-asc', 'sorted-desc');
    if (active) th.classList.add(st.sortDir === 'asc' ? 'sorted-asc' : 'sorted-desc');
  });
};

UIC.applyDateFilter = function (id) {
  var st = (window.__dtStore || {})[id];
  if (!st) return;
  var fromEl = document.getElementById(id + '-from');
  var toEl = document.getElementById(id + '-to');
  st.dateFrom = fromEl ? fromEl.value : '';
  st.dateTo = toEl ? toEl.value : '';
  UIC._applyFilters(id);
};

UIC.exportExcel = function (id) {
  var st = (window.__dtStore || {})[id];
  if (!st) return;
  var rows = st.filtered || st.rows;
  if (!rows || !rows.length) { UIC.toast('لا توجد بيانات للتصدير', 'error'); return; }
  // F-18: the library is fetched on first export instead of on every page load.
  if (typeof XLSX === 'undefined') UIC.toast('جاري تحميل مكتبة Excel...', 'info');
  API.ensureXlsx().then(function () {
    var headers = st.headers.filter(function (h) { return h.key !== 'actions'; });
    var data = rows.map(function (r) {
      var obj = {};
      headers.forEach(function (h) { obj[h.label] = r[h.key] != null ? r[h.key] : ''; });
      return obj;
    });
    var ws = XLSX.utils.json_to_sheet(data);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
    var from = st.dateFrom || '';
    var to = st.dateTo || '';
    var title = (st.opts && st.opts.title) || 'report';
    var filename = title + (from ? '_' + from : '') + (to ? '_to_' + to : '') + '.xlsx';
    XLSX.writeFile(wb, filename);
  }).catch(function (e) {
    UIC.toast((e && e.message) || 'تعذر تحميل مكتبة Excel', 'error');
  });
};

UIC.printTable = function (id) {

  if (!rows || !rows.length) { UIC.toast('لا توجد بيانات للطباعة', 'error'); return; }

  var to = st.dateTo || '';
  var title = (st.opts && st.opts.title) || '';
  var dateLabel = (from && to) ? 'من ' + from + ' إلى ' + to : from ? 'من ' + from : to ? 'إلى ' + to : 'الكل';
  var logoUrl = window.COMPANY_LOGO_URL || '';

      var v = r[h.key] != null ? r[h.key] : '';

    }).join('') + '</tr>';
  }).join('');

    return '<th>' + esc(h.label) + '</th>';
  }).join('') + '</tr>';

    '<!DOCTYPE html><html lang="ar"><head><meta charset="utf-8"><title>' + esc(title) + '</title>' +

    '.logo{text-align:center;margin-bottom:8px;} .logo img{max-height:60px;}' +
    'table{width:100%;border-collapse:collapse;font-size:12px;} th,td{border:1px solid #ccc;padding:6px 8px;text-align:right;}' +
    'th{background:#f0f0f0;font-weight:700;} @media print{body{padding:0;}}</style></head><body>' +

    '<h2>' + esc(title) + '</h2>' +
    '<div class="date-info">التاريخ: ' + esc(dateLabel) + ' — العدد: ' + rows.length + '</div>' +
