<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Testing System — المشتريات</title>
  <?!= include('CSS_Tokens'); ?>
  <?!= include('UI_Components'); ?>
  <?!= include('Client_Helpers'); ?>
  <?!= include('Company_ErpTest_Packs'); ?>
  <?!= include('Company_ErpTest_Nav'); ?>
  <?!= getCompanyThemeCSS_('37fc50edf1424abd') ?>
</head>
<body>
<div id="tl-root" dir="rtl"></div>
<script>
  var params = new URLSearchParams(window.location.search);
  var SESSION_TOKEN = params.get('sessionToken') || (API.getSession() || {}).token || '';
  var scriptUrl = window.scriptUrl || '/';
  var IS_SUPER_ADMIN = <?!= user && user.isSuperAdmin ? 'true' : 'false' ?>;
  var USER_PAGES = <?!= user && user.isSuperAdmin ? 'null' : JSON.stringify((user && user.authorizedPages) || {}) ?>;
  var COMPANY_LOGO_URL = '<?!= getCompanyLogoUrl_('37fc50edf1424abd') ?>';
  var COMPANY_PAGES = <?!= companyPages ?>;
  var CURRENT_ACTION = '<?!= currentAction ?>';

  var RECORD_KEYS = {
    code: 'code', tax_system: 'tax_system', receipt_date: 'reciept date', items: 'items', type: 'type',
    shipping_type: 'shipping type', supplier_name: 'supplier name', currency: 'currency', exchange_rate: 'exchange rate',
    value: 'value', cif_insurance_value: 'if shipping via cif, enter the insurance value.',
    importation_reprice: 'importation re-price', tax_declared_value: 'tax declared value',
    administrative_expenses: 'administrative expenses', customs_expenses: 'customs expenses',
    unloading_expenses: 'unloading expenses', bank_commission: 'bank commission',
    customs_clearance: 'customs clearance and port receipts', additional_fees: 'additional fees',
    clearance_expenses: 'clearance expenses', other_expenses: 'other expenses', purchase_tax: 'purchase tax',
    income_tax: 'income tax', internal_cost_adjustment: 'internal cost adjustment',
    minimum_differences: 'minimum differences', approved_this_month: 'approved this month', associated_bank: 'associated bank'
  };

  var HEADER_KEYS = ['code','tax_system','receipt_date','items','type','shipping_type','supplier_name','currency','exchange_rate',
    'value','cif_insurance_value','importation_reprice','tax_declared_value',
    'administrative_expenses','customs_expenses','unloading_expenses','bank_commission','customs_clearance','additional_fees',
    'clearance_expenses','other_expenses','purchase_tax','income_tax','internal_cost_adjustment','minimum_differences',
    'approved_this_month','associated_bank'];

  var __options = {};
  var __headers = [];
  var __lines = [];
  var __editingUid = '';
  var __canEdit = false;

  /* [live-notice D6] list replies from the device cache, trusted by the stamps */
  if (window.UIC && UIC.Live && UIC.Live.viewCache) companyCall = UIC.Live.viewCache(companyCall, { company: '37fc50edf1424abd', page: 'et_purchasing', view: 'list', lists: ['get_et_purchasing_headers'] });
  function companyCall(moduleAction, data) {
    return API.call('company_action', {
      target_system: '37fc50edf1424abd',
      module_action: moduleAction,
      data: data || {}
    }, SESSION_TOKEN);
  }

  function num(v) { var n = Number(v); return isNaN(n) ? 0 : n; }
  function getVal(id) { var el = document.getElementById(id); return el ? el.value : ''; }
  function setText(id, t) { var el = document.getElementById(id); if (el) el.textContent = t; }

  function load() {
    var contentId = 'tl-content';
    UIC.appShell('tl-root', {
      menuGroups: window.ERPTEST_MENU || [],
      companyLogoUrl: COMPANY_LOGO_URL,
      companyLogoHref: scriptUrl + '?action=et_dashboard&sessionToken=' + SESSION_TOKEN,
      companyLogoTitle: 'النظام التجريبي',
      breadcrumb: 'النظام التجريبي / المشتريات',
      contentId: contentId
    });
    renderList();
  }

  /* Like et_products / et_customers: the whole list is read once and
     UIC.dataTable pages it 50 rows at a time, so search, sort and the pager
     all work over every record. */
  function renderList(quiet) {
    /* [live-notice] the view on screen */
    if (UIC.Live.setView) UIC.Live.setView('list', { refresh: function () { renderList(true); }, loading: true });
    if (!quiet) UIC.readSkeleton('tl-content', { message: [
      'جاري تحميل عمليات الشراء...',
      'جاري استرجاع الموردين والتكاليف...',
      'لحظة، جاري تجهيز جدول المشتريات...'
    ] });
    companyCall('get_et_purchasing_headers', { loadAll: true })
      .then(function (r) {
        /* Phase 2.1: options no longer ride along with the list — see
         * ensureOptions(). Still honoured if a response happens to carry them. */
        if (r.options) __options = r.options;
        __headers = r.headers || [];
        UIC.keepTableView('purchasing-table', renderHeadersTable); try{schedulePrefetch();}catch(e){};
      })
      .catch(function (e) { showError(e); })
      .finally(function () { if (!quiet) UI.hideSpinner(); });
  }

  function pick(h) {
    var keys = Array.prototype.slice.call(arguments, 1);
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i].toLowerCase().replace(/_/g,' ');
      for (var kk in h) if (String(kk).toLowerCase().replace(/_/g,' ').trim() === k) {
        var v = h[kk]; if (v !== undefined && v !== null && String(v).trim() !== '') return v;
      }
    }
    return '';
  }
  function renderHeadersTable() {
    var content = document.getElementById('tl-content');
    __headers.sort(function (a, b) {
      var da = pick(a, 'reciept date','receipt date'), db = pick(b, 'reciept date','receipt date');
      return new Date(db) - new Date(da);
    });
    var rows = __headers.map(function (h) {
      /* Tier A: a __pending row shows «—» where the server has not answered
         yet (unique_id is server-assigned, إجمالي التكاليف and approval_status
         are server-computed) and offers no actions — print/approve/edit/delete
         would name a unique_id the server has never seen. The code and header
         fields stay visible: they are the user's own typed values. */
      var pending = !!h.__pending;
      var uid = FMT.escape(h.unique_id||'');
      var btns = [
        { label: '👁️ عرض / View', onclick: "doAction('" + uid + "','view')" },
        { label: '🖨️ طباعة / Print', onclick: "doAction('" + uid + "','print')" }
      ];
      if (String(pick(h,'approval_status')||h.approval_status) !== 'Approved') {
        btns.push({ label: '✅ اعتماد / Approve', onclick: "doAction('" + uid + "','approve')" });
        if (UIC.canFull_()) {
          btns.push({ label: '✏️ تعديل / Edit', onclick: "doAction('" + uid + "','edit')" });
          btns.push({ label: '🗑️ حذف / Delete', color:'#dc2626', onclick: "doAction('" + uid + "','delete')" });
        } else {
          btns.push({ label: '👁️ عرض / View', onclick: "doAction('" + uid + "','view')" });
        }
      }
      var actions = pending ? '…' : UIC.actionDropdown(btns);
      return {
        code: FMT.escape(String(pick(h,'code')||'-')),
        receipt_date: (function(v){ var s=pick(h,'reciept date','receipt date'); return s ? String(s).slice(0,10) : '-'; })(),
        items: FMT.escape(String(pick(h,'items')||'-')),
        type: FMT.escape(String(pick(h,'type')||'-')),
        currency: FMT.escape(String(pick(h,'currency')||'-')),
        total_costs: pending ? '—' : FMT.escape(String(pick(h,'total costs','total_costs')|| (h['total costs']!=null ? String(h['total costs']) : '-'))),
        approval_status: pending ? '—' : FMT.escape(String(pick(h,'approval_status')||h.approval_status||'-')),
        actions: actions
      };
    });
    content.innerHTML = '<div style="display:flex;justify-content:flex-end;margin-bottom:12px;">' +
      '<button class="btn btn-primary" onclick="openForm(\'\')">+ إضافة عملية شراء</button></div>' +
      UIC.dataTable('purchasing-table', {
        title: 'المشتريات',
        headers: [
          { key: 'code', label: 'الكود' },
          { key: 'receipt_date', label: 'تاريخ الاستلام' },
          { key: 'items', label: 'الأصناف' },
          { key: 'type', label: 'النوع' },
          { key: 'currency', label: 'العملة' },
          { key: 'total_costs', label: 'إجمالي التكاليف' },
          { key: 'approval_status', label: 'الحالة' },
          { key: 'actions', label: 'إجراءات / Actions' }
        ],
        rows: rows,
        emptyText: 'لا توجد عمليات شراء'
      });
    UIC.initTableSort('purchasing-table');
  }

  /* Phase 2.1: the dropdown data used to ride along with every list render,
   * costing extra full sheet reads on the server for a form that may never
   * open. It is now fetched once, on first open, and reused after that. */
  var __optionsPromise = null;

  function ensureOptions() {
    if (__optionsPromise) return __optionsPromise;
    __optionsPromise = companyCall('get_et_purchasing_options')
      .then(function (r) { __options = r.options || {}; return __options; })
      .catch(function (e) {
        __optionsPromise = null;   // let the next open retry
        throw e;
      });
    return __optionsPromise;
  }

  function openForm(uid) {
    __editingUid = uid || '';
    var record = null;
    if (uid) {
      record = __headers.find(function (h) { return String(h.unique_id) === String(uid); }) || null;
      /* Row-edit repair (5.5): a requested record that no longer exists shows
         a clear error and returns to the list — it must never silently render
         the Add form. */
      if (!record) { UIC.toast('السجل غير موجود — تم تحديث القائمة', 'error'); showList(); return; }
    }
    /* [live-notice] the view on screen */
    if (UIC.Live.setView('form', { refresh: function () { openForm(__editingUid); }, loading: true, key: __editingUid, table: 'erp_test_purchasing_costing' })) __optionsPromise = null;
    UIC.readSkeleton('tl-content', { message: ['جاري استرجاع الموردين والأصناف...'] });
    ensureOptions()
      .then(function () { renderForm(record); })
      .catch(function (e) { showError(e); })
      .finally(function () { UI.hideSpinner(); });
  }

  function headerSections() {
    var o = __options;
    return [
      { title: 'البيانات الأساسية', open: true, fields: [
        { key: 'code', label: 'الكود (Code) *', type: 'text', required: true },
        { key: 'tax_system', label: 'النظام الضريبي', type: 'select', options: [{ value: 'true', label: 'نعم' }, { value: 'false', label: 'لا' }], default: 'false' },
        { key: 'receipt_date', label: 'تاريخ الاستلام *', type: 'date', required: true, default: 'today' },
        { key: 'items', label: 'الأصناف', type: 'text' },
        { key: 'type', label: 'النوع', type: 'select', required: true, options: ['بيع', 'تصنيع', 'اصول منشأة'] },
        { key: 'shipping_type', label: 'نوع الشحن', type: 'select', required: true, options: ['CIF', 'FOB', 'C&F', 'محلي'] },
        { key: 'supplier_name', label: 'المورد', type: 'select', required: true, options: o.supplier_options || [] },
        { key: 'currency', label: 'العملة', type: 'select', required: true, options: o.currency_options || [], default: 'EGP' },
        { key: 'exchange_rate', label: 'سعر الصرف', type: 'number', required: true, default: 1 },
        { key: 'value', label: 'القيمة (Value) *', type: 'number', required: true }
      ]},
      { title: 'التكاليف والمصاريف', open: true, fields: [
        { key: 'cif_insurance_value', label: 'قيمة التأمين (CIF)', type: 'number', required: true, default: 0 },
        { key: 'importation_reprice', label: 'إعادة تسعير الاستيراد', type: 'number', required: true, default: 0 },
        { key: 'tax_declared_value', label: 'القيمة الضريبية المعلنة', type: 'number', required: true, default: 0 },
        { key: 'administrative_expenses', label: 'مصاريف إدارية', type: 'number', required: true, default: 0 },
        { key: 'customs_expenses', label: 'مصاريف جمركية', type: 'number', required: true, default: 0 },
        { key: 'unloading_expenses', label: 'مصاريف تفريغ', type: 'number', required: true, default: 0 },
        { key: 'bank_commission', label: 'عمولة البنك', type: 'number', required: true, default: 0 },
        { key: 'customs_clearance', label: 'تخليص جمركي ومينائي', type: 'number', required: true, default: 0 },
        { key: 'additional_fees', label: 'رسوم إضافية', type: 'number', required: true, default: 0 },
        { key: 'clearance_expenses', label: 'مصاريف تخليص', type: 'number', required: true, default: 0 },
        { key: 'other_expenses', label: 'مصاريف أخرى', type: 'number', required: true, default: 0 },
        { key: 'internal_cost_adjustment', label: 'تسوية التكلفة الداخلية', type: 'number', required: true, default: 0 }
      ]},
      { title: 'الضرائب وأخرى', fields: [
        { key: 'purchase_tax', label: 'ضريبة الشراء', type: 'number' },
        { key: 'income_tax', label: 'ضريبة الدخل', type: 'number' },
        { key: 'minimum_differences', label: 'الحد الأدنى للفروقات', type: 'text' },
        { key: 'approved_this_month', label: 'معتمد هذا الشهر', type: 'text' },
        { key: 'associated_bank', label: 'البنك المرتبط', type: 'text' }
      ]}
    ];
  }

  function fieldValue(s, record) {
    var v = record ? record[RECORD_KEYS[s.key]] : null;
    if (v !== null && v !== undefined && v !== '') return v;
    if (s.type === 'date' && s.default === 'today') return formatDate(new Date());
    if (s.default !== undefined && s.default !== null) return s.default;
    /* A mandatory number with no default of its own starts blank so it has to
       be typed; the cost fields set default: 0. Optional numbers default to 0. */
    return s.type === 'number' && !s.required ? 0 : '';
  }

  function renderField(s, record) {
    var v = fieldValue(s, record);
    if (s.type === 'select') {
      return UIC.field({ key: s.key, label: s.label, type: 'select', options: s.options, value: v, required: !!s.required });
    }
    if (s.type === 'date') {
      return UIC.field({ key: s.key, label: s.label, type: 'date', value: v, required: !!s.required });
    }
    if (s.key === 'value' && (!v || Number(v) === 0)) v = '';
    return UIC.field({ key: s.key, label: s.label, type: s.type, value: v, required: !!s.required, min: s.type === 'number' ? 0 : undefined, step: s.type === 'number' ? 'any' : undefined });
  }

  function renderForm(record) {
    var content = document.getElementById('tl-content');
    __canEdit = !record || IS_SUPER_ADMIN;

    var sectionsHtml = headerSections().map(function (sec) {
      var grid = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 16px;">' +
        sec.fields.map(function (s) { return renderField(s, record); }).join('') + '</div>';
      return '<details' + (sec.open ? ' open' : '') + ' style="margin-bottom:12px;border:1px solid var(--border-color);border-radius:8px;padding:12px 16px;background:var(--bg-surface);">' +
        '<summary style="font-weight:700;cursor:pointer;margin-bottom:12px;">' + sec.title + '</summary>' + grid + '</details>';
    }).join('');

    content.innerHTML =
      '<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">' +
      '<button class="btn btn-outline" onclick="showList()">← عودة</button>' +
      '<h2 style="margin:0;">' + (record ? 'تعديل عملية شراء' : 'إضافة عملية شراء') + '</h2></div>' +
      '<form id="purchasing-form">' +
      /* The sheet's calculated columns (tlDerivePurchasingHeader_), shown live
         for reference and for the lines-vs-total check. */
      '<div style="padding:16px;background:var(--bg-surface);border:1px solid var(--border-color);border-radius:8px;margin-bottom:16px;">' +
      '<div style="font-weight:700;margin-bottom:10px;">حسابات الشيت (للمراجعة)</div>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 24px;">' +
      calcCell('القيمة بناءً على الفاتورة', 'value_based_on_invoice_display', 'القيمة × سعر الصرف') +
      calcCell('مجموع المصاريف', 'expenses_display', 'إدارية + جمركية + تفريغ + عمولة البنك + تخليص جمركي ومينائي + رسوم إضافية + تخليص + أخرى') +
      calcCell('إضافات غير البيع', 'non_sale_extra_display', 'تسوية التكلفة الداخلية + ضريبة الشراء (لغير نوع «بيع»)') +
      calcCell('إجمالي التكاليف', 'total_costs_display', 'القيمة بناءً على الفاتورة + المصاريف + الإضافات') +
      calcCell('مجموع إجمالي الأصناف', 'lines_total_display', 'مجموع عمود الإجمالي في الأصناف') +
      calcCell('الفرق', 'diff_display', 'إجمالي التكاليف − مجموع الأصناف') +
      calcCell('قيمة البيع', 'sales_value_display', 'لنوع «بيع»: إجمالي التكاليف × 103% مقربة لأقرب 100') +
      calcCell('نوع الضريبة', 'tax_type_display', 'ضريبة الشراء ÷ (إعادة التسعير + المصاريف الجمركية)؛ ≥ 8% ← 14%') +
      calcCell('ضريبة المبيعات', 'sales_tax_display', 'قيمة البيع × 14% إذا نوع الضريبة > 6%') +
      calcCell('نسبة تأمين CIF', 'cif_rate_display', '(قيمة التأمين − القيمة) ÷ القيمة، للشحن CIF') +
      calcCell('الشهر', 'month_display', 'من تاريخ الاستلام') +
      calcCell('السنة', 'year_display', 'من تاريخ الاستلام') +
      '</div>' +
      '<div id="reconcile_status" style="margin-top:12px;font-weight:700;"></div>' +
      '</div>' +
      sectionsHtml +
      '</form>' +
      '<h3 style="margin-top:20px;">الأصناف</h3>' +
      '<div class="table-wrap">' +
      '<table id="lines-table" class="table" style="min-width:900px;"><thead><tr>' +
      '<th>المنتج *</th><th>الكمية *</th><th>سعر الوحدة *</th><th>تكاليف أخرى *</th><th>سعر البيع *</th><th>نوع الحركة *</th><th>الإجمالي</th>' +
      '<th title="الإجمالي ÷ الكمية">تكلفة الوحدة</th><th title="الكمية × سعر الوحدة + تكاليف أخرى ÷ سعر الصرف">التكلفة بالعملة</th><th title="سعر البيع × الكمية">إجمالي البيع</th>' +
      (__canEdit ? '<th></th>' : '') +
      '</tr></thead><tbody id="lines-tbody"></tbody>' +
      '<tfoot><tr style="font-weight:700;"><td colspan="6">مجموع الإجمالي / إجمالي التكاليف</td><td id="lines_total_foot"></td><td colspan="' + (__canEdit ? 4 : 3) + '" id="lines_total_vs"></td></tr></tfoot></table>' +
      '</div>' +
      (__canEdit ? '<div style="margin:12px 0;"><button class="btn btn-outline" onclick="addLine()">+ إضافة صنف</button></div>' : '') +
      '<div style="margin:16px 0;">' + (__canEdit ? '<button class="btn btn-primary" onclick="savePurchasing()">حفظ</button> ' : '') +
      '<button class="btn btn-outline" onclick="showList()">إلغاء</button></div>';

    var curEl = document.getElementById('currency');
    if (curEl) curEl.addEventListener('change', onCurrencyChange);

    attachCalcListeners();

    __lines = [];
    if (record) {
      companyCall('get_et_purchasing_lines', { parent_id: record.unique_id })
        .then(function (r) {
          __lines = (r.lines || []).map(function (l) {
            return { product: l.product, qty: l.qty, unit_price: l.unit_price, other_cost: l.other_cost, sales_value: l.sales_value, movement_type: l.movement_type };
          });
          renderLines();
        })
        .catch(function (e) { UIC.toast(e.message || 'خطأ', 'error'); });
    } else {
      renderLines();
    }
  }

  function attachCalcListeners() {
    ['value','exchange_rate','type','shipping_type','receipt_date','administrative_expenses','customs_expenses',
     'unloading_expenses','bank_commission','customs_clearance','additional_fees','clearance_expenses',
     'other_expenses','internal_cost_adjustment','purchase_tax','importation_reprice','cif_insurance_value'].forEach(function (k) {
      var el = document.getElementById(k);
      if (el) { el.addEventListener('input', recalc); el.addEventListener('change', recalc); }
    });
  }

  function renderLines() {
    var lines = __lines || [];
    var opts = __options || {};
    var html = '';
    for (var i = 0; i < lines.length; i++) {
      var l = lines[i];
      var avail = availableProducts(i);
      html += '<tr>' +
        '<td><select id="product_' + i + '" class="input" onchange="updateLineSelect(' + i + ', \'product\', this.value)">' +
          '<option value="">اختر...</option>' +
          avail.map(function (p) {
            return '<option value="' + p.value + '"' + (String(p.value) === String(l.product) ? ' selected' : '') + '>' + FMT.escape(p.label) + '</option>';
          }).join('') +
          '</select></td>' +
        lineNumInput(i, 'qty', l.qty) +
        lineNumInput(i, 'unit_price', l.unit_price) +
        lineNumInput(i, 'other_cost', l.other_cost) +
        lineNumInput(i, 'sales_value', l.sales_value) +
        '<td><select id="movement_type_' + i + '" class="input" onchange="updateLineSelect(' + i + ', \'movement_type\', this.value)">' +
          '<option value="">اختر...</option>' +
          (opts.movement_type_options || []).map(function (o) {
            return '<option value="' + FMT.escape(o.fifth) + '"' + (String(o.fifth) === String(l.movement_type) ? ' selected' : '') + '>' + FMT.escape(o.code) + '</option>';
          }).join('') +
          '</select></td>' +
        '<td id="total_cost_' + i + '" style="font-weight:700;"></td>' +
        '<td id="unit_cost_' + i + '"></td>' +
        '<td id="cost_currency_' + i + '"></td>' +
        '<td id="sales_value_amount_' + i + '"></td>' +
        (__canEdit ? '<td><button class="btn btn-outline" style="padding:4px 10px;" onclick="removeLine(' + i + ')">حذف</button></td>' : '') +
        '</tr>';
    }
    var tbody = document.getElementById('lines-tbody');
    if (tbody) tbody.innerHTML = html;
    UIC.autoColumns('lines-table');
    recalc();
  }

  function availableProducts(excludeIndex) {
    var chosen = {};
    (__lines || []).forEach(function (l, i) {
      if (i !== excludeIndex && l.product) chosen[String(l.product)] = true;
    });
    return (__options.product_options || []).filter(function (p) { return !chosen[String(p.value)]; });
  }

  function lineNumInput(i, key, v) {
    return '<td><input id="' + key + '_' + i + '" class="input" type="number" min="0" step="any" required value="' + (v != null ? v : '') + '" oninput="updateLineInput(' + i + ', \'' + key + '\', this.value)"></td>';
  }

  function calcCell(label, id, formula) {
    return '<div title="' + FMT.escape(formula) + '"><div style="font-size:12px;color:var(--text-muted);">' + label + '</div>' +
      '<strong id="' + id + '">-</strong>' +
      '<div style="font-size:11px;color:var(--text-muted);">' + FMT.escape(formula) + '</div></div>';
  }

  /* Mandatory numbers start blank (0 is accepted once typed). */
  function addLine() {
    __lines.push({ product: '', qty: '', unit_price: '', other_cost: '', sales_value: '', movement_type: '' });
    renderLines();
  }

  function removeLine(i) {
    __lines.splice(i, 1);
    renderLines();
  }

  function updateLineInput(i, key, value) {
    __lines[i][key] = value;
    var el = document.getElementById(key + '_' + i);
    if (el) el.style.borderColor = '';
    recalc();
  }

  function updateLineSelect(i, key, value) {
    __lines[i][key] = value;
    renderLines();
  }

  /* Mirrors the sheet's calculated columns (tlDerivePurchasingHeader_ /
     tlDerivePurchasingLine_ in Company_ErpTest_Actions.js) — keep in step. */
  function num0(v) { return Math.max(0, num(v)); }

  function lineCalc(l, rate) {
    var qty = num0(l.qty), price = num0(l.unit_price), other = num0(l.other_cost), r = num0(rate);
    var total = qty * price * r + other;
    return {
      total: total,
      unitCost: qty > 0 ? total / qty : 0,
      costCurrency: qty * price + other / (r || 1),
      salesAmount: num0(l.sales_value) * qty
    };
  }

  function headerCalc(h) {
    var value = num0(h.value), rate = num0(h.exchange_rate);
    var vbi = value * rate;
    var expenses = num0(h.administrative_expenses) + num0(h.customs_expenses) + num0(h.unloading_expenses) +
      num0(h.bank_commission) + num0(h.customs_clearance) + num0(h.additional_fees) +
      num0(h.clearance_expenses) + num0(h.other_expenses);
    var isSale = String(h.type || '').trim() === 'بيع';
    var nonSaleExtra = isSale ? 0 : num0(h.internal_cost_adjustment) + num0(h.purchase_tax);
    var totalCosts = vbi + expenses + nonSaleExtra;
    var denom = num0(h.importation_reprice) + num0(h.customs_expenses);
    var taxType = '';
    if (denom > 0) { var ratio = num0(h.purchase_tax) / denom; taxType = ratio >= 0.08 ? 0.14 : ratio; }
    var salesValue = isSale ? Math.round((totalCosts * 103 / 100) / 100) * 100 : 0;
    var salesTax = (taxType !== '' && taxType > 0.06) ? salesValue * 14 / 100 : 0;
    var cifRate = (String(h.shipping_type || '').trim() === 'CIF' && value > 0) ? (num0(h.cif_insurance_value) - value) / value : '';
    return { vbi: vbi, expenses: expenses, nonSaleExtra: nonSaleExtra, totalCosts: totalCosts,
      taxType: taxType, salesValue: salesValue, salesTax: salesTax, cifRate: cifRate };
  }

  var LINE_REQUIRED = [['product', 'المنتج'], ['qty', 'الكمية'], ['unit_price', 'سعر الوحدة'], ['other_cost', 'تكاليف أخرى'],
    ['sales_value', 'سعر البيع'], ['movement_type', 'نوع الحركة']];

  /* Marks every bad line cell and returns the first message, or '' when the lines are valid. */
  function validateLines(rate) {
    var first = '';
    var blank = function (v) { return String(v == null ? '' : v).trim() === ''; };
    (__lines || []).forEach(function (l, i) {
      var n = ' (الصنف ' + (i + 1) + ')';
      LINE_REQUIRED.forEach(function (f) {
        var bad = blank(l[f[0]]) || (f[0] === 'qty' && !(Number(l.qty) > 0));
        var el = document.getElementById(f[0] + '_' + i);
        if (el) el.style.borderColor = bad ? 'var(--danger)' : '';
        if (bad && !first) first = (f[0] === 'qty' && !blank(l.qty) ? 'الكمية يجب أن تكون أكبر من صفر' : f[1] + ' مطلوب') + n;
      });
      var totBad = !(lineCalc(l, rate).total > 0);
      var tEl = document.getElementById('total_cost_' + i);
      if (tEl) tEl.style.color = totBad ? 'var(--danger)' : '';
      if (totBad && !first) first = 'الإجمالي يجب أن يكون أكبر من صفر' + n;
    });
    return first;
  }

  function recalc() {
    var headerRate = num(getVal('exchange_rate'));

    var lineSum = 0;
    (__lines || []).forEach(function (l, i) {
      var c = lineCalc(l, headerRate);
      lineSum += c.total;
      setText('total_cost_' + i, FMT.number(c.total));
      setText('unit_cost_' + i, FMT.number(c.unitCost));
      setText('cost_currency_' + i, FMT.number(c.costCurrency));
      setText('sales_value_amount_' + i, FMT.number(c.salesAmount));
    });
    setText('lines_total_display', FMT.number(lineSum));
    setText('lines_total_foot', FMT.number(lineSum));

    var h = headerCalc({
      value: getVal('value'), exchange_rate: getVal('exchange_rate'), type: getVal('type'),
      shipping_type: getVal('shipping_type'), cif_insurance_value: getVal('cif_insurance_value'),
      administrative_expenses: getVal('administrative_expenses'), customs_expenses: getVal('customs_expenses'),
      unloading_expenses: getVal('unloading_expenses'), bank_commission: getVal('bank_commission'),
      customs_clearance: getVal('customs_clearance'), additional_fees: getVal('additional_fees'),
      clearance_expenses: getVal('clearance_expenses'), other_expenses: getVal('other_expenses'),
      internal_cost_adjustment: getVal('internal_cost_adjustment'), purchase_tax: getVal('purchase_tax'),
      importation_reprice: getVal('importation_reprice')
    });
    var totalCosts = h.totalCosts;
    setText('value_based_on_invoice_display', FMT.number(h.vbi));
    setText('expenses_display', FMT.number(h.expenses));
    setText('non_sale_extra_display', FMT.number(h.nonSaleExtra));
    setText('total_costs_display', FMT.number(totalCosts));

    var diff = totalCosts - lineSum;
    var mismatch = Math.abs(diff) > 0.01;
    var noLines = !(__lines || []).length;
    setText('diff_display', FMT.number(diff));
    ['lines_total_display', 'total_costs_display', 'diff_display', 'lines_total_foot'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.style.color = mismatch ? 'var(--danger)' : 'var(--success)';
    });
    var statusMsg = noLines ? '⚠ يجب إضافة صنف واحد على الأقل'
      : mismatch ? '⚠ مجموع إجمالي الأصناف (' + FMT.number(lineSum) + ') لا يساوي إجمالي التكاليف (' + FMT.number(totalCosts) + ') — الفرق ' + FMT.number(diff)
      : '✓ مجموع إجمالي الأصناف يساوي إجمالي التكاليف';
    var stEl = document.getElementById('reconcile_status');
    if (stEl) { stEl.textContent = statusMsg; stEl.style.color = (noLines || mismatch) ? 'var(--danger)' : 'var(--success)'; }
    setText('lines_total_vs', mismatch ? '≠ ' + FMT.number(totalCosts) + ' (الفرق ' + FMT.number(diff) + ')' : '= ' + FMT.number(totalCosts) + ' ✓');

    setText('sales_value_display', FMT.number(h.salesValue));
    setText('tax_type_display', h.taxType === '' ? '-' : (Math.round(h.taxType * 10000) / 100) + '%');
    setText('sales_tax_display', FMT.number(h.salesTax));
    setText('cif_rate_display', h.cifRate === '' ? '-' : (Math.round(h.cifRate * 10000) / 100) + '%');

    var d = new Date(getVal('receipt_date'));
    if (!isNaN(d.getTime())) {
      setText('month_display', d.getMonth() + 1);
      setText('year_display', d.getFullYear());
    } else {
      setText('month_display', '-');
      setText('year_display', '-');
    }
  }

  function onCurrencyChange() {
    var sel = document.getElementById('currency');
    if (!sel) return;
    var cur = sel.value;
    var opts = __options.currency_options || [];
    for (var i = 0; i < opts.length; i++) {
      if (String(opts[i].value) === String(cur)) {
        var rateEl = document.getElementById('exchange_rate');
        if (rateEl) rateEl.value = opts[i].rate;
        recalc();
        break;
      }
    }
  }

  function savePurchasing() {
    var btn = document.querySelector('#purchasing-form .btn-primary') || document.querySelector('.btn-primary');
    UI.submitOnce(btn, function () {
      var data = UIC.collectForm('purchasing-form');
      var formOk = UIC.validateForm('purchasing-form');
      var header = {};
      HEADER_KEYS.forEach(function (k) { header[k] = data[k] !== undefined ? data[k] : ''; });
      var fail = function (msg) { UIC.toast(msg, 'error'); return Promise.reject(); };
      var missing = headerSections().reduce(function (acc, sec) { return acc.concat(sec.fields); }, [])
        .filter(function (s) { return s.required && String(header[s.key] == null ? '' : header[s.key]).trim() === ''; });
      if (!formOk || missing.length) {
        return fail('حقول مطلوبة: ' + missing.map(function (s) { return s.label.replace(/\s*\*$/, ''); }).join('، '));
      }
      if (!(Number(header.exchange_rate) > 0)) return fail('سعر الصرف يجب أن يكون أكبر من صفر');

      var rate = num(header.exchange_rate);
      if (!(__lines || []).length) return fail('يجب إضافة صنف واحد على الأقل');
      var lineErr = validateLines(rate);
      if (lineErr) return fail(lineErr);
      var lineSum = 0;
      (__lines || []).forEach(function (l) { lineSum += lineCalc(l, rate).total; });
      var headerTotal = headerCalc(header).totalCosts;
      if (Math.abs(lineSum - headerTotal) > 0.01) {
        return fail('مجموع إجمالي الأصناف (' + FMT.number(lineSum) + ') لا يساوي إجمالي التكاليف (' + FMT.number(headerTotal) + ')');
      }

      var payload = { header: header, lines: __lines || [] };
      var isEdit = __editingUid ? true : false;
      if (isEdit) header.unique_id = __editingUid;

      /* Tier A: the header row is on screen before the request returns, with
         no blocking overlay. Validation above (required code/value, the
         lines-total reconciliation) is unchanged. The draft echoes the form's
         own header; unique_id is server-assigned so an ADD draft never invents
         one — recordOf fills it from the reply (record/unique_id/assignedId)
         and answers null when an ADD key stays unknown. The lines converge on
         the reply via the list replace; they are not painted separately.
         queueable:false: I1 is unproven for add/edit_et_purchasing. */
      var draft = Object.assign({}, header);
      draft.unique_id = isEdit ? __editingUid : '';
      if (draft.supplier_name) {
        var sOpts = (__options.supplier_options || []);
        for (var si = 0; si < sOpts.length; si++) {
          if (String(sOpts[si].value) === String(header.supplier_name)) { draft.supplier_name = sOpts[si].label || draft.supplier_name; break; }
        }
      }
      return UIC.Live.save({
        call: companyCall,
        action: isEdit ? 'edit_et_purchasing' : 'add_et_purchasing',
        data: payload,
        list: __headers,
        key: 'unique_id',
        draft: draft,
        render: renderHeadersTable,
        message: 'تم الحفظ',
        queueable: false,
        reload: function () { renderList(true); },
        recordOf: function (resp) {
          if (resp && resp.record && resp.record.unique_id != null && resp.record.unique_id !== '') return resp.record;
          var uid = (resp && resp.unique_id) || (resp && resp.assignedId) || (resp && resp.id);
          if (uid != null && uid !== '') {
            var rec = Object.assign({}, draft);
            rec.unique_id = uid;
            return rec;
          }
          if (isEdit) { var ec = Object.assign({}, draft); ec.unique_id = __editingUid; return ec; }
          return null;
        },
        /* The ten-row cap is applied here, NOT in the draft: trimming at draft
           time would drop the tenth row, and the rollback restores the draft's
           slot but cannot bring that row back. */
        onSuccess: function () {
          if (!isEdit && __headers.length > 10) __headers = __headers.slice(0, 10);
          renderHeadersTable();
        }
      }).catch(function () { /* UIC.Live has toasted and rolled back */ });
    });
  }

  /* Opens in a new tab as before; when the tab is refused, UIC.openTab navigates this frame there instead. */
  function printPurchasing(uid) {
    UIC.openTab(scriptUrl + '?action=et_purchase_print&purchase_code=' + encodeURIComponent(uid) + '&sessionToken=' + encodeURIComponent(SESSION_TOKEN));
  }

  function doAction(uid, action) {
    if (action === 'print') printPurchasing(uid);
    else if (action === 'approve') approvePurchasing(uid);
    else if (action === 'edit' || action === 'view') openForm(uid);
    else if (action === 'delete') deletePurchasing(uid);
  }

  function approvePurchasing(uid) {
    /* Tier A approve: no draft painted, so no draft/list/key/render. onSuccess
       patches the in-memory row and re-renders locally; reload is the
       error-path backstop. No overlay. queueable:false. */
    UIC.Live.save({
      call: companyCall,
      action: 'approve_et_purchasing',
      data: { unique_id: uid },
      onSuccess: function () {
        var item = (__headers || []).find(function (x) { return String(x.unique_id) === String(uid); });
        if (item) item.approval_status = 'Approved';
        renderHeadersTable();
      },
      message: 'تم الاعتماد',
      queueable: false,
      reload: function () { renderList(true); }
    }).catch(function () { /* UIC.Live has toasted */ });
  }

  function deletePurchasing(uid) {
    if (!UIC.canFull_()) { UIC.toast('غير مصرح', 'error'); return; }
    if (!confirm('هل تريد حذف هذه العملية؟')) return;
    /* Tier A delete: no optimistic paint (there is no record to draw — the row
       is gone), so no draft/list/key/render. onSuccess splices the in-memory
       list and re-renders locally; reload is the error-path backstop. No
       overlay. queueable:false. */
    UIC.Live.save({
      call: companyCall,
      action: 'delete_et_purchasing',
      data: { unique_id: uid },
      onSuccess: function () {
        __headers = (__headers || []).filter(function (x) { return String(x.unique_id) !== String(uid); });
        renderHeadersTable();
      },
      message: 'تم الحذف',
      queueable: false,
      reload: function () { renderList(true); }
    }).catch(function () { /* UIC.Live has toasted */ });
  }

  function showList() {
    renderList();
  }

  /* Another device's change arrives quietly. */
  UIC.Live.watchPage({
    call: companyCall,
    page: 'et_purchasing',
    onChange: function () { UIC.Live.arrive(function () { renderList(true); }); }
  });

  function showError(e) {
    var content = document.getElementById('tl-content');
    if (content) content.innerHTML = '<div class="empty-state"><span>' + FMT.escape(e.message || 'خطأ') + '</span></div>';
  }

  function formatDate(v) {
    if (!v) return '';
    var d = new Date(v);
    if (isNaN(d.getTime())) return String(v).slice(0, 10);
    return d.toISOString().slice(0, 10);
  }


  if (window.ET_PACKS) companyCall = ET_PACKS.wrapCall(companyCall, { page: 'et_purchasing', list: 'get_et_purchasing_headers', refresh: function () { renderList(true); } });
  load();
</script>
</body>
