<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Top Light — عروض الأسعار</title>
  <?!= include('CSS_Tokens'); ?>
  <?!= include('UI_Components'); ?>
  <?!= include('Client_Helpers'); ?>
  <?!= include('Company_TopLight_Nav'); ?>
  <?!= getCompanyThemeCSS_('8df5c89a117fe9a5') ?>
</head>
<body>
<div id="tl-root" dir="rtl"></div>
<script>
  var params = new URLSearchParams(window.location.search);
  var SESSION_TOKEN = params.get('sessionToken') || (API.getSession() || {}).token || '';
  var scriptUrl = window.scriptUrl || '/';
  var IS_SUPER_ADMIN = <?!= user && user.isSuperAdmin ? 'true' : 'false' ?>;
  var USER_PAGES = <?!= user && user.isSuperAdmin ? 'null' : JSON.stringify((user && user.authorizedPages) || {}) ?>;
  var COMPANY_LOGO_URL = '<?!= getCompanyLogoUrl_('8df5c89a117fe9a5') ?>';
  var COMPANY_PAGES = <?!= companyPages ?>;
  var CURRENT_ACTION = '<?!= currentAction ?>';

  var __options = {};
  var __headers = [];
  var __lines = [];
  var __editingUid = '';
  var __canEdit = false;

  /* [live-notice D6] list replies from the device cache, trusted by the stamps */
  if (window.UIC && UIC.Live && UIC.Live.viewCache) companyCall = UIC.Live.viewCache(companyCall, { company: '8df5c89a117fe9a5', page: 'tl_sales_offer', view: 'list', lists: ['get_sales_offer_headers'] });
  function companyCall(moduleAction, data) {
    return API.call('company_action', {
      target_system: '8df5c89a117fe9a5',
      module_action: moduleAction,
      data: data || {}
    }, SESSION_TOKEN);
  }

  function num(v) { var n = Number(v); return isNaN(n) ? 0 : n; }
  function getVal(id) { var el = document.getElementById(id); return el ? el.value : ''; }
  function setText(id, t) { var el = document.getElementById(id); if (el) el.textContent = t; }

  function load() {
    UIC.appShell('tl-root', {
      menuGroups: window.TOPLIGHT_MENU || [],
      companyLogoUrl: COMPANY_LOGO_URL,
      companyLogoHref: scriptUrl + '?action=tl_dashboard&sessionToken=' + SESSION_TOKEN,
      companyLogoTitle: 'القمة لايت',
      breadcrumb: 'القمة لايت / عروض الأسعار',
      contentId: 'tl-content'
    });
    renderList();
  }

  var LOADED_ALL = false;
  function toggleLoadAll() { LOADED_ALL = !LOADED_ALL; renderList(); }

  function renderList(quiet) {
    /* [live-notice] the view on screen */
    if (UIC.Live.setView) UIC.Live.setView('list', { refresh: function () { renderList(true); }, loading: true });
    if (!quiet) UIC.readSkeleton('tl-content', { message: [
      'جاري تحميل عروض الأسعار...',
      'جاري استرجاع العملاء والأصناف...',
      'لحظة، جاري تجهيز جدول العروض...'
    ] });
    companyCall('get_sales_offer_headers', LOADED_ALL ? { loadAll: true } : {})
      .then(function (r) {
        __options = r.options || {};
        __headers = r.headers || [];
        renderHeadersTable(); try{schedulePrefetch();}catch(e){};
      })
      .catch(function (e) { showError(e); })
      .finally(function () { if (!quiet) UI.hideSpinner(); });
  }

  function renderHeadersTable() {
    var content = document.getElementById('tl-content');
    __headers.sort(function (a, b) {
      return new Date(b['تاريخ الفاتورة']) - new Date(a['تاريخ الفاتورة']);
    });
    var rows = __headers.map(function (h) {
      /* Tier A: a __pending row shows «—» where the server has not answered
         yet (رقم العرض is server-assigned, the money cells and approval_status
         are server-computed) and offers no actions — print/approve/edit/delete
         would name an invoice_unique_id the server has never seen. The عميل
         and date stay visible: they are the user's own typed values. (Money
         cells print «—» explicitly here; UIC._dtRowHtml would coerce a
         money:true column to 0.00 transiently — no column defs changed.) */
      var pending = !!h.__pending;
      var opts = '<option value="">إجراءات...</option>' +
        '<option value="print">طباعة</option>';
      if (String(h.approval_status) !== 'Approved') {
        opts += '<option value="approve">اعتماد</option>';
        if (UIC.canFull_()) {
          opts += '<option value="edit">تعديل</option><option value="delete">حذف</option>';
        } else {
          opts += '<option value="view">عرض</option>';
        }
      }
      var actions = pending ? '…' : '<select class="input" style="padding:6px 8px;width:130px;" onchange="doAction(\'' + FMT.escape(h.invoice_unique_id) + '\', this.value); this.value=\'\';">' + opts + '</select>';
      return {
        invoice_number: pending ? '—' : (h['رقم الفاتورة'] || '-'),
        customer_name: h.customer_name || '-',
        invoice_date: h['تاريخ الفاتورة'] ? String(h['تاريخ الفاتورة']).slice(0, 10) : '-',
        net: pending ? '—' : FMT.number(h['المبلغ الصافي']),
        discount_percent: pending ? '—' : FMT.percent(h['نسبة الخصم']),
        discount_amount: pending ? '—' : FMT.number(h['قيمة الخصم']),
        total: pending ? '—' : FMT.number(h['إجمالي']),
        approval_status: pending ? '—' : (h.approval_status || '-'),
        actions: actions
      };
    });
    content.innerHTML = '<div style="display:flex;justify-content:flex-end;margin-bottom:12px;">' +
      '<button class="btn btn-primary" onclick="openForm(\'\')">+ إضافة عرض سعر</button></div>' +
      UIC.showAllBar({ loadedAll: LOADED_ALL, showAll: 'toggleLoadAll()', showLatest: 'toggleLoadAll()' }) +
      UIC.dataTable('offer-table', {
        /* [RT-1] The list endpoint caps at the newest rows unless `loadAll` is
           passed, and the search box filters only what is in memory — so the
           table says which records the box actually searches. */
        truncated: !LOADED_ALL,
        showAll: 'toggleLoadAll()',
        title: 'عروض الأسعار',
        headers: [
          { key: 'invoice_number', label: 'رقم العرض' },
          { key: 'customer_name', label: 'العميل' },
          { key: 'invoice_date', label: 'تاريخ العرض' },
          { key: 'net', label: 'المبلغ الصافي', numeric: true },
          { key: 'discount_percent', label: 'نسبة الخصم', numeric: true },
          { key: 'discount_amount', label: 'قيمة الخصم', numeric: true },
          { key: 'total', label: 'الإجمالي', numeric: true },
          { key: 'approval_status', label: 'الحالة' },
          { key: 'actions', label: 'إجراءات' }
        ],
        rows: rows,
        emptyText: 'لا توجد عروض أسعار'
      });
    UIC.initTableSort('offer-table');
  }

  function openForm(uid) {
    __editingUid = uid || '';
    var record = null;
    if (uid) {
      record = __headers.find(function (h) { return String(h.invoice_unique_id) === String(uid); }) || null;
      /* Row-edit repair (5.5): a requested record that no longer exists shows
         a clear error and returns to the list — it must never silently render
         the Add form. */
      if (!record) { UIC.toast('السجل غير موجود — تم تحديث القائمة', 'error'); showList(); return; }
    }
    /* [live-notice] the view on screen */
    if (UIC.Live.setView) UIC.Live.setView('form', { refresh: function () { openForm(__editingUid); }, loading: true, key: __editingUid, table: 'top_light_sales_offer' });
    renderForm(record);
  }

  function renderForm(record) {
    var content = document.getElementById('tl-content');
    __canEdit = !record || IS_SUPER_ADMIN;

    var o = __options;
    var custId = record ? String(record['اسم العميل']) : '';
    var invoiceDate = record ? formatDate(record['تاريخ الفاتورة']) : formatDate(new Date());
    var discount = record ? String(record['نسبة الخصم']) : '0';
    var taxSystem = record ? String(record.tax_system) : 'false';

    content.innerHTML =
      '<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">' +
      '<button class="btn btn-outline" onclick="showList()">← عودة</button>' +
      '<h2 style="margin:0;">' + (record ? 'تعديل عرض سعر' : 'إضافة عرض سعر') + '</h2></div>' +
      '<form id="offer-form">' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 16px;padding:16px;background:var(--bg-surface);border:2px solid var(--border-color);border-radius:8px;margin-bottom:16px;">' +
      UIC.field({ key: 'customer_id', label: 'اسم العميل *', type: 'select', options: o.customer_options || [], value: custId, required: true, placeholder: 'اختر العميل...' }) +
      UIC.field({ key: 'invoice_date', label: 'تاريخ العرض *', type: 'date', value: invoiceDate, required: true }) +
      UIC.field({ key: 'discount_percent', label: 'نسبة الخصم', type: 'select', options: o.discount_options || [], value: discount }) +
      UIC.field({ key: 'tax_system', label: 'النظام الضريبي', type: 'select', options: [{ value: 'false', label: 'لا' }, { value: 'true', label: 'نعم' }], value: taxSystem }) +
      '</div>' +
      '<div id="customer_info" style="display:flex;flex-wrap:wrap;gap:16px;padding:10px 16px;background:var(--bg-subtle);border:2px solid var(--border-color);border-radius:8px;margin-bottom:16px;">' +
      '<span>رقم التسجيل الضريبي: <strong id="c_tax_id">-</strong></span>' +
      '<span>رقم الموبيل: <strong id="c_telephone">-</strong></span>' +
      '<span>العنوان: <strong id="c_address">-</strong></span>' +
      '</div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:24px;padding:16px;background:var(--bg-surface);border:2px solid var(--border-color);border-radius:8px;margin-bottom:16px;">' +
      '<div>المبلغ الصافي: <strong id="net_display">0</strong></div>' +
      '<div>قيمة الخصم: <strong id="discount_display">0</strong></div>' +
      '<div>قيمة الضريبة: <strong id="tax_display">0</strong></div>' +
      '<div>الإجمالي: <strong id="total_display">0</strong></div>' +
      '</div>' +
      '</form>' +
      '<h3 style="margin-top:20px;">الأصناف</h3>' +
      '<div class="table-wrap">' +
      '<table id="lines-table" class="table" style="min-width:900px;"><thead><tr>' +
      '<th>المنتج</th><th>الكمية</th><th>السعر</th><th>نسبة الضريبة</th><th>الخصم</th><th>الإجمالي</th>' + (__canEdit ? '<th></th>' : '') +
      '</tr></thead><tbody id="lines-tbody"></tbody></table>' +
      '</div>' +
      (__canEdit ? '<div style="margin:12px 0;"><button class="btn btn-outline" onclick="addLine()">+ إضافة صنف</button></div>' : '') +
      '<div style="margin:16px 0;">' + (__canEdit ? '<button class="btn btn-primary" onclick="saveOffer()">حفظ</button> ' : '') +
      '<button class="btn btn-outline" onclick="showList()">إلغاء</button></div>';

    var custEl = document.getElementById('customer_id');
    if (custEl) custEl.addEventListener('change', onCustomerChange);
    var discEl = document.getElementById('discount_percent');
    if (discEl) { discEl.addEventListener('change', recalc); discEl.addEventListener('input', recalc); }

    if (custId) onCustomerChange();

    __lines = [];
    if (record) {
      companyCall('get_sales_offer_lines', { parent_id: record.invoice_unique_id })
        .then(function (r) {
          __lines = (r.lines || []).map(function (l) {
            return { product_id: l.product_id, product_qty: l.product_qty, product_price: l.product_price, product_tax: l.product_tax, product_discount: l.product_discount };
          });
          renderLines();
        })
        .catch(function (e) { UIC.toast(e.message || 'خطأ', 'error'); });
    } else {
      renderLines();
    }
  }

  function onCustomerChange() {
    var sel = document.getElementById('customer_id');
    if (!sel) return;
    var opts = __options.customer_options || [];
    var found = null;
    for (var i = 0; i < opts.length; i++) {
      if (String(opts[i].value) === String(sel.value)) { found = opts[i]; break; }
    }
    setText('c_tax_id', found && found.tax_id ? found.tax_id : '-');
    setText('c_telephone', found && found.telephone ? found.telephone : '-');
    setText('c_address', found && found.address ? found.address : '-');
  }

  function renderLines() {
    var lines = __lines || [];
    var opts = __options || {};
    var html = '';
    for (var i = 0; i < lines.length; i++) {
      var l = lines[i];
      var productCombo = UIC.combo({
        key: 'product_id_' + i,
        options: opts.product_options || [],
        value: l.product_id,
        placeholder: 'اكتب للبحث…',
        inline: true
      });
      html += '<tr>' +
        '<td>' + productCombo + '</td>' +
        '<td><input class="input" type="number" min="0" step="any" value="' + (l.product_qty != null ? l.product_qty : '') + '" oninput="updateLineInput(' + i + ', \'product_qty\', this.value)">' +
        '<div style="font-size:11px;color:var(--text-muted);">متاح: ' + availableQty(i) + '</div></td>' +
        '<td><input class="input" type="number" min="0" step="any" value="' + (l.product_price != null ? l.product_price : '') + '" oninput="updateLineInput(' + i + ', \'product_price\', this.value)"></td>' +
        '<td><select id="product_tax_' + i + '" class="input" onchange="updateLineSelect(' + i + ', \'product_tax\', this.value)">' +
          (opts.product_tax_options || []).map(function (t) {
            return '<option value="' + FMT.escape(t.value) + '"' + (String(t.value) === String(l.product_tax) ? ' selected' : '') + '>' + FMT.escape(t.label) + '</option>';
          }).join('') +
          '</select></td>' +
        '<td><input class="input" type="number" min="0" step="any" value="' + (l.product_discount != null ? l.product_discount : '') + '" oninput="updateLineInput(' + i + ', \'product_discount\', this.value)"></td>' +
        '<td id="line_total_' + i + '"></td>' +
        (__canEdit ? '<td><button class="btn btn-outline" style="padding:4px 10px;" onclick="removeLine(' + i + ')">حذف</button></td>' : '') +
        '</tr>';
    }
    var tbody = document.getElementById('lines-tbody');
    if (tbody) tbody.innerHTML = html;
    for (var j = 0; j < lines.length; j++) {
      var productEl = document.getElementById('product_id_' + j);
      if (productEl) {
        productEl.addEventListener('change', (function (lineIndex) {
          return function () { updateLineSelect(lineIndex, 'product_id', this.value); };
        })(j));
      }
    }
    UIC.autoColumns('lines-table');
    recalc();
  }

  function addLine() {
    __lines.push({ product_id: '', product_qty: 0, product_price: 0, product_tax: 0, product_discount: 0 });
    renderLines();
  }

  function removeLine(i) {
    __lines.splice(i, 1);
    renderLines();
  }

  function updateLineInput(i, key, value) {
    __lines[i][key] = value;
    recalc();
  }

  function findProductOption(value) {
    var opts = __options.product_options || [];
    for (var k = 0; k < opts.length; k++) {
      if (String(opts[k].value) === String(value)) return opts[k];
    }
    return null;
  }

  function availableQty(i) {
    var opt = findProductOption(__lines[i].product_id);
    return opt && opt.current_qty != null ? opt.current_qty : 0;
  }

  function updateLineSelect(i, key, value) {
    __lines[i][key] = value;
    if (key === 'product_id') {
      var opt = findProductOption(value);
      if (opt) __lines[i].product_price = opt.default_price != null ? opt.default_price : 0;
    }
    renderLines();
  }

  function recalc() {
    var discountPercent = num(getVal('discount_percent'));
    var net = 0, lineDiscount = 0, tax = 0;
    (__lines || []).forEach(function (l, i) {
      var nv = num(l.product_qty) * num(l.product_price);
      net += nv;
      lineDiscount += num(l.product_discount);
      tax += nv * num(l.product_tax);
      setText('line_total_' + i, FMT.number(nv - num(l.product_discount) + nv * num(l.product_tax)));
    });
    var discountAmount = lineDiscount + net * discountPercent;
    var total = net - discountAmount + tax;
    setText('net_display', FMT.number(net));
    setText('discount_display', FMT.number(discountAmount));
    setText('tax_display', FMT.number(tax));
    setText('total_display', FMT.number(total));
  }

  function saveOffer() {
    var btn = document.querySelector('#offer-form .btn-primary') || document.querySelector('.btn-primary');
    UI.submitOnce(btn, function () {
      var data = UIC.collectForm('offer-form');
      if (!UIC.validateForm('offer-form')) return Promise.reject();

      var header = {
        customer_id: data.customer_id,
        invoice_date: data.invoice_date,
        discount_percent: data.discount_percent,
        tax_system: data.tax_system
      };
      if (String(header.customer_id || '').trim() === '') { UIC.toast('اسم العميل مطلوب', 'error'); return Promise.reject(); }
      if (String(header.invoice_date || '').trim() === '') { UIC.toast('تاريخ العرض مطلوب', 'error'); return Promise.reject(); }
      if (!(__lines || []).length) { UIC.toast('يجب إضافة صنف واحد على الأقل', 'error'); return Promise.reject(); }

      for (var i = 0; i < __lines.length; i++) {
        var l = __lines[i];
        if (String(l.product_id == null ? '' : l.product_id).trim() === '') { UIC.toast('المنتج مطلوب لكل صنف', 'error'); return Promise.reject(); }
        if (String(l.product_tax == null ? '' : l.product_tax).trim() === '') { UIC.toast('نسبة الضريبة مطلوبة لكل صنف', 'error'); return Promise.reject(); }
        if (String(l.product_qty == null ? '' : l.product_qty).trim() === '') { UIC.toast('الكمية مطلوبة لكل صنف', 'error'); return Promise.reject(); }
        if (String(l.product_price == null ? '' : l.product_price).trim() === '') { UIC.toast('السعر مطلوب لكل صنف', 'error'); return Promise.reject(); }
        if (String(l.product_discount == null ? '' : l.product_discount).trim() === '') { UIC.toast('الخصم مطلوب لكل صنف', 'error'); return Promise.reject(); }
        if (num(l.product_qty) <= 0) { UIC.toast('الكمية يجب أن تكون أكبر من صفر', 'error'); return Promise.reject(); }
        if (num(l.product_price) <= 0) { UIC.toast('السعر يجب أن يكون أكبر من صفر', 'error'); return Promise.reject(); }
      }

      var payload = { header: header, lines: __lines || [] };
      var isEdit = __editingUid ? true : false;
      if (isEdit) header.unique_id = __editingUid;

      /* Tier A: the offer row is on screen before the request returns, with no
         blocking overlay. Validation above (required customer/date, one line
         minimum, per-line product/tax/qty/price/discount) is unchanged. Unlike
         invoices, offers carry no stock-availability guard (validateSales_
         runs with allowOutOfStock), so there is nothing invisible left to
         refuse. The draft echoes the form; رقم العرض is server-assigned so an
         ADD draft never invents one — recordOf fills it from the reply
         (record/unique_id/assignedId) and answers null when an ADD key stays
         unknown. queueable:false: I1 is unproven for add/edit_sales_offer. */
      var draft = {
        invoice_unique_id: isEdit ? __editingUid : '',
        unique_id: isEdit ? __editingUid : '',
        'اسم العميل': header.customer_id,
        'تاريخ الفاتورة': header.invoice_date,
        'نسبة الخصم': header.discount_percent,
        tax_system: header.tax_system,
        customer_name: ''
      };
      var optsO = (__options.customer_options || []);
      for (var ci = 0; ci < optsO.length; ci++) {
        if (String(optsO[ci].value) === String(header.customer_id)) { draft.customer_name = optsO[ci].label || ''; break; }
      }
      return UIC.Live.save({
        call: companyCall,
        action: isEdit ? 'edit_sales_offer' : 'add_sales_offer',
        data: payload,
        list: __headers,
        key: 'invoice_unique_id',
        draft: draft,
        render: renderHeadersTable,
        message: 'تم الحفظ',
        queueable: false,
        reload: function () { renderList(true); },
        recordOf: function (resp) {
          if (resp && resp.record && resp.record.invoice_unique_id != null && resp.record.invoice_unique_id !== '') return resp.record;
          var uid = (resp && resp.unique_id) || (resp && resp.assignedId) || (resp && resp.id);
          if (uid != null && uid !== '') {
            var rec = Object.assign({}, draft);
            rec.invoice_unique_id = uid;
            rec.unique_id = uid;
            return rec;
          }
          if (isEdit) { var ec = Object.assign({}, draft); ec.invoice_unique_id = __editingUid; ec.unique_id = __editingUid; return ec; }
          return null;
        },
        /* The ten-row cap is applied here, NOT in the draft: trimming at draft
           time would drop the tenth row, and the rollback restores the draft's
           slot but cannot bring that row back. */
        onSuccess: function () {
          if (!isEdit && __headers.length > 10) __headers = __headers.slice(0, 10);
          renderHeadersTable();
        }
      }).catch(function () { /* UIC.Live has toasted and rolled back */ });
    });
  }

  /* Opens in a new tab as before; when the tab is refused, UIC.openTab navigates this frame there instead. */
  function printOffer(uid) {
    UIC.openTab(scriptUrl + '?action=tl_sales_offer_print&purchase_code=' + encodeURIComponent(uid) + '&sessionToken=' + encodeURIComponent(SESSION_TOKEN));
  }

  function doAction(uid, action) {
    if (action === 'print') printOffer(uid);
    else if (action === 'approve') approveOffer(uid);
    else if (action === 'edit' || action === 'view') openForm(uid);
    else if (action === 'delete') deleteOffer(uid);
  }

  function approveOffer(uid) {
    /* Tier A approve: no draft painted, so no draft/list/key/render. onSuccess
       patches the in-memory row and re-renders locally; reload is the
       error-path backstop. No overlay. queueable:false. */
    UIC.Live.save({
      call: companyCall,
      action: 'approve_sales_offer',
      data: { unique_id: uid },
      onSuccess: function () {
        var item = (__headers || []).find(function (x) { return String(x.invoice_unique_id) === String(uid); });
        if (item) item.approval_status = 'Approved';
        renderHeadersTable();
      },
      message: 'تم الاعتماد',
      queueable: false,
      reload: function () { renderList(true); }
    }).catch(function () { /* UIC.Live has toasted */ });
  }

  function deleteOffer(uid) {
    if (!UIC.canFull_()) { UIC.toast('غير مصرح', 'error'); return; }
    if (!confirm('هل تريد حذف هذا العرض؟')) return;
    /* Tier A delete: no optimistic paint (there is no record to draw — the row
       is gone), so no draft/list/key/render. onSuccess splices the in-memory
       list and re-renders locally; reload is the error-path backstop. No
       overlay. queueable:false. */
    UIC.Live.save({
      call: companyCall,
      action: 'delete_sales_offer',
      data: { unique_id: uid },
      onSuccess: function () {
        __headers = (__headers || []).filter(function (x) { return String(x.invoice_unique_id) !== String(uid); });
        renderHeadersTable();
      },
      message: 'تم الحذف',
      queueable: false,
      reload: function () { renderList(true); }
    }).catch(function () { /* UIC.Live has toasted */ });
  }

  function showList() {
    renderList();
  }

  /* Another device's change arrives quietly. */
  UIC.Live.watchPage({
    call: companyCall,
    page: 'tl_sales_offer',
    onChange: function () { UIC.Live.arrive(function () { renderList(true); }); }
  });

  function showError(e) {
    var content = document.getElementById('tl-content');
    if (content) content.innerHTML = '<div class="empty-state"><span>' + FMT.escape(e.message || 'خطأ') + '</span></div>';
  }

  function formatDate(v) {
    if (!v) return '';
    var d = new Date(v);
    if (isNaN(d.getTime())) return String(v).slice(0, 10);
    return d.toISOString().slice(0, 10);
  }


  load();
</script>
</body>
</html>
