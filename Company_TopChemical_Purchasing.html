<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>توريدات ومشتريات</title>
  <?!= include('CSS_Tokens'); ?>
  <?!= include('UI_Components'); ?>
  <?!= include('Client_Helpers'); ?>
  <?!= include('Company_TopChemical_Nav'); ?>
  <?!= getCompanyThemeCSS_('3fe1b5cb67b7223e') ?>
</head>
<body>
<div id="tc-root" dir="rtl"></div>
<script>
  var params = new URLSearchParams(window.location.search);
  var SESSION_TOKEN = params.get('sessionToken') || (API.getSession() || {}).token || '';
  var scriptUrl = window.scriptUrl || '/';
  var IS_SUPER_ADMIN = <?!= user && user.isSuperAdmin ? 'true' : 'false' ?>;
  var COMPANY_LOGO_URL = '<?!= getCompanyLogoUrl_('3fe1b5cb67b7223e') ?>';
  var COMPANY_PAGES = <?!= companyPages ?>;
  var CURRENT_ACTION = '<?!= currentAction ?>';
  var USER_PAGES = <?!= user && user.isSuperAdmin ? 'null' : JSON.stringify((user && user.authorizedPages) || {}) ?>;
  var CAN_WRITE = UIC.canAdd_(); var CAN_FULL = UIC.canFull_();

  /* [live-notice D6] list replies from the device cache, trusted by the stamps */
  if (window.UIC && UIC.Live && UIC.Live.viewCache) companyCall = UIC.Live.viewCache(companyCall, { company: '3fe1b5cb67b7223e', page: 'tc_purchasing', view: 'list', lists: ['get_purchase_items'] });
  function companyCall(moduleAction, data) {
    return API.call('company_action', {
      target_system: '3fe1b5cb67b7223e',
      module_action: moduleAction,
      data: data || {}
    }, SESSION_TOKEN);
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function todayStr() {
    var d = new Date();
    var p = function (n) { return ('0' + n).slice(-2); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  function fmtDate(v) {
    if (v == null || v === '') return '';
    var d = (v instanceof Date) ? v : new Date(v);
    if (isNaN(d.getTime())) return String(v);
    var p = function (n) { return ('0' + n).slice(-2); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  function setSelectOptions(selectId, options, selectedValue) {
    var sel = document.getElementById(selectId);
    if (!sel) return;
    sel.innerHTML = '<option value="">اختر...</option>' + (options || []).map(function (o) {
      var v = typeof o === 'object' ? o.value : o;
      var l = typeof o === 'object' ? o.label : o;
      var s = String(v) === String(selectedValue) ? ' selected' : '';
      return '<option value="' + esc(v) + '"' + s + '>' + esc(l) + '</option>';
    }).join('');
  }

  function load() {
    var contentId = 'purchasing-content';
    UIC.appShell('tc-root', {
      companyLogoUrl: COMPANY_LOGO_URL,
      companyLogoHref: scriptUrl + '?action=tc_dashboard&sessionToken=' + SESSION_TOKEN,
      companyLogoTitle: 'توب كيميكال',
      breadcrumb: 'توب كيميكال / الاستيراد والمشتريات / توريدات ومشتريات',
      contentId: contentId,
      menuGroups: (window.TOPCHEMICAL_MENU || [])
    });
    fetchPurchases();
  }

  var LOADED_ALL = false;
  function toggleLoadAll() { LOADED_ALL = !LOADED_ALL; fetchPurchases(); }

  function fetchPurchases(quiet) {
    if (!quiet) UI.showSpinner();
    companyCall('get_purchase_items', LOADED_ALL ? { loadAll: true } : {})
      .then(function (r) {
        window.__purchases = r.purchases || [];
        /* Phase 7.1: the vendor/item dropdown lists no longer ride along with
         * the list render — see ensureOptions(). Still honoured if a response
         * happens to carry them (withOptions:true). */
        if (r.vendor_options) window.__vendorOptions = r.vendor_options;
        if (r.item_options) window.__itemOptions = r.item_options;
        renderPurchases(); try{schedulePrefetch();}catch(e){};
      })
      .catch(function (e) { showError(e); })
      .finally(function () { if (!quiet) UI.hideSpinner(); });
  }

  /* Phase 7.1: the option lists used to be rebuilt and Arabic-sorted on every
   * list render, for a form that may never open. Fetched once, on first open,
   * and reused after that. */
  var __optionsPromise = null;

  function ensureOptions() {
    if (__optionsPromise) return __optionsPromise;
    __optionsPromise = companyCall('get_purchase_options')
      .then(function (r) {
        window.__vendorOptions = r.vendor_options || [];
        window.__itemOptions = r.item_options || [];
      })
      .catch(function (e) {
        __optionsPromise = null;   // let the next open retry
        throw e;
      });
    return __optionsPromise;
  }

  function renderPurchases() {
    var list = window.__purchases;
    var rows = list.map(function (p) {
      return {
        id: p.id,
        vendor_name: esc(p.vendor_name || '-'),
        invoice_no: esc(p.invoice_no || '-'),
        invoice_date: fmtDate(p.invoice_date),
        item_name: esc(p.item_name || '-'),
        item_brand: esc(p.item_brand || '-'),
        qty: p.qty,
        price: p.price,
        receipt_date: fmtDate(p.receipt_date),
        actions: UIC.actionBtns([{ label: 'عرض', onclick: 'openDetail(' + window.__purchases.indexOf(p) + ')' }])
      };
    });
    var headers = [
      { key: 'id', label: '#', numeric: true },
      { key: 'vendor_name', label: 'المورد' },
      { key: 'invoice_no', label: 'رقم الفاتورة' },
      { key: 'invoice_date', label: 'تاريخ الفاتورة', numeric: true },
      { key: 'item_name', label: 'الصنف' },
      { key: 'item_brand', label: 'البراند' },
      { key: 'qty', label: 'الكمية', numeric: true },
      { key: 'price', label: 'سعر الوحدة', numeric: true },
      { key: 'receipt_date', label: 'تاريخ الاستلام', numeric: true },
      { key: 'actions', label: 'إجراءات' }
    ];
    var body = document.getElementById('purchasing-content');
    body.innerHTML = (CAN_WRITE
      ? '<div style="display:flex;justify-content:flex-end;margin-bottom:12px;"><button class="btn btn-primary" onclick="openAddModal()">+ إضافة توريد</button></div>'
      : '') +
      UIC.showAllBar({ loadedAll: LOADED_ALL, showAll: 'toggleLoadAll()', showLatest: 'toggleLoadAll()' }) +
      UIC.dataTable('purchasing-table', {
        /* [RT-1] The list endpoint caps at the newest rows unless `loadAll` is
           passed, and the search box filters only what is in memory — so the
           table says which records the box actually searches. */
        truncated: !LOADED_ALL,
        showAll: 'toggleLoadAll()',
        title: 'توريدات ومشتريات',
        headers: headers,
        rows: rows,
        emptyText: 'لا توجد توريدات'
      });
    UIC.initTableSort('purchasing-table');
  }

  function openAddModal() {
    UI.showSpinner('جاري استرجاع خيارات الموردين والأصناف...');
    ensureOptions()
      .then(function () { renderAddModal(); })
      .catch(function (e) { UIC.toast(e.message || 'خطأ', 'error'); })
      .finally(function () { UI.hideSpinner(); });
  }

  function renderAddModal() {
    var body =
      '<form id="purchase-form">' +
      '<div class="form-field" data-field="vendor">' +
        '<label class="form-label" for="vendor">المورد <span class="req">*</span></label>' +
        '<div style="display:flex;gap:8px;">' +
          '<select id="vendor" class="input" required style="flex:1;"><option value="">اختر المورد...</option></select>' +
          '<button type="button" class="btn btn-outline" onclick="openVendorPopup()">+ إضافة مورد</button>' +
        '</div>' +
        '<div class="field-error" id="err-vendor"></div>' +
      '</div>' +
      '<div class="form-field" data-field="item">' +
        '<label class="form-label" for="item">الصنف <span class="req">*</span></label>' +
        '<div style="display:flex;gap:8px;">' +
          '<select id="item" class="input" required style="flex:1;"><option value="">اختر الصنف...</option></select>' +
          '<button type="button" class="btn btn-outline" onclick="openItemPopup()">+ إضافة صنف</button>' +
        '</div>' +
        '<div class="field-error" id="err-item"></div>' +
      '</div>' +
      UIC.field({ key: 'invoice_no', label: 'رقم الفاتورة', required: true, placeholder: 'مثال: INV-1002' }) +
      UIC.field({ key: 'invoice_date', label: 'تاريخ الفاتورة', type: 'date', value: todayStr(), required: true }) +
      UIC.field({ key: 'item_brand', label: 'البراند', required: true, placeholder: 'اسم البراند' }) +
      UIC.field({ key: 'qty', label: 'الكمية', type: 'number', step: '0.01', required: true, placeholder: 'مثال: 50' }) +
      UIC.field({ key: 'price', label: 'سعر الوحدة', type: 'number', step: '0.01', required: true, placeholder: 'مثال: 125.50' }) +
      UIC.field({ key: 'receipt_date', label: 'تاريخ الاستلام', type: 'date', value: todayStr(), required: true }) +
      '</form>';
    UIC.openModal('purchase-modal', {
      title: 'إضافة توريد',
      body: body,
      onSave: 'savePurchase()'
    });
    setSelectOptions('vendor', window.__vendorOptions || []);
    setSelectOptions('item', window.__itemOptions || []);
  }

  function savePurchase() {
    var data = UIC.collectForm('purchase-form');
    if (!UIC.validateForm('purchase-form')) return;
    /* Tier B: the vendor/item refs plus the invoice guards can refuse for
       reasons invisible in the form — another device may have taken the same
       invoice number first. So NO draft is painted: canPatch stays false,
       only the quiet corner hint shows, and the row is patched from the reply
       instead. A refusal toasts exactly as before and never paints a row. No
       validation is changed. queueable:false: I1 is unproven for
       add_purchase_item, so a transport failure rolls back loudly. */
    UIC.Live.save({
      call: companyCall,
      action: 'add_purchase_item',
      data: data,
      modal: 'purchase-modal',
      message: 'تم الحفظ',
      queueable: false,
      reload: function () { fetchPurchases(true); },
      onSuccess: function (r) {
        var rec = r.record || null;
        if (rec) {
          window.__purchases = window.__purchases || [];
          window.__purchases.unshift(rec);
          var lim = 10;
          if (window.__purchases.length > lim) window.__purchases = window.__purchases.slice(0, lim);
          renderPurchases();
        } else { fetchPurchases(true); }
      }
    }).catch(function () { /* UIC.Live has toasted */ });
  }

  function openVendorPopup() {
    var body =
      '<form id="vendor-form">' +
      UIC.field({ key: 'vendor_name_ar', label: 'اسم المورد (بالعربية)', required: true }) +
      UIC.field({ key: 'vendor_name_en', label: 'اسم المورد (بالإنجليزية)' }) +
      UIC.field({ key: 'vendor_address', label: 'العنوان' }) +
      UIC.field({ key: 'vendor_vat', label: 'الرقم الضريبي' }) +
      UIC.field({ key: 'vendor_1_percent_status', label: 'حالة خصم 1%' }) +
      UIC.field({ key: 'contact_person', label: 'الشخص المسؤول' }) +
      UIC.field({ key: 'contact_number', label: 'رقم الهاتف' }) +
      UIC.field({ key: 'contact_email', label: 'البريد الإلكتروني' }) +
      UIC.field({ key: 'vat_1_percent_certificate', label: 'شهادة خصم 1%' }) +
      '</form>';
    UIC.openModal('vendor-modal', {
      title: 'إضافة مورد جديد',
      body: body,
      onSave: 'saveVendorPopup()'
    });
  }

  function saveVendorPopup() {
    var data = UIC.collectForm('vendor-form');
    if (!UIC.validateForm('vendor-form')) return;
    /* Tier B: the vendor write touches its own table while the purchase form
       stays open — there is no row to paint, so canPatch stays false and only
       the quiet corner hint shows. onSuccess patches the in-memory vendor
       options from the reply and re-renders the select locally; reload is the
       error-path backstop. No overlay. queueable:false. */
    UIC.Live.save({
      call: companyCall,
      action: 'add_vendor',
      data: data,
      modal: 'vendor-modal',
      message: 'تمت إضافة المورد',
      queueable: false,
      reload: function () { fetchPurchases(true); },
      onSuccess: function (r) {
        var v = r.vendor || null;
        if (v) {
          window.__vendorOptions = (window.__vendorOptions || []).concat([v]);
          setSelectOptions('vendor', window.__vendorOptions, v.value);
        } else { fetchPurchases(true); }
      }
    }).catch(function () { /* UIC.Live has toasted */ });
  }

  function openItemPopup() {
    var body =
      '<form id="item-form">' +
      UIC.field({ key: 'item_name_ar', label: 'اسم الصنف (بالعربية)', required: true }) +
      UIC.field({ key: 'item_name_en', label: 'اسم الصنف (بالإنجليزية)' }) +
      UIC.field({ key: 'item_technical_details', label: 'المواصفات الفنية' }) +
      UIC.field({ key: 'category_id', label: 'رقم الفئة' }) +
      UIC.field({ key: 'unit_type', label: 'الوحدة' }) +
      '</form>';
    UIC.openModal('item-modal', {
      title: 'إضافة صنف جديد',
      body: body,
      onSave: 'saveItemPopup()'
    });
  }

  function saveItemPopup() {
    var data = UIC.collectForm('item-form');
    if (!UIC.validateForm('item-form')) return;
    /* Tier B: the item write touches its own table while the purchase form
       stays open — there is no row to paint, so canPatch stays false and only
       the quiet corner hint shows. onSuccess patches the in-memory item
       options from the reply and re-renders the select locally; reload is the
       error-path backstop. No overlay. queueable:false. */
    UIC.Live.save({
      call: companyCall,
      action: 'add_item',
      data: data,
      modal: 'item-modal',
      message: 'تمت إضافة الصنف',
      queueable: false,
      reload: function () { fetchPurchases(true); },
      onSuccess: function (r) {
        var it = r.item || null;
        if (it) {
          window.__itemOptions = (window.__itemOptions || []).concat([it]);
          setSelectOptions('item', window.__itemOptions, it.value);
        } else { fetchPurchases(true); }
      }
    }).catch(function () { /* UIC.Live has toasted */ });
  }

  function openDetail(idx) {
    var p = window.__purchases[idx];
    if (!p) return;
    var rows = [
      ['#', p.id],
      ['المورد', p.vendor_name || p.vendor || '-'],
      ['رقم الفاتورة', p.invoice_no || '-'],
      ['تاريخ الفاتورة', fmtDate(p.invoice_date)],
      ['الصنف', p.item_name || p.item || '-'],
      ['البراند', p.item_brand || '-'],
      ['الكمية', p.qty],
      ['سعر الوحدة', p.price],
      ['تاريخ الاستلام', fmtDate(p.receipt_date)],
      ['أضيف بواسطة', uname_(p.user) || '-'],
      ['وقت الإضافة', p.created_at ? fmtDate(p.created_at) : '-']
    ];
    var body = rows.map(function (r) {
      return '<div class="form-field"><label class="form-label">' + esc(r[0]) + '</label>' +
        '<div style="padding:8px 12px;background:var(--bg-subtle);border-radius:var(--radius-sm);font-size:13px;">' + esc(r[1]) + '</div></div>';
    }).join('');
    UIC.openModal('purchase-detail-modal', {
      title: 'تفاصيل التوريد',
      body: body,
      footer: false
    });
  }

  function showError(e) {
    var body = document.getElementById('purchasing-content');
    if (body) body.innerHTML = '<div class="empty-state"><span>' + esc(e.message || 'خطأ') + '</span></div>';
  }

  /* Another device's change arrives quietly. */
  UIC.Live.watchPage({
    call: companyCall,
    page: 'tc_purchasing',
    onChange: function () { UIC.Live.arrive(function () { fetchPurchases(true); }); }
  });
  /* [live-notice] the view on screen */
  UIC.Live.setView('list', { refresh: function () { fetchPurchases(true); } });


  load();
</script>
</body>
</html>
