<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مكتب الجمارك — توب كيميكال</title>
  <?!= include('CSS_Tokens'); ?>
  <?!= include('UI_Components'); ?>
  <?!= include('Client_Helpers'); ?>
  <?!= include('Company_TopChemical_Nav'); ?>
  <?!= getCompanyThemeCSS_('3fe1b5cb67b7223e') ?>
  <style>
    .co-wrap { padding: 16px 20px 32px; }

    /* Summary cards */
    .co-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }
    .co-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 20px 22px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: var(--shadow-sm);
    }
    .co-card .co-icon {
      width: 54px; height: 54px; border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; flex-shrink: 0;
    }
    .co-card.egp .co-icon { background: var(--brand-subtle-bg); }
    .co-card.usd .co-icon { background: #e0f2fe; }
    .co-card .co-value {
      font-size: 24px; font-weight: 800; color: var(--brand-primary);
      letter-spacing: -.5px; line-height: 1.1;
    }
    .co-card.usd .co-value { color: #0369a1; }
    .co-card .co-label { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-top: 4px; }

    /* Toolbar */
    .co-toolbar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .co-toolbar .co-search { flex: 1; min-width: 200px; }
    .co-toolbar .input { width: 100%; }

    .co-banner { margin-bottom: 14px; padding: 10px 14px; border-radius: 8px; font-size: 13px; line-height: 1.6; }
    .co-banner-warn { background: #fff4e5; border: 1px solid #ffb74d; color: #8a4b00; }
    .co-banner-warn code { background: #ffe0b2; padding: 1px 5px; border-radius: 4px; font-family: monospace; }

    .file-link { color: var(--brand-primary); font-weight: 600; text-decoration: none; }
    .file-link:hover { text-decoration: underline; }

    /* Pagination */
    .co-pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .co-pager .co-info { font-size: 12px; color: var(--text-muted); }
    .co-pager .co-pages { display: flex; gap: 6px; flex-wrap: wrap; }
  </style>
</head>
<body>
<div id="tc-root" dir="rtl"></div>
<script>
  var params = new URLSearchParams(window.location.search);
  var SESSION_TOKEN = params.get('sessionToken') || (API.getSession() || {}).token || '';
  var scriptUrl = window.scriptUrl || '/';
  var IS_SUPER_ADMIN = <?!= user && user.isSuperAdmin ? 'true' : 'false' ?>;
  var COMPANY_LOGO_URL = '<?!= getCompanyLogoUrl_('3fe1b5cb67b7223e') ?>';
  var COMPANY_PAGES = <?!= companyPages ?>;
  var CURRENT_ACTION = '<?!= currentAction ?>';
  var USER_PAGES = <?!= user && user.isSuperAdmin ? 'null' : JSON.stringify((user && user.authorizedPages) || {}) ?>;

  /* [live-notice D6] list replies from the device cache, trusted by the stamps */
  if (window.UIC && UIC.Live && UIC.Live.viewCache) companyCall = UIC.Live.viewCache(companyCall, { company: '3fe1b5cb67b7223e', page: 'tc_customs_office', view: 'list', lists: ['get_customs_office'] });
  function companyCall(moduleAction, data) {
    return API.call('company_action', {
      target_system: '3fe1b5cb67b7223e',
      module_action: moduleAction,
      data: data || {}
    }, SESSION_TOKEN);
  }

  function todayStr() {
    var d = new Date();
    var m = ('0' + (d.getMonth() + 1)).slice(-2);
    var day = ('0' + d.getDate()).slice(-2);
    return d.getFullYear() + '-' + m + '-' + day;
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function fmt2(n) {
    var v = Number(n) || 0;
    return v.toLocaleString('ar-EG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function fileLink(ref, field) {
    if (!ref) return '—';
    if (String(ref).indexOf('/') === -1) return esc(ref);
    var href = scriptUrl + '?download=attachment&page=tc_customs_office';
    if (ref) href += '&ref=' + encodeURIComponent(ref);
    if (field) href += '&field=' + encodeURIComponent(field);
    href += '&sessionToken=' + encodeURIComponent(SESSION_TOKEN);
    var name = String(ref).split('/').pop();
    return '<a class="file-link" href="' + href + '" target="_blank" rel="noopener">' + esc(name) + ' ↗</a>';
  }

  // ---- Upload helper (Option A instant: pre-bound on selection; legacy fallback) ----
  function uploadFileInput(inputEl, field, sheet) {
    try {
      if (window.UIC && UIC.UploadSet) {
        var b0 = inputEl ? UIC.UploadSet.getBound(inputEl) : null;
        if (b0 && b0.ref) return Promise.resolve({ reference: b0.ref, fileId: b0.id || '', field: field });
        if (inputEl && !(inputEl.files && inputEl.files[0])) return Promise.resolve(null);
      }
    } catch (e) {}
    if (!inputEl || !inputEl.files || !inputEl.files[0]) return Promise.resolve(null);
    var file = inputEl.files[0];
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error('خطأ في قراءة الملف')); };
      reader.onload = function () {
        var b64 = String(reader.result || '').split(',')[1] || '';
        companyCall('add_upload_file', { sheet: sheet, field: field, filename: file.name, base64: b64 })
          .then(function (res) {
            if (res && res.status === 'success') resolve({ reference: res.reference, fileId: res.fileId || '', field: field });
            else reject(new Error((res && res.message) || 'خطأ في رفع الملف'));
          })
          .catch(function (err) { reject(new Error((err && err.message) || 'خطأ في رفع الملف')); });
      };
      reader.readAsDataURL(file);
    });
  }

  var ALL_ROWS = [];
  /* The endpoint returns the newest 20 records by default. Once the user asks
     for every record, keep that scope through saves and realtime refreshes so
     the table never silently falls back to the short list. */
  var CO_LOADED_ALL = false;
  /* Last server-confirmed summary, so a Tier A save can advance the totals
     from the reply record without a refetch. */
  var CO_TOTALS = { egp: 0, usd: 0 };

  function load() {
    UIC.appShell('tc-root', {
      companyLogoUrl: COMPANY_LOGO_URL,
      companyLogoHref: scriptUrl + '?action=tc_dashboard&sessionToken=' + SESSION_TOKEN,
      companyLogoTitle: 'توب كيميكال',
      breadcrumb: 'توب كيميكال / مكتب الجمارك',
      contentId: 'tc-content',
      menuGroups: (window.TOPCHEMICAL_MENU || [])
    });
    renderShell();
    fetchData();
  }

  function renderShell() {
    var inner = document.getElementById('tc-content');
    if (!inner) return;
    inner.innerHTML =
      '<div class="co-wrap">' +
        '<div class="co-cards">' +
          '<div class="co-card egp">' +
            '<div class="co-icon">💷</div>' +
            '<div><div class="co-value" id="egp-total">0.00</div>' +
            '<div class="co-label">إجمالي المعاملات بالجنيه</div></div>' +
          '</div>' +
          '<div class="co-card usd">' +
            '<div class="co-icon">💵</div>' +
            '<div><div class="co-value" id="usd-total">0.00</div>' +
            '<div class="co-label">إجمالي المعاملات بالدولار</div></div>' +
          '</div>' +
        '</div>' +
        '<div class="co-toolbar">' +
          '<button class="btn btn-primary" onclick="openFormModal(\'egp\')">➕ إضافة معاملة (بالجنيه)</button>' +
          '<button class="btn btn-outline" onclick="openFormModal(\'usd\')">➕ إضافة معاملة (بالدولار)</button>' +
        '</div>' +
        '<div id="customs-table"></div>' +
      '</div>';
  }

  function fetchData(quiet) {
    if (!quiet) UIC.readSkeleton('customs-table', { message: 'جاري تحميل بيانات مكتب الجمارك...' });
    var payload = { scriptUrl: scriptUrl, sessionToken: SESSION_TOKEN };
    if (CO_LOADED_ALL) payload.loadAll = true;
    companyCall('get_customs_office', payload)
      .then(function (d) {
        var s = d.summary || { egp_total: 0, usd_total: 0 };
        CO_TOTALS.egp = Number(s.egp_total) || 0;
        CO_TOTALS.usd = Number(s.usd_total) || 0;
        document.getElementById('egp-total').textContent = fmt2(s.egp_total) + ' ج.م';
        document.getElementById('usd-total').textContent = '$ ' + fmt2(s.usd_total);
        ALL_ROWS = d.transactions || [];
        renderTable(); try{schedulePrefetch();}catch(e){};
      })
      .catch(function (e) {
        var t = document.getElementById('customs-table');
        if (t) t.innerHTML = '<div class="empty-state"><span>خطأ في تحميل البيانات: ' + esc((e && e.message) || String(e)) + '</span></div>';
      })
      .finally(function () { UI.hideSpinner(); });
  }

  function showAllCustoms() {
    CO_LOADED_ALL = true;
    fetchData(false);
  }

  function showLatestCustoms() {
    CO_LOADED_ALL = false;
    fetchData(false);
  }

  function renderTable() {
    var container = document.getElementById('customs-table');
    if (!container) return;
    var rows = ALL_ROWS.map(function (r) {
      /* Tier A: id is server-assigned (rowNumber-1), so a __pending row shows
         «—» — never an invented value. The table has no action buttons, so
         there is nothing to gate while __pending. */
      var pending = !!r.__pending;
      return {
        id: pending ? '—' : (r.id || ''),
        transaction_date: r.transaction_date || '',
        transaction_type: r.transaction_type || '',
        operation_reason: r.operation_reason || '',
        amount_egp: r.amount_egp || 0,
        amount_usd: r.amount_usd || 0,
        transaction_details: r.transaction_details || '',
        claim_assignment: fileLink(r.claim_assignment, 'تكليف المطالبة'),
        shipment_clearance: fileLink(r.shipment_clearance, 'تخليص الشحنة'),
        user_email: uname_(r.user_email) || '',
        created_at: r.created_at || ''
      };
    });
    container.innerHTML = UIC.showAllBar({ loadedAll: CO_LOADED_ALL, total: ALL_ROWS.length, showAll: 'showAllCustoms()', showLatest: 'showLatestCustoms()' }) + UIC.dataTable('customs-dt', {
      /* [RT-1] The list endpoint caps at the newest rows unless `loadAll` is
         passed, and the search box filters only what is in memory — so the
         table says which records the box actually searches. */
      truncated: !CO_LOADED_ALL,
      showAll: 'showAllCustoms()',
      title: 'معاملات الجمارك',
      headers: [
        { key: 'id', label: '#', numeric: true },
        { key: 'transaction_date', label: 'التاريخ' },
        { key: 'transaction_type', label: 'النوع' },
        { key: 'operation_reason', label: 'سبب العملية' },
        { key: 'amount_egp', label: 'المبلغ (جنيه)', money: true },
        { key: 'amount_usd', label: 'المبلغ (دولار)', money: true },
        { key: 'transaction_details', label: 'تفاصيل المعاملة' },
        { key: 'claim_assignment', label: 'تكليف المطالبة' },
        { key: 'shipment_clearance', label: 'تخليص الشحنة' },
        { key: 'user_email', label: 'المستخدم' },
        { key: 'created_at', label: 'تم الإنشاء' }
      ],
      rows: rows,
      searchable: true,
      pageSize: 50,
      dateFilter: true,
      dateKey: 'transaction_date',
      emptyText: 'لا توجد معاملات'
    });
    UIC.initTableSort('customs-dt');
  }

  // ---- Modals ----
  function buildFormHtml(mode) {
    var typeOpts = [{ value: 'مدين', label: 'مدين' }, { value: 'دائن', label: 'دائن' }];

    var egpField = (mode === 'usd')
      ? '<input type="hidden" id="amount_egp" value="0">'
      : UIC.field({ key: 'amount_egp', label: 'المبلغ (جنيه)', type: 'number', step: '0.01', min: '0', required: true });

    var usdField = (mode === 'egp')
      ? '<input type="hidden" id="amount_usd" value="0">'
      : UIC.field({ key: 'amount_usd', label: 'المبلغ (دولار)', type: 'number', step: '0.01', min: '0', required: true });

    return '<form id="customs-form" onsubmit="return false;">' +
      UIC.field({ key: 'transaction_date', label: 'التاريخ', type: 'date', required: true, value: todayStr() }) +
      UIC.combo({ key: 'transaction_type', label: 'نوع المعاملة', options: typeOpts, required: true }) +
      UIC.field({ key: 'operation_reason', label: 'سبب العملية', type: 'text', required: true }) +
      egpField +
      usdField +
      UIC.field({ key: 'transaction_details', label: 'تفاصيل المعاملة', type: 'textarea' }) +
      UIC.fileField({ key: 'claim_assignment_file', label: 'تكليف المطالبة (اختياري)', accept: '.pdf,.doc,.docx,.png,.jpg,.jpeg', instant: true, sheet: 'customs_office_transactions', field: 'claim_assignment', formModalId: 'customs-modal' }) +
      UIC.fileField({ key: 'shipment_clearance_file', label: 'تخليص الشحنة (اختياري)', accept: '.pdf,.doc,.docx,.png,.jpg,.jpeg', instant: true, sheet: 'customs_office_transactions', field: 'shipment_clearance', formModalId: 'customs-modal' }) +
      '</form>';
  }

  function openFormModal(mode) {
    var title = (mode === 'usd') ? 'إضافة معاملة بالدولار' : 'إضافة معاملة بالجنيه';
    UIC.openModal('customs-modal', {
      title: title,
      body: buildFormHtml(mode),
      onSave: 'submitCustoms(\'' + mode + '\')'
    });
    try { UIC.trackDirty('customs-form'); } catch (e) {}
  }

  function submitCustoms(mode) {
    if (!UIC.validateForm('customs-form')) {
      UIC.toast('يرجى تعبئة الحقول المطلوبة', 'warning');
      return;
    }
    var doSaveCustoms = function () {
      /* Option A instant-upload: 2 files pre-bound (per-row status inline). */
      var claimInput = document.getElementById('claim_assignment_file');
      var shipInput = document.getElementById('shipment_clearance_file');
      var data = UIC.collectForm('customs-form');
      data.mode = mode;
      try {
        var b0 = (claimInput && UIC.UploadSet) ? UIC.UploadSet.getBound(claimInput) : null;
        var b1 = (shipInput && UIC.UploadSet) ? UIC.UploadSet.getBound(shipInput) : null;
        data.claim_assignment = (b0 && b0.ref) ? b0.ref : '';
        data.shipment_clearance = (b1 && b1.ref) ? b1.ref : '';
        if (b0 && b0.id) data.claim_assignment_id = b0.id;
        if (b1 && b1.id) data.shipment_clearance_id = b1.id;
      } catch (e) {}
        /* Tier A: the row is on screen before the request returns. id is
           server-assigned, so the draft leaves it empty and recordOf fills it
           from the reply record, returning null on add when the reply
           carries no id. user_email/created_at are server-set and stay out
           of the draft. queueable:false: I1 is unproven for
           add_customs_office, so a transport failure rolls back loudly
           instead of queueing. */
        var draft = {
          id: '',
          transaction_date: data.transaction_date,
          transaction_type: data.transaction_type,
          operation_reason: data.operation_reason,
          amount_egp: data.amount_egp,
          amount_usd: data.amount_usd,
          transaction_details: data.transaction_details,
          claim_assignment: data.claim_assignment,
          shipment_clearance: data.shipment_clearance
        };
        ALL_ROWS = ALL_ROWS || [];
        UIC.Live.save({
          call: companyCall,
          action: 'add_customs_office',
          data: data,
          list: ALL_ROWS,
          key: 'id',
          draft: draft,
          render: renderTable,
          modal: 'customs-modal',
          message: 'تمت الإضافة بنجاح',
          queueable: false,
          reload: function () { fetchData(true); },
          recordOf: function (resp) {
            if (resp && resp.record && resp.record.id != null && resp.record.id !== '') return resp.record;
            return null;
          },
          /* Advance the server-confirmed totals from the reply record, and
             apply the ten-row cap here, NOT in the draft: trimming at draft
             time would drop the tenth row, and the rollback restores the
             draft's slot but cannot bring that row back. */
          onSuccess: function (resp) {
            var rec = resp && resp.record;
            if (rec) {
              CO_TOTALS.egp += Number(rec.amount_egp) || 0;
              CO_TOTALS.usd += Number(rec.amount_usd) || 0;
              var sEg = document.getElementById('egp-total');
              var sUs = document.getElementById('usd-total');
              if (sEg) sEg.textContent = fmt2(CO_TOTALS.egp) + ' ج.م';
              if (sUs) sUs.textContent = '$ ' + fmt2(CO_TOTALS.usd);
            }
            if (!CO_LOADED_ALL && ALL_ROWS.length > 10) ALL_ROWS = ALL_ROWS.slice(0, 10);
            renderTable();
          }
        }).catch(function () { /* UIC.Live has toasted and rolled back */ });
    };
    try {
      if (window.UIC && UIC.UploadSet && UIC.UploadSet.isBusy('customs-modal')) {
        UIC.toast('جاري رفع الملفات... يرجى الانتظار', 'warning');
        UIC.UploadSet.awaitPending('customs-modal').then(doSaveCustoms);
        return;
      }
    } catch (e2) {}
    doSaveCustoms();
  }


  /* Another device's change arrives quietly. */
  UIC.Live.watchPage({
    call: companyCall,
    page: 'tc_customs_office',
    onChange: function () { UIC.Live.arrive(function () { fetchData(true); }); }
  });
  /* [live-notice] the view on screen */
  if (UIC.Live.setView) UIC.Live.setView('list', { refresh: function () { fetchData(true); } });

  load();
</script>
</body>
</html>
