<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الغياب والخصومات</title>
  <?!= include('CSS_Tokens'); ?>
  <?!= include('UI_Components'); ?>
  <?!= include('Client_Helpers'); ?>
  <?!= include('Company_TopChemical_Nav'); ?>
  <?!= getCompanyThemeCSS_('3fe1b5cb67b7223e') ?>
</head>
<body>
<div id="tc-root" dir="rtl"></div>
<script>
  var params = new URLSearchParams(window.location.search);
  var SESSION_TOKEN = params.get('sessionToken') || (API.getSession() || {}).token || '';
  var scriptUrl = window.scriptUrl || '/';
  var IS_SUPER_ADMIN = <?!= user && user.isSuperAdmin ? 'true' : 'false' ?>;
  var COMPANY_LOGO_URL = '<?!= getCompanyLogoUrl_('3fe1b5cb67b7223e') ?>';
  var COMPANY_PAGES = <?!= companyPages ?>;
  var CURRENT_ACTION = '<?!= currentAction ?>';
  var USER_PAGES = <?!= user && user.isSuperAdmin ? 'null' : JSON.stringify((user && user.authorizedPages) || {}) ?>;
  var CAN_WRITE = UIC.canAdd_(); var CAN_FULL = UIC.canFull_();

  function companyCall(moduleAction, data) {
    return API.call('company_action', {
      target_system: '3fe1b5cb67b7223e',
      module_action: moduleAction,
      data: data || {}
    }, SESSION_TOKEN);
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function fmtDate(v) {
    if (v == null || v === '') return '';
    var d = (v instanceof Date) ? v : new Date(v);
    if (isNaN(d.getTime())) return String(v);
    var p = function (n) { return ('0' + n).slice(-2); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  function todayStr() {
    var d = new Date();
    var p = function (n) { return ('0' + n).slice(-2); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  function load() {
    var contentId = 'ded-content';
    UIC.appShell('tc-root', {
      companyLogoUrl: COMPANY_LOGO_URL,
      companyLogoHref: scriptUrl + '?action=tc_dashboard&sessionToken=' + SESSION_TOKEN,
      companyLogoTitle: 'توب كيميكال',
      breadcrumb: 'توب كيميكال / شئون العاملين / الغياب والخصومات',
      contentId: contentId,
      menuGroups: (window.TOPCHEMICAL_MENU || [])
    });
    fetchDeductions();
  }

  function fetchDeductions() {
    UI.showSpinner();
    companyCall('get_emp_deductions')
      .then(function (r) {
        window.__rows = r.rows || [];
        window.__empOptions = r.employee_options || [];
        window.__dedOptions = r.deduction_options || [];
        renderDeductions(); try{schedulePrefetch();}catch(e){};
      })
      .catch(function (e) { showError(e); })
      .finally(function () { UI.hideSpinner(); });
  }

  function renderDeductions() {
    var body = document.getElementById('ded-content');
    if (!body) return;
    var groups = {};
    (window.__rows || []).forEach(function (r) {
      var t = r.deduction_type || 'أخرى';
      groups[t] = groups[t] || { dates: {} };
      var d = fmtDate(r.date);
      groups[t].dates[d] = groups[t].dates[d] || [];
      groups[t].dates[d].push(r);
    });
    var typeOrder = ['سلف', 'غياب', 'جزاء'];
    var order = Object.keys(groups).sort(function (a, b) {
      var ia = typeOrder.indexOf(a), ib = typeOrder.indexOf(b);
      if (ia === -1 && ib === -1) return a.localeCompare(b, 'ar');
      if (ia === -1) return 1;
      if (ib === -1) return -1;
      return ia - ib;
    });
    var html = (CAN_WRITE
      ? '<div style="display:flex;justify-content:flex-end;margin-bottom:12px;"><button class="btn btn-primary" onclick="openAddModal()">+ تسجيل خصم</button></div>'
      : '');
    if (!order.length) {
      html += '<div class="empty-state"><span>لا توجد خصومات</span></div>';
    } else {
      order.forEach(function (t, gi) {
        var g = groups[t];
        var dates = Object.keys(g.dates).sort(function (a, b) { return b.localeCompare(a); });
        var count = dates.reduce(function (s, d) { return s + g.dates[d].length; }, 0);
        html += '<div style="margin-bottom:14px;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);overflow:hidden;">' +
          '<div class="ded-group-head" style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:#f2f4f7;cursor:pointer;user-select:none;" ' +
          'onclick="toggleDedGroup(\'ded-body-' + gi + '\')">' +
          '<span style="transition:transform .2s;font-size:11px;" id="ded-arrow-' + gi + '">▼</span>' +
          '<b style="flex:1;">' + esc(t) + '</b>' +
          '<span class="text-muted" style="font-size:12px;">' + count + ' سجل</span>' +
          (CAN_WRITE ? '<button class="btn btn-outline" style="padding:4px 10px;font-size:12px;" onclick="event.stopPropagation();openAddModal({type:\'' + esc(t) + '\'})">+ إضافة</button>' : '') +
          '</div>' +
          '<div id="ded-body-' + gi + '" class="ded-group-body">';
        dates.forEach(function (d) {
          html += '<div style="padding:8px 14px 4px;"><div style="display:flex;align-items:center;gap:10px;margin-bottom:4px;">' +
            '<b style="flex:1;font-size:13px;">' + esc(d) + '</b>' +
            '<span class="text-muted" style="font-size:12px;">' + g.dates[d].length + ' سجل</span>' +
            (CAN_WRITE ? '<button class="btn btn-outline" style="padding:3px 8px;font-size:11px;" onclick="openAddModal({type:\'' + esc(t) + '\',date:\'' + esc(d) + '\'})">+ في هذا التاريخ</button>' : '') +
            '</div>' +
            '<table class="table" style="font-size:13px;">' +
            '<thead><tr><th>كود</th><th>الاسم</th><th>الأيام</th><th>الجزاء</th><th>خصم آخر</th><th>تفاصيل</th></tr></thead><tbody>';
          g.dates[d].forEach(function (r) {
            html += '<tr><td>' + r.emp_id + '</td><td>' + esc(r.name_ar || '-') + '</td>' +
              '<td>' + (r.number_of_days != null ? r.number_of_days : '') + '</td>' +
              '<td>' + (r.penalty_value != null ? r.penalty_value : '') + '</td>' +
              '<td>' + (r.deduction_value_other != null ? r.deduction_value_other : '') + '</td>' +
              '<td>' + esc(r.details || '-') + '</td></tr>';
          });
          html += '</tbody></table></div>';
        });
        html += '</div></div>';
      });
    }
    body.innerHTML = html;
  }

  function toggleDedGroup(id) {
    var el = document.getElementById(id);
    if (!el) return;
    var arrow = document.getElementById(id.replace('ded-body-', 'ded-arrow-'));
    if (el.style.display === 'none') {
      el.style.display = 'block';
      if (arrow) arrow.textContent = '▼';
    } else {
      el.style.display = 'none';
      if (arrow) arrow.textContent = '▶';
    }
  }

  function openAddModal(prefill) {
    prefill = prefill || {};
    var body =
      '<form id="ded-form">' +
      UIC.field({ key: 'emp_id', label: 'الموظف', type: 'select', required: true,
        options: window.__empOptions || [], placeholder: 'اختر الموظف...' }) +
      UIC.field({ key: 'deduction_type', label: 'نوع الخصم', type: 'select', required: true,
        options: window.__dedOptions || [], placeholder: 'اختر النوع...', value: prefill.type || '' }) +
      UIC.field({ key: 'date', label: 'التاريخ', type: 'date', required: true, value: prefill.date || todayStr() }) +
      UIC.field({ key: 'number_of_days', label: 'عدد الأيام', type: 'number', min: '0', step: '0.5', value: '1' }) +
      UIC.field({ key: 'deduction_value_other', label: 'قيمة الخصم (سلف وغيرها)', type: 'number', min: '0', step: '0.01' }) +
      '<div class="form-field" data-field="details"><label class="form-label" for="details">تفاصيل <span class="req">*</span></label>' +
      '<textarea id="details" class="input" data-field-name="details" rows="2" placeholder="وصف الخصم..." required></textarea>' +
      '<div class="field-error" id="err-details"></div></div>' +
      '</form>';
    UIC.openModal('ded-modal', {
      title: 'تسجيل غياب / خصم',
      body: body,
      onSave: 'saveDeduction()'
    });
    var sel = document.getElementById('deduction_type');
    if (sel) sel.addEventListener('change', onDedTypeChange);
    onDedTypeChange();
  }

  function clearFieldError(id) {
    var e = document.getElementById(id);
    if (e) e.textContent = '';
  }

  function setFieldError(input, errId, message) {
    var e = document.getElementById(errId);
    if (e) e.textContent = message;
    var field = input.closest ? input.closest('.form-field') : null;
    if (field) field.classList.add('has-error');
  }

  function onDedTypeChange() {
    var sel = document.getElementById('deduction_type');
    var days = document.getElementById('number_of_days');
    var other = document.getElementById('deduction_value_other');
    if (!sel || !days || !other) return;
    var t = sel.value;
    if (t === 'غياب' || t === 'جزاء') {
      days.setAttribute('required', 'required');
      other.removeAttribute('required');
      clearFieldError('err-deduction_value_other');
    } else if (t === 'سلف') {
      days.removeAttribute('required');
      other.setAttribute('required', 'required');
      clearFieldError('err-number_of_days');
    } else {
      days.removeAttribute('required');
      other.removeAttribute('required');
      clearFieldError('err-number_of_days');
      clearFieldError('err-deduction_value_other');
    }
  }

  function saveDeduction() {
    if (!UIC.validateForm('ded-form')) return;
    var t = document.getElementById('deduction_type').value;
    var days = document.getElementById('number_of_days');
    var other = document.getElementById('deduction_value_other');
    if ((t === 'غياب' || t === 'جزاء') && Number(days.value) <= 0) {
      setFieldError(days, 'err-number_of_days', 'عدد الأيام مطلوب لهذا النوع');
      return;
    }
    if (t === 'سلف' && Number(other.value) <= 0) {
      setFieldError(other, 'err-deduction_value_other', 'قيمة الخصم مطلوبة لهذا النوع');
      return;
    }
    var data = UIC.collectForm('ded-form');
    UI.showSpinner('جاري الحفظ...');
    companyCall('add_emp_deduction', data)
      .then(function (r) {
        UIC.closeModal('ded-modal');
        UIC.toast((r && r.message) || 'تم الحفظ', 'success');
        if (r && r.record) {
          window.__rows = window.__rows || [];
          window.__rows.unshift(r.record);
          if (window.__rows.length>10) window.__rows=window.__rows.slice(0,10);
          renderDeductions();
        } else { fetchDeductions(); }
      })
      .catch(function (e) { UIC.toast((e && e.message) || 'خطأ', 'error'); })
      .finally(function () { UI.hideSpinner(); });
  }

  function showError(e) {
    var body = document.getElementById('ded-content');
    if (body) body.innerHTML = '<div class="empty-state"><span>' + esc(e.message || 'خطأ') + '</span></div>';
  }

  load();
</script>
</body>
</html>
