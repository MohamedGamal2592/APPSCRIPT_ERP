<script>

window.UIC = window.UIC || {};

UIC.SYSTEM_LOGO_URL = 'https://drive.google.com/thumbnail?id=1Ug1T9j5vQBeBA_5w52ufDO07IsefW6QH&sz=w200';

UIC.button = function (opts) {
  const o = opts || {};
  const type = o.type || 'primary';
  const cls = 'btn btn-' + type + (o.icon && !o.text ? ' btn-icon-only' : '');
  const icon = o.icon ? '<span class="btn-icon">' + o.icon + '</span>' : '';
  const attrs = o.onClick ? ' onclick="' + o.onClick + '"' : '';
  const disabled = o.disabled ? ' disabled' : '';
  return '<button class="' + cls + '"' + attrs + disabled + ' title="' + (o.tooltip || '') + '">' + icon + '<span>' + (o.text || '') + '</span></button>';
};

UIC.actionBtns = function (btns) {
  if (!btns || !btns.length) return '';
  return '<div style="display:flex;gap:4px;justify-content:center;flex-wrap:wrap;">' +
    btns.map(function (b) {
      var style = 'padding:4px 10px;font-size:12px;';
      if (b.color) style += 'color:' + b.color + ';border-color:' + b.color + ';';
      return '<button class="btn btn-outline" style="' + style + '" onclick="' + b.onclick + '">' + UIC.escHtml(b.label) + '</button>';
    }).join('') + '</div>';
};

UIC.statusPill = function (label, tone) {
  const t = tone || 'neutral';
  return '<span class="pill pill-' + t + '">' + (label || '') + '</span>';
};

UIC.pageAuthorized_ = function (action) {
  const up = window.USER_PAGES;
  if (!up) return true;
  return !!(up[action] && up[action].length);
};

/* Navigation helpers — never depend on fragile globals; fall back to the
 * current page URL so links (logo, nav, dropdowns) always work. */
UIC.baseUrl = function () {
  if (window.scriptUrl) return window.scriptUrl;
  try { if (window.top && window.top !== window) return window.top.location.origin + window.top.location.pathname; } catch (e) {}
  return window.location.origin + window.location.pathname;
};
UIC.token = function () {
  try { return window.SESSION_TOKEN || new URLSearchParams(window.location.search).get('sessionToken') || ''; }
  catch (e) { return ''; }
};

/* Navigate to an in-app URL. Prefers TOP-frame navigation so the address bar
 * reflects ?action=… (back/forward + deep-links work); falls back to iframe
 * navigation if the sandbox blocks top-navigation. `ev` = click event. */
UIC.navTo = function (ev, href) {
  try { if (ev && ev.preventDefault) ev.preventDefault(); } catch (e) {}
  if (!href) return;
  try { UIC.showPageLoading('جاري التحميل...'); } catch (e) {}
  try { if (window.top && window.top !== window) { window.top.location.href = href; return; } } catch (e) {}
  window.location.href = href;
};

/* ── Full-screen page-loading overlay (seamless navigation) ───────────────── */
UIC.ensurePageLoading = function () {
  if (document.getElementById('page-loading')) return;
  var st = document.createElement('style');
  st.textContent = '#page-loading{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,.6);direction:rtl;}' +
    '#page-loading.show{display:flex;}' +
    '#page-loading .pl-card{background:#fff;border-radius:12px;padding:18px 26px;box-shadow:0 8px 30px rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;gap:10px;}' +
    '#page-loading .pl-spin{width:34px;height:34px;border:4px solid #eee;border-top-color:#4a90d9;border-radius:50%;animation:plspin .8s linear infinite;}' +
    '@keyframes plspin{to{transform:rotate(360deg);}}' +
    '#page-loading .pl-msg{font-family:inherit;color:#444;font-size:14px;}';
  document.head.appendChild(st);
  var d = document.createElement('div');
  d.id = 'page-loading';
  d.innerHTML = '<div class="pl-card"><div class="pl-spin"></div><div class="pl-msg">جاري التحميل...</div></div>';
  document.body.appendChild(d);
};
UIC.showPageLoading = function (msg) {
  try {
    UIC.ensurePageLoading();
    var d = document.getElementById('page-loading');
    if (msg) { var m = d.querySelector('.pl-msg'); if (m) m.textContent = msg; }
    d.classList.add('show');
  } catch (e) {}
};
UIC.hidePageLoading = function () {
  try { var d = document.getElementById('page-loading'); if (d) d.classList.remove('show'); } catch (e) {}
};
UIC.withPageLoading = function (promise, msg) {
  UIC.showPageLoading(msg || 'جاري التحميل...');
  return Promise.resolve(promise).then(function (r) { UIC.hidePageLoading(); return r; }, function (e) { UIC.hidePageLoading(); throw e; });
};

/* ── Persistent home logo (far-right) → main dashboard, on every page ─────── */
UIC.ensureHomeLogo = function () {
  if (document.getElementById('home-logo-fab')) return;
  var a = document.createElement('a');
  a.id = 'home-logo-fab';
  a.href = UIC.baseUrl() + '?action=ERPDashboard&sessionToken=' + encodeURIComponent(UIC.token());
  a.title = 'الرئيسية';
  a.setAttribute('onclick', "UIC.navTo(event, this.getAttribute('href'))");
  a.innerHTML = '<img src="' + (UIC.SYSTEM_LOGO_URL || '') + '" alt="الرئيسية" loading="lazy" decoding="async">';
  document.body.appendChild(a);
  var st = document.createElement('style');
  st.textContent = '#home-logo-fab{position:fixed;top:10px;right:10px;z-index:9998;width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;cursor:pointer;}' +
    '#home-logo-fab img{width:32px;height:32px;object-fit:contain;}' +
    '@media(max-width:768px){#home-logo-fab{width:38px;height:38px;}#home-logo-fab img{width:26px;height:26px;}}';
  document.head.appendChild(st);
};

(function () {
  var boot = function () {
    try {
      UIC.ensureHomeLogo();
      UIC.showPageLoading('جاري التحميل...');
      var hide = function () { try { UIC.hidePageLoading(); } catch (e) {} };
      window.addEventListener('load', hide);
      setTimeout(hide, 6000);
    } catch (e) {}
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

/* Client-side error reporting → server-side ERP_Client_Log sheet. */
UIC.__errCount = 0;
UIC.reportError = function (detail, opt) {
  try {
    if (UIC.__errCount >= 12) return;
    UIC.__errCount = (UIC.__errCount || 0) + 1;
    var payload = {
      page: location.pathname,
      message: String(detail || '').slice(0, 2000),
      stack: (opt && opt.stack ? String(opt.stack).slice(0, 4000) : ''),
      url: location.href ? location.href.slice(0, 1500) : '',
      user: ((window.API && API.getSession && API.getSession() && API.getSession().user && API.getSession().user.email) || '')
    };
    try { google.script.run.withFailureHandler(function () {}).logClientError_(payload); } catch (e2) {}
  } catch (e) {}
};

UIC.AUTO_PAGE_SIZE = 150;

UIC.dataTable = function (containerId, opts) {
  const o = opts || {};
  const rawHeaders = o.headers || [];
  const rows = o.rows || [];
  const searchable = o.searchable !== false;
  const id = containerId || 'datatable';

  /* ── Backward compatibility: accept plain-string headers and/or array rows.
   *     Strings become positional columns ({key:'__col<i>', label:h});
   *     array rows are matched to columns by index. Object usage unchanged. ── */
  const hasStringHeaders = rawHeaders.some(h => typeof h === 'string');
  const headers = hasStringHeaders
    ? rawHeaders.map((h, i) => (typeof h === 'string' ? { key: '__col' + i, label: h } : h))
    : rawHeaders;

  if (rows.length === 0) {
    return '<div class="empty-state"><span>' + (o.emptyText || 'لا توجد بيانات') + '</span></div>';
  }

  const fmtMoney = function (n) {
    if (window.FMT && FMT.currency) return FMT.currency(n);
    const v = Number(n) || 0;
    const parts = v.toFixed(2).split('.');
    return parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + parts[1];
  };

  /* Auto-window large tables (opt out with autoPage:false; explicit pageSize wins). */
  const autoSize = (UIC.AUTO_PAGE_SIZE || 0);
  let pageSize = o.pageSize || 0;
  if (o.autoPage === false) pageSize = 0;
  else if (!pageSize && autoSize > 0 && rows.length > autoSize) pageSize = autoSize;

  const thead = '<thead><tr>' + headers.map(h => '<th data-key="' + (h.key || h.label) + '">' + h.label + '</th>').join('') + '</tr></thead>';

  window.__dtStore = window.__dtStore || {};
  window.__dtStore[id] = { headers: headers, rows: rows, filtered: rows, pageSize: pageSize, fmtMoney: fmtMoney, opts: o, searchTerm: '', dateFrom: '', dateTo: '' };

  /* ── Toolbar: search + date filter + Excel + Print ── */
  var toolbarParts = [];
  if (searchable) {
    toolbarParts.push('<input class="input" type="search" placeholder="بحث..." oninput="UIC.filterPaged(\'' + id + '\', this.value)">');
  }
  if (o.dateFilter) {
    toolbarParts.push('<label style="font-size:13px;">من:</label><input id="' + id + '-from" type="date" class="input" style="width:150px;">');
    toolbarParts.push('<label style="font-size:13px;">إلى:</label><input id="' + id + '-to" type="date" class="input" style="width:150px;">');
    toolbarParts.push('<button type="button" class="btn btn-outline" onclick="UIC.applyDateFilter(\'' + id + '\')">فلتر</button>');
  }
  if (o.exportXlsx !== false) {
    toolbarParts.push('<button type="button" class="btn btn-outline" onclick="UIC.exportExcel(\'' + id + '\')">📥 Excel</button>');
  }
  if (o.printable !== false) {
    toolbarParts.push('<button type="button" class="btn btn-outline" onclick="UIC.printTable(\'' + id + '\')">🖨️ طباعة</button>');
  }
  var toolbarHtml = toolbarParts.length
    ? '<div class="table-toolbar" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">' + toolbarParts.join('') + '</div>'
    : '';

  const viewRows = (pageSize > 0 ? rows.slice(0, pageSize) : rows);
  const tbodyHtml = viewRows.map((r, i) => UIC._dtRowHtml(r, headers, fmtMoney, i)).join('');

  let moreBtn = '';
  if (pageSize > 0) {
    const remaining = rows.length - pageSize;
    moreBtn = '<div class="table-more" id="' + id + '_more"' + (remaining > 0 ? '' : ' style="display:none;"') + '>' +
      '<button type="button" class="btn-secondary" onclick="UIC.dataTableMore(\'' + id + '\')">عرض المزيد (' + remaining + ')</button></div>';
  }

  const clickAttr = o.rowClick ? ' onclick="UIC._dtRowClick(event, \'' + id + '\')"' : '';
  return '<div id="' + id + '" class="table-wrap"' + clickAttr + '>' + toolbarHtml +
    '<table class="table" data-sortable="true"><caption class="sr-only">' + (o.title || '') + '</caption>' + thead +
    '<tbody id="' + id + '_tbody">' + tbodyHtml + '</tbody></table>' + moreBtn + '</div>';
};

UIC._dtRowHtml = function (r, headers, fmtMoney, idx) {
  return '<tr' + (idx != null ? ' data-idx="' + idx + '"' : '') + '>' + headers.map((h, i) => {
    const raw = Array.isArray(r) ? r[i] : r[h.key || h.label];
    const v = (raw !== undefined && raw !== null) ? raw : '';
    if (h.money) {
      const num = Number(v) || 0;
      return '<td class="num" data-num="' + num + '">' + fmtMoney(num) + '</td>';
    }
    const sortAttr = h.sortKey ? ' data-sort="' + esc(String(r[h.sortKey] != null ? r[h.sortKey] : '')) + '"' : '';
    return '<td' + (h.numeric ? ' class="num"' : '') + sortAttr + '>' + v + '</td>';
  }).join('') + '</tr>';
};

UIC._dtRowClick = function (event, id) {
  try {
    const tr = event.target.closest('tr');
    if (!tr) return;
    const st = (window.__dtStore || {})[id];
    if (!st || !st.opts || !st.opts.rowClick) return;
    const ia = tr.getAttribute('data-idx');
    const list = st.filtered || st.rows;
    const rec = (ia != null) ? list[Number(ia)] : null;
    if (rec != null) st.opts.rowClick(rec, tr);
  } catch (e) {}
};

UIC._dtRenderBody = function (id) {
  const st = (window.__dtStore || {})[id];
  const tbody = document.getElementById(id + '_tbody');
  if (!st || !tbody) return;
  const list = st.filtered || st.rows;
  const view = (st.pageSize > 0 ? list.slice(0, st.pageSize) : list)
    .map((r, i) => UIC._dtRowHtml(r, st.headers, st.fmtMoney, i)).join('');
  tbody.innerHTML = view;
  if (st.opts && st.opts.onRendered) { try { st.opts.onRendered(id); } catch (e) {} }
};

UIC.dataTableMore = function (id) {
  const st = (window.__dtStore || {})[id];
  if (!st) return;
  const step = st.opts.pageSize || (UIC.AUTO_PAGE_SIZE || 100);
  st.pageSize = (st.pageSize || 0) + step;
  UIC._dtRenderBody(id);
  const list = st.filtered || st.rows;
  const more = document.getElementById(id + '_more');
  if (more) {
    const remaining = list.length - (st.pageSize || 0);
    if (remaining <= 0) more.style.display = 'none';
    else {
      more.style.display = '';
      const btn = more.querySelector('button');
      if (btn) btn.textContent = 'عرض المزيد (' + remaining + ')';
    }
  }
};

UIC.filterPaged = function (id, term) {
  var st = (window.__dtStore || {})[id];
  if (!st) return;
  st.searchTerm = (term || '').trim().toLowerCase();
  UIC._applyFilters(id);
};

UIC._applyFilters = function (id) {
  var st = (window.__dtStore || {})[id];
  if (!st) return;
  var q = st.searchTerm || '';
  var dateFrom = st.dateFrom || '';
  var dateTo = st.dateTo || '';
  var dateKey = (st.opts && st.opts.dateKey) || 'date';
  st.filtered = st.rows.filter(function (r) {
    if (q) {
      try { if (JSON.stringify(r == null ? '' : r).toLowerCase().indexOf(q) === -1) return false; } catch (e) { return false; }
    }
    if (dateFrom || dateTo) {
      var rv = r[dateKey];
      if (!rv) return false;
      var ds = String(rv).slice(0, 10);
      if (dateFrom && ds < dateFrom) return false;
      if (dateTo && ds > dateTo) return false;
    }
    return true;
  });
  var auto = (UIC.AUTO_PAGE_SIZE || 0);
  st.pageSize = st.opts.pageSize || ((auto > 0 && st.rows.length > auto) ? auto : 0);
  UIC._dtRenderBody(id);
  var list = st.filtered || st.rows;
  var more = document.getElementById(id + '_more');
  if (more) {
    var remaining = list.length - (st.pageSize || 0);
    if (st.pageSize > 0 && remaining > 0) {
      more.style.display = '';
      var btn = more.querySelector('button');
      if (btn) btn.textContent = 'عرض المزيد (' + remaining + ')';
    } else { more.style.display = 'none'; }
  }
};

UIC.applyDateFilter = function (id) {
  var st = (window.__dtStore || {})[id];
  if (!st) return;
  var fromEl = document.getElementById(id + '-from');
  var toEl = document.getElementById(id + '-to');
  st.dateFrom = fromEl ? fromEl.value : '';
  st.dateTo = toEl ? toEl.value : '';
  UIC._applyFilters(id);
};

UIC.exportExcel = function (id) {
  var st = (window.__dtStore || {})[id];
  if (!st) return;
  var rows = st.filtered || st.rows;
  if (!rows || !rows.length) { UIC.toast('لا توجد بيانات للتصدير', 'error'); return; }
  if (typeof XLSX === 'undefined') { UIC.toast('جاري تحميل مكتبة Excel...', 'info'); return; }
  var headers = st.headers.filter(function (h) { return h.key !== 'actions'; });
  var data = rows.map(function (r) {
    var obj = {};
    headers.forEach(function (h) { obj[h.label] = r[h.key] != null ? r[h.key] : ''; });
    return obj;
  });
  var ws = XLSX.utils.json_to_sheet(data);
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
  var from = st.dateFrom || '';
  var to = st.dateTo || '';
  var title = (st.opts && st.opts.title) || 'report';
  var filename = title + (from ? '_' + from : '') + (to ? '_to_' + to : '') + '.xlsx';
  XLSX.writeFile(wb, filename);
};

UIC.printTable = function (id) {
  var st = (window.__dtStore || {})[id];
  if (!st) return;
  var rows = st.filtered || st.rows;
  if (!rows || !rows.length) { UIC.toast('لا توجد بيانات للطباعة', 'error'); return; }
  var headers = st.headers.filter(function (h) { return h.key !== 'actions'; });
  var from = st.dateFrom || '';
  var to = st.dateTo || '';
  var title = (st.opts && st.opts.title) || '';
  var dateLabel = (from && to) ? 'من ' + from + ' إلى ' + to : from ? 'من ' + from : to ? 'إلى ' + to : 'الكل';
  var logoUrl = window.COMPANY_LOGO_URL || '';
  var w = window.open('', '_blank');
  if (!w) { UIC.toast('تم حظر النافذة المنبثقة', 'error'); return; }
  var rowsHtml = rows.map(function (r) {
    return '<tr>' + headers.map(function (h) {
      var v = r[h.key] != null ? r[h.key] : '';
      return '<td>' + esc(String(v)) + '</td>';
    }).join('') + '</tr>';
  }).join('');
  var theadHtml = '<tr>' + headers.map(function (h) {
    return '<th>' + esc(h.label) + '</th>';
  }).join('') + '</tr>';
  w.document.open();
  w.document.write(
    '<!DOCTYPE html><html lang="ar"><head><meta charset="utf-8"><title>' + esc(title) + '</title>' +
    '<style>body{font-family:Cairo,sans-serif;direction:rtl;padding:20px;}' +
    'h2{text-align:center;margin-bottom:4px;} .date-info{text-align:center;color:#666;margin-bottom:16px;}' +
    '.logo{text-align:center;margin-bottom:8px;} .logo img{max-height:60px;}' +
    'table{width:100%;border-collapse:collapse;font-size:12px;} th,td{border:1px solid #ccc;padding:6px 8px;text-align:right;}' +
    'th{background:#f0f0f0;font-weight:700;} @media print{body{padding:0;}}</style></head><body>' +
    (logoUrl ? '<div class="logo"><img src="' + esc(logoUrl) + '"></div>' : '') +
    '<h2>' + esc(title) + '</h2>' +
    '<div class="date-info">التاريخ: ' + esc(dateLabel) + ' — العدد: ' + rows.length + '</div>' +
    '<table><thead>' + theadHtml + '</thead><tbody>' + rowsHtml + '</tbody></table>' +
    '</body></html>'
  );
  w.document.close();
  w.print();
};

UIC.filterTable = function (containerId, term) {
  UIC._ftTimers = UIC._ftTimers || {};
  const timers = UIC._ftTimers;
  if (timers[containerId]) clearTimeout(timers[containerId]);
  timers[containerId] = setTimeout(function () { UIC.filterPaged(containerId, term); }, 120);
};

/* ── Client-side reference-enum cache (avoid repeated server round-trips) ─── */
UIC.cacheOptions = function (key, arr, ttlMs) {
  try {
    localStorage.setItem('erp_opt_' + key, JSON.stringify({ t: Date.now(), ttl: ttlMs || 600000, v: arr }));
  } catch (e) {}
};
UIC.getCachedOptions = function (key) {
  try {
    const raw = localStorage.getItem('erp_opt_' + key);
    if (!raw) return null;
    const p = JSON.parse(raw);
    if (!p || !p.v) return null;
    if (p.ttl && (Date.now() - p.t) > p.ttl) return null;
    return p.v;
  } catch (e) { return null; }
};

/* ── Server-paged table: loads one window at a time, "load more" appends ─────
 * opts: { container, headers, pageSize, searchable, mapRow, fetcher, onFirst }
 *   mapRow(rawRecord) -> array of cell-HTML strings (UIC.dataTable row format)
 *   fetcher(offset, limit) -> Promise<{ rows: rawRecords[], total: number }>
 *   onFirst(firstResponse) -> capture globals (parties/enums) on first load   */
UIC.PagedTable = function (opts) {
  try {
    var container = typeof opts.container === 'string' ? document.getElementById(opts.container) : opts.container;
    if (!container) return;
    var hostId = 'pt_' + Math.random().toString(36).slice(2);
    var PAGE = opts.pageSize || 100;
    var offset = 0, total = 0, loading = false, done = false;
    var allRows = [];
    container.innerHTML =
      '<div id="' + hostId + '"></div>' +
      '<div class="pt-foot" style="display:flex;gap:12px;align-items:center;margin-top:10px;">' +
        '<button type="button" class="btn-secondary" id="' + hostId + '_more" style="display:none;">عرض المزيد</button>' +
        '<span class="pt-count" id="' + hostId + '_count" style="color:#666;font-size:13px;"></span>' +
      '</div>';
    var host = container.querySelector('#' + hostId);
    var moreBtn = container.querySelector('#' + hostId + '_more');
    var countEl = container.querySelector('#' + hostId + '_count');

    function render() {
      host.innerHTML = UIC.dataTable(hostId, {
        headers: opts.headers,
        rows: allRows,
        searchable: opts.searchable !== false,
        emptyText: opts.emptyText || 'لا توجد بيانات',
        autoPage: false
      });
    }
    function setCount() {
      if (!countEl) return;
      countEl.textContent = 'إجمالي ' + total + (offset > 0 && offset < total ? ' — معروض ' + offset : '');
    }
    function loadMore() {
      if (loading || done) return;
      loading = true; moreBtn.disabled = true; moreBtn.textContent = 'جاري التحميل...';
      Promise.resolve(opts.fetcher(offset, PAGE)).then(function (raw) {
        raw = raw || {};
        var recs = (opts.getRows ? opts.getRows(raw)
          : (raw.rows || raw.invoices || raw.returns || raw.orders || raw.sessions || raw.headers || [])) || [];
        if (offset === 0 && opts.onFirst) { try { opts.onFirst(raw); } catch (e) {} }
        recs.forEach(function (rec) { try { allRows.push(opts.mapRow(rec)); } catch (e) {} });
        offset += recs.length;
        total = (opts.getTotal ? opts.getTotal(raw) : (raw.total != null ? raw.total : offset));
        done = offset >= total;
        render();
        if (opts.onRendered) { try { opts.onRendered(hostId); } catch (e) {} }
        moreBtn.style.display = done ? 'none' : '';
        setCount();
      }).catch(function (e) {
        UIC.toast('خطأ: ' + (e && e.message ? e.message : e), 'error');
      }).finally(function () {
        loading = false; moreBtn.disabled = false; moreBtn.textContent = 'عرض المزيد';
      });
    }
    moreBtn.addEventListener('click', loadMore);
    setCount();
    loadMore();
  } catch (e) {
    UIC.toast('خطأ في الجدول: ' + (e && e.message ? e.message : e), 'error');
  }
};

UIC.initTableSort = function (containerId) {
  const container = document.getElementById(containerId);
  if (!container) return;
  container.querySelectorAll('th').forEach(th => {
    th.style.cursor = 'pointer';
    th.addEventListener('click', function () {
      const key = this.getAttribute('data-key');
      const tbody = container.querySelector('tbody');
      const rows = Array.from(tbody.querySelectorAll('tr'));
      const asc = this.getAttribute('data-asc') !== 'true';
      rows.sort((a, b) => {
        const cell = this.parentNode.children, idx = Array.prototype.indexOf.call(cell, this) + 1;
        const ac = a.querySelector('td:nth-child(' + idx + ')');
        const bc = b.querySelector('td:nth-child(' + idx + ')');
        const av = (ac && ac.getAttribute('data-sort') != null) ? ac.getAttribute('data-sort') : (ac && ac.getAttribute('data-num') != null) ? ac.getAttribute('data-num') : (ac ? ac.textContent.trim() : '');
        const bv = (bc && bc.getAttribute('data-sort') != null) ? bc.getAttribute('data-sort') : (bc && bc.getAttribute('data-num') != null) ? bc.getAttribute('data-num') : (bc ? bc.textContent.trim() : '');
        const numA = parseFloat(av), numB = parseFloat(bv);
        if (!isNaN(numA) && !isNaN(numB)) return asc ? numA - numB : numB - numA;
        return asc ? String(av).localeCompare(String(bv), 'ar') : String(bv).localeCompare(String(av), 'ar');
      });
      rows.forEach(r => tbody.appendChild(r));
      this.setAttribute('data-asc', String(asc));
    });
  });
};

UIC.field = function (o) {
  const t = o.type || 'text';
  const required = o.required ? ' required' : '';
  const value = o.value !== undefined && o.value !== null ? ' value="' + o.value + '"' : '';
  const placeholder = o.placeholder ? ' placeholder="' + o.placeholder + '"' : '';
  const listAttr = o.list ? ' list="' + o.list + '"' : '';
  const minAttr = o.min !== undefined ? ' min="' + o.min + '"' : '';
  const stepAttr = o.step !== undefined ? ' step="' + o.step + '"' : '';

  /* ── Mobile: smart inputmode + enterkeyhint attributes ── */
  let inputmode = '';
  let enterkeyhint = '';
  let autocomplete = o.autocomplete ? ' autocomplete="' + o.autocomplete + '"' : '';
  let autocapitalize = '';
  if (t === 'tel')   { inputmode = ' inputmode="tel"'; enterkeyhint = ' enterkeyhint="done"'; }
  if (t === 'email') { inputmode = ' inputmode="email"'; enterkeyhint = ' enterkeyhint="done"'; autocapitalize = ' autocapitalize="off"'; if (!autocomplete) autocomplete = ' autocomplete="email"'; }
  if (t === 'number' || t === 'text' && o.numeric) { inputmode = ' inputmode="decimal"'; enterkeyhint = ' enterkeyhint="done"'; }
  if (t === 'search') { inputmode = ' inputmode="search"'; enterkeyhint = ' enterkeyhint="search"'; }
  if (t === 'password') { if (!autocomplete) autocomplete = ' autocomplete="current-password"'; }
  /* Prevent Android keyboard from autocorrecting code/ID fields */
  if (o.noCorrect) { autocapitalize = ' autocapitalize="off" autocorrect="off" autocomplete="off"'; }

  let control;
  if (t === 'select') {
    if (o.combo === false) {
      const emptyOpt = o.placeholder ? '<option value="">' + o.placeholder + '</option>' : '';
      const options = (o.options || []).map(opt => {
        const v = typeof opt === 'object' ? opt.value : opt;
        const l = typeof opt === 'object' ? opt.label : opt;
        const sel = String(v) === String(o.value) ? ' selected' : '';
        return '<option value="' + v + '"' + sel + '>' + l + '</option>';
      }).join('');
      control = '<select id="' + o.key + '" class="input"' + required + '>' + emptyOpt + options + '</select>';
    } else {
      return UIC.combo(o);
    }
  } else if (t === 'textarea') {
    control = '<textarea id="' + o.key + '" class="input" rows="' + (o.rows || 3) + '"' + required + inputmode + '>' + (o.value || '') + '</textarea>';
  } else {
    control = '<input id="' + o.key + '" class="input" type="' + t + '"' + value + placeholder + required + listAttr + minAttr + stepAttr + inputmode + enterkeyhint + autocomplete + autocapitalize + '>';
  }

  const errId = 'err-' + o.key;
  return '<div class="form-field" data-field="' + o.key + '">' +
    '<label class="form-label" for="' + o.key + '">' + (o.label || '') + (required ? ' <span class="req">*</span>' : '') + '</label>' +
    control +
    '<div class="field-error" id="' + errId + '"></div>' +
    '</div>';
};

UIC.datalist = function (id, values) {
  const esc = function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  };
  return '<datalist id="' + id + '">' +
    (values || []).map(function (v) { return '<option value="' + esc(v) + '"></option>'; }).join('') +
    '</datalist>';
};

UIC.combo = function (o) {
  const key = o.key;
  const esc = function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  };
  const opts = (o.options || []).map(function (opt) {
    const v = typeof opt === 'object' ? opt.value : opt;
    const l = typeof opt === 'object' ? opt.label : opt;
    return { value: String(v).trim(), label: String(l).trim() };
  });
  const byVal = {};
  const byLabel = {};
  opts.forEach(function (op) { byVal[op.value] = op; byLabel[op.label] = op; byVal[op.value.toLowerCase()] = op; byLabel[op.label.toLowerCase()] = op; });
  const req = o.required ? ' required' : '';
  const ph = o.placeholder ? ' placeholder="' + esc(o.placeholder) + '"' : '';
  const cur = o.value !== undefined && o.value !== null ? String(o.value).trim() : '';
  const curLabel = (byVal[cur] && byVal[cur].label) || (byLabel[cur] && byLabel[cur].label) || (byVal[cur.toLowerCase()] && byVal[cur.toLowerCase()].label) || (byLabel[cur.toLowerCase()] && byLabel[cur.toLowerCase()].label) || cur;
  const optHtml = opts.map(function (op, i) {
    return '<div class="combo-option" data-value="' + esc(op.value) + '" data-i="' + i + '" onmousedown="event.preventDefault();UIC.comboPick(\'' + key + '\',' + i + ')">' + esc(op.label) + '</div>';
  }).join('');
  const allowNew = o.allowNew ? ' data-allownew="1"' : '';
  window.__comboData = window.__comboData || {};
  window.__comboData[key] = { opts: opts, allowNew: !!o.allowNew };
  const inner = '<div class="combo" data-combo="' + key + '">' +
    '<input id="' + key + '_display" class="input combo-input" autocomplete="off"' + ph + req + ' value="' + esc(curLabel) + '"' +
    ' onfocus="UIC.comboOpen(\'' + key + '\')" oninput="UIC.comboFilter(\'' + key + '\', this.value)" onblur="UIC.comboBlur(\'' + key + '\')" onkeydown="UIC.comboKey(\'' + key + '\', event)">' +
    '<input type="hidden" id="' + key + '" value="' + esc(cur) + '"' + allowNew + '>' +
    '<div class="combo-list" id="' + key + '_list" hidden>' + optHtml + '</div>' +
    '</div>';
  if (o.inline) return inner;
  return '<div class="form-field" data-field="' + key + '">' +
    '<label class="form-label" for="' + key + '_display">' + (o.label || '') + (o.required ? ' <span class="req">*</span>' : '') + '</label>' +
    inner +
    (o.allowNew ? '<input id="' + key + '_custom" class="input" style="margin-top:8px;display:none;" placeholder="أدخل القيمة الجديدة">' : '') +
    '<div class="field-error" id="err-' + key + '"></div>' +
    '</div>';
};

/* Searchable select alias (same component, clearer name for reference enums). */
UIC.SearchableSelect = UIC.combo;

UIC.comboOpen = function (key) {
  const list = document.getElementById(key + '_list');
  if (!list) return;
  list.hidden = false;
  UIC.comboFilter(key, document.getElementById(key + '_display').value);
};

UIC.escHtml = function (s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
};
UIC.comboHighlight = function (label, q) {
  var s = UIC.escHtml(label);
  try {
    var qEsc = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    var re = new RegExp('(' + qEsc + ')', 'ig');
    s = s.replace(re, '<mark>$1</mark>');
  } catch (e) {}
  return s;
};
UIC.comboFilter = function (key, text) {
  const list = document.getElementById(key + '_list');
  if (!list) return;
  const data = (window.__comboData || {})[key];
  const q = String(text || '').trim().toLowerCase();
  const opts = (data && data.opts) || [];
  let visible = 0;
  opts.forEach(function (op, i) {
    const el = list.querySelector('[data-i="' + i + '"]');
    if (!el) return;
    const match = !q || op.label.toLowerCase().indexOf(q) !== -1 || op.value.toLowerCase().indexOf(q) !== -1;
    el.style.display = match ? '' : 'none';
    if (match) {
      visible++;
      el.innerHTML = q ? UIC.comboHighlight(op.label, q) : UIC.escHtml(op.label);
    }
  });
  list.style.display = visible ? '' : 'none';
};

UIC.comboPick = function (key, i) {
  const data = (window.__comboData || {})[key];
  if (!data || !data.opts[i]) return;
  const op = data.opts[i];
  const disp = document.getElementById(key + '_display');
  const hidden = document.getElementById(key);
  if (disp) disp.value = op.label;
  if (hidden) {
    const changed = String(hidden.value) !== op.value;
    hidden.value = op.value;
    if (changed) hidden.dispatchEvent(new Event('change'));
  }
  const cust = document.getElementById(key + '_custom');
  if (cust) { cust.style.display = 'none'; cust.removeAttribute('required'); cust.value = ''; }
  const list = document.getElementById(key + '_list');
  if (list) list.hidden = true;
};

UIC.comboBlur = function (key) {
  const disp = document.getElementById(key + '_display');
  const hidden = document.getElementById(key);
  const data = (window.__comboData || {})[key];
  if (!disp || !hidden || !data) return;
  const text = String(disp.value || '').trim();
  const textLower = text.toLowerCase();
  let match = null;
  data.opts.forEach(function (op) { if (String(op.label).trim().toLowerCase() === textLower || String(op.value).trim().toLowerCase() === textLower) match = op; });
  if (match) {
    hidden.value = match.value;
    const cust = document.getElementById(key + '_custom');
    if (cust) { cust.style.display = 'none'; cust.removeAttribute('required'); cust.value = ''; }
  } else if (text) {
    if (data.allowNew) {
      const cust = document.getElementById(key + '_custom');
      hidden.value = '__new__';
      if (cust) { cust.style.display = ''; cust.value = text; cust.setAttribute('required', 'required'); }
    } else {
      disp.value = '';
      hidden.value = '';
    }
  } else {
    hidden.value = '';
  }
  const list = document.getElementById(key + '_list');
  if (list) list.hidden = true;
};

UIC.comboKey = function (key, ev) {
  const list = document.getElementById(key + '_list');
  if (!list) return;
  const visibleEls = [].slice.call(list.querySelectorAll('.combo-option')).filter(function (el) { return el.style.display !== 'none'; });
  if (!visibleEls.length) return;
  let idx = visibleEls.indexOf(list.querySelector('.combo-option.active'));
  if (ev.key === 'ArrowDown') {
    ev.preventDefault();
    idx = (idx + 1) % visibleEls.length;
  } else if (ev.key === 'ArrowUp') {
    ev.preventDefault();
    idx = (idx - 1 + visibleEls.length) % visibleEls.length;
  } else if (ev.key === 'Enter') {
    ev.preventDefault();
    const el = idx >= 0 ? visibleEls[idx] : visibleEls[0];
    UIC.comboPick(key, Number(el.getAttribute('data-i')));
    return;
  } else if (ev.key === 'Escape') {
    list.hidden = true;
    return;
  } else {
    return;
  }
  visibleEls.forEach(function (el) { el.classList.remove('active'); });
  visibleEls[idx].classList.add('active');
  visibleEls[idx].scrollIntoView({ block: 'nearest' });
};

document.addEventListener('click', function (ev) {
  document.querySelectorAll('.combo-list').forEach(function (list) {
    if (list.hidden) return;
    const host = list.closest('.combo');
    if (!host) return;
    if (!ev.target.closest('.combo') || ev.target.closest('.combo') !== host) list.hidden = true;
  });
});

UIC._readForm = function (formId) {
  const form = document.getElementById(formId);
  if (!form) return { data: {}, valid: true };
  const data = {};
  let valid = true;
  form.querySelectorAll('.form-field').forEach(function (field) {
    const err = field.querySelector('.field-error');
    let fieldError = false;
    field.querySelectorAll('input, select, textarea').forEach(function (input) {
      if (input.type === 'file') return;
      data[input.id] = input.value.trim();
      if (input.hasAttribute('required') && input.value.trim() === '') fieldError = true;
    });
    if (fieldError) {
      if (err) err.textContent = 'هذا الحقل مطلوب';
      field.classList.add('has-error');
      valid = false;
    } else {
      if (err) err.textContent = '';
      field.classList.remove('has-error');
    }
  });
  return { data: data, valid: valid };
};

UIC.validateForm = function (formId) {
  return UIC._readForm(formId).valid;
};

UIC.collectForm = function (formId) {
  return UIC._readForm(formId).data;
};

UIC.collectAndValidateForm = function (formId) {
  const r = UIC._readForm(formId);
  return { data: r.data, valid: r.valid };
};

UIC.toast = function (message, type) {
  const t = type || 'success';
  const toast = document.createElement('div');
  toast.className = 'toast toast-' + t;
  toast.setAttribute('role', 'status');
  toast.setAttribute('aria-live', 'polite');
  toast.textContent = message;
  document.body.appendChild(toast);

  /* ── Swipe-to-dismiss (horizontal swipe) ── */
  let startX = 0;
  toast.addEventListener('touchstart', function (e) {
    startX = e.touches[0].clientX;
  }, { passive: true });
  toast.addEventListener('touchend', function (e) {
    const dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > 80) {
      toast.style.transition = 'transform 0.2s, opacity 0.2s';
      toast.style.transform  = 'translateX(' + (dx > 0 ? '120%' : '-120%') + ')';
      toast.style.opacity    = '0';
      setTimeout(function () { toast.remove(); }, 200);
    }
  }, { passive: true });

  setTimeout(function () {
    toast.classList.add('toast-out');
    setTimeout(function () { toast.remove(); }, 300);
  }, 3000);
};

UIC.appShell = function (containerId, o) {

  const navLinkHtml = function (extraClass) {

      '<a class="nav-item' + (n.active ? ' active' : '') + (extraClass ? ' ' + extraClass : '') + '" href="' + (n.href || '#') + '"' +

    '<span class="hamburger-bar"></span><span class="hamburger-bar"></span><span class="hamburger-bar"></span>' +
    '</button>';

  /* Mobile slide-out drawer is built inside the try below (it executes nav

  try {
    const drawerHtml =
      '<div class="drawer-overlay" id="uic-drawer-overlay" onclick="UIC.closeDrawer()" aria-hidden="true"></div>' +
      '<nav class="mobile-drawer" id="uic-drawer" aria-label="القائمة الرئيسية">' +
        '<div class="drawer-header">' + logoDrawer +
          '<button class="drawer-close" aria-label="إغلاق القائمة" onclick="UIC.closeDrawer()">&#x2715;</button>' +
        '</div>' +
        '<div class="drawer-nav">' +
          navLinkHtml('drawer-nav-item') +
          menuGroupsHtml(true) +
        '</div>' +
        '<div class="drawer-footer">' + (opts.userHtml || userBlock) + '</div>' +
      '</nav>';
    html =
      '<header class="topbar">' +
        '<div class="topbar-left">' + hamburger + logoTop + '</div>' +
        '<nav class="topbar-nav" aria-label="التنقل الرئيسي">' + navLinkHtml() + menuGroupsHtml(false) + '</nav>' +
        '<div class="topbar-right">' + (opts.userHtml || userBlock) + '</div>' +
      '</header>' +
      drawerHtml +
      (opts.breadcrumb ? '<div class="breadcrumb">' + opts.breadcrumb + '</div>' : '') +
      '<main class="app-content" id="' + (opts.contentId || 'app-content') + '"></main>';
  } catch (shellErr) {
    /* Never blank the page: emit at least the content container so the page's
     * own render can populate it. Surface the error for diagnosis. */
    html = '<main class="app-content" id="' + (opts.contentId || 'app-content') + '"></main>';
    try { console.error('appShell build failed: ' + (shellErr && shellErr.message)); if (window.UIC && UIC.reportError) UIC.reportError('appShell build failed: ' + (shellErr && shellErr.message)); } catch (e) {}
  }

  const el = document.getElementById(containerId);
  if (el) el.innerHTML = html;

  /* Initialise drawer swipe-to-close after render */
  try { UIC._initDrawerSwipe(); } catch (e) {}

  return opts.contentId || 'app-content';
};

UIC.toggleDropdown = function (id, event) {
  if (event) { event.preventDefault(); event.stopPropagation(); }
  const target = document.getElementById(id);
  if (!target) return;
  const isOpen = target.classList.contains('open');
  document.querySelectorAll('.nav-dropdown-menu').forEach(function (m) { m.classList.remove('open'); });
  document.querySelectorAll('.nav-dropdown-toggle').forEach(function (b) { b.classList.remove('open'); });
  if (!isOpen) {
    target.classList.add('open');
    const btn = target.parentNode ? target.parentNode.querySelector('.nav-dropdown-toggle') : null;
    if (btn) btn.classList.add('open');
  }
};

document.addEventListener('click', function (event) {
  const dd = event.target && event.target.closest ? event.target.closest('.nav-dropdown') : null;
  if (!dd) {
    document.querySelectorAll('.nav-dropdown-menu').forEach(function (m) { m.classList.remove('open'); });
    document.querySelectorAll('.nav-dropdown-toggle').forEach(function (b) { b.classList.remove('open'); });
  }
});

UIC.openDrawer = function () {
  const drawer  = document.getElementById('uic-drawer');
  const overlay = document.getElementById('uic-drawer-overlay');
  const ham     = document.querySelector('.topbar-hamburger');
  if (!drawer) return;
  drawer.classList.add('is-open');
  if (overlay) overlay.classList.add('is-open');
  if (ham) ham.setAttribute('aria-expanded', 'true');
  document.body.style.overflow = 'hidden'; // prevent body scroll behind drawer
};

UIC.closeDrawer = function () {
  const drawer  = document.getElementById('uic-drawer');
  const overlay = document.getElementById('uic-drawer-overlay');
  const ham     = document.querySelector('.topbar-hamburger');
  if (!drawer) return;
  drawer.classList.remove('is-open');
  if (overlay) overlay.classList.remove('is-open');
  if (ham) ham.setAttribute('aria-expanded', 'false');
  document.body.style.overflow = '';
};

UIC._initDrawerSwipe = function () {
  const drawer = document.getElementById('uic-drawer');
  if (!drawer) return;
  let startX = 0;
  let dragging = false;
  drawer.addEventListener('touchstart', function (e) {
    startX = e.touches[0].clientX;
    dragging = true;
  }, { passive: true });
  drawer.addEventListener('touchmove', function (e) {
    if (!dragging) return;
    const dx = e.touches[0].clientX - startX;
    /* Only track swipe in the closing direction (right for RTL drawer = left for LTR) */
    if (dx < -10) {
      drawer.style.transform = 'translateX(' + dx + 'px)';
      drawer.style.transition = 'none';
    }
  }, { passive: true });
  drawer.addEventListener('touchend', function (e) {
    if (!dragging) return;
    dragging = false;
    drawer.style.transform = '';
    drawer.style.transition = '';
    const dx = e.changedTouches[0].clientX - startX;
    if (dx < -60) UIC.closeDrawer();
  }, { passive: true });
};

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') UIC.closeDrawer();
});

    min-height: var(--tap-min, 48px);
    border-radius: 0;
    font-size: 15px; font-weight: 600;
    border-bottom: 1px solid var(--border-color);
  }
  .drawer-nav .nav-item:last-child { border-bottom: none; }
  .drawer-group-label {
    padding: 10px var(--space-4) 4px;
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-muted);
  }
  .drawer-group .nav-dropdown-item {
    padding: 12px var(--space-6);
    white-space: normal;
    min-height: var(--tap-min, 48px);
  }
  .drawer-footer {
    padding: var(--space-4); border-top: 1px solid var(--border-color);
    flex-shrink: 0;
  }

  /* ── Responsive breakpoints ──────────────────────────────────────────── */
  /* Mobile (≤ 767px): show hamburger, hide desktop nav */
  @media (max-width: 767px) {
    .topbar-hamburger { display: flex; }
    .topbar-nav       { display: none; }
    .topbar-right .user-block { display: none; } /* user is in drawer */
    .topbar { padding: 0 var(--space-3); }
    .app-content { padding: var(--space-3); }
    .breadcrumb  { padding: var(--space-2) var(--space-3); }
    .modal-footer { flex-direction: column-reverse; }
    .modal-footer .btn { width: 100%; justify-content: center; }
    .stat-card { padding: var(--space-3); }
  }
  /* Tablet and up (≥ 768px): show desktop nav, hide hamburger & drawer toggle */
  @media (min-width: 768px) {
    .topbar-hamburger { display: none !important; }
    .topbar-right .user-block { display: flex !important; }
    .topbar { padding: 0 var(--space-6); height: 60px; }
    .app-content { padding: var(--space-6); }
  }
  /* Landscape compact mode: reduce header, hide bottom padding */
  @media (orientation: landscape) and (max-height: 500px) {
    .topbar { height: 44px; }
    .app-logo img { height: 24px; }
    .app-content { padding-top: var(--space-2); }
  }

  /* ── Keyboard-open layout adjustments ───────────────────────────────── */
  .keyboard-open .modal {
    /* When keyboard is open, shrink modal so it stays above keyboard */
    max-height: calc(100dvh - var(--keyboard-height, 0px) - 32px);
    max-height: calc(var(--vh, 1vh) * 100 - var(--keyboard-height, 0px) - 32px);
  }

  /* ── Screen reader only ──────────────────────────────────────────────── */
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  `;
  const style = document.createElement('style');
  style.textContent = css;
  document.head.appendChild(style);
})();

/* ── Side audit-history panel (السجل) ─────────────────────────────────────── */
/* Opens beside the current table: by default shows the LAST record's most
   recent change; when a record is selected (row click or السجل button) it
   shows that record's full history. Detailed log lives in ERP_Record_History. */
UIC.HistorySide = (function () {
  var panel = null, body = null, titleEl = null;

  function ensure() {
    if (panel) return;
    var css = '#history-side{position:fixed;top:0;right:0;height:100%;width:340px;max-width:90vw;background:#fff;' +
      'box-shadow:-4px 0 20px rgba(0,0,0,.15);z-index:9999;transform:translateX(100%);transition:transform .25s ease;' +
      'display:flex;flex-direction:column;direction:rtl;font-family:inherit;}' +
      '#history-side.open{transform:translateX(0);}' +
      '#history-side .hs-head{padding:12px 14px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;}' +
      '#history-side .hs-head h3{margin:0;font-size:15px;}' +
      '#history-side .hs-close{border:none;background:none;font-size:22px;cursor:pointer;line-height:1;}' +
      '#history-side .hs-body{padding:10px 14px;overflow:auto;flex:1;font-size:13px;}' +
      '#history-side .hs-card{border:1px solid #eee;border-radius:8px;padding:8px 10px;margin-bottom:8px;background:#fafafa;}' +
      '#history-side .hs-meta{color:#777;font-size:11px;margin-bottom:4px;}' +
      '#history-side .hs-change{font-size:12px;}' +
      '#history-side .hs-change b{color:#333;}' +
      '#history-side .hs-empty,#history-side .hs-load{color:#999;padding:20px 0;text-align:center;}';
    var st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
    panel = document.createElement('div'); panel.id = 'history-side';
    panel.innerHTML = '<div class="hs-head"><h3 id="hs-title">السجل</h3>' +
      '<button class="hs-close" onclick="UIC.HistorySide.close()">×</button></div>' +
      '<div class="hs-body" id="hs-body"></div>';
    document.body.appendChild(panel);
    body = panel.querySelector('#hs-body');
    titleEl = panel.querySelector('#hs-title');
    document.addEventListener('click', onDocClick);
  }

  function onDocClick(e) {
    var el = e.target.closest('[data-history-id]');
    if (el) { open(el.getAttribute('data-sheet') || window.SHEET, el.getAttribute('data-history-id')); return; }
    var row = e.target.closest('tr[data-id]');
    if (row && window.SHEET && !e.target.closest('button,a,input,select,textarea,[data-no-history]')) {
      open(window.SHEET, row.getAttribute('data-id'));
    }
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function render(rows) {
    if (!rows || !rows.length) { body.innerHTML = '<div class="hs-empty">لا يوجد سجل</div>'; return; }
    var html = '';
    rows.forEach(function (r) {
      var changed = (r.old_value || '') + '  →  ' + (r.new_value || '');
      html += '<div class="hs-card">' +
        '<div class="hs-meta">#' + esc(r.record_id || r.record_uid) + ' · ' + esc(r.action) +
        ' · ' + esc(r.changed_by) + ' · ' + esc(r.changed_at) + '</div>' +
        '<div class="hs-change"><b>' + esc(r.column_name) + ':</b> ' + esc(changed) + '</div>' +
        '</div>';
    });
    body.innerHTML = html;
  }

  function fetchAndRender(sheet, recordId, title) {
    ensure();
    if (!sheet) return;
    panel.classList.add('open');
    titleEl.textContent = title + ' · ' + sheet;
    body.innerHTML = '<div class="hs-load">جاري التحميل...</div>';
    API.call('get_record_history', { sheet_name: sheet, record_id: recordId || '' }, SESSION.token())
      .then(function (r) {
        var rows = (r && r.history) || [];
        if (recordId) { render(rows); return; }
        render(rows.length ? [rows[0]] : []);
      })
      .catch(function (e) { body.innerHTML = '<div class="hs-empty">تعذر التحميل: ' + esc(e.message || e) + '</div>'; });
  }

  function open(sheet, recordId) { fetchAndRender(sheet, recordId, 'السجل'); }
  function showLatest(sheet) { fetchAndRender(sheet, '', 'آخر سجل'); }
  function close() { if (panel) panel.classList.remove('open'); }

  return { open: open, showLatest: showLatest, close: close, ensure: ensure };
})();

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', function () {
    if (window.SHEET && window.ERP_HISTORY_AUTO !== false) UIC.HistorySide.showLatest(window.SHEET);
  });
} else if (window.SHEET && window.ERP_HISTORY_AUTO !== false) {
  UIC.HistorySide.showLatest(window.SHEET);
}
</script>
