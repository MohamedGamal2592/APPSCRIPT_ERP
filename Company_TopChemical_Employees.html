<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الموظفين</title>
  <?!= include('CSS_Tokens'); ?>
  <?!= include('UI_Components'); ?>
  <?!= include('Client_Helpers'); ?>
  <?!= include('Company_TopChemical_Nav'); ?>
  <?!= getCompanyThemeCSS_('3fe1b5cb67b7223e') ?>
  <style>
    .emp-filters { display:grid; grid-template-columns:repeat(4,minmax(150px,1fr)); gap:10px; margin:0 0 12px; padding:12px; border:1px solid var(--border-color); border-radius:var(--radius-md); background:var(--bg-surface); }
    .emp-filter { display:flex; flex-direction:column; gap:6px; min-width:0; }
    .emp-filter-label { font-size:12px; font-weight:700; color:var(--text-muted); }
    .emp-filter-footer { grid-column:1/-1; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
    .emp-filter-count { font-size:13px; color:var(--text-muted); }
    @media(max-width:850px) { .emp-filters { grid-template-columns:repeat(2,minmax(140px,1fr)); } }
    @media(max-width:520px) { .emp-filters { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<div id="tc-root" dir="rtl"></div>
<script>
  var params = new URLSearchParams(window.location.search);
  var SESSION_TOKEN = params.get('sessionToken') || (API.getSession() || {}).token || '';
  var scriptUrl = window.scriptUrl || '/';
  var IS_SUPER_ADMIN = <?!= user && user.isSuperAdmin ? 'true' : 'false' ?>;
  var COMPANY_LOGO_URL = '<?!= getCompanyLogoUrl_('3fe1b5cb67b7223e') ?>';
  var COMPANY_PAGES = <?!= companyPages ?>;
  var CURRENT_ACTION = '<?!= currentAction ?>';
  var USER_PAGES = <?!= user && user.isSuperAdmin ? 'null' : JSON.stringify((user && user.authorizedPages) || {}) ?>;
  var CAN_WRITE = UIC.canAdd_(); var CAN_FULL = UIC.canFull_();
  var EMP_FILTERS = { title: '', section: '', category: '', status: '' };

  /* [live-notice D6] list replies from the device cache, trusted by the stamps */
  companyCall = UIC.Live.viewCache(companyCall, { company: '3fe1b5cb67b7223e', page: 'tc_employee_reg', view: 'list', lists: ['get_employees'] });
  function companyCall(moduleAction, data) {
    return API.call('company_action', {
      target_system: '3fe1b5cb67b7223e',
      module_action: moduleAction,
      data: data || {}
    }, SESSION_TOKEN);
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function fmtDate(v) {
    if (v == null || v === '') return '';
    var d = (v instanceof Date) ? v : new Date(v);
    if (isNaN(d.getTime())) return String(v);
    var p = function (n) { return ('0' + n).slice(-2); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  function load() {
    var contentId = 'employee-content';
    UIC.appShell('tc-root', {
      companyLogoUrl: COMPANY_LOGO_URL,
      companyLogoHref: scriptUrl + '?action=tc_dashboard&sessionToken=' + SESSION_TOKEN,
      companyLogoTitle: 'توب كيميكال',
      breadcrumb: 'توب كيميكال / شئون العاملين / تسجيل الموظفين',
      contentId: contentId,
      menuGroups: (window.TOPCHEMICAL_MENU || [])
    });
    fetchEmployees();
  }

  function fetchEmployees(quiet) {
    if (!quiet) UI.showSpinner();
    companyCall('get_employees')
      .then(function (r) {
        console.log('[tc_employee_reg] _debug_title', JSON.stringify(r._debug_title));
        console.log('[tc_employee_reg] title_options count', (r.title_options || []).length);
        window.__employees = r.employees || [];
        window.__titleOptions = r.title_options || [];
        window.__categoryOptions = r.category_options || [];
        renderEmployees();
        try { schedulePrefetch(); } catch (e) {}
      })
      .catch(function (e) { showError(e); })
      .finally(function () { if (!quiet) UI.hideSpinner(); });
  }

  function renderEmployees() {
    var list = window.__employees || [];
    var filtered = list.filter(function (e) {
      return (!EMP_FILTERS.title || String(e.title || '').trim() === EMP_FILTERS.title) &&
        (!EMP_FILTERS.section || String(e.section || '').trim() === EMP_FILTERS.section) &&
        (!EMP_FILTERS.category || String(e.category || '').trim() === EMP_FILTERS.category) &&
        (!EMP_FILTERS.status || String(e.status || '').trim() === EMP_FILTERS.status);
    });
    function distinct(key) {
      var seen = {};
      list.forEach(function (e) {
        var value = String((e && e[key]) == null ? '' : e[key]).trim();
        if (value && value !== '-' && value !== '—') seen[value] = true;
      });
      return Object.keys(seen).sort(function (a, b) { return a.localeCompare(b, 'ar'); });
    }
    function filterSelect(key, label, values) {
      return '<label class="emp-filter" for="emp-filter-' + key + '">' +
        '<span class="emp-filter-label">' + esc(label) + '</span>' +
        '<select class="input" id="emp-filter-' + key + '" data-emp-filter="' + key + '">' +
          '<option value="">الكل</option>' + values.map(function (value) {
            return '<option value="' + esc(value) + '"' + (EMP_FILTERS[key] === value ? ' selected' : '') + '>' + esc(value) + '</option>';
          }).join('') +
        '</select></label>';
    }
    var filtersHtml = '<div class="emp-filters" aria-label="فلاتر الموظفين">' +
      filterSelect('title', 'المسمى الوظيفي', distinct('title')) +
      filterSelect('section', 'القسم', distinct('section')) +
      filterSelect('category', 'التصنيف', distinct('category')) +
      filterSelect('status', 'الحالة الوظيفية', distinct('status')) +
      '<div class="emp-filter-footer"><span class="emp-filter-count">النتائج: ' + filtered.length + ' من ' + list.length + '</span>' +
        '<button type="button" class="btn btn-outline" id="emp-clear-filters">مسح الفلاتر</button></div>' +
      '</div>';
    var rows = filtered.map(function (e) {
      /* Tier A: emp_id is server-assigned and section / salaries / status are
         sheet formulas, so a __pending row shows «—» in all of them — never
         an invented value. */
      var pending = !!e.__pending;
      var row = {
        emp_id: pending ? '—' : e.emp_id,
        name_ar: esc(e.name_ar || '-'),
        main_salary: pending ? '—' : e.main_salary,
        allow: pending ? '—' : e.allow,
        national_id: esc(e.national_id == null ? '-' : e.national_id),
        hiring_date: fmtDate(e.hiring_date),
        title: esc(e.title || '-'),
        section: pending ? '—' : esc(e.section || '-'),
        category: esc(e.category || '-'),
        insurance: e.insurance ? 'نعم' : 'لا',
        status: pending ? '—' : esc(e.status || '-'),
        basic_salary: pending ? '—' : e.basic_salary,
        emp_id_1: pending ? '—' : (e.emp_id_1 == null || e.emp_id_1 === '' ? e.emp_id : e.emp_id_1)
      };
      if (CAN_FULL) {
        row.actions = pending ? '…' : UIC.actionBtns([
          { label: 'تعديل بيانات الموظف', onclick: 'openEditEmployee(' + Number(e.emp_id) + ')' }
        ]);
      }
      return row;
    });
    var headers = [
      { key: 'emp_id', label: '#', numeric: true },
      { key: 'name_ar', label: 'الاسم' },
      { key: 'main_salary', label: 'الراتب', numeric: true },
      { key: 'allow', label: 'البدلات', numeric: true },
      { key: 'national_id', label: 'الرقم القومي', col: 'atom' },
      { key: 'hiring_date', label: 'تاريخ التعيين', col: 'atom' },
      { key: 'title', label: 'المسمى الوظيفي' },
      { key: 'section', label: 'القسم' },
      { key: 'category', label: 'التصنيف' },
      { key: 'insurance', label: 'التأمين' },
      { key: 'status', label: 'الحالة الوظيفية' },
      { key: 'basic_salary', label: 'الأساسي', numeric: true },
      { key: 'emp_id_1', label: 'مرجع الموظف (emp_id_1)', numeric: true }
    ];
    if (CAN_FULL) headers.push({ key: 'actions', label: 'إجراءات', sortable: false, col: 'actions' });
    var body = document.getElementById('employee-content');
    body.innerHTML = (CAN_WRITE
      ? '<div style="display:flex;justify-content:flex-end;margin-bottom:12px;"><button class="btn btn-primary" onclick="openAddModal()">+ تسجيل موظف</button></div>'
      : '') + filtersHtml +
      UIC.dataTable('employee-table', {
        title: 'الموظفون',
        headers: headers,
        rows: rows,
        emptyText: 'لا يوجد موظفون'
      });
    Array.prototype.forEach.call(body.querySelectorAll('[data-emp-filter]'), function (select) {
      select.addEventListener('change', function () {
        EMP_FILTERS[select.getAttribute('data-emp-filter')] = select.value;
        renderEmployees();
      });
    });
    var clearFilters = document.getElementById('emp-clear-filters');
    if (clearFilters) clearFilters.addEventListener('click', function () {
      EMP_FILTERS = { title: '', section: '', category: '', status: '' };
      renderEmployees();
    });
    UIC.initTableSort('employee-table');
  }

  function employeeById(empId) {
    return (window.__employees || []).find(function (e) {
      return String(e.emp_id) === String(empId);
    }) || null;
  }

  function openEditEmployee(empId) {
    if (!CAN_FULL) {
      UIC.toast('غير مصرح بتعديل بيانات الموظفين', 'error');
      return;
    }
    var employee = employeeById(empId);
    if (!employee) {
      UIC.toast('الموظف غير موجود — تم تحديث القائمة', 'error');
      fetchEmployees(true);
      return;
    }
    var body =
      '<form id="employee-edit-form">' +
      '<div style="margin-bottom:12px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--bg-subtle);color:var(--text-muted);font-size:12px;">' +
      'الراتب والبدلات والأساسي والقسم والحالة الوظيفية حقول يديرها النظام من صفحاتها ومصادرها المخصصة.</div>' +
      '<div class="form-field"><label class="form-label">كود الموظف</label>' +
      '<div class="input" style="background:var(--bg-subtle);">' + esc(employee.emp_id) + '</div></div>' +
      UIC.field({ key: 'edit_name_ar', label: 'اسم الموظف', type: 'text', required: true, value: esc(employee.name_ar || '') }) +
      UIC.field({ key: 'edit_national_id', label: 'الرقم القومي', type: 'number', min: '20000000000000', required: true, value: esc(employee.national_id || '') }) +
      UIC.field({ key: 'edit_hiring_date', label: 'تاريخ التعيين', type: 'date', required: true, value: fmtDate(employee.hiring_date) }) +
      UIC.combo({ key: 'edit_title', label: 'المسمى الوظيفي', required: true,
        options: window.__titleOptions || [], value: employee.title || '', placeholder: 'اختر أو ابحث عن المسمى الوظيفي...' }) +
      '<div class="form-field" data-field="edit_section"><label class="form-label">القسم (يُحسب تلقائياً)</label>' +
      '<div style="padding:8px 12px;background:var(--bg-subtle);border-radius:var(--radius-sm);font-size:13px;" id="edit-section-preview">' + esc(employee.section || '—') + '</div></div>' +
      UIC.field({ key: 'edit_category', label: 'التصنيف', type: 'select', required: true,
        value: employee.category || '', placeholder: 'اختر التصنيف...', options: (window.__categoryOptions || []).map(function (c) {
          return { value: c.value, label: c.label };
        }) }) +
      '<div class="form-field" data-field="edit_insurance"><label class="form-label">التأمين</label>' +
      '<label class="input" style="display:flex;align-items:center;gap:8px;"><input type="checkbox" id="edit_insurance" style="width:auto;"' + (employee.insurance ? ' checked' : '') + '> <span>مؤمن عليه</span></label></div>' +
      '</form>';
    UIC.openModal('employee-edit-modal', {
      title: 'تعديل بيانات الموظف — ' + esc(employee.name_ar || ('#' + employee.emp_id)),
      body: body,
      onSave: 'saveEditEmployee(' + Number(employee.emp_id) + ')'
    });
    var titleSelect = document.getElementById('edit_title');
    if (titleSelect) {
      titleSelect.addEventListener('change', function () {
        var title = (window.__titleOptions || []).find(function (x) {
          return String(x.value) === String(titleSelect.value);
        });
        var preview = document.getElementById('edit-section-preview');
        if (preview) preview.textContent = title && title.section ? title.section : '—';
      });
    }
  }

  function saveEditEmployee(empId) {
    if (!CAN_FULL) {
      UIC.toast('غير مصرح بتعديل بيانات الموظفين', 'error');
      return;
    }
    if (!UIC.validateForm('employee-edit-form')) return;
    var employee = employeeById(empId);
    if (!employee) {
      UIC.toast('الموظف غير موجود — أعد تحميل الصفحة', 'error');
      return;
    }
    var form = UIC.collectForm('employee-edit-form');
    var payload = {
      emp_id: empId,
      name_ar: form.edit_name_ar,
      national_id: form.edit_national_id,
      hiring_date: form.edit_hiring_date,
      title: form.edit_title,
      category: form.edit_category,
      insurance: !!document.getElementById('edit_insurance').checked
    };
    return UIC.Live.save({
      call: companyCall,
      action: 'edit_employee',
      data: payload,
      modal: 'employee-edit-modal',
      message: 'تم تعديل بيانات الموظف',
      queueable: false,
      reload: function () { fetchEmployees(true); },
      onSuccess: function (resp) {
        if (resp && resp.record) Object.assign(employee, resp.record);
        renderEmployees();
      }
    }).catch(function () { /* UIC.Live has shown the server error. */ });
  }

  function openAddModal() {
    var body =
      '<form id="employee-form">' +
      UIC.field({ key: 'name_ar', label: 'اسم الموظف', type: 'text', required: true, placeholder: 'الاسم بالكامل' }) +
      UIC.field({ key: 'national_id', label: 'الرقم القومي', type: 'number', min: '20000000000000', required: true, placeholder: '14 رقم' }) +
      UIC.field({ key: 'hiring_date', label: 'تاريخ التعيين', type: 'date', required: true }) +
      UIC.combo({ key: 'title', label: 'المسمى الوظيفي', required: true, options: window.__titleOptions, placeholder: 'اختر أو ابحث عن المسمى الوظيفي...' }) +
      '<div class="form-field" data-field="section"><label class="form-label">القسم (يُحسب تلقائياً)</label>' +
      '<div style="padding:8px 12px;background:var(--bg-subtle);border-radius:var(--radius-sm);font-size:13px;" id="section-preview">—</div></div>' +
      UIC.field({ key: 'category', label: 'التصنيف', type: 'select', required: true, placeholder: 'اختر التصنيف...', options: (window.__categoryOptions || []).map(function (c) { return { value: c.value, label: c.label }; }) }) +
      '<div class="form-field" data-field="insurance"><label class="form-label">التأمين</label>' +
      '<label class="input" style="display:flex;align-items:center;gap:8px;"><input type="checkbox" id="insurance" style="width:auto;"> <span>مؤمن عليه</span></label></div>' +
      '</form>';
    UIC.openModal('employee-modal', {
      title: 'تسجيل موظف جديد',
      body: body,
      onSave: 'saveEmployee()'
    });
    var sel = document.getElementById('title');
    if (sel) {
      sel.addEventListener('change', function () {
        var t = window.__titleOptions.find(function (x) { return String(x.value) === sel.value; });
        document.getElementById('section-preview').textContent = (t && t.section) ? t.section : '—';
      });
    }
  }

  function saveEmployee() {
    var formEl = document.getElementById('employee-form');
    if (!UIC.validateForm('employee-form')) return;
    var data = UIC.collectForm('employee-form');
    data.insurance = !!document.getElementById('insurance').checked;
    /* Tier A: the row is on screen before the request returns. emp_id is
       server-assigned and section / salaries / status are sheet formulas, so
       the draft never invents them — recordOf fills them from the reply, and
       returns null on add when the reply carries no emp_id. queueable:false:
       I1 is unproven for add_employee, so a transport failure rolls back
       loudly instead of queueing. */
    var draft = {
      emp_id: '',
      name_ar: data.name_ar,
      national_id: data.national_id,
      hiring_date: data.hiring_date,
      title: data.title,
      section: '',
      category: data.category,
      insurance: data.insurance,
      main_salary: 0,
      allow: 0,
      basic_salary: 0,
      status: ''
    };
    window.__employees = window.__employees || [];
    UIC.Live.save({
      call: companyCall,
      action: 'add_employee',
      data: data,
      list: window.__employees,
      key: 'emp_id',
      draft: draft,
      render: renderEmployees,
      modal: 'employee-modal',
      message: 'تم الحفظ',
      queueable: false,
      reload: function () { fetchEmployees(true); },
      recordOf: function (resp) {
        if (!(resp && resp.record && resp.record.emp_id != null && resp.record.emp_id !== '')) return null;
        return Object.assign({}, draft, resp.record);
      }
    }).catch(function () { /* UIC.Live has toasted and rolled back */ });
  }

  function showError(e) {
    var body = document.getElementById('employee-content');
    if (body) body.innerHTML = '<div class="empty-state"><span>' + esc(e.message || 'خطأ') + '</span></div>';
  }

  /* Another device's change arrives quietly. */
  UIC.Live.watchPage({
    call: companyCall,
    page: 'tc_employee_reg',
    onChange: function () { UIC.Live.arrive(function () { fetchEmployees(true); }); }
  });
  /* [live-notice] the view on screen */
  UIC.Live.setView('list', { refresh: function () { fetchEmployees(true); } });

  load();
</script>
</body>
</html>
