<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>حالة الموظف</title>
  <?!= include('CSS_Tokens'); ?>
  <?!= include('UI_Components'); ?>
  <?!= include('Client_Helpers'); ?>
  <?!= include('Company_TopChemical_Nav'); ?>
  <?!= getCompanyThemeCSS_('3fe1b5cb67b7223e') ?>
</head>
<body>
<div id="tc-root" dir="rtl"></div>
<script>
  var params = new URLSearchParams(window.location.search);
  var SESSION_TOKEN = params.get('sessionToken') || (API.getSession() || {}).token || '';
  var scriptUrl = window.scriptUrl || '/';
  var IS_SUPER_ADMIN = <?!= user && user.isSuperAdmin ? 'true' : 'false' ?>;
  var COMPANY_LOGO_URL = '<?!= getCompanyLogoUrl_('3fe1b5cb67b7223e') ?>';
  var COMPANY_PAGES = <?!= companyPages ?>;
  var CURRENT_ACTION = '<?!= currentAction ?>';
  var USER_PAGES = <?!= user && user.isSuperAdmin ? 'null' : JSON.stringify((user && user.authorizedPages) || {}) ?>;
  var CAN_WRITE = UIC.canAdd_(); var CAN_FULL = UIC.canFull_();

  function companyCall(moduleAction, data) {
    return API.call('company_action', {
      target_system: '3fe1b5cb67b7223e',
      module_action: moduleAction,
      data: data || {}
    }, SESSION_TOKEN);
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function fmtDate(v) {
    if (v == null || v === '') return '';
    var d = (v instanceof Date) ? v : new Date(v);
    if (isNaN(d.getTime())) return String(v);
    var p = function (n) { return ('0' + n).slice(-2); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  function load() {
    var contentId = 'status-content';
    UIC.appShell('tc-root', {
      companyLogoUrl: COMPANY_LOGO_URL,
      companyLogoHref: scriptUrl + '?action=tc_dashboard&sessionToken=' + SESSION_TOKEN,
      companyLogoTitle: 'توب كيميكال',
      breadcrumb: 'توب كيميكال / شئون العاملين / حالة الموظف',
      contentId: contentId,
      menuGroups: (window.TOPCHEMICAL_MENU || [])
    });
    fetchStatus();
  }

  function fetchStatus() {
    UI.showSpinner([
      'جاري تحميل حالات الموظفين...',
      'جاري استرجاع بيانات وسجلات الموظفين...',
      'لحظة، جاري إعداد الجدول...'
    ]);
    companyCall('get_employee_status')
      .then(function (r) {
        window.__rows = r.rows || [];
        window.__empOptions = r.employee_options || [];
        window.__statusOptions = r.status_options || [];
        renderStatus try{schedulePrefetch();}catch(e){}();
      })
      .catch(function (e) { showError(e); })
      .finally(function () { UI.hideSpinner(); });
  }

  function renderStatus() {
    var rows = window.__rows.map(function (r) {
      return {
        employee_code: r.employee_code,
        employee_name: esc(r.employee_name || '-'),
        status_type: esc(r.status_type || '-'),
        status_date: fmtDate(r.status_date)
      };
    });
    var headers = [
      { key: 'employee_code', label: 'كود الموظف', numeric: true },
      { key: 'employee_name', label: 'الاسم' },
      { key: 'status_type', label: 'الحالة' },
      { key: 'status_date', label: 'تاريخ الحالة' }
    ];
    var body = document.getElementById('status-content');
    body.innerHTML = (CAN_WRITE
      ? '<div style="display:flex;justify-content:flex-end;margin-bottom:12px;"><button class="btn btn-primary" onclick="openAddModal()">+ تسجيل حالة</button></div>'
      : '') +
      UIC.dataTable('status-table', {
        title: 'حالات الموظفين',
        headers: headers,
        rows: rows,
        emptyText: 'لا توجد حالات'
      });
    UIC.initTableSort('status-table');
  }

  function openAddModal() {
    var body =
      '<form id="status-form">' +
      UIC.field({ key: 'employee_code', label: 'الموظف', type: 'select', required: true,
        options: window.__empOptions || [], placeholder: 'اختر الموظف...' }) +
      UIC.field({ key: 'status_type', label: 'الحالة', type: 'select', required: true,
        options: window.__statusOptions || [], placeholder: 'اختر الحالة...' }) +
      UIC.field({ key: 'status_date', label: 'تاريخ الحالة', type: 'date', required: true, value: fmtDate(new Date()) }) +
      '</form>';
    UIC.openModal('status-modal', {
      title: 'تسجيل حالة موظف',
      body: body,
      onSave: 'saveStatus()'
    });
  }

  function saveStatus() {
    if (!UIC.validateForm('status-form')) return Promise.reject();
    var data = UIC.collectForm('status-form');
    UI.showSpinner(['جاري تسجيل حالة الموظف...', 'لحظة، جاري تحديث القائمة...']);
    return companyCall('add_employee_status', data)
      .then(function (r) {
        UIC.closeModal('status-modal');
        UIC.toast((r && r.message) || 'تم الحفظ', 'success');
        if (r && r.record) {
          window.__rows = window.__rows || [];
          window.__rows.unshift(r.record);
          if (window.__rows.length>10) window.__rows=window.__rows.slice(0,10);
          renderStatus();
        } else { fetchStatus(); }
      })
      .catch(function (e) { UIC.toast((e && e.message) || 'خطأ', 'error'); })
      .finally(function () { UI.hideSpinner(); });
  }

  function showError(e) {
    var body = document.getElementById('status-content');
    if (body) body.innerHTML = '<div class="empty-state"><span>' + esc(e.message || 'خطأ') + '</span></div>';
  }

  load();
</script>
</body>
</html>
