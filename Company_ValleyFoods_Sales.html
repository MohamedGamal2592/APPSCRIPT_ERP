    function companyCall(moduleAction, data) {
      return API.call('company_action', {
        target_system: '9940659bd83035d7',
        module_action: moduleAction,
        data: data || {}
      }, SESSION_TOKEN);
    }
    function esc(v) {
      /* [UI-2.8 / U-36] Delegates to the shared formatter. This body used to
         carry its own replace-chain behind a `typeof FMT !== 'undefined'`
         guard, but Client_Helpers.html defines FMT in <head> before any page
         script runs, so that fallback was unreachable and the duplicate was
         pure drift risk. Output is identical for every input — proved in
         tools/verify/ui2_formatters.js. */
      return FMT.escape(v);
    }
    function num0(v) { var n = Number(v); return isNaN(n) ? 0 : n; }
    function todayStr() { return new Date().toISOString().slice(0, 10); }
    function fmtDate(v) {
      if (!v) return '-';
      var d = (v instanceof Date) ? v : new Date(v);
      if (isNaN(d.getTime())) return String(v);
      var p = function (n) { return n < 10 ? '0' + n : '' + n; };
      return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear();
    }
  </script>

    function renderApp() {
      UIC.appShell('vf-root', {
        companyLogoUrl: COMPANY_LOGO_URL,
        companyLogoHref: scriptUrl + '?action=vf_dashboard&sessionToken=' + SESSION_TOKEN,
        companyLogoTitle: 'Valley Foods',
        breadcrumb: I18N.t('vfSales.breadcrumb'),
        contentId: 'vf-sales-content',
        menuGroups: (window.VALLEYFOODS_MENU || [])
      });
      document.getElementById('vf-sales-content').innerHTML =
        '<div class="vf-card"><div class="vf-card-header"><h3>' + I18N.t('vfSales.cardTitle') + '</h3>' +
          (CAN_WRITE ? '<button class="btn btn-primary" id="sales-add-btn" onclick="SALES_PAGE.openAdd()">' + I18N.t('vfSales.addInvoice') + '</button>' : '') +
        '</div><div class="vf-card-body">' +
          '<div id="sales-filter"></div>' +
          '<div id="sales-view-toggle"></div>' +
          '<div id="sales-table"><p class="vf-text-muted" id="sales-loading">' + I18N.t('common.loading') + '</p></div>' +
        '</div></div>';
      bindStaticLabels();
      renderFilter();
      load();
    }

    /* Registered once, after the shell and the card exist: title, breadcrumb
       and the card's own labels. Flips rewrite these nodes in place. */
    function bindStaticLabels() {
      try {
        I18N.bind(document.querySelector('title'), 'vfSales.docTitle');
        I18N.bind(document.querySelector('#vf-root .breadcrumb'), 'vfSales.breadcrumb');
        var content = document.getElementById('vf-sales-content');
        if (content) I18N.bind(content.querySelector('.vf-card-header h3'), 'vfSales.cardTitle');
        I18N.bind(document.getElementById('sales-add-btn'), 'vfSales.addInvoice');
        I18N.bind(document.getElementById('sales-loading'), 'common.loading');
      } catch (e) {}
    }

    function renderFilter() {
      var host = document.getElementById('sales-filter');
      if (!host) return;
      host.innerHTML = UIC.dateRangeBar('sales-date', {
        from: DATE_FROM, to: DATE_TO,
        onchange: 'SALES_PAGE.applyDateFilter()',
        onclear: 'SALES_PAGE.clearDateFilter()'
      });
    }

    function applyDateFilter() {
      var v = UIC.dateRangeValues('sales-date');
      if (v.from && v.to && v.from > v.to) { UIC.toast(I18N.t('vfSales.invalidRange'), 'error'); return; }
      DATE_FROM = v.from; DATE_TO = v.to;
      renderFilter();
      load();
    }

    function clearDateFilter() { DATE_FROM = ''; DATE_TO = ''; renderFilter(); load(); }

    /* quiet: refresh in the background with no blocking overlay, for a
       user who has already seen the change and must not be interrupted
       to confirm it. */
    /* Latest-100 window by default; عرض الكل loads the full history.
       Serials are assigned server-side pre-paging, so they stay global.
       Unified UIC.dataTable view: built-in search, 50-row pager, truncated
       notice — replaces the forward-only PagedTable (last page is now
       directly reachable, so no jump button is needed). */
    var SHOW_ALL = false;
    var PAGE_WINDOW = 100;
    var LAST_TOTAL = 0;   /* exact filtered total of the last reply, for refresh */
    /* Phase B candidate (Plan_Fast_Pages_Production_Safe.md): one server-side
       latest-window request instead of count-then-page. FALSE as shipped, so
       the existing two-call sequence below is what runs until an owner turns
       it on. */
    var SALES_ONE_REQUEST_ = false;

    function load(quiet) {
      if (!quiet) UIC.readSkeleton();
      var container = document.getElementById('sales-table');
      if (!container) return;
      renderViewToggle();
      var base = { from: DATE_FROM, to: DATE_TO };
      var first;
      if (SALES_ONE_REQUEST_ && !SHOW_ALL) {
        first = companyCall('get_valley_sales_page', {
          mode: 'latest_window', limit: PAGE_WINDOW, from: DATE_FROM, to: DATE_TO
        });
      } else if (SHOW_ALL) {
        first = companyCall('get_valley_sales_page', base);
      } else {
        first = companyCall('get_valley_sales_page', { offset: 0, limit: 1, from: DATE_FROM, to: DATE_TO })
            .then(function (r0) {
              setRefs(r0);
              var total = Number(r0.total) || 0;
              var off = Math.max(0, total - PAGE_WINDOW);
              return companyCall('get_valley_sales_page', { offset: off, limit: PAGE_WINDOW, from: DATE_FROM, to: DATE_TO });
            });
      }
      first
        .then(function (r) {
          setRefs(r);
          /* The one-request reply already carries the bootstrap, so the
             deferred ensureBootstrap() below resolves without a second RPC. */
          if (SALES_ONE_REQUEST_ && (r && (r.parties || r.products || r.enums))) {
            __bootstrapPromise = Promise.resolve({
              parties: r.parties || [], products: r.products || [], enums: r.enums || {}
            });
          }
          renderInvoiceTable(r.invoices || []);
        })
        .catch(function (e) {
          container.innerHTML = '<div class="empty-state"><span>' + I18N.t('vfSales.loadFailed') + '</span></div>';
          /* Registered so a later flip relabels the failure text in place too. */
          I18N.bind(container.querySelector('.empty-state span'), 'vfSales.loadFailed');
          UIC.toast(I18N.t('common.errorPrefix') + ' ' + ((e && e.message) || e), 'error');
        })
        .finally(function () {
          if (!quiet) UI.hideSpinner();
          try{schedulePrefetch();}catch(e){} try{ensureBootstrap().catch(function(){});}catch(e){}
        });
    }

    function setRefs(r) {
      if (!r) return;
      if (r.parties) PARTIES = r.parties;
      if (r.products) PRODUCTS = r.products;
      if (r.enums) ENUMS = r.enums;
      if (r.total != null) LAST_TOTAL = Number(r.total) || 0;
    }

    function renderViewToggle() {
      var host = document.getElementById('sales-view-toggle');
      if (!host) return;
      host.innerHTML =
        '<div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px;">' +
          '<a class="btn btn-outline" target="_blank" rel="noopener" href="' + scriptUrl + '?action=vf_sales_report&sessionToken=' + encodeURIComponent(SESSION_TOKEN) + '">' + I18N.t('vfSales.report') + '</a>' +
          (SHOW_ALL ? '<button class="btn btn-outline" onclick="SALES_PAGE.showLatest()">' + I18N.t('vfSales.showLatest', { n: PAGE_WINDOW }) + '</button>' : '') +
        '</div>';
      /* Registered here, once per build: a flip rewrites this node in place. */
      I18N.bind(host.querySelector('a.btn'), 'vfSales.report');
    }

    function showAll() { SHOW_ALL = true; load(); }
    function showLatest() { SHOW_ALL = false; load(); }

    var LAST_INVOICES_ = [];   /* last raw reply, mapped straight into the rows below */

    /* [State fix] One source of truth for this list's columns: the immutable
       data key the dataTable has always used, plus the dictionary key that
       names it. The header builder and the in-place relabeler both read it, so
       a flip cannot desynchronise a column from its label. */
    var INVOICE_COLS_ = [
      { key: 'مسلسل', i18n: 'vfSales.col.serial', numeric: true },
      { key: '__col1', i18n: 'vfSales.col.invoiceNo' },
      { key: 'العميل', i18n: 'vfSales.col.customer', col: 'text' },
      { key: '__col3', i18n: 'vfSales.col.date' },
      { key: 'الصافي', i18n: 'vfSales.col.net', numeric: true },
      { key: 'الضريبة', i18n: 'vfSales.col.tax', numeric: true },
      { key: 'الإجمالي', i18n: 'vfSales.col.total', numeric: true },
      { key: 'الاعتماد', i18n: 'vfSales.col.approval', col: 'atom' },
      { key: '__col8', i18n: '' }
    ];

    var STATUS_COL_ = INVOICE_COLS_.map(function (c) { return c.key; }).indexOf('الاعتماد');

    function invoiceHeaders_() {
      return INVOICE_COLS_.map(function (c) {
        return { key: c.key, label: c.i18n ? I18N.t(c.i18n) : '', numeric: c.numeric, col: c.col };
      });
    }

    function colByKey_(key) {
      for (var i = 0; i < INVOICE_COLS_.length; i++) {
        if (INVOICE_COLS_[i].key === key) return INVOICE_COLS_[i];
      }
      return null;
    }

    /* The canonical approval value rides on the chip itself, so a flip maps it
       back through the dictionary without re-reading or re-classifying a row. */
    function statusPillHtml_(isApproved) {
      return UIC.statusPill(
        isApproved ? I18N.t('vfSales.status.approved') : I18N.t('vfSales.status.pending'),
        isApproved ? 'success' : 'neutral'
      ).replace('<span ', '<span data-approval="' + (isApproved ? 'Approved' : 'Pending') + '" ');
    }

    function renderInvoiceTable(invoices) {
      LAST_INVOICES_ = invoices || [];
      renderInvoiceRows(LAST_INVOICES_.map(mapInvoiceRow));
    }

    /* [i18n Stage B] Header identity is `h.key || h.label`, frozen to exactly
       what this table has always used — the Arabic label for the declared
       columns and the positional `__col<i>` dataTable assigns to the string
       ones — while the visible label resolves through I18N at render time.
       Sorting, filtering, classification and erp_cols_* prefs see no change. */
    function renderInvoiceRows(rows) {
      var container = document.getElementById('sales-table');
      if (!container) return;
      /* dataTable RETURNS html — it must be injected (PagedTable did
         host.innerHTML = UIC.dataTable(...); discarding it leaves the
         skeleton on screen forever). Inner id 'sales-dt' keeps every
         store/tbody/pager id unique. */
      container.innerHTML = UIC.dataTable('sales-dt', {
        /* [UI-9.1] العميل is the readable column of this list and its
           length varies by customer; declared text so it keeps a name's
           worth of room whichever page is on screen. الاعتماد is a status
           pill that inference reads as text and that needs an atom's width. */
        headers: invoiceHeaders_(),
        rows: rows,
        emptyText: (DATE_FROM || DATE_TO) ? I18N.t('vfSales.emptyRange') : I18N.t('vfSales.empty'),
        truncated: !SHOW_ALL,
        showAll: SHOW_ALL ? null : 'SALES_PAGE.showAll()'
      });
      try { UIC.initTableSort('sales-dt'); } catch (e) {}
    }

    function mapInvoiceRow(inv) {
            var isApproved = inv.approval_status === 'Approved';
            var actions = IS_SUPER_ADMIN ? UIC.actionBtns([
              { label: I18N.t('vfSales.action.print'), onclick: 'SALES_PAGE.print(\'' + esc(inv.invoice_unique_id) + '\')' },
              { label: isApproved ? I18N.t('vfSales.action.returnPending') : I18N.t('vfSales.action.approve'), onclick: 'SALES_PAGE.approve(\'' + esc(inv.invoice_unique_id) + '\')' },
              isApproved ? null : { label: I18N.t('common.edit'), onclick: 'SALES_PAGE.openEdit(\'' + esc(inv.invoice_unique_id) + '\')' },
              isApproved ? null : { label: I18N.t('common.delete'), color: '#dc2626', onclick: 'SALES_PAGE.remove(\'' + esc(inv.invoice_unique_id) + '\')' }
            ].filter(Boolean)) : '';
            var cells = [
              '<span class="num" data-num="' + (inv['مسلسل'] || 0) + '" style="color:var(--text-muted, #64748b);white-space:nowrap;">' + (inv['مسلسل'] || '-') + '</span>',
              '<b>' + esc(inv['رقم الفاتورة'] || '-') + '</b>',
              esc(partyLabel(inv['اسم العميل'])),
              fmtDate(inv['تاريخ الفاتورة']),
              '<span class="num" data-num="' + num0(inv['المبلغ الصافي']) + '">' + num0(inv['المبلغ الصافي']).toLocaleString('en-US', { minimumFractionDigits: 2 }) + '</span>',
              '<span class="num" data-num="' + num0(inv['قيمة الضريبة']) + '">' + num0(inv['قيمة الضريبة']).toLocaleString('en-US', { minimumFractionDigits: 2 }) + '</span>',
              '<span class="num" style="font-weight:700;color:#0e623b;" data-num="' + num0(inv['إجمالي']) + '">' + num0(inv['إجمالي']).toLocaleString('en-US', { minimumFractionDigits: 2 }) + '</span>',
              statusPillHtml_(isApproved),
              actions
            ];
            /* The canonical flag travels with the cached row (indexes are all
               the search and the pager see), so a flip can re-label the chip
               without re-parsing the stored markup. */
            cells._approved = isApproved;
            return cells;
    }

    function partyLabel(idRef) {
      var f = PARTIES.filter(function (o) { return String(o.value) === String(idRef); })[0];
      return f ? f.label : (idRef || '-');
    }

    /* ---------- ODOO-STYLE ENTRY MODAL ---------- */
    var DRAFT_LINES = [];
    var EDIT_UID = '';
    var EDIT_NO = '';             /* the invoice number shown in an edit title */
    var PARTY_CHIPS_UPDATE_ = null;   /* re-run by the language flip, values untouched */

    function openAdd() { DRAFT_LINES = []; openInvoiceModal(null); }

    /* The parties, products and enums a form needs are the same every time it
       opens, so they are fetched once and kept. Warmed while the user is still
       reading the list, which is what makes the form open with no round trip.
       A failure clears the memo so the next open retries rather than caching
       an error forever. */
    var __bootstrapPromise = null;
    function ensureBootstrap() {
      if (__bootstrapPromise) return __bootstrapPromise;
      __bootstrapPromise = companyCall('get_valley_sales_bootstrap')
        .catch(function (e) { __bootstrapPromise = null; throw e; });
      return __bootstrapPromise;
    }

    function openEdit(uid) {
      UIC.readSkeleton();
      Promise.all([
        ensureBootstrap(),
        companyCall('get_valley_invoice_full', { invoice_unique_id: uid })
      ])
        .then(function (res) {
          PARTIES = res[0].parties || [];
          PRODUCTS = res[0].products || [];
          ENUMS = res[0].enums || {};
          var inv = res[1].invoice;
          DRAFT_LINES = res[1].lines.map(function (l) {
            return {
              unique_id: l.unique_id,
              product_id: String(l.product_id),
              details: l.product_details || '',
              tax: Number(l.product_tax || 0),
              qty: Number(l.product_qty || 0),
              price: Number(l.product_price || 0),
              /* The server has always returned these; this mapper used to drop
                 them, so every strip reopened blank and the user was forced to
                 re-enter batches for EVERY line or the save was refused.
                 alloc_uid is deliberately not carried: the server matches a row
                 on (line uid, batch uid) and never needs the client to say
                 which row is which. */
              allocations: (l.allocations || []).map(function (a) {
                return { batch_uid: String(a.batch_uid || ''), lot: a.lot || '', qty: Number(a.qty || 0) };
              })
            };
          });
          openInvoiceModal(inv);
        })
        .catch(function (e) { UIC.toast((e && e.message) || I18N.t('vfSales.loadInvoiceFailed'), 'error'); })
        .finally(function () { UI.hideSpinner(); });
    }

    function partyFieldHtml(selected) {
      return UIC.combo({ key: 'f-party', label: I18N.t('vfSales.field.customer'), required: true, options: PARTIES, value: selected ? String(selected['اسم العميل'] || '') : '', placeholder: I18N.t('common.typeToSearch') });
    }
    function comboEnum(key, label, list, selected) {
      return UIC.combo({ key: key, label: label, required: true, options: (list || []).map(function (o) { return { value: o.value, label: o.label }; }), value: selected != null ? selected : '', placeholder: I18N.t('common.typeToSearch') });
    }

    function onQtyChange(i) {
      try { autoAllocSalesFifo_(i); } catch(e){}
      recalc();
    }

      var boxStyle = 'background:var(--bg-surface, #fff);border:1px solid var(--border-color, #e2e8f0);border-radius:8px;padding:10px 12px;min-width:130px;';
      var boxLabel = 'font-size:11px;font-weight:700;color:var(--text-muted, #64748b);margin-bottom:6px;';
      return '<tr id="line-' + i + '" data-idx="' + i + '">' +
        '<td colspan="5">' + UIC.combo({ key: 'ln-prod-' + i, label: I18N.t('vfSales.field.product'), required: true, options: prodOpts, value: ln.product_id ? String(ln.product_id) : '', placeholder: I18N.t('vfSales.searchProduct') }) + '</td>' +
        '<td style="vertical-align:top;padding-top:26px;white-space:nowrap;"><button type="button" class="btn btn-outline" style="font-size:12px;" onclick="SALES_PAGE.openAllocModal(' + i + ')">📦 <span data-i18n="vfSales.batches">' + I18N.t('vfSales.batches') + '</span> (<span id="alloc-btn-sum-' + i + '">0</span> / ' + (ln.qty || 0) + ')</button></td>' +
        '<td style="vertical-align:top;padding-top:26px;"><button class="btn btn-outline" style="padding:3px 10px;color:var(--danger, #dc2626);" onclick="SALES_PAGE.removeLine(' + i + ')">✕</button></td>' +
      '</tr>' +
      '<tr id="line-fields-' + i + '">' +
        '<td><div style="' + boxStyle + '"><div style="' + boxLabel + '" data-i18n="vfSales.field.details">' + I18N.t('vfSales.field.details') + '</div><input id="ln-details-' + i + '" class="input" type="text" value="' + esc(ln.details) + '" placeholder="' + I18N.t('common.optional') + '" data-i18n-ph="common.optional" style="width:100%;"></div></td>' +

        '<td><div style="' + boxStyle + '"><div style="' + boxLabel + '" data-i18n="vfSales.field.price">' + I18N.t('vfSales.field.price') + '</div><input id="ln-price-' + i + '" class="input" type="number" min="0" step="0.01" value="' + (ln.price !== '' ? ln.price : '') + '" oninput="SALES_PAGE.recalc()" style="width:100%;"></div></td>' +
        '<td><div style="' + boxStyle + '"><div style="' + boxLabel + '" data-i18n="vfSales.field.tax">' + I18N.t('vfSales.field.tax') + '</div>' + UIC.combo({ key: 'ln-tax-' + i, label: '', required: true, options: (ENUMS.line_tax || []).map(function (t) { return { value: t, label: (t * 100) + '%' }; }), value: String(ln.tax), placeholder: '%' }) + '</div></td>' +
        '<td colspan="3"><div style="' + boxStyle + '"><div style="' + boxLabel + '" data-i18n="vfSales.field.total">' + I18N.t('vfSales.field.total') + '</div><div class="num" style="font-weight:700;font-size:15px;direction:ltr;" id="ln-total-' + i + '">' + rowTotal.toLocaleString('en-US', { minimumFractionDigits: 2 }) + '</div></div></td>' +
      '</tr>' +
      /* P2: batch-allocation strip (hidden until product chosen) */
      '<tr id="alloc-row-' + i + '" style="display:none;"><td colspan="7" style="background:var(--bg-subtle, #f8fafc);padding:8px 14px;">' +
        '<div style="font-size:12px;font-weight:700;color:#166534;margin-bottom:6px;">📦 <span data-i18n="vfSales.allocHeading">' + I18N.t('vfSales.allocHeading') + '</span> <span class="num" data-i18n="vfSales.allocMustEqual" style="color:#94a3b8;font-weight:400;">' + I18N.t('vfSales.allocMustEqual') + '</span> — <span id="alloc-sum-' + i + '">0</span> / <span id="alloc-need-' + i + '">' + (ln.qty || 0) + '</span></div>' +
        '<div id="alloc-strip-' + i + '" style="color:#94a3b8;font-size:12px;" data-i18n="vfSales.allocPickProduct">' + I18N.t('vfSales.allocPickProduct') + '</div>' +

          comboEnum('f-class-schedule', I18N.t('vfSales.field.classSchedule'), ENUMS.class_schedule, inv ? Number(inv['نوع سلع الجدول (لايوجد 0/جدول أولا 1/جدول ثانيا 2)']) : 0) +
          comboEnum('f-class-statement', I18N.t('vfSales.field.classStatement'), ENUMS.class_statement, inv ? Number(inv['نوع البيان (سلعة 3/خدمة 4/تسويات 5)']) : 3) +
          comboEnum('f-class-goods', I18N.t('vfSales.field.classGoods'), ENUMS.class_goods, inv ? Number(inv['نوع السلعة (محلي 1/صادرات 2/آلات ومعدات 5/أجزاء آلات 6/إعفاءات 7)']) : 1) +

            '<div style="display:flex;gap:8px;">' +

        footer: false
      });

      var modal = document.getElementById('sales-modal');
      if (modal) { var box = modal.querySelector('.modal'); if (box) box.style.maxWidth = '1200px'; }

      /* footer action bar inside modal */
      var foot = document.createElement('div');
      foot.style.cssText = 'display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--border-color, #e5e7eb);';

        (isEdit ? '<button class="btn btn-outline" onclick="SALES_PAGE.print(EDIT_UID)">🖨️ <span data-i18n="vfSales.modalPrint">' + I18N.t('vfSales.modalPrint') + '</span></button>' : '') +
        (isEdit ? '<button class="btn btn-primary" onclick="UI.submitOnce(this, SALES_PAGE.save)">💾 <span data-i18n="vfSales.modalSaveEdit">' + I18N.t('vfSales.modalSaveEdit') + '</span></button>'
                : '<button class="btn btn-primary" onclick="UI.submitOnce(this, SALES_PAGE.save)">💾 <span data-i18n="vfSales.modalCreate">' + I18N.t('vfSales.modalCreate') + '</span></button>');

    function attachPartyAutoFill(inv) {
      var combo = document.getElementById('f-party');
      var chips = document.getElementById('party-chips');
      if (!combo || !chips) return;
      var update = function () {
        var val = getComboVal('f-party');
        var p = PARTIES.filter(function (o) { return String(o.value) === String(val); })[0];
        if (!p) { chips.textContent = '—'; return; }
        chips.innerHTML = I18N.t('vfSales.partyTaxId') + ': <b>' + esc(p.tax_id || '-') + '</b> &nbsp;·&nbsp; ' + I18N.t('vfSales.partyAddress') + ': <b>' + esc(p.address || '-') + '</b> &nbsp;·&nbsp; ' + I18N.t('vfSales.partyPhone') + ': <b>' + esc(p.phone || '-') + '</b>';
      };
      PARTY_CHIPS_UPDATE_ = update;
      if (inv) update(); /* pre-fill for edit */
      document.getElementById('f-party_display').addEventListener('input', update);
    }

    function checkboxField(key, label, checked, i18nKey) {
      return '<label style="display:flex;align-items:center;gap:8px;margin-top:22px;font-size:14px;">' +
        '<input type="checkbox" id="' + key + '"' + (checked ? ' checked' : '') + '> ' +
        (i18nKey ? '<span data-i18n="' + i18nKey + '">' + label + '</span>' : label) + '</label>';
    }

    /* Typed values live only in DOM inputs until save; a redraw from DRAFT_LINES
       would drop them. Sync back first — null-guarded so fresh builds are safe. */
    function syncDraftFromDom() {
      for (var i = 0; i < DRAFT_LINES.length; i++) {
        var ln = DRAFT_LINES[i];
        var pe = document.getElementById('ln-prod-' + i);
        if (pe) ln.product_id = pe.value || '';
        var de = document.getElementById('ln-details-' + i);
        if (de) ln.details = de.value || '';
        var qe = document.getElementById('ln-qty-' + i);
        if (qe) ln.qty = qe.value;
        var pre = document.getElementById('ln-price-' + i);
        if (pre) ln.price = pre.value || '';
        var te = document.getElementById('ln-tax-' + i);
        if (te && te.value !== '') ln.tax = te.value;
      }
    }

    function drawLines() {
      var tb = document.getElementById('lines-body');
      if (!tb) return;
      syncDraftFromDom();
      tb.innerHTML = DRAFT_LINES.map(function (_, i) { return lineRowHtml(i, DRAFT_LINES[i]); }).join('') ||
        '<tr><td colspan="7" style="text-align:center;color:#94a3b8;" data-i18n="vfSales.noLines">' + I18N.t('vfSales.noLines') + '</td></tr>';
      UIC.autoColumns('lines-table');
      /* re-fetch batches for every line that already has a product */
      for (var i = 0; i < DRAFT_LINES.length; i++) {
        var pc = document.getElementById('ln-prod-' + i);
        if (pc) pc.addEventListener('change', function () {
          var idx = parseInt(this.id.split('-').pop(), 10);
          onProductChange(idx);
        });
        if (DRAFT_LINES[i].product_id) loadBatches(i, DRAFT_LINES[i].product_id, DRAFT_LINES[i].allocations);
      }
      recalc();
    }

    function collectLines() {
      var out = [];
      for (var i = 0; i < DRAFT_LINES.length; i++) {
        var pidEl = document.getElementById('ln-prod-' + i);
        var qtyEl = document.getElementById('ln-qty-' + i);
        if (!pidEl || !qtyEl) continue;
        out.push({
          unique_id: DRAFT_LINES[i].unique_id || '',
          product_id: pidEl.value || '',
          details: (document.getElementById('ln-details-' + i) || {}).value || '',
          qty: qtyEl.value,
          price: (document.getElementById('ln-price-' + i) || {}).value || '',
          tax: getComboVal('ln-tax-' + i),
          allocations: collectAllocations(i)
        });
      }
      return out;
    }

    function getComboVal(key) {
      var el = document.getElementById(key);
      return el ? el.value : '';
    }

    function recalc() {
      var net = 0, taxV = 0;
      for (var i = 0; i < DRAFT_LINES.length; i++) {
        var qty = num0((document.getElementById('ln-qty-' + i) || {}).value);
        var price = num0((document.getElementById('ln-price-' + i) || {}).value);
        var tax = num0(getComboVal('ln-tax-' + i));
        var lineNet = qty * price;
        var lt = lineNet * tax;
        net += lineNet; taxV += lt;
        var cell = document.getElementById('ln-total-' + i);
        if (cell) cell.textContent = (lineNet + lt).toLocaleString('en-US', { minimumFractionDigits: 2 });
      }
      // global duplicate checks (no duplicate products / batches)
      var dupProd = hasDuplicateProducts_(DRAFT_LINES.map(function(_,i){
        var el=document.getElementById('ln-prod-'+i); return {product_id: el?el.value:''};
      }));
      var dupBatch = hasDuplicateBatches_();
      for (var a = 0; a < DRAFT_LINES.length; a++) {
        var sumEl = document.getElementById('alloc-sum-' + a);
        if (!sumEl) continue;
        var s2 = 0;
        for (var j2 = 0; ; j2++) {
          var qEl = document.getElementById('alloc-q-' + a + '-' + j2);
          if (!qEl) break;
          s2 += parseFloat(qEl.value) || 0;
        }
        sumEl.textContent = fmtNum2(s2);
        /* keep DRAFT in step with typed splits (the modal can close via ×/Escape,
           bypassing the تم button) and mirror the sum onto the line button */
        DRAFT_LINES[a].allocations = collectAllocations(a);
        var btnSum = document.getElementById('alloc-btn-sum-' + a);
        if (btnSum) btnSum.textContent = fmtNum2(s2);
        var need = num0((document.getElementById('ln-qty-' + a)||{}).value);
        var mismatch = Math.abs(s2 - need) > 0.0001 && need >= 0;
        sumEl.style.color = mismatch ? '#dc2626' : '#059669';
        // red shortage per line
        var shortEl = document.getElementById('alloc-shortage-' + a);
        if (shortEl) {
          var pid = (document.getElementById('ln-prod-'+a)||{}).value || '';
          var key = pid + '|' + (EDIT_UID || '');
          var batches = BATCH_CACHE[key] || [];
          var totalAvail = batches.reduce(function(s,b){ return s + (Number(b.available)||0); }, 0);
          if (need > totalAvail + 0.0001) {
            shortEl.style.display = '';
            shortEl.innerHTML = '<span style="color:var(--danger, #dc2626);font-weight:700;">⚠ ' + I18N.t('vfSales.shortageStock', { available: fmtNum2(totalAvail), shortage: fmtNum2(need - totalAvail) }) + '</span>';
          } else if (mismatch && s2 > 0) {
            shortEl.style.display = '';
            shortEl.innerHTML = '<span style="color:var(--danger, #dc2626);">⚠ ' + I18N.t('vfSales.allocMismatch', { sum: fmtNum2(s2), need: fmtNum2(need) }) + '</span>';
          } else if (dupBatch.dup) {
            shortEl.style.display = '';
            shortEl.innerHTML = '<span style="color:var(--danger, #dc2626);">⚠ ' + I18N.t('vfSales.dupBatchLine', { lot: esc(dupBatch.lot) }) + '</span>';
          } else {
            shortEl.style.display = 'none'; shortEl.innerHTML = '';
          }
        }
        // highlight product duplicate
        var prodEl = document.getElementById('ln-prod-' + a);
        if (prodEl) prodEl.style.borderColor = dupProd.dup ? '#dc2626' : '';
      }
      // footer duplicate warnings
      var footerDup = '';
      if (dupProd.dup) footerDup += '<span style="color:var(--danger, #dc2626);margin-left:12px;">⚠ ' + I18N.t('vfSales.dupProductFooter') + '</span>';
      if (dupBatch.dup) footerDup += '<span style="color:var(--danger, #dc2626);">⚠ ' + I18N.t('vfSales.dupBatchFooter') + '</span>';
      var total = net + taxV;
      document.getElementById('lines-footer').innerHTML =
        footerDup +
        '<span>' + I18N.t('vfSales.statNet') + ': <span style="direction:ltr;">' + net.toLocaleString('en-US', { minimumFractionDigits: 2 }) + '</span></span>' +
        '<span>' + I18N.t('vfSales.statTax') + ': <span style="direction:ltr;">' + taxV.toLocaleString('en-US', { minimumFractionDigits: 2 }) + '</span></span>' +
        '<span style="color:#166534;">' + I18N.t('vfSales.statTotal') + ': <span style="direction:ltr;font-size:17px;">' + total.toLocaleString('en-US', { minimumFractionDigits: 2 }) + ' ' + I18N.t('vfSales.egp') + '</span></span>';
    }

    function addLine() {
      DRAFT_LINES.push({ product_id: '', details: '', tax: 0, qty: '', price: '' });
      drawLines();
    }

    function removeLine(i) {
      syncDraftFromDom();
      DRAFT_LINES.splice(i, 1);
      drawLines();
    }

    function getVal_(id) { var el = document.getElementById(id); return el ? el.value : ''; }
    function readCheckbox(id) { var el = document.getElementById(id); return !!(el && el.checked); }

    function save() {
      if (!UIC.validateForm('sales-form')) return;
      var lines = collectLines();
      // client-side duplicate guards (mirror server)
      var dupP = hasDuplicateProducts_(lines);
      if (dupP.dup) { UIC.toast(I18N.t('vfSales.dupProduct'), 'error'); return; }
      var dupB = hasDuplicateBatches_();
      if (dupB.dup) { UIC.toast(I18N.t('vfSales.dupBatch', { lot: dupB.lot || dupB.batch }), 'error'); return; }
      // shortage check: any line need > totalAvail
      for (var si = 0; si < lines.length; si++) {
        var pidS = String(lines[si].product_id || '').trim();
        if (!pidS) continue;
        var keyS = pidS + '|' + (EDIT_UID || '');
        var batchesS = BATCH_CACHE[keyS] || [];
        var totalAvailS = batchesS.reduce(function(s,b){ return s + (Number(b.available)||0); }, 0);
        var needS = Number(lines[si].qty || 0);
        if (needS > totalAvailS + 0.0001) { UIC.toast(I18N.t('vfSales.shortageLine', { line: si + 1, available: fmtNum2(totalAvailS) }), 'error'); return; }
      }
      var payload = {
        invoice_unique_id: EDIT_UID || '',
        party: getComboVal('f-party'),
        date: getVal_('f-date'),
        tax_system: readCheckbox('f-tax-system'),
        class_tax: getComboVal('f-class-tax'),
        class_schedule: getComboVal('f-class-schedule'),
        class_statement: getComboVal('f-class-statement'),
        class_goods: getComboVal('f-class-goods'),
        lines: lines
      };
      if (!payload.party) { UIC.toast(I18N.t('vfSales.pickCustomer'), 'error'); return; }
      UI.showSpinner();
      companyCall('save_valley_invoice', payload)
        .then(function (r) {
          UIC.closeModal('sales-modal');
          UIC.toast((r && r.message) || I18N.t('vfSales.saved'), 'success');
          load(true);
        })
        .catch(function (e) { UIC.toast((e && e.message) || I18N.t('vfSales.saveFailed'), 'error'); })
        .finally(function () { UI.hideSpinner(); });
    }

    function approve(uid) {
      UI.showSpinner();
      companyCall('approve_valley_invoice', { invoice_unique_id: uid })
        .then(function (r) { UIC.toast((r && r.message) || I18N.t('common.done'), 'success'); load(true); })
        .catch(function (e) { UIC.toast((e && e.message) || I18N.t('common.failed'), 'error'); })
        .finally(function () { UI.hideSpinner(); });
    }

    function removeInv(uid) {
      if (!confirm(I18N.t('vfSales.confirmDelete'))) return;
      UI.showSpinner();
      companyCall('delete_valley_invoice', { invoice_unique_id: uid })
        .then(function (r) { UIC.toast((r && r.message) || I18N.t('vfSales.deleted'), 'success'); load(true); })
        .catch(function (e) { UIC.toast((e && e.message) || I18N.t('vfSales.deleteFailed'), 'error'); })
        .finally(function () { UI.hideSpinner(); });
    }

    /* ---------- P2: BATCH ALLOCATION — FIFO auto-fill (advisory, mirrors MfgOrderView autoAllocFifo_) ---------- */
    var BATCH_CACHE = {};   /* key: pid|exclude → batches array */

    /* The allocations MUST sum to the line quantity to the last digit: the
       server refuses the save outside a 0.0001 tolerance, and it refuses any
       single allocation above its batch's available. The previous version
       pushed a rounded `take` but decremented `rem` by the UNROUNDED one, so
       the two could drift apart, and rounding half-up could push a quantity
       fractionally ABOVE the batch it came from. Now `rem` is decremented by
       exactly what was pushed, the batch that closes the line absorbs the whole
       residue, and a partial take is never rounded up past `available`. */
    function salesAllocFifo_(batches, qty) {
      var clean = function (n) { return Math.round(n * 1e6) / 1e6; };  /* kills float noise only */
      var rem = Number(qty || 0), out = [];
      for (var i = 0; i < batches.length && rem > 0.0000001; i++) {
        var avail = Number(batches[i].available) || 0; if (avail <= 0) continue;
        var take;
        if (rem <= avail) {
          take = rem;                 /* closes the line — takes the residue exactly */
        } else {
          take = clean(avail);
          if (take > avail) take = Math.floor(avail * 1e6) / 1e6;   /* never above available */
          if (take <= 0) continue;
        }
        out.push({ batch_uid: batches[i].batch_uid, lot: batches[i].lot, qty: take, unit_cost: batches[i].unit_cost || 0 });
        rem = clean(rem - take);
      }
      return { allocs: out, remaining: rem > 0.0000001 ? rem : 0 };
    }

    function autoAllocSalesFifo_(lineIdx) {
      var ln = DRAFT_LINES[lineIdx]; if (!ln) return;
      var pid = String(ln.product_id || '').trim(); if (!pid) return;
      var qty = Number((document.getElementById('ln-qty-' + lineIdx) || {}).value || ln.qty || 0);
      if (!qty || qty <= 0) return;
      var key = pid + '|' + (EDIT_UID || '');
      var batches = BATCH_CACHE[key] || [];
      if (!batches.length) return;
      // advisory: respect per-line checkbox (default ON)
      var autoCb = document.getElementById('fifo-auto-' + lineIdx);
      if (autoCb && !autoCb.checked) return;
      var res = salesAllocFifo_(batches, qty);
      // fill inputs (overwrites previous manual values for this line only)
      for (var bi = 0; bi < batches.length; bi++) {
        var inp = document.getElementById('alloc-q-' + lineIdx + '-' + bi);
        if (!inp) continue;
        var found = null;
        for (var k = 0; k < res.allocs.length; k++) { if (res.allocs[k].batch_uid === batches[bi].batch_uid) { found = res.allocs[k]; break; } }
        inp.value = found ? found.qty : '';
      }
    }

    function allocateAllSalesFifo_() {
      for (var i = 0; i < DRAFT_LINES.length; i++) autoAllocSalesFifo_(i);
      recalc();
      UIC.toast(I18N.t('vfSales.fifoDone'), 'success');
    }

    function hasDuplicateProducts_(lines) {
      var seen = {};
      for (var i = 0; i < lines.length; i++) {
        var pid = String(lines[i].product_id || '').trim(); if (!pid) continue;
        if (seen[pid]) return { dup: true, pid: pid, idx: i };
        seen[pid] = true;
      }
      return { dup: false };
    }

    function hasDuplicateBatches_() {
      var seen = {};
      for (var i = 0; i < DRAFT_LINES.length; i++) {
        var allocs = collectAllocations(i);
        for (var j = 0; j < allocs.length; j++) {
          var buid = String(allocs[j].batch_uid || '').trim(); if (!buid) continue;
          if (seen[buid]) return { dup: true, batch: buid, lot: allocs[j].lot || buid, line: i };
          seen[buid] = true;
        }
      }
      return { dup: false };
    }

    function onProductChange(i) {
      var el = document.getElementById('ln-prod-' + i);
      var pid = el ? el.value : '';
      DRAFT_LINES[i].product_id = pid;
      DRAFT_LINES[i].allocations = [];
      if (!pid) {
        document.getElementById('alloc-row-' + i).style.display = 'none';
        recalc();
        return;
      }
      loadBatches(i, pid, null);
    }

    function loadBatches(i, pid, prefill) {
      var strip = document.getElementById('alloc-strip-' + i);
      var rowEl = document.getElementById('alloc-row-' + i);
      if (!strip || !rowEl) return;
      /* the home row stays hidden while its strip lives in the modal */
      if (ALLOC_MODAL_LINE !== i) rowEl.style.display = '';
      var key = pid + '|' + (EDIT_UID || '');
      strip.innerHTML = '<span data-i18n="vfSales.loadingBatches">' + I18N.t('vfSales.loadingBatches') + '</span>';
      var build = function () {
        var hasPrefill = !!(prefill && prefill.length);
        renderAllocStrip(i, pid, prefill || []);
        // advisory auto-fill: trigger on qty/product choice when no prefill (new line)
        if (!hasPrefill) {
          try { autoAllocSalesFifo_(i); recalc(); } catch(e){}
        }
      };
      if (BATCH_CACHE[key]) { setTimeout(build, 0); }
      else {
        companyCall('get_valley_product_batches', { product_id: pid, invoice_uid: EDIT_UID })
          .then(function (r) {
            BATCH_CACHE[key] = r.batches || [];
            build();
          })
          .catch(function (e) { strip.innerHTML = '<span style="color:red;">' + esc(e.message || I18N.t('common.error')) + '</span>'; });
      }
    }

    function renderAllocStrip(i, pid, prefill) {
      var key = pid + '|' + (EDIT_UID || '');
      var batches = BATCH_CACHE[key] || [];
      var strip = document.getElementById('alloc-strip-' + i);
      if (!strip) return;
      if (!batches.length) {
        strip.innerHTML = '<span style="color:#d97706;" data-i18n="vfSales.noBatches">' + I18N.t('vfSales.noBatches') + '</span>';
        return;
      }
      var alloc = {};
      (prefill || []).forEach(function (a) { alloc[a.batch_uid] = a.qty; });
      DRAFT_LINES[i].allocations = (prefill || []).map(function (a) { return { batch_uid: a.batch_uid, lot: a.lot || '', qty: Number(a.qty || 0) }; });

      var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">' +
        '<span style="font-size:12px;color:#166534;" data-i18n="vfSales.fifoOrdered">' + I18N.t('vfSales.fifoOrdered') + '</span>' +
        '<label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;"><input type="checkbox" id="fifo-auto-' + i + '" checked> <span data-i18n="vfSales.fifoAuto">' + I18N.t('vfSales.fifoAuto') + '</span></label>' +
        '</div>' +
        '<div class="table-wrap"><table class="table" style="margin:0;"><thead><tr><th data-i18n="vfSales.thBatch">' + I18N.t('vfSales.thBatch') + '</th><th data-i18n="vfSales.thAvailable">' + I18N.t('vfSales.thAvailable') + '</th><th style="width:140px;" data-i18n="vfSales.thBatchQty">' + I18N.t('vfSales.thBatchQty') + '</th></tr></thead><tbody>';
      batches.forEach(function (b, bi) {
        var preQ = alloc[b.batch_uid] || 0;
        html += '<tr>' +
          '<td><b>' + esc(b.lot) + '</b> <span style="color:#94a3b8;font-size:11px;">(' + esc(b.unit || '-') + ')</span></td>' +
          '<td class="num" data-num="' + b.available + '">' + fmtNum2(b.available) + '</td>' +
          '<td><input id="alloc-q-' + i + '-' + bi + '" class="input" type="number" min="0" step="0.01" max="' + b.available + '" value="' + (preQ || '') + '" data-buid="' + esc(b.batch_uid) + '" data-lot="' + esc(b.lot) + '" oninput="SALES_PAGE.recalc()" style="max-width:130px;direction:ltr;"></td>' +
        '</tr>';
      });
      html += '</tbody></table></div>' +
        '<div id="alloc-shortage-' + i + '" style="margin-top:6px;font-size:12px;display:none;"></div>';
      strip.innerHTML = html;
      UIC.autoColumns(strip);
    }

    function collectAllocations(i) {
      var out = [];
      for (var j = 0; ; j++) {
        var el = document.getElementById('alloc-q-' + i + '-' + j);
        if (!el) break;
        var q = parseFloat(el.value) || 0;
        if (q > 0) out.push({ batch_uid: el.getAttribute('data-buid'), lot: el.getAttribute('data-lot') || '', qty: q });
      }
      return out;
    }

    function fmtNum2(n) { return Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }

    /* ---------- P2b: BATCH MODAL — one line's batches in a popup ----------
       The strip node is MOVED into the modal (ids stay unique, inputs keep
       focus/values); تم syncs it back home. recalc() already syncs every
       keystroke into DRAFT, so ×/Escape/swipe can never lose typed splits. */
    var ALLOC_MODAL_LINE = -1;
    var ALLOC_MODAL_LABEL = '';   /* product/line name shown in the alloc title */

    function openAllocModal(i) {
      var ln = DRAFT_LINES[i];
      if (!ln) return;
      var pidEl = document.getElementById('ln-prod-' + i);
      var pid = pidEl ? pidEl.value : (ln.product_id || '');
      if (!pid) { UIC.toast(I18N.t('vfSales.pickProductCmb'), 'error'); return; }
      ln.product_id = pid;
      var prodLabel = I18N.t('vfSales.lineNo', { n: i + 1 });
      for (var p = 0; p < PRODUCTS.length; p++) {
        if (String(PRODUCTS[p].value) === String(pid)) { prodLabel = PRODUCTS[p].label; break; }
      }
      ALLOC_MODAL_LINE = i;
      ALLOC_MODAL_LABEL = prodLabel;
      UIC.openModal('alloc-modal', {
        title: I18N.t('vfSales.allocTitle', { name: prodLabel }),
        body: '<div id="alloc-modal-host"></div>',
        footer: '<button class="btn btn-primary" onclick="SALES_PAGE.closeAllocModal(' + i + ')" data-i18n="vfSales.doneMark">' + I18N.t('vfSales.doneMark') + '</button>'
      });
      var host = document.getElementById('alloc-modal-host');
      var strip = document.getElementById('alloc-strip-' + i);
      if (host && strip) host.appendChild(strip);
      loadBatches(i, pid, (ln.allocations && ln.allocations.length) ? ln.allocations : null);
    }

    function closeAllocModal(i) {
      if (DRAFT_LINES[i]) DRAFT_LINES[i].allocations = collectAllocations(i);
      var home = document.getElementById('alloc-row-' + i);
      var strip = document.getElementById('alloc-strip-' + i);
      if (home && strip) {
        var cell = home.getElementsByTagName('td')[0];
        if (cell) cell.appendChild(strip);
      }
      ALLOC_MODAL_LINE = -1;
      UIC.closeModal('alloc-modal');
      recalc();
    }

    function printInvoice(uid) {
      if (!uid) { UIC.toast(I18N.t('vfSales.saveFirst'), 'error'); return; }
      var url = scriptUrl + '?action=vf_sales_print&invoice_unique_id=' + encodeURIComponent(uid) +
        '&sessionToken=' + encodeURIComponent(SESSION_TOKEN);
      window.open(url, '_blank');
    }

    /* ---------- [i18n Stage B] label-only language updates ----------
       A flip touches label text and label attributes ONLY. It neither rebuilds
       nor replaces the table, the filter bar, the view toggle or an input, so
       focus, caret, typed values, search term, sort order, page, selection,
       grouping and the scroll container all survive untouched. No load(),
       ensureBootstrap, API.call, renderApp, renderInvoiceTable, renderFilter,
       renderViewToggle or navigation call may appear below — see relabelPage. */
    var __i18nOff = null;

    function relabelMarkers(root) {
      var nodes = root.querySelectorAll('[data-i18n]');
      for (var i = 0; i < nodes.length; i++) nodes[i].textContent = I18N.t(nodes[i].getAttribute('data-i18n'));
      var phs = root.querySelectorAll('[data-i18n-ph]');
      for (var j = 0; j < phs.length; j++) phs[j].setAttribute('placeholder', I18N.t(phs[j].getAttribute('data-i18n-ph')));
    }

    /* Replace a label's own text node so a required marker or an icon inside
       the same element survives. */
    function setLabelText(el, text) {
      if (!el) return;
      var nodes = el.childNodes;
      for (var i = 0; i < nodes.length; i++) {
        if (nodes[i].nodeType === 3) { nodes[i].nodeValue = text + ' '; return; }
      }
      el.insertBefore(document.createTextNode(text + ' '), el.firstChild);
    }

    /* Combo and plain fields are addressed by their own data-field key, so a
       new line (ln-prod-7) is covered without registering anything per open.
       The tax combo is absent on purpose: its own label is empty and the box
       above it carries the "الضريبة" label as a marker. */
    var FIELD_LABELS_ = [
      { field: 'f-party', label: 'vfSales.field.customer', ph: 'common.typeToSearch' },
      { field: 'f-date', label: 'vfSales.field.date', ph: null },
      { field: 'f-class-tax', label: 'vfSales.field.classTax', ph: 'common.typeToSearch' },
      { field: 'f-class-schedule', label: 'vfSales.field.classSchedule', ph: 'common.typeToSearch' },
      { field: 'f-class-statement', label: 'vfSales.field.classStatement', ph: 'common.typeToSearch' },
      { field: 'f-class-goods', label: 'vfSales.field.classGoods', ph: 'common.typeToSearch' },
      { field: 'ln-prod', label: 'vfSales.field.product', ph: 'vfSales.searchProduct' }
    ];

    function relabelFields(root) {
      var fields = root.querySelectorAll('.form-field[data-field]');
      for (var i = 0; i < fields.length; i++) {
        var key = fields[i].getAttribute('data-field') || '';
        var base = key.replace(/-\d+$/, '');
        for (var m = 0; m < FIELD_LABELS_.length; m++) {
          if (FIELD_LABELS_[m].field !== base) continue;
          setLabelText(fields[i].querySelector('.form-label'), I18N.t(FIELD_LABELS_[m].label));
          if (FIELD_LABELS_[m].ph) {
            var input = document.getElementById(key + '_display');
            if (input) input.setAttribute('placeholder', I18N.t(FIELD_LABELS_[m].ph));
          }
          break;
        }
      }
    }

    function relabelModal() {
      var root = document.getElementById('sales-modal');
      if (root) {
        var title = root.querySelector('.modal-header h3');
        if (title) title.textContent = EDIT_UID
          ? I18N.t('vfSales.modalEditTitle', { no: EDIT_NO })
          : I18N.t('vfSales.modalAddTitle');
        relabelMarkers(root);
        relabelFields(root);
        if (PARTY_CHIPS_UPDATE_) { try { PARTY_CHIPS_UPDATE_(); } catch (e) {} }
        try { recalc(); } catch (e) {}
      }
      var alloc = document.getElementById('alloc-modal');
      if (alloc) {
        var aTitle = alloc.querySelector('.modal-header h3');
        if (aTitle) aTitle.textContent = I18N.t('vfSales.allocTitle', { name: ALLOC_MODAL_LABEL });
        relabelMarkers(alloc);
      }
    }

    /* [State fix] The table is relabelled where it stands: header label spans,
       the mobile data-label attributes on the current rows and the status
       chips. The row nodes, the search input, the pager and the sort listeners
       are never replaced, so nothing that holds focus or view state moves. */
    function relabelTable() {
      var box = document.getElementById('sales-table');
      if (!box) return;
      var wrap = document.getElementById('sales-dt');
      if (!wrap) {   /* empty reply: no table node, only the empty state */
        var title = box.querySelector('.empty-state-title');
        if (title) title.textContent = (DATE_FROM || DATE_TO) ? I18N.t('vfSales.emptyRange') : I18N.t('vfSales.empty');
        return;
      }
      var ths = wrap.querySelectorAll('thead th[data-key]');
      var rows = wrap.querySelectorAll('tbody tr');
      for (var i = 0; i < ths.length; i++) {
        var col = colByKey_(ths[i].getAttribute('data-key'));
        var label = (col && col.i18n) ? I18N.t(col.i18n) : '';
        /* data-key, aria-sort, tabindex and the sort listeners stay put. */
        var span = ths[i].querySelector('.th-label');
        if (span) span.textContent = label;
        for (var r = 0; r < rows.length; r++) {
          var cell = rows[r].children[i];
          if (!cell) continue;
          if (label) cell.setAttribute('data-label', label);
          else cell.removeAttribute('data-label');
        }
      }
      var chips = wrap.querySelectorAll('[data-approval]');
      for (i = 0; i < chips.length; i++) {
        chips[i].textContent = I18N.t(
          chips[i].getAttribute('data-approval') === 'Approved'
            ? 'vfSales.status.approved' : 'vfSales.status.pending');
      }
      syncStoreLabels();
    }

    /* Sorting, searching and paging re-render the body from the store's cached
       row HTML and its header labels, so those two label sources are refreshed
       as well. Strings and the canonical flag only — no order, page or
       selection changes. Header labels are resolved by key, so a column hidden
       at flip time is still correct when it is shown again. */
    function syncStoreLabels() {
      var st = (window.__dtStore || {})['sales-dt'];
      if (!st) return;
      var i;
      for (i = 0; i < st.headers.length; i++) {
        var col = colByKey_(st.headers[i].key);
        if (col) st.headers[i].label = col.i18n ? I18N.t(col.i18n) : '';
      }
      var rows = st.originalRows || [];
      for (i = 0; i < rows.length; i++) {
        var row = rows[i];
        if (row && typeof row._approved === 'boolean') row[STATUS_COL_] = statusPillHtml_(row._approved);
      }
    }

    /* عرض الأحدث carries a {n} parameter, so it is not a static bind: its one
       node is re-labelled where it stands. The report link is bound by
       renderViewToggle and covered by I18N.apply above. */
    function relabelViewToggle() {
      var host = document.getElementById('sales-view-toggle');
      if (!host) return;
      var btn = host.querySelector('button.btn');
      if (btn) btn.textContent = I18N.t('vfSales.showLatest', { n: PAGE_WINDOW });
    }

    function relabelPage() {
      if (!window.I18N || !I18N.ENABLED) return;
      try { I18N.apply(); } catch (e) {}
      /* In-place only: no table, filter-bar, view-toggle or modal builder runs
         here, so no typed value, caret, search, sort, page, selection or
         scroll position can be disturbed. */
      try { relabelTable(); } catch (e) {}
      try { relabelViewToggle(); } catch (e) {}
      try { relabelModal(); } catch (e) {}
    }

    function initI18nPage() {
      if (!window.I18N || !I18N.ENABLED) return;
      __i18nOff = I18N.onChange(relabelPage);
      window.addEventListener('beforeunload', disposeI18nPage);
    }

    function disposeI18nPage() {
      if (__i18nOff) { try { __i18nOff(); } catch (e) {} __i18nOff = null; }
    }

    window.SALES_PAGE = {
      openAdd: openAdd, openEdit: openEdit, save: save, approve: approve, remove: removeInv,
      addLine: addLine, removeLine: removeLine, recalc: recalc, onQtyChange: onQtyChange, allocateAllFifo: allocateAllSalesFifo_,
      openAllocModal: openAllocModal, closeAllocModal: closeAllocModal,
      print: printInvoice,
      showAll: showAll, showLatest: showLatest,
      applyDateFilter: applyDateFilter, clearDateFilter: clearDateFilter,
      disposeI18n: disposeI18nPage
    };

    /* Another device's change to this page arrives on its own. The poll
       reads timestamps from cache, never a spreadsheet, and stands down
       while the tab is hidden or a save is in flight. */
    document.addEventListener('DOMContentLoaded', function () {
      UIC.Live.watchPage({
        call: companyCall,
        page: 'vf_sales',
        onChange: function () { UIC.Live.arrive(function () { load(true); }); }
      });
      /* [live-notice] the view on screen */
      UIC.Live.setView('list', { refresh: function () { load(true); } });
    });

    /* Phase B2: the shared refresh control for THIS list only. The loader
       re-fetches the table's current query — the latest window, or the full
       history while عرض الكل is active — and the shared component restores
       search, sort, page, selection and scroll afterwards. It never reloads the
       document, reruns the shell, or touches the other cards on the page. */
    if (window.UIC && UIC.TableRefresh) {
      UIC.TableRefresh.register('sales-dt', {
        load: function () {
          if (SHOW_ALL) return companyCall('get_valley_sales_page', { from: DATE_FROM, to: DATE_TO });
          if (SALES_ONE_REQUEST_) {
            return companyCall('get_valley_sales_page', { mode: 'latest_window', limit: PAGE_WINDOW, from: DATE_FROM, to: DATE_TO });
          }
          var off = Math.max(0, (LAST_TOTAL || 0) - PAGE_WINDOW);
          return companyCall('get_valley_sales_page', { offset: off, limit: PAGE_WINDOW, from: DATE_FROM, to: DATE_TO });
        },
        apply: function (r) {
          setRefs(r);
          renderInvoiceTable((r && r.invoices) || []);
        },
        /* Preserve open forms and pending saves: refresh is deferred while a
           save is in flight or an entry modal is open. */
        blocked: function () {
          try {
            if (typeof UIC.Live !== 'undefined' && UIC.Live.busy && UIC.Live.busy()) {
              return I18N.t('vfSales.busyHold');
            }
            if (document.querySelector('.modal-backdrop, .uic-modal, [data-modal-open="true"]')) {
              return I18N.t('vfSales.closeFormFirst');
            }
          } catch (e) {}
          return null;
        }
      });
    }

    document.addEventListener('DOMContentLoaded', function () { renderApp(); initI18nPage(); });
  })();
  </script>
</body>
